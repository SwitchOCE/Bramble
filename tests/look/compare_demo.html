<!doctype html>
<!-- The compare tool's demo page: tests/look/compare_demo.tscn drawn as plain rectangles, at the
     project's design size (1920x1080). ?corner=wrong replaces the badge in the top right corner
     with a different element (a teal disc), the case a whole-screen average hides.
     tools/look/compare_demo.py compares the scene with both. -->
<html>
<head>
<meta charset="utf-8">
<title>Compare demo</title>
<style>
html, body { margin: 0; overflow: hidden; background: #1e2838; }
div { position: absolute; }
#badge.wrong { background: #1a7f7f !important; border-radius: 50%; }
</style>
</head>
<body>
<div id="header" style="left:0px;top:0px;width:1920px;height:120px;background:#2f3b52"></div>
<div id="panel" style="left:510px;top:300px;width:900px;height:480px;background:#c9a24a"></div>
<div id="carda" style="left:540px;top:840px;width:240px;height:180px;background:#7a3b3b"></div>
<div id="cardb" style="left:840px;top:840px;width:240px;height:180px;background:#3b7a4a"></div>
<div id="cardc" style="left:1140px;top:840px;width:240px;height:180px;background:#3b4f7a"></div>
<div id="badge" style="left:1755px;top:30px;width:120px;height:120px;background:#e0d8c0"></div>
<script>
if (new URLSearchParams(location.search).get("corner") === "wrong") {
  document.getElementById("badge").classList.add("wrong");
}
</script>
</body>
</html>
