<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bramble Result Mock-up</title>
<link rel="stylesheet" href="menus.css">
<link rel="stylesheet" href="stage.css">
<!-- The result screen: your place, the eight places, Play again and Quit. -->
</head>
<body>
<div class="bar"><h1>Result screen</h1><div class="note">Plain: your place, then all eight, best first, with each player's Health at the end. Your row has the leaderboard's pale ring. Stand-in names and numbers.</div></div>
<div id="box"><div id="stage"></div></div>
<script src="stage.js"></script>
<script src="menus.js"></script>
<script>
const ORDER = [2, 4, 0, 1, 3, 5, 6, 7];
const HP = [12, 0, 0, 0, 0, 0, 0, 0];
begin(st => {
  backdrop(st);
  pane(st, 560, 90, 800, 900);
  title(st, "You placed 3rd", 960, 125, 56);
  title(st, "Round 14", 960, 200, 22, "#c9bda6");
  ORDER.forEach((who, i) => {
    const y = 250 + i * 74, you = who === 0;
    const pl = html(`<div class="lb"><div class="pl">${i + 1}</div></div>`);
    st.append(pl); place(pl.firstChild, 636, y + 20);
    port(st, PLAYERS[who][0], 680, y, 60, you);
    st.append(place(html(`<div class="lbl" style="font-size:28px${you ? ";color:var(--go)" : ""}">${PLAYERS[who][1]}</div>`), 764, y + 12));
    const hp = html(`<div class="lb"><div class="hp">${HP[i]}</div></div>`);
    st.append(hp); place(hp.firstChild, 1240, y + 14);
  });
  button(st, "Play again", 640, 880, 300);
  button(st, "Quit", 980, 880, 300);
  st.append(html(`<div id="vig"></div>`));
});
</script>
</body>
</html>
