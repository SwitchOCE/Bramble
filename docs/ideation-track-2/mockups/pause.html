<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bramble Pause Mock-up</title>
<link rel="stylesheet" href="menus.css">
<link rel="stylesheet" href="stage.css">
<!-- The pause panel (Escape) over the game, and the fight's skip hint (?panel=hint). -->
</head>
<body>
<div class="bar"><h1>Pause panel and fight hint</h1><div class="note">Escape opens the pause panel over whatever is showing. During a fight a small line under the board says how to skip. Shown here over the bare window.</div></div>
<div id="box"><div id="stage"></div></div>
<script src="stage.js"></script>
<script src="menus.js"></script>
<script>
const panel = new URLSearchParams(location.search).get("panel") || "pause";
begin(st => {
  backdrop(st);
  if (panel === "hint") {
    title(st, "Space or click to skip", 960, 1040, 22, "#c9bda6");
    st.append(html(`<div id="vig"></div>`));
    return;
  }
  st.append(html(`<div id="vig"></div>`));
  st.append(html(`<div id="dim"></div>`));
  pane(st, 760, 330, 400, 420);
  title(st, "Paused", 960, 365, 48);
  button(st, "Resume", 810, 450, 300);
  button(st, "Quit to start", 810, 530, 300);
  button(st, "Quit", 810, 610, 300);
});
</script>
</body>
</html>
