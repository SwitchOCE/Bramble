<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folk Print · Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans+SC:wght@500;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="folk.css">
<style>
.mn { position: absolute; inset: 18px; border: 4px solid var(--fp-ink); border-radius: 22px; overflow: hidden; display: flex; align-items: stretch; justify-content: center; }
.mn::before { content: ''; position: absolute; inset: 10px; border: 3px solid var(--fp-red); border-radius: 14px; pointer-events: none; }
.mn-band { position: absolute; left: 0; right: 0; height: 26px; background: radial-gradient(circle, var(--fp-paper) 3px, transparent 3.6px) 0 0 / 18px 26px, var(--fp-ink); }
.mn-band.top { top: 0; } .mn-band.bot { bottom: 0; }
.mn-band::after { content: ''; position: absolute; left: 0; right: 0; height: 12px; background: radial-gradient(circle at 50% 0, var(--fp-ink) 8px, transparent 8.6px) 0 0 / 18px 12px repeat-x; }
.mn-band.top::after { top: 26px; }
.mn-band.bot::after { bottom: 26px; transform: scaleY(-1); }
.mn-side { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
.mn-side .fp-tree { height: 470px; width: auto; margin-bottom: 40px; }
.mn-niche { position: absolute; bottom: 52px; width: 150px; height: 190px; border: 4px solid var(--fp-ink); background: var(--fp-kraft); overflow: hidden;
  border-radius: 75px 75px 10px 10px / 64px 64px 10px 10px; box-shadow: 0 0 0 6px var(--fp-ochre), 0 0 0 9px var(--fp-ink), 6px 8px 0 9px var(--fp-ink); }
.mn-niche img { width: 100%; height: 100%; object-fit: cover; }
.mn-center { position: relative; z-index: 2; width: 460px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-top: 10px; }
/* title area: one replaceable block */
.mn-title { position: relative; width: 440px; height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.mn-title .mn-cart { position: absolute; inset: 0; }
.mn-title h1 { position: relative; margin: 0; font: 80px/1 var(--fp-display); color: var(--fp-paper); letter-spacing: .02em; -webkit-text-stroke: 0; text-shadow: 4px 5px 0 var(--fp-ink); }
.mn-title small { position: relative; margin-top: 6px; font: 800 16px/1 var(--fp-label); letter-spacing: .3em; color: var(--fp-ink); background: var(--fp-ochre); padding: 4px 12px; border: 2px solid var(--fp-ink); }
.mn-btns { display: grid; gap: 14px; width: 380px; margin-top: 8px; }
.mn-btns .fp-btn { height: 86px; font-size: 32px; }
.mn-btns .fp-btn-red { height: 100px; font-size: 42px; }
.mn-btns .fp-btn-red::before, .mn-btns .fp-btn-red::after { content: ''; width: 22px; height: 22px; background: var(--fp-ochre); border: 2.5px solid var(--fp-ink); transform: rotate(45deg); }
.mn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mn-foot { margin-top: 4px; font: 700 15px/1 var(--fp-label); letter-spacing: .16em; color: var(--fp-ash); }
.fp-phone .mn-center { width: 520px; }
.fp-phone .mn-btns { width: 440px; }
</style>
</head>
<body>
<div class="fp-stage"><div class="mn" id="mn"></div></div>
<script src="data.js"></script>
<script src="folk.js"></script>
<script>
FP.boot(() => {
  const P = '../../../folio/art/web/trials/ink-b-';
  // a scalloped papercut cartouche behind the (replaceable) title
  const cart = (() => {
    const n = 34, pts = [];
    for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n; pts.push(`${(220 + 214 * Math.cos(a)).toFixed(1)},${(95 + 88 * Math.sin(a)).toFixed(1)}`); }
    const sc = pts.map(p => { const [x, y] = p.split(','); return `<circle cx="${x}" cy="${y}" r="16" fill="var(--fp-ink)"/>`; }).join('');
    return `<svg class="mn-cart" viewBox="0 0 440 190">${sc}<ellipse cx="220" cy="95" rx="214" ry="88" fill="var(--fp-ink)"/>
      <ellipse cx="220" cy="95" rx="200" ry="76" fill="var(--fp-red)"/><ellipse cx="220" cy="95" rx="190" ry="67" fill="none" stroke="var(--fp-paper)" stroke-width="2.5" stroke-dasharray="3 7"/>
</svg>`;
  })();
  document.getElementById('mn').innerHTML = `
    <div class="mn-band top"></div><div class="mn-band bot"></div>
    <div class="mn-side">${FP.tree()}<div class="mn-niche"><img src="${P}fairy-hollowdeep.jpg" style="object-position:50% 28%" alt=""></div></div>
    <div class="mn-center">
      <div class="mn-title" data-replaceable="title">${cart}<h1>Bramble</h1><small>Code name</small></div>
      <div class="mn-btns">
        <button class="fp-btn fp-btn-red">Play</button>
        <div class="mn-row"><button class="fp-btn">Collection</button><button class="fp-btn">Standings</button></div>
        <div class="mn-row"><button class="fp-btn">Settings</button><button class="fp-btn fp-btn-ink">Quit</button></div>
      </div>
      <div class="mn-foot">Design lab · Folk Print · round 1</div>
    </div>
    <div class="mn-side">${FP.tree()}<div class="mn-niche"><img src="${P}squirrel-mosswood.jpg" style="object-position:50% 30%" alt=""></div></div>`;
});
</script>
</body>
</html>
