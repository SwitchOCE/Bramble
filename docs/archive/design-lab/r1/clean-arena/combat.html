<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Arena · Combat</title>
<link rel="stylesheet" href="arena.css">
<style>
  .stage { padding: .6rem 1rem; gap: .5rem; }
  .top { height: 3.6rem; display: flex; align-items: center; gap: .8rem; flex: none; }
  .phase { display: flex; align-items: baseline; gap: .6rem; }
  .phase b { font: 800 2.2rem/1 var(--cond); }
  .phase span { font: 700 1rem/1 var(--cond); letter-spacing: .14em; color: var(--health); }
  .vs { display: flex; align-items: center; gap: .6rem; margin-left: .6rem; }
  .vs .pill { height: 3.4rem; }
  .spacer { flex: 1; }
  .seg { display: flex; background: var(--slate); border: .14rem solid var(--rule); border-radius: .8rem; padding: .2rem; gap: .2rem; }
  .seg .btn { min-height: 3.8rem; min-width: 4.6rem; border: 0; font-size: 1.5rem; border-radius: .6rem; background: transparent; }
  .seg .btn.on { background: var(--chalk); color: var(--ink); }
  .top > .btn { min-height: 4.4rem; }
  .main { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 1.2rem; min-height: 0; }
  .arena { position: relative; display: flex; flex-direction: column; justify-content: center; gap: .5rem; font-size: .69rem; }
  .side-lab { display: flex; align-items: center; gap: .5em; font: 800 1.15em/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; }
  .side-lab.enemy { color: var(--health); } .side-lab.you { color: var(--moss); }
  .mid { display: flex; align-items: center; gap: .8em; color: var(--mist); font: 700 1em/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; padding: .2em 0; }
  .mid::before { content: ''; flex: 1; height: .14em; background: var(--rule); margin-left: 3em; }
  .board .rowlab { font-size: .9em; }
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: visible; }
  .dmg { position: absolute; z-index: 6; font: 800 4.6rem/1 var(--cond); color: var(--health); -webkit-text-stroke: .35rem var(--ink); paint-order: stroke fill; letter-spacing: -.02em; }
  .halve { position: absolute; z-index: 6; background: var(--nightshade); color: var(--ink); border-radius: .7rem; padding: .35rem .7rem; display: flex; align-items: center; gap: .5rem; font: 800 1.9rem/1 var(--cond); box-shadow: 0 0 0 .25rem var(--graphite); white-space: nowrap; }
  .halve small { font: 800 .85rem/1 var(--cond); letter-spacing: .12em; }
  .halve s { opacity: .55; }
  .panel { display: flex; flex-direction: column; gap: .6rem; min-width: 0; justify-content: center; }
  .box { background: var(--slate); border-radius: .9rem; padding: .7rem .9rem; }
  .duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .6rem; }
  .who { display: flex; align-items: center; gap: .6rem; min-width: 0; }
  .who .art { font-size: 1.1rem; width: 3.6rem; height: 3.6rem; }
  .who b { display: block; font: 800 1.35rem/1 var(--cond); text-transform: uppercase; }
  .who small { font: 600 .95rem/1.2 var(--cond); color: var(--mist); letter-spacing: .06em; }
  .who.r { flex-direction: row-reverse; text-align: right; }
  .arrow { color: var(--moss); font-size: 2rem; }
  .math { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: .4rem; text-align: center; }
  .math .v { background: var(--graphite); border-radius: .7rem; padding: .5rem .2rem .35rem; }
  .math .v b { display: block; font: 800 3.6rem/1 var(--cond); }
  .math .v small { font: 700 .82rem/1 var(--cond); letter-spacing: .12em; color: var(--mist); text-transform: uppercase; }
  .math .op { font: 800 1.2rem/1 var(--cond); padding: .35rem .45rem; border-radius: .5rem; color: var(--ink); letter-spacing: .06em; }
  .op.ns { background: var(--nightshade); } .op.hit { background: var(--health); }
  .v.end b { color: var(--health); }
  .log { display: flex; flex-direction: column; gap: .35rem; font: 500 1.02rem/1.3 var(--sans); }
  .log div { display: grid; grid-template-columns: 4.2rem 1fr; gap: .5rem; color: var(--mist); }
  .log div b { font: 800 .9rem/1.45 var(--cond); letter-spacing: .1em; text-transform: uppercase; }
  .log div.now { color: var(--chalk); }
  .log div.now b { color: var(--moss); }
  .log em { font-style: normal; color: var(--nightshade); font-weight: 700; }
  .log .d { color: var(--health); font-weight: 700; }
</style></head>
<body>
<div class="stage">
  <div class="top">
    <div class="phase"><b>COMBAT</b><span>ATTACK 2</span></div>
    <div class="vs" id="vs"></div>
    <div class="spacer"></div>
    <div class="seg" id="speed"></div>
    <div class="btn" id="skip"></div>
  </div>
  <div class="main">
    <div class="arena" id="arena"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>
<script src="data.js"></script><script src="arena.js"></script>
<script>
  const C = FX.combat, R = FX.recruit, ic = CA.icon;
  const opp = FX.lobby.find(p => p.name === C.opponent);
  document.getElementById('vs').innerHTML = `<span class="label">vs</span>` + CA.lobby([{...opp, next_opponent: false}]).replace('class="pill', 'style="border-color:var(--health)" class="pill').replace('<div class="lobby">', '<div class="lobby" style="display:flex">');
  document.getElementById('speed').innerHTML = `<div class="btn">${ic('play')}1×</div><div class="btn on">${ic('ff')}2×</div><div class="btn">${ic('ff')}4×</div>`;
  document.getElementById('skip').innerHTML = `${ic('skip')}Skip`;

  // Enemy board from the fixture; missing slots are empty.
  const fill = (row, ids) => ids.map(id => row.find(u => u.slot === id) || { slot: id, empty: true });
  const enemy = { front: fill(C.enemy_front, ['F1','F2','F3','F4']), back: fill(C.enemy_back, ['B1','B2','B3']) };
  // Your board: the recruit board, Belladonna Sprite added in B3, the Hornet Scout replaced by its Hornetling.
  const H = FX.hero_card, scout = R.board.back[0];
  const hornetling = { slot: 'B1', name: 'Hornetling', attack: 1, health: 1, tribe: scout.tribe, text: 'This attacks an enemy with Nightshade whenever there is one it can attack.' };
  const you = { front: R.board.front, back: [hornetling, R.board.back[1], { slot: 'B3', name: H.name, tier: H.tier, attack: H.attack, health: H.health, tribe: H.tribe, text: H.text }] };

  const before = 26, halved = Math.floor(before / 2), after = halved - hornetling.attack;
  document.getElementById('arena').innerHTML = `
    ${CA.board(enemy, { flip: true, cls: 'enemy', per: { F2: { cls: 'nightshade', hp: after, status: `<span class="status ns">${ic('berry')}Nightshade</span>` } } })}
    <div class="mid"><span class="side-lab enemy">▲ ${C.opponent}</span><span>You attack first</span><span class="side-lab you">▼ You</span></div>
    ${CA.board(you, { per: { B1: { cls: 'attacking', status: `<span class="status atk">${ic('attack')}Attacking</span>` } } })}
    <svg id="fx"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2BD17E"/></marker></defs></svg>`;

  const boar = C.enemy_front[0];
  document.getElementById('panel').innerHTML = `
    <div class="box duel">
      <div class="who"><div class="art" style="${CA.tribeVar(hornetling.tribe)}"><img src="${CA.PORTRAIT.Hornetling}" alt=""></div><div><b>Hornetling</b><small>B1 · 1/1 · summoned</small></div></div>
      <div class="arrow">${ic('attack')}</div>
      <div class="who r"><div class="art" style="${CA.tribeVar(boar.tribe)}"><img src="${CA.PORTRAIT['Tusker Boar']}" alt=""></div><div><b>${boar.name}</b><small>${boar.slot} · ${boar.attack}/${boar.health} · Nightshade</small></div></div>
    </div>
    <div class="box">
      <div class="label" style="margin-bottom:.5rem">Tusker Boar health, this attack</div>
      <div class="math">
        <div class="v"><b>${before}</b><small>before</small></div>
        <div class="op ns">½ NS</div>
        <div class="v"><b>${halved}</b><small>halved</small></div>
        <div class="op hit">−${hornetling.attack}</div>
        <div class="v end"><b>${after}</b><small>after hit</small></div>
      </div>
    </div>
    <div class="box log">
      <div><b>Start</b><span>Belladonna Sprite gives Tusker Boar <em>Nightshade</em>.</span></div>
      <div><b>Atk 1</b><span>Hornet Scout dies. Hornetling (1/1) is summoned in B1.</span></div>
      <div class="now"><b>Atk 2</b><span>Hornetling attacks Tusker Boar. <em>Nightshade</em> halves ${before} → ${halved}, then it takes <span class="d">${hornetling.attack}</span>: ${after} left.</span></div>
    </div>`;

  document.fonts.ready.then(() => {
    CA.drawTies();
    const A = document.getElementById('arena').getBoundingClientRect();
    const a = document.querySelector('.tok.attacking').getBoundingClientRect();
    const t = document.querySelector('.tok.nightshade').getBoundingClientRect();
    const fx = document.getElementById('fx');
    const x1 = a.left + a.width * .5 - A.left, y1 = a.top - A.top - 4, x2 = t.left + t.width * .1 - A.left, y2 = t.bottom - A.top + 10;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    fx.innerHTML += `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="#0F1214" stroke-width="16" stroke-linecap="round"/>
      <path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="#2BD17E" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 0" marker-end="url(#ah)"/>`;
    const arena = document.getElementById('arena');
    const h = document.createElement('div'); h.className = 'halve';
    h.innerHTML = `<small>½</small><s>${before}</s>→${halved}`;
    h.style.left = (t.right - A.left + 10) + 'px'; h.style.top = (t.top - A.top + t.height * .05) + 'px';
    const d = document.createElement('div'); d.className = 'dmg'; d.textContent = '−' + hornetling.attack;
    d.style.left = (t.right - A.left + 14) + 'px'; d.style.top = (t.top - A.top + t.height * .5) + 'px';
    arena.append(h, d);
  });
</script>
</body></html>
