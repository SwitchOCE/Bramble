<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Arena · Standings</title>
<link rel="stylesheet" href="arena.css">
<style>
  .stage { padding: .8rem 1.2rem; gap: .6rem; }
  .head { display: flex; align-items: center; gap: 1rem; height: 4.4rem; flex: none; }
  .head h1 { font: 800 2.4rem/1 var(--cond); text-transform: uppercase; }
  .head h1 span { color: var(--moss); }
  .head .spacer { flex: 1; }
  .main { flex: 1; display: grid; grid-template-columns: 1fr 22rem; gap: 1.2rem; min-height: 0; align-items: center; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 .25rem; }
  th { text-align: left; font: 700 .9rem/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--mist); padding: 0 .8rem .2rem; }
  td { background: var(--slate); height: 3.3rem; padding: 0 .8rem; vertical-align: middle; }
  td:first-child { border-radius: .7rem 0 0 .7rem; width: 3.6rem; font: 800 1.7rem/1 var(--cond); color: var(--mist); text-align: center; }
  td:last-child { border-radius: 0 .7rem .7rem 0; }
  .nm { font: 700 1.55rem/1 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
  .hpc { display: flex; align-items: center; gap: .8rem; }
  .hpc b { font: 800 2.2rem/1 var(--cond); width: 3rem; text-align: right; }
  .bar { flex: 1; height: .9rem; border-radius: .45rem; background: var(--graphite); overflow: hidden; min-width: 8rem; }
  .bar i { display: block; height: 100%; background: var(--health); border-radius: .45rem; }
  .hex { font-size: 1.35rem; background: var(--chalk); color: var(--ink); }
  .wl { display: inline-block; font: 800 1.05rem/1 var(--cond); letter-spacing: .1em; padding: .35rem .55rem; border-radius: .4rem; color: var(--ink); }
  .wl.won { background: var(--moss); } .wl.lost { background: var(--health); }
  tr.you td { background: #1D2A24; } tr.you td:first-child { box-shadow: inset .35rem 0 0 var(--moss); color: var(--moss); }
  tr.you .nm { color: var(--moss); }
  tr.next td { background: #2A1D20; } tr.next td:first-child { box-shadow: inset .35rem 0 0 var(--health); color: var(--health); }
  .nextflag { margin-left: .6rem; font: 800 .85rem/1 var(--cond); letter-spacing: .14em; background: var(--health); color: var(--ink); padding: .25rem .45rem; border-radius: .3rem; vertical-align: .25rem; }
  tr.out td { opacity: .45; } tr.out .nm { text-decoration: line-through; }
  .side { display: flex; flex-direction: column; gap: .7rem; }
  .box { background: var(--slate); border-radius: .9rem; padding: .9rem 1rem; }
  .box .big { font: 800 4.4rem/.9 var(--cond); }
  .box .row2 { display: flex; justify-content: space-between; align-items: flex-end; }
  .box p { font: 500 1.05rem/1.35 var(--sans); color: var(--mist); margin-top: .4rem; }
  .opp { border: .16rem solid var(--health); }
  .opp .big { color: var(--health); }
</style></head>
<body>
<div class="stage">
  <div class="head"><h1>Lobby <span>· Turn <span id="turn"></span></span></h1><div class="spacer"></div><div class="label">Sorted by health</div><div class="btn" id="close">Back to shop</div></div>
  <div class="main">
    <table><thead><tr><th>#</th><th>Player</th><th>Health</th><th>Tier</th><th>Last</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="side" id="side"></div>
  </div>
</div>
<script src="data.js"></script><script src="arena.js"></script>
<script>
  const L = [...FX.lobby].sort((a, b) => b.health - a.health), max = Math.max(...L.map(p => p.health));
  document.getElementById('turn').textContent = FX.recruit.turn;
  document.getElementById('rows').innerHTML = L.map((p, i) => `<tr class="${p.name === 'You' ? 'you' : ''} ${p.next_opponent ? 'next' : ''} ${p.eliminated ? 'out' : ''}">
    <td>${p.eliminated ? '—' : i + 1}</td>
    <td><span class="nm">${p.name}</span>${p.next_opponent ? '<span class="nextflag">NEXT FIGHT</span>' : ''}</td>
    <td><div class="hpc"><b>${p.health}</b><div class="bar"><i style="width:${p.health / max * 100}%"></i></div></div></td>
    <td><span class="hex">${p.tier}</span></td>
    <td>${p.eliminated ? '<span class="label">Out</span>' : `<span class="wl ${p.last}">${p.last === 'won' ? 'WON' : 'LOST'}</span>`}</td></tr>`).join('');
  const me = FX.lobby.find(p => p.name === 'You'), opp = FX.lobby.find(p => p.next_opponent);
  const rank = L.findIndex(p => p.name === 'You') + 1, alive = FX.lobby.filter(p => !p.eliminated).length;
  document.getElementById('side').innerHTML = `
    <div class="box"><div class="label">Your place</div><div class="row2"><span class="big" style="color:var(--moss)">${rank}<span style="font-size:.45em;color:var(--mist)"> / ${alive}</span></span><span class="hex" style="font-size:1.6rem">${me.tier}</span></div><p>${me.health} health, tier ${me.tier}, ${me.last} last fight.</p></div>
    <div class="box opp"><div class="label" style="color:var(--health)">Next fight</div><div class="row2"><span class="nm" style="font-size:2rem">${opp.name}</span><span class="big">${opp.health}</span></div><p>Tier ${opp.tier}, ${opp.last} last fight.</p></div>`;
</script>
</body></html>
