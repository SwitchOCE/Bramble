<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodcraft Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&family=Grenze:wght@600;700;800&family=Alegreya+Sans:wght@500;700;800&family=Bitter:wght@800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="wc.css">
<style>
/* the lobby as a cribbage-style peg board: each peg sits on the player's Health */
.ws-wrap { position: absolute; top: 14px; width: 1100px; height: 612px; }
.ws-head { position: absolute; left: 0; right: 0; top: 0; height: 58px; display: flex; align-items: center; gap: 16px; }
.ws-head h1 { margin: 0; font: 800 38px/1 var(--wc-head); color: var(--wc-cream); }
.ws-head .sub { font: 700 16px/1 var(--wc-body); color: #D9BE97; }
.ws-head .wc-leaf { margin-left: auto; width: 220px; height: 64px; font-size: 22px; }
.ws-board { position: absolute; left: 0; right: 0; top: 74px; bottom: 10px; padding: 12px 18px; display: flex; flex-direction: column; gap: 6px; }
.ws-cols { display: grid; grid-template-columns: 34px 210px 54px 74px 1fr 62px; align-items: center; font: 800 12px/1 var(--wc-body); letter-spacing: .12em; text-transform: uppercase; color: #5A3A20; height: 16px; padding: 0 10px; }
.ws-lane { position: relative; display: grid; grid-template-columns: 34px 210px 54px 74px 1fr 62px; align-items: center; height: 52px; padding: 0 10px; border-radius: 12px; background: rgba(43,26,15,.10); }
.ws-lane .rk { font: 900 20px/1 var(--wc-num); }
.ws-lane .nm { font: 800 24px/1 var(--wc-head); white-space: nowrap; }
.ws-lane .tr { width: 36px; height: 36px; border-radius: 50%; background: var(--wc-oak); box-shadow: 0 0 0 3px var(--wc-ink), inset 0 0 0 4px var(--wc-carve); display: grid; place-items: center; font: 900 18px/1 var(--wc-num); }
.ws-lane .ls { font: 800 13px/1 var(--wc-body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 7px; border-radius: 6px; border: 2px solid var(--wc-ink); justify-self: start; }
.ws-lane .ls.won { background: var(--wc-moss); color: var(--wc-cream); }
.ws-lane .ls.lost { background: var(--wc-hp); color: var(--wc-cream); }
.ws-track { position: relative; height: 30px; margin: 0 12px; border-radius: 15px; background: var(--wc-carve); box-shadow: inset 0 4px 0 rgba(43,26,15,.45); border: 3px solid var(--wc-ink); }
.ws-hole { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--wc-ink); }
.ws-hole.ten { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; box-shadow: 0 0 0 2px #C9A46A; }
.ws-peg { position: absolute; top: 50%; width: 30px; height: 30px; margin: -19px 0 0 -15px; border-radius: 50%; border: 3px solid var(--wc-ink); box-shadow: 0 4px 0 0 var(--wc-ink); z-index: 2; }
.ws-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 12px 0 0 12px; background: rgba(240,193,75,.32); }
.ws-hp { position: relative; width: 50px; height: 50px; display: grid; place-items: center; justify-self: end; }
.ws-hp svg { position: absolute; inset: 0; }
.ws-hp b { position: relative; font: 900 21px/1 var(--wc-num); color: var(--wc-cream); margin-top: 5px; }
.ws-lane.me { background: rgba(65,102,44,.28); box-shadow: inset 0 0 0 3px var(--wc-moss); }
.ws-lane.next { background: var(--wc-cream); box-shadow: inset 0 0 0 4px var(--wc-hp); }
.ws-lane.next::after { content: 'Next opponent'; position: absolute; left: 200px; top: -9px; background: var(--wc-hp); color: var(--wc-cream); font: 800 12px/1 var(--wc-head); letter-spacing: .14em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 2px solid var(--wc-ink); }
.ws-lane.out { opacity: .55; }
.ws-lane.out .nm { text-decoration: line-through; }
.ws-scale { display: grid; grid-template-columns: 34px 210px 54px 74px 1fr 62px; padding: 0 10px; height: 16px; font: 900 12px/1 var(--wc-num); color: #5A3A20; }
.ws-scale div { position: relative; margin: 0 12px; }
.ws-scale span { position: absolute; transform: translateX(-50%); }
</style></head>
<body>
<div class="wc-stage wc-table" id="stage">
  <div class="ws-wrap" id="wrap">
    <div class="ws-head"><h1>Standings</h1><span class="sub">Turn 6 · 7 left in the lobby · pegs mark Health</span><span id="back"></span></div>
    <div class="ws-board wc-plaque" id="board"></div>
  </div>
</div>
<script src="data.js"></script>
<script src="wc.js"></script>
<script>
WC.start(() => {
  const st = document.getElementById('stage'), wrap = document.getElementById('wrap');
  const place = () => { wrap.style.left = (parseFloat(st.style.width) - 1100) / 2 + 'px'; };
  place(); addEventListener('resize', place);
  document.getElementById('back').outerHTML = WC.leaf('Back to shop', 'wc-leaf--moss');
  const MAX = 40, pegCol = { You: '#41662C' };
  const holes = Array.from({ length: MAX + 1 }, (_, i) => `<span class="ws-hole ${i % 10 === 0 ? 'ten' : ''}" style="left:calc(${(i / MAX) * 100}% * .96 + 2%)"></span>`).join('');
  const rows = FIX.lobby.slice().sort((a, b) => b.health - a.health).map((p, i) => {
    const pos = `calc(${(p.health / MAX) * 100}% * .96 + 2%)`;
    const col = p.name === 'You' ? '#41662C' : p.next_opponent ? '#B8322A' : '#F0C14B';
    return `<div class="ws-lane ${p.name === 'You' ? 'me' : ''} ${p.next_opponent ? 'next' : ''} ${p.eliminated ? 'out' : ''}">
      <span class="rk">${p.eliminated ? '8' : i + 1}</span><span class="nm">${p.name}</span><span class="tr">${p.tier}</span>
      <span class="ls ${p.eliminated ? 'lost' : p.last}">${p.eliminated ? 'Out' : p.last}</span>
      <div class="ws-track">${holes}${p.eliminated ? '' : `<div class="ws-fill" style="width:${pos}"></div><span class="ws-peg" style="left:${pos};background:${col}"></span>`}</div>
      <span class="ws-hp">${WC.shape.hp}<b>${p.health}</b></span></div>`;
  }).join('');
  const scale = `<div class="ws-scale"><span></span><span></span><span></span><span></span><div>${[0, 10, 20, 30, 40].map(v => `<span style="left:calc(${v / MAX * 100}% * .96 + 2%)">${v}</span>`).join('')}</div><span></span></div>`;
  document.getElementById('board').innerHTML = `<div class="ws-cols"><span>#</span><span>Player</span><span>Tier</span><span>Last</span><span style="padding-left:12px">Health</span><span></span></div>` + rows;
});
</script>
</body></html>
