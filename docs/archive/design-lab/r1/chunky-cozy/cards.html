<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chunky Cozy · Cards</title>
<link rel="stylesheet" href="cozy.css">
<style>
  .herozone { position: absolute; left: 190px; top: 64px; }
  .h1 { position: absolute; left: 24px; top: 14px; font-family: var(--font-display); font-weight: 700; font-size: 30px; }
  .call { position: absolute; display: flex; align-items: center; gap: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; white-space: nowrap; z-index: 9; }
  .call span { background: var(--cocoa); color: #fff; border-radius: 999px; padding: 3px 12px; }
  .call i { display: block; height: 4px; background: var(--cocoa); border-radius: 2px; }
  .call b { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--cocoa); }
  .grid { position: absolute; left: 640px; right: 24px; top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 10px; row-gap: 6px; justify-items: center; }
  .grid .label { font-size: 16px; }
  .grid .cell { display: flex; justify-content: center; align-items: center; }
  .grid .shopc { height: 268px; padding-top: 14px; }
  .grid .boardc { height: 196px; }
  .sz { justify-self: start; writing-mode: vertical-rl; transform: rotate(180deg); }
  .rem { position: absolute; left: 640px; right: 24px; bottom: 18px; display: flex; gap: 20px; align-items: center; padding: 16px 22px; }
  .rem p { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.3; }
  .rem .t2 { font-size: 15px; color: var(--cocoa-soft); margin-top: 4px; }
</style></head>
<body><div id="stage">
  <div class="h1">Card anatomy</div>
  <div class="herozone" id="hero"></div>
  <div class="grid" id="grid"></div>
  <div class="rem panel" id="rem"></div>
</div>
<script src="data.js"></script><script src="ui.js"></script>
<script>
  const H = FX.hero_card, R = FX.recruit, { I } = CZ, $ = id => document.getElementById(id);
  $('hero').innerHTML = CZ.card(H, { size: 'full' }).replace('class="card full', 'style="font-size:25px" class="card full');
  const snail = R.board.back[1], plain = R.shop[0];
  const cols = [['Belladonna Sprite', H], ['Golden', snail], ['Plain unit', plain]];
  $('grid').innerHTML = cols.map(c => `<span class="label">${c[0]}</span>`).join('')
    + cols.map(c => `<div class="cell shopc">${CZ.card(c[1])}</div>`).join('')
    + cols.map(c => `<div class="cell boardc">${CZ.token(c[1], { nokw: c[1] === H, noname: true })}</div>`).join('');
  $('grid').insertAdjacentHTML('beforeend', '');
  $('rem').innerHTML = `${CZ.token(FX.combat.enemy_front[0], { ns: true, hp: 13, hpcls: 'low', noname: true, style: 'transform:scale(.8);margin:-10px -6px' })}
    <div><p>${CZ.kwText(H.keyword_reminder.split(':')[0])}: ${H.keyword_reminder.split(':').slice(1).join(':')}</p>
    <p class="t2">Keyword reminders open on long-press (phone) or hover (desktop). On the board the status shows as a berry bubble and a purple glow, as on the Tusker Boar here.</p></div>`;
  CZ.fit();
  // callouts placed from the laid-out hero card
  const st = $('stage'), s = st.getBoundingClientRect().width / st.offsetWidth, o = st.getBoundingClientRect();
  const at = sel => { const r = document.querySelector('#hero ' + sel).getBoundingClientRect(); return { x: (r.left - o.left) / s, y: (r.top - o.top) / s, w: r.width / s, h: r.height / s }; };
  const call = (label, sel, fy = .5, fx = .1) => { const b = at(sel); const y = b.y + b.h * fy, x = b.x + b.w * fx; const left = 24;
    st.insertAdjacentHTML('beforeend', `<div class="call" style="left:${left}px;top:${y - 13}px"><span>${label}</span><i style="width:${Math.max(10, x - left - 120)}px"></i><b></b></div>`); };
  call('Tier', '.tier', .5, .4); call('Art', '.art', .5, .05); call('Name', '.name', .5, .05); call('Rules + keyword', '.text', .3, .02);
  call('Attack', '.stat.atk', .92, .5); call('Type · tribe', '.meta', .05, .14);
  const hp = at('.stat.hp');
  st.insertAdjacentHTML('beforeend', `<div class="call" style="left:${hp.x + hp.w - 6}px;top:${hp.y + hp.h * .5 - 13}px;flex-direction:row-reverse"><span>Health</span><i style="width:20px"></i><b></b></div>`);
</script></body></html>
