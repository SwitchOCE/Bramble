<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodcraft Combat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&family=Grenze:wght@600;700;800&family=Alegreya+Sans:wght@500;700;800&family=Bitter:wght@800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="wc.css">
<style>
:root { --L: 310px; --R: 190px; }
html[data-wide="1"] { --L: 410px; --R: 290px; }
.wk-grid { position: absolute; inset: 0; display: grid; grid-template-columns: var(--L) 1fr var(--R); gap: 14px; padding: 14px 10px 16px 12px; }
.wk-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ---------- field: two brick trays ---------- */
.wk-fieldwrap { position: relative; }
.wk-field { position: absolute; left: 50%; top: -6px; width: 590px; height: 640px; margin-left: -295px; }
.wk-field .wc-slot { width: 112px; }
.wk-field .wc-pocket { width: 112px; height: 100px; }
.wk-field .wc-row { gap: 12px; padding: 8px 14px 10px; }
.wk-field .wc-row--back { margin-left: 62px; padding-top: 24px; padding-bottom: 8px; }
.wk-field .wc-board--enemy .wc-row--back { padding-top: 10px; padding-bottom: 24px; }
.wk-field .wc-tile--board { width: 102px; height: 90px; }
.wk-field .wc-tile--board .wc-art { left: 8px; right: 8px; top: 8px; bottom: 8px; }
.wk-field .wc-tile--board .wc-kw-long, .wc-tile--board .wc-kw-long { font-size: 13px; line-height: 1; left: 24px; right: 3px; transform: none; white-space: normal; text-align: center; padding: 2px 3px 3px; }
.wk-field .wc-pocket .wc-empty { font-size: 26px; }
.wk-enemy { position: absolute; left: 36px; top: 8px; }
.wk-you { position: absolute; left: 36px; top: 322px; }
.wk-side { position: absolute; left: 568px; writing-mode: vertical-rl; transform: rotate(180deg); font: 800 16px/1 var(--wc-head); letter-spacing: .2em; text-transform: uppercase; color: var(--wc-ink); }
.wk-thread { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; overflow: visible; }

/* attacker: lifted out of its pocket, acorn ring, a tag tied to the yarn */
.wk-att { transform: translateY(-7px); box-shadow: 0 0 0 3px var(--wc-ink), 0 0 0 9px var(--wc-acorn), 0 0 0 12px var(--wc-ink), 0 14px 0 3px var(--wc-ink) !important; }
/* target: red ring (the yarn's colour) */
.wk-tgt { box-shadow: 0 0 0 3px var(--wc-ink), 0 0 0 9px var(--wc-hp), 0 0 0 12px var(--wc-ink), 0 7px 0 0 var(--wc-carve) !important; }
.wk-tag { position: absolute; z-index: 22; display: flex; align-items: center; gap: 6px; white-space: nowrap; font: 800 15px/1 var(--wc-head); letter-spacing: .12em; text-transform: uppercase; padding: 5px 9px 6px; border-radius: 8px; border: 3px solid var(--wc-ink); }
.wk-tag small { font: 700 14px/1 var(--wc-body); letter-spacing: 0; text-transform: none; }
.wk-tag.att { background: var(--wc-acorn); color: var(--wc-ink); }
.wk-tag.att::before { content: ''; position: absolute; left: 50%; top: -11px; width: 3px; height: 9px; background: var(--wc-ink); }
.wk-tag.tgt { background: var(--wc-hp); color: var(--wc-cream); }
.wk-dmg { position: absolute; z-index: 23; width: 76px; height: 76px; display: grid; place-items: center; }
.wk-dmg svg { position: absolute; inset: 0; }
.wk-dmg b { position: relative; font: 900 34px/1 var(--wc-num); color: var(--wc-cream); }

/* ---------- this hit: a fixed, numbered breakdown ---------- */
.wk-hit { padding: 10px 12px 12px; background: var(--wc-shade); border: 4px solid var(--wc-ink); border-radius: 14px; color: var(--wc-cream); box-shadow: 0 7px 0 0 #3A2356, 0 7px 0 4px var(--wc-ink); }
.wk-hit .hd { display: flex; justify-content: space-between; align-items: baseline; font: 800 15px/1 var(--wc-head); letter-spacing: .16em; text-transform: uppercase; }
.wk-hit .who { display: flex; align-items: center; gap: 0; margin: 9px 0 10px; }
.wk-hit .who .t { padding: 4px 7px 5px; border: 3px solid var(--wc-ink); border-radius: 7px; font: 800 16px/1 var(--wc-head); white-space: nowrap; }
.wk-hit .who .att { background: var(--wc-acorn); color: var(--wc-ink); }
.wk-hit .who .tgt { background: var(--wc-hp); color: var(--wc-cream); }
.wk-hit .who svg { flex: 1; height: 16px; min-width: 20px; }
.wk-steps { display: grid; grid-template-columns: 50px 1fr 50px 1fr 54px; align-items: start; background: rgba(43,26,15,.35); border-radius: 10px; padding: 8px 4px 6px; }
.wk-st, .wk-op { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.wk-st small, .wk-op small { font: 800 13px/1 var(--wc-body); letter-spacing: .02em; color: var(--wc-cream); white-space: nowrap; }
.wk-st .n { position: absolute; left: -4px; top: -6px; z-index: 2; width: 19px; height: 19px; border-radius: 50%; background: var(--wc-birch); color: var(--wc-ink); border: 2px solid var(--wc-ink); display: grid; place-items: center; font: 900 11px/1 var(--wc-num); font-style: normal; }
.wk-bead { position: relative; width: 50px; height: 50px; display: grid; place-items: center; }
.wk-bead svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wk-bead b { position: relative; margin-top: 6px; font: 900 22px/1 var(--wc-num); color: var(--wc-cream); }
.wk-st.past .wk-bead { opacity: .82; }
.wk-st.fin .wk-bead { width: 54px; height: 54px; }
.wk-st.fin .wk-bead b { font-size: 26px; }
.wk-st.fin small { color: var(--wc-gilt); }
.wk-op .tok { height: 50px; display: grid; place-items: center; position: relative; width: 50px; }
.wk-op .tok svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wk-op .tok b { position: relative; font: 900 22px/1 var(--wc-num); color: var(--wc-cream); }
.wk-op::before { content: ''; position: absolute; top: 24px; left: -6px; right: -6px; border-top: 3px dashed rgba(247,236,212,.55); z-index: 0; }
.wk-op .tok { z-index: 1; }

/* ---------- combat log: pinned paper ---------- */
.wk-log { flex: 1; min-height: 0; background: var(--wc-birch); border: 4px solid var(--wc-ink); border-radius: 12px; padding: 18px 16px 14px; box-shadow: 0 7px 0 0 #8C5A2E, 0 7px 0 4px var(--wc-ink); position: relative; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.wk-log h3 { margin: 0; font: 800 15px/1 var(--wc-head); letter-spacing: .18em; text-transform: uppercase; color: var(--wc-mute); }
.wk-log p { margin: 0; font: 500 16px/1.28 var(--wc-body); color: var(--wc-mute); }
.wk-log p i { font-style: normal; font: 900 13px/1 var(--wc-num); background: var(--wc-ink); color: var(--wc-birch); padding: 2px 4px 3px; border-radius: 4px; }
.wk-log p.now { font: 700 18px/1.28 var(--wc-body); color: var(--wc-ink); border-left: 6px solid var(--wc-hp); padding-left: 10px; }
.wk-log .nail1 { left: 10px; top: 6px; } .wk-log .nail2 { right: 10px; top: 6px; }

/* ---------- right column ---------- */
.wk-opp { padding: 10px 12px; }
.wk-opp .k { font: 800 13px/1 var(--wc-body); letter-spacing: .14em; text-transform: uppercase; color: var(--wc-ink); }
.wk-opp .n { font: 800 26px/1.05 var(--wc-head); margin-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.wk-opp .hb { position: relative; width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
.wk-opp .hb svg { position: absolute; inset: 0; }
.wk-opp .hb b { position: relative; font: 900 18px/1 var(--wc-num); color: var(--wc-cream); margin-top: 5px; }
.wk-speed { padding: 10px 10px 14px; text-align: center; }
.wk-speed h3, .wk-rem h3 { margin: 0 0 10px; font: 800 15px/1 var(--wc-head); letter-spacing: .18em; text-transform: uppercase; }
.wk-tokens { display: flex; justify-content: space-between; gap: 6px; }
.wk-tok { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--wc-ink); background: var(--wc-birch); font: 900 20px/1 var(--wc-num); color: var(--wc-ink); box-shadow: 0 5px 0 0 var(--wc-carve), 0 5px 0 3px var(--wc-ink); cursor: pointer; padding: 0; }
.wk-tok.on { background: var(--wc-acorn); transform: translateY(4px); box-shadow: 0 1px 0 0 var(--wc-carve), 0 1px 0 3px var(--wc-ink); }
.wk-rem { padding: 10px 12px 12px; background: var(--wc-birch); }
.wk-rem p { margin: 0; font: 500 15px/1.3 var(--wc-body); }
.wk-rem h3 { color: var(--wc-shade); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.wk-rem h3 svg { width: 24px; height: 24px; }
.wk-sp { flex: 1; }
.wk-col--r .wc-leaf { height: 78px; width: 100%; font-size: 24px; }
.wk-col--r .wc-leaf small { font: 700 14px/1 var(--wc-body); }
.wk-col--r .wc-leaf .wc-leaf-in { flex-direction: column; gap: 3px; }

/* phone: the stage is wider in design px, so the side columns grow and their text reaches 11 CSS px */
html[data-wide="1"] .wk-hit .hd, html[data-wide="1"] .wk-speed h3, html[data-wide="1"] .wk-rem h3, html[data-wide="1"] .wk-log h3 { font-size: 19px; }
html[data-wide="1"] .wk-hit .who .t { font-size: 20px; }
html[data-wide="1"] .wk-steps { grid-template-columns: 64px 1fr 64px 1fr 68px; }
html[data-wide="1"] .wk-bead, html[data-wide="1"] .wk-op .tok { width: 62px; height: 62px; }
html[data-wide="1"] .wk-st.fin .wk-bead { width: 68px; height: 68px; }
html[data-wide="1"] .wk-bead b, html[data-wide="1"] .wk-op .tok b { font-size: 27px; }
html[data-wide="1"] .wk-st.fin .wk-bead b { font-size: 32px; }
html[data-wide="1"] .wk-op::before { top: 30px; }
html[data-wide="1"] .wk-st small, html[data-wide="1"] .wk-op small { font-size: 18px; }
html[data-wide="1"] .wk-st .n { width: 24px; height: 24px; font-size: 14px; }
html[data-wide="1"] .wk-log p { font-size: 18px; }
html[data-wide="1"] .wk-log p.now { font-size: 20px; }
html[data-wide="1"] .wk-log p i { font-size: 16px; }
html[data-wide="1"] .wk-opp .k { font-size: 18px; }
html[data-wide="1"] .wk-opp .n { font-size: 30px; }
html[data-wide="1"] .wk-tok { width: 74px; height: 74px; font-size: 26px; }
html[data-wide="1"] .wk-rem p { font-size: 18px; }
html[data-wide="1"] .wk-col--r .wc-leaf { height: 92px; font-size: 30px; }
html[data-wide="1"] .wk-col--r .wc-leaf small { font-size: 18px; }
</style></head>
<body>
<div class="wc-stage wc-table" id="stage">
  <div class="wk-grid">
    <div class="wk-col">
      <div class="wk-hit" id="hit"></div>
      <div class="wk-log" id="log"><span class="wc-nail nail1"></span><span class="wc-nail nail2"></span></div>
      <div class="wc-plaque wk-rem" id="rem"></div>
    </div>
    <div class="wk-fieldwrap"><div class="wk-field" id="field">
      <div class="wk-side" style="top:70px">Old Tansy</div>
      <div class="wk-side" style="top:420px">You</div>
      <div class="wk-enemy" id="enemy"></div>
      <div class="wk-you" id="you"></div>
      <svg class="wk-thread" id="thread"></svg>
    </div></div>
    <div class="wk-col wk-col--r">
      <div class="wc-plaque wk-opp"><div class="k">Fighting</div><div class="n"><span id="opp"></span><span class="hb" id="opphp"></span></div></div>
      <div class="wc-plaque wk-speed"><h3>Speed</h3><div class="wk-tokens"><button class="wk-tok on">×1</button><button class="wk-tok">×2</button><button class="wk-tok">×4</button></div></div>
      <div class="wk-sp"></div>
      <div id="skip"></div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="wc.js"></script>
<script>
WC.start(() => {
  const C = FIX.combat, R = FIX.recruit;
  const boar = C.enemy_front[0];
  const after = boar.current_health - Math.floor(boar.current_health / 2) - C.hornetling.attack; // 26 -> 13 -> 12
  const halved = boar.current_health - Math.floor(boar.current_health / 2);

  document.getElementById('opp').textContent = C.opponent;
  document.getElementById('opphp').innerHTML = WC.shape.hp + `<b>${FIX.lobby.find(p => p.name === C.opponent).health}</b>`;

  // enemy tray: back row on top. The boar carries the Nightshade status as a hanging tag.
  const enemy = { front: WC.fill(C.enemy_front, 4), back: WC.fill(C.enemy_back, 3) };
  document.getElementById('enemy').innerHTML = WC.board(enemy, { enemy: true, chips: true,
    extra: { F2: { hp: after, hpCls: 'wc-hurt', cls: 'wk-tgt', attrs: 'id="boar"', after: WC.status('Nightshade') } } });
  // your tray: the Hornetling took the dead Hornet Scout's slot, B1; the Sprite sits in B3
  const sprite = Object.assign({ slot: 'B3' }, FIX.hero_card);
  const you = { front: R.board.front, back: [C.hornetling, R.board.back[1], sprite] };
  document.getElementById('you').innerHTML = WC.board(you, { chips: true, extra: { B1: { cls: 'wk-att', attrs: 'id="hornet"' } } });
  WC.links(document.querySelector('#enemy .wc-board'));
  WC.links(document.querySelector('#you .wc-board'));

  const hpBead = (v) => `<div class="wk-bead">${WC.shape.hp}<b>${v}</b></div>`;
  const burst = `<svg viewBox="0 0 74 74"><path d="M37 2l8 18 19-9-6 20 15 8-17 8 9 19-20-5-8 13-8-13-20 5 9-19-17-8 15-8-6-20 19 9z" fill="#B8322A" stroke="#2B1A0F" stroke-width="4" stroke-linejoin="round"/></svg>`;
  const yarn = `<svg viewBox="0 0 100 16" preserveAspectRatio="none"><path d="M0 8H92" stroke="#2B1A0F" stroke-width="8"/><path d="M0 8H92" stroke="#B8322A" stroke-width="4" stroke-dasharray="8 5"/><path d="M88 2L99 8L88 14z" fill="#B8322A" stroke="#2B1A0F" stroke-width="2"/></svg>`;
  document.getElementById('hit').innerHTML = `
    <div class="hd"><span>This hit</span><span>Attack 2</span></div>
    <div class="who"><span class="t att">${C.hornetling.name}</span>${yarn}<span class="t tgt">${boar.name}</span></div>
    <div class="wk-steps">
      <div class="wk-st past"><i class="n">1</i>${hpBead(boar.current_health)}<small>before</small></div>
      <div class="wk-op"><span class="tok">${WC.icon.berry.replace('<circle cx="20" cy="26" r="11"', '<circle cx="20" cy="26" r="13"')}<b style="margin-top:10px">½</b></span><small>Nightshade</small></div>
      <div class="wk-st past"><i class="n">2</i>${hpBead(halved)}<small>halved</small></div>
      <div class="wk-op"><span class="tok">${burst}<b>−${C.hornetling.attack}</b></span><small>hit</small></div>
      <div class="wk-st fin"><i class="n">3</i>${hpBead(after)}<small>after</small></div>
    </div>`;

  document.getElementById('log').insertAdjacentHTML('beforeend', `<h3>Combat log</h3>
    <p>Start of Combat: Belladonna Sprite gives Tusker Boar <span class="wc-key">Nightshade</span>.</p>
    <p>Attack 1: Hornet Scout dies. A 1/1 Hornetling is summoned into <i>B1</i>.</p>
    <p class="now">Attack 2: Hornetling attacks Tusker Boar. <span class="wc-key">Nightshade</span> halves ${boar.current_health} to ${halved}, then the hit deals ${C.hornetling.attack}: <b>${after} Health left</b>.</p>`);
  document.getElementById('rem').innerHTML = `<h3>${WC.icon.berry}Nightshade</h3><p>${FIX.hero_card.keyword_reminder.replace('Nightshade: ', '').replace(/^./, c => c.toUpperCase())}</p>`;
  document.getElementById('skip').innerHTML = WC.leaf('Skip ▸▸<small>to the result</small>', 'wc-leaf--moss');

  document.fonts.ready.then(() => {
    const field = document.getElementById('field');
    const off = (el) => { let x = 0, y = 0, n = el; while (n && n !== field) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return { x, y, w: el.offsetWidth, h: el.offsetHeight }; };
    const b = off(document.getElementById('boar')), h = off(document.getElementById('hornet'));
    const enemyBox = off(document.querySelector('#enemy .wc-board')), youBox = off(document.querySelector('#you .wc-board'));
    h.y -= 7; // lifted

    // ATTACKING hangs from the attacker; the yarn is tied to it
    const tagTop = h.y + h.h + 25;
    field.insertAdjacentHTML('beforeend', `<div class="wk-tag att" id="atag" style="top:${tagTop}px">Attacking</div>`);
    const at = document.getElementById('atag');
    at.style.left = (h.x + h.w / 2 - at.offsetWidth / 2) + 'px';
    const a = off(at);

    // red yarn: from the tag, round the left of your tray, along the gap between the trays, up into the target
    const r = 14, gx = 10;
    const x1 = a.x, y1 = a.y + a.h / 2;
    const gapY = (enemyBox.y + enemyBox.h + 9 + youBox.y) / 2;
    const bx = b.x + b.w / 2, by = enemyBox.y + enemyBox.h + 4; // arrow rests on the tray edge, under the F2 chip
    const d = `M${x1} ${y1} H${gx + r} Q${gx} ${y1} ${gx} ${y1 - r} V${gapY + r} Q${gx} ${gapY} ${gx + r} ${gapY} H${bx - r} Q${bx} ${gapY} ${bx} ${gapY - r} V${by + 14}`;
    document.getElementById('thread').innerHTML = `
      <path d="${d}" fill="none" stroke="#2B1A0F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="#B8322A" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 8"/>
      <path d="M${bx - 15} ${by + 18} L ${bx} ${by - 2} L ${bx + 15} ${by + 18} Z" fill="#B8322A" stroke="#2B1A0F" stroke-width="4" stroke-linejoin="round"/>`;
    field.insertAdjacentHTML('beforeend', `
      <div class="wk-tag tgt" style="left:${bx + 26}px;top:${gapY - 17}px">Target<small>${boar.name}</small></div>
      <div class="wk-dmg" style="left:${b.x + b.w - 6}px;top:${b.y + 10}px">${burst}<b>−${C.hornetling.attack}</b></div>`);
  });
});
</script>
</body></html>
