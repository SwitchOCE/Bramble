<title>Five Ogre Tribes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky view switcher; overview → per-tribe card wall grouped by tier rows → side-by-side tier grid. */
:root{
  --bg:#ecefe7; --surface:#f8faf4; --card:#fffffb; --ink:#1d2219; --muted:#5b6455; --line:#cdd3c4;
  --accent:#8a5a12; --accent-soft:#f1e3c8; --gold:#b98a16; --gold-soft:#f6ecc9;
  --atk:#b5781c; --hp:#a8382f; --kw:#2f5d4a; --heat:#3d6b52;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-card:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1b2018; --card:#222820; --ink:#e6eadd; --muted:#9ba393; --line:#353d30;
  --accent:#dba04a; --accent-soft:#3a2f1c; --gold:#e2b84a; --gold-soft:#3b331b;
  --atk:#e0a043; --hp:#e06a5d; --kw:#8fd0b0; --heat:#6fb08c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1b2018; --card:#222820; --ink:#e6eadd; --muted:#9ba393; --line:#353d30;
  --accent:#dba04a; --accent-soft:#3a2f1c; --gold:#e2b84a; --gold-soft:#3b331b;
  --atk:#e0a043; --hp:#e06a5d; --kw:#8fd0b0; --heat:#6fb08c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:15px/1.55 var(--f-body)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
.wrap{max-width:1240px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:5}
header.top .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; padding-block:12px}
h1{font:800 22px/1.1 var(--f-display); margin:0; letter-spacing:-.01em}
h1 small{display:block; font:500 12px/1.3 var(--f-body); color:var(--muted); letter-spacing:0}
nav.views{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}
nav.views a{font:600 15px/1 var(--f-card); letter-spacing:.04em; text-transform:uppercase; text-decoration:none; color:var(--muted); padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card)}
nav.views a[aria-current="page"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
nav.views a:focus-visible, button:focus-visible, .kw:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
main .wrap{padding-block:24px 64px; display:grid; gap:28px}
h2{font:800 26px/1.15 var(--f-display); margin:0; text-wrap:balance}
h3{font:600 20px/1.2 var(--f-display); margin:0}
.eyebrow{font:600 13px/1 var(--f-card); letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
.lede{max-width:68ch; color:var(--ink); margin:0}
.muted{color:var(--muted)}
section{display:grid; gap:14px; min-width:0}

/* overview tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.tile{display:grid; gap:6px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; text-decoration:none; color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .num{font:700 30px/1 var(--f-card); color:var(--accent)}
.tile .hook{font-weight:600}
.tile .kws{display:flex; flex-wrap:wrap; gap:4px}
.chip{font:600 13px/1 var(--f-card); letter-spacing:.03em; padding:4px 7px; border-radius:5px; background:var(--accent-soft); color:var(--ink)}
ul.plain{margin:0; padding-left:1.1em; display:grid; gap:4px; max-width:80ch}

/* tables */
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--card)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
thead th{font:600 14px/1.2 var(--f-card); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:var(--surface); position:sticky; top:0}
tbody th{font-weight:600; min-width:150px}
td.empty{color:var(--line)}
td.empty::after{content:"—"}
.matrix td{min-width:150px}
.heat td{text-align:center; font:600 16px/1 var(--f-card); font-variant-numeric:tabular-nums; min-width:44px}
.heat td span{display:inline-grid; place-items:center; width:34px; height:28px; border-radius:5px}

/* tribe view */
.tribe-head{display:grid; gap:10px; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:820px){.tribe-head{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:10px; align-content:start; min-width:0}
.gloss{display:grid; gap:8px; margin:0}
.gloss div{display:grid; gap:2px}
.gloss dt{font:700 16px/1.1 var(--f-card); letter-spacing:.03em; color:var(--kw)}
.gloss dd{margin:0; font-size:13.5px}
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.controls .lbl{font:600 13px/1 var(--f-card); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:4px}
button.tog{font:600 14px/1 var(--f-card); letter-spacing:.04em; padding:7px 11px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer}
button.tog[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
button.tog.gold[aria-pressed="true"]{background:var(--gold); color:#1d1a10; border-color:var(--gold)}
.tier-row{display:grid; gap:10px}
.tier-label{display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--line); padding-bottom:6px}
.tier-label b{font:700 20px/1 var(--f-card); letter-spacing:.04em; text-transform:uppercase}
.tier-label .pips{color:var(--accent); letter-spacing:2px; font-size:13px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:14px}

/* the card */
.card{position:relative; display:grid; grid-template-rows:auto auto 1fr auto; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 12px 10px; min-height:270px; gap:8px; min-width:0}
.card.is-gold{border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft)}
.card .tier{position:absolute; top:-10px; left:-8px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:var(--bg); font:700 17px/1 var(--f-card)}
.card .name{font:700 19px/1.05 var(--f-card); letter-spacing:.01em; text-align:center; padding:4px 10px 0; text-wrap:balance}
.card .type{font:600 11.5px/1 var(--f-card); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); text-align:center}
.card .text{font-size:13.5px; line-height:1.45; background:var(--surface); border-radius:8px; padding:9px 10px; align-self:stretch; display:grid; align-content:center; gap:6px; min-width:0; overflow-wrap:anywhere}
.card .text strong{font-weight:600}
.card .gline{border-top:1px dashed var(--gold); padding-top:6px; font-size:12.5px}
.card .gline b{font:700 12px/1 var(--f-card); letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-right:4px}
.card .stats{display:flex; justify-content:space-between; align-items:center}
.stat{display:flex; align-items:center; gap:6px; font:700 22px/1 var(--f-card); font-variant-numeric:tabular-nums}
.stat i{font:600 10.5px/1 var(--f-card); font-style:normal; letter-spacing:.14em; color:var(--muted)}
.stat .gem{width:36px; height:36px; display:grid; place-items:center; color:#fff}
.stat.atk .gem{background:var(--atk); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.stat.hp .gem{background:var(--hp); border-radius:50% 50% 50% 50% / 40% 40% 60% 60%}
.kw{color:var(--kw); font-weight:600; text-decoration:underline dotted; text-underline-offset:3px; cursor:help}
#tip{position:fixed; z-index:20; max-width:300px; background:var(--ink); color:var(--bg); font-size:13px; line-height:1.45; padding:9px 11px; border-radius:8px; pointer-events:none}
#tip b{display:block; font:700 15px/1.1 var(--f-card); letter-spacing:.04em; margin-bottom:3px}

details{background:var(--surface); border:1px solid var(--line); border-radius:10px}
summary{cursor:pointer; padding:12px 16px; font:700 17px/1.2 var(--f-card); letter-spacing:.06em; text-transform:uppercase}
details .body{padding:0 16px 14px; max-width:84ch; overflow-x:auto}
details .body table{font-size:13px}
.prose p,.prose li{max-width:80ch}
.prose h3{font:700 16px/1.2 var(--f-card); letter-spacing:.06em; text-transform:uppercase; margin-top:14px}

/* side by side */
.sbs{display:grid; grid-template-columns:70px repeat(5,minmax(230px,1fr)); min-width:1220px}
.sbs > div{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px; display:grid; gap:6px; align-content:start}
.sbs .h{position:sticky; top:0; background:var(--surface); font:700 16px/1.2 var(--f-card); letter-spacing:.04em; z-index:1}
.sbs .h small{display:block; font:500 12.5px/1.3 var(--f-body); color:var(--muted); letter-spacing:0}
.sbs .t{font:700 22px/1 var(--f-card); color:var(--accent); text-align:center; background:var(--surface)}
.mini{background:var(--surface); border-radius:7px; padding:6px 8px; font-size:12.5px; line-height:1.4}
.mini .mn{display:flex; justify-content:space-between; gap:6px; font:700 14.5px/1.15 var(--f-card)}
.mini .mn span{font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s, box-shadow .2s}}
</style>

<header class="top"><div class="wrap">
  <h1>Five Ogre Tribes<small>Blind comparison · 24 minions each · Hearthstone Battlegrounds</small></h1>
  <nav class="views" id="nav" aria-label="Views"></nav>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div id="tip" hidden></div>

<script>
const DATA = /*DATA*/;
const CMP = /*CMP*/;
const IDS = ["1","2","3","4","5"];
const BASE_KW = ["Battlecry","Deathrattle","Divine Shield","Reborn","Taunt","Windfury","Venomous","Magnetic","Avenge","Start of Combat","Rally","Activate","Discover","Choose One","Cleave"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ct = id => (CMP && CMP.tribes && CMP.tribes[id]) || {};
let golden = false;
try { golden = localStorage.getItem("ogre-golden") === "1"; } catch(e) {}
let tierFilter = 0;

function kwRegex(id){
  const list = (ct(id).keywords || []).map(k => k.name).filter(Boolean);
  const all = [...new Set([...list, ...BASE_KW])].sort((a,b) => b.length - a.length);
  const pat = all.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  return {re: new RegExp("\\b(" + pat + ")\\b", "g"), defs: Object.fromEntries((ct(id).keywords||[]).map(k => [k.name, k.text]))};
}
function decorate(html, kr){
  return html.split(/(<[^>]+>)/).map(part => part.startsWith("<") ? part :
    part.replace(kr.re, m => kr.defs[m] ? `<span class="kw" tabindex="0" data-k="${esc(m)}" data-d="${esc(kr.defs[m])}">${m}</span>` : `<strong>${m}</strong>`)
  ).join("");
}
function pips(n){ return "★".repeat(Math.min(n,7)); }

function cardHTML(c, kr){
  const a = golden ? c.gatk : c.atk, h = golden ? c.ghp : c.hp;
  const g = golden && c.golden ? `<div class="gline"><b>Golden</b>${decorate(c.golden, kr)}</div>` : "";
  return `<article class="card${golden ? " is-gold" : ""}">
    <div class="tier" title="Tier ${c.tier}">${c.tier}</div>
    <div class="name">${esc(c.name)}</div>
    <div class="type">Ogre</div>
    <div class="text"><div>${decorate(c.text, kr)}</div>${g}</div>
    <div class="stats"><span class="stat atk"><span class="gem">${a}</span><i>ATK</i></span><span class="stat hp"><i>HP</i><span class="gem">${h}</span></span></div>
  </article>`;
}

function tierCounts(id){
  const n = {}; DATA[id].cards.forEach(c => n[c.tier] = (n[c.tier]||0) + 1); return n;
}

function renderNav(view){
  const items = [["overview","Overview"], ...IDS.map(i => ["tribe-"+i, "Tribe "+i]), ["side-by-side","Side by side"]];
  $("#nav").innerHTML = items.map(([h,l]) => `<a href="#${h}"${h===view?' aria-current="page"':""}>${l}</a>`).join("");
}

function overview(){
  const maxT = Math.max(...IDS.flatMap(i => DATA[i].cards.map(c => c.tier)));
  const tiers = Array.from({length:maxT}, (_,k) => k+1);
  const heat = IDS.map(i => { const n = tierCounts(i); return `<tr><th scope="row"><a href="#tribe-${i}">Tribe ${i}</a></th>${tiers.map(t => {
    const v = n[t]||0; return `<td><span style="background:color-mix(in srgb, var(--heat) ${v*14}%, transparent)">${v||"·"}</span></td>`}).join("")}</tr>`}).join("");
  const matrix = (CMP.matrix||[]).map(r => `<tr><th scope="row">${esc(r.feature)}</th>${IDS.map(i => { const v = (r.cells||{})[i]; return v ? `<td>${esc(v)}</td>` : `<td class="empty"></td>`}).join("")}</tr>`).join("");
  return `
  <section>
    <div class="eyebrow">Overview</div>
    <h2>Same race, same brief, five tribes</h2>
    <p class="lede">${esc(CMP.summary||"")}</p>
  </section>
  <section>
    <div class="tiles">${IDS.map(i => `<a class="tile" href="#tribe-${i}"><span class="num">${i}</span><span class="hook">${esc(ct(i).hook||"")}</span><span class="kws">${(ct(i).keywords||[]).slice(0,5).map(k=>`<span class="chip">${esc(k.name)}</span>`).join("")}</span></a>`).join("")}</div>
  </section>
  <section>
    <h3>What came from the brief</h3>
    <ul class="plain">${(CMP.fromBrief||[]).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
  </section>
  <section>
    <h3>Rules and features compared</h3>
    <div class="scroll"><table class="matrix"><thead><tr><th>Feature</th>${IDS.map(i=>`<th>Tribe ${i}</th>`).join("")}</tr></thead><tbody>${matrix}</tbody></table></div>
  </section>
  <section>
    <h3>Minions per tier</h3>
    <div class="scroll"><table class="heat"><thead><tr><th></th>${tiers.map(t=>`<th>Tier ${t}</th>`).join("")}</tr></thead><tbody>${heat}</tbody></table></div>
  </section>`;
}

function tribe(id){
  const d = DATA[id], c = ct(id), kr = kwRegex(id);
  const tiers = [...new Set(d.cards.map(x => x.tier))].sort((a,b)=>a-b);
  const rows = tiers.filter(t => !tierFilter || t === tierFilter).map(t => {
    const cs = d.cards.filter(x => x.tier === t);
    return `<div class="tier-row"><div class="tier-label"><b>Tier ${t}</b><span class="pips">${pips(t)}</span><span class="muted">${cs.length} minion${cs.length>1?"s":""}</span></div><div class="cards">${cs.map(x => cardHTML(x, kr)).join("")}</div></div>`;
  }).join("");
  const gloss = (c.keywords||[]).map(k => `<div><dt>${esc(k.name)}</dt><dd>${esc(k.text)}</dd></div>`).join("");
  const secs = d.sections.map(s => `<details><summary>${esc(s.title)}</summary><div class="body prose">${s.html}</div></details>`).join("");
  return `
  <section class="tribe-head">
    <div class="panel">
      <div class="eyebrow">Tribe ${id}</div>
      <h2>${esc(c.hook||"")}</h2>
      <p class="lede">${esc(c.coreRule||"")}</p>
      <p class="muted" style="margin:0">${esc(c.playPattern||"")}</p>
      ${(c.distinct||[]).length ? `<ul class="plain">${c.distinct.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </div>
    <div class="panel"><div class="eyebrow">Keywords and terms</div><dl class="gloss">${gloss}</dl></div>
  </section>
  <section>
    <div class="controls">
      <span class="lbl">Show</span>
      <button class="tog gold" id="gold-toggle" aria-pressed="${golden}">Golden versions</button>
      <span class="lbl" style="margin-left:10px">Tier</span>
      <button class="tog" data-tier="0" aria-pressed="${!tierFilter}">All</button>
      ${tiers.map(t => `<button class="tog" data-tier="${t}" aria-pressed="${tierFilter===t}">${t}</button>`).join("")}
    </div>
    ${rows}
  </section>
  ${d.extras ? `<details open><summary>Tokens, spells and trinkets</summary><div class="body prose">${decorate(d.extras, kr)}</div></details>` : ""}
  <details><summary>Full identity text</summary><div class="body prose">${d.identity}</div></details>
  ${secs}`;
}

function sideBySide(){
  const maxT = Math.max(...IDS.flatMap(i => DATA[i].cards.map(c => c.tier)));
  let html = `<div class="h">Tier</div>` + IDS.map(i => `<div class="h"><a href="#tribe-${i}">Tribe ${i}</a><small>${esc(ct(i).hook||"")}</small></div>`).join("");
  for (let t = 1; t <= maxT; t++){
    html += `<div class="t">${t}</div>` + IDS.map(i => {
      const kr = kwRegex(i);
      return `<div>${DATA[i].cards.filter(c => c.tier === t).map(c => `<div class="mini"><div class="mn">${esc(c.name)}<span>${golden?c.gatk:c.atk}/${golden?c.ghp:c.hp}</span></div>${decorate(c.text, kr)}${golden && c.golden ? `<div class="muted"><b>Golden:</b> ${decorate(c.golden, kr)}</div>`:""}</div>`).join("")}</div>`;
    }).join("");
  }
  return `<section><div class="eyebrow">Side by side</div><h2>Every minion, by tier</h2>
    <div class="controls"><button class="tog gold" id="gold-toggle" aria-pressed="${golden}">Golden versions</button></div>
    <div class="scroll"><div class="sbs">${html}</div></div></section>`;
}

function render(){
  const h = location.hash.slice(1) || "overview";
  const m = h.match(/^tribe-([1-5])$/);
  const view = m ? h : (h === "side-by-side" ? h : "overview");
  renderNav(view);
  $("#view").innerHTML = m ? tribe(m[1]) : view === "side-by-side" ? sideBySide() : overview();
  hideTip();
}
document.addEventListener("click", e => {
  const g = e.target.closest("#gold-toggle");
  if (g){ golden = !golden; try{ localStorage.setItem("ogre-golden", golden?"1":"0"); }catch(err){} render(); return; }
  const t = e.target.closest("[data-tier]");
  if (t){ tierFilter = +t.dataset.tier; render(); }
});
window.addEventListener("hashchange", () => { tierFilter = 0; render(); window.scrollTo(0,0); });

const tip = $("#tip");
function showTip(el){
  tip.innerHTML = `<b>${esc(el.dataset.k)}</b>${esc(el.dataset.d)}`; tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, hgt = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - w - 8), y = r.bottom + 8;
  if (y + hgt > innerHeight - 8) y = r.top - hgt - 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(){ tip.hidden = true; }
document.addEventListener("mouseover", e => { const k = e.target.closest(".kw"); k ? showTip(k) : hideTip(); });
document.addEventListener("focusin", e => { const k = e.target.closest(".kw"); k ? showTip(k) : hideTip(); });
window.addEventListener("scroll", hideTip, {passive:true});
render();
</script>
