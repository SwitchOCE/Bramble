<style>
/* Layout: sticky view switcher; overview → per-tribe card wall grouped by tier rows → side-by-side tier grid. */
:root{
  --bg:#ecefe7; --surface:#f8faf4; --card:#fffffb; --ink:#1d2219; --muted:#5b6455; --line:#cdd3c4;
  --accent:#8a5a12; --accent-soft:#f1e3c8; --gold:#b98a16; --gold-soft:#f6ecc9;
  --atk:#b5781c; --hp:#a8382f; --kw:#2f5d4a; --heat:#3d6b52;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-card:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1b2018; --card:#222820; --ink:#e6eadd; --muted:#9ba393; --line:#353d30;
  --accent:#dba04a; --accent-soft:#3a2f1c; --gold:#e2b84a; --gold-soft:#3b331b;
  --atk:#e0a043; --hp:#e06a5d; --kw:#8fd0b0; --heat:#6fb08c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1b2018; --card:#222820; --ink:#e6eadd; --muted:#9ba393; --line:#353d30;
  --accent:#dba04a; --accent-soft:#3a2f1c; --gold:#e2b84a; --gold-soft:#3b331b;
  --atk:#e0a043; --hp:#e06a5d; --kw:#8fd0b0; --heat:#6fb08c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:15px/1.55 var(--f-body)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
.wrap{max-width:1240px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:5}
header.top .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; padding-block:12px}
h1{font:800 22px/1.1 var(--f-display); margin:0; letter-spacing:-.01em}
h1 small{display:block; font:500 12px/1.3 var(--f-body); color:var(--muted); letter-spacing:0}
nav.views{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}
nav.views a{font:600 15px/1 var(--f-card); letter-spacing:.04em; text-transform:uppercase; text-decoration:none; color:var(--muted); padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card)}
nav.views a[aria-current="page"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
nav.views a:focus-visible, button:focus-visible, .kw:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
main .wrap{padding-block:24px 64px; display:grid; gap:28px}
h2{font:800 26px/1.15 var(--f-display); margin:0; text-wrap:balance}
h3{font:600 20px/1.2 var(--f-display); margin:0}
.eyebrow{font:600 13px/1 var(--f-card); letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
.lede{max-width:68ch; color:var(--ink); margin:0}
.muted{color:var(--muted)}
section{display:grid; gap:14px; min-width:0}

/* overview tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.tile{display:grid; gap:6px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; text-decoration:none; color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .num{font:700 30px/1 var(--f-card); color:var(--accent)}
.tile .hook{font-weight:600}
.tile .kws{display:flex; flex-wrap:wrap; gap:4px}
.chip{font:600 13px/1 var(--f-card); letter-spacing:.03em; padding:4px 7px; border-radius:5px; background:var(--accent-soft); color:var(--ink)}
ul.plain{margin:0; padding-left:1.1em; display:grid; gap:4px; max-width:80ch}

/* tables */
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--card)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
thead th{font:600 14px/1.2 var(--f-card); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:var(--surface); position:sticky; top:0}
tbody th{font-weight:600; min-width:150px}
td.empty{color:var(--line)}
td.empty::after{content:"—"}
.matrix td{min-width:150px}
.heat td{text-align:center; font:600 16px/1 var(--f-card); font-variant-numeric:tabular-nums; min-width:44px}
.heat td span{display:inline-grid; place-items:center; width:34px; height:28px; border-radius:5px}

/* tribe view */
.tribe-head{display:grid; gap:10px; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:820px){.tribe-head{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:10px; align-content:start; min-width:0}
.gloss{display:grid; gap:8px; margin:0}
.gloss div{display:grid; gap:2px}
.gloss dt{font:700 16px/1.1 var(--f-card); letter-spacing:.03em; color:var(--kw)}
.gloss dd{margin:0; font-size:13.5px}
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.controls .lbl{font:600 13px/1 var(--f-card); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:4px}
button.tog{font:600 14px/1 var(--f-card); letter-spacing:.04em; padding:7px 11px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer}
button.tog[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
button.tog.gold[aria-pressed="true"]{background:var(--gold); color:#1d1a10; border-color:var(--gold)}
.tier-row{display:grid; gap:10px}
.tier-label{display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--line); padding-bottom:6px}
.tier-label b{font:700 20px/1 var(--f-card); letter-spacing:.04em; text-transform:uppercase}
.tier-label .pips{color:var(--accent); letter-spacing:2px; font-size:13px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:14px}

/* the card */
.card{position:relative; display:grid; grid-template-rows:auto auto 1fr auto; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 12px 10px; min-height:270px; gap:8px; min-width:0}
.card.is-gold{border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft)}
.card .tier{position:absolute; top:-10px; left:-8px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:var(--bg); font:700 17px/1 var(--f-card)}
.card .name{font:700 19px/1.05 var(--f-card); letter-spacing:.01em; text-align:center; padding:4px 10px 0; text-wrap:balance}
.card .type{font:600 11.5px/1 var(--f-card); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); text-align:center}
.card .text{font-size:13.5px; line-height:1.45; background:var(--surface); border-radius:8px; padding:9px 10px; align-self:stretch; display:grid; align-content:center; gap:6px; min-width:0; overflow-wrap:anywhere}
.card .text strong{font-weight:600}
.card .gline{border-top:1px dashed var(--gold); padding-top:6px; font-size:12.5px}
.card .gline b{font:700 12px/1 var(--f-card); letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-right:4px}
.card .stats{display:flex; justify-content:space-between; align-items:center}
.stat{display:flex; align-items:center; gap:6px; font:700 22px/1 var(--f-card); font-variant-numeric:tabular-nums}
.stat i{font:600 10.5px/1 var(--f-card); font-style:normal; letter-spacing:.14em; color:var(--muted)}
.stat .gem{width:36px; height:36px; display:grid; place-items:center; color:#fff}
.stat.atk .gem{background:var(--atk); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.stat.hp .gem{background:var(--hp); border-radius:50% 50% 50% 50% / 40% 40% 60% 60%}
.kw{color:var(--kw); font-weight:600; text-decoration:underline dotted; text-underline-offset:3px; cursor:help}
#tip{position:fixed; z-index:20; max-width:300px; background:var(--ink); color:var(--bg); font-size:13px; line-height:1.45; padding:9px 11px; border-radius:8px; pointer-events:none}
#tip b{display:block; font:700 15px/1.1 var(--f-card); letter-spacing:.04em; margin-bottom:3px}

details{background:var(--surface); border:1px solid var(--line); border-radius:10px}
summary{cursor:pointer; padding:12px 16px; font:700 17px/1.2 var(--f-card); letter-spacing:.06em; text-transform:uppercase}
details .body{padding:0 16px 14px; max-width:84ch; overflow-x:auto}
details .body table{font-size:13px}
.prose p,.prose li{max-width:80ch}
.prose h3{font:700 16px/1.2 var(--f-card); letter-spacing:.06em; text-transform:uppercase; margin-top:14px}

/* side by side */
.sbs{display:grid; grid-template-columns:70px repeat(5,minmax(230px,1fr)); min-width:1220px}
.sbs > div{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px; display:grid; gap:6px; align-content:start}
.sbs .h{position:sticky; top:0; background:var(--surface); font:700 16px/1.2 var(--f-card); letter-spacing:.04em; z-index:1}
.sbs .h small{display:block; font:500 12.5px/1.3 var(--f-body); color:var(--muted); letter-spacing:0}
.sbs .t{font:700 22px/1 var(--f-card); color:var(--accent); text-align:center; background:var(--surface)}
.mini{background:var(--surface); border-radius:7px; padding:6px 8px; font-size:12.5px; line-height:1.4}
.mini .mn{display:flex; justify-content:space-between; gap:6px; font:700 14.5px/1.15 var(--f-card)}
.mini .mn span{font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s, box-shadow .2s}}
</style>

<script>
const DATA = {"1": {"identity": "<p><strong>The fantasy.<\/strong> Among ogres, might makes right. The biggest brute wears the crown, everyone else pays him tribute, and every ogre is watching for the moment to knock him down and take it. Ogres also hire out as muscle to anyone strong enough to pay. And now and then an ogre is born with two heads that never agree.<\/p>\n<p><strong>Core mechanic: the Chieftain.<\/strong>\n- <strong>Chieftain:<\/strong> your minion with the highest Attack, of any type, shown with a crown. It is checked again after every effect and every death. On a tie, the current Chieftain keeps the crown. If none of the tied minions holds it, the leftmost takes it.\n- <strong>Heir:<\/strong> the minion that would be Chieftain if the Chieftain were gone.\n- <strong>Tribute +X/+Y:<\/strong> give your Chieftain +X/+Y. Tribute in the Recruit Phase is permanent. Tribute in combat lasts for that combat only, unless the card says otherwise.\n- <strong>Usurp (new keyword):<\/strong> triggers when the crown passes to this minion from another minion, whether that minion died, lost Attack or was overtaken. It does not trigger at the start of combat or when this is your only minion. Each minion's Usurp triggers at most once per Recruit turn and once per combat.\n- <strong>Two-Headed (new keyword):<\/strong> the card has a <strong>Brute<\/strong> head and a <strong>Cunning<\/strong> head. They take turns each time the effect triggers, starting with Brute. A golden Two-Headed minion triggers both heads every time. If an effect is repeated (a doubled Deathrattle, Reborn, and so on), the second trigger uses the other head.<\/p>\n<p><strong>How the tribe plays.<\/strong> Ogres don't need to be the strongest minion on your board. They feed whoever is. Most Ogres send stats to the Chieftain, and that can be your Dragon, your Demon or your Deity. The rest of the tribe is about who holds the crown. You can steer it with Grog, sell the king to pass his strength on, set your own minions fighting each other, and line up heirs whose Usurp effects fire when the king falls mid-combat. One Ogre player builds one huge king with Taunt-proof succession behind him. Another builds a fragile king on purpose, so that his death sets off a chain of Usurps. A third uses the two-headed ogres, whose alternating heads pay off with any effect that triggers twice.<\/p>", "cards": [{"name": "Gordunni Thug", "tier": 1, "atk": 2, "hp": 2, "text": "Battlecry: Tribute +1/+1.", "gatk": 4, "ghp": 4, "golden": "Tribute +2/+2."}, {"name": "Crushridge Upstart", "tier": 1, "atk": 1, "hp": 3, "text": "Usurp: Gain +1/+1 permanently.", "gatk": 2, "ghp": 6, "golden": "Gain +2/+2 permanently."}, {"name": "Dunemaul Sellsword", "tier": 1, "atk": 2, "hp": 2, "text": "Battlecry: Tribute +1/+1 for each minion type among your other minions.", "gatk": 4, "ghp": 4, "golden": "+2/+2 for each."}, {"name": "Bickering Bruiser", "tier": 1, "atk": 2, "hp": 2, "text": "Two-Headed. Deathrattle: <strong>Brute:<\/strong> Tribute +2/+2. <strong>Cunning:<\/strong> Give your Heir +3 Attack.", "gatk": 4, "ghp": 4, "golden": "Both heads."}, {"name": "Gordok Brewmaster", "tier": 2, "atk": 2, "hp": 3, "text": "Battlecry and Usurp: Get a Gordok Green Grog.", "gatk": 4, "ghp": 6, "golden": "Get 2."}, {"name": "Stonemaul Bodyguard", "tier": 2, "atk": 2, "hp": 5, "text": "Taunt. Whenever this takes damage, Tribute +1 Attack.", "gatk": 4, "ghp": 10, "golden": "Tribute +2 Attack."}, {"name": "Bloodmaul Gronn-Worshipper", "tier": 2, "atk": 2, "hp": 3, "text": "At the end of your turn, Tribute +1/+1, or +2/+2 if your Chieftain isn't an Ogre.", "gatk": 4, "ghp": 6, "golden": "+2/+2, or +4/+4."}, {"name": "Ogre Magus Initiate", "tier": 2, "atk": 2, "hp": 3, "text": "Two-Headed. At the end of your turn: <strong>Brute:<\/strong> Tribute +2/+2. <strong>Cunning:<\/strong> Get a Gordok Green Grog.", "gatk": 4, "ghp": 6, "golden": "Both heads."}, {"name": "Glopgut Glutton", "tier": 2, "atk": 3, "hp": 2, "text": "Whenever you sell a minion, Tribute its Attack.", "gatk": 6, "ghp": 4, "golden": "Tribute twice its Attack."}, {"name": "Gordunni Challenger", "tier": 3, "atk": 5, "hp": 3, "text": "Start of Combat: If this isn't your Chieftain, it attacks your Chieftain. Usurp: Gain +2/+2 permanently.", "gatk": 10, "ghp": 6, "golden": "Gain +4/+4 permanently."}, {"name": "Mok'nathal Outrider (Ogre/Beast)", "tier": 3, "atk": 3, "hp": 4, "text": "Whenever you summon another Beast, Tribute +1/+1.", "gatk": 6, "ghp": 8, "golden": "Tribute +2/+2."}, {"name": "Twilight's Hammer Devotee (Ogre/Aberration)", "tier": 3, "atk": 4, "hp": 3, "text": "Deathrattle: Tribute +3/+3.", "gatk": 8, "ghp": 6, "golden": "Tribute +6/+6."}, {"name": "Dire Maul Champion", "tier": 3, "atk": 3, "hp": 3, "text": "Battlecry: Your Chieftain challenges the Tavern minion with the highest Health. If your Chieftain's Attack is higher, remove that minion and Tribute its stats.", "gatk": 6, "ghp": 6, "golden": "Tribute double its stats."}, {"name": "Mosh'Ogg Shakedown", "tier": 3, "atk": 3, "hp": 4, "text": "Two-Headed. At the start of your turn: <strong>Brute:<\/strong> Tribute +2/+2. <strong>Cunning:<\/strong> Gain 2 Gold.", "gatk": 6, "ghp": 8, "golden": "Both heads."}, {"name": "Captain Kromcrush", "tier": 4, "atk": 4, "hp": 6, "text": "Whenever a minion becomes your Chieftain, give it Divine Shield.", "gatk": 8, "ghp": 12, "golden": "Divine Shield and +4/+4."}, {"name": "Gog the Gronnslayer", "tier": 4, "atk": 5, "hp": 5, "text": "Usurp: Destroy the enemy minion with the highest Attack.", "gatk": 10, "ghp": 10, "golden": "Destroy the two with the highest Attack."}, {"name": "Cho'Rush the Observer", "tier": 4, "atk": 3, "hp": 6, "text": "After another friendly Two-Headed minion triggers a head, Tribute +2/+2.", "gatk": 6, "ghp": 12, "golden": "Tribute +4/+4."}, {"name": "Ko'ragh", "tier": 4, "atk": 4, "hp": 6, "text": "Usurp: Gain Divine Shield. Give your other Ogres +1/+1 permanently.", "gatk": 8, "ghp": 12, "golden": "+2/+2 permanently."}, {"name": "King Gordok", "tier": 5, "atk": 6, "hp": 7, "text": "Whenever your Chieftain dies, your new Chieftain gains half its Attack and Health.", "gatk": 12, "ghp": 14, "golden": "Gains all of its Attack and Health."}, {"name": "Phemos and Pol", "tier": 5, "atk": 6, "hp": 6, "text": "Two-Headed. Rally: <strong>Brute:<\/strong> Tribute +2/+2 permanently. <strong>Cunning:<\/strong> Give your Heir +2/+2 permanently.", "gatk": 12, "ghp": 12, "golden": "Both heads."}, {"name": "The Butcher", "tier": 5, "atk": 7, "hp": 5, "text": "Your Chieftain also damages the minions next to whatever it attacks.", "gatk": 14, "ghp": 10, "golden": "Your Chieftain and your Heir do."}, {"name": "Cho'gall", "tier": 6, "atk": 7, "hp": 7, "text": "Two-Headed. Your Two-Headed minions trigger both heads. At the end of your turn: <strong>Brute:<\/strong> Tribute +4/+4. <strong>Cunning:<\/strong> Give your Ogres +2/+2.", "gatk": 14, "ghp": 14, "golden": "Your Two-Headed minions trigger both heads twice."}, {"name": "Imperator Mar'gok", "tier": 6, "atk": 6, "hp": 8, "text": "Start of Combat: Trigger the Usurp of each of your other minions. (These triggers don't use up their once-per-combat Usurp.)", "gatk": 12, "ghp": 16, "golden": "Trigger them twice."}, {"name": "High King Maulgar", "tier": 6, "atk": 5, "hp": 10, "text": "Your Tribute effects also give their stats to your Heir.", "gatk": 10, "ghp": 20, "golden": "Also to your two minions next in line after the Chieftain."}], "extras": "<p><strong>Token (Tavern spell)<\/strong>\n- <strong>Gordok Green Grog<\/strong> (0 Gold): Give a minion +4 Attack until the end of your turn. End-of-turn effects still see the Attack, and it wears off after them. Only Ogre cards make it, and you can pass it to your teammate in Duos.<\/p>\n<p><strong>Trinkets<\/strong>\n- <strong>Gordok Tribute Chest<\/strong> (Lesser, 4 Gold): At the end of your turn, Tribute +1/+1 for each Ogre you control.\n- <strong>Highmaul Sigil<\/strong> (Greater, 6 Gold): Your minions' Usurp can trigger twice each combat.<\/p>", "sections": [{"title": "Builds", "html": "<p><strong>A. One King (Tribute stacking).<\/strong> Pick a carry from any tribe and feed it. Gronn-Worshipper, Shakedown, Initiate and Glutton scale it every turn. Kromcrush, King Gordok and Maulgar answer Venomous and destroy effects, so that losing the king doesn't lose the fight. The Butcher turns one giant attacker into a sweeper. Gronn-Worshipper pays more when the king <em>isn't<\/em> an Ogre, which pushes you to crown a Dragon or a Demon. This is the steady, Spike-friendly line.<\/p>\n<p><strong>B. Succession (Usurp chain).<\/strong> Build a king that is meant to fall: a high-Attack, low-Health minion, or one with Reborn or a Deathrattle worth triggering. Behind him, line up heirs in Attack order: Gog, Ko'ragh, Challenger and Upstart. Each death passes the crown and fires the next Usurp. Kromcrush shields every new king, and King Gordok hands each one half of the last king's stats. Imperator Mar'gok fires every Usurp at Start of Combat as well, so Gog kills the enemy's biggest minion before anyone attacks. Gordunni Challenger is the fuse. It attacks your own king at Start of Combat, which can kill him, pop his Divine Shield or trigger his Deathrattle on your timing.<\/p>\n<p><strong>C. Grog games (crown steering in the Recruit Phase).<\/strong> Grog is the Johnny tool. One Grog does several jobs:\n- It crowns a minion for the turn, so it Usurps, and so do Brewmaster (more Grog) and Upstart.\n- It sends that turn's end-of-turn Tribute to the minion you choose.\n- Kromcrush gives each minion it crowns a lasting Divine Shield.\n- When it wears off, the crown goes back to the old king, which can trigger <em>his<\/em> Usurp too.\n- Sold to Glopgut Glutton, the grogged minion pays its inflated Attack as Tribute.\n- It raises your Chieftain's Attack just before Dire Maul Champion's challenge.<\/p>\n<p><strong>D. Two Heads.<\/strong> Bruiser, Initiate, Shakedown, Phemos and Pol and Cho'gall, with Cho'Rush paying off every head that triggers. Anything that repeats an effect gives you both heads: Beast and Mech Deathrattle doublers on Bruiser, Reborn, and golden copies. Shakedown on alternate turns works like a Pirate gold engine. Cho'gall makes the whole package fire both heads at once.<\/p>\n<p><strong>Mixing in a five-tribe lobby.<\/strong> Ogres are mercenaries, so most of their power goes to other tribes' carries.\n- <strong>Dragon, Demon:<\/strong> natural kings. Dragons stack stats, and Demons grow by eating, so they stay crowned.\n- <strong>Elemental:<\/strong> Elementals buff the Tavern, and Dire Maul Champion then eats the buffed minion whole.\n- <strong>Undead:<\/strong> a Reborn king makes Challenger and the Succession build work twice. Challenger's death also counts toward Avenge.\n- <strong>Mech:<\/strong> Kromcrush gives Divine Shields, and Challenger pops your own shields to trigger Mech shield payoffs.\n- <strong>Beast:<\/strong> Mok'nathal Outrider turns token swarms into Tribute, and Deathrattle doublers trigger both of Bruiser's heads.\n- <strong>Aberration:<\/strong> Devotee and Challenger deaths count toward the Deity, and a Deity that arrives mid-combat becomes the Chieftain and Usurps the crown for the Old Gods.\n- <strong>Murloc:<\/strong> Battlecry repeats double the Thug, Sellsword and Champion. A Venomous Murloc king with The Butcher may hit three minions at once (see Risks).\n- <strong>Pirate:<\/strong> Shakedown's gold feeds Pirate gold counting.\n- <strong>Quilboar:<\/strong> Blood Gems on the king stack with Tribute.<\/p>\n<p>Dunemaul Sellsword rewards boards that mix the most types.<\/p>"}, {"title": "Risks and holes", "html": "<ul>\n<li><strong>Tall-board fragility.<\/strong> Build A loses to Venomous, destroy effects and Taunt walls. The fixes (Kromcrush, Gordok, Maulgar) sit at Tiers 4\u20136, so the build may be weak in the midgame.<\/li>\n<li><strong>The tribe may be support for other tribes rather than a tribe of its own.<\/strong> Tribute buffs any king, so the best result may be three Ogres splashed into a Dragon board. Only Ko'ragh, Cho'gall and the Lesser trinket reward a board full of Ogres. If that proves too weak, more \"your Ogres\" payoffs are needed.<\/li>\n<li><strong>Dire Maul Champion + Elementals<\/strong> could take +30/+30 in one Battlecry. It may need a cap, for example only the Tavern minion's base stats.<\/li>\n<li><strong>Grog + Glutton<\/strong> turns each 0-Gold Grog into +4 permanent Attack, at the cost of selling a minion. Watch Brewmaster Usurp loops that supply many Grogs.<\/li>\n<li><strong>Gog + Mar'gok (golden)<\/strong> destroys the enemy's two biggest minions twice at Start of Combat. That may be oppressive at Tier 6.<\/li>\n<li><strong>The Butcher + Venomous:<\/strong> does a cleave count as the \"first minion damaged\"? The rule has to be explicit (proposed: only the main target).<\/li>\n<li><strong>Tracking.<\/strong> The crown moves constantly in combat. The game needs a clear crown icon and a visible Heir marker, and players need a predictable rule for when ties keep the crown. Usurp's per-turn limit is extra rules text that Spike must learn.<\/li>\n<li><strong>Two-Headed is thin.<\/strong> Five cards plus one payoff, so Cho'Rush is often dead in the Tavern. The head each card is on must be shown on it, or the alternation is guesswork.<\/li>\n<li><strong>Gronn-Worshipper<\/strong> pays more for a non-Ogre king, which rewards <em>fewer<\/em> Ogres. That is on purpose for mixing, but it works against the tribe as a tribe.<\/li>\n<li><strong>Stonemaul Bodyguard<\/strong> and <strong>Twilight's Hammer Devotee<\/strong> are plain filler and may be weak.<\/li>\n<li><strong>Untested points:<\/strong> how Sellsword counts \"All\"-type minions, and whether the start-of-turn gold from Shakedown is too strong at Tier 3.<\/li>\n<\/ul>"}, {"title": "Design rationale", "html": "<ol>\n<li>Started from \"might makes right\": the strongest minion wears the crown, which became the Chieftain, chosen by Attack because Attack is how ogres measure strength.<\/li>\n<li>The Chieftain can be any type, because ogres are mercenaries serving stronger masters, which makes the tribe mix by nature.<\/li>\n<li>Tribute gives stats to the Chieftain, from the lore of tribute and greed. It is the tribe's basic engine.<\/li>\n<li>Usurp came from challenges for the crown. The crown changing hands, not holding it, is the event that the Johnny combos turn on.<\/li>\n<li>Ties keep the current Chieftain, so that reordering the board can't trigger Usurp for free.<\/li>\n<li>Usurp is limited to once per turn and once per combat, so that crown flip-flop loops stay bounded for balance.<\/li>\n<li>The Heir and the succession cards (Kromcrush, Gordok, Maulgar) come from Dire Maul's \"kill the king, become the king\". They also answer the tall build's weakness to Venomous.<\/li>\n<li>Gordok Green Grog and the Glutton came from grog and appetite. They turned into the Recruit Phase tools for steering the crown, each with several uses beyond its obvious one.<\/li>\n<li>Gordunni Challenger, from the gladiator arena: an ogre that fights its own king, so that triggering your own Deathrattles, shields and deaths is a deliberate tool.<\/li>\n<li>Two heads that disagree became the Brute and Cunning heads that take turns, so any repeated effect pays both, and the golden version is simply \"both heads\".<\/li>\n<li>Named figures went where the lore puts them: Gordok's court at Tiers 4\u20135, Gog's gronn-slaying as a Usurp kill, and Mar'gok and Cho'gall as the masters of the Usurp and Two-Headed engines at Tier 6.<\/li>\n<li>Dual types (Mok'nathal as Beast, Twilight's Hammer as Aberration) and the two trinkets were kept few and taken straight from the lore links.<\/li>\n<\/ol>"}]}, "2": {"identity": "<p><strong>Chieftain (rule, not a keyword).<\/strong> Your Chieftain is your minion with the highest Attack. If two are tied, the leftmost one is Chieftain. The Chieftain is rechecked at once whenever Attack changes or a minion arrives or dies, in the Recruit Phase and in combat, and a crown icon marks it. A minion of any type can be Chieftain.<\/p>\n<p><strong>Usurp (new keyword).<\/strong> Triggers when this minion becomes your Chieftain. It triggers at most once per turn in the Recruit Phase, where its effect is permanent, and once per combat. When a Chieftain dies in combat, the next-highest minion takes the crown, and that counts as becoming Chieftain.<\/p>\n<p><strong>Bicker (new keyword).<\/strong> At the end of your turn, swap this minion's Attack and Health. The two heads take turns to be in charge.<\/p>\n<p><strong>Gordok Green Grog (token spell).<\/strong> Ogres brew it, and it gets stronger the longer you keep it.<\/p>\n<p><strong>How the tribe plays.<\/strong> Might makes right: the biggest ogre on your board wears the crown, and the rest either feed it or try to take it. You have three ways to move Attack around. Grog adds Attack only. Bicker and swap effects turn Health into Attack and back. Tribute effects pour stats into whoever wears the crown. Every time the crown changes hands, Usurp effects and King Gordok pay out. Every stat you hand out therefore also decides who leads. A board you feed one tall king works against a board where the crown moves several times a turn, and the best Ogre players hold both in mind. Bicker turns Grog into Health, Mog'dorg flips the crown to the weakest minion, and a Fleshshaper can crown another tribe's carry. The tribe is built so that its pieces can be used against their obvious purpose.<\/p>", "cards": [{"name": "Gordunni Challenger", "tier": 1, "atk": 2, "hp": 2, "text": "Usurp: Gain +1/+2.", "gatk": 4, "ghp": 4, "golden": "Usurp: Gain +2/+4."}, {"name": "Grog Swiller", "tier": 1, "atk": 2, "hp": 1, "text": "Battlecry: Add a Gordok Green Grog to your hand.", "gatk": 4, "ghp": 2, "golden": "Add 2."}, {"name": "Dire Maul Tribute-Bearer", "tier": 1, "atk": 2, "hp": 1, "text": "When you sell this, give your Chieftain +2/+2.", "gatk": 4, "ghp": 2, "golden": "+4/+4."}, {"name": "Squabbling Two-Head", "tier": 1, "atk": 1, "hp": 4, "text": "Bicker. Usurp: Gain +1/+1.", "gatk": 2, "ghp": 8, "golden": "Bicker. Usurp: Gain +2/+2."}, {"name": "Ogre Magi", "tier": 2, "atk": 3, "hp": 3, "text": "Battlecry: Swap a friendly minion's Attack and Health, then give it +1/+1.", "gatk": 6, "ghp": 6, "golden": "...+2/+2."}, {"name": "Crushridge Mercenary", "tier": 2, "atk": 3, "hp": 2, "text": "Activate (1 Gold): Gain +3 Attack until next turn.", "gatk": 6, "ghp": 4, "golden": "+6 Attack."}, {"name": "Doomhammer's Guard", "tier": 2, "atk": 3, "hp": 4, "text": "After an enemy attacks your Chieftain, this attacks that enemy.", "gatk": 6, "ghp": 8, "golden": "...attacks it twice."}, {"name": "Highmaul Pit Fighter", "tier": 2, "atk": 4, "hp": 3, "text": "Rally: If this is your Chieftain, gain +1/+1 permanently.", "gatk": 8, "ghp": 6, "golden": "+2/+2 permanently."}, {"name": "Gordok Tapster", "tier": 2, "atk": 2, "hp": 3, "text": "Usurp: Add a Gordok Green Grog to your hand.", "gatk": 4, "ghp": 6, "golden": "Add 2."}, {"name": "Bladespire Fleshshaper", "tier": 3, "atk": 3, "hp": 4, "text": "Battlecry: Make a friendly minion an Ogre in addition to its other types.", "gatk": 6, "ghp": 8, "golden": "...and give it +3/+3."}, {"name": "Bloodmaul Brewer", "tier": 3, "atk": 3, "hp": 5, "text": "At the end of your turn, add a Gordok Green Grog to your hand.", "gatk": 6, "ghp": 10, "golden": "Add 2."}, {"name": "Captain Kromcrush", "tier": 3, "atk": 5, "hp": 3, "text": "After you sell a minion, give your Chieftain Attack equal to its Attack.", "gatk": 10, "ghp": 6, "golden": "Twice its Attack."}, {"name": "Ko'ragh", "tier": 3, "atk": 5, "hp": 4, "text": "Usurp: Gain Divine Shield.", "gatk": 10, "ghp": 8, "golden": "Usurp: Give Divine Shield to this and adjacent minions."}, {"name": "Twilight's Hammer Zealot (Ogre/Aberration)", "tier": 3, "atk": 4, "hp": 3, "text": "Deathrattle: Give your Chieftain +3/+3.", "gatk": 8, "ghp": 6, "golden": "+6/+6."}, {"name": "Cho'Rush the Observer", "tier": 4, "atk": 4, "hp": 6, "text": "After a friendly minion's Attack and Health are swapped, give it +2/+2.", "gatk": 8, "ghp": 12, "golden": "+4/+4."}, {"name": "Phemos, Twin of Pol", "tier": 4, "atk": 6, "hp": 3, "text": "Deathrattle: Summon Pol, a copy of this with Attack and Health swapped and no Deathrattle.", "gatk": 12, "ghp": 6, "golden": "Pol also has Divine Shield."}, {"name": "The Butcher", "tier": 4, "atk": 5, "hp": 6, "text": "Battlecry: Destroy a friendly minion. Give its stats to your Chieftain.", "gatk": 10, "ghp": 12, "golden": "Give double its stats."}, {"name": "High King Maulgar", "tier": 4, "atk": 7, "hp": 4, "text": "Usurp: Give your other Ogres +2/+2.", "gatk": 14, "ghp": 8, "golden": "+4/+4."}, {"name": "King Gordok", "tier": 5, "atk": 6, "hp": 7, "text": "After your Chieftain changes, give your Ogres +1/+1.", "gatk": 12, "ghp": 14, "golden": "+2/+2."}, {"name": "Gog the Gronnslayer", "tier": 5, "atk": 3, "hp": 9, "text": "After this attacks or is attacked by a minion with more Attack, destroy that minion. (Once per combat.)", "gatk": 6, "ghp": 18, "golden": "Twice per combat."}, {"name": "Mog'dorg the Wizened", "tier": 5, "atk": 4, "hp": 9, "text": "Your Chieftain is your <em>lowest<\/em>-Attack minion instead, and has Taunt.", "gatk": 8, "ghp": 18, "golden": "...has Taunt and +5 Health."}, {"name": "Imperator Mar'gok", "tier": 5, "atk": 7, "hp": 7, "text": "Start of Combat: Your Chieftain attacks the enemy minion with the highest Attack.", "gatk": 14, "ghp": 14, "golden": "Do this twice."}, {"name": "Cho'gall", "tier": 6, "atk": 8, "hp": 8, "text": "At the end of your turn, swap the Attack and Health of your other minions, then give them +2/+2.", "gatk": 16, "ghp": 16, "golden": "+4/+4."}, {"name": "Gruul the Dragonkiller", "tier": 6, "atk": 9, "hp": 9, "text": "At the end of your turn, each of your other Ogres gives your Chieftain +2/+2.", "gatk": 18, "ghp": 18, "golden": "+4/+4 each."}], "extras": "<p>All are Ogres. Gruul is a gronn, the ogres' ancestor and master, and he is typed Ogre.<\/p>\n<p><strong>Tokens, spell and trinkets<\/strong><\/p>\n<ul>\n<li><strong>Gordok Green Grog<\/strong> (token spell, 0 Gold): Give a minion +1 Attack. <em>Ferments:<\/em> gains +1 Attack at the start of each of your turns while it is in your hand.<\/li>\n<li><strong>Pol<\/strong> (token, Ogre): created by Phemos. It has Phemos's current stats swapped.<\/li>\n<li><strong>Altar of Storms<\/strong> (Tavern spell, Tier 2, 2 Gold): Give a minion Bicker and +2/+2.<\/li>\n<li><strong>Grog Barrel<\/strong> (Lesser trinket, 4 Gold): Your Grogs ferment twice as fast. Add a Grog to your hand now.<\/li>\n<li><strong>Tribute Chest<\/strong> (Greater trinket, 5 Gold): At the end of your turn, give your Chieftain +2/+2 for each Gold you didn't spend.<\/li>\n<\/ul>", "sections": [{"title": "Builds", "html": "<p><strong>Revolving Crown.<\/strong> Squabbling Two-Heads, Gordok Tapster, Crushridge Mercenary, Grog, Maulgar, Ko'ragh and King Gordok. The aim is to move the crown several times every turn. A Bicker minion swaps into its tall form at end of turn and takes the crown. Tapster's Usurp hands you a Grog. You cast it on someone else, the crown moves again, and King Gordok buffs all your Ogres each time. The Mercenary is a crown you can buy back for 1 Gold. In combat, every dead king passes the crown on. Ko'ragh gets a shield when his turn comes, and Maulgar pumps the rest of the court. Skill lies in ordering the changes so each Usurp minion fires once and King Gordok fires as often as possible.<\/p>\n<p><strong>One True King.<\/strong> Tribute-Bearer, Kromcrush, The Butcher, Pit Fighter, Doomhammer's Guard, Twilight Zealot, Gruul and Mar'gok. Pick one carry and feed it. The carry need not be an Ogre: crown a Divine Shield Mech, a Reborn Undead, or a Dragon you have been stacking. Kromcrush plus Ogre Magi is the trick here. Swap a 2/10 into 10/2, sell it, and the king gains +10 Attack. The Butcher can eat the king itself, which moves its stats to the heir and counts as a crown change for King Gordok. Mar'gok sends the king to duel their best minion, and Doomhammer's Guard punishes anyone who touches the king.<\/p>\n<p><strong>Two Heads.<\/strong> Ogre Magi, Bicker minions, Altar of Storms, Cho'Rush, Phemos and Cho'gall. Here the swap is the resource. Cho'Rush adds +2/+2 to every swap. Cho'gall swaps your whole board each turn. The key Johnny trick: a Bicker minion under Cho'gall swaps twice, so it ends where it started, and Cho'Rush still pays out twice. Grog cast while a Bicker minion is in its short form becomes Health after the swap. Altar of Storms on Phemos makes the twins swap places each turn.<\/p>\n<p><strong>The Wizened Wall.<\/strong> Mog'dorg, Gog and Mar'gok, with Gruul or King Gordok. Under Mog'dorg the weakest minion is king and has Taunt. Gog is built with low Attack on purpose, so he takes the crown and the Taunt and kills the first big minion that hits him. Mar'gok then sends him at their highest-Attack minion at Start of Combat. Gruul under Mog'dorg spreads tribute around: each +2/+2 lifts the current weakest minion, and someone else becomes king. Add King Gordok and one Gruul turn can move the crown six times.<\/p>\n<p><strong>In a five-tribe lobby<\/strong><\/p>\n<ul>\n<li><strong>Pirates:<\/strong> Gold feeds Mercenary activations, Tribute Chest and sell loops with Kromcrush.<\/li>\n<li><strong>Beasts:<\/strong> Low-Attack tokens take the crown under Mog'dorg. Deathrattle swarms give you a long line of heirs.<\/li>\n<li><strong>Mechs:<\/strong> A Divine Shield king, Magnetic upgrades on Gog, and a Ko'ragh heir.<\/li>\n<li><strong>Undead:<\/strong> A Reborn king dies, crowns an heir, then comes back.<\/li>\n<li><strong>Aberrations:<\/strong> The Zealot counts toward the Deity. Discard effects can throw away a Grog, at the cost of its fermented value.<\/li>\n<li><strong>Murlocs:<\/strong> Battlecry repeats make Ogre Magi swap twice. That cancels the swap but keeps both +1/+1 buffs, so it is a clean buff.<\/li>\n<li><strong>Demons, Dragons, Quilboar:<\/strong> Each grows a big minion that the tribute can crown.<\/li>\n<li><strong>Elementals:<\/strong> These connect least. Their Tavern buffs don't touch the crown.<\/li>\n<\/ul>\n<p>Fleshshaper is the universal bridge. An Ogre-Murloc gets both tribes' buffs and counts for Gruul.<\/p>"}, {"title": "Risks and holes", "html": "<ul>\n<li><strong>Readability.<\/strong> The crown moves often, especially in combat. It needs a clear crown icon and a short animation whenever it moves. Mog'dorg changing the rule mid-game will confuse opponents watching the replay.<\/li>\n<li><strong>King Gordok churn.<\/strong> Loops can't run forever: Usurp is once per turn per minion, and Grog, sells and Activates run out. But Gruul plus Mog'dorg plus King Gordok can buff the whole board many times a turn. If it is too strong, cap \"Chieftain changes\" at 5 triggers per turn.<\/li>\n<li><strong>Grog hoarding.<\/strong> Ferment has no cap. Ten old Grogs clog the hand but hit hard late. A cap of +6 is the fallback.<\/li>\n<li><strong>Bicker feel.<\/strong> On alternate turns a Bicker minion fights as a glass cannon or as a wall, which can feel like a coin flip. Spikes will want to play around it, Timmys may not. Cho'gall makes a whole board unstable if you didn't plan for it.<\/li>\n<li><strong>Gog<\/strong> with Divine Shield or Reborn is a strong answer to single-carry boards. The once-per-combat limit is the safety valve.<\/li>\n<li><strong>Mar'gok's duel<\/strong> strongly favours whoever has the bigger king. It snowballs in mirrors.<\/li>\n<li><strong>Fleshshaper<\/strong> gives minions an extra type. It needs a check against every \"your [Type]\" effect in the game.<\/li>\n<li><strong>Few high-tier Usurp minions<\/strong> (Maulgar, Ko'ragh). Revolving builds lean on cheap Usurp minions plus King Gordok, and may run out of payoffs late.<\/li>\n<li><strong>Elementals<\/strong> barely interact with Ogres.<\/li>\n<li><strong>Duos:<\/strong> passing fully fermented Grogs to a teammate may need a rule, for example that passing resets ferment.<\/li>\n<li><strong>Tone:<\/strong> the lore's slave fights are framed here as pits and gladiators.<\/li>\n<\/ul>"}, {"title": "Design rationale", "html": "<ol>\n<li>Started from Gordok Green Grog: beer as a resource that you stockpile and that ferments in hand. Holding it is a choice no other tribe has.<\/li>\n<li>Took King Gordok's tribute run, where anyone may take the throne, and made the crown go to the highest Attack, because \"might makes right\" is then visible on the board.<\/li>\n<li>Saw that Grog adds only Attack, so it moves the crown. That was the first interlock, and Attack became the stat the tribe cares about.<\/li>\n<li>Took \"kill the king, become king\" and made Usurp trigger on any succession, including in combat, so the mechanic matters in both phases.<\/li>\n<li>Took the bickering two heads and made Bicker swap Attack and Health. A swap moves the crown without adding stats, and it turns Grog into Health.<\/li>\n<li>The shared mechanic came out of those cards: who holds the most Attack. The Chieftain may be of any type, so Ogres can crown other tribes' carries.<\/li>\n<li>Tribute chests and The Butcher's cauldron gave the \"feed the king\" cards, which work against the revolving crown. Two builds came from that tension.<\/li>\n<li>Mog'dorg seeking peace became the rule-inverter: one card that rewrites the system, for Johnny.<\/li>\n<li>Gog slaying gronn became a minion that kills bigger enemies. His low Attack is deliberate so he pairs with Mog'dorg, and his ability is once per combat for Spike.<\/li>\n<li>The Highmaul arena gave Mar'gok's duel. It gives the crown a job in combat and gives Spike an answer to single carries.<\/li>\n<li>Kelgrok breeding the Mok'nathal became Fleshshaper, the bridge to other tribes.<\/li>\n<li>Mercenary, Guard, Pit Fighter and Tapster were added last to fill gaps by role. Only two tokens, one spell and two trinkets were added, to keep the extras few.<\/li>\n<\/ol>"}]}, "3": {"identity": "<p><strong>New keyword: Tribute.<\/strong> <em>Tribute: [effect]<\/em> means \"after you sell a minion next to this, [effect].\" In Duos, passing a minion next to it to your teammate also counts. Adjacency is checked at the moment of the sale. A minion sold between two Tribute Ogres triggers both, and when the board closes the gap the next minion slides in, so one Ogre can take tribute from a whole row in turn.<\/p>\n<p><strong>Sub-theme: empty spaces.<\/strong> Some Ogres scale with the empty spaces on your board. Selling for Tribute creates those spaces, so the tribe always has to choose between refilling the board and staying small.<\/p>\n<p><strong>How it plays.<\/strong> Ogres are a tribe that eats its own board. You buy cheap minions and fodder (Pit Fighter tokens), place them next to the right Ogres, and sell them. Each sale feeds whichever Ogres were beside it: stats, Gold, Grog, a Tavern discount, a copy in the Tavern, or a buff for the whole tribe. Every turn is a seating puzzle: who sits next to whom, which side, what order to sell in, and whether to refill the gaps or leave them empty for the empty-space Ogres. Late cards change the rules of Tribute itself. It can fire for every Ogre, fire in combat, copy itself to a neighbor, or be triggered by discards. The tribe also works as a toolkit for other tribes: a way to re-run Battlecries, fix minion types, break Taunts, and turn a dead minion into value.<\/p>", "cards": [{"name": "Highmaul Pitmaster", "tier": 1, "atk": 2, "hp": 1, "text": "Battlecry: Summon a 1/1 Pit Fighter.", "gatk": 4, "ghp": 2, "golden": "Summon two Pit Fighters."}, {"name": "Gordunni Glutton", "tier": 1, "atk": 2, "hp": 2, "text": "Tribute: Gain +2/+1.", "gatk": 4, "ghp": 4, "golden": "Gain +4/+2."}, {"name": "Dunemaul Debt Collector", "tier": 1, "atk": 1, "hp": 3, "text": "Tribute: Gain 1 Gold. (Once per turn.)", "gatk": 2, "ghp": 6, "golden": "Twice per turn."}, {"name": "Stonemaul Twohead", "tier": 1, "atk": 1, "hp": 2, "text": "End of Turn: Give the minion to the left of this +1 Attack and the minion to the right +1 Health.", "gatk": 2, "ghp": 4, "golden": "+2 Attack and +2 Health."}, {"name": "Mok'nathal Beastcaller (Ogre/Beast)", "tier": 2, "atk": 3, "hp": 3, "text": "Tribute: Summon a Pit Fighter in the sold minion's place. (Once per turn.)", "gatk": 6, "ghp": 6, "golden": "Twice per turn."}, {"name": "Bonebreaker Enforcer", "tier": 2, "atk": 3, "hp": 2, "text": "Battlecry: Sell the minion to the left of this. Tribute effects trigger twice for that sale.", "gatk": 6, "ghp": 4, "golden": "Three times."}, {"name": "Gordok Grog Brewer", "tier": 2, "atk": 2, "hp": 4, "text": "Tribute: Get a Gordok Green Grog. (Once per turn.)", "gatk": 4, "ghp": 8, "golden": "Twice per turn."}, {"name": "Bodyguard for Hire", "tier": 2, "atk": 3, "hp": 3, "text": "Battlecry: This also gains the minion types of a minion next to it.", "gatk": 6, "ghp": 6, "golden": "Gains the types of both neighbors."}, {"name": "Bladespire Hermit", "tier": 3, "atk": 3, "hp": 5, "text": "End of Turn: Gain +1/+1 for each empty space on your board.", "gatk": 6, "ghp": 10, "golden": "+2/+2 for each."}, {"name": "Highmaul Ringmaster", "tier": 3, "atk": 4, "hp": 4, "text": "Start of Combat: If you have fewer minions than your opponent, you attack first and your Ogres gain +2 Attack.", "gatk": 8, "ghp": 8, "golden": "Ogres gain +4 Attack."}, {"name": "Bickering Ogre Magi", "tier": 3, "atk": 3, "hp": 5, "text": "Tribute from the left: Give your other Ogres +1 Attack. Tribute from the right: Give your other Ogres +1 Health.", "gatk": 6, "ghp": 10, "golden": "+2 Attack / +2 Health."}, {"name": "Gordunni Fence (Ogre/Pirate)", "tier": 3, "atk": 4, "hp": 3, "text": "Tribute: Add a plain copy of the sold minion to the Tavern, Frozen. (Once per turn.)", "gatk": 8, "ghp": 6, "golden": "Twice per turn."}, {"name": "Warmaul Chain-Boss", "tier": 3, "atk": 3, "hp": 4, "text": "At the start of your turn, summon a Pit Fighter.", "gatk": 6, "ghp": 8, "golden": "Summon two."}, {"name": "Gordunni Challenger", "tier": 4, "atk": 5, "hp": 6, "text": "Always attacks the enemy minion with the highest Attack, ignoring Taunt. After this kills a minion, permanently gain +1/+1.", "gatk": 10, "ghp": 12, "golden": "Permanently gain +2/+2."}, {"name": "Ogre Mound-Matron", "tier": 4, "atk": 4, "hp": 5, "text": "Deathrattle: Summon a 3/3 Mound Whelp for each empty space on your board (up to 3).", "gatk": 8, "ghp": 10, "golden": "Summon 6/6 Whelps."}, {"name": "Gordok Pretender", "tier": 4, "atk": 4, "hp": 5, "text": "Tribute: Your next Tavern upgrade costs (1) less.", "gatk": 8, "ghp": 10, "golden": "Costs (2) less."}, {"name": "Cho'Rush the Observer", "tier": 4, "atk": 4, "hp": 6, "text": "Tribute: Discover a Tavern spell. (Once per turn.)", "gatk": 8, "ghp": 12, "golden": "Twice per turn."}, {"name": "High King Maulgar", "tier": 5, "atk": 6, "hp": 6, "text": "Tribute: Gain the sold minion's Attack and Health. (Once per turn.)", "gatk": 12, "ghp": 12, "golden": "Twice per turn."}, {"name": "Cho'gall, Twilight Prophet (Ogre/Aberration)", "tier": 5, "atk": 5, "hp": 7, "text": "When you discard a card, trigger the Tribute of the minions next to this. When you sell a minion next to this, it counts as discarded.", "gatk": 10, "ghp": 14, "golden": "Each triggers twice."}, {"name": "Phemos and Pol", "tier": 5, "atk": 6, "hp": 8, "text": "Has the Tribute effects of the Ogres next to it.", "gatk": 12, "ghp": 16, "golden": "Triggers them twice."}, {"name": "Ko'ragh, Breaker of Magic", "tier": 5, "atk": 6, "hp": 7, "text": "Start of Combat: For each empty space on your board, give a random Ogre without Divine Shield Divine Shield.", "gatk": 12, "ghp": 14, "golden": "Also gives each one +4/+4."}, {"name": "Imperator Mar'gok", "tier": 6, "atk": 8, "hp": 8, "text": "End of Turn: Give your other minions +2/+2 for each empty space on your board.", "gatk": 16, "ghp": 16, "golden": "+4/+4 for each."}, {"name": "King Gordok", "tier": 6, "atk": 7, "hp": 9, "text": "Whenever you sell any minion, trigger the Tribute of all your minions, wherever they are.", "gatk": 14, "ghp": 18, "golden": "Triggers twice."}, {"name": "The Butcher", "tier": 6, "atk": 9, "hp": 7, "text": "Your Tribute effects also trigger in combat when a minion next to them dies. (Effects that give Gold, cards or Tavern discounts do nothing in combat.)", "gatk": 18, "ghp": 14, "golden": "Trigger twice."}], "extras": "<p>All are Ogres unless another type is shown. \"Once per turn\" limits reset each Recruit Phase. Golden versions have double stats.<\/p>\n<p><strong>Tokens and extras (kept few):<\/strong>\n- <strong>Pit Fighter<\/strong> (token, 1/1, no type): \"Selling this gives no Gold.\"\n- <strong>Mound Whelp<\/strong> (token, Ogre, 3/3).\n- <strong>Gordok Green Grog<\/strong> (Tavern spell token, 0 Gold): \"Give a minion +2/+2.\"\n- <strong>Chain Gang<\/strong> (Tavern spell, Tier 2, 1 Gold, in lobbies with Ogres): \"Summon two Pit Fighters.\"\n- <strong>Altar of Storms<\/strong> (Lesser Trinket, 3 Gold): \"Your first Tribute each turn triggers twice.\"\n- <strong>Gordok Tribute Chest<\/strong> (Greater Trinket, 5 Gold): \"End of Turn: Give your Ogres +1/+1 for each minion you sold this turn.\"<\/p>", "sections": [{"title": "Builds", "html": "<p><strong>A. The Tribute Table (wide selling engine).<\/strong> Fodder makers (Pitmaster, Chain-Boss, Beastcaller, Chain Gang) feed a row of Tribute Ogres. The standard seating is <em>Glutton, fodder, Bickering Magi, fodder, Debt Collector<\/em>, with Beastcaller refilling one gap each turn. Phemos and Pol sits between two strong Tribute Ogres and fires both of their effects. King Gordok removes adjacency entirely, so every sale triggers every Ogre, and the Greater Trinket turns the number of sales into stats for the whole tribe. Its weak point is time: the engine is slow to assemble, and it is thin in combat until Bickering Magi has stacked.<\/p>\n<p><strong>B. Elbow Room (go tall).<\/strong> Sell down to four or five minions and keep the gaps. Hermit and Mar'gok grow every turn from the empty spaces, Ringmaster makes your smaller board attack first, Ko'ragh turns the gaps into Divine Shields, and Mound-Matron fills them when she dies. Challenger kills the opponent's biggest threat. The empty spaces also help summon-heavy partners, because Beast and Undead Deathrattle tokens have room to land. This build is Spike's: few pieces and clear numbers.<\/p>\n<p><strong>C. The Butcher's Pit (Tribute in combat).<\/strong> The Butcher makes Glutton, Bickering Magi and Maulgar grow in combat whenever a neighbor dies. Pair them with minions that die and come back: Undead Reborn, Beast Deathrattle tokens, Mech Divine Shields. Beastcaller then summons a fresh Pit Fighter beside them in combat, which will die and trigger them again. Maulgar placed next to a Reborn minion takes its stats twice.<\/p>\n<p><strong>D. The Fence (Ogres as a toolkit for other tribes).<\/strong> Ogres used outside their intended purpose:\n- <strong>Fence and Enforcer<\/strong> re-run any tribe's Battlecries. Sell a Murloc or Elemental, and a fresh, frozen copy is waiting in the Tavern to buy and Battlecry again. Elementals can also buff the copy while it sits in the Tavern, or a Demon can eat it from there.\n- <strong>Bodyguard for Hire<\/strong> becomes an Undead, Dragon or Mech next to one, so it catches that tribe's buffs to all its minions. Placed next to an All-type minion, it becomes every type.\n- <strong>Pit Fighters<\/strong> count as summons for Beast payoffs, and as bodies for Quilboar Blood Gems.\n- <strong>Grog and Cho'Rush<\/strong> supply Tavern spells, which Dragons' Chromadrakes improve.\n- <strong>Debt Collector<\/strong> next to Pirates turns their spare minions into Gold.\n- <strong>Challenger<\/strong> works as a Taunt-breaker in any build.\n- <strong>Two-heads<\/strong> buffs whatever sits on either side of it.<\/p>\n<p><strong>In a five-tribe lobby.<\/strong> Ogres take few cards from other tribes' pools and sell minions back into the pool, which slightly helps the other players. Their best partners:\n- <strong>Murlocs and Elementals:<\/strong> Battlecry and Tavern synergies through Fence.\n- <strong>Beasts and Undead:<\/strong> empty spaces for their summons, and deaths for The Butcher.\n- <strong>Aberrations:<\/strong> Cho'gall turns discards into Tribute.\n- <strong>Pirates:<\/strong> Gold.<\/p>\n<p><strong>Weakest pairing:<\/strong> Demons. Both tribes eat, and they fight over the same spare minions, but Demons eat from the Tavern and Ogres from the board.<\/p>"}, {"title": "Risks and holes", "html": "<ul>\n<li><strong>Turn time.<\/strong> Many sales each turn, plus repositioning, can push against the Recruit timer. The client needs neighbor highlights and a \"Tribute triggered\" counter, or players will misplace minions.<\/li>\n<li><strong>Multiplying triggers.<\/strong> Golden King Gordok, Phemos and Pol, Altar of Storms and Enforcer stack multipliers on top of each other. The once-per-turn limits on Gold, cards and fodder hold the economy, but the uncapped stat effects (Glutton, Bickering Magi) need a test for the worst case.<\/li>\n<li><strong>Gold loops with Pirates.<\/strong> Fence plus Debt Collector plus Pirate Gold could come close to free loops. Each limit is once per turn, but the combined Gold made per turn needs simulation.<\/li>\n<li><strong>Venomous and go-tall.<\/strong> A four-minion board is very exposed to Venomous, and Ko'ragh only partly answers it. Builds A and C refill the board, so this mostly hurts build B.<\/li>\n<li><strong>Cho'gall is narrow.<\/strong> Without Aberrations he is a 5/7 with weak text. He should be offered only when Aberrations are in the lobby, like other dual-type minions.<\/li>\n<li><strong>Bodyguard plus All-type<\/strong> may break type-count effects in ways no one has listed yet.<\/li>\n<li><strong>Ringmaster<\/strong> changes a core combat rule. Two Ringmasters, or Ringmaster against other attack-order effects, need a defined tie rule (random).<\/li>\n<li><strong>Early tempo.<\/strong> Pitmaster into Glutton gives a 4/3 plus a free trigger on turn 2. This is fine if Glutton's numbers stay small, but it needs watching.<\/li>\n<li><strong>Hole: no Taunt Ogre.<\/strong> The tribe protects its big minions only through Divine Shield and attacking first. It may need a Taunt at Tier 2 or 3 if go-tall loses too often to cleave.<\/li>\n<li><strong>Hole: Pit Fighters are dull.<\/strong> As tokens they exist only to be sold. That is the point, but Timmy gets nothing from them.<\/li>\n<\/ul>"}, {"title": "Design rationale", "html": "<ol>\n<li><strong>Gaps found:<\/strong> board size is never a choice, because every build fills seven slots, and the \"more minions attacks first\" rule and empty spaces are never resources. Selling is a dead end, worth 1 Gold and nothing else outside pivots.<\/li>\n<li><strong>More gaps:<\/strong> position matters only through Taunt and attack order; adjacency is unused as a core system. Combat targets are fully random, and no tribe can pick its fights.<\/li>\n<li><strong>One keyword, Tribute (selling a neighbor),<\/strong> because a single action touches all three gaps: it pays for selling, it empties slots, and it depends on seating.<\/li>\n<li><strong>Ogres eat the board, not the Tavern,<\/strong> to stay out of the Demons' lane.<\/li>\n<li><strong>Pit Fighters sell for no Gold,<\/strong> so fodder feeds Tribute without also becoming free economy.<\/li>\n<li><strong>Any effect that makes Gold, cards or fodder is once per turn, and golden makes it twice;<\/strong> only stat effects are uncapped. This is for Spike: the economy stays bounded.<\/li>\n<li><strong>Empty spaces became a second payoff,<\/strong> so the gaps Tribute leaves create a real decision between refilling and staying small.<\/li>\n<li><strong>I fixed go-tall's natural weaknesses (attacking second, Venomous)<\/strong> with one card each (Ringmaster, Ko'ragh) rather than making them a theme.<\/li>\n<li><strong>Economy without Gold where possible<\/strong> (Tavern upgrade discounts, Grog, Tavern copies) to avoid overlapping Pirates.<\/li>\n<li><strong>Bridges are built in deliberately:<\/strong> Beast, Pirate and Aberration dual types, Bodyguard as a type fixer, Fence for Battlecries and Elementals, Grog for Dragons, and empty spaces for summoners. This is for Johnny's off-label uses.<\/li>\n<li><strong>The late game bends the rules rather than adding bigger numbers:<\/strong> Phemos and Pol, King Gordok, The Butcher and Cho'gall each change how Tribute works.<\/li>\n<li><strong>Names and flavor came last,<\/strong> mapped to roles: Gordunni greed for economy, Highmaul's arena for fodder and fights, two heads for the left/right cards, and the Imperators and kings as rule-changers.<\/li>\n<\/ol>"}]}, "4": {"identity": "<p><strong>Core mechanic: the Chieftain.<\/strong> Your <strong>Chieftain<\/strong> is your minion with the highest Attack. It can be any minion type. A crown icon marks it in both phases. The crown moves only when another minion's Attack goes <em>strictly<\/em> above the Chieftain's, or when the Chieftain dies or is sold. Then the highest remaining minion takes it (leftmost wins a tie). Ogre text refers to the crown in three ways:<\/p>\n<ul>\n<li><strong>Tribute (X):<\/strong> Give your Chieftain +X/+X. A minion can pay Tribute to itself if it is the Chieftain.<\/li>\n<li><strong>Usurp:<\/strong> Triggers when this minion becomes your Chieftain. A minion's Usurp can fire at most once per Recruit Phase and once per combat.<\/li>\n<li><strong>Crowned:<\/strong> This text works only while this minion is your Chieftain.<\/li>\n<\/ul>\n<p>One design rule keeps the crown stable: no Crowned effect ever changes another minion's Attack. Without it, the crown could pass back and forth forever.<\/p>\n<p><strong>How the tribe plays.<\/strong> Tribute piles stats onto one minion. Usurp pays you each time the crown changes hands. These two pull against each other, and that tension is the tribe. A Tribute player builds one huge king and protects it. A Usurp player keeps the crown moving: they swap Attack around in the Recruit Phase and let kings fall in combat, because every death of a Chieftain crowns someone new and fires their Usurp. Since the Chieftain can be any minion, Ogres can also serve another tribe's carry as hired muscle. The tools that move the crown (swapping Attack, swapping Attack with Health, passing on the Attack of a dead or sold king) also work on non-Ogres. Much of the tribe's depth comes from aiming them at things they weren't written for.<\/p>", "cards": [{"name": "Gordunni Tribute-Bearer", "tier": 1, "atk": 2, "hp": 1, "text": "<strong>Battlecry:<\/strong> Tribute 1.", "gatk": 4, "ghp": 2, "golden": "Tribute 2."}, {"name": "Grog Slinger", "tier": 1, "atk": 2, "hp": 2, "text": "<strong>Battlecry:<\/strong> Give another friendly minion +2 Attack. If it becomes your Chieftain, give it +2 Health too.", "gatk": 4, "ghp": 4, "golden": "+4 Attack, then +4 Health."}, {"name": "Mound Bouncer", "tier": 1, "atk": 2, "hp": 3, "text": "<strong>Crowned:<\/strong> Taunt.", "gatk": 4, "ghp": 6, "golden": "Same text."}, {"name": "Bickering Two-Head", "tier": 2, "atk": 3, "hp": 2, "text": "<strong>Battlecry:<\/strong> Swap the Attack of another friendly minion and your Chieftain.", "gatk": 6, "ghp": 4, "golden": "Swap, then give both +2 Attack."}, {"name": "Arena Upstart", "tier": 2, "atk": 2, "hp": 3, "text": "<strong>Usurp:<\/strong> Gain +2/+2.", "gatk": 4, "ghp": 6, "golden": "+4/+4."}, {"name": "Crushridge Tax-Taker", "tier": 2, "atk": 2, "hp": 3, "text": "At the end of your turn, Tribute 1.", "gatk": 4, "ghp": 6, "golden": "Tribute 2."}, {"name": "Dunemaul Sellsword", "tier": 2, "atk": 3, "hp": 3, "text": "Your Tributes give an extra +1/+1 to a non-Ogre Chieftain.", "gatk": 6, "ghp": 6, "golden": "Extra +2/+2."}, {"name": "Ogre Magus", "tier": 3, "atk": 2, "hp": 5, "text": "<strong>Activate (1):<\/strong> Swap a friendly minion's Attack and Health.", "gatk": 4, "ghp": 10, "golden": "Activate (0)."}, {"name": "Gordok Flatterer", "tier": 3, "atk": 3, "hp": 3, "text": "After you Tribute, this gains +1/+1.", "gatk": 6, "ghp": 6, "golden": "+2/+2."}, {"name": "Warmaul Herald", "tier": 3, "atk": 3, "hp": 4, "text": "<strong>Usurp:<\/strong> Give your other minions +2 Attack.", "gatk": 6, "ghp": 8, "golden": "+4 Attack."}, {"name": "Mok'nathal Brawler", "tier": 3, "atk": 4, "hp": 3, "text": "<strong>Crowned:<\/strong> Windfury.", "gatk": 8, "ghp": 6, "golden": "Crowned: Mega-Windfury."}, {"name": "Bladespire Pit-Fighter", "tier": 3, "atk": 2, "hp": 5, "text": "<strong>Rally:<\/strong> Tribute 2.", "gatk": 4, "ghp": 10, "golden": "Tribute 4."}, {"name": "Highmaul Champion", "tier": 4, "atk": 5, "hp": 4, "text": "<strong>Start of Combat:<\/strong> Your Chieftain attacks the enemy minion with the highest Attack.", "gatk": 10, "ghp": 8, "golden": "It attacks the two highest, one after the other."}, {"name": "Stonemaul Mercenary", "tier": 4, "atk": 4, "hp": 5, "text": "At the end of your turn, Tribute 2. If your Chieftain isn't an Ogre, gain 1 Gold next turn.", "gatk": 8, "ghp": 10, "golden": "Tribute 4; 2 Gold."}, {"name": "Cho'Rush the Observer", "tier": 4, "atk": 3, "hp": 5, "text": "Whenever your Chieftain changes, this gains +1/+1 permanently.", "gatk": 6, "ghp": 10, "golden": "+2/+2."}, {"name": "Altar-Born Twinhead", "tier": 4, "atk": 2, "hp": 7, "text": "Counts as having double Attack when choosing your Chieftain.", "gatk": 4, "ghp": 14, "golden": "Triple."}, {"name": "Mog'dorg the Wizened", "tier": 4, "atk": 4, "hp": 5, "text": "<strong>Crowned:<\/strong> Your Tributes also give +1/+1 to the minions next to this.", "gatk": 8, "ghp": 10, "golden": "+2/+2."}, {"name": "Captain Kromcrush", "tier": 5, "atk": 5, "hp": 6, "text": "Whenever your Chieftain dies or is sold, your new Chieftain gains its Attack.", "gatk": 10, "ghp": 12, "golden": "Its Attack and Health."}, {"name": "Phemos and Pol", "tier": 5, "atk": 6, "hp": 5, "text": "<strong>Usurp:<\/strong> Gain +3/+3. In combat, attack immediately.", "gatk": 12, "ghp": 10, "golden": "+6/+6; in combat, attack immediately twice."}, {"name": "High King Maulgar", "tier": 5, "atk": 5, "hp": 6, "text": "Your other Ogres have \"At the end of your turn, Tribute 1.\"", "gatk": 10, "ghp": 12, "golden": "Tribute 2."}, {"name": "Ko'ragh", "tier": 5, "atk": 4, "hp": 7, "text": "At the Start of Combat, and whenever your Chieftain changes, give your Chieftain Divine Shield (up to 3 times per combat).", "gatk": 8, "ghp": 14, "golden": "Up to 6 times."}, {"name": "Cho'gall", "tier": 6, "atk": 6, "hp": 8, "text": "Your lowest-Attack minion is also a Chieftain.", "gatk": 12, "ghp": 16, "golden": "Your two lowest-Attack minions are also Chieftains."}, {"name": "King Gordok", "tier": 6, "atk": 7, "hp": 7, "text": "Your Usurp effects trigger twice.", "gatk": 14, "ghp": 14, "golden": "Three times."}, {"name": "Imperator Mar'gok", "tier": 6, "atk": 5, "hp": 9, "text": "After you Tribute, give your other minions +1/+1.", "gatk": 10, "ghp": 18, "golden": "+2/+2."}], "extras": "<p>Rules notes:\n- With Cho'gall, each of your Tributes goes to every Chieftain, and Usurp fires when a minion takes either crown. The \"low\" crown moves when another minion has strictly lower Attack.\n- A Usurp that fires again because of King Gordok still counts as that minion's one Usurp for the phase.\n- Mar'gok and Mog'dorg give the Chieftain at least as much as the others, so the crown never moves because of them.<\/p>\n<p><strong>Tavern Spell<\/strong>\n- <strong>Gordok Green Grog<\/strong> (Tier 2, 1 Gold): Give a friendly minion just enough Attack to become your Chieftain (at most +6).<\/p>\n<p><strong>Trinkets<\/strong>\n- <strong>Crude Gordok Crown<\/strong> (Lesser): Your Chieftain has Taunt.\n- <strong>Tribute Chest<\/strong> (Greater): Your Tributes give an extra +2/+2.<\/p>\n<p>No tokens.<\/p>", "sections": [{"title": "Builds", "html": "<p><strong>The Throne (tall king).<\/strong> Pick one Ogre king, usually the Brawler (Windfury) or the Pit-Fighter (its Rally Tributes itself), and feed it with the Tax-Taker, the Stonemaul Mercenary and Maulgar. The Flatterer grows beside the king. Mog'dorg, seated next to the king, spreads the Tribute to its neighbours, and Mar'gok spreads it to the whole board, so the build isn't one minion with five weak ones behind it. Ko'ragh protects the king from Venomous and other one-shots. The Champion sends the king at the enemy's biggest threat before combat starts. This is the Spike line: steady and readable.<\/p>\n<p><strong>Succession War (Usurp chain).<\/strong> Field several minions with similar Attack and keep the crown moving. Put a Mound Bouncer as a Taunt king (or use the Crude Crown) so it dies first. Each dead king crowns the next minion: the Upstart grows, the Herald gives everyone else +2 Attack, and that can push another minion over the new king and set off its Usurp. Phemos and Pol attack the moment they're crowned, Cho'Rush grows permanently with each crown change, and Kromcrush hands each dead king's Attack to its successor. King Gordok doubles every Usurp. In the Recruit Phase the Two-Head, the Grog Slinger, the Grog and the Magus set up who gets crowned next turn, because each minion's Usurp fires once per turn there too.<\/p>\n<p><strong>Mercenaries (Ogres as support).<\/strong> Crown another tribe's carry and pay Tribute to it. The Sellsword adds +1/+1 to each Tribute, the Stonemaul Mercenary pays Gold while the king isn't an Ogre, and Maulgar turns every Ogre into a Tributer. Four or five Ogres can carry a Beast, Dragon or Undead build. The Two-Head can move a big Attack onto a better body: a Divine Shield Mech, a Venomous Murloc, a Reborn Undead.<\/p>\n<p><strong>Cho'gall's Two Heads.<\/strong> Cho'gall crowns your weakest minion as well, so Tribute lands on both ends of the board. The low crown keeps moving as the weak minion grows, and each move fires another Usurp and spreads Tribute further. Upstarts and the Twinhead become kings on purpose. The Magus can flip a minion's Attack and Health to choose exactly which minion holds each crown.<\/p>\n<p><strong>In a five-tribe lobby.<\/strong> The crown reads Attack, so every tribe affects it:\n- Undead and Dragon Attack buffs move the crown on their own, which feeds Usurp for free.\n- Quilboar Blood Gems and Elemental buffs decide who will be crowned next.\n- A Mech king takes Magnetic upgrades and Divine Shield.\n- Demons eating Tavern minions gain Health, which the Magus can turn into Attack.\n- Pirate Gold pays for the Magus and the Grog.\n- An Aberration Deity joining combat with high Attack takes the crown and fires its Usurp.\n- In Duos, partners can pass the Grog and the Two-Head to set up each other's king.<\/p>"}, {"title": "Risks and holes", "html": "<ul>\n<li><strong>Readability.<\/strong> Players must always know who holds the crown. The crown icon, and a preview of where it will go after a buff, are required. Twinhead's \"counts as double\" and Cho'gall's second crown add hidden state.<\/li>\n<li><strong>Crowns passing back and forth.<\/strong> The Usurp cap, the tie rule and the \"Crowned never changes Attack\" rule prevent loops. Every future card needs the same check.<\/li>\n<li><strong>Tall-king fragility.<\/strong> Venomous and destroy effects punish the Throne build. Ko'ragh is the only real answer and sits at Tier 5.<\/li>\n<li><strong>Scaling.<\/strong> Maulgar with the Sellsword, Mar'gok and the Tribute Chest grows very fast in a late game. Treat the numbers as starting points.<\/li>\n<li><strong>Kromcrush on a sold king.<\/strong> It moves stats without creating them. Watch Swap followed by a sell in the same turn, which can move a big Attack onto any body for 3 Gold.<\/li>\n<li><strong>Pure-Ogre dead text.<\/strong> The Sellsword and the Stonemaul Mercenary's Gold do nothing without a non-Ogre king. That's intended, but it lowers the build's ceiling.<\/li>\n<li><strong>Phemos in the Recruit Phase.<\/strong> Its \"attack immediately\" must do nothing outside combat, and the text must make that clear.<\/li>\n<li><strong>Trinkets.<\/strong> Two isn't enough to guarantee an Ogre trinket in every offer. At least two more of each level are needed.<\/li>\n<li><strong>Pool contention.<\/strong> The Mercenary build takes Tier 2 and 4 Ogres away from the Ogre players in the same lobby.<\/li>\n<\/ul>"}, {"title": "Design rationale", "html": "<ol>\n<li>The core is a crown based on Attack, not on a resource: everything on the board already has Attack, so other tribes interact with it without asking.<\/li>\n<li>A strict-exceed tie rule, so buffs that only match the king never flicker the crown.<\/li>\n<li>I split effects into categories: generate crown changes (4), feed the king (6), pay off on Usurp (5), Crowned (3), convert the crown into Gold or stats (2), bend the rules (4). Feeding is the most common and the most basic action.<\/li>\n<li>Tribute and Usurp pull in opposite directions (stack on one minion versus move the crown), so building the tribe is a real choice, not a checklist.<\/li>\n<li>Usurp fires naturally whenever a king dies in combat, so its payoffs work from Tier 2 with no setup.<\/li>\n<li>Once-per-phase Usurp and \"Crowned never changes Attack\", to rule out loops.<\/li>\n<li>The tools that move the crown (Swap, Magus, Kromcrush, Grog) work on any minion, which invites off-label use.<\/li>\n<li>The Mercenary hook (non-Ogre king) makes Ogres a support package in other tribes' builds, which matters with five tribes per lobby.<\/li>\n<li>Tiers 3/4/5/5/4/3, with the generators early so Usurp can be set up before its payoffs arrive.<\/li>\n<li>The three Tier 6 cards each change the rules (two crowns, double Usurp, Tribute spreads to the board) rather than adding stats.<\/li>\n<li>Few extras: one spell that moves the crown, two trinkets, no tokens.<\/li>\n<li>Names came last: Gordok's court for the rules of succession, Highmaul for the arena, Maulgar and Mar'gok for rule over others, Cho'gall for the two heads that disagree about who rules.<\/li>\n<\/ol>"}]}, "5": {"identity": "<p><strong>New keyword: Devour.<\/strong> <em>Destroy a friendly minion with less Attack than this. This permanently gains its Attack and Health.<\/em><\/p>\n<p>Rules that matter:\n- <strong>Only smaller prey.<\/strong> The target must have strictly less Attack than the Devourer. The check uses current Attack, including temporary Attack.\n- <strong>It is a real death.<\/strong> A Devour in the Recruit Phase fires the eaten minion's Deathrattle and Reborn. Anything they summon or give <strong>stays<\/strong>, because no combat ends to undo it.\n- <strong>No Gold.<\/strong> You never get the 1 Gold you would have got for selling. The slot is freed either way.\n- Most Devourers carry <strong>Activate (0): Devour.<\/strong> Activate is the existing keyword, so it is free and once per turn.<\/p>\n<p><strong>How the tribe plays.<\/strong> Every Battlegrounds player reaches the moment where a minion is obsolete and gets sold for 1 Gold. Ogres offer a better rate that doesn't help you right now: put that minion's stats onto an Ogre, and turn its combat-only Deathrattle into a permanent one, at the cost of a body and the Gold. Each turn becomes an ordering puzzle. Which Ogre eats, in what order, so that its Attack climbs past the next meal? Is a Deathrattle minion worth more fighting every combat, or eaten once for keeps? Do you want seven bodies, or four huge ones? Ogres treat every other tribe's minions as ingredients. A Beast whose Deathrattle summons tokens, an Undead with Reborn, or an Elemental fattened in the Tavern can each be eaten for something its own tribe never planned.<\/p>", "cards": [{"name": "Mound Gnasher", "tier": 1, "atk": 2, "hp": 2, "text": "Activate (0): Devour.", "gatk": 4, "ghp": 4, "golden": "Activate (0): Devour. Gain double its stats."}, {"name": "Boulderfist Runt", "tier": 1, "atk": 1, "hp": 2, "text": "Deathrattle: Give a random friendly Ogre +2/+1.", "gatk": 2, "ghp": 4, "golden": "+4/+2."}, {"name": "Warmaul Herder", "tier": 1, "atk": 1, "hp": 1, "text": "Battlecry: Summon a 1/1 Talbuk Calf.", "gatk": 2, "ghp": 2, "golden": "Summon a 2/2 Talbuk Calf."}, {"name": "Gordok Brewmaster", "tier": 2, "atk": 3, "hp": 2, "text": "Battlecry: Get a Green Grog.", "gatk": 6, "ghp": 4, "golden": "Get two."}, {"name": "Bickering Ogre Magus", "tier": 2, "atk": 2, "hp": 3, "text": "Battlecry: Swap a friendly minion's Attack and Health.", "gatk": 4, "ghp": 6, "golden": "Swap them on up to two friendly minions."}, {"name": "Dunemaul Meat-Picker", "tier": 2, "atk": 3, "hp": 2, "text": "Activate (0): Devour, but gain only its Attack. Get a Leftovers with its Health.", "gatk": 6, "ghp": 4, "golden": "Gain double its Attack."}, {"name": "Bladespire Herdmaster", "tier": 2, "atk": 2, "hp": 3, "text": "Deathrattle: Summon two 1/1 Talbuk Calves.", "gatk": 4, "ghp": 6, "golden": "Summon two 2/2 Calves."}, {"name": "Bloodmaul Goader", "tier": 2, "atk": 3, "hp": 3, "text": "After a friendly Ogre Devours, give your other Ogres +1 Attack.", "gatk": 6, "ghp": 6, "golden": "+2 Attack."}, {"name": "Twilight's Hammer Ritualist", "tier": 3, "atk": 3, "hp": 5, "text": "Deathrattles of friendly minions that die in the Recruit Phase trigger an extra time.", "gatk": 6, "ghp": 10, "golden": "Two extra times."}, {"name": "Dire Maul Tribute-Taker", "tier": 3, "atk": 3, "hp": 4, "text": "After a friendly Ogre Devours, gain 1 Gold next turn (max 2 per turn).", "gatk": 6, "ghp": 8, "golden": "2 Gold (max 4)."}, {"name": "Gordunni Challenger", "tier": 3, "atk": 4, "hp": 4, "text": "Activate (0): Devour a friendly minion of <em>any<\/em> Attack. If its Attack wasn't lower than this one's, gain only half its stats (rounded down).", "gatk": 8, "ghp": 8, "golden": "Activate (0): Devour a friendly minion of any Attack."}, {"name": "Highmaul Pitfighter", "tier": 3, "atk": 4, "hp": 3, "text": "Activate (1): This and another friendly minion each deal damage equal to their Attack to the other. If exactly one dies, the survivor permanently gains +3/+3. (Damage heals at end of turn.)", "gatk": 8, "ghp": 6, "golden": "+6/+6."}, {"name": "Dreadmaul Trophy-Taker", "tier": 3, "atk": 4, "hp": 4, "text": "Activate (0): Devour. Also gain its Taunt, Divine Shield, Windfury, Venomous and Reborn.", "gatk": 8, "ghp": 8, "golden": "Also gain double its stats."}, {"name": "Altar-Born Magus", "tier": 4, "atk": 4, "hp": 5, "text": "Activate (0): Devour. This also gains its text, replacing any text it gained this way before.", "gatk": 8, "ghp": 10, "golden": "Keeps the last two texts gained."}, {"name": "Fattened Glopgut", "tier": 4, "atk": 3, "hp": 5, "text": "Deathrattle: Give your Ogres +2/+2.", "gatk": 6, "ghp": 10, "golden": "+4/+4."}, {"name": "Gorgrond Ogron", "tier": 4, "atk": 3, "hp": 6, "text": "Start of Combat: Give your Ogres +1/+2 for each empty space on your board.", "gatk": 6, "ghp": 12, "golden": "+2/+4."}, {"name": "The Butcher", "tier": 4, "atk": 5, "hp": 4, "text": "Activate (0): Devour. Split its stats evenly among your other Ogres. Get a Leftovers with the remainder.", "gatk": 10, "ghp": 8, "golden": "Split double its stats."}, {"name": "Mog'dorg the Wizened", "tier": 5, "atk": 4, "hp": 7, "text": "Once per turn, after a friendly Ogre Devours, summon a 1/1 copy of the minion it Devoured.", "gatk": 8, "ghp": 14, "golden": "Twice per turn."}, {"name": "Gronn-Blooded Overlord", "tier": 5, "atk": 6, "hp": 6, "text": "Your Ogres gain double stats from Devour.", "gatk": 12, "ghp": 12, "golden": "Triple."}, {"name": "Phemos and Pol", "tier": 5, "atk": 5, "hp": 7, "text": "Your Ogres can use each Activate twice per turn.", "gatk": 10, "ghp": 14, "golden": "Three times."}, {"name": "Mosh'Ogg Cauldron-Lord", "tier": 5, "atk": 5, "hp": 8, "text": "Taunt. Avenge (2): Gain the stats of the last friendly minion that died.", "gatk": 10, "ghp": 16, "golden": "Gain double its stats."}, {"name": "King Gordok", "tier": 6, "atk": 8, "hp": 8, "text": "Your Ogres can Devour minions in the Tavern. (Their Deathrattles trigger for you.)", "gatk": 16, "ghp": 16, "golden": "They gain double stats from Tavern meals."}, {"name": "Imperator Mar'gok", "tier": 6, "atk": 6, "hp": 9, "text": "Start of Combat: Give your Ogres +3/+3 for each minion type your Ogres have Devoured this game.", "gatk": 12, "ghp": 18, "golden": "+6/+6."}, {"name": "Gruul the Dragonkiller", "tier": 6, "atk": 9, "hp": 9, "text": "Rally: If the target has less Attack than this, Devour it instead of attacking (gains last until end of combat).", "gatk": 18, "ghp": 18, "golden": "Gain double its stats."}], "extras": "<p>Notes:\n- The Butcher's remainder goes to the Leftovers, one stat at a time. Eat a 7/8 with three other Ogres: each gets +2/+2 and you get a +1/+2 Leftovers. With <strong>no<\/strong> other Ogres, the whole minion becomes a Leftovers spell.\n- Mog'dorg's copy is a non-golden 1/1 that keeps its text. A 1/1 can be eaten by almost anything next turn.\n- Mar'gok counts Ogre, and Calves count as Beast. An \"All\" minion counts as every type in the lobby.<\/p>\n<h3>Tokens and spells<\/h3>\n<table>\n<thead>\n<tr>\n<th>Name<\/th>\n<th>Type<\/th>\n<th>Text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Talbuk Calf<\/td>\n<td>1/1 Beast token<\/td>\n<td>(none)<\/td>\n<\/tr>\n<tr>\n<td>Leftovers<\/td>\n<td>Tavern spell token, 0 Gold<\/td>\n<td>Give a minion +X/+Y (set when made).<\/td>\n<\/tr>\n<tr>\n<td>Green Grog<\/td>\n<td>Tavern spell token, 0 Gold<\/td>\n<td>Give a minion +4 Attack until the end of your turn. (It still counts for end-of-turn effects.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Trinkets<\/h3>\n<table>\n<thead>\n<tr>\n<th>Name<\/th>\n<th>Kind<\/th>\n<th>Cost<\/th>\n<th>Text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gordunni Stewpot<\/td>\n<td>Lesser<\/td>\n<td>3<\/td>\n<td>When you sell a minion, also get a Leftovers with half its stats (rounded down).<\/td>\n<\/tr>\n<tr>\n<td>Gog's Gronn-Tooth<\/td>\n<td>Greater<\/td>\n<td>5<\/td>\n<td>Your Ogres can Devour minions of any Attack.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "sections": [{"title": "Builds", "html": "<p><strong>A. Deathrattle harvest (wide).<\/strong> Core: Ritualist, Fattened Glopgut, Mog'dorg, any Devourer. Eat a Glopgut in the Recruit Phase and every Ogre gets +2/+2 for good, twice with the Ritualist. Mog'dorg hands back a 1/1 Glopgut to eat again next turn, so a one-shot meal becomes +4/+4 to the team every turn. The Pitfighter lets non-Ogre boards use the Ritualist too. It kills your own Deathrattle minions without needing an Ogre big enough to eat them. <strong>Mixes with:<\/strong> Beasts (eaten token-summoners leave permanent tokens, which are then food), Mechs (Deathrattle Mechs and Magnetic stats on cheap bodies), Undead (Reborn minions get eaten twice: once whole, once as the 1-Health return).<\/p>\n<p><strong>B. One big Ogre.<\/strong> Core: Trophy-Taker, Gruul, Gorgrond Ogron, Overlord, Goader. Pile everything onto one or two Ogres: Divine Shield from a Mech, Venomous from a Murloc, Windfury from anything. Then Gruul eats every smaller enemy it targets, and Divine Shield doesn't save them. Run four or five minions and let the Ogron's empty-space bonus make up for the missing bodies. <strong>Mixes with:<\/strong> Murlocs (Venomous, and hand buffs you then eat) and Quilboar (dump Blood Gems on a cheap minion, then eat it for concentrated stats). This build is weak to the enemy's once-per-combat Venomous and to \"destroy\" effects.<\/p>\n<p><strong>C. Buffet economy.<\/strong> Core: King Gordok, Tribute-Taker, Gnashers, Meat-Picker. Each Ogre eats once a turn straight from the Tavern, so refreshing finds you food, not purchases. The Tribute-Taker turns this turn's meals into next turn's Gold. <strong>Mixes with:<\/strong> Elementals. Their Tavern-buffing grows the Tavern minions Gordok then eats, so the Elemental player's main engine feeds your Ogres. Pirates help too, because extra Gold means more refreshes. This build competes with Demons for the same Tavern if both tribes are in the lobby.<\/p>\n<p><strong>D. Stolen minds.<\/strong> Core: Altar-Born Magus, Phemos and Pol, Bickering Magus. The Magus eats a minion of another tribe and keeps its text, which makes that text an Ogre's. Copy a non-Ogre Activate minion and Phemos and Pol now let you use it twice. Copy a Dragon's Rally onto a Windfury Ogre built by the Trophy-Taker. The golden Magus keeps two texts: one head for each.<\/p>\n<p><strong>Threshold tools used across all builds.<\/strong> The rule is \"smaller prey only\", so Attack-only effects are puzzle pieces. Green Grog lifts an Ogre past a meal for this turn. The Goader makes the next Ogre hungrier. The Bickering Magus turns a 3/14 Ogre into a 14/3 that can eat your biggest non-Ogre. It can also turn a 12/2 food minion into a 2/12, which is now edible and gives the same total stats. The Meat-Picker eats Attack only, so it climbs fastest. Its Health goes into a Leftovers you can drop on food that another Ogre will eat.<\/p>\n<p><strong>In a five-tribe lobby.<\/strong> Ogres are a glue tribe: they want other tribes' minions as ingredients more than they want an all-Ogre board. They are best with at least one Deathrattle tribe (Beast, Mech or Undead) or with Elementals. They are worst beside Demons (shared Tavern-eating, and Demons' eating already scales well) and in lobbies with heavy Venomous or Cleave. In Duos you can pass food to your teammate, and passing Leftovers lets one player's spare Health reach the other's carry.<\/p>"}, {"title": "Risks and holes", "html":
