<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>L1 Real Size</title>
<meta name="viewport" content="width=1920">
<!--
  L1 "the card is a window" at 1920x1080, built from layers.
  Switches in the address:
    view=buy|fight|shapes   shape=a|b|c|d|e   depth=1|0   bg=oak|bluebell (fight)
  Shapes (all with regular-hexagon points except e):
    a 0.56 (today's ratio)  b 0.62  c 0.69  d 0.80  e 0.69 with a flatter point
  Painted pieces are read from /data/ui-ideation/looks/L1/pieces/ (file://); each has a plain fallback.
-->
<style>
@font-face { font-family: "AlegreyaSans"; src: url("../../../../../assets/glass/fonts/AlegreyaSans-Bold.ttf"); font-weight: 700; }
:root {
  --pieces: "file:///data/ui-ideation/looks/L1/pieces/";
  --lead-hi: #4a4f4c; --lead: #232726; --lead-lo: #0e1110;
}
html, body { margin: 0; padding: 0; background: #0d0f0f; }
#screen { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #15181a; font-family: "AlegreyaSans", sans-serif; }
.abs { position: absolute; }

/* ---------- room ---------- */
.wall { background-color: #3d4246; background-size: 360px 360px; }
.table { background-color: #3b2419; overflow: hidden; }
.table .plane { position: absolute; inset: -12% -8% -4% -8%; background-color: #3b2419; background-size: 420px 420px; }
.depth .table .plane { transform-origin: 50% 100%; transform: perspective(900px) rotateX(34deg); }
.table-edge { background: linear-gradient(#2a170f, #170c08); }
.ledge { background-color: #2b1a12; background-size: 100% 100%; }
.lancet { background-color: #22303a; background-size: 100% 100%; }

/* ---------- light ---------- */
.glow { pointer-events: none; mix-blend-mode: screen; }
.shadow { pointer-events: none; }

/* ---------- cards ---------- */
.card { position: absolute; }
.card .frame, .card .win, .card .hi { position: absolute; inset: 0; }
.card .frame { background: linear-gradient(150deg, var(--lead-hi) 0%, var(--lead) 30%, var(--lead-lo) 70%, #262a29 100%); }
.card.golden .frame { background: linear-gradient(143deg, #9a5e25 0%, #ffe39a 16%, #c08636 33%, #f2c467 55%, #8d521f 78%, #ffdf8f 100%); }
.card .win { overflow: hidden; background: #0e1211; }
.card .win img { position: absolute; display: block; }
.stat { position: absolute; border-radius: 50%; display: grid; place-items: center; color: #2a2118; font-weight: 700; letter-spacing: -0.02em;
  background: radial-gradient(circle at 40% 35%, #fbf3df, #e6d6b4 60%, #c9b48d); }
.stat { box-shadow: 0 0 0 var(--rim) #1c201f, 0 0 0 calc(var(--rim) + 1px) #555b58; }
.golden .stat { box-shadow: 0 0 0 var(--rim) #d9a24a, 0 0 0 calc(var(--rim) + 1px) #fff0b8, 0 0 6px 1px #ffd27a; }
.stat span { position: relative; top: 0.04em; }
.coin { position: absolute; border-radius: 50%; display: grid; place-items: center; color: #4a2c06; font-weight: 700;
  background: radial-gradient(circle at 38% 32%, #fff2b0, #f0c24e 45%, #b9801f 80%, #8a5a12);
  box-shadow: 0 0 0 2px #5b3a0c, 0 2px 4px #0008; }
.spell { position: absolute; border-radius: 50%; overflow: hidden; }
.sparkle { position: absolute; width: 16px; height: 16px; pointer-events: none;
  background: radial-gradient(circle, #fffbe8 0 12%, transparent 13%),
              linear-gradient(90deg, transparent 46%, #fff8d8 50%, transparent 54%),
              linear-gradient(0deg, transparent 46%, #fff8d8 50%, transparent 54%);
  filter: drop-shadow(0 0 3px #ffe08a); }

/* ---------- side panels ---------- */
.roundel { position: absolute; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 4px #1c2022, 0 0 0 6px #4d5356, 0 3px 8px #000a; }
.roundel img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #2a2118;
  background: radial-gradient(circle at 40% 35%, #fbf3df, #e2d0ab 65%, #c3ad84); box-shadow: 0 0 0 3px #1c2022, 0 0 0 4px #5a6062; }
.btn { position: absolute; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 42% 36%, #4f6a73, #27363d 62%, #182227);
  box-shadow: 0 0 0 4px #1c2022, 0 0 0 6px #5a6062, 0 4px 10px #000b; }
.btn svg { width: 56%; height: 56%; }
.num { color: #f3ead6; font-weight: 700; text-shadow: 0 2px 3px #000; position: absolute; }

/* ---------- shapes sheet ---------- */
.label { position: absolute; color: #e6dcc6; font-size: 22px; line-height: 1.25; }
.label b { color: #fff; font-size: 26px; }
</style>
</head>
<body>
<div id="screen"></div>
<script>
const Q = new URLSearchParams(location.search);
const VIEW = Q.get("view") || "buy";
const SHAPE = Q.get("shape") || "c";
const DEPTH = Q.get("depth") !== "0";
const BG = Q.get("bg") || "oak";
// hand: "peek" = full size, the foot of the card below the screen edge (owner, 24 Nov);
// "half" = full size, half hidden; "small" = the earlier 0.62 scale hand
const HAND = Q.get("hand") || "peek";
// shop: "stack" = five units centred, two smaller spells stacked at the right, gold and the shop buttons at the left (owner, 24 Nov);
// "row" = the earlier single row of five units and two spells, with the buttons in the left side window
const SHOP = Q.get("shop") || "stack";
const CTRL = 84, CTRL_GAP = 12, CTRL_W = 2 * CTRL + CTRL_GAP;   // the block of gold and three buttons
const HOVER = Q.has("hover") ? +Q.get("hover") : -1;   // a hand card raised by the pointer
const PIECES = "file:///data/ui-ideation/looks/L1/pieces/";
const UNITS = "../../../../../assets/units/";
const GLASS = "../../../../../assets/glass/";

// ---------------- shapes ----------------
// a: aspect w/h; r: point rise as a fraction of width (regular hexagon: 0.2887)
const REG = Math.tan(Math.PI / 6) / 2;
const SHAPES = {
  a: { a: 0.56, r: REG, name: "0.56, regular points (today's ratio)" },
  b: { a: 0.62, r: REG, name: "0.62, regular points" },
  c: { a: 0.69, r: REG, name: "0.69, regular points" },
  d: { a: 0.80, r: REG, name: "0.80, regular points" },
  e: { a: 0.69, r: 0.18, name: "0.69, flatter points" },
};

// ---------------- the screen's fixed numbers ----------------
const W = 1920, H = 1080;
const G = 20;            // the one gap, everywhere
const SIDE = 200;        // each side lancet column
const NICHE = 12;        // light rim between card and niche
const SILL = 20;
const HAND_K = HAND === "small" ? 0.62 : 1;   // hand cards' scale
const HAND_SHOW = HAND === "half" ? 0.5 : 0.88;  // share of a hand card above the screen edge (0.88 keeps Attack and Health whole)
const LEDGE_PAD = 16;
const TABLE_PAD = HAND === "peek" ? 20 : 30;
const ARMY_GAP = 64;     // between the two armies in a fight
const SPELL_K = 0.8;     // spell disc diameter / unit width

const ledgeH = h => HAND === "small" ? LEDGE_PAD * 2 + HAND_K * h : LEDGE_PAD + HAND_SHOW * h;

function geom(shapeKey, h) {
  const s = SHAPES[shapeKey];
  const w = s.a * h, p = s.r * w;
  const th = Math.atan(p / (w / 2));
  const c = (1 - Math.sin(th) / 2) / Math.cos(th);   // nested row: extra drop per unit gap
  const rowStep = h - p + c * G;                     // top of row 1 -> top of nested row 2
  const boardH = rowStep + h;
  return { w, h, p, th, c, rowStep, boardH };
}

function fitHeight(shapeKey) {
  const C = W - 2 * SIDE - 2 * G;
  let best = 0;
  for (let h = 120; h <= 400; h += 0.5) {
    const g = geom(shapeKey, h);
    const nicheTop = NICHE / Math.cos(g.th);
    const buyH = G + nicheTop + h + NICHE + SILL + G + TABLE_PAD + g.boardH + TABLE_PAD + ledgeH(h);
    const fightH = 2 * G + 2 * g.boardH + ARMY_GAP + 2 * G;
    const shopW = SHOP === "stack" ? 5 * (g.w + 2 * NICHE) + 4 * G + 2 * (G + CTRL_W)
      : 5 * (g.w + 2 * NICHE) + 2 * (SPELL_K * g.w + 2 * NICHE) + 6 * G;
    const handW = 7 * HAND_K * g.w + 6 * G;
    const boardW = 4 * g.w + 3 * G;
    if (buyH <= H && fightH <= H && shopW <= C && handW <= C && boardW <= C) best = h;
  }
  return Math.floor(best);
}

// hexagon points for a card of w x h with point rise p, inset by d (negative = outset)
function hexPts(w, h, p, d = 0) {
  const th = Math.atan(p / (w / 2));
  const dy = d / Math.cos(th);
  const m = Math.tan(th);
  const yShoulder = m * (w / 2 - d) + dy;       // y of the upper shoulders after inset
  return [
    [w / 2, dy], [w - d, yShoulder], [w - d, h - yShoulder], [w / 2, h - dy], [d, h - yShoulder], [d, yShoulder],
  ];
}
const poly = pts => `polygon(${pts.map(([x, y]) => `${x.toFixed(2)}px ${y.toFixed(2)}px`).join(",")})`;

// ---------------- content ----------------
const shopUnits = [
  { art: "mouse/needle-page", tier: 1, a: 2, hp: 1 },
  { art: "pigeon/bugler", tier: 3, a: 4, hp: 5 },
  { art: "thorn/holly-knight", tier: 4, a: 5, hp: 7 },
  { art: "badger/marshal-of-the-red-mist", tier: 5, a: 9, hp: 9 },
  { art: "locust/brood-mother", tier: 6, a: 8, hp: 14 },
];
const shopSpells = [
  { art: "spell-forage", tier: 2, cost: 1 },
  { art: "spell-sharpen", tier: 4, cost: 3 },
];
const board = [
  { art: "badger/hedge-knight", a: 12, hp: 15 },
  { art: "mouse/fencing-master", a: 18, hp: 11, golden: true },
  { art: "pigeon/grenadier-guard", a: 9, hp: 22 },
  { art: "thorn/hawthorn-warden", a: 7, hp: 26 },
  { art: "shared/stag-beetle", a: 14, hp: 12 },
  { art: "mouse/thimble-captain", a: 10, hp: 10 },
  { art: "badger/greatsword-bearer", a: 24, hp: 19, golden: true },
];
const hand = [
  { art: "pigeon/private", a: 2, hp: 3 }, { art: "thorn/nettle-sprout", a: 1, hp: 4 },
  { art: "mouse/cousin", a: 3, hp: 2 }, { art: "shared/weasel", a: 4, hp: 3 },
  { art: "badger/brock-cub", a: 3, hp: 4 }, { art: "locust/gleaner", a: 2, hp: 2 },
];
const enemy = [
  { art: "locust/swarm-lord", a: 16, hp: 20 }, { art: "locust/sky-darkener", a: 11, hp: 17, golden: true },
  { art: "locust/war-drummer", a: 6, hp: 18 }, { art: "locust/husk-sentry", a: 5, hp: 30 },
  { art: "locust/prophet-of-the-dust", a: 13, hp: 13 }, { art: "locust/gorger", a: 19, hp: 9 },
  { art: "locust/twice-shed-veteran", a: 12, hp: 16 },
];
const portraits = ["pipkin", "old_mother_mousewife", "dame_hoolet", "little_king_wren", "march_hare", "hob_mumblecrust", "dame_farthing", "brother_bracken"];
const hp8 = [31, 28, 23, 18, 16, 16, 11, 0];

// tier light: owner, 24 Nov: calm, gentle rise from tier 1, tier 6 between tier 4 and 5
const TIER = {
  1: { c: [214, 222, 232], a: 0.30 },
  2: { c: [104, 205, 112], a: 0.34 },
  3: { c: [84, 150, 240], a: 0.38 },
  4: { c: [168, 112, 240], a: 0.42 },
  5: { c: [255, 140, 44], a: 0.52 },
  6: { c: [236, 70, 52], a: 0.47 },
};
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------------- drawing ----------------
// only=<part>: draw one named part of view=polish alone on a clear ground, for cutting the screen into movable pieces
const ONLY = Q.get("only");
let PART = "";
const scr = document.getElementById("screen");
if (DEPTH) scr.classList.add("depth");
function el(cls, x, y, w, h, parent = scr, style = "") {
  const d = document.createElement("div");
  d.className = "abs " + cls;
  d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;${style}`;
  if (parent === scr) d.dataset.part = PART;
  parent.appendChild(d);
  return d;
}
function blurShape(x, y, w, h, clip, bg, blur, parent = scr, extra = "") {
  const o = el("glow", x - blur * 2, y - blur * 2, w + blur * 4, h + blur * 4, parent, `filter:blur(${blur}px);${extra}`);
  el("", blur * 2, blur * 2, w, h, o, `clip-path:${clip};background:${bg};`);
  return o;
}
function bgImg(name, fallback) { return `background-image:url("${PIECES}${name}")${fallback ? "," + fallback : ""};`; }

// art crop: source art is 560x1000 with the picture in x 24..536, y 46..954
function placeArt(img, wi, hi, focusY = 500) {
  const srcW = 504, srcH = srcW * hi / wi;
  const sc = wi / srcW;
  let top = focusY - srcH / 2;
  top = Math.max(48, Math.min(952 - srcH, top));
  img.style.width = (560 * sc) + "px";
  img.style.height = (1000 * sc) + "px";
  img.style.left = (-28 * sc) + "px";
  img.style.top = (-top * sc) + "px";
}

function card(x, y, g, u, opts = {}) {
  const { w, h, p } = g;
  const lead = Math.max(3, Math.round(w * 0.034));
  const c = document.createElement("div");
  c.className = "card" + (u.golden ? " golden" : "");
  c.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
  const fr = document.createElement("div"); fr.className = "frame"; fr.style.clipPath = poly(hexPts(w, h, p));
  const wn = document.createElement("div"); wn.className = "win"; wn.style.clipPath = poly(hexPts(w, h, p, lead));
  const img = document.createElement("img"); img.src = UNITS + u.art + ".jpg"; placeArt(img, w, h, 520);
  wn.appendChild(img);
  c.append(fr, wn);
  // Attack and Health
  const d = Math.round(w * 0.25), rim = Math.max(2, Math.round(w * 0.022));
  const sy = h - p - d * 0.62;
  for (const [i, v] of [[0, u.a], [1, u.hp]]) {
    const s = document.createElement("div"); s.className = "stat";
    const sx = i === 0 ? w * 0.06 : w * 0.94 - d;
    s.style.cssText = `left:${sx}px;top:${sy}px;width:${d}px;height:${d}px;--rim:${rim}px;font-size:${Math.round(d * 0.6)}px;z-index:1`;
    s.innerHTML = `<span>${v}</span>`;
    c.appendChild(s);
  }
  if (u.golden) {
    const sp = document.createElement("div"); sp.className = "sparkle";
    const r = hexPts(w, h, p)[1];
    sp.style.cssText = `left:${r[0] - 10}px;top:${r[1] - 10}px;width:${Math.round(w * 0.14)}px;height:${Math.round(w * 0.14)}px;`;
    c.appendChild(sp);
  }
  if (opts.lift) { c.style.transform = `translateY(${-Math.round(h * 0.05)}px) scale(1.04)`; c.style.zIndex = 5; }
  return c;
}

// light and shadow under a standing card (the 2.5D layer)
function cardGround(x, y, g, u, parent, opts = {}) {
  if (!DEPTH) return;
  const { w, h, p } = g;
  const up = opts.lift ? h * 0.05 : 0;          // a lifted card's shadow falls further away
  const hex = poly(hexPts(w, h, p));
  // cast shadow: the card's own outline laid down on the surface in front of it
  const sh = el("shadow", x, y + h - p * 0.6 + up * 0.6, w, h, parent,
    `transform-origin:50% 0;transform:scaleY(${opts.lift ? 0.36 : 0.26}) skewX(-8deg);filter:blur(${opts.lift ? 9 : 5}px);opacity:${opts.lift ? 0.5 : 0.62};`);
  el("", 0, 0, w, h, sh, `clip-path:${hex};background:#000;`);
  // light through the glass: its own colours thrown forward onto the wood
  const pool = el("glow", x, y + h - p * 0.35, w, h, parent,
    `transform-origin:50% 0;transform:scaleY(${opts.lift ? 0.4 : 0.3}) skewX(-8deg);filter:blur(${opts.lift ? 18 : 14}px);opacity:${u.golden ? 0.6 : (opts.lift ? 0.45 : 0.32)};`);
  const inner = el("", 0, 0, w, h, pool, `clip-path:${hex};overflow:hidden;` + (u.golden ? "background:radial-gradient(ellipse at 50% 20%, #ffd27a, rgba(233,160,60,0.6) 55%, transparent 80%);" : ""));
  if (!u.golden) {
    const im = document.createElement("img"); im.src = UNITS + u.art + ".jpg";
    placeArt(im, w, h, 520); im.style.position = "absolute"; im.style.transform = "scaleY(-1)"; im.style.transformOrigin = `50% ${h / 2}px`;
    inner.appendChild(im);
  }
}

function goldenHalo(x, y, g, parent) {
  const { w, h, p } = g;
  // light from behind: a warm halo just outside the gilt lead
  const o = w * 0.05;
  blurShape(x - o, y - o, w + 2 * o, h + 2 * o, poly(hexPts(w + 2 * o, h + 2 * o, p + o * Math.tan(g.th))), "rgba(255,196,96,0.8)", Math.round(w * 0.06), parent);
}

function spellDisc(x, y, d, s) {
  const lead = Math.max(3, Math.round(d * 0.04));
  const o = el("spell", x, y, d, d, scr, `background:linear-gradient(150deg,var(--lead-hi),var(--lead) 35%,var(--lead-lo));`);
  const inner = el("spell", lead, lead, d - 2 * lead, d - 2 * lead, o, "");
  const img = document.createElement("img"); img.src = GLASS + "art/" + s.art + ".jpg";
  const sc = (d - 2 * lead) / 380;
  img.style.cssText = `position:absolute;width:${560 * sc}px;height:${1000 * sc}px;left:${-90 * sc}px;top:${-320 * sc}px;`;
  inner.appendChild(img);
  return o;
}

// ---------------- the room ----------------
function sidePanels(fight) {
  const lancet = bgImg("l1r-lancet.jpg", "linear-gradient(#26343d,#1a242b)");
  el("lancet", 0, 0, SIDE, H, scr, lancet);
  el("lancet", W - SIDE, 0, SIDE, H, scr, lancet);
  const cx = SIDE / 2;
  // portraits on the right: the leaderboard
  const rd = 74, top = 110, step = 96;
  portraits.forEach((n, i) => {
    const r = el("roundel", W - SIDE / 2 - rd / 2 - 10, top + i * step, rd, rd);
    if (i === 6) r.style.boxShadow = "0 0 0 4px #1c2022, 0 0 0 7px #e9d9a8, 0 3px 8px #000a";
    if (i === 4) r.style.boxShadow = "0 0 0 4px #1c2022, 0 0 0 7px #c0583e, 0 3px 8px #000a";
    if (i === 7) r.style.filter = "grayscale(1) brightness(0.55)";
    r.innerHTML = `<img src="${GLASS}portraits/${n}.jpg">`;
    if (i < 7) { const b = el("badge", W - SIDE / 2 + rd / 2 - 8, top + i * step + rd - 30, 34, 34, scr, "font-size:19px"); b.textContent = hp8[i]; }
  });
  if (!fight) {
    // End turn
    const b = el("btn", W - SIDE / 2 - 56, H - 150, 112, 112);
    b.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 12h13M12 6l6 6-6 6" stroke="#f1e6c8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    // left: hero, gold, upgrade, refresh, freeze, cog
    const hr = el("roundel", cx - 64, 56, 128, 128); hr.innerHTML = `<img src="${GLASS}portraits/dame_farthing.jpg">`;
    const hb = el("badge", cx + 30, 146, 42, 42, scr, "font-size:22px;background:radial-gradient(circle at 40% 35%,#f4a39a,#c0473a 65%,#8e2a22);color:#fff3e8"); hb.textContent = 11;
    if (SHOP !== "stack") {
    const gc = el("coin", cx - 44, 236, 88, 88, scr, "font-size:40px"); gc.textContent = 10;
      const up = el("btn", cx - 46, 372, 92, 92);
      up.innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7M5 20l7-7 7 7" stroke="#f1e6c8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const uc = el("coin", cx + 26, 420, 40, 40, scr, "font-size:20px"); uc.textContent = 8;
      const rf = el("btn", cx - 46, 500, 92, 92);
      rf.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 8a7.5 7.5 0 1 0 .8 6.5" stroke="#f1e6c8" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M20 3v5.5h-5.5" stroke="#f1e6c8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const rc = el("coin", cx + 26, 548, 40, 40, scr, "font-size:20px"); rc.textContent = 1;
      const fz = el("btn", cx - 46, 628, 92, 92);
      fz.innerHTML = `<svg viewBox="0 0 24 24"><g stroke="#cfe6f5" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5" fill="none"/></g></svg>`;
    }
    const cg = el("btn", cx - 30, H - 104, 60, 60);
    cg.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" stroke="#d9cfb8" stroke-width="2" fill="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#d9cfb8" stroke-width="2" stroke-linecap="round"/></svg>`;
  } else {
    const a = el("roundel", cx - 64, 70, 128, 128); a.innerHTML = `<img src="${GLASS}portraits/march_hare.jpg">`;
    const ab = el("badge", cx + 30, 160, 42, 42, scr, "font-size:22px;background:radial-gradient(circle at 40% 35%,#f4a39a,#c0473a 65%,#8e2a22);color:#fff3e8"); ab.textContent = 16;
    const b = el("roundel", cx - 64, H - 200, 128, 128); b.innerHTML = `<img src="${GLASS}portraits/dame_farthing.jpg">`;
    const bb = el("badge", cx + 30, H - 110, 42, 42, scr, "font-size:22px;background:radial-gradient(circle at 40% 35%,#f4a39a,#c0473a 65%,#8e2a22);color:#fff3e8"); bb.textContent = 11;
  }
}

function buy() {
  const h = fitHeight(SHAPE), g = geom(SHAPE, h);
  const { w, p, th } = g;
  const x0 = SIDE, cw = W - 2 * SIDE;
  const nicheTop = NICHE / Math.cos(th);
  const yCard = G + nicheTop;
  const wallBottom = yCard + h + NICHE + SILL + G;
  const ledgeTop = H - ledgeH(h);
  const boardTop = HAND === "small" ? wallBottom + TABLE_PAD : wallBottom + (ledgeTop - wallBottom - g.boardH) / 2;

  // wall
  el("wall", x0, 0, cw, wallBottom, scr, bgImg("l1r-wall.jpg", "linear-gradient(#454a4f,#34393d)"));
  el("shade", x0, 0, cw, wallBottom, scr, "background:rgba(14,18,24,0.42)");
  // table
  const t = el("table", x0, wallBottom, cw, ledgeTop - wallBottom);
  el("plane", 0, 0, 0, 0, t, bgImg("l1r-oak.jpg", "linear-gradient(#45291c,#2f1c13)")).style.cssText += "inset:-90% -60% -2% -60%;width:auto;height:auto;";
  el("shade", x0, wallBottom, cw, ledgeTop - wallBottom, scr, "background:rgba(12,6,4,0.45)");
  if (DEPTH) {
    // where wall meets table: a soft contact shadow, and the table darkens towards the viewer a little
    el("shadow", x0, wallBottom, cw, 46, scr, "background:linear-gradient(rgba(0,0,0,0.55),transparent)");
    el("shadow", x0, wallBottom, cw, ledgeTop - wallBottom, scr, "background:linear-gradient(transparent 55%, rgba(0,0,0,0.28))");
  }
  // ledge (hand)
  el("table-edge", x0, ledgeTop - 10, cw, 10);
  el("ledge", x0, ledgeTop, cw, H - ledgeTop, scr, bgImg("l1r-leather.jpg", "linear-gradient(#352116,#22140d)"));

  // shop: 5 units then 2 spells, centred
  const ds = SPELL_K * w;
  const items = [...shopUnits.map(u => ({ ...u, kind: "unit", iw: w })), ...(SHOP === "stack" ? [] : shopSpells.map(s => ({ ...s, kind: "spell", iw: ds })))];
  const rowW = items.reduce((s, it) => s + it.iw + 2 * NICHE, 0) + (items.length - 1) * G;
  let x = W / 2 - rowW / 2;
  const rowLeft = x, rowRight = x + rowW;
  for (const it of items) {
    const nx = x, nw = it.iw + 2 * NICHE;
    const T = TIER[it.tier];
    const cx = nx + NICHE, cy = it.kind === "unit" ? yCard : yCard + h - ds;
    // niche shape: lancet that follows the card's top, flat foot
    const nh = (it.kind === "unit" ? h : ds) + NICHE + nicheTop;
    const ny = cy - nicheTop;
    let clip;
    if (it.kind === "unit") {
      const pts = hexPts(nw, h + 2 * nicheTop, p + nicheTop * Math.tan(th) * 0 + NICHE * Math.tan(th), 0);
      // build: top point, shoulders, then straight down to a flat foot
      const sh = (p + NICHE * Math.tan(th)) ;
      clip = poly([[nw / 2, 0], [nw, sh], [nw, nh], [0, nh], [0, sh]]);
    } else {
      clip = `path("M0 ${nh} L0 ${nw / 2} A ${nw / 2} ${nw / 2} 0 0 1 ${nw} ${nw / 2} L${nw} ${nh} Z")`;
    }
    // light spilling onto the wall around the niche (faint)
    blurShape(nx, ny, nw, nh, clip, rgba(T.c, T.a * 0.35), 14);
    // the niche: a dark recess lit from behind in the tier colour
    const n = el("niche", nx, ny, nw, nh, scr, `clip-path:${clip};background:
      radial-gradient(ellipse 70% 62% at 50% 48%, ${rgba(T.c, T.a * 0.9)} 0%, ${rgba(T.c, T.a * 0.45)} 70%, ${rgba(T.c, T.a * 0.2)} 100%), #0f1213;`);
    // the light itself, right behind the glass: a halo hugging the card
    const o = NICHE * 0.55;
    if (it.kind === "unit") blurShape(cx - o, cy - o, w + 2 * o, h + 2 * o, poly(hexPts(w + 2 * o, h + 2 * o, p + o * Math.tan(th))), rgba(T.c, Math.min(1, T.a * 2)), 5);
    else blurShape(cx - o, cy - o, ds + 2 * o, ds + 2 * o, "circle(50%)", rgba(T.c, Math.min(1, T.a * 2)), 5);
    if (DEPTH) n.innerHTML = `<div class="abs" style="inset:0;box-shadow:inset 7px 9px 10px rgba(0,0,0,0.6)"></div>`;
    // sill
    const sill = el("sill", nx - 8, ny + nh, nw + 16, SILL, scr, DEPTH
      ? "background:linear-gradient(#6b7176,#41464a 55%,#2b2f32);box-shadow:0 6px 8px rgba(0,0,0,0.45)"
      : "background:#555b60");
    // light pooling on the sill
    el("glow", nx, ny + nh - 6, nw, SILL + 8, scr, `background:radial-gradient(ellipse at 50% 20%, ${rgba(T.c, T.a * 1.3)}, transparent 70%);filter:blur(3px)`);
    if (DEPTH) el("glow", nx - nw * 0.2, wallBottom - 4, nw * 1.4, 70, scr,
      `background:radial-gradient(ellipse 50% 60% at 50% 0%, ${rgba(T.c, T.a * 0.55)}, transparent 75%);filter:blur(6px)`);
    if (it.kind === "unit") {
      scr.appendChild(card(cx, cy, g, { art: it.art, a: it.a, hp: it.hp }));
      const cd = Math.round(w * 0.24);
      el("coin", nx + nw / 2 - cd / 2, ny + nh + SILL / 2 - cd / 2, cd, cd, scr, `font-size:${Math.round(cd * 0.58)}px;z-index:3`).textContent = 3;
    } else {
      spellDisc(cx, cy, ds, it);
      const cd = Math.round(w * 0.24);
      el("coin", nx + nw / 2 - cd / 2, ny + nh + SILL / 2 - cd / 2, cd, cd, scr, `font-size:${Math.round(cd * 0.58)}px;z-index:3`).textContent = it.cost;
    }
    x += nw + G;
  }
  if (SHOP === "stack") {
    // two smaller spells, one over the other, at the right-hand end of the row
    const bandTop = G, bandBottom = yCard + h + NICHE + SILL;
    const SS = 14, NS = 9;                                   // spell sill, spell niche rim
    const cell = (bandBottom - bandTop - G) / 2;
    const d = Math.floor(cell - SS - 2 * NS), nw = d + 2 * NS, nh = d + 2 * NS;
    const nx = rowRight + G;
    shopSpells.forEach((sp, j) => {
      const T = TIER[sp.tier];
      const ny = bandTop + j * (cell + G), cx = nx + NS, cy = ny + NS;
      const clip = `path("M0 ${nh} L0 ${nw / 2} A ${nw / 2} ${nw / 2} 0 0 1 ${nw} ${nw / 2} L${nw} ${nh} Z")`;
      blurShape(nx, ny, nw, nh, clip, rgba(T.c, T.a * 0.35), 12);
      const n = el("niche", nx, ny, nw, nh, scr, `clip-path:${clip};background:
        radial-gradient(ellipse 70% 62% at 50% 48%, ${rgba(T.c, T.a * 0.9)} 0%, ${rgba(T.c, T.a * 0.45)} 70%, ${rgba(T.c, T.a * 0.2)} 100%), #0f1213;`);
      const o = NS * 0.55;
      blurShape(cx - o, cy - o, d + 2 * o, d + 2 * o, "circle(50%)", rgba(T.c, Math.min(1, T.a * 2)), 5);
      if (DEPTH) n.innerHTML = `<div class="abs" style="inset:0;box-shadow:inset 6px 8px 9px rgba(0,0,0,0.6)"></div>`;
      el("sill", nx - 6, ny + nh, nw + 12, SS, scr, DEPTH
        ? "background:linear-gradient(#6b7176,#41464a 55%,#2b2f32);box-shadow:0 5px 7px rgba(0,0,0,0.45)" : "background:#555b60");
      el("glow", nx, ny + nh - 5, nw, SS + 6, scr, `background:radial-gradient(ellipse at 50% 20%, ${rgba(T.c, T.a * 1.3)}, transparent 70%);filter:blur(3px)`);
      spellDisc(cx, cy, d, sp);
      const cd = 36;
      el("coin", nx + nw / 2 - cd / 2, ny + nh + SS / 2 - cd / 2, cd, cd, scr, `font-size:21px;z-index:3`).textContent = sp.cost;
    });
    // gold and the shop's three buttons, a block of four at the left-hand end
    const bx0 = rowLeft - G - CTRL_W, by0 = (bandTop + bandBottom) / 2 - CTRL_W / 2;
    const at = (c, r) => [bx0 + c * (CTRL + CTRL_GAP), by0 + r * (CTRL + CTRL_GAP)];
    const cost = (c, r, v) => { const [x, y] = at(c, r); el("coin", x + CTRL - 30, y + CTRL - 30, 38, 38, scr, "font-size:20px;z-index:3").textContent = v; };
    let [gx, gy] = at(0, 0);
    el("coin", gx, gy, CTRL, CTRL, scr, "font-size:38px").textContent = 10;
    [gx, gy] = at(1, 0);
    el("btn", gx, gy, CTRL, CTRL).innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7M5 20l7-7 7 7" stroke="#f1e6c8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    cost(1, 0, 8);
    [gx, gy] = at(0, 1);
    el("btn", gx, gy, CTRL, CTRL).innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 8a7.5 7.5 0 1 0 .8 6.5" stroke="#f1e6c8" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M20 3v5.5h-5.5" stroke="#f1e6c8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    cost(0, 1, 1);
    [gx, gy] = at(1, 1);
    el("btn", gx, gy, CTRL, CTRL).innerHTML = `<svg viewBox="0 0 24 24"><g stroke="#cfe6f5" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5" fill="none"/></g></svg>`;
  }

  // board: 4 over 3, nested
  const bx = W / 2 - (4 * w + 3 * G) / 2;
  const slots = [];
  for (let i = 0; i < 4; i++) slots.push([bx + i * (w + G), boardTop]);
  for (let i = 0; i < 3; i++) slots.push([bx + (w + G) / 2 + i * (w + G), boardTop + g.rowStep]);
  const LIFT = DEPTH ? 3 : -1;
  board.forEach((u, i) => cardGround(slots[i][0], slots[i][1], g, u, scr, { lift: i === LIFT }));
  board.forEach((u, i) => { if (u.golden) goldenHalo(slots[i][0], slots[i][1], g, scr); });
  board.forEach((u, i) => scr.appendChild(card(slots[i][0], slots[i][1], g, u, { lift: i === LIFT })));

  // hand
  const hg = geom(SHAPE, h * HAND_K);
  const hx = W / 2 - (hand.length * hg.w + (hand.length - 1) * G) / 2;
  hand.forEach((u, i) => {
    const up = i === HOVER;                      // raised: the whole card comes up over the edge, same size
    const xx = hx + i * (hg.w + G), yy = up ? H - hg.h - 12 : ledgeTop + LEDGE_PAD;
    if (DEPTH) el("shadow", xx + (up ? 10 : 4), yy + (up ? 16 : 6), hg.w, hg.h, scr, `background:rgba(0,0,0,${up ? 0.55 : 0.45});clip-path:${poly(hexPts(hg.w, hg.h, hg.p))};filter:blur(${up ? 10 : 5}px);z-index:${up ? 6 : 0}`);
    const c = card(xx, yy, hg, u);
    if (up) c.style.zIndex = 7;
    scr.appendChild(c);
  });
  sidePanels(false);
  return { h, w, g };
}

function fight() {
  const h = fitHeight(SHAPE), g = geom(SHAPE, h);
  const { w } = g;
  el("backdrop", 0, 0, W, H, scr, bgImg(BG === "bluebell" ? "l1r-fight-bluebell.jpg" : "l1r-fight-oak.jpg",
    "linear-gradient(#273041 0%,#1b2029 50%,#16181b 51%,#0f1112)") + "background-size:cover;background-position:center;");
  el("shade", 0, 0, W, H, scr, "background:linear-gradient(rgba(8,10,16,0.38), rgba(8,10,16,0.18) 55%, rgba(0,0,0,0.25))");
  // the armies stand in the middle; the backdrop stays dim behind them
  el("shadow", SIDE, 0, W - 2 * SIDE, H, scr, "background:radial-gradient(ellipse 60% 60% at 50% 55%, rgba(0,0,0,0.0), rgba(0,0,0,0.35))");
  const total = 2 * g.boardH + ARMY_GAP;
  const y0 = (H - total) / 2;
  const bx = W / 2 - (4 * w + 3 * G) / 2;
  const slots = [];
  // enemy: back row (3) on top, front row (4) below
  for (let i = 0; i < 3; i++) slots.push([bx + (w + G) / 2 + i * (w + G), y0, enemy[4 + i]]);
  for (let i = 0; i < 4; i++) slots.push([bx + i * (w + G), y0 + g.rowStep, enemy[i]]);
  // player: front row (4), back row (3) below
  const py = y0 + g.boardH + ARMY_GAP;
  for (let i = 0; i < 4; i++) slots.push([bx + i * (w + G), py, board[i]]);
  for (let i = 0; i < 3; i++) slots.push([bx + (w + G) / 2 + i * (w + G), py + g.rowStep, board[4 + i]]);
  slots.forEach(([x, y, u]) => cardGround(x, y, g, u, scr));
  slots.forEach(([x, y, u]) => { if (u.golden) goldenHalo(x, y, g, scr); });
  // one player unit lunging at an enemy
  slots.forEach(([x, y, u], i) => {
    const c = card(x, y, g, u);
    if (i === 9) { c.style.transform = `translate(0px, ${-(ARMY_GAP + h * 0.12)}px) rotate(-3deg)`; c.style.zIndex = 6; }
    scr.appendChild(c);
  });
  sidePanels(true);
  return { h, w, g };
}

function shapesSheet() {
  scr.style.background = "#1b1d1f";
  const order = ["today", "a", "b", "c", "d", "e"];
  let x = 70;
  const base = 640;
  order.forEach(k => {
    const h = k === "today" ? 200 : fitHeight(k), g = geom(k === "today" ? "a" : k, h);
    const u = { art: "badger/hedge-knight", a: 4, hp: 6 };
    const y = base - h;
    scr.appendChild(card(x, y, g, u));
    const gu = { ...u, golden: true };
    const lab = el("label", x - 10, base + 24, g.w + 140, 160);
    lab.innerHTML = k === "today" ? `<b>Today</b><br>112 × 200 px<br>the build's card, for scale`
      : `<b>${k.toUpperCase()}</b><br>${Math.round(g.w)} × ${h} px<br>${SHAPES[k].name}`;
    x += g.w + 120;
  });
  const t = el("label", 70, 60, 1700, 120);
  t.innerHTML = `<b>Card shapes at their real size on a 1920 × 1080 screen</b><br>Each is the largest that fits both the buy screen (shop, board 4 over 3, hand) and the fight (four rows) with one 20 px gap everywhere.`;
}

// ================= view=polish: the polished buy screen (brief 34) =================
// switches: art=guide|today   hover=N (a hand card pointed at)
const ART = Q.get("art") || "guide";
const GUIDE = "file:///data/bramble-art/uiid-palette/c69/";
// per-card nudges for the repainted pictures: dy moves the picture down (px at card size), z zooms
const GUIDE_FIT = {};

function guideName(art) { const [t, n] = art.split("/"); return (t === "shared" ? "neutral" : t) + "-" + n + ".png"; }

function pCard(x, y, g, u, parent = scr) {
  const { w, h, p } = g;
  const lead = Math.max(4, Math.round(w * 0.034));
  const c = el("card" + (u.golden ? " golden" : ""), x, y, w, h, parent);
  c.style.position = "absolute";
  const fr = el("frame", 0, 0, w, h, c, `clip-path:${poly(hexPts(w, h, p))}`);
  // a thin lit edge just inside the lead: the glass catching light
  const wn = el("win", 0, 0, w, h, c, `clip-path:${poly(hexPts(w, h, p, lead))}`);
  const wi = w - 2 * lead, hi = h - 2 * lead / Math.cos(g.th);
  const img = document.createElement("img");
  const today = () => { img.onerror = null; img.src = UNITS + u.art + ".jpg"; img.style.cssText = "position:absolute"; placeArt(img, w, h, 520); };
  if (ART === "guide") {
    const f = GUIDE_FIT[u.art] || {};
    const z = f.z || 1, iw = (w + 2) * z, ih = iw * 1.5;
    img.style.cssText = `position:absolute;width:${iw}px;height:${ih}px;left:${(w - iw) / 2}px;top:${(h - ih) / 2 + (f.dy || 0)}px;`;
    img.onerror = today;
    img.src = GUIDE + guideName(u.art);
  } else today();
  wn.appendChild(img);
  // inner bevel: light on the lower glass edge, shade under the upper lead
  el("", 0, 0, w, h, wn, `background:linear-gradient(180deg, rgba(0,0,0,0.28), transparent 9%, transparent 88%, rgba(255,240,210,0.10));pointer-events:none`);
  const d = Math.round(w * 0.24), rim = Math.max(3, Math.round(w * 0.022));
  const sy = h - p - d * 0.62;
  [[0, u.a], [1, u.hp]].forEach(([i, v]) => {
    const s = el("stat", i === 0 ? w * 0.065 : w * 0.935 - d, sy, d, d, c, `--rim:${rim}px;font-size:${Math.round(d * 0.58)}px;z-index:1`);
    s.innerHTML = `<span>${v}</span>`;
  });
  if (u.golden) {
    const r = hexPts(w, h, p)[1], sz = Math.round(w * 0.15);
    el("sparkle", r[0] - sz / 2 - 2, r[1] - sz / 2, sz, sz, c);
  }
  return c;
}

// depth: a slab of glass a few px thick, and a tight soft shadow (bigger and softer when raised)
function slab(x, y, g, u, raised = 0, parent = scr) {
  const { w, h, p } = g;
  const t = 5;
  const sOff = raised ? 26 : 7, sBlur = raised ? 18 : 5, sOp = raised ? 0.5 : 0.7;
  blurShape(x + (raised ? 6 : 1), y + sOff, w, h, poly(hexPts(w, h, p)), `rgba(0,0,0,${sOp})`, sBlur, parent);
  // the slab's edge: dark lead with a line of lit glass
  el("", x, y + t, w, h, parent, `clip-path:${poly(hexPts(w, h, p))};background:${u.golden
    ? "linear-gradient(#7a4a18, #3e240b)" : "linear-gradient(#2a2f2d, #0b0d0c)"}`);
  el("", x, y + t - 2, w, h, parent, `clip-path:${poly(hexPts(w, h, p))};background:${u.golden
    ? "rgba(255,214,140,0.55)" : "rgba(170,190,185,0.22)"}`);
}

  book: `<svg viewBox="0 0 24 24"><g stroke="#fbf3dc" stroke-width="2" fill="none" stroke-linejoin="round"><path d="M12 6.5C9.5 4.8 6.5 4.5 3.5 5v13c3-.5 6-.2 8.5 1.5 2.5-1.7 5.5-2 8.5-1.5V5c-3-.5-6-.2-8.5 1.5z"/><path d="M12 6.5v13"/></g></svg>`,
  cog: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" stroke="#fbf3dc" stroke-width="2" fill="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#fbf3dc" stroke-width="2" stroke-linecap="round"/></svg>`,
  leaf: `<svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z" fill="#8fb36a" stroke="#2c3a1d" stroke-width="1.4"/><path d="M5 19l8-8" stroke="#2c3a1d" stroke-width="1.4"/></svg>`,
  tide: `<svg viewBox="0 0 24 24"><path d="M3 10c2.5-2.5 4.5-2.5 6 0s3.5 2.5 6 0 4.5-2.5 6 0M3 16c2.5-2.5 4.5-2.5 6 0s3.5 2.5 6 0 4.5-2.5 6 0" stroke="#9fd0e8" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`,
  pointer: `<svg viewBox="0 0 24 24"><path d="M5 3l13 9.5-6 .8 3.6 6.8-2.8 1.4-3.5-6.9L5 19z" fill="#fbf7ec" stroke="#1b1b1b" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
};

function polish() {
  const h = 250, g = geom("c", h), { w, p, th } = g;
  const PIER = 244;
  const x0 = PIER, cw = W - 2 * PIER;
  const nicheTop = NICHE / Math.cos(th);
  const yCard = G + nicheTop;
  const nicheFoot = yCard + h + NICHE;
  const wallBottom = nicheFoot + SILL + 14;
  const EDGE_Y = 898, EDGE_H = 26;               // the table's front edge
  const handTop = H - Math.round(h * 0.5);
  const boardTop = Math.round(wallBottom + (EDGE_Y - wallBottom - g.boardH) / 2);

  // ---- room ----
  PART = "bg-wall";
  el("", x0, 0, cw, wallBottom, scr, bgImg("l1r-wall.jpg", "linear-gradient(#3d4246,#3d4246)") + "background-size:360px 360px");
  el("", x0, 0, cw, wallBottom, scr, "background:linear-gradient(rgba(10,13,18,0.55), rgba(10,13,18,0.38))");
  PART = "bg-table";
  el("", x0, wallBottom, cw, EDGE_Y - wallBottom, scr, bgImg("l1p-oak-top.jpg", "linear-gradient(#2f1d14,#2f1d14)") + "background-size:420px 420px");
  el("", x0, wallBottom, cw, EDGE_Y - wallBottom, scr, "background:radial-gradient(ellipse 70% 80% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.38))");
  // the wall casts a soft shadow on the table's far edge; the wall's foot is a stone course
  el("", x0, wallBottom, cw, 40, scr, "background:linear-gradient(rgba(0,0,0,0.6), transparent)");
  PART = "bg-wall";
  el("", x0, wallBottom - 10, cw, 10, scr, "background:linear-gradient(#5a5f63,#33373a)");
  PART = "bg-ledge";
  // table front edge and the dark ledge where the hand is held
  el("", x0, EDGE_Y + EDGE_H, cw, H - EDGE_Y - EDGE_H, scr, bgImg("l1r-leather.jpg", "linear-gradient(#24160f,#24160f)") + "background-size:100% 100%;filter:brightness(0.55)");
  PART = "bg-edge";
  el("", x0, EDGE_Y, cw, EDGE_H, scr, bgImg("l1p-table-edge.jpg", "linear-gradient(#3a2418,#3a2418)") + "background-size:auto 100%;box-shadow:0 8px 12px rgba(0,0,0,0.6)");
  // piers
  for (const px of [0, W - PIER]) {
    PART = px ? "bg-pier-r" : "bg-pier-l";
    el("", px, 0, PIER, H, scr, bgImg("l1p-pier.jpg", "linear-gradient(#1d2023,#1d2023)") + "background-size:100% auto;background-repeat:repeat-y");
    el("", px, 0, PIER, H, scr, `background:linear-gradient(${px ? 90 : 270}deg, rgba(0,0,0,0.45), transparent 22%)`);
  }

  // ---- shop ----
  const ds = 120, nwS = ds + 2 * NICHE;
  const unitRow = 5 * (w + 2 * NICHE) + 4 * G;
  const ux0 = W / 2 - unitRow / 2;
  const spells = [{ ...shopSpells[0], cost: 1 }, { ...shopSpells[1], cost: 5 }];
  const GOLD = 4;
  const items = [
    { kind: "spell", s: spells[0], nx: ux0 - G - nwS },
    ...shopUnits.map((u, i) => ({ kind: "unit", u, nx: ux0 + i * (w + 2 * NICHE + G) })),
    { kind: "spell", s: spells[1], nx: ux0 + unitRow + G },
  ];
  for (const it of items) {
    PART = "shop-" + items.indexOf(it);
    const isU = it.kind === "unit";
    const iw = isU ? w : ds, nw = iw + 2 * NICHE;
    const T = TIER[isU ? it.u.tier : it.s.tier];
    const cx = it.nx + NICHE, cy = isU ? yCard : nicheFoot - NICHE - ds;
    const ny = isU ? cy - nicheTop : cy - NICHE, nh = nicheFoot - ny;
    const shape = (W_, H_, o) => isU
      ? poly([[W_ / 2, 0], [W_, p + o * Math.tan(th) + (W_ - nw) / 2 * Math.tan(th) * 0], [W_, H_], [0, H_], [0, p + o * Math.tan(th)]])
      : `path("M0 ${H_} L0 ${W_ / 2} A ${W_ / 2} ${W_ / 2} 0 0 1 ${W_} ${W_ / 2} L${W_} ${H_} Z")`;
    // stone reveal round the niche: lit below and right, shaded above and left
    const R = 7;
    el("", it.nx - R, ny - R * 1.2, nw + 2 * R, nh + R * 1.2, scr, `clip-path:${shape(nw + 2 * R, nh + R * 1.2, NICHE + R)};background:linear-gradient(160deg, #2b2f33 0%, #4a5055 55%, #6b7176 100%)`);
    blurShape(it.nx, ny, nw, nh, shape(nw, nh, NICHE), rgba(T.c, T.a * 0.22), 14);
    const n = el("", it.nx, ny, nw, nh, scr, `clip-path:${shape(nw, nh, NICHE)};background:
      radial-gradient(ellipse 70% 62% at 50% 46%, ${rgba(T.c, T.a * 0.9)} 0%, ${rgba(T.c, T.a * 0.42)} 70%, ${rgba(T.c, T.a * 0.18)} 100%), #0d1011;`);
    n.innerHTML = `<div class="abs" style="inset:0;box-shadow:inset 8px 10px 12px rgba(0,0,0,0.65)"></div>`;
    const o = NICHE * 0.55;
    if (isU) blurShape(cx - o, cy - o, w + 2 * o, h + 2 * o, poly(hexPts(w + 2 * o, h + 2 * o, p + o * Math.tan(th))), rgba(T.c, Math.min(1, T.a * 2)), 5);
    else blurShape(cx - o, cy - o, ds + 2 * o, ds + 2 * o, "circle(50%)", rgba(T.c, Math.min(1, T.a * 2)), 5);
    // sill
    el("", it.nx - 10, nicheFoot, nw + 20, SILL, scr, bgImg("l1p-sill.jpg", "linear-gradient(#555b60,#555b60)") + "background-size:auto 100%;box-shadow:0 7px 9px rgba(0,0,0,0.55)");
    el("glow", it.nx, nicheFoot - 4, nw, SILL, scr, `background:radial-gradient(ellipse at 50% 10%, ${rgba(T.c, T.a * 1.1)}, transparent 70%);filter:blur(3px)`);
    const cd = 42;
    if (isU) {
      scr.appendChild(pCard(cx, cy, g, it.u));
      coin(it.nx + nw / 2 - cd / 2, nicheFoot + SILL / 2 - cd / 2 + 2, cd, 3, { pewter: GOLD < 3 });
    } else {
      const sd = spellDisc(cx, cy, ds, it.s);
      sd.style.filter = "drop-shadow(0 4px 4px rgba(0,0,0,0.6))";
      coin(it.nx + nw / 2 - cd / 2, nicheFoot + SILL / 2 - cd / 2 + 2, cd, it.s.cost, { pewter: GOLD < it.s.cost });
    }
  }

  // ---- board: four over three, every card exactly on its slot ----
  const bx = W / 2 - (4 * w + 3 * G) / 2;
  const slots = [];
  for (let i = 0; i < 4; i++) slots.push([bx + i * (w + G), boardTop]);
  for (let i = 0; i < 3; i++) slots.push([bx + (w + G) / 2 + i * (w + G), boardTop + g.rowStep]);
  board.forEach((u, i) => { PART = "board-" + i; slab(slots[i][0], slots[i][1], g, u); });
  board.forEach((u, i) => { PART = "board-" + i; if (u.golden) goldenHalo(slots[i][0], slots[i][1], g, scr); });
  board.forEach((u, i) => { PART = "board-" + i; scr.appendChild(pCard(slots[i][0], slots[i][1], g, u)); });

  // ---- hand: full size, half below the edge; one may be pointed at ----
  const hx = W / 2 - (hand.length * w + (hand.length - 1) * G) / 2;
  hand.forEach((u, i) => {
    PART = "hand-" + i;
    const xx = hx + i * (w + G);
    const raised = i === HOVER;
    const yy = raised ? H - h + 24 : handTop;
    slab(xx, yy, g, u, raised);
    const c = pCard(xx, yy, g, u);
    if (raised) c.style.zIndex = 8;
    scr.appendChild(c);
    if (raised) el("", xx + w * 0.62, yy + h * 0.52, 40, 40, scr, "z-index:9;filter:drop-shadow(2px 3px 2px rgba(0,0,0,0.6))").innerHTML = ICON.pointer;
  });

  // ---- left pier: what you watch ----
  const LC = PIER / 2;
  PART = "turn";
  plate(LC - 92, 18, 184, 52, `<span style="font-size:24px;letter-spacing:0.02em">Turn 9</span>`);
  PART = "scoreboard";
  const rowY = 94, rowH = 78, pd = 62;
  portraits.forEach((nme, i) => {
    const y = rowY + i * rowH;
    const ring = i === 6 ? "#e8d49a" : i === 4 ? "#c4553c" : "#4d5356";
    portrait(LC - 64, y, pd, nme, ring, i === 7);
    if (i < 7) {
      const t = el("", LC + 14, y + 13, 56, 36, scr, `display:grid;place-items:center;font-weight:700;font-size:26px;color:${i === 6 ? "#f6e7b8" : "#e7ddc8"};text-shadow:0 2px 3px #000`);
      t.textContent = hp8[i];
    }
    if (i === 4) el("", LC + 64, y + 18, 26, 26, scr, "").innerHTML =
      `<svg viewBox="0 0 24 24"><g stroke="#e0866e" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M5 4l12 12M19 4L7 16"/><path d="M14 18l4-4M10 18l-4-4"/><path d="M17.5 17.5l2 2M6.5 17.5l-2 2"/></g></svg>`;
  });
  // your hero
  const heroY = 722;
  PART = "hero";
  portrait(LC - 62, heroY, 124, "dame_farthing", "#e8d49a");
  healthGem(LC + 26, heroY + 84, 48, 11);
  // tribe counters: icon and numeral, with the word under (Compost alone would be a puzzle)
  PART = "counter-0";
  plate(16, heroY + 150, 100, 46, `${ICON.leaf.replace("<svg", "<svg width='24' height='24'")}<span style="font-size:24px">3</span>`);
  PART = "counter-1";
  plate(128, heroY + 150, 100, 46, `${ICON.tide.replace("<svg", "<svg width='24' height='24'")}<span style="font-size:24px">2</span>`);
  if (ONLY) {   // two more counters, to show the slots are general: any tribe's counter can sit in one
    PART = "counter-2";
    plate(16, 300, 100, 46, `<svg width='24' height='24' viewBox="0 0 24 24"><path d="M12 3c1 4 5 6 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#e8a25a" stroke="#4a2408" stroke-width="1.4" stroke-linejoin="round"/></svg><span style="font-size:24px">7</span>`);
    PART = "counter-3";
    plate(128, 300, 100, 46, `<svg width='24' height='24' viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9" stroke="#d9c9f0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="font-size:24px">1</span>`);
  }
  PART = "label";
  const lab = (x, y, t) => { const l = el("", x, y, 100, 18, scr, "text-align:center;font-size:15px;color:#b9b2a2;font-weight:700;letter-spacing:0.04em;text-shadow:0 1px 2px #000"); l.textContent = t; };
  lab(16, heroY + 198, "Compost"); lab(128, heroY + 198, "Tide");
  // library and settings
  PART = "library";
  const lib = roundel(LC - 84, 984, 72); lib.innerHTML = ICON.book.replace("<svg", "<svg width='40' height='40'");
  PART = "cog";
  const cog = roundel(LC + 20, 988, 64); cog.innerHTML = ICON.cog.replace("<svg", "<svg width='32' height='32'");

  // ---- right pier: what you act on ----
  const RX = W - PIER, BD = 88;
  const bx0 = RX + PIER / 2 - (BD + 8 + 50) / 2;
  const btnY = [yCard - 4, yCard - 4 + BD + 22, yCard - 4 + 2 * (BD + 22)];
  // tier up: the shop's tier on the button, its cost (discounted) on a coin
  PART = "tierup";
  const tu = roundel(bx0, btnY[0], BD); tu.innerHTML = ICON.up.replace("<svg", "<svg width='40' height='40' style='margin-top:-10px'");
  el("", bx0, btnY[0] + 50, BD, 26, scr, "text-align:center;font-weight:700;font-size:22px;color:#fbf3dc;text-shadow:0 1px 3px #0b1a2a").textContent = "5";
  coin(bx0 + BD + 8, btnY[0] + 34, 50, 9);
  el("", bx0 + BD + 8, btnY[0] + 2, 50, 28, scr, "text-align:center;font-weight:700;font-size:20px;color:#b8ad96;text-decoration:line-through;text-decoration-thickness:2px;text-shadow:0 1px 2px #000").textContent = "10";
  // refresh: cost, and refreshes left at this price
  PART = "refresh";
  const rf = roundel(bx0, btnY[1], BD); rf.innerHTML = ICON.refresh.replace("<svg", "<svg width='42' height='42'");
  coin(bx0 + BD + 8, btnY[1] + 34, 50, 1);
  el("", bx0 + BD - 4, btnY[1] + 6, 74, 24, scr, "text-align:center;font-weight:700;font-size:16px;color:#b8ad96;text-shadow:0 1px 2px #000").textContent = "7 left";
  // freeze
  PART = "freeze";
  const fz = roundel(bx0, btnY[2], BD); fz.innerHTML = ICON.freeze.replace("<svg", "<svg width='42' height='42'");
  // gold: the biggest thing on this side, with next turn's income
  PART = "gold";
  const gy = wallBottom + 70;
  coin(RX + PIER / 2 - 66, gy, 132, GOLD).style.fontSize = "64px";
  el("", RX + PIER / 2 - 60, gy + 140, 120, 34, scr, "text-align:center;font-weight:700;font-size:26px;color:#f0d68a;text-shadow:0 2px 3px #000").textContent = "+12";
  // end turn
  PART = "endturn";
  const et = roundel(RX + PIER / 2 - 72, H - 186, 144, "amber"); et.innerHTML = ICON.arrow.replace("<svg", "<svg width='66' height='66'");
  return { h, w };
}

const out = VIEW === "polish" ? polish() : VIEW === "fight" ? fight() : VIEW === "shapes" ? shapesSheet() : buy();
window.__L1 = out;
if (ONLY) {
  [...scr.children].forEach(c => { if (c.dataset.part !== ONLY) c.remove(); });
  scr.style.background = "transparent"; scr.style.overflow = "visible"; scr.style.height = "1400px";
  document.documentElement.style.background = "transparent"; document.body.style.background = "transparent";
}
</script>
</body>
</html>
