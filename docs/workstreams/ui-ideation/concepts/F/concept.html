<title>Bramble · The Reading Book</title>
<style>

:root{

*{box-sizing:border-box}
body{margin:0;background:#131b17;color:var(--ivory);font:20px/1.15 var(--body);font-variant-numeric:lining-nums tabular-nums}
button,a{color:inherit;font:inherit}
button{cursor:pointer}

h1,h2,h3,p,figure{margin:0}
h1,h2,h3{font-family:var(--serif)}
#stage{

.mini-plaque span{font-size:15px;color:#dbdfcc;line-height:1.02}
.hand-empty{height:137px;position:relative}
.hand-empty .empty-hex{position:absolute;top:0;opacity:.55}
.shop-head .head-title{display:block}

.price{display:flex;align-items:center;justify-content:center;gap:5px;min-width:75px;height:29px;margin-top:-4px;position:relative;border:1px solid #a99a72;box-shadow:0 0 0 2px #171911,inset 0 1px #c6b58e55;background:#342f23;border-radius:4px;color:#fff0c7;font-size:19px;font-weight:700}

<body>
<main id="stage"></main>
<dialog id="read-card"><header><h2 id="detail-title"></h2><button class="glass action" type="button" id="close-detail">Close</button></header><div id="detail-body"></div></dialog>
<script>
const ASSETS = "../../../../../assets/";

    <path d="M31 82 70 96l46 32m95-46-39 14-46 32M65 70l46 45m66-45-46 45M121 30v83" fill="none" stroke="#e8c49d" opacity=".59"/>
  </svg>`;
}
function recap(cards) {
  return '<div class="recap"><h3>Why you lost</h3>' + cards.map(([c,headline,body]) =>
    '<div class="recap-row">' + art(c) + '<p class="recap-copy"><strong>' + headline + '</strong><span>' + body + '</span></p></div>').join('') + '</div>';
}
function resultSummary() {
  return '<section class="result-grid"><div class="result-title">' + resultFlower() +
    '<p class="eyebrow">Eliminated · 7th place</p><h3>Defeat</h3><p>11 → 0 Health</p></div>' +
    '<div class="breakdown" aria-label="Damage calculation"><div class="glass math-cell"><strong>10</strong><span>Turn 9 damage</span></div>' +
    '<span class="math-symbol">+</span><div class="glass math-cell"><strong>3</strong><span>Heavy defeat</span></div>' +
    '<span class="math-symbol">=</span><div class="glass math-cell total"><strong>13</strong><span>Damage taken</span></div></div>' +
    recap([
      [catalog['holly-knight'],'Holly Knight broke the front row','Grow gave it +12/+12. It took out Squadron Leader.'],
      [catalog['dame-bodkin'],'Dame Bodkin picked off the back row','Two Pile on hits defeated Blackberry Sprawl and Hedge Lancer.'],
      [{...catalog['gorger'],golden:true},'Golden Gorger ended the fight','Wing Commander hit it for 11. Gorger hit back for 38.'],
    ]) + '</section>';
}
function lastActions(text, action) {
  return '<footer class="leaf-foot"><p>' + text + '</p>' + action + '</footer>';
}
function fightLog() {
  const lines = [
    ['Lineup','<b>6</b> of your units face <b>7</b> of March Hare’s.'],
    ['Grow 2','<b>Blackberry Sprawl</b> gained +4/+4 from your Compost.'],
  ];
  return '<section class="board-footer fight-log"><div class="heading-line"><h3>Fight log</h3>' +
    '<button class="glass action" type="button" data-ui="log">Read log</button></div><ol class="log-list">' +
    lines.map(([tag,line]) => '<li><span class="tag">' + tag + '</span><span>' + line + '</span></li>').join('') + '</ol></section>';
}
const noCards = Array(7).fill(null);
let left, right;
if (fight) {
  left = hero(true,chip('Compost',4) + chip('Tide',2)) + board(fightBoard,6) +
    hand([card('home-guard',3,11),card('hayloft-aunt',2,9),card('cousin',2,2),card('hedge-lancer',6,12)]);
  right = hero(false,'') + board(marchBoard,7,true) + fightLog() + lastActions('',viewLink('after','Skip fight'));
} else if (after) {
  left = hero(true,'') + resultSummary();
  right = hero(false,'') + board(survivors,6,true) + '<section class="board-footer"><div class="heading-line"><h3>March Hare wins</h3><button class="glass action" type="button" data-ui="log">Read log</button></div><p>Six of March Hare’s seven starting units survived.<br>A heavy defeat adds 3 damage when more than half the enemy’s starting units survive.</p></section>' +
    lastActions('',viewLink('first','Play again'));
} else {
  const compost = first ? '' : '<button type="button" class="glass head-chip" data-ui="compost"><b class="display-number">3</b> Compost</button>' + chip('Tide',2);
  left = hero(true,chip('Gold',first ? 5 : 20,'coin') + compost) + board(first ? noCards : midBoard,first ? 0 : 7) +
    hand(first ? [] : [card('seek',null,null,{price:3})]);
  right = shop() + scout(lastKnown) + lastActions('',
    '<div class="flip-action"><p>Next turn <strong>+' + (first ? 7 : 19) + ' gold</strong></p>' + viewLink('fight','End turn') + '</div>');
}
const stage = document.querySelector('#stage');
stage.className = page;
stage.style.setProperty('--board-w','139.44px');
stage.innerHTML = book(left,right);
const dialog = document.querySelector('#read-card');
const detailTitle = document.querySelector('#detail-title');
const detailBody = document.querySelector('#detail-body');
function showDetail(title, lines) {
  detailTitle.textContent = title;
  detailBody.replaceChildren(...lines.map(text => {
    const p = document.createElement('p');
    p.textContent = text;
    return p;
  }));
  dialog.showModal();
}
document.querySelector('#close-detail').addEventListener('click', () => dialog.close());
stage.addEventListener('click', event => {
  const trigger = event.target.closest('button');
  if (!trigger) return;
  if (trigger.id === 'tutorial') {
    sessionStorage.setItem('cue-dismissed','yes');
    trigger.hidden = true;
  } else if (trigger.dataset.detail !== undefined) {
    const c = known[trigger.dataset.detail];
    showDetail(c.name,[
      c.type + ' · Tier ' + c.tier,
      c.a == null ? '' : c.a + ' Attack · ' + c.h + ' Health',
      c.keywords,
      c.rules,
      c.price ? 'Price ' + c.price + ' gold' : '',
      c.renown ? 'Slot Renown ' + c.renown : '',
    ].filter(Boolean));
  } else if (trigger.dataset.ui === 'freeze') {
    const frozen = trigger.getAttribute('aria-pressed') === 'true';
    trigger.setAttribute('aria-pressed',String(!frozen));
    trigger.innerHTML = icon('freeze') + (frozen ? 'Freeze' : 'Frozen');
  } else if (notes[trigger.dataset.ui]) {
    const [title,...lines] = notes[trigger.dataset.ui];
    showDetail(title,lines);
  }
});
document.addEventListener('keydown', event => {
  if (fight && event.code === 'Space' && !event.repeat && !dialog.open &&
      !event.target.closest('button,a')) {
    event.preventDefault();
    window.location.search = '?view=after';
  }
});
</script>
</body>
</html>
