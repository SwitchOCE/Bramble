function tracery(cx, peak, edge, height) {
  const half = edge - cx;
  return `<path d="M${cx} ${peak} Q${cx + half * .47} ${peak + 53} ${edge} ${height} M${cx} ${peak} Q${cx - half * .47} ${peak + 53} ${cx - half} ${height} M${cx} ${peak + 25} C${cx - 51} ${peak + 56} ${cx - 57} ${peak + 109} ${cx} ${peak + 137} C${cx + 57} ${peak + 109} ${cx + 51} ${peak + 56} ${cx} ${peak + 25}Z" stroke="#141914" stroke-width="4" fill="none"/>

}

function rose(cx, cy, r) {
  const petals = Array.from({length:8}, (_,i) => `<path d="M0 0Q-${r*.37} -${r*.44} 0 -${r*.88}Q${r*.37} -${r*.44} 0 0Z" transform="rotate(${i*45})" fill="${["#8c6b46","#64684d","#397064","#8f5c45"][i%4]}"/>`).join("");
  return `<g transform="translate(${cx} ${cy})" stroke="#18201a" stroke-width="2.3">
  <circle r="${r+4}" fill="#221e16" stroke="#9e856045" stroke-width="1.4"/><circle r="${r}" fill="url(#quarry)"/>
  ${petals}<circle r="${r*.15}" fill="#c2a268" stroke="#332820"/></g>`;
}

      freeze.setAttribute("aria-pressed",String(!frozen));
      freeze.lastElementChild.textContent = frozen ? "Freeze" : "Unfreeze";
    });
  }
  const demos = {"hover-shop":["home-guard",.56,.31], "hover-board":["hedge-lancer",.65,.86], "hover-spell":["sharpen",.6,.55], "keywords-off":["home-guard",.56,.31]};
  const demo = demos[view];
  if (demo) {
    const [id,x,y] = demo;
    const node = screen.querySelector(`[data-card="${id}"]`);
    document.fonts.ready.then(()=>{
      const box = node.getBoundingClientRect();
      const pos = {x:box.left+box.width*x,y:box.top+box.height*y};
      pointer.hidden = false;
      pointer.style.cssText = `left:${pos.x}px;top:${pos.y}px`;
      inspect(node,pos);
    });
  }
}
</script>
</body>
