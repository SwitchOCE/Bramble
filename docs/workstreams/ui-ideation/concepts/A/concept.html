      <path d="M280 9 551 173V826L280 991 9 826V173Z" fill="#1d2a25" fill-opacity=".79" stroke="#0b1611" stroke-width="14"/>
      <path d="M280 30 532 183V815L280 970 28 815V183Z" fill="none" stroke="#89754f" stroke-opacity=".79" stroke-width="4"/>
      <path d="M280 47 515 191V807L280 953 45 807V191Z" fill="none" stroke="#53634d" stroke-width="3"/>
      <path d="M280 422 324 500 280 578 236 500Z M280 447 305 500 280 553 255 500Z" fill="none" stroke="#7a825e" stroke-opacity=".66" stroke-width="5"/>
    </svg>
  </div>`;
}
function cardFace(id, override={}) {
  const c = {...cards[id],...override};
  const coords = roundels[c.tier];
  const image = c.folder === "spell" ? `glass/art/${c.image}.jpg` : `units/${c.folder}/${id}.jpg`;
  const marks = c.marks?.map(([glyph,name,n])=>`<span class="mark" aria-hidden="true" title="${name}">${icon(glyph)}${n ?? ""}</span>`).join("") ?? "";
  const stat = (value,x,y,cls) => `<span class="unit-stat ${cls}" style="left:${x}%;top:${y}%">${value}</span>`;
  const label = [c.name,c.golden && "Golden",`Tier ${c.tier}`, c.attack != null && `${atta(c)} Attack, ${hp(c)} Health`,c.marks?.map(markName).join(", "),c.renown && `Renown ${c.renown}`].filter(Boolean).join(", ");
  return `<button type="button" class="card-face ${c.golden ? "golden" : ""}" data-card="${id}" aria-label="${label}" aria-controls="read-content" aria-pressed="false">
    <img class="card-art" src="${asset + image}" alt=""><img class="card-frame" src="${asset}glass/frames/tier${c.tier}.webp" alt="">
    ${c.attack == null ? "" : stat(atta(c), coords[0],coords[1],"atk") + stat(hp(c),coords[2],coords[3],c.wounded ? "hp wounded" : "hp")}
    ${marks ? `<span class="mark-row">${marks}</span>` : ""}
    ${c.pips ? `<span aria-hidden="true" class="pips ${c.supply?"supply":""}">${"<i></i>".repeat(c.pips)}</span>` : ""}
    ${c.renown ? `<span aria-hidden="true" class="renown">${icon("star")} Renown ${c.renown}</span>` : ""}
  </button>`;
}
function caption(id, withPrice) {
  const c = cards[id];
  return `<div class="card-caption"><div class="caption-title">${c.name}${withPrice ? coin(c.price) : ""}</div><p class="caption-effect">${c.summary}</p></div>`;
}
function placement(x,y,w) {
  return `style="--x:${x}px;--y:${y}px;--w:${w}px"`;
}
function shop() {
  const gold = first ? 5 : 20, tier = first ? 1 : 5, upgrade = first ? 8 : 23;
  return `<section aria-label="Shop">
    <div class="placed shop-label"><h2 class="section-name">Shop</h2></div>
    <div class="placed shop-controls">
      <div class="purse"><span class="coin">${icon("spark")}</span><strong>${gold}</strong><span class="gold-word">Gold</span></div>
      <button class="plate-button upgrade" aria-disabled="true" aria-label="Upgrade from tier ${tier} to tier ${tier+1}, costs ${upgrade} gold, need ${upgrade-gold} more gold">${icon("up")} Upgrade ${coin(upgrade)}</button>
      <div class="readout upgrade-meta"><span>Tier ${tier} → ${tier+1}</span><span class="upgrade-shortfall">Need ${upgrade-gold} more gold</span><span>${icon("stall")} −${first?1:3} next turn</span></div>
      <div class="readout refresh-meta">10 at this price</div>
      <button class="plate-button" aria-label="Refresh for 1 gold">${icon("refresh")} Refresh ${coin(1)}</button>
      <button class="plate-button" id="freeze" type="button" aria-pressed="false">${icon("freeze")} <span>Freeze</span></button>
    </div>
    ${offers.map((id,i)=>`<div class="shop-offer" ${placement(584+i*188,110,175)}>${cardFace(id)}${caption(id,true)}</div>`).join("")}
    <section class="placed spell-light" aria-label="Shop spells">
      <h3 class="cap">Spells</h3>
      <div class="spell-pair">${[0,1].map(()=>`<div class="spell-offer">${cardFace("sharpen")}${coin(1)}</div>`).join("")}</div>
      <p class="spell-caption">Sharpen</p><p class="spell-effect">+2/+2 to an ally</p>
    </section>
  </section>`;
}
function boardRow(ids, positions, y, w, kind, options={}) {
  return ids.map((id,i)=>{
    const {captioned=false,echo=false,variants={}} = options;
    const art = id ? cardFace(id,variants[id]) : emptySlot(`${kind} ${i+1}, empty`);
    return `<div class="board-piece ${echo ? "after-echo" : ""}" ${placement(positions[i],y,w)}>${art}${captioned&&id?caption(id,false):""}</div>`;
  }).join("");
}
const frontPositions = [438,786,1134,1482], backPositions = [612,960,1308];
function recruitBoard() {
  const fronts = first ? Array(4).fill(null) : yourFront;
  const backs = first ? Array(3).fill(null) : yourBack;
  return `<section aria-label="Your board">
    <h2 class="sr-only">Your board</h2>
    <div class="placed row-key front-key">Front row</div>
    <div class="placed row-key back-key">Back row</div>
    ${boardRow(fronts,frontPositions,526,168,"Front slot",{captioned:true})}
    ${boardRow(backs,backPositions,705,168,"Back slot",{captioned:true})}
    ${first ? '<p class="cue placed">Drag a unit from the shop to an empty slot.</p>' : ""}
  </section>`;
}
function fightBoard() {
  const front = after ? Array(4).fill(null) : [...yourFront.slice(0,3),null];
  const back = after ? Array(3).fill(null) : yourBack;
  const bottomVariants = {"blackberry-sprawl":{fightAttack:8,fightHealth:12}};
  return `<section aria-label="March Hare's board">
    ${after ? '<h2 class="placed after-board-title">March Hare’s starting board</h2>' : '<h2 class="sr-only">March Hare’s board</h2>'}
    <div class="placed row-key fight-row-key far">Back row</div>
    <div class="placed row-key fight-row-key enemy-front">Front row</div>
    ${boardRow(enemyBack,backPositions,after ? 106 : 81,160,"Back slot")}
    ${boardRow(enemyFront,frontPositions,233,160,"Front slot")}
  </section>
  <div class="fight-centre" aria-hidden="true">${bracket(`${icon("swords")} ${after ? "Fight ended" : "Fight"}`)}</div>
  <section aria-label="Your board">
    <h2 class="sr-only">Your board</h2>
    ${after ? "" : '<div class="placed row-key fight-row-key near">Front row</div><div class="placed row-key fight-row-key your-back">Back row</div>'}
    ${boardRow(front,frontPositions,548,160,"Front slot",{echo:after})}
    ${boardRow(back,backPositions,747,160,"Back slot",{echo:after,variants:bottomVariants})}
  </section>`;
}
function hand() {
  const ids = first ? [] : ["seek"];
  return `<section class="side hand" aria-label="Hand, ${ids.length} of 7">
    <div class="light-heading"><h2 class="section-name">Hand</h2><strong>${ids.length}/7</strong></div>
    <div class="hand-tray">${Array.from({length:7},(_,i)=>{
      const firstRow = i < 4;
      const x = firstRow ? i*63+5 : (i-4)*63+36.5;
      const y = firstRow ? 0 : 127;
      return `<div class="hand-slot" style="top:${y}px;left:${x}px">${ids[i] ? cardFace(ids[i]) + `<span class="hand-label">${cards[ids[i]].name}</span>` : emptySlot("Empty hand slot")}</div>`;
    }).join("")}</div>
  </section>`;
}
function menu() {
  const entries = recruit||after ? ["Past boards","Cards","Settings"] : ["Settings"];
  return `<details class="side game-menu"><summary class="plate-button">Game ${icon("menu")}</summary><div class="game-menu-content">${entries.map(x=>`<button type="button">${x}</button>`).join("")}</div></details>`;
}
function standings() {
  const players = first ? [self,enemy,roster[0],roster[1],roster[2],roster[3],roster[5],roster[7]] :
    after ? [enemy,roster[2],roster[5],roster[0],roster[1],roster[3],self,roster[7]] : roster;
  return `<section class="side right roster" aria-label="${after ? "Final standings" : "Standings"}">
    <div class="light-heading"><h2 class="section-name">${after ? "Final standings" : "Standings"}</h2></div>
    <ol class="roster-list">${players.map(([name,key,amount],i)=>{
      const isSelf = key === self[1], isNext = key === enemy[1] && !after;
      const hpValue = first ? 40 : after ? (i === 0 ? 16 : 0) : amount;
      const out = hpValue === null || hpValue === 0;
      const status = isNext ? "Next fight" : isSelf ? "You" : "";
      const rank = first ? "–" : i+1;
      return `<li class="roster-row ${isNext?"next":""} ${isSelf?"you":""} ${out?"eliminated":""}">
        <span class="roster-rank">${rank}</span>${portrait(key)}
        <span class="roster-name">${name}${status ? `<span class="roster-status">${status}</span>` : ""}</span>
        <span class="roster-end ${out?"out":""}" aria-label="${out?"Out":`${hpValue} Health`}">${out?"Out":hpValue}</span>
      </li>`;
    }).join("")}</ol>
  </section>`;
}
function turnAction() {
  return `<section class="side right turn-action" aria-label="End turn">
    <div class="next-profile">${icon("swords")} March Hare ${health(first?40:16)}</div>
    ${first ? '<button class="action-button" type="button">End turn</button>' : '<a class="action-button" href="?view=fight">End turn</a>'}
    <p class="income">${icon("spark")} +${first?7:19} gold next turn</p>
  </section>`;
}
function reader() {
  return `<section class="side reader seamed" aria-label="Card details">
    <div class="reader-title">${icon("glass")} <h2 class="cap">Card details</h2></div>
    <div class="reader-content" id="read-content" aria-live="polite" aria-atomic="true"></div>
  </section>`;
}
function defeat() {
  return `<section class="result" aria-label="Fight result">
    <svg class="result-seams" viewBox="0 0 618 363" preserveAspectRatio="none" aria-hidden="true">
      <path d="M33 8H585L610 40V323L585 355H33L8 323V40Z" fill="none" stroke="#ad8c62" stroke-opacity=".56"/>
      <g fill="#966449" fill-opacity=".45" stroke="#251b16" stroke-width="2"><path d="M8 40 44 20 31 62 8 91Z"/><path d="M610 40 574 20 587 62 610 91Z"/><path d="M8 323 44 343 31 301 8 272Z"/><path d="M610 323 574 343 587 301 610 272Z"/></g>
      <path d="M25 78V285M593 78V285" stroke="#a7895d" stroke-opacity=".39"/>
    </svg>
    <h2>Defeat</h2><p class="result-place">You placed 7th</p>
    <div class="loss-stats">
      <p class="loss-stat"><b>−13</b><span>Damage taken</span></p>
      <p class="loss-stat"><b>11 → 0</b><span>Your Health</span></p>
    </div>
    <p class="loss-detail">Your board was wiped out.</p>
    <p class="loss-detail"><b>10 turn damage + 3 for a heavy loss.</b><br>March Hare kept more than half their starting units.</p>
  </section>`;
}
function fightOpponent() {
  return `<section class="side right fight-profile" aria-label="Opponent">
    <h2 class="cap">Opponent</h2>${portrait(enemy[1])}
    <p class="section-name">March Hare</p>${health(16)}
  </section>`;
}
function bottomAction() {
  return after
    ? `<div class="side right after-action"><a class="action-button" href="?view=first">Play again</a><div class="secondary-actions"><button class="plate-button">Start screen</button><button class="plate-button">Quit</button></div></div>`
    : `<div class="side right fight-skip"><a class="action-button" href="?view=after">${icon("skip")} Skip</a></div>`;
}
const selfHealth = first ? 40 : after ? 0 : 11;
screen.innerHTML = recruit
  ? `<section class="side left-top"><p class="turn">Turn ${first?1:9}</p>${profile(self,selfHealth,"You")}${first?"":counters(3)}</section>
      ${reader()}${shop()}${recruitBoard()}${hand()}${standings()}${turnAction()}${menu()}`
  : `<section class="side left-top"><p class="turn">Turn 9</p>${after ? profile(self,selfHealth,"Eliminated") : ""}</section>
      ${reader()}${fightBoard()}
      ${after ? defeat()+standings() : `<section class="side fight-you">${profile(self,selfHealth,"You")}${counters(4)}</section>`+fightOpponent()}
      ${bottomAction()}${menu()}`;

const defaultCard = recruit ? offers[0] : after ? "gorger" : "greatsword-bearer";
let pinned = null;
let visible = null;
function renderRead(id) {
  if (visible === id) return;
  visible = id;
  const pane = document.getElementById("read-content");
  const card = cards[id];
  const inCombat = view === "fight";
  if (!card) {
    const isCompost = id === "compost";
    pane.innerHTML = isCompost
      ? `<h3>Compost</h3><div class="meta">${inCombat?4:3} units · Newest first</div><p class="rules">${inCombat?"Granary Glutton<br>":""}Old Campaigner<br>Blackthorn Sapling<br>Blackthorn Sapling</p><p class="help">Units you bought go here when you sell them.</p>`
      : '<h3>Tide</h3><div class="meta">+2 Attack</div><p class="rules">Your Locusts have this much extra Attack for the rest of the game.</p>';
  } else {
    const use = locationMeta(id);
    const cost = card.price && (use === "offer" || use === "hand") ? ` · ${card.price} gold` : "";
    const sale = use === "board" ? `<p class="help"><b>Sell for ${Math.ceil(card.tier/2)} gold</b></p>` : "";
    const effectLines = card.rules.split(/(?<=\.) (?=[A-Z])/);
    const keywordIcons = {Seed:"seed",Guard:"shield",Reserve:"reserve","Hand-me-down":"handdown",Sortie:"sortie","Pile on":"pile",Grow:"grow",Fury:"flame",Renown:"star",Tide:"wave",Compost:"heap"};
    const keyword = (words) => {
      const term = Object.keys(keywordIcons).find(key => words === key || words.startsWith(key+" ") || words.startsWith(key+"."));
      return term ? icon(keywordIcons[term]) : "";
    };
    const notes = card.helps ?? [];
    const context = id === "gorger" && after
      ? '<p class="help"><b>38 Attack · 68 Health at the start.</b> March Hare’s largest unit began in the back row.</p>' : "";
    pane.innerHTML = `<h3>${card.golden ? "Golden " : ""}${card.name}</h3><p class="meta">${card.tribe} · Tier ${card.tier}${cost}</p>
      ${effectLines.map(line=>`<p class="rules effect">${keyword(line)}${line}</p>`).join("")}${context}
      ${notes.map(([term,rule])=>`<p class="help">${keyword(term)}<b>${term}</b> · ${rule}</p>`).join("")}${sale}`;
  }
  pane.scrollTop = 0;
}
const inspectors = [...document.querySelectorAll("[data-card],[data-read]")];
for (const node of inspectors) {
  const id = node.dataset.card ?? node.dataset.read;
  node.addEventListener("pointerenter",()=>renderRead(id));
  node.addEventListener("pointerleave",()=>renderRead(pinned ?? defaultCard));
  node.addEventListener("focus",()=>renderRead(id));
  node.addEventListener("blur",()=>renderRead(pinned ?? defaultCard));
  node.addEventListener("click",()=>{
    const wasPinned = node.getAttribute("aria-pressed") === "true";
    pinned = wasPinned ? null : id;
    for (const button of inspectors) button.setAttribute("aria-pressed",String(button===node&&!wasPinned));
    renderRead(pinned ?? id);
  });
}
if (view === "fight") {
  document.addEventListener("keydown", (event) => {
    if (event.code === "Space" && event.target === document.body && !event.repeat) {
      event.preventDefault();
      location.href = "?view=after";
    }
  });
}
if (recruit) {
  const freeze = document.getElementById("freeze");
  freeze.addEventListener("click",()=>{
    const frozen = freeze.getAttribute("aria-pressed") === "true";
    freeze.setAttribute("aria-pressed",String(!frozen));
    freeze.lastElementChild.textContent = frozen ? "Freeze" : "Unfreeze";
  });
}
renderRead(defaultCard);
</script>
</body>
</html>
