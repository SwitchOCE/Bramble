<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glazier's Bench</title>
<meta name="viewport" content="width=1920">
<style>
@font-face{font-family:Alegreya;src:url(../../../../../assets/glass/fonts/Alegreya[wght].ttf);font-weight:400 900}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Regular.ttf);font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Bold.ttf);font-weight:700}
:root{
  --lead:#15100b; --ink:#22170c; --ink-2:#47331f;
  --text-lt:#f7eed6; --text-lt2:#e6d9bc; --text-lt3:#d6c29b;
  --stone:#5b5146; --hurt:#7d0905; --up:#1b5a17;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#1c140e}
body{position:relative;font-family:"Alegreya Sans",sans-serif;color:var(--text-lt)}

/* ---------- the scene: the commissioned picture, unchanged ---------- */
#bg{position:absolute;inset:0;overflow:hidden;background:url(background.jpg) 0 0/1920px 1080px no-repeat}
body.raised #bg{background:url(background.jpg) -1658px -30px/5236px 2945px no-repeat}
body.sheet #bg{background:#2b2620}
.jamb{position:absolute;top:0;bottom:0;width:330px;background:url(g/stone.jpg) center/280px auto,var(--stone);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.45),inset 0 0 40px rgba(0,0,0,.55)}
.jamb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 3px,transparent 3px 96px)}

/* ---------- glass panes in lead ---------- */
.pane{position:absolute;border:4px solid var(--lead);border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(255,236,200,.22),inset 0 0 0 1px rgba(255,228,180,.10),inset 0 -8px 14px rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.55)}
.pane::after{content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;
  background:url(g/pane.jpg) center/300px auto;mix-blend-mode:soft-light;opacity:.45}
.g-smoke,.label{background:linear-gradient(172deg,#4d4033,#3a2f25 55%,#2b221a)}
.g-lit{background:radial-gradient(ellipse 90% 120% at 40% 30%,#fffae6,#f8e3a0 45%,#e8bb5c 100%);color:var(--ink)}
.accent{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 0 0 2px rgba(255,238,176,.6),0 0 30px 8px rgba(255,216,120,.6),0 4px 10px rgba(0,0,0,.6)}
.marked{outline:2px solid #e9dcbd;outline-offset:-8px}

.rd{position:absolute;border-radius:50%;display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;color:#1a0f05;line-height:1;background-size:118% auto;background-position:center;
  box-shadow:0 0 0 3px var(--lead),0 3px 6px rgba(0,0,0,.6);text-shadow:0 0 5px rgba(255,242,205,.95),0 0 2px rgba(255,242,205,.95)}
.rd span{padding-top:.07em}
.rd.amber{background-image:url(g/rd-amber.png)}
.rd.ruby{background-image:url(g/rd-ruby.png);color:#fff6e8;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.9)}
.rd.cream{background-image:url(g/rd-cream.png)}
.rd.short{background-image:url(g/rd-clear.png);filter:brightness(.8)}

/* ---------- cards: art matted in a calm leaded frame ---------- */
.card{position:absolute;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.card .art{position:absolute;inset:0;background:linear-gradient(165deg,#a9ad98,#8d927e 55%,#7b806d)}
.card .art::after{content:"";position:absolute;inset:0;background:url(g/pane.jpg) center/240px auto;mix-blend-mode:soft-light;opacity:.55}
.card svg.fr{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* no filters: layout leads the eye; only a hovered or active card lights up */
.card.lit,.card.hover{filter:drop-shadow(0 0 2px #ffb21f) drop-shadow(0 0 9px rgba(255,165,20,.95)) drop-shadow(0 0 22px rgba(255,150,0,.55)) drop-shadow(0 16px 14px rgba(0,0,0,.4));z-index:6;transform:scale(1.05)}
.stat{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center}
.stat svg.shape{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);overflow:visible}
.stat b{position:relative;font-family:Alegreya,serif;font-weight:900;line-height:1;color:#150e08;letter-spacing:-.03em;padding-top:.08em;font-variant-numeric:lining-nums}
.stat.hurt b{color:var(--hurt)} .stat.up b{color:var(--up)}

/* ---------- labels and the hover tooltip ---------- */
.label{position:absolute;border:3px solid var(--lead);border-radius:4px;color:var(--text-lt);
  box-shadow:inset 0 1px 0 rgba(255,236,200,.3),inset 0 0 0 1px rgba(255,228,180,.10),inset 0 -6px 10px rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.5)}
.nm{font-family:Alegreya,serif;font-weight:800;font-size:18px;line-height:21px;color:var(--text-lt);white-space:nowrap}
.tr{font-size:14px;line-height:16px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-lt3);font-weight:700}
.tx{font-size:18px;line-height:22px;color:var(--text-lt2)}
.tx b{font-weight:700;color:#fff8e6}
.tip{position:absolute;z-index:30;width:300px;padding:14px 18px 16px;border:3px solid var(--lead);border-radius:6px;
  background:linear-gradient(172deg,#55473a,#3d3127 55%,#2d241b);
  box-shadow:inset 0 1px 0 rgba(255,236,200,.35),0 0 0 2px rgba(233,220,189,.5),0 12px 28px rgba(0,0,0,.65)}
.tip .nm{font-size:24px;line-height:27px}
.tip .tr{margin:3px 0 10px}
.tip .tx+.tx{margin-top:6px}
.tip .pt{position:absolute;width:22px;height:22px;background:#3d3127;border:3px solid var(--lead);transform:rotate(45deg)}
/* keyword reminders: one fixed shelf, bottom of the left lane; never follows the pointer */
.shelf{position:absolute;z-index:25;padding:12px 16px 14px;border:3px solid var(--lead);border-radius:6px;
  background:linear-gradient(172deg,rgba(58,47,37,.94),rgba(38,30,23,.94));box-shadow:inset 0 1px 0 rgba(255,236,200,.22),0 4px 10px rgba(0,0,0,.5)}
.shelf .tr{margin-bottom:8px}
.shelf .kwn{font-family:Alegreya,serif;font-weight:800;font-size:19px;line-height:22px;color:var(--text-lt)}
.shelf .kwt{font-size:16px;line-height:19px;color:var(--text-lt2);margin:2px 0 10px}

/* ---------- window, table, slots ---------- */
.bar{position:absolute;background:linear-gradient(90deg,#0d0906,#3b3127 45%,#0d0906);box-shadow:0 0 4px rgba(0,0,0,.5)}
.slot{position:absolute}
.slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* Renown: a violet diamond at the slot's top point, the number only */
.rn{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%) rotate(45deg);z-index:7;border:3px solid var(--lead);
  background:linear-gradient(135deg,#8d7fd8,#4f41a0 60%,#3a2f7a);box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.rn span{position:absolute;inset:0;transform:rotate(-45deg);display:grid;place-items:center;font-family:Alegreya,serif;font-weight:900;font-size:18px;color:#fbf6ff;padding-top:2px}

/* ---------- lanes ---------- */
.ctl{position:absolute}
.ctl .lab{position:absolute;font-family:Alegreya,serif;font-weight:800;font-size:22px;line-height:24px;color:var(--text-lt);text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap}
.ctl .sub{position:absolute;font-size:16px;line-height:18px;color:var(--text-lt2);text-shadow:0 1px 2px rgba(0,0,0,.9);white-space:nowrap}
.icon{position:absolute}
.ctl.dim .pane{filter:saturate(.5) brightness(.85)}
.plate{position:absolute;height:50px;display:flex;align-items:center;gap:10px;padding:0 14px 0 10px}
.plate .lab{position:static;font-size:20px}
.plate .val{margin-left:auto;font-family:Alegreya,serif;font-weight:900;font-size:26px;color:var(--text-lt);display:flex;align-items:center;gap:6px}
.chg{font-size:18px;font-weight:700;color:#cdeeb6;display:flex;align-items:center;gap:3px}
.portrait{position:absolute;border-radius:50%;background-size:cover;background-position:center;
  box-shadow:0 0 0 5px var(--lead),0 0 0 8px #74624a,0 0 0 11px var(--lead),0 6px 14px rgba(0,0,0,.7)}
.portrait.sm{box-shadow:0 0 0 3px var(--lead),0 0 0 5px #74624a,0 0 0 7px var(--lead),0 3px 6px rgba(0,0,0,.6)}
.prow .place{position:absolute;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-lt3);text-shadow:0 1px 2px #000}
.prow .pn{position:absolute;font-family:Alegreya,serif;font-weight:800;font-size:19px;line-height:21px;color:var(--text-lt);text-shadow:0 1px 2px #000}
.prow.out{filter:saturate(.2) brightness(.7)}
.prow .hpq{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#2a2119;box-shadow:0 0 0 3px var(--lead),inset 0 0 0 2px rgba(214,194,155,.45);font-family:Alegreya,serif;font-weight:900;font-size:21px;color:var(--text-lt);padding-top:2px}
.prow .outw{position:absolute;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-lt2)}
.btnlab{position:absolute;font-family:Alegreya,serif;font-weight:900;color:var(--ink);white-space:nowrap}
.btnlab.lt{color:var(--text-lt);font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.8)}

/* ---------- fight ---------- */
.panel{position:absolute;border:6px solid var(--lead);border-radius:4px;overflow:hidden;
  box-shadow:0 0 0 4px #6a5e50,0 0 0 7px var(--lead),0 12px 26px rgba(0,0,0,.55)}
/* the fight field is the picture's own glass: theirs the green window, yours the white light table */
.panel .q{position:absolute;inset:0;background:url(background.jpg) -760px -120px/3840px 2160px no-repeat}
.panel.mine .q{background-position:-1000px -1020px}
.transom{position:absolute;background:url(g/stone.jpg) center/280px auto,var(--stone);box-shadow:inset 0 0 0 3px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.5);z-index:1}
.splash{position:absolute;font-family:Alegreya,serif;font-weight:900;font-size:50px;color:#fff3e0;
  text-shadow:0 0 3px #6e0000,0 0 9px #6e0000,0 2px 0 #3a0000;transform:translate(-50%,-50%);z-index:9}
.cursor{position:absolute;z-index:40;width:30px;height:40px;pointer-events:none}
.sheetcap{position:absolute;font-size:16px;line-height:19px;color:var(--text-lt2);text-align:center}
</style>
</head>
<body>
<div id="bg"></div>
<div id="root"></div>

<script>
const A = "../../../../../assets/";
const root=document.getElementById("root");
const view=(new URLSearchParams(location.search).get("view"))||"mid";
function el(tag,cls,css,html){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e}
function put(parent,tag,cls,css,html){const e=el(tag,cls,css,html);parent.append(e);return e}
const pct=(x,y)=>`${(x/560*100).toFixed(3)}% ${(y/1000*100).toFixed(3)}%`;
const clip=pts=>`polygon(${pts.map(([x,y])=>pct(x,y)).join(",")})`;
const pts=p=>p.map(q=>q.join(",")).join(" ");

/* ---------- grid (pass 1, kept) ---------- */
const CX=960, CL=336, CR=1584, LL=24, LW=284, RL=1612, RW=284;
const WIN={top:14,bottom:356}, TAB={top:362,bottom:922}, LOW={top:930,bottom:1072};
const SHELF={top:716,bottom:922};   // the keyword shelf: bottom of the left lane, the same place in every view

/* ---------- the frame: drawn, calm. Tall hexagon, one band of smoky glass, lead, and the tier as beads in the top lead ---------- */
const OUT=[[280,6],[554,172],[554,828],[280,994],[6,828],[6,172]];
const INN=[[280,58],[516,196],[516,804],[280,942],[44,804],[44,196]];
const STAT={a:[118,786],h:[442,786]};
function frameSVG(tier,{golden=false,charge=null,uid,small=false}={}){
  const band=golden?`<linearGradient id="b${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#f2c04a"/><stop offset="1" stop-color="#c88a1e"/></linearGradient>`
                   :`<linearGradient id="b${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f6252"/><stop offset=".55" stop-color="#4c4134"/><stop offset="1" stop-color="#3a3128"/></linearGradient>`;
  const cuts=OUT.map((p,i)=>`M${p[0]} ${p[1]} L${INN[i][0]} ${INN[i][1]}`).join(" ")+" M6 500 L44 500 M554 500 L516 500";
  // tier: one numeral in a lead roundel at the bottom point; Charge sits as pips under the top point, well apart
  const beads=small?"":`<circle cx="280" cy="934" r="58" fill="${golden?"#f3cf6a":"#2a221b"}" stroke="#15100b" stroke-width="10"/>
    <text x="280" y="962" text-anchor="middle" font-family="Alegreya,serif" font-weight="900" font-size="80" fill="${golden?"#2a1a05":"#f3ead6"}">${tier}</text>`;
  let ch="";
  if(charge){const [tot,left]=charge, sp=46, w0=(tot-1)*sp;
    ch=`<rect x="${280-w0/2-30}" y="${246}" width="${w0+60}" height="48" rx="24" fill="#2a221b" stroke="#15100b" stroke-width="8"/>`;
    for(let i=0;i<tot;i++) ch+=`<circle cx="${280-w0/2+i*sp}" cy="270" r="14" fill="${i<left?"#efe6d2":"#2a221b"}" stroke="#e8dcc0" stroke-width="${i<left?0:4}"/>`;}
  return `<svg class="fr" viewBox="0 0 560 1000" preserveAspectRatio="none"><defs>${band}</defs>
    <path fill-rule="evenodd" d="M${pts(OUT).replace(/ /g," L")} Z M${pts(INN).replace(/ /g," L")} Z" fill="url(#b${uid})"/>
    <path fill-rule="evenodd" d="M${pts(OUT).replace(/ /g," L")} Z M${pts(INN).replace(/ /g," L")} Z" fill="url(#gl)" opacity=".5"/>
    <path d="${cuts}" stroke="#15100b" stroke-width="9" fill="none"/>
    <polygon points="${pts(OUT)}" fill="none" stroke="#15100b" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="${pts(INN)}" fill="none" stroke="#15100b" stroke-width="12" stroke-linejoin="round"/>
    <polygon points="${pts(OUT)}" fill="none" stroke="rgba(255,240,210,.22)" stroke-width="3" stroke-linejoin="round" transform="translate(0,5)"/>
    ${beads}${ch}</svg>`;
}
let UID=0;
document.body.insertAdjacentHTML("afterbegin",`<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/></linearGradient></defs></svg>`);

/* ---------- stats (kept from pass 1: six-sided Attack, round Health, a mark when changed) ---------- */
function statShape(kind,chg){
  const f=chg==="up"?"#bfe3b0":chg==="hurt"?"#f0b8ae":(kind==="a"?"#e4e8ec":"#f2e6d6");
  return kind==="a"
   ?`<svg class="shape" viewBox="0 0 100 100"><polygon points="27,4 73,4 98,50 73,96 27,96 2,50" fill="${f}" stroke="#15100b" stroke-width="8" stroke-linejoin="round"/></svg>`
   :`<svg class="shape" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${f}" stroke="#15100b" stroke-width="8"/></svg>`;
}
function statEl(kind,v,d,fs,chg,css=""){
  return el("span","stat "+kind+(chg?" "+chg:""),`width:${d}px;height:${d}px;${css}`,statShape(kind,chg)+`<b style="font-size:${fs}px">${v}</b>`);
}
const PRINTED={"famine-caller":[6,4],"squadron-leader":[4,9],"bell-ringer":[3,5],"granary-glutton":[5,7],"wing-commander":[8,14],"blackberry-sprawl":[4,8],"hedge-lancer":[6,12],"greatsword-bearer":[4,12],"briar-king":[8,16],"holly-knight":[5,12],"the-eighth-plague":[4,12],"weasel":[8,12],"gorger":[5,7],"dame-bodkin":[6,9],"home-guard":[3,11],"hayloft-aunt":[2,9],"sweetbriar":[3,7],"shrew-cutpurse":[2,4],"bramble-runner":[4,5]};

/* ---------- a unit card ---------- */
function card({folder,id,tier,atk,hp,h,x,y,golden=false,chg={},charge=null,state="rest",stats=true,small=false}){
  const w=h*.56, uid=++UID;
  const c=el("div",`card ${state}`+(golden?" golden":""),`left:${x-w/2}px;top:${y}px;width:${w}px;height:${h}px`);
  const a=el("div","art");a.style.clipPath=clip(INN);c.append(a);   // no card art this round: one blank pane
  c.insertAdjacentHTML("beforeend",frameSVG(tier,{golden,charge,uid,small:small||h<150}));
  if(!stats) return c;
  const d=Math.max(30,Math.round(h*.122)), fs=Math.max(18,Math.round(d*.58));
  const P=PRINTED[id], k=golden?2:1;
  if(P) chg={a:atk>P[0]*k?"up":null,h:hp>P[1]*k?"up":null,...Object.fromEntries(Object.entries(chg).filter(([,v])=>v))};
  [["a",atk],["h",hp]].forEach(([key,v])=>c.append(statEl(key,v,d,fs,chg[key],`left:${STAT[key][0]/5.6}%;top:${STAT[key][1]/10}%`)));
  return c;
}
/* ---------- a spell: a round medallion, not a unit's hexagon ---------- */
function spell({art,d,x,y,state="shop"}){
  const c=el("div",`card ${state}`,`left:${x-d/2}px;top:${y-d/2}px;width:${d}px;height:${d}px`);
  const a=el("div","art",`inset:13%;border-radius:50%;overflow:hidden`);c.append(a);
  let spokes="";for(let i=0;i<12;i++){const t=i*Math.PI/6;spokes+=`M${100+74*Math.cos(t)} ${100+74*Math.sin(t)} L${100+95*Math.cos(t)} ${100+95*Math.sin(t)} `}
  c.insertAdjacentHTML("beforeend",`<svg class="fr" viewBox="0 0 200 200"><defs><radialGradient id="sp${++UID}"><stop offset=".7" stop-color="#3f8f88"/><stop offset="1" stop-color="#1d4e58"/></radialGradient></defs>
    <path fill-rule="evenodd" d="M5 100 a95 95 0 1 0 190 0 a95 95 0 1 0 -190 0 Z M26 100 a74 74 0 1 0 148 0 a74 74 0 1 0 -148 0 Z" fill="url(#sp${UID})"/>
    <path d="${spokes}" stroke="#15100b" stroke-width="3.5"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="#15100b" stroke-width="7"/><circle cx="100" cy="100" r="74" fill="none" stroke="#15100b" stroke-width="5"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,240,210,.25)" stroke-width="1.5" transform="translate(0,2)"/></svg>`);
  return c;
}
function roundel(parent,kind,cx,cy,d,txt,fs,extra=""){
  return put(parent,"div","rd "+kind+(extra?" "+extra:""),`left:${cx-d/2}px;top:${cy-d/2}px;width:${d}px;height:${d}px;font-size:${fs}px`,`<span>${txt}</span>`)}

const ICON={
  swords:`<svg viewBox="0 0 40 40" width="30" height="30"><g stroke-linecap="round"><path d="M7 7 L31 31 M33 7 L9 31" stroke="#15100b" stroke-width="8"/><path d="M7 7 L31 31 M33 7 L9 31" stroke="#f3ead6" stroke-width="4"/><path d="M24 30 L31 23 M16 30 L9 23" stroke="#15100b" stroke-width="7"/><path d="M24 30 L31 23 M16 30 L9 23" stroke="#e0b35a" stroke-width="3.5"/></g></svg>`,
  refresh:`<svg viewBox="0 0 40 40" width="40" height="40"><path d="M31 14 A12 12 0 1 0 32 24" fill="none" stroke="#f7eed6" stroke-width="4.5" stroke-linecap="round"/><path d="M33.5 5.5 L32.8 16 L23 13.6 Z" fill="#f7eed6"/></svg>`,
  freeze:`<svg viewBox="0 0 40 40" width="40" height="40"><g stroke="#f7eed6" stroke-linecap="round" fill="none"><path d="M20 4v32M6.1 12l27.8 16M6.1 28l27.8-16" stroke-width="3.6"/><path d="M15 6.5l5 4 5-4M15 33.5l5-4 5 4M5.3 17.3l6 2.7-1.3 6.4M34.7 22.7l-6-2.7 1.3-6.4M5.3 22.7l6-2.7-1.3-6.4M34.7 17.3l-6 2.7 1.3 6.4" stroke-width="2.6"/></g></svg>`,
  upgrade:`<svg viewBox="0 0 40 40" width="40" height="40"><polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="none" stroke="#f7eed6" stroke-width="3.2" stroke-linejoin="round"/><path d="M12.5 22 L20 14.5 L27.5 22" fill="none" stroke="#f7eed6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16 V29" stroke="#f7eed6" stroke-width="4" stroke-linecap="round"/></svg>`,
  gold:`<svg viewBox="0 0 40 40" width="40" height="40"><g stroke="#15100b" stroke-width="2.4"><ellipse cx="20" cy="30" rx="14" ry="5.5" fill="#c98a1c"/><ellipse cx="20" cy="23" rx="14" ry="5.5" fill="#e0a53a"/><ellipse cx="20" cy="16" rx="14" ry="5.5" fill="#f3c65a"/></g><ellipse cx="17" cy="15" rx="6" ry="1.8" fill="rgba(255,250,220,.8)"/></svg>`,
  menu:`<svg viewBox="0 0 40 40" width="34" height="34"><g stroke="#f7eed6" stroke-width="4" stroke-linecap="round"><path d="M9 12h22M9 20h22M9 28h22"/></g></svg>`,
  skip:`<svg viewBox="0 0 40 40" width="34" height="34"><path d="M6 9 L19 20 L6 31Z M20 9 L33 20 L20 31Z" fill="#f7eed6" stroke="#f7eed6" stroke-width="2" stroke-linejoin="round"/></svg>`,
  replay:`<svg viewBox="0 0 40 40" width="32" height="32"><path d="M9 14 A12 12 0 1 1 8 24" fill="none" stroke="#f7eed6" stroke-width="4.5" stroke-linecap="round"/><path d="M6.5 5.5 L7.2 16 L17 13.6 Z" fill="#f7eed6"/></svg>`,

const MINE=[BOARD9[0],BOARD9[1],BOARD9[2],null,BOARD9[4],{...BOARD9[5],atk:8,hp:12},BOARD9[6]];
// the fight uses the board's rule: rows nest, one gap G=36 across and square to the slants
const FH=200, FG=36, FP=FH*.56+FG;
const FF=[CX-1.5*FP,CX-.5*FP,CX+.5*FP,CX+1.5*FP], FB=[CX-FP,CX,CX+FP];
const OPP_PANEL={top:4,bottom:528}, MY_PANEL={top:548,bottom:1074};
const STEP=Math.round(.83*FH+.866*FG);
const oppTop=Math.round((OPP_PANEL.top+OPP_PANEL.bottom-STEP-FH)/2), myTop=Math.round((MY_PANEL.top+MY_PANEL.bottom-STEP-FH)/2);
const FY={oppBack:oppTop,oppFront:oppTop+STEP,myFront:myTop,myBack:myTop+STEP};
function fightFrame(){

  put(root,"div","panel mine",`left:${CL}px;top:${MY_PANEL.top}px;width:${CR-CL}px;height:${MY_PANEL.bottom-MY_PANEL.top}px`).append(el("div","q"));
  put(root,"div","transom",`left:${CL-12}px;top:${OPP_PANEL.bottom+6}px;width:${CR-CL+24}px;height:${MY_PANEL.top-OPP_PANEL.bottom-8}px`);

function shards(x,y,h=FH){

    <polygon points="372,860 470,750 540,830 470,905" fill="rgba(120,165,110,.75)"/><polygon points="120,420 230,360 260,470 160,520" fill="rgba(160,90,140,.7)"/></g></svg>`);
}
function reserves(top){
  const R=put(root,"div","ctl",`left:${LL}px;top:${top}px;width:${LW}px;height:${WIN.bottom-top}px`);
  put(R,"div","pane g-smoke",`inset:0`);
  [{folder:"pigeon",id:"home-guard",tier:3,atk:3,hp:11},{folder:"mouse",id:"hayloft-aunt",tier:2,atk:2,hp:9}].forEach((u,i)=>R.append(card({...u,h:150,x:84+i*116,y:30,small:true})));
}
function stakesPlaque(){
  const P=put(root,"div","label",`left:${LL}px;top:${WIN.top}px;width:${LW}px;height:136px;padding:12px 16px`);

   <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="nm" style="font-size:20px">Kills 0 of 4</span></div>`;
}
function fightUnit(u,x,y,state,opts={}){return unitOnBoard(u,x,y,FH,{state,...opts})}
function viewFight(){
  fightFrame();
  OPP.slice(4).forEach((u,i)=>fightUnit(u,FB[i],FY.oppBack,"rest"));

  [1,2].forEach(i=>fightUnit(MINE[i],FF[i],FY.myFront,"rest"));
  slotOutline(FF[3],FY.myFront,FH);
  MINE.slice(4).forEach((u,i)=>fightUnit(u,FB[i],FY.myBack,"rest",i===1?{chg:{a:"up",h:"up"}}:{}));

  slotOutline(FF[0],FY.myFront,FH,{renown:7}); shards(FF[0],FY.myFront);
  const hk=fightUnit(OPP[2],FF[2],FY.oppFront,"lit",{atk:24,hp:12,chg:{a:"up",h:"hurt"}});

    <path d="M${x2+6} ${y2-28} L${x2-6} ${y2+8} L${x2+32} ${y2+2} Z" fill="#fff6d2" stroke="#15100b" stroke-width="2.5" stroke-linejoin="round"/></svg>`);
  put(root,"div","splash",`left:${FF[0]}px;top:${FY.myFront+FH*.5}px`,"−24");
  put(root,"div","splash",`left:${FF[2]+2}px;top:${FY.oppFront+FH*.42}px`,"−15");
  stakesPlaque(); reserves(WIN.top+144);
  youBlock({hp:11,counters:[{icon:"compost",name:"Compost",val:4},{icon:"tide",name:"Tide",val:4,chg:"2"}]});
  playersList(PLAYERS9.map(p=>p.tag?{...p,tag:"Fighting"}:p));
  menuAndTurn(9,"Fight");
  bigButton({lit:false,icon:"skip",word:"Skip"});
}
const OPP_END=[{...OPP[0],hp:10,chg:{h:"hurt"}},null,{...OPP[2],atk:24,hp:27},OPP[3],{...OPP[4],hp:2,chg:{h:"hurt"}},{...OPP[5],hp:57,chg:{h:"hurt"}},OPP[6]];

  [[FB[1],FY.oppBack],[FF[2],FY.oppFront],[FF[1],FY.oppFront]].forEach(([x,y],i)=>roundel(root,"cream",x,y+FH*.45,44,i+1,24).style.zIndex=8);
  const P=put(root,"div","label",`left:${CX-470}px;top:${MY_PANEL.top+46}px;width:940px;height:420px;z-index:8;padding:0;box-shadow:inset 0 1px 0 rgba(255,236,200,.3),0 0 0 5px #6a5e50,0 0 0 9px var(--lead),0 14px 30px rgba(0,0,0,.6)`);
  const beat=(n,html)=>`<div class="rd cream" style="position:relative;width:34px;height:34px;font-size:20px"><span>${n}</span></div><div>${html}</div>`;
  P.innerHTML=`<div style="position:absolute;left:34px;top:22px;font-family:Alegreya,serif;font-weight:900;font-size:40px;line-height:44px">Out in 7th</div>
   <div class="tx" style="position:absolute;left:36px;top:74px;font-size:19px">March Hare broke all of your units. You broke one: Briar King.</div>

       ${beat(1,"<b>Gorger</b>, golden, 38/68 at the start. Its Health was more than your whole board's Attack.")}
       ${beat(2,"<b>Holly Knight</b>, on a slot with 7 Renown. It grew from 12/19 to 24/27 during the fight.")}
       ${beat(3,"<b>Briar King</b>, 12/20 at the start. It gave their Briars Grow 2 before you broke it.")}</div></div>
   <div style="position:absolute;left:34px;right:34px;top:282px;height:2px;background:rgba(255,236,200,.25)"></div>
   <div class="tr" style="position:absolute;left:34px;top:296px;font-size:15px">At the start of the fight</div>
   <div class="tx" style="position:absolute;left:34px;top:318px;display:flex;gap:40px"><span><b style="font-family:Alegreya,serif;font-size:20px">Their board</b>&nbsp; 90 Attack · 158 Health</span><span><b style="font-family:Alegreya,serif;font-size:20px">Your board</b>&nbsp; 49 Attack · 68 Health</span></div>`;
  const b1=put(P,"div","pane g-smoke",`right:34px;top:340px;width:236px;height:56px`);
  put(b1,"div","icon",`left:16px;top:8px`,ICON.replay); put(b1,"div","btnlab lt",`left:60px;top:11px;font-size:23px`,"Watch again");
  const W=put(root,"div","label",`left:${LL}px;top:${WIN.top}px;width:${LW}px;height:${WIN.bottom-WIN.top}px;padding:16px 18px`);
  const row=(a,b)=>`<div class="tx" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0 9px;border-bottom:2px solid rgba(255,236,200,.22)"><span>${a}</span><b style="font-family:Alegreya,serif;font-size:24px">${b}</b></div>`;
  W.innerHTML=`<div class="nm" style="font-size:26px;line-height:30px;margin-bottom:6px">Why −13</div>${row("Lost on turn 9","10")}${row("Big loss: 1 kill of 4","+3")}
    <div class="tx" style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-weight:700;color:#fff8e6"><span>Health 11 → 0</span><b style="font-family:Alegreya,serif;font-size:32px;color:#ffd9cf">−13</b></div>`;
  youBlock({hp:0,counters:[{icon:"compost",name:"Compost",val:4},{icon:"tide",name:"Tide",val:4}]});
  menuAndTurn(9,"Fight over");
  playersList([{p:1,n:"Dame Hoolet",f:"dame_hoolet",hp:23},{p:2,n:"Pipkin",f:"pipkin",hp:21},{p:3,n:"Little King Wren",f:"little_king_wren",hp:18},{p:4,n:"Old Mother Mousewife",f:"old_mother_mousewife",hp:18},{p:5,n:"March Hare",f:"march_hare",hp:16,tag:"Beat you"},{p:6,n:"Hob Mumblecrust",f:"hob_mumblecrust",hp:16},{p:7,n:"Dame Farthing",f:"dame_farthing",hp:0,you:true,out:true},{p:8,n:"Brother Bracken",f:"brother_bracken",hp:0,out:true}]);

}

   {folder:"pigeon",id:"squadron-leader",tier:3,atk:4,hp:9},{folder:"locust",id:"granary-glutton",tier:4,atk:5,hp:7},

  const gx=150+6*196; root.append(card({folder:"locust",id:"gorger",tier:4,atk:10,hp:14,golden:true,h:BH,x:gx,y:80})); cap(gx,BH+96,"Golden: in the metal");

  root.append(spell({art:"",d:224,x:990,y:650,state:"rest"})); cap(990,860,"Spell medallion");
  // hovered: lit; golden is not lit, only gilded
  const hx=1300; const c=card({...T[3],h:BH,x:hx,y:560,state:"hover"}); root.append(c);
  tooltip({name:"Granary Glutton",tribe:"Locust",tier:4,text:"Whenever you sell a Locust, this <b>eats</b> it."},{x:hx+BH*.28+22,y:580,side:"right"});
  cap(hx,580+BH,"Hovered: lit",220);
  pointer(hx+10,560+BH*.45);
}

const V={mid:()=>viewMid(),"mid-b":()=>viewMid(),first:viewFirst,fight:viewFight,after:viewAfter,"hover-shop":viewHoverShop,"hover-board":viewHoverBoard,"hover-spell":viewHoverSpell,"keywords-off":viewHoverShop,cards:viewCards};
(V[view]||V.mid)();
