<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glazier's Bench</title>
<meta name="viewport" content="width=1920">
<style>
@font-face{font-family:Alegreya;src:url(../../../../../assets/glass/fonts/Alegreya[wght].ttf);font-weight:400 900}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Regular.ttf);font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Bold.ttf);font-weight:700}
:root{
  --lead:#15100b;
  --ink:#22170c; --ink-2:#47331f;
  --text-lt:#f7eed6; --text-lt2:#e6d9bc; --text-lt3:#d6c29b;
  --stone:#5b5146;
  --hurt:#a10f0a; --up:#1b5a17;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#1c140e}
body{position:relative;font-family:"Alegreya Sans",sans-serif;color:var(--text-lt)}

/* ---------- the scene: the commissioned picture (background.jpg), unchanged ---------- */
#bg{position:absolute;inset:0;overflow:hidden;background:url(background.jpg) 0 0/1920px 1080px no-repeat}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 75% at 50% 45%,rgba(0,0,0,0) 62%,rgba(0,0,0,.38) 100%)}
body.raised #bg{background:url(background.jpg) -1658px -30px/5236px 2945px no-repeat}
.jamb{position:absolute;top:0;bottom:0;width:330px;background:url(g/stone.jpg) center/280px auto,var(--stone);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.45),inset 0 0 40px rgba(0,0,0,.55)}
.jamb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 3px,transparent 3px 96px)}

/* ---------- glass panes in lead ---------- */
.pane{position:absolute;border:4px solid var(--lead);border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(255,236,200,.22),inset 0 0 0 1px rgba(255,228,180,.10),inset 0 -8px 14px rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.55)}
.pane::after{content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;
  background:url(g/pane.jpg) center/300px auto;mix-blend-mode:soft-light;opacity:.45}
/* the one quiet tone every control, row and plaque shares: smoky umber glass */
.g-smoke,.label{background:linear-gradient(172deg,#4d4033,#3a2f25 55%,#2b221a)}
.g-lit{background:radial-gradient(ellipse 90% 120% at 40% 30%,#fffae6,#f8e3a0 45%,#e8bb5c 100%);color:var(--ink)}
.accent{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 0 0 2px rgba(255,238,176,.6),0 0 30px 8px rgba(255,216,120,.6),0 4px 10px rgba(0,0,0,.6)}
.marked{outline:2px solid #e9dcbd;outline-offset:-8px}

/* roundel: a round of glass in a lead ring (money: amber; Health: ruby) */
.rd{position:absolute;border-radius:50%;display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;color:#1a0f05;line-height:1;
  background-size:118% auto;background-position:center;
  box-shadow:0 0 0 3px var(--lead),0 3px 6px rgba(0,0,0,.6);text-shadow:0 0 5px rgba(255,242,205,.95),0 0 2px rgba(255,242,205,.95)}
.rd span{padding-top:.07em}
.rd.amber{background-image:url(g/rd-amber.png)}
.rd.ruby{background-image:url(g/rd-ruby.png);color:#fff6e8;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.9)}
.rd.clear{background-image:url(g/rd-clear.png)}
.rd.cream{background-image:url(g/rd-cream.png)}
.rd.short{background-image:url(g/rd-clear.png);filter:brightness(.8)}

/* ---------- cards ---------- */
.card{position:absolute;filter:drop-shadow(0 5px 7px rgba(0,0,0,.55))}
.card .art{position:absolute;inset:0;background-size:100% 100%}
.card .frame,.card .spell-lead{position:absolute;inset:0;width:100%;height:100%}
.card.golden{filter:drop-shadow(0 0 3px #ffe27a) drop-shadow(0 0 12px rgba(255,214,90,.9)) drop-shadow(0 5px 7px rgba(0,0,0,.5))}
/* stats: Attack on a pale six-sided stone, Health on a pale round one; both sit in the frame's disc zone */
.stat{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center}
.stat svg.shape{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);overflow:visible}
.stat b{position:relative;font-family:Alegreya,serif;font-weight:900;line-height:1;color:#150e08;letter-spacing:-.03em;padding-top:.08em;font-variant-numeric:lining-nums}
.stat.hurt b{color:var(--hurt)}
.stat.up b{color:var(--up)}

/* ---------- painted labels: tinted glass in lead ---------- */
.label{position:absolute;border:3px solid var(--lead);border-radius:4px;color:var(--text-lt);
  box-shadow:inset 0 1px 0 rgba(255,236,200,.3),inset 0 0 0 1px rgba(255,228,180,.10),inset 0 -6px 10px rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.5)}
.nm{font-family:Alegreya,serif;font-weight:800;font-size:18px;line-height:21px;color:var(--text-lt);white-space:nowrap}
.tr{font-size:14px;line-height:16px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-lt3);font-weight:700}
.tx{font-size:18px;line-height:21px;color:var(--text-lt2)}
.tx b{font-weight:700;color:#fff8e6}
.shoplabel{padding:5px 8px}
.shoplabel .tr{margin:1px 0 3px}
.boardlabel{text-align:center;padding:1px 8px 2px;transform:translateX(-50%);z-index:2}
.boardlabel .kw{font-size:18px;line-height:21px;color:var(--text-lt2);font-weight:700;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
body.raised .boardlabel{padding:1px 8px 2px}
body.raised .boardlabel .nm{line-height:20px}
body.raised .boardlabel .kw{line-height:20px}
.pips{display:inline-flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:50%;border:2px solid #f2e6c8;display:block}
.pips i.on{background:#f2e6c8}

/* ---------- window, table, slots ---------- */
.bar{position:absolute;background:linear-gradient(90deg,#0d0906,#3b3127 45%,#0d0906);box-shadow:0 0 4px rgba(0,0,0,.5)}
.slot{position:absolute}
.slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* Renown: a labelled tab on the slot's shoulder, blue-violet glass, never gold */
.rtab{position:absolute;height:27px;padding:0 7px;border:2.5px solid var(--lead);border-radius:4px;z-index:3;
  background:linear-gradient(175deg,#6a5cb8,#46398a 60%,#382d72);color:#fbf6ff;white-space:nowrap;
  font-size:18px;line-height:21px;font-weight:700;display:flex;align-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 4px rgba(0,0,0,.6)}

/* ---------- side lanes ---------- */
.ctl{position:absolute}
.ctl .lab{position:absolute;font-family:Alegreya,serif;font-weight:800;font-size:22px;line-height:24px;color:var(--text-lt);text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap}
.ctl .sub{position:absolute;font-size:16px;line-height:18px;color:var(--text-lt2);text-shadow:0 1px 2px rgba(0,0,0,.9);white-space:nowrap}
.icon{position:absolute}
.ctl.dim .pane{filter:saturate(.5) brightness(.85)}
.plate{position:absolute;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px 0 10px}
.plate .lab{position:static;font-size:20px}
.plate .val{margin-left:auto;font-family:Alegreya,serif;font-weight:900;font-size:26px;color:var(--text-lt);display:flex;align-items:center;gap:6px}
.plate svg{display:block}
.chg{font-family:"Alegreya Sans",sans-serif;font-size:18px;font-weight:700;color:#cdeeb6;display:flex;align-items:center;gap:3px}
.portrait{position:absolute;border-radius:50%;background-size:cover;background-position:center;
  box-shadow:0 0 0 5px var(--lead),0 0 0 8px #74624a,0 0 0 11px var(--lead),0 6px 14px rgba(0,0,0,.7)}
.portrait.sm{box-shadow:0 0 0 3px var(--lead),0 0 0 5px #74624a,0 0 0 7px var(--lead),0 3px 6px rgba(0,0,0,.6)}
.prow .place{position:absolute;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-lt3);text-shadow:0 1px 2px #000}
.prow .pn{position:absolute;font-family:Alegreya,serif;font-weight:800;font-size:19px;line-height:21px;color:var(--text-lt);text-shadow:0 1px 2px #000}
.prow.marked-row .place{color:#fff3d6}
.prow.out:not(.you){filter:saturate(.2) brightness(.75)}
.prow .outw{position:absolute;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-lt2)}
.btnlab{position:absolute;font-family:Alegreya,serif;font-weight:900;color:var(--ink);white-space:nowrap}
.btnlab.lt{color:var(--text-lt);font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.8)}

/* ---------- fight ---------- */
.panel{position:absolute;border:6px solid var(--lead);border-radius:4px;overflow:hidden;
  box-shadow:0 0 0 4px #6a5e50,0 0 0 7px var(--lead),0 12px 26px rgba(0,0,0,.55)}
/* the quarry field: warm frosted glass, soft lines, so the pieces are the brightest thing */
.panel .q{position:absolute;inset:0;
  background:
   repeating-linear-gradient(60deg,rgba(45,34,22,.20) 0 2px,transparent 2px 52px),
   repeating-linear-gradient(-60deg,rgba(45,34,22,.20) 0 2px,transparent 2px 52px),
   linear-gradient(180deg,rgba(168,150,118,.86),rgba(150,133,103,.88))}
.panel .q::after{content:"";position:absolute;inset:0;background:url(g/pane.jpg) center/300px auto;mix-blend-mode:soft-light;opacity:.5}
.transom{position:absolute;background:url(g/stone.jpg) center/280px auto,var(--stone);box-shadow:inset 0 0 0 3px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.5);z-index:1}
.splash{position:absolute;font-family:Alegreya,serif;font-weight:900;font-size:46px;color:#fff3e0;
  text-shadow:0 0 3px #6e0000,0 0 9px #6e0000,0 2px 0 #3a0000;transform:translate(-50%,-50%);z-index:7}
</style>
</head>
<body>
<div id="bg"></div>
<div id="root"></div>

<script>
const A = "../../../../../assets/";
const ROUND={"tier1":{"a":[110.8,778.5,62.4],"h":[448.8,778.5,62.4]},"tier2":{"a":[115.2,770.0,63.4],"h":[445.2,770.0,63.1]},"tier3":{"a":[111.2,758.5,59.6],"h":[448.0,760.5,60.0]},"tier4":{"a":[107.5,760.8,59.9],"h":[451.8,760.2,60.0]},"tier5":{"a":[110.5,751.0,65.2],"h":[448.0,750.2,65.1]},"tier6":{"a":[110.0,775.2,58.4],"h":[446.8,775.2,59.0]}};
const ARTCLIP=[[280.0,43.4],[537.1,183.7],[537.1,816.3],[280.0,956.6],[22.9,816.3],[22.9,183.7]];
const SPELLIN=[[280,76],[506,208],[506,792],[280,924],[54,792],[54,208]];
const SPELLOUT=[[280,14],[546,174],[546,826],[280,986],[14,826],[14,174]];
const pct=(x,y)=>`${(x/560*100).toFixed(3)}% ${(y/1000*100).toFixed(3)}%`;
const clip=pts=>`polygon(${pts.map(([x,y])=>pct(x,y)).join(",")})`;
const pts=p=>p.map(q=>q.join(",")).join(" ");
const root=document.getElementById("root");
const view=(new URLSearchParams(location.search).get("view"))||"mid";
function el(tag,cls,css,html){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e}
function put(parent,tag,cls,css,html){const e=el(tag,cls,css,html);parent.append(e);return e}

/* ---------- the screen's grid, fitted to the picture ---------- */
const CX=960;                 // every zone shares this centre line
const CL=336, CR=1584;        // the window and the light table share these edges
const LL=24, LW=284;          // left lane
const RL=1612, RW=284;        // right lane
const WIN={top:14,bottom:356};   // the shop window
const TAB={top:362,bottom:922};  // the light table (and, in the lanes, "you" and the players list)
const LOW={top:930,bottom:1072}; // the bench front: hand; menu and Turn at left; the one button at right

/* ---------- stats ---------- */
function statShape(kind){
  return kind==="a"
   ?`<svg class="shape" viewBox="0 0 100 100"><polygon points="27,4 73,4 98,50 73,96 27,96 2,50" fill="#dfe6ec" stroke="#15100b" stroke-width="9" stroke-linejoin="round"/><polygon points="31,14 69,14 86,44 14,44" fill="rgba(255,255,255,.55)"/></svg>`
   :`<svg class="shape" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45.5" fill="#f6e9d8" stroke="#15100b" stroke-width="9"/><ellipse cx="44" cy="30" rx="26" ry="13" fill="rgba(255,255,255,.6)"/></svg>`;
}
// a change carries a mark as well as a colour: a notch below for damage, a chevron above for a gain
function changeMark(chg,d){
  if(!chg) return "";
  const w=Math.round(d*.66),h=Math.round(d*.44);
  return chg==="hurt"
   ?`<svg class="crk" viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><path d="M58 8 L46 34 L60 52 L42 76 L50 94" fill="none" stroke="#15100b" stroke-width="7" stroke-linejoin="round" opacity=".55"/></svg><svg style="position:absolute;left:50%;top:78%;margin-left:${-w/2}px;overflow:visible" width="${w}" height="${h}" viewBox="0 0 20 13"><path d="M1.5 1.5 L10 11.5 L18.5 1.5 Z" fill="#d02a20" stroke="#15100b" stroke-width="2.4" stroke-linejoin="round"/></svg>`
   :`<svg style="position:absolute;left:50%;bottom:78%;margin-left:${-w/2}px;overflow:visible" width="${w}" height="${h}" viewBox="0 0 20 13"><path d="M1.5 11.5 L10 1.5 L18.5 11.5 Z" fill="#46a83c" stroke="#15100b" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
}
function statEl(kind,v,d,fs,chg,css=""){
  return el("span","stat "+kind+(chg?" "+chg:""),`width:${d}px;height:${d}px;${css}`,statShape(kind)+changeMark(chg,d)+`<b style="font-size:${fs}px">${v}</b>`);
}

/* ---------- a card ---------- */
function card({folder,id,tier,atk,hp,h,x,y,spell=false,art=null,golden=false,chg={},d=30,fs=18,stats=true}){
  const w=h*0.56;
  const c=el("div","card"+(golden?" golden":""),`left:${x-w/2}px;top:${y}px;width:${w}px;height:${h}px`);
  const a=el("div","art");a.style.backgroundImage=`url(${art||A+"units/"+folder+"/"+id+".jpg"})`;
  if(spell){
    // a spell's own leaded edge: lead, a band of sea-green glass, lead, jewels at the points; no stat wells
    c.insertAdjacentHTML("beforeend",`<svg class="spell-lead" viewBox="0 0 560 1000" preserveAspectRatio="none">
      <defs><linearGradient id="sb${y}${x|0}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb3a8"/><stop offset=".5" stop-color="#2d7c7a"/><stop offset="1" stop-color="#1d4e58"/></linearGradient></defs>
      <polygon points="${pts(SPELLOUT)}" fill="url(#sb${y}${x|0})"/></svg>`);
    a.style.clipPath=clip(SPELLIN);a.style.backgroundSize="cover";a.style.backgroundPosition="center 40%";c.append(a);
    const cuts=SPELLOUT.map((p,i)=>`M${p[0]} ${p[1]} L${SPELLIN[i][0]} ${SPELLIN[i][1]}`).join(" ")+" M280 14 L280 76 M14 500 L54 500 M546 500 L506 500";
    const jewel=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="25" fill="#e9f6f0" stroke="#15100b" stroke-width="10"/><circle cx="${cx-6}" cy="${cy-7}" r="8" fill="rgba(255,255,255,.9)"/>`;
    c.insertAdjacentHTML("beforeend",`<svg class="spell-lead" viewBox="0 0 560 1000" preserveAspectRatio="none">
      <path d="${cuts}" stroke="#15100b" stroke-width="12" fill="none"/>
      <polygon points="${pts(SPELLOUT)}" fill="none" stroke="#15100b" stroke-width="24" stroke-linejoin="round"/>
      <polygon points="${pts(SPELLIN)}" fill="none" stroke="#15100b" stroke-width="16" stroke-linejoin="round"/>
      <polygon points="${pts(SPELLOUT)}" fill="none" stroke="rgba(255,240,210,.35)" stroke-width="3" stroke-linejoin="round" transform="translate(0,4)"/>
      ${jewel(280,45)}${jewel(280,955)}${jewel(34,500)}${jewel(526,500)}</svg>`);
    return c;
  }
  a.style.clipPath=clip(ARTCLIP);c.append(a);
  const f=el("img","frame");f.src=A+"glass/frames/tier"+tier+".webp";c.append(f);
  if(!stats) return c;
  const R=ROUND["tier"+tier], P=PRINTED[id];
  if(P){const k=golden?2:1; chg={a:atk>P[0]*k?"up":null,h:hp>P[1]*k?"up":null,...Object.fromEntries(Object.entries(chg).filter(([,v])=>v))};}
  [["a",atk],["h",hp]].forEach(([key,v])=>{
    const [cx,cy]=R[key];
    c.append(statEl(key,v,d,String(v).length>1?fs:fs+1,chg[key],`left:${cx/5.6}%;top:${cy/10}%`));
  });
  return c;
}
function roundel(parent,kind,cx,cy,d,txt,fs,extra=""){
  return put(parent,"div","rd "+kind+(extra?" "+extra:""),`left:${cx-d/2}px;top:${cy-d/2}px;width:${d}px;height:${d}px;font-size:${fs}px`,`<span>${txt}</span>`)}
function pips(n,left){return `<span class="pips">${Array.from({length:n},(_,i)=>`<i class="${i<left?"on":""}"></i>`).join("")}</span>`}

// printed Attack and Health (src/content), for the changed-value mark
const PRINTED={"famine-caller":[6,4],"squadron-leader":[4,9],"bell-ringer":[3,5],"granary-glutton":[5,7],"wing-commander":[8,14],"blackberry-sprawl":[4,8],"hedge-lancer":[6,12],"greatsword-bearer":[4,12],"briar-king":[8,16],"holly-knight":[5,12],"the-eighth-plague":[4,12],"weasel":[8,12],"gorger":[5,7],"dame-bodkin":[6,9],"home-guard":[3,11],"hayloft-aunt":[2,9],"sweetbriar":[3,7],"shrew-cutpurse":[2,4],"bramble-runner":[4,5]};
const ICON={
  refresh:`<svg viewBox="0 0 40 40" width="40" height="40"><path d="M31 14 A12 12 0 1 0 32 24" fill="none" stroke="#f7eed6" stroke-width="4.5" stroke-linecap="round"/><path d="M33.5 5.5 L32.8 16 L23 13.6 Z" fill="#f7eed6"/></svg>`,
  freeze:`<svg viewBox="0 0 40 40" width="40" height="40"><g stroke="#f7eed6" stroke-linecap="round" fill="none"><path d="M20 4v32M6.1 12l27.8 16M6.1 28l27.8-16" stroke-width="3.6"/><path d="M15 6.5l5 4 5-4M15 33.5l5-4 5 4M5.3 17.3l6 2.7-1.3 6.4M34.7 22.7l-6-2.7 1.3-6.4M5.3 22.7l6-2.7-1.3-6.4M34.7 17.3l-6 2.7 1.3 6.4" stroke-width="2.6"/></g></svg>`,
  upgrade:`<svg viewBox="0 0 40 40" width="40" height="40"><polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="none" stroke="#f7eed6" stroke-width="3.2" stroke-linejoin="round"/><path d="M12.5 22 L20 14.5 L27.5 22" fill="none" stroke="#f7eed6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16 V29" stroke="#f7eed6" stroke-width="4" stroke-linecap="round"/></svg>`,
  gold:`<svg viewBox="0 0 40 40" width="40" height="40"><g stroke="#15100b" stroke-width="2.4"><ellipse cx="20" cy="30" rx="14" ry="5.5" fill="#c98a1c"/><ellipse cx="20" cy="23" rx="14" ry="5.5" fill="#e0a53a"/><ellipse cx="20" cy="16" rx="14" ry="5.5" fill="#f3c65a"/></g><ellipse cx="17" cy="15" rx="6" ry="1.8" fill="rgba(255,250,220,.8)"/></svg>`,
  menu:`<svg viewBox="0 0 40 40" width="34" height="34"><g stroke="#f7eed6" stroke-width="4" stroke-linecap="round"><path d="M9 12h22M9 20h22M9 28h22"/></g></svg>`,
  skip:`<svg viewBox="0 0 40 40" width="34" height="34"><path d="M6 9 L19 20 L6 31Z M20 9 L33 20 L20 31Z" fill="#f7eed6" stroke="#f7eed6" stroke-width="2" stroke-linejoin="round"/></svg>`,
  replay:`<svg viewBox="0 0 40 40" width="32" height="32"><path d="M9 14 A12 12 0 1 1 8 24" fill="none" stroke="#f7eed6" stroke-width="4.5" stroke-linecap="round"/><path d="M6.5 5.5 L7.2 16 L17 13.6 Z" fill="#f7eed6"/></svg>`,
  compost:`<svg viewBox="0 0 40 40" width="32" height="32"><path d="M4 33 Q20 6 36 33 Z" fill="#9a6a38" stroke="#15100b" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 24 q4 -7 8 0 M21 17 q3 -9 9 -6" fill="none" stroke="#8fd16f" stroke-width="3" stroke-linecap="round"/></svg>`,
  tide:`<svg viewBox="0 0 40 40" width="32" height="32"><path d="M3 22 q6 -8 12 0 t12 0 t12 0 M3 31 q6 -8 12 0 t12 0 t12 0" fill="none" stroke="#c9d77a" stroke-width="3.6" stroke-linecap="round"/><path d="M20 3 l5 11 h-10z" fill="#c9d77a"/></svg>`,
};

/* ---------- the turn-9 state (map/state.md) ---------- */
const SHOP9=[
 {folder:"thorn",id:"bramble-runner",name:"Bramble Runner",tribe:"Briar",tier:1,atk:4,hp:5,price:2,text:"<b>Seed.</b>"},
 {folder:"pigeon",id:"home-guard",name:"Home Guard",tribe:"Pigeon",tier:3,atk:3,hp:11,price:4,text:"<b>Guard.</b><br><b>Reserve.</b>"},
 {folder:"mouse",id:"hayloft-aunt",name:"Hayloft Aunt",tribe:"Mouse",tier:2,atk:2,hp:9,price:3,text:"<b>Hand-me-down.</b> Recruit: Add a Cousin to your hand."},

// the shop: each offer stands in its own light of the window, its label painted on the band below
function shopWindow(items){
  const UW=180,SW=137,BAR=10,MULL=24,SH=182,SY=24,LT=216;
  // warm frost over the picture's window, so the offers are brighter than the wood behind them
  put(root,"div","",`position:absolute;left:${CL}px;top:${WIN.top}px;width:${CR-CL}px;height:${WIN.bottom-WIN.top}px;background:linear-gradient(180deg,rgba(132,112,80,.66),rgba(106,88,62,.72))`);
  const widths=items.map(it=>it.spell?SW:UW);
  const total=widths.reduce((a,b)=>a+b,0)+BAR*(items.length-2)+MULL;
  let x=CL+(CR-CL-total)/2; const out=[];
  items.forEach((it,i)=>{
    const wd=widths[i];
    if(i>0){
      const gap=(it.spell&&!items[i-1].spell)?MULL:BAR;
      if(gap===MULL) put(root,"div","",`position:absolute;left:${x}px;top:${WIN.top}px;width:${MULL}px;height:${WIN.bottom-WIN.top}px;background:url(g/stone.jpg) center/200px auto,#6a5e50;box-shadow:inset 0 0 0 3px rgba(0,0,0,.45),0 0 6px rgba(0,0,0,.4)`);
      else put(root,"div","bar",`left:${x}px;top:${WIN.top}px;width:${BAR}px;height:${WIN.bottom-WIN.top}px`);
      x+=gap;
    }
    const cx=x+wd/2;
    root.append(it.spell?card({spell:true,art:it.art,h:SH,x:cx,y:SY}):card({...it,h:SH,x:cx,y:SY,d:29}));
    roundel(root,"amber",cx-SH*.28-2,SY+SH*.17-4,44,it.price,24);
    const lab=put(root,"div","label shoplabel",`left:${x+5}px;top:${LT}px;width:${wd-10}px;height:${WIN.bottom-4-LT}px`);
    lab.innerHTML=`<div class="nm">${it.name}</div><div class="tr">${it.tribe}</div><div class="tx">${it.text}</div>`;
    out.push({x,w:wd,cx}); x+=wd;
  });
  // a lead saddle bar across the window, above the labels; a stone sill below it
  put(root,"div","bar",`left:${CL}px;top:${LT-9}px;width:${CR-CL}px;height:6px;background:linear-gradient(180deg,#0d0906,#3b3127 45%,#0d0906)`);
  return out;
}

function slotOutline(x,y,h,{filled=false,renown=0}={}){
  const sw=h*.56,pad=6;
  const sl=put(root,"div","slot",`left:${x-sw/2-pad}px;top:${y-pad}px;width:${sw+2*pad}px;height:${h+2*pad}px`);
  sl.innerHTML=`<svg viewBox="0 0 560 1000" preserveAspectRatio="none"><polygon points="280,0 560,170 560,830 280,1000 0,830 0,170" fill="${filled?"rgba(40,30,20,.16)":"rgba(40,30,20,.12)"}" stroke="#2a2118" stroke-dasharray="${filled?"none":"9 7"}" vector-effect="non-scaling-stroke" style="stroke-width:3px" stroke-linejoin="round"/></svg>`;
  if(renown) put(root,"div","rtab",`left:${x-sw/2-46}px;top:${y+2}px`,`Renown ${renown}`);
}
function unitOnBoard(u,x,y,h,opts={}){
  slotOutline(x,y,h,{filled:true,renown:u.renown});

  lab.innerHTML=`<div class="nm">${u.name}</div><div class="kw">${u.kw||""}${u.charge?pips(...(opts.charge||u.charge)):""}</div>`;
  return {c,lab};
}

  const G=put(T,"div","",`position:absolute;inset:9px;border:3px solid #15100b;border-radius:4px;overflow:hidden;
    background:radial-gradient(ellipse 50% 62% at 50% 52%,#dcc79c 0%,#c4aa7e 38%,#93795a 72%,#5f4b32 100%);box-shadow:inset 0 0 90px rgba(25,16,8,.55)`);
  put(G,"div","",`position:absolute;inset:0;background:url(g/pane.jpg) center/320px auto;mix-blend-mode:soft-light;opacity:.55`);
  let q="";const H=TAB.bottom-TAB.top;

  G.insertAdjacentHTML("beforeend",`<svg style="position:absolute;left:0;top:0" width="${CR-CL}" height="${H}"><path d="${q}" stroke="rgba(55,42,28,.16)" stroke-width="1.5" fill="none"/></svg>`);

}

  put(root,"div","panel",`left:${CL}px;top:${OPP_PANEL.top}px;width:${CR-CL}px;height:${OPP_PANEL.bottom-OPP_PANEL.top}px`).append(el("div","q"));
  put(root,"div","panel",`left:${CL}px;top:${MY_PANEL.top}px;width:${CR-CL}px;height:${MY_PANEL.bottom-MY_PANEL.top}px`).append(el("div","q"));
  // the central lead strip, clear of the enemy front row's labels
  put(root,"div","transom",`left:${CL-12}px;top:${OPP_PANEL.bottom+6}px;width:${CR-CL+24}px;height:${MY_PANEL.top-OPP_PANEL.bottom-8}px`);
}
function fightUnit(u,x,y,opts={}){return unitOnBoard(u,x,y,FH,opts)}
function shards(x,y){
  const w0=FH*.56;
  root.insertAdjacentHTML("beforeend",`<svg style="position:absolute;left:${x-w0/2}px;top:${y}px;z-index:2" width="${w0}" height="${FH}" viewBox="0 0 560 1000">
   <g stroke="#1a130d" stroke-width="12" stroke-linejoin="round">
    <polygon points="20,830 140,690 230,880 280,990" fill="rgba(150,180,205,.75)"/>
    <polygon points="540,180 410,250 500,430 540,410" fill="rgba(215,170,80,.75)"/>
    <polygon points="372,860 470,750 540,830 470,905" fill="rgba(120,165,110,.75)"/>
    <polygon points="120,420 230,360 260,470 160,520" fill="rgba(160,90,140,.7)"/></g></svg>`);
}
// your reserves in hand, which can step into an emptied slot: real Attack and Health, names at 18 px
function reserves(top){
  const R=put(root,"div","ctl",`left:${LL}px;top:${top}px;width:${LW}px;height:${WIN.bottom-top}px`);
  put(R,"div","pane g-smoke",`inset:0`);
  put(R,"div","lab",`left:16px;top:10px;font-size:20px`,"Reserves in hand");
  [{folder:"pigeon",id:"home-guard",tier:3,atk:3,hp:11,name:"Home Guard"},{folder:"mouse",id:"hayloft-aunt",tier:2,atk:2,hp:9,name:"Hayloft Aunt"}].forEach((u,i)=>{
    const cx=74+i*136;
    R.append(card({...u,h:124,x:cx,y:42,d:30,fs:18}));
    put(R,"div","nm",`position:absolute;left:${cx-66}px;width:132px;text-align:center;top:172px`,u.name);
  });
}
// the stakes: kills so far against the 4 that make it a small loss, and what a loss costs now
function stakesPlaque(){
  const P=put(root,"div","label",`left:${LL}px;top:${WIN.top}px;width:${LW}px;height:136px;padding:12px 16px`);
  P.innerHTML=`
   <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="nm" style="font-size:22px;line-height:26px">If you lose</span><b style="font-family:Alegreya,serif;font-size:38px;line-height:40px;color:#ffd9cf">−13</b></div>
   <div style="height:2px;background:rgba(255,236,200,.25);margin:8px 0 9px"></div>
   <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="nm" style="font-size:20px">Kills 0 of 4</span><span class="tx">4 kills: −10</span></div>`;
}
function viewFight(){
  fightFrame();
  OPP.slice(4).forEach((u,i)=>fightUnit(u,BACK[i],FY.oppBack));
  [0,1,3].forEach(i=>fightUnit(OPP[i],FRONT[i],FY.oppFront));
  [1,2].forEach(i=>fightUnit(MINE[i],FRONT[i],FY.myFront));
  slotOutline(FRONT[3],FY.myFront,FH);
  MINE.slice(4).forEach((u,i)=>fightUnit(u,BACK[i],FY.myBack,i===1?{chg:{a:"up",h:"up"}}:{}));
  // the first blow: Holly Knight struck Famine-caller, which breaks out of its slot (Renown stays on the slot)
  slotOutline(FRONT[0],FY.myFront,FH,{renown:7});
  shards(FRONT[0],FY.myFront);
  const hk=fightUnit(OPP[2],FRONT[2],FY.oppFront,{hp:4,chg:{h:"hurt"}});
  hk.c.style.filter="drop-shadow(0 0 4px #fff7d0) drop-shadow(0 0 18px rgba(255,240,170,.95)) drop-shadow(0 12px 12px rgba(0,0,0,.5))";
  const x1=FRONT[2]-56,y1=FY.oppFront+FH*.72,x2=FRONT[0]+40,y2=FY.myFront+60;
  root.insertAdjacentHTML("beforeend",`<svg style="position:absolute;left:0;top:0;z-index:10;pointer-events:none" width="1920" height="1080">
    <path d="M${x1} ${y1} C ${x1-90} ${y1+150}, ${x2+170} ${y2-90}, ${x2+14} ${y2-8}" fill="none" stroke="#15100b" stroke-width="11" stroke-linecap="round"/>
    <path d="M${x1} ${y1} C ${x1-90} ${y1+150}, ${x2+170} ${y2-90}, ${x2+14} ${y2-8}" fill="none" stroke="#fff6d2" stroke-width="6" stroke-linecap="round"/>
    <path d="M${x2+6} ${y2-28} L${x2-6} ${y2+8} L${x2+32} ${y2+2} Z" fill="#fff6d2" stroke="#15100b" stroke-width="2.5" stroke-linejoin="round"/></svg>`);
  put(root,"div","splash",`left:${FRONT[0]}px;top:${FY.myFront+FH*.5}px`,"−12");
  put(root,"div","splash",`left:${FRONT[2]+2}px;top:${FY.oppFront+FH*.42}px`,"−15");
  stakesPlaque();
  reserves(WIN.top+144);
  youBlock({hp:11,counters:[{icon:"compost",name:"Compost",val:4},{icon:"tide",name:"Tide",val:4,chg:"2"}]});
  playersList(PLAYERS9.map(p=>p.tag?{...p,tag:"Fighting"}:p));
  menuAndTurn(9,"Fight");
  bigButton({lit:false,icon:"skip",word:"Skip",sub:null});
}

/* ---------- after the fight: what broke your panel, and why −13 ---------- */
// their board as the fight left it (baseline shot fight-mid-t9-result-defeat): Briar King broke, the rest stood
const OPP_END=[
 {...OPP[0],hp:10,chg:{h:"hurt"}},
 null,
 {...OPP[2],atk:24,hp:27,chg:{a:"up",h:"up"}},
 OPP[3],
 {...OPP[4],hp:2,chg:{h:"hurt"}},
 {...OPP[5],hp:57,chg:{h:"hurt"}},
 OPP[6],
];
function viewAfter(){
  fightFrame();
  OPP_END.slice(4).forEach((u,i)=>fightUnit(u,BACK[i],FY.oppBack,{chg:u.chg||{}}));
  OPP_END.slice(0,4).forEach((u,i)=>u?fightUnit(u,FRONT[i],FY.oppFront,{chg:u.chg||{}}):(slotOutline(FRONT[i],FY.oppFront,FH,{renown:4}),shards(FRONT[i],FY.oppFront)));
  // the three that did most are marked 1 to 3, matching the list
  [[BACK[1],FY.oppBack],[FRONT[2],FY.oppFront],[FRONT[1],FY.oppFront]].forEach(([x,y],i)=>{
    roundel(root,"cream",x+FH*.28+8,y+FH*.17-6,40,i+1,22).style.zIndex=4;
  });
  [[CL+70,FY.myFront+20],[CL+150,FY.myBack+30],[CR-150,FY.myFront+10],[CR-70,FY.myBack+20]].forEach(([x,y])=>shards(x,y));
  // the reckoning, set over your emptied panel
  const P=put(root,"div","label",`left:${CX-470}px;top:${MY_PANEL.top+46}px;width:940px;height:420px;z-index:8;padding:0;box-shadow:inset 0 1px 0 rgba(255,236,200,.3),0 0 0 5px #6a5e50,0 0 0 9px var(--lead),0 14px 30px rgba(0,0,0,.6)`);
  const beat=(n,html)=>`<div class="rd cream" style="position:relative;width:34px;height:34px;font-size:20px"><span>${n}</span></div><div>${html}</div>`;
  P.innerHTML=`
   <div style="position:absolute;left:34px;top:22px;font-family:Alegreya,serif;font-weight:900;font-size:40px;line-height:44px">Out in 7th</div>
   <div class="tx" style="position:absolute;left:36px;top:74px;font-size:19px">March Hare broke all of your units. You broke one: Briar King.</div>
   <div style="position:absolute;left:34px;top:116px;width:872px">
     <div class="tr" style="font-size:15px">What beat you</div>
     <div class="tx" style="display:grid;grid-template-columns:38px 1fr;gap:10px 12px;margin-top:10px;align-items:center">
       ${beat(1,"<b>Gorger</b>, golden, 38/68 at the start. Its Health was more than your whole board's Attack.")}
       ${beat(2,"<b>Holly Knight</b>, on a slot with 7 Renown. It grew from 12/19 to 24/27 during the fight.")}
       ${beat(3,"<b>Briar King</b>, 12/20 at the start. It gave their Briars Grow 2 before you broke it.")}
     </div>
   </div>
   <div style="position:absolute;left:34px;right:34px;top:282px;height:2px;background:rgba(255,236,200,.25)"></div>
   <div class="tr" style="position:absolute;left:34px;top:296px;font-size:15px">At the start of the fight</div>
   <div class="tx" style="position:absolute;left:34px;top:318px;display:flex;gap:40px">
     <span><b style="font-family:Alegreya,serif;font-size:20px">Their board</b>&nbsp; 90 Attack · 158 Health</span>
     <span><b style="font-family:Alegreya,serif;font-size:20px">Your board</b>&nbsp; 49 Attack · 68 Health</span>
   </div>`;
  const b1=put(P,"div","pane g-smoke",`right:34px;top:340px;width:236px;height:56px`);
  put(b1,"div","icon",`left:16px;top:8px`,ICON.replay);
  put(b1,"div","btnlab lt",`left:60px;top:11px;font-size:23px`,"Watch again");
  // left lane top: why −13
  const W=put(root,"div","label",`left:${LL}px;top:${WIN.top}px;width:${LW}px;height:${WIN.bottom-WIN.top}px;padding:16px 18px`);
  const row=(a,b,last)=>`<div class="tx" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0 9px;${last?"":"border-bottom:2px solid rgba(255,236,200,.22)"}"><span>${a}</span><b style="font-family:Alegreya,serif;font-size:24px">${b}</b></div>`;
  W.innerHTML=`<div class="nm" style="font-size:26px;line-height:30px;margin-bottom:6px">Why −13</div>
    ${row("Lost on turn 9","10")}
    ${row("Big loss: 1 kill of 4","+3")}
    <div class="tx" style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-weight:700;color:#fff8e6"><span>Health 11 → 0</span><b style="font-family:Alegreya,serif;font-size:32px;color:#ffd9cf">−13</b></div>
    <div class="tx" style="margin-top:22px;padding-top:14px;border-top:2px solid rgba(255,236,200,.22);font-size:16px;line-height:19px;color:var(--text-lt3)">A loss costs the turn number + 1. Fewer than 4 kills adds 3.</div>`;
  youBlock({hp:0,counters:[{icon:"compost",name:"Compost",val:4},{icon:"tide",name:"Tide",val:4}]});
  menuAndTurn(9,"Fight over");
  // the standings as the turn-9 fights left them
  playersList([
   {p:1,n:"Dame Hoolet",f:"dame_hoolet",hp:23},
   {p:2,n:"Pipkin",f:"pipkin",hp:21},
   {p:3,n:"Little King Wren",f:"little_king_wren",hp:18},
   {p:4,n:"Old Mother Mousewife",f:"old_mother_mousewife",hp:18},
   {p:5,n:"March Hare",f:"march_hare",hp:16,tag:"Beat you"},
   {p:6,n:"Hob Mumblecrust",f:"hob_mumblecrust",hp:16},
   {p:7,n:"Dame Farthing",f:"dame_farthing",hp:0,you:true,out:true},
   {p:8,n:"Brother Bracken",f:"brother_bracken",hp:0,out:true},
  ]);
  bigButton({word:"See results"});
}

/* ---------- extra1: reading a card. Click any card; its full reading docks inside the light table, clear of every slot ---------- */
function viewRead(){
  viewMid();
  const x=BACK[0], y=ROW.back, sw=BH*.56, P2=12;
  root.insertAdjacentHTML("beforeend",`<svg style="position:absolute;left:${x-sw/2-P2}px;top:${y-P2}px;z-index:1;pointer-events:none" width="${sw+2*P2}" height="${BH+2*P2}"><polygon points="${sw/2+P2},3 ${sw+2*P2-3},${BH*.17+P2} ${sw+2*P2-3},${BH*.83+P2} ${sw/2+P2},${BH+2*P2-3} 3,${BH*.83+P2} 3,${BH*.17+P2}" fill="none" stroke="#15100b" stroke-width="8" stroke-linejoin="round"/><polygon points="${sw/2+P2},3 ${sw+2*P2-3},${BH*.17+P2} ${sw+2*P2-3},${BH*.83+P2} ${sw/2+P2},${BH+2*P2-3} 3,${BH*.83+P2} 3,${BH*.17+P2}" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linejoin="round"/></svg>`);
  const L=1340, R=CR-14;
  const P=put(root,"div","label",`left:${L}px;top:${TAB.top+14}px;width:${R-L}px;height:${TAB.bottom-TAB.top-28}px;padding:14px 16px;z-index:12`);
  const kw=(n,t)=>`<div style="margin-top:10px"><div class="tx"><b>${n}</b></div><div class="tx" style="font-size:16px;line-height:19px">${t}</div></div>`;
  P.innerHTML=`
   <div class="nm" style="font-size:24px;line-height:27px">Wing Commander</div>
   <div class="tr" style="margin-top:3px">Pigeon · Tier 5</div>
   <div style="display:flex;gap:12px;align-items:center;margin-top:12px">
     <span id="sa" style="position:relative;width:40px;height:40px"></span><span id="sh" style="position:relative;width:40px;height:40px"></span>
     <div class="tx" style="font-size:16px;line-height:19px">Printed 8/14<br>Renown +3/+3</div>
   </div>
   <div style="height:2px;background:rgba(255,236,200,.25);margin:14px 0 10px"></div>
   <div class="tx"><b>Sortie.</b></div>
   <div class="tx" style="margin-top:6px"><b>Charge 4:</b> After one of your Pigeons with Sortie kills, give its slot 3 Renown.</div>
   <div class="tx" style="margin-top:8px;display:flex;gap:8px;align-items:center">4 of 4 left ${pips(4,4)}</div>
   <div style="height:2px;background:rgba(255,236,200,.25);margin:14px 0 0"></div>
   ${kw("Sortie","Attacks the enemy back row while it has units.")}
   ${kw("Charge 4","Works 4 times, then stops. Refills each fight.")}
   ${kw("Renown","The slot's bonus: +1/+1 for each.")}`;
  P.querySelector("#sa").append(statEl("a",11,40,22,"up","left:50%;top:50%"));
  P.querySelector("#sh").append(statEl("h",17,40,22,"up","left:50%;top:50%"));
}
const V={mid:()=>viewMid(),first:viewFirst,fight:viewFight,after:viewAfter,extra1:viewRead,extra2:viewFullHand};
(V[view]||V.mid)();
document.body.dataset.view=view;
</script>
