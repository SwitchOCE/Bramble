<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glazier's Bench</title>
<meta name="viewport" content="width=1920">
<style>
@font-face{font-family:Alegreya;src:url(../../../../../assets/glass/fonts/Alegreya[wght].ttf);font-weight:400 900}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Regular.ttf);font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Bold.ttf);font-weight:700}
:root{
  --lead:#15100b;
  --ink:#22170c; --ink-2:#47331f; --ink-3:#5a412a;
  --text-lt:#f7eed6; --text-lt2:#eadfc4;
  --stone:#5b5146;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#1c140e}
body{position:relative;font-family:"Alegreya Sans",sans-serif;color:var(--ink)}

/* ---------- the scene: the commissioned picture (background.jpg) ---------- */
#bg{position:absolute;inset:0;overflow:hidden;background:url(background.jpg) 0 0/1920px 1080px no-repeat}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 75% at 50% 45%,rgba(0,0,0,0) 62%,rgba(0,0,0,.38) 100%)}
/* fight: the camera lifts to the window; the wood's light fills the frame, the wall is stone */
body.raised #bg{background:url(background.jpg) -1658px -30px/5236px 2945px no-repeat;filter:saturate(1.05) brightness(1.02)}
.jamb{position:absolute;top:0;bottom:0;width:330px;background:url(g/stone.jpg) center/280px auto,var(--stone);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.45),inset 0 0 40px rgba(0,0,0,.55)}
.jamb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 3px,transparent 3px 96px)}

/* ---------- glass panes in lead ---------- */
.pane{position:absolute;border:4px solid var(--lead);border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(255,240,210,.16),inset 0 12px 18px rgba(255,255,255,.07),0 3px 8px rgba(0,0,0,.55)}
.pane::after{content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;
  background:url(g/pane.jpg) center/300px auto;mix-blend-mode:soft-light;opacity:.5}
.g-cream{background:linear-gradient(170deg,#f8f0d8,#ecdfbb 65%,#e2d2a7)}
.g-blue{background:linear-gradient(160deg,#2f5f8b,#173550)}
.g-green{background:linear-gradient(160deg,#355f30,#1c381a)}
.g-frost{background:linear-gradient(160deg,#d7e9f1,#9cc0d2 70%,#86adc2)}
.g-dark{background:linear-gradient(160deg,#352d25,#1c1712)}
.g-lit{background:radial-gradient(ellipse 90% 120% at 40% 30%,#fffae6,#f8e3a0 45%,#e8bb5c 100%)}
.accent{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 0 0 2px rgba(255,238,176,.6),0 0 30px 8px rgba(255,216,120,.6),0 4px 10px rgba(0,0,0,.6)}

/* roundel: a round of glass in a lead ring */
.rd{position:absolute;border-radius:50%;display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;color:#1a0f05;line-height:1;
  background-size:118% auto;background-position:center;
  box-shadow:0 0 0 3px var(--lead),0 3px 6px rgba(0,0,0,.6);text-shadow:0 0 5px rgba(255,242,205,.95),0 0 2px rgba(255,242,205,.95)}
.rd span{padding-top:.07em}
.rd.amber{background-image:url(g/rd-amber.png)}
.rd.ruby{background-image:url(g/rd-ruby.png);color:#fff6e8;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.9)}
.rd.clear{background-image:url(g/rd-clear.png)}
.rd.cream{background-image:url(g/rd-cream.png)}
.rd.short{background-image:url(g/rd-clear.png);filter:brightness(.8)}

/* ---------- cards (art, real tier frame, numbers on the frame's discs) ---------- */
.card{position:absolute;filter:drop-shadow(0 5px 7px rgba(0,0,0,.55))}
.card .art{position:absolute;inset:0;background-size:100% 100%}
.card .frame{position:absolute;inset:0;width:100%;height:100%}
.card .num{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;line-height:1;color:#150e08;letter-spacing:-.02em;
  font-variant-numeric:lining-nums;padding-top:.04em;text-shadow:0 0 .12em rgba(255,240,200,.75)}
.card .num.hurt{color:#a10f0a}
.card .num.stat{border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffffff,#f1ede2 50%,#c9c1b0);
  box-shadow:0 0 0 2.5px #15100b,0 2px 3px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.55);text-shadow:none;padding-top:.06em}
.card .spell-lead{position:absolute;inset:0;width:100%;height:100%}
.card.golden{filter:drop-shadow(0 0 3px #ffe27a) drop-shadow(0 0 12px rgba(255,214,90,.9)) drop-shadow(0 5px 7px rgba(0,0,0,.5))}

/* ---------- painted labels: lettering in grisaille on pale glass ---------- */
.label{position:absolute;border:3px solid var(--lead);border-radius:4px;
  background:linear-gradient(175deg,#faf3de,#efe3c3 70%,#e6d8b0);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 2px 5px rgba(0,0,0,.4)}
.nm{font-family:Alegreya,serif;font-weight:800;font-size:19px;line-height:22px;color:var(--ink);white-space:nowrap}
.tr{font-size:14px;line-height:16px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.tx{font-size:16px;line-height:19px;color:var(--ink)}
.tx b{font-weight:700}
.shoplabel{padding:7px 9px}
.shoplabel .tr{margin:3px 0 4px}
.boardlabel{text-align:center;padding:2px 6px 3px;transform:translateX(-50%)}
.boardlabel .nm{font-size:18px;line-height:21px}
.boardlabel .kw{font-size:15px;line-height:17px;color:var(--ink-2);font-weight:700;white-space:nowrap}

/* ---------- the shop window: lead bars across the picture's window ---------- */
.bar{position:absolute;background:linear-gradient(90deg,#0d0906,#3b3127 45%,#0d0906);box-shadow:0 0 4px rgba(0,0,0,.5)}
.light.frost{background:linear-gradient(180deg,rgba(225,240,250,.78),rgba(205,228,242,.65))}
.slot{position:absolute}
.slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.renown{position:absolute;width:38px;height:38px;transform:rotate(45deg);border:3px solid var(--lead);
  background:linear-gradient(135deg,#fff3b6,#f2c542 45%,#c98d14);box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.5);z-index:2}
.renown span{position:absolute;inset:0;transform:rotate(-45deg);display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;font-size:21px;color:#1b1004;padding-top:2px}

/* ---------- side lanes ---------- */
.ctl{position:absolute}
.ctl .lab{position:absolute;font-family:Alegreya,serif;font-weight:800;font-size:22px;line-height:24px;color:var(--text-lt);text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap}
.ctl .sub{position:absolute;font-size:16px;line-height:18px;color:var(--text-lt2);text-shadow:0 1px 2px rgba(0,0,0,.9);white-space:nowrap}
.icon{position:absolute}
.ctl.dim .pane{filter:saturate(.35) brightness(.8)}
.plate{position:absolute;height:50px;display:flex;align-items:center;gap:10px;padding:0 14px 0 10px}
.plate .lab{position:static;font-family:Alegreya,serif;font-weight:800;font-size:20px;color:var(--ink)}
.plate .val{margin-left:auto;font-family:Alegreya,serif;font-weight:900;font-size:26px;color:var(--ink)}
.plate svg{display:block}
.portrait{position:absolute;border-radius:50%;background-size:cover;background-position:center;
  box-shadow:0 0 0 5px var(--lead),0 0 0 8px #74624a,0 0 0 11px var(--lead),0 6px 14px rgba(0,0,0,.7)}
.portrait.sm{box-shadow:0 0 0 3px var(--lead),0 0 0 5px #74624a,0 0 0 7px var(--lead),0 3px 6px rgba(0,0,0,.6)}
.prow .place{position:absolute;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-lt2);text-shadow:0 1px 2px #000}
.prow .pn{position:absolute;font-family:Alegreya,serif;font-weight:800;font-size:19px;line-height:21px;color:var(--text-lt);text-shadow:0 1px 2px #000}
.prow.you .pn,.prow.you .place,.prow.next .pn,.prow.next .place{color:var(--ink);text-shadow:none}
.prow.out:not(.you){filter:saturate(.2) brightness(.75)}
.prow .outw{position:absolute;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-lt2)}
.btnlab{position:absolute;font-family:Alegreya,serif;font-weight:900;color:var(--ink);white-space:nowrap}
.btnlab.lt{color:var(--text-lt);font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.8)}

/* ---------- fight ---------- */
.panel{position:absolute;border:6px solid var(--lead);border-radius:4px;
  box-shadow:0 0 0 5px #6a5e50,0 0 0 9px var(--lead),0 12px 26px rgba(0,0,0,.55)}
.panel .q{position:absolute;inset:0;
  background:
   repeating-linear-gradient(60deg,rgba(28,22,16,.5) 0 2px,transparent 2px 52px),
   repeating-linear-gradient(-60deg,rgba(28,22,16,.5) 0 2px,transparent 2px 52px),
   linear-gradient(180deg,rgba(252,250,236,.55),rgba(236,244,220,.45))}
.transom{position:absolute;background:url(g/stone.jpg) center/280px auto,var(--stone);box-shadow:inset 0 0 0 3px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.5)}
.splash{position:absolute;font-family:Alegreya,serif;font-weight:900;font-size:46px;color:#fff3e0;
  text-shadow:0 0 3px #6e0000,0 0 9px #6e0000,0 2px 0 #3a0000;transform:translate(-50%,-50%);z-index:7}
</style>
</head>
<body>
<div id="bg"></div>
<div id="root"></div>

<script>
const A = "../../../../../assets/";
const ROUND={"tier1":{"a":[110.8,778.5,62.4],"h":[448.8,778.5,62.4]},"tier2":{"a":[115.2,770.0,63.4],"h":[445.2,770.0,63.1]},"tier3":{"a":[111.2,758.5,59.6],"h":[448.0,760.5,60.0]},"tier4":{"a":[107.5,760.8,59.9],"h":[451.8,760.2,60.0]},"tier5":{"a":[110.5,751.0,65.2],"h":[448.0,750.2,65.1]},"tier6":{"a":[110.0,775.2,58.4],"h":[446.8,775.2,59.0]}};
const ARTCLIP=[[280.0,43.4],[537.1,183.7],[537.1,816.3],[280.0,956.6],[22.9,816.3],[22.9,183.7]];
const OUTLINE=[[280,0],[560,170],[560,830],[280,1000],[0,830],[0,170]];
const pct=(x,y)=>`${(x/560*100).toFixed(3)}% ${(y/1000*100).toFixed(3)}%`;
const clip=pts=>`polygon(${pts.map(([x,y])=>pct(x,y)).join(",")})`;
const root=document.getElementById("root");
const view=(new URLSearchParams(location.search).get("view"))||"mid";
function el(tag,cls,css,html){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e}
function put(parent,tag,cls,css,html){const e=el(tag,cls,css,html);parent.append(e);return e}

/* ---------- the screen's grid, fitted to the picture ---------- */
const CX=960;                 // every zone shares this centre line
const CL=336, CR=1584;        // the window and the light table share these edges
const LL=24, LW=284;          // left lane
const RL=1612, RW=284;        // right lane
const WIN={top:14,bottom:410};
const TAB={top:438,bottom:900};
const BENCH={top:922,bottom:1064};

/* ---------- a card ---------- */
function card({folder,id,tier,atk,hp,h,x,y,spell=false,art=null,golden=false,hurt=false,minD=36,stats=true}){
  const w=h*0.56;
  const c=el("div","card"+(golden?" golden":""),`left:${x-w/2}px;top:${y}px;width:${w}px;height:${h}px`);
  const a=el("div","art");a.style.backgroundImage=`url(${art||A+"units/"+folder+"/"+id+".jpg"})`;
  if(spell){
    a.style.clipPath=clip(OUTLINE);a.style.backgroundSize="cover";a.style.backgroundPosition="center 40%";c.append(a);
    c.insertAdjacentHTML("beforeend",`<svg class="spell-lead" viewBox="0 0 560 1000" preserveAspectRatio="none"><polygon points="280,12 549,176 549,824 280,988 11,824 11,176" fill="none" stroke="#15100b" stroke-width="24" stroke-linejoin="round"/><polygon points="280,12 549,176 549,824 280,988 11,824 11,176" fill="none" stroke="rgba(255,240,210,.4)" stroke-width="4" stroke-linejoin="round"/></svg>`);
    return c;
  }
  a.style.clipPath=clip(ARTCLIP);c.append(a);
  const f=el("img","frame");f.src=A+"glass/frames/tier"+tier+".webp";c.append(f);
  if(!stats) return c;
  const R=ROUND["tier"+tier],k=h/1000;
  [["a",atk,""],["h",hp,hurt?" hurt":""]].forEach(([key,v,extra])=>{
    const [cx,cy,r]=R[key],s=String(v),d=Math.max(2*r*k,minD),fs=d*(s.length>1?.56:.66);
    put(c,"span","num stat"+extra,`left:${cx/5.6}%;top:${cy/10}%;font-size:${fs.toFixed(1)}px;width:${d}px;height:${d}px`,s)});
  return c;
}
function roundel(parent,kind,cx,cy,d,txt,fs,extra=""){
  return put(parent,"div","rd "+kind+(extra?" "+extra:""),`left:${cx-d/2}px;top:${cy-d/2}px;width:${d}px;height:${d}px;font-size:${fs}px`,`<span>${txt}</span>`)}

const ICON={
  refresh:`<svg viewBox="0 0 40 40" width="40" height="40"><path d="M31 14 A12 12 0 1 0 32 24" fill="none" stroke="#f7eed6" stroke-width="4.5" stroke-linecap="round"/><path d="M33.5 5.5 L32.8 16 L23 13.6 Z" fill="#f7eed6"/></svg>`,
  freeze:`<svg viewBox="0 0 40 40" width="40" height="40"><g stroke="#123047" stroke-linecap="round" fill="none"><path d="M20 4v32M6.1 12l27.8 16M6.1 28l27.8-16" stroke-width="3.6"/><path d="M15 6.5l5 4 5-4M15 33.5l5-4 5 4M5.3 17.3l6 2.7-1.3 6.4M34.7 22.7l-6-2.7 1.3-6.4M5.3 22.7l6-2.7-1.3-6.4M34.7 17.3l-6 2.7 1.3 6.4" stroke-width="2.6"/></g></svg>`,
  upgrade:`<svg viewBox="0 0 40 40" width="40" height="40"><polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="none" stroke="#f7eed6" stroke-width="3.2" stroke-linejoin="round"/><path d="M12.5 22 L20 14.5 L27.5 22" fill="none" stroke="#f7eed6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16 V29" stroke="#f7eed6" stroke-width="4" stroke-linecap="round"/></svg>`,
  gold:`<svg viewBox="0 0 40 40" width="40" height="40"><g stroke="#15100b" stroke-width="2.4"><ellipse cx="20" cy="30" rx="14" ry="5.5" fill="#c98a1c"/><ellipse cx="20" cy="23" rx="14" ry="5.5" fill="#e0a53a"/><ellipse cx="20" cy="16" rx="14" ry="5.5" fill="#f3c65a"/></g><ellipse cx="17" cy="15" rx="6" ry="1.8" fill="rgba(255,250,220,.8)"/></svg>`,
  menu:`<svg viewBox="0 0 40 40" width="34" height="34"><g stroke="#f7eed6" stroke-width="4" stroke-linecap="round"><path d="M9 12h22M9 20h22M9 28h22"/></g></svg>`,
  skip:`<svg viewBox="0 0 40 40" width="34" height="34"><path d="M6 9 L19 20 L6 31Z M20 9 L33 20 L20 31Z" fill="#f7eed6" stroke="#f7eed6" stroke-width="2" stroke-linejoin="round"/></svg>`,
  replay:`<svg viewBox="0 0 40 40" width="32" height="32"><path d="M9 14 A12 12 0 1 1 8 24" fill="none" stroke="#f7eed6" stroke-width="4.5" stroke-linecap="round"/><path d="M6.5 5.5 L7.2 16 L17 13.6 Z" fill="#f7eed6"/></svg>`,
  compost:`<svg viewBox="0 0 40 40" width="32" height="32"><path d="M4 33 Q20 6 36 33 Z" fill="#7a5229" stroke="#15100b" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 24 q4 -7 8 0 M21 17 q3 -9 9 -6" fill="none" stroke="#2c5a20" stroke-width="3" stroke-linecap="round"/></svg>`,
  tide:`<svg viewBox="0 0 40 40" width="32" height="32"><path d="M3 22 q6 -8 12 0 t12 0 t12 0 M3 31 q6 -8 12 0 t12 0 t12 0" fill="none" stroke="#4f5f10" stroke-width="3.6" stroke-linecap="round"/><path d="M20 3 l5 11 h-10z" fill="#4f5f10"/></svg>`,
};

/* ---------- the turn-9 state (map/state.md) ---------- */
const SHOP9=[
 {folder:"thorn",id:"bramble-runner",name:"Bramble Runner",tribe:"Briar",tier:1,atk:4,hp:5,price:2,text:"<b>Seed.</b>"},
 {folder:"pigeon",id:"home-guard",name:"Home Guard",tribe:"Pigeon",tier:3,atk:3,hp:11,price:4,text:"<b>Guard.</b><br><b>Reserve.</b>"},
 {folder:"mouse",id:"hayloft-aunt",name:"Hayloft Aunt",tribe:"Mouse",tier:2,atk:2,hp:9,price:3,text:"<b>Hand-me-down.</b><br>Recruit: Add a Cousin to your hand."},
 {folder:"thorn",id:"sweetbriar",name:"Sweetbriar",tribe:"Briar",tier:2,atk:3,hp:7,price:3,text:"Whenever a unit goes into your Compost, gain +1/+1 permanently."},
 {folder:"mouse",id:"shrew-cutpurse",name:"Shrew Cutpurse",tribe:"Mouse",tier:2,atk:2,hp:4,price:3,text:"<b>Pile on 1.</b><br>After this piles on, gain 2 gold."},
];
const SHARPEN={spell:true,art:A+"glass/art/spell-sharpen.jpg",name:"Sharpen",tribe:"Spell",price:1,text:"Give a friendly unit +2/+2."};
const BOARD9=[
 {folder:"locust",id:"famine-caller",name:"Famine-caller",tier:3,atk:15,hp:11,renown:7,kw:""},
 {folder:"pigeon",id:"squadron-leader",name:"Squadron Leader",tier:3,atk:4,hp:9,kw:""},
 {folder:"mouse",id:"bell-ringer",name:"Bell-ringer",tier:3,atk:5,hp:7,renown:2,kw:"Hand-me-down"},
 {folder:"locust",id:"granary-glutton",name:"Granary Glutton",tier:4,atk:7,hp:7,kw:""},
 {folder:"pigeon",id:"wing-commander",name:"Wing Commander",tier:5,atk:11,hp:17,renown:3,kw:"Sortie · Charge 4"},
 {folder:"thorn",id:"blackberry-sprawl",name:"Blackberry Sprawl",tier:3,atk:4,hp:8,kw:"Grow 2"},
 {folder:"badger",id:"hedge-lancer",name:"Hedge Lancer",tier:3,atk:6,hp:12,kw:"Fury 1"},
];
const PLAYERS9=[
 {p:1,n:"Pipkin",f:"pipkin",hp:31},
 {p:2,n:"Old Mother Mousewife",f:"old_mother_mousewife",hp:28},
 {p:3,n:"Dame Hoolet",f:"dame_hoolet",hp:23},
 {p:4,n:"Little King Wren",f:"little_king_wren",hp:18,note:"Beat you on turn 8"},
 {p:5,n:"March Hare",f:"march_hare",hp:16,next:true},
 {p:6,n:"Hob Mumblecrust",f:"hob_mumblecrust",hp:16},
 {p:7,n:"Dame Farthing",f:"dame_farthing",hp:11,you:true},
 {p:8,n:"Brother Bracken",f:"brother_bracken",hp:0,out:true},
];
const ORD=["","1st","2nd","3rd","4th","5th","6th","7th","8th"];

/* ---------- recruit pieces ---------- */
// the shop: each offer stands in its own light of the window, its label painted on the band below
function shopWindow(items,{frozen=false}={}){
  const UW=180,SW=137,BAR=10,MULL=24;
  const widths=items.map(it=>it.spell?SW:UW);
  const total=widths.reduce((a,b)=>a+b,0)+BAR*(items.length-2)+MULL;
  let x=CL+(CR-CL-total)/2; const out=[];
  items.forEach((it,i)=>{
    const wd=widths[i];
    if(i>0){
      const gap=(it.spell&&!items[i-1].spell)?MULL:BAR;
      if(gap===MULL) put(root,"div","",`position:absolute;left:${x}px;top:${WIN.top}px;width:${MULL}px;height:${WIN.bottom-WIN.top}px;background:url(g/stone.jpg) center/200px auto,#6a5e50;box-shadow:inset 0 0 0 3px rgba(0,0,0,.45),0 0 6px rgba(0,0,0,.4)`);
      else put(root,"div","bar",`left:${x}px;top:${WIN.top}px;width:${BAR}px;height:${WIN.bottom-WIN.top}px`);
      x+=gap;
    }
    const cx=x+wd/2;
    if(frozen) put(root,"div","light frost",`position:absolute;left:${x}px;top:${WIN.top}px;width:${wd}px;height:${WIN.bottom-WIN.top}px`);
    const h=it.spell?184:212, y=it.spell?44:30;
    root.append(it.spell?card({spell:true,art:it.art,h,x:cx,y}):card({...it,h,x:cx,y}));
    roundel(root,"amber",cx-h*.28-4,y+h*.17-6,46,it.price,25);
    const lab=put(root,"div","label shoplabel",`left:${x+6}px;top:254px;width:${wd-12}px;height:148px`);
    lab.innerHTML=`<div class="nm">${it.name}</div><div class="tr">${it.tribe}</div><div class="tx">${it.text}</div>`;
    out.push({x,w:wd,cx}); x+=wd;
  });
  // a lead saddle bar across the window, above the labels
  put(root,"div","bar",`left:${CL}px;top:246px;width:${CR-CL}px;height:6px;background:linear-gradient(180deg,#0d0906,#3b3127 45%,#0d0906)`);
  return out;
}

const BH=172, PITCH=184;
const FRONT=[CX-1.5*PITCH,CX-.5*PITCH,CX+.5*PITCH,CX+1.5*PITCH];
const BACK=[CX-PITCH,CX,CX+PITCH];
function slotOutline(x,y,h,filled){
  const sw=h*.56,pad=7;
  const sl=put(root,"div","slot",`left:${x-sw/2-pad}px;top:${y-pad}px;width:${sw+2*pad}px;height:${h+2*pad}px`);

function crack(x,y,h){
  const w0=h*.56;
  root.insertAdjacentHTML("beforeend",`<svg style="position:absolute;left:${x-w0/2}px;top:${y}px;z-index:3;pointer-events:none" width="${w0}" height="${h}" viewBox="0 0 560 1000">
   <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M300 300 L230 400 L262 500 L170 590 L200 700 M262 500 L380 580 L360 680 M230 400 L110 360 M300 300 L420 280 L470 200" stroke="#120c08" stroke-width="18"/>
   <path d="M300 300 L230 400 L262 500 L170 590 L200 700 M262 500 L380 580 L360 680 M230 400 L110 360 M300 300 L420 280 L470 200" stroke="rgba(255,250,235,.95)" stroke-width="5"/></g></svg>`);
}
function shards(x,y){
  const w0=FH*.56;
  root.insertAdjacentHTML("beforeend",`<svg style="position:absolute;left:${x-w0/2}px;top:${y}px" width="${w0}" height="${FH}" viewBox="0 0 560 1000">
   <g stroke="#1a130d" stroke-width="12" stroke-linejoin="round">
    <polygon points="0,830 120,700 210,880 280,1000" fill="rgba(150,180,205,.55)"/>
    <polygon points="560,170 430,250 520,430 560,410" fill="rgba(215,170,80,.55)"/>
    <polygon points="372,860 470,750 560,830 470,905" fill="rgba(120,165,110,.55)"/></g></svg>`);
}

/* ---------- after the fight: what broke your panel, and why −13 ---------- */
function viewAfter(){
  fightFrame();
  OPP.slice(4).forEach((u,i)=>unitOnBoard(u,BACK[i],FY.oppBack,FH));
  OPP.slice(0,4).forEach((u,i)=>unitOnBoard(u,FRONT[i],FY.oppFront,FH));
  // the three that did most are marked 1 to 3, matching the list
  [[BACK[1],FY.oppBack],[FRONT[1],FY.oppFront],[FRONT[2],FY.oppFront]].forEach(([x,y],i)=>{
    roundel(root,"cream",x+FH*.28+6,y+FH*.17-8,40,i+1,22).style.zIndex=4;
  });
  [[CL+60,FY.myFront+10],[CL+150,FY.myBack+40],[CR-150,FY.myFront+20],[CR-62,FY.myBack+30]].forEach(([x,y])=>shards(x,y));
  // the reckoning, set over your empty panel
  const P=put(root,"div","pane g-cream",`left:${CX-480}px;top:${MY_PANEL.top+38}px;width:960px;height:428px;z-index:8;box-shadow:0 0 0 5px #6a5e50,0 0 0 9px var(--lead),0 14px 30px rgba(0,0,0,.6)`);
  const row=(a,b,big)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:${big?21:19}px;line-height:24px;${big?"font-weight:700;margin-top:10px":"padding:9px 0 7px;border-bottom:2px solid rgba(21,16,11,.3)"}"><span>${a}</span><b style="font-family:Alegreya,serif;font-size:${big?28:23}px;${big?"color:#7a0d10":""}">${b}</b></div>`;
  P.innerHTML=`
   <div style="position:absolute;left:32px;top:22px;font-family:Alegreya,serif;font-weight:900;font-size:40px;line-height:44px">Out in 7th</div>
   <div style="position:absolute;left:34px;top:72px;font-size:19px;color:var(--ink-2)">March Hare broke all of your units and lost none.</div>
   <div style="position:absolute;left:32px;top:118px;width:396px">
     <div class="tr" style="font-size:15px">Why −13</div>
     ${row("Lost on turn 9","10")}
     ${row("Big loss: 0 kills of the 4 needed","+3")}
     ${row("Health 11 → 0","−13",true)}
   </div>
   <div style="position:absolute;left:478px;top:118px;width:450px">
     <div class="tr" style="font-size:15px">What beat you</div>
     <div style="display:grid;grid-template-columns:36px 1fr;gap:10px 10px;margin-top:10px;font-size:18px;line-height:21px;align-items:start">
       <div class="rd cream" style="position:relative;width:32px;height:32px;font-size:19px"><span>1</span></div><div><b>Gorger</b>, golden, 38/68. Its Health is more than your whole board's Attack.</div>
       <div class="rd cream" style="position:relative;width:32px;height:32px;font-size:19px"><span>2</span></div><div><b>Briar King</b>, 12/20. Gives their front-row Briars Grow 2.</div>
       <div class="rd cream" style="position:relative;width:32px;height:32px;font-size:19px"><span>3</span></div><div><b>Holly Knight</b>, 12/19, on a slot with 7 Renown.</div>
     </div>
   </div>
   <div style="position:absolute;left:32px;right:32px;top:296px;height:2px;background:rgba(21,16,11,.3)"></div>
   <div style="position:absolute;left:32px;top:310px;display:flex;gap:40px;font-size:19px">
     <span><b style="font-family:Alegreya,serif;font-size:21px">Their board</b>&nbsp; 90 Attack · 158 Health</span>
     <span><b style="font-family:Alegreya,serif;font-size:21px">Your board</b>&nbsp; 49 Attack · 68 Health</span>
   </div>`;
  const b1=put(P,"div","pane g-dark",`left:32px;top:350px;width:250px;height:58px`);
  put(b1,"div","icon",`left:16px;top:9px`,ICON.replay);
  put(b1,"div","btnlab lt",`left:62px;top:12px;font-size:23px`,"Watch again");
  const b2=put(P,"div","pane g-lit accent",`right:32px;top:350px;width:260px;height:58px`);
  put(b2,"div","btnlab",`left:0;right:0;text-align:center;top:12px;font-size:25px`,"See results");
  stakes(`<span class="nm" style="font-size:23px">Defeat</span><span style="width:3px;height:30px;background:var(--lead)"></span><span class="nm">Kills 0 of 4</span>`,420);
  sideFighter({name:"Dame Farthing",face:"dame_farthing",hp:0,top:MY_PANEL.top,counters:[{icon:"compost",name:"Compost",val:4},{icon:"tide",name:"Tide",val:2}]},LL);
  sideFighter({name:"March Hare",face:"march_hare",hp:16,top:OPP_PANEL.top},RL);
  menuAndTurn(9,{top:OPP_PANEL.top,word:"Fight over"});
  // the standings as this fight leaves them
  playersList(PLAYERS9.map(p=>p.you?{...p,hp:0,out:true,you:true}:{...p,next:false}),{top:300,bottom:MY_PANEL.bottom});
}

/* ---------- extra1: reading a card. Click any card; its full reading docks at the right end of the light table ---------- */
function viewRead(){
  viewMid();
  // the chosen piece: Wing Commander (back row, left)
  const x=BACK[0], y=TAB.top+12+BH+52, sw=BH*.56;
  root.insertAdjacentHTML("beforeend",`<svg style="position:absolute;left:${x-sw/2-12}px;top:${y-12}px;z-index:1;pointer-events:none" width="${sw+24}" height="${BH+24}" viewBox="0 0 ${sw+24} ${BH+24}"><polygon points="${(sw+24)/2},3 ${sw+21},${BH*.17+12} ${sw+21},${BH*.83+12} ${(sw+24)/2},${BH+21} 3,${BH*.83+12} 3,${BH*.17+12}" fill="none" stroke="#15100b" stroke-width="7" stroke-linejoin="round"/><polygon points="${(sw+24)/2},3 ${sw+21},${BH*.17+12} ${sw+21},${BH*.83+12} ${(sw+24)/2},${BH+21} 3,${BH*.83+12} 3,${BH*.17+12}" fill="none" stroke="#fffaf0" stroke-width="3.5" stroke-linejoin="round"/></svg>`);
  const P=put(root,"div","label",`left:${CR-262}px;top:${TAB.top+8}px;width:254px;height:${TAB.bottom-TAB.top-16}px;padding:12px 14px;z-index:12;box-shadow:0 0 0 1px rgba(255,255,255,.5),0 8px 18px rgba(0,0,0,.45)`);
  const kw=(n,t)=>`<div style="margin-top:9px"><div class="tx"><b>${n}</b></div><div class="tx" style="font-size:15px;line-height:18px;color:var(--ink-2)">${t}</div></div>`;
  P.innerHTML=`
   <div class="nm" style="font-size:23px;line-height:26px">Wing Commander</div>
   <div class="tr" style="margin-top:3px">Pigeon · Tier 5</div>
   <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
     <div class="rd" style="position:relative;width:40px;height:40px;font-size:22px;background:radial-gradient(circle at 40% 30%,#ffffff,#f1ede2 50%,#c9c1b0)"><span>11</span></div>
     <div class="rd" style="position:relative;width:40px;height:40px;font-size:22px;background:radial-gradient(circle at 40% 30%,#ffffff,#f1ede2 50%,#c9c1b0)"><span>17</span></div>
     <div class="tx" style="font-size:15px;line-height:18px">Printed 8/14<br>Renown +3/+3</div>
   </div>
   <div style="height:2px;background:rgba(21,16,11,.3);margin:12px 0 8px"></div>
   <div class="tx"><b>Sortie.</b></div>
   <div class="tx" style="margin-top:4px"><b>Charge 4:</b> After one of your Pigeons with Sortie kills, give its slot 3 Renown.</div>
   <div style="height:2px;background:rgba(21,16,11,.3);margin:12px 0 0"></div>
   ${kw("Sortie","Attacks the enemy back row while it has units.")}
   ${kw("Charge 4","Works 4 times, then stops. Refills each fight.")}
   ${kw("Renown","The slot's bonus: +1/+1 for each.")}`;
}
const V={mid:viewMid,first:viewFirst,fight:viewFight,after:viewAfter,extra1:viewRead};
(V[view]||viewMid)();
document.body.dataset.view=view;
</script>
