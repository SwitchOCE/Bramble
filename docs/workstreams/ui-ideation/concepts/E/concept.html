<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass in the Forest</title>
<style>
@font-face{font-family:Alegreya;src:url(../../../../../assets/glass/fonts/Alegreya[wght].ttf);font-weight:400 900}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Regular.ttf);font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Bold.ttf);font-weight:700}
:root{
  --lead:#0c0a08; --cream:#f6ead0; --cream-dim:#d9ccb0; --ink:#1a1008;
  --amber:#f0b54a; --amber-hi:#ffd98a; --ruby:#8e1620; --ruby-hi:#c23440;
  --plate:rgba(20,15,11,.88);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d1418}
body{font-family:"Alegreya Sans",sans-serif;color:var(--cream)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#stage>canvas,#stage>img.bg,#stage>svg{position:absolute;left:0;top:0;width:1920px;height:1080px}
#scene{pointer-events:none}
.lay{position:absolute;left:0;top:0;width:1920px;height:1080px}

/* ---------- cards (e- prefix keeps names apart from anything else) ---------- */
.e-card{position:absolute}
.e-card .e-art{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.e-card .e-frame{position:absolute;inset:0;width:100%;height:100%}
.e-card .e-num{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;line-height:1;color:#150e08;letter-spacing:-.04em;
  font-variant-numeric:lining-nums;padding-top:.05em;text-shadow:0 0 .14em rgba(255,240,200,.8)}
.e-card .e-num.e-hurt{color:#a0100a;text-shadow:0 0 .14em rgba(255,240,200,.95)}
.e-card .e-spell-lead{position:absolute;inset:0;background:#16120e}
.e-card .e-cost{position:absolute;left:-6%;top:6%;width:36%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;color:var(--ink);
  background:radial-gradient(circle at 38% 34%,#ffe7a0,#e7b347 55%,#b9821f);border:3px solid var(--lead);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.e-card .e-pips{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.e-card .e-pips i{display:block;width:11px;height:11px;border-radius:50%;background:#fffbe8;border:2px solid var(--lead);box-shadow:0 0 6px #fff6c8}
.e-card.e-golden::before{content:"";position:absolute;inset:-7px;clip-path:polygon(50% 0%,100% 17%,100% 83%,50% 100%,0% 83%,0% 17%);
  background:linear-gradient(160deg,#fff1a8,#d39b22 40%,#ffe58a 60%,#a8700f);z-index:-1}
.e-marks{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;gap:3px;align-items:center;z-index:3}
.e-mark{position:relative;display:grid;place-items:center;border-radius:50%;border:2px solid var(--lead);box-shadow:0 1px 3px rgba(0,0,0,.7)}
.e-mark svg{width:66%;height:66%;fill:none;stroke:#fffaf0;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.e-mark b{position:absolute;right:-6px;bottom:-6px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:#14100c;border:1.5px solid #d8c9a6;
  font:700 14px/14px "Alegreya Sans",sans-serif;color:var(--cream);text-align:center}
.e-tribe{border-radius:3px 3px 50% 50%/3px 3px 60% 60%}
.e-tribe svg{fill:#fffaf0;stroke:none}
.e-renown{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;padding:1px 9px 1px 5px;height:26px;border-radius:13px;
  background:linear-gradient(#f2cd6a,#c8922b);border:2px solid var(--lead);font:900 19px/1 Alegreya,serif;color:var(--ink);box-shadow:0 0 10px rgba(255,210,120,.45);z-index:7}
.e-renown svg{width:16px;height:16px;fill:#5a3a08;stroke:none}

/* ---------- glass objects in the scene ---------- */
.e-plate{position:absolute;background:url(../../../../../assets/glass/ui/pane.jpg) center/260px,linear-gradient(170deg,#3a2c1f,#1b140e 70%);background-blend-mode:multiply;
  border:3px solid var(--lead);border-radius:7px;box-shadow:0 0 0 1.5px #9a7d4e,inset 0 0 0 1.5px rgba(255,228,170,.18),inset 0 -10px 18px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.65);
  color:var(--cream);font:700 18px/1 "Alegreya Sans",sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.e-coin{display:inline-grid;place-items:center;border-radius:50%;font-family:Alegreya,serif;font-weight:900;color:var(--ink);
  background:radial-gradient(circle at 38% 34%,#ffe7a0,#e7b347 55%,#b9821f);border:2px solid var(--lead);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.e-coin.e-short{background:radial-gradient(circle at 38% 34%,#d9ccb6,#a3978a 60%,#7c7166);color:#2a2119}
.e-gem{position:absolute;display:grid;place-items:center;font:900 22px/1 Alegreya,serif;color:#fff4dc;
  background:radial-gradient(circle at 40% 35%,var(--ruby-hi),var(--ruby) 70%);border:2.5px solid var(--lead);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.e-gem-wrap{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}
.e-round{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--lead);box-shadow:0 0 0 2px #6b5638,0 4px 10px rgba(0,0,0,.7);overflow:hidden;background:#222}
.e-round img{width:100%;height:100%;object-fit:cover;display:block}
.e-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:700 18px/1 "Alegreya Sans",sans-serif;color:var(--cream);
  padding:5px 10px;border-radius:6px;background:var(--plate);border:1.5px solid #5d4a33}
.e-place{position:absolute;transform:translate(-50%,-50%);font:900 17px/1 Alegreya,serif;color:var(--cream-dim);text-shadow:0 1px 2px #000,0 0 6px #000}
.e-sys{position:absolute;top:22px;height:44px;padding:0 14px;font-size:18px}
.e-sys svg{width:22px;height:22px;fill:none;stroke:var(--cream);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.e-accent{box-shadow:0 0 0 3px #ffd77a,0 0 28px 8px rgba(255,196,90,.75),0 4px 10px rgba(0,0,0,.7)!important}
.e-splash{position:absolute;transform:translate(-50%,-50%);font:900 40px/1 Alegreya,serif;color:#fff3dc;padding:8px 12px 4px;
  background:radial-gradient(circle,#c2202c 0,#8e1620 70%);border:3px solid var(--lead);
  clip-path:polygon(50% 0,63% 22%,90% 10%,80% 38%,100% 50%,80% 62%,90% 90%,63% 78%,50% 100%,37% 78%,10% 90%,20% 62%,0 50%,20% 38%,10% 10%,37% 22%);
  width:110px;height:96px;display:grid;place-items:center;z-index:6}
.e-tally{position:absolute;display:flex;align-items:center;gap:5px;transform:translate(-50%,-50%)}
.e-tally i{display:block;width:16px;height:22px;background:#e8dcc0;border:2px solid var(--lead);clip-path:polygon(50% 0,100% 20%,100% 80%,50% 100%,0 80%,0 20%)}
.e-tally i.e-gone{background:#3a3430}
.e-tally .e-bar{width:3px;height:30px;background:#ffd77a;border-radius:2px;margin:0 3px;box-shadow:0 0 6px #ffd77a}

.e-dim{filter:brightness(.42) saturate(.6)}
.e-btn{position:absolute;transform:translate(-50%,-50%);font:700 22px/1 "Alegreya Sans",sans-serif;color:var(--cream);padding:14px 24px;border-radius:8px;
  background:url(../../../../../assets/glass/ui/pane.jpg) center/260px,linear-gradient(170deg,#3e3022,#1d1510 70%);background-blend-mode:multiply;
  border:3px solid var(--lead);box-shadow:0 0 0 1.5px #9a7d4e,inset 0 0 0 1.5px rgba(255,228,170,.18),0 4px 10px rgba(0,0,0,.7);white-space:nowrap}
.e-btn.e-go{color:var(--ink);background:url(../../../../../assets/glass/ui/pane.jpg) center/260px,radial-gradient(ellipse at 50% 30%,#fff0b8,#f2bd52 60%,#c98a22);
  box-shadow:0 0 0 1.5px #ffe3a0,0 0 26px 6px rgba(255,196,90,.55),0 4px 10px rgba(0,0,0,.7)}
.e-cue{position:absolute;z-index:20}
/* ---------- round 1: name plates, price tags, leaded spells, lights, plaques ---------- */
.e-mark b{right:-10px;bottom:-9px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;font:700 16px/18px "Alegreya Sans",sans-serif;border:2px solid #e3d5b2}
.e-mark.e-has-n{margin-right:9px}
.e-renown{padding:1px 5px 1px 3px;gap:1px;height:24px;font-size:17px}
.e-renown svg{width:13px;height:13px}
.e-np{position:absolute;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:nowrap;overflow:hidden;
  background:url(../../../../../assets/glass/ui/pane.jpg) center/220px,linear-gradient(175deg,#3a2c1f,#17110c 75%);background-blend-mode:multiply;
  border:3px solid var(--lead);border-radius:4px;box-shadow:0 0 0 1.5px #8d7247,inset 0 0 0 1px rgba(255,228,170,.16),0 3px 8px rgba(0,0,0,.65);z-index:2}
.e-np b{font:900 18px/1 Alegreya,serif;color:var(--cream)}
.e-np span{font:700 18px/1 "Alegreya Sans",sans-serif;color:var(--cream-dim)}
.e-np.e-np-dim{background:linear-gradient(175deg,#1d1610,#0c0907 75%);box-shadow:0 0 0 1.5px #4a3b27,0 3px 8px rgba(0,0,0,.65)}
.e-tag{position:absolute;width:36px;height:42px;background:var(--lead);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));z-index:3}
.e-tag-in{position:absolute;inset:3px 3px 4px;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);display:grid;justify-items:center;padding-top:5px;
  background:url(../../../../../assets/glass/ui/pane.jpg) center/120px,linear-gradient(170deg,#ffe39a,#e3a93c 60%,#b17a1c);background-blend-mode:multiply;
  font:900 21px/1 Alegreya,serif;color:var(--ink)}
.e-tag-short .e-tag-in{background:linear-gradient(170deg,#d9ccb6,#a3978a 60%,#7c7166);color:#2a2119}
.e-tag-cream .e-tag-in{background:url(../../../../../assets/glass/ui/pane.jpg) center/120px,linear-gradient(170deg,#fff6de,#e8d8b2 60%,#c4b088);background-blend-mode:multiply}
.e-card .e-spell-came{position:absolute;inset:3.4% 6%;background:linear-gradient(160deg,#d8b46a,#9a7334 50%,#c9a258)}
.e-card .e-spell-art{inset:6.6% 11.5%;background-size:cover;background-position:center}
.e-light{justify-content:flex-start;padding:0 32px 0 10px;gap:8px;border-radius:18px}
.e-light.e-light-dim{background:linear-gradient(170deg,#211910,#0d0a07 70%);box-shadow:0 0 0 1.5px #4a3b27,0 4px 10px rgba(0,0,0,.65)}
.e-light-next{box-shadow:0 0 0 2px #ffd77a,inset 0 0 0 1.5px rgba(255,228,170,.18),0 4px 10px rgba(0,0,0,.65)}
.e-light-you{box-shadow:0 0 0 2px #e9e2d0,inset 0 0 0 1.5px rgba(255,228,170,.18),0 4px 10px rgba(0,0,0,.65)}
.e-rank{flex:none;width:18px;text-align:center;font:900 19px/1 Alegreya,serif;color:var(--amber-hi)}
.e-pname{flex:1;text-align:left;font:700 18px/1 "Alegreya Sans",sans-serif;color:var(--cream);white-space:nowrap}
.e-hp{flex:none;display:grid;place-items:center;width:30px;height:28px;font:900 18px/1 Alegreya,serif;color:#fff4dc;padding-top:2px;
  background:radial-gradient(circle at 40% 35%,var(--ruby-hi),var(--ruby) 70%);clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%)}
.e-out{flex:none;font:700 16px/1 "Alegreya Sans",sans-serif;color:var(--cream-dim)}
.e-counter{justify-content:flex-start;padding:0 12px;gap:8px}
.e-counter svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--cream);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.e-counter span{flex:1;text-align:left;font:700 18px/1 "Alegreya Sans",sans-serif}
.e-counter b{font:900 22px/1 Alegreya,serif}
.e-ico{flex:none;width:22px;height:22px;fill:none;stroke:var(--cream);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.e-name{font:900 18px/1 Alegreya,serif;border:2.5px solid var(--lead);box-shadow:0 0 0 1.5px #8d7247;z-index:2;
  background:url(../../../../../assets/glass/ui/pane.jpg) center/200px,linear-gradient(175deg,#3a2c1f,#17110c 75%);background-blend-mode:multiply}
.e-tally-label{position:absolute;transform:translateX(-50%);white-space:nowrap;font:700 18px/1 "Alegreya Sans",sans-serif;color:var(--cream);
  padding:4px 8px;border-radius:5px;background:var(--plate);border:1.5px solid #5d4a33}
.e-bead{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;padding-top:2px;
  font:900 20px/1 Alegreya,serif;color:var(--ink);background:radial-gradient(circle at 38% 34%,#fff0b8,#f0b54a 60%,#b9821f);border:3px solid var(--lead);
  box-shadow:0 0 10px rgba(255,210,120,.8);z-index:4}
.e-bead.e-bead-s{position:static;transform:none;flex:none;width:28px;height:28px;font-size:18px}
.e-fallen{position:absolute;transform:translate(-50%,-50%);font:700 18px/1 "Alegreya Sans",sans-serif;color:var(--cream-dim);padding:5px 10px;
  background:rgba(14,11,8,.92);border:2px solid var(--lead);box-shadow:0 0 0 1px #5d4a33;border-radius:4px;z-index:3}
.e-leaded{position:absolute;padding:24px 26px;color:var(--cream);
  background:url(../../../../../assets/glass/ui/pane.jpg) center/300px,linear-gradient(170deg,#3e2f21,#17110c 70%);background-blend-mode:multiply;
  border:12px solid;border-image:repeating-linear-gradient(90deg,#c99a45 0 30px,#0c0a08 30px 34px,#8a5f22 34px 62px,#0c0a08 62px 66px,#b5823a 66px 96px,#0c0a08 96px 100px) 12;
  box-shadow:0 0 0 3px var(--lead),inset 0 0 0 3px var(--lead),inset 0 0 0 5px rgba(255,228,170,.14),0 10px 30px rgba(0,0,0,.75)}
.e-sum{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:2px 6px 0;border-radius:5px;background:#5c121a;border:2px solid var(--lead);box-shadow:0 0 0 1px #a0603a;font:900 20px/1 Alegreya,serif;color:#fff4dc}
.e-why{display:flex;align-items:center;gap:10px;margin-top:12px}
.e-why b{display:block;font:900 20px/1.1 Alegreya,serif}
.e-why .e-bead-s{display:grid;font:900 18px/1 Alegreya,serif;color:var(--ink)}
.e-why span:not(.e-bead){display:block;font:400 17px/1.25 "Alegreya Sans",sans-serif;color:var(--cream-dim)}
.e-btn.e-go{font-size:24px;padding:16px 28px}
/* ---------- pass 2: calm frame, states, tooltip, keyword panel ---------- */
.e-card .e-art{background-size:cover;background-position:center 30%;transition:filter .15s}
.e-card .e-fr{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.e-card{filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.e-lit .e-art{filter:none}
.e-rest .e-art{filter:saturate(.68) brightness(.7)}
.e-quiet .e-art{filter:saturate(.5) brightness(.5)}
.e-hover .e-art{filter:brightness(1.05)}
.e-card.e-hover{filter:drop-shadow(0 0 3px #fff1c4) drop-shadow(0 0 14px rgba(255,226,160,.7)) drop-shadow(0 10px 12px rgba(0,0,0,.7));transform:translateY(-6px)}
.e-st{position:absolute;display:grid;place-items:center;border-radius:50%;border:3px solid var(--lead);font-family:Alegreya,serif;font-weight:900;line-height:1;padding-top:.06em;
  color:#fbf1da;box-shadow:0 0 0 1.5px rgba(255,236,200,.35),0 2px 4px rgba(0,0,0,.7);letter-spacing:-.03em}
.e-st-a{background:radial-gradient(circle at 38% 32%,#8a6424,#4a3210 70%)}
.e-st-h{background:radial-gradient(circle at 38% 32%,#86242c,#46101a 70%)}
.e-st.e-hurt{color:#ffb3a6;box-shadow:0 0 0 2px #e0505c,0 2px 4px rgba(0,0,0,.7)}
.e-st.e-buff{color:#b9f0a8}
.e-mks{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;gap:3px;z-index:2}
.e-mk{display:grid;place-items:center;border-radius:50%;background:#17120d;border:2px solid var(--lead)}
.e-mk svg{width:62%;height:62%;fill:none;stroke:#efe3c6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.e-spell{position:absolute;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.e-spell .e-art{position:absolute;inset:0}
.e-spell .e-fr{position:absolute;inset:0;width:100%;height:100%}
.e-spell.e-hover{filter:drop-shadow(0 0 3px #fff1c4) drop-shadow(0 0 14px rgba(255,226,160,.7));transform:translateY(-6px)}
.e-tip{position:absolute;z-index:30;padding:18px 20px 20px;color:var(--cream);
  background:url(../../../../../assets/glass/ui/pane.jpg) center/300px,linear-gradient(170deg,#3a2c1f,#15100b 70%);background-blend-mode:multiply;
  border:3px solid var(--lead);border-radius:6px;box-shadow:0 0 0 2px #b08a4a,inset 0 0 0 1.5px rgba(255,228,170,.16),0 12px 28px rgba(0,0,0,.75)}
.e-tip-n{font:900 28px/1 Alegreya,serif}
.e-tip-t{margin-top:6px;font:700 18px/1 "Alegreya Sans";color:var(--cream-dim)}
.e-tip-x{margin-top:12px;padding-top:12px;border-top:2px solid #5d4a33;font:400 21px/1.35 "Alegreya Sans"}
.e-tip-x b{color:var(--amber-hi)}
.e-tip-a{position:absolute;width:20px;height:20px;background:#2c2117;border-left:3px solid var(--lead);border-bottom:3px solid var(--lead);box-shadow:-2px 2px 0 0 #b08a4a}
.e-tip-r .e-tip-a{left:-13px;transform:rotate(45deg)}
.e-tip-l .e-tip-a{right:-13px;transform:rotate(225deg)}
.e-kw{position:absolute;z-index:20;padding:14px 16px;display:flex;flex-direction:column;gap:12px;
  background:rgba(14,11,8,.86);border:2px solid #4a3b27;border-left:4px solid #8a6a3a;border-radius:4px}
.e-kw-i b{display:block;font:900 19px/1 Alegreya,serif;color:var(--amber-hi)}
.e-kw-i span{display:block;margin-top:4px;font:400 18px/1.3 "Alegreya Sans";color:var(--cream-dim)}
.e-cap{position:absolute;transform:translateX(-50%);font:700 18px/1 "Alegreya Sans";color:var(--cream-dim);white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <svg id="scene" viewBox="0 0 1920 1080"></svg>
  <div id="ui" class="lay"></div>
</div>
<script>
// ======================================================================
// Data
// ======================================================================
const A = "../../../../../assets/";
const RD = {"tier1":{"a":[110.8,778.5,62.4],"h":[448.8,778.5,62.4]},"tier2":{"a":[115.2,770.0,63.4],"h":[445.2,770.0,63.1]},"tier3":{"a":[111.2,758.5,59.6],"h":[448.0,760.5,60.0]},"tier4":{"a":[107.5,760.8,59.9],"h":[451.8,760.2,60.0]},"tier5":{"a":[110.5,751.0,65.2],"h":[448.0,750.2,65.1]},"tier6":{"a":[110.0,775.2,58.4],"h":[446.8,775.2,59.0]}};
const ARTCLIP = "polygon(" + [[280,43.4],[537.1,183.7],[537.1,816.3],[280,956.6],[22.9,816.3],[22.9,183.7]].map(([x,y])=>`${x/5.6}% ${y/10}%`).join(",") + ")";
const HEX = "polygon(50% 0%,100% 17%,100% 83%,50% 100%,0% 83%,0% 17%)";

const TRIBE = {
  badger:{c:"#b8653a", g:'<path d="M3.5 8.5 12 3l8.5 5.5-2.2 9L12 21.5l-6.3-4z"/><path d="M10.6 4.5h2.8v15h-2.8z" fill="#2a1a10"/><circle cx="7.6" cy="10.5" r="1.4" fill="#2a1a10"/><circle cx="16.4" cy="10.5" r="1.4" fill="#2a1a10"/>'},

  for (let i=0;i<n;i++){ const cx = 50 - tot/2 + bw/2 + i*(bw+gap);

function hex2rgb(h){ h=h.replace("#",""); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function mix(a,b,t){ return a.map((v,i)=>v+(b[i]-v)*t); }
function rgb(c,j=0){ return `rgb(${c.map(v=>Math.max(0,Math.min(255,Math.round(v*(1+j))))).join(",")})`; }

function mosaic(ctx, R, x0,y0,x1,y1, step, colourAt, lw=2.4){
  const nx = Math.ceil((x1-x0)/step)+1, ny = Math.ceil((y1-y0)/step)+1, P=[];
  for (let j=0;j<=ny;j++){ P[j]=[]; for(let i=0;i<=nx;i++){
    const edge = (i===0||j===0||i===nx||j===ny);
    P[j][i]=[x0+i*step+(edge?0:(R()-.5)*step*.62), y0+j*step+(edge?0:(R()-.5)*step*.62)]; } }
  ctx.lineJoin="round"; ctx.strokeStyle="#0b0907"; ctx.lineWidth=lw;
  for (let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const a=P[j][i],b=P[j][i+1],c=P[j+1][i+1],d=P[j+1][i];
    const polys = R()<.45 ? (R()<.5?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]]) : [[a,b,c,d]];
    for (const p of polys){
      const cx=p.reduce((s,q)=>s+q[0],0)/p.length, cy=p.reduce((s,q)=>s+q[1],0)/p.length;
      ctx.beginPath(); p.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
      ctx.fillStyle = rgb(colourAt(cx,cy), (R()-.5)*.16); ctx.fill(); ctx.stroke();
    }
  }
}
function shape(ctx, pts){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); }
function leaf(ctx, x,y,len,ang,col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(len*.5,-len*.32,len,0); ctx.quadraticCurveTo(len*.5,len*.32,0,0); ctx.closePath();
  ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=2.6; ctx.strokeStyle="#0b0907"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(len*.08,0); ctx.lineTo(len*.86,0); ctx.lineWidth=1.6; ctx.stroke();
  ctx.restore();
}

function drawForest(ctx){
  const R = rng(9);
  const NAVY=hex2rgb("#121d36"), TEAL=hex2rgb("#1b3940"), SHAFT=hex2rgb("#6e7a5a"), MOSS=hex2rgb("#243f27"), MOSS2=hex2rgb("#2f4c2a"), POOL=hex2rgb("#4b5a33");
  const groundY = x => 470 + 18*Math.sin(x/260) ;
  const shafts = [[880,-40,640,1000,70],[1180,-40,1000,1000,46],[700,-40,420,900,40]];
  function airAt(x,y){
    let c = mix(NAVY, TEAL, Math.min(1, Math.max(0,y/480)));
    // far trunks
    for (const [tx,w] of [[470,54],[760,38],[1240,44],[1470,60],[1060,26]]){
      if (Math.abs(x-tx-(y*.03)) < w/2 && y<560) c = mix(c, hex2rgb("#141a1f"), .75);
    }
    if (y > groundY(x)) {
      const d = Math.hypot((x-960)/560,(y-790)/250);
      c = mix(MOSS, MOSS2, (Math.sin(x/90)+1)/2*.6);
      if (d<1) c = mix(c, POOL, (1-d)*.75);
      // path out of the clearing, bottom right
      const px = 1500 + (1080-y)*0.55;
      if (x > px && x < px+260-(1080-y)*.15 && y>760) c = mix(hex2rgb("#4a3a28"), hex2rgb("#a07a3c"), Math.max(0,(1080-y)/320)*.85);
    }
    for (const [x0,y0,x1,y1,w] of shafts){
      const t=((x-x0)*(x1-x0)+(y-y0)*(y1-y0))/((x1-x0)**2+(y1-y0)**2);
      const px=x0+t*(x1-x0), py=y0+t*(y1-y0), dist=Math.hypot(x-px,y-py);
      if (dist<w && t>0 && t<1) c = mix(c, SHAFT, (1-dist/w)*.42*(1-t*.6));
    }
    return c;
  }
  mosaic(ctx, R, 0,0,1920,1080, 66, airAt, 2.2);

  // ---- left oak: trunk, bark panes, roots
  const oak = [[0,0],[236,0],[214,170],[200,420],[214,640],[248,800],[330,930],[455,1035],[520,1080],[0,1080]];
  ctx.save(); shape(ctx, oak); ctx.clip();
  const BARK=["#3a2c24","#4a372b","#2f241e","#57412f","#40302a"].map(hex2rgb);

  ctx.strokeStyle="#0b0907"; ctx.lineWidth=4;
  for (const sx of [34,82,128,170]){ ctx.beginPath(); for(let y=0;y<=1080;y+=20){ const x=sx+10*Math.sin(y/55+sx)+ (y>760? (y-760)*sx/600:0); y?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); }
  ctx.restore();

  ctx.beginPath(); ctx.moveTo(180,900); ctx.quadraticCurveTo(330,960,520,1080); ctx.lineTo(0,1080); ctx.lineTo(0,1010); ctx.closePath();
  ctx.fillStyle="#2f5a2c"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#0b0907"; ctx.stroke(); ctx.restore();

  // ---- right tree line: slim trunks with night gaps

    ctx.restore(); shape(ctx,pts); ctx.lineWidth=4; ctx.strokeStyle="#0b0907"; ctx.stroke();

  // ---- canopy: leaves along the top

  for (let i=0;i<150;i++){

    leaf(ctx, x, y, 46+R()*44, R()*Math.PI*2, GREENS[Math.floor(R()*GREENS.length)]);
  }
  // ---- bramble and fern along the bottom edge (kept away from the cards)
  for (let i=0;i<26;i++){ const x=170+R()*420, y=1062+R()*30; leaf(ctx,x,y,30+R()*30,-Math.PI/2+(R()-.5)*2.2, GREENS[Math.floor(R()*4)]); }
  for (let i=0;i<18;i++){ const x=1240+R()*300, y=1060+R()*30; leaf(ctx,x,y,30+R()*28,-Math.PI/2+(R()-.5)*2.2, GREENS[Math.floor(R()*4)]); }
  // a few blackberries
  for (const [x,y] of [[198,1050],[560,1062],[1300,1058],[1515,1050]]){
    ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fillStyle="#3a1638"; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#0b0907"; ctx.stroke(); }
}

// the bough the shop hangs from, and the log the hand rests on: scene objects
const boughY = x => 62 + 10*Math.sin((x-200)/1450*Math.PI) + 3*Math.sin(x/210);
let PANE=null;
// a glass pane: flat colour, the mottle of real glass (pane.jpg, contrast raised), a soft light from above
function glassPane(ctx, colour){
  ctx.fillStyle=colour; ctx.fill();
  if (PANE){ ctx.save(); ctx.globalCompositeOperation="overlay"; ctx.globalAlpha=.8; ctx.fillStyle=PANE; ctx.fill(); ctx.restore(); }
}
function glassLeaf(ctx, x,y,len,ang,col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(len*.3,-len*.42,len*.75,-len*.3,len,0); ctx.bezierCurveTo(len*.75,len*.3,len*.3,len*.42,0,0); ctx.closePath();
  glassPane(ctx, col);
  ctx.lineWidth=4; ctx.strokeStyle="#100d0a"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(len*.1,0); ctx.quadraticCurveTo(len*.5,-len*.04,len*.9,0); ctx.lineWidth=2.4; ctx.stroke();
  ctx.restore();
}
function drawBough(ctx){
  const R=rng(11);
  const x0=226, x1=1660, th = x => 38 - (x-x0)/(x1-x0)*18 + 4*Math.sin(x/97) + 2*Math.sin(x/41);
  const T = x=>[x, boughY(x)-th(x)/2], B = x=>[x, boughY(x)+th(x)/2], M = x=>[x, boughY(x)+2.5*Math.sin(x/60)];
  const seams=[x0]; for(let x=x0+60;x<x1-40;x+=62+R()*58) seams.push(x); seams.push(x1);
  const BARKC=["#5a3f2a","#6e4e33","#4a3424","#7d5a36","#62452e","#43301f","#87603a"];
  for (let i=0;i<seams.length-1;i++){
    const a=seams[i], b=seams[i+1];
    for (const half of [0,1]){
      ctx.beginPath();
      for(let x=a;x<=b;x+=4){ const p= half?M(x):T(x); ctx.lineTo(p[0],p[1]); }
      for(let x=b;x>=a;x-=4){ const p= half?B(x):M(x); ctx.lineTo(p[0],p[1]); }
      ctx.closePath(); glassPane(ctx, BARKC[Math.floor(R()*BARKC.length)]);
    }
  }
  ctx.lineJoin="round"; ctx.strokeStyle="#100d0a";
  ctx.beginPath(); for(let x=x0;x<=x1;x+=4){ const p=T(x); x===x0?ctx.moveTo(...p):ctx.lineTo(...p);} ctx.lineTo(x1+14,boughY(x1)); for(let x=x1;x>=x0;x-=4) ctx.lineTo(...B(x)); ctx.closePath();
  ctx.lineWidth=6; ctx.stroke();
  ctx.lineWidth=3.2; ctx.beginPath(); for(let x=x0;x<=x1;x+=4){ const p=M(x); x===x0?ctx.moveTo(...p):ctx.lineTo(...p);} ctx.stroke();
  for (const x of seams.slice(1,-1)){ ctx.beginPath(); ctx.moveTo(...T(x)); ctx.quadraticCurveTo(x+7, boughY(x), ...B(x)); ctx.stroke(); }
  for (const x of [700,1240]){ ctx.beginPath(); ctx.ellipse(x+30,boughY(x)+2,10,6,0,0,7); glassPane(ctx,"#3e2d20"); ctx.lineWidth=3; ctx.stroke(); }
  const G=["#3f7a3a","#2f6a4a","#5d8236","#2a5a3c","#4a7a52"];
  for (const x of [292,372,1000,1180,1440,1560,1622]) {
    const n=3+Math.floor(R()*2);
    for(let k=0;k<n;k++) glassLeaf(ctx, x+(R()-.5)*30, boughY(x)-th(x)/2+5, 36+R()*20, -Math.PI/2+(k-(n-1)/2)*.75+(R()-.5)*.3, G[Math.floor(R()*G.length)]);
  }
}
// the hand rests on a fallen log, leaded like the bough
function drawLog(ctx, x0, x1, y){
  const R=rng(5), C=["#5a3f2a","#6e4e33","#4a3424","#7d5a36","#62452e","#43301f"];
  const seams=[x0]; for(let x=x0+50;x<x1-30;x+=55+R()*40) seams.push(x); seams.push(x1);
  for(let i=0;i<seams.length-1;i++) for (const half of [0,1]){
    const a=seams[i], b=seams[i+1], sl = (R()-.5)*10;
    ctx.beginPath(); ctx.moveTo(a, half?y+19:y); ctx.lineTo(b, half?y+19:y-2); ctx.lineTo(b+sl, half?y+40:y+19); ctx.lineTo(a, half?y+40:y+19); ctx.closePath();
    glassPane(ctx, C[Math.floor(R()*C.length)]);
  }
  const pts=[[x0,y],[x1,y-3],[x1+10,y+18],[x1,y+40],[x0,y+40]];
  shape(ctx,pts); ctx.lineWidth=5; ctx.strokeStyle="#100d0a"; ctx.lineJoin="round"; ctx.stroke();
  ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x0+8,y+19); ctx.lineTo(x1+4,y+18); ctx.stroke();
  for (const cx of seams.slice(1,-1)){ ctx.beginPath(); ctx.moveTo(cx,y-1); ctx.lineTo(cx,y+19); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(x0,y+20,11,20,0,0,7); glassPane(ctx,"#9a7448"); ctx.lineWidth=4; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x0,y+20,5,9,0,0,7); ctx.lineWidth=2; ctx.stroke();
  for (const mx of [x0+90, x1-120]){ ctx.beginPath(); ctx.ellipse(mx,y+1,34,6,0,0,7); glassPane(ctx,"#3f6a30"); ctx.lineWidth=2.6; ctx.stroke(); }
}
function chain(x, y2, col="#9a8a6a"){
  const yb = boughY(x);
  S(`<line x1="${x}" y1="${yb}" x2="${x}" y2="${y2}" stroke="#0b0907" stroke-width="5"/>
     <line x1="${x}" y1="${yb}" x2="${x}" y2="${y2}" stroke="${col}" stroke-width="2.4" stroke-dasharray="6 3"/>
     <circle cx="${x}" cy="${yb+2}" r="5" fill="#2a2019" stroke="#0b0907" stroke-width="2"/>`);
}

function shopRow(offers, spells, opts={}){
  const W=SHOP_H*.56;

    priceTag(x+W/2, SHOP_TOP-38, o.price, o.price>opts.gold?"e-tag-short":"");

  spells.forEach((s,i)=>{
    const [cx,cy] = spellC(i);
    chain(cx, cy-SPELL_D/2);
    spellCard(s, cx, cy, SPELL_D, opts.spellState && opts.spellState[i] || "lit");

function boardPos(H, topFront, pitch=200){
  const W=H*.56, x0=960-(3*pitch+W)/2, step = Math.round(H*.66 + (pitch<=200 && H>=280 ? 70 : 52));
  const front=[0,1,2,3].map(i=>[x0+i*pitch, topFront]), back=[0,1,2].map(i=>[x0+(i+.5)*pitch, topFront+step]);
  return front.concat(back);
}
const BOARD_TOP = 414, BOARD_H = 300;
function board(units, opts={}){
  const H=opts.H||BOARD_H, pos = boardPos(H, opts.top||BOARD_TOP);

  pos.forEach(([x,y],i)=>{ const o=units[i]; if(o) placeCard(o, x, y, H, {state: (opts.state&&opts.state[i]) || "rest"}); });

}

function baseScene(opts={}){

        drawFireflies(fx); if(!opts.noBough) drawBough(fx); if(!opts.noLog) drawLog(fx, 200, 690, 1008); res(); };
      pane.complete? go() : (pane.onload=go, pane.onerror=go); }

}

// the fight: full size again (250), interlocked rows, no labels
const F_H = 250, F_PITCH = 200;
function fightPos(){
  const H=F_H, W=H*.56, x0=960-(3*F_PITCH+W)/2, step = 216;
  const oBack = [0,1,2].map(i=>[x0+(i+.5)*F_PITCH, 14]);
  const oFront = [0,1,2,3].map(i=>[x0+i*F_PITCH, 14+step]);
  const mine = [0,1,2,3].map(i=>[x0+i*F_PITCH, 510]).concat([0,1,2].map(i=>[x0+(i+.5)*F_PITCH, 510+step]));
  return {W, oBack, oFront, mine};
}
function tallyAt(x,y,n,killed){
  const t = el("div","e-tally",`left:${x}px;top:${y}px`);
  for (let i=0;i<n;i++){ if(i===Math.ceil(n/2)) t.append(el("span","e-bar")); t.append(el("i",i<killed?"e-gone":"")); }
  add(t);
}

  add(el("div","e-label e-name",`left:108px;top:98px`,"March Hare"));

      <span class="e-tally" style="position:static;transform:none"><i class="e-gone"></i><i></i><i></i><i></i><span class="e-bar"></span><i></i><i></i><i></i></span></div>

// layout check: report any plate whose text overflows it (read with --dump-dom)
function checkOverflow(){
  const bad=[];
  document.querySelectorAll(".e-plate, .e-tip-n, .e-tip-t, .e-tip-x, .e-kw-i").forEach(p=>{ if (p.scrollWidth > p.clientWidth+1) bad.push((p.textContent||"").trim().slice(0,30)+" "+p.scrollWidth+"/"+p.clientWidth); });
  document.body.dataset.overflow = bad.join(" | ") || "none";
}

({mid:viewMid, first:viewFirst, fight:viewFight, after:viewAfter, "hover-shop":()=>viewHoverShop(true), "hover-board":viewHoverBoard,
  "hover-spell":viewHoverSpell, "keywords-off":()=>viewHoverShop(false), cards:viewCards, extra1:viewHoverLight})[view]().then(checkOverflow);
