<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass in the Forest</title>
<style>
@font-face{font-family:Alegreya;src:url(../../../../../assets/glass/fonts/Alegreya[wght].ttf);font-weight:400 900}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Regular.ttf);font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(../../../../../assets/glass/fonts/AlegreyaSans-Bold.ttf);font-weight:700}
:root{
  --lead:#0c0a08; --cream:#f6ead0; --cream-dim:#d9ccb0; --ink:#1a1008;
  --amber:#f0b54a; --amber-hi:#ffd98a; --ruby:#8e1620; --ruby-hi:#c23440;
  --plate:rgba(20,15,11,.88);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d1418}
body{font-family:"Alegreya Sans",sans-serif;color:var(--cream)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#stage>canvas,#stage>img.bg,#stage>svg{position:absolute;left:0;top:0;width:1920px;height:1080px}
#scene{pointer-events:none}
.lay{position:absolute;left:0;top:0;width:1920px;height:1080px}

/* ---------- cards (e- prefix keeps names apart from anything else) ---------- */
.e-card{position:absolute}
.e-card .e-art{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.e-card .e-frame{position:absolute;inset:0;width:100%;height:100%}
.e-card .e-num{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;line-height:1;color:#150e08;letter-spacing:-.04em;
  font-variant-numeric:lining-nums;padding-top:.05em;text-shadow:0 0 .14em rgba(255,240,200,.8)}
.e-card .e-num.e-hurt{color:#a0100a;text-shadow:0 0 .14em rgba(255,240,200,.95)}
.e-card .e-spell-lead{position:absolute;inset:0;background:#16120e}
.e-card .e-cost{position:absolute;left:-6%;top:6%;width:36%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-family:Alegreya,serif;font-weight:900;color:var(--ink);
  background:radial-gradient(circle at 38% 34%,#ffe7a0,#e7b347 55%,#b9821f);border:3px solid var(--lead);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.e-card .e-pips{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.e-card .e-pips i{display:block;width:11px;height:11px;border-radius:50%;background:#fffbe8;border:2px solid var(--lead);box-shadow:0 0 6px #fff6c8}
.e-card.e-golden::before{content:"";position:absolute;inset:-7px;clip-path:polygon(50% 0%,100% 17%,100% 83%,50% 100%,0% 83%,0% 17%);
  background:linear-gradient(160deg,#fff1a8,#d39b22 40%,#ffe58a 60%,#a8700f);z-index:-1}
.e-marks{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;gap:3px;align-items:center;z-index:3}
.e-mark{position:relative;display:grid;place-items:center;border-radius:50%;border:2px solid var(--lead);box-shadow:0 1px 3px rgba(0,0,0,.7)}
.e-mark svg{width:66%;height:66%;fill:none;stroke:#fffaf0;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.e-mark b{position:absolute;right:-6px;bottom:-6px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:#14100c;border:1.5px solid #d8c9a6;
  font:700 14px/14px "Alegreya Sans",sans-serif;color:var(--cream);text-align:center}
.e-tribe{border-radius:3px 3px 50% 50%/3px 3px 60% 60%}
.e-tribe svg{fill:#fffaf0;stroke:none}
.e-renown{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;padding:1px 9px 1px 5px;height:26px;border-radius:13px;
  background:linear-gradient(#f2cd6a,#c8922b);border:2px solid var(--lead);font:900 19px/1 Alegreya,serif;color:var(--ink);box-shadow:0 0 10px rgba(255,210,120,.45);z-index:3}
.e-renown svg{width:16px;height:16px;fill:#5a3a08;stroke:none}

/* ---------- glass objects in the scene ---------- */
.e-plate{position:absolute;background:url(../../../../../assets/glass/ui/pane.jpg) center/260px,linear-gradient(170deg,#3a2c1f,#1b140e 70%);background-blend-mode:multiply;
  border:3px solid var(--lead);border-radius:7px;box-shadow:0 0 0 1.5px #9a7d4e,inset 0 0 0 1.5px rgba(255,228,170,.18),inset 0 -10px 18px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.65);
  color:var(--cream);font:700 18px/1 "Alegreya Sans",sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.e-coin{display:inline-grid;place-items:center;border-radius:50%;font-family:Alegreya,serif;font-weight:900;color:var(--ink);
  background:radial-gradient(circle at 38% 34%,#ffe7a0,#e7b347 55%,#b9821f);border:2px solid var(--lead);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.e-coin.e-short{background:radial-gradient(circle at 38% 34%,#d9ccb6,#a3978a 60%,#7c7166);color:#2a2119}
.e-gem{position:absolute;display:grid;place-items:center;font:900 22px/1 Alegreya,serif;color:#fff4dc;
  background:radial-gradient(circle at 40% 35%,var(--ruby-hi),var(--ruby) 70%);border:2.5px solid var(--lead);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.e-gem-wrap{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}
.e-round{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--lead);box-shadow:0 0 0 2px #6b5638,0 4px 10px rgba(0,0,0,.7);overflow:hidden;background:#222}
.e-round img{width:100%;height:100%;object-fit:cover;display:block}
.e-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:700 18px/1 "Alegreya Sans",sans-serif;color:var(--cream);
  padding:5px 10px;border-radius:6px;background:var(--plate);border:1.5px solid #5d4a33}
.e-place{position:absolute;transform:translate(-50%,-50%);font:900 17px/1 Alegreya,serif;color:var(--cream-dim);text-shadow:0 1px 2px #000,0 0 6px #000}
.e-sys{position:absolute;top:22px;height:44px;padding:0 14px;font-size:18px}
.e-sys svg{width:22px;height:22px;fill:none;stroke:var(--cream);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.e-accent{box-shadow:0 0 0 3px #ffd77a,0 0 28px 8px rgba(255,196,90,.75),0 4px 10px rgba(0,0,0,.7)!important}
.e-splash{position:absolute;transform:translate(-50%,-50%);font:900 40px/1 Alegreya,serif;color:#fff3dc;padding:8px 12px 4px;
  background:radial-gradient(circle,#c2202c 0,#8e1620 70%);border:3px solid var(--lead);
  clip-path:polygon(50% 0,63% 22%,90% 10%,80% 38%,100% 50%,80% 62%,90% 90%,63% 78%,50% 100%,37% 78%,10% 90%,20% 62%,0 50%,20% 38%,10% 10%,37% 22%);
  width:110px;height:96px;display:grid;place-items:center;z-index:6}
.e-tally{position:absolute;display:flex;align-items:center;gap:5px;transform:translate(-50%,-50%)}
.e-tally i{display:block;width:16px;height:22px;background:#e8dcc0;border:2px solid var(--lead);clip-path:polygon(50% 0,100% 20%,100% 80%,50% 100%,0 80%,0 20%)}
.e-tally i.e-gone{background:#3a3430}
.e-tally .e-bar{width:3px;height:30px;background:#ffd77a;border-radius:2px;margin:0 3px;box-shadow:0 0 6px #ffd77a}

.e-dim{filter:brightness(.42) saturate(.6)}
.e-btn{position:absolute;transform:translate(-50%,-50%);font:700 22px/1 "Alegreya Sans",sans-serif;color:var(--cream);padding:14px 24px;border-radius:8px;
  background:url(../../../../../assets/glass/ui/pane.jpg) center/260px,linear-gradient(170deg,#3e3022,#1d1510 70%);background-blend-mode:multiply;
  border:3px solid var(--lead);box-shadow:0 0 0 1.5px #9a7d4e,inset 0 0 0 1.5px rgba(255,228,170,.18),0 4px 10px rgba(0,0,0,.7);white-space:nowrap}
.e-btn.e-go{color:var(--ink);background:url(../../../../../assets/glass/ui/pane.jpg) center/260px,radial-gradient(ellipse at 50% 30%,#fff0b8,#f2bd52 60%,#c98a22);
  box-shadow:0 0 0 1.5px #ffe3a0,0 0 26px 6px rgba(255,196,90,.55),0 4px 10px rgba(0,0,0,.7)}
.e-cue{position:absolute;z-index:20}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <svg id="scene" viewBox="0 0 1920 1080"></svg>
  <div id="ui" class="lay"></div>
</div>
<script>
// ======================================================================
// Data
// ======================================================================
const A = "../../../../../assets/";
const RD = {"tier1":{"a":[110.8,778.5,62.4],"h":[448.8,778.5,62.4]},"tier2":{"a":[115.2,770.0,63.4],"h":[445.2,770.0,63.1]},"tier3":{"a":[111.2,758.5,59.6],"h":[448.0,760.5,60.0]},"tier4":{"a":[107.5,760.8,59.9],"h":[451.8,760.2,60.0]},"tier5":{"a":[110.5,751.0,65.2],"h":[448.0,750.2,65.1]},"tier6":{"a":[110.0,775.2,58.4],"h":[446.8,775.2,59.0]}};
const ARTCLIP = "polygon(" + [[280,43.4],[537.1,183.7],[537.1,816.3],[280,956.6],[22.9,816.3],[22.9,183.7]].map(([x,y])=>`${x/5.6}% ${y/10}%`).join(",") + ")";
const HEX = "polygon(50% 0%,100% 17%,100% 83%,50% 100%,0% 83%,0% 17%)";

const TRIBE = {
  badger:{c:"#b8653a", g:'<path d="M3.5 8.5 12 3l8.5 5.5-2.2 9L12 21.5l-6.3-4z"/><path d="M10.6 4.5h2.8v15h-2.8z" fill="#2a1a10"/><circle cx="7.6" cy="10.5" r="1.4" fill="#2a1a10"/><circle cx="16.4" cy="10.5" r="1.4" fill="#2a1a10"/>'},
  locust:{c:"#9fae2e", g:'<path d="M11.2 22V8h1.6v14z"/><ellipse cx="12" cy="4.6" rx="1.9" ry="3"/><ellipse cx="8.6" cy="9" rx="1.8" ry="2.9" transform="rotate(-28 8.6 9)"/><ellipse cx="15.4" cy="9" rx="1.8" ry="2.9" transform="rotate(28 15.4 9)"/><ellipse cx="8.6" cy="14.2" rx="1.8" ry="2.9" transform="rotate(-28 8.6 14.2)"/><ellipse cx="15.4" cy="14.2" rx="1.8" ry="2.9" transform="rotate(28 15.4 14.2)"/>'},
  mouse:{c:"#cf6f8e", g:'<circle cx="12" cy="14" r="6.2"/><circle cx="6.2" cy="7.2" r="3.4"/><circle cx="17.8" cy="7.2" r="3.4"/>'},
  pigeon:{c:"#5f8fcc", g:'<path d="M4.5 20C7.5 9.5 13 5 20.5 3.5c-1 7.5-5.5 12.8-16 16.5z"/>'},
  briar:{c:"#3f9a4c", g:'<path d="M12 2.5c5.5 3.5 7.5 9 4.2 14.5-1.1 1.9-2.6 3.3-4.2 4.5-1.6-1.2-3.1-2.6-4.2-4.5C4.5 11.5 6.5 6 12 2.5z"/><path d="M12 6v14" stroke="#16351b" stroke-width="1.6" fill="none"/><path d="M18.5 9.5l3-1.2-1.2 3z"/><path d="M5.5 9.5l-3-1.2 1.2 3z"/>'},
  neutral:{c:"#8f8b80", g:'<path d="M12 3l7 9-7 9-7-9z"/>'}
};
const KW = { // stroke icons from assets/glass/keywords.json; colour = its family
  sortie:['#c8442c','<path d="M4 19c1-8 6-13 14-13"/><path d="M14.5 3 18 6l-3.5 3.5"/>'],
  fury:['#c8442c','<path d="M12 21c-3.6 0-6-2.5-6-6 0-3.5 3-5.5 3.5-9 2 1.5 3 3.3 3 5 1-1 1.5-2.3 1.5-3.5 2.5 2 4 4.5 4 7.5 0 3.5-2.4 6-6 6z"/>'],
  pile:['#c8442c','<path d="M6 9l6-5 6 5M6 14l6-5 6 5M6 19l6-5 6 5"/>'],
  thorns:['#c8442c','<path d="M3 17h18M5 17l2-6 2 6M10 17l2-8 2 8M15 17l2-6 2 6"/>'],
  guard:['#b98a1e','<path d="M12 3 19 6v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>'],
  grow:['#3f8a30','<path d="M12 21V11"/><path d="M12 13c-4 0-6.5-2.5-6.5-6 4 0 6.5 2.5 6.5 6zM12 11c0-3.5 2.5-6 6.5-6 0 3.5-2.5 6-6.5 6z"/>'],
  hmd:['#3f8a30','<circle cx="5.5" cy="17" r="2.5"/><circle cx="18.5" cy="17" r="2.5"/><path d="M5.5 12c1.5-6 11.5-6 13 0"/><path d="M15 10.5l3.5 1.5 1-3.5"/>'],
  reserve:['#7448b0','<path d="M6 21V8h9v13"/><path d="M14 9l5-5M15 4h4v4"/>'],
  seed:['#24799a','<path d="M12 3c4 3.5 5.5 8 3.5 12.5-1.3 3-5.7 3-7 0C6.5 11 8 6.5 12 3z"/><path d="M12 7v10"/>'],
  squire:['#66727f','<circle cx="12" cy="7" r="3.2"/><path d="M9 20h6l-1-6h-4zM7 21h10"/>'],
  supply:['#66727f','<path d="M3 7h18v13H3zM2 4h20v4H2zM6 11l12 6M18 11 6 17"/>'],
  hit:['#c8442c','<path d="M4 20 15 9"/><path d="M13 4l7 7M16.5 4.5l3 3"/>'],
};
const STAR = '<path d="M12 3.5l2.5 5.2 5.6.7-4.1 3.9 1 5.6L12 16.2l-5 2.7 1-5.6-4.1-3.9 5.6-.7z"/>';
const u = (tribe, id) => A + "units/" + (tribe==="briar"?"thorn":tribe==="neutral"?"shared":tribe) + "/" + id + ".jpg";

// the turn-9 state (docs/workstreams/ui-ideation/map/state.md)
const BOARD9 = [
  {id:"famine-caller",t:"locust",tier:3,a:15,h:11,renown:7},
  {id:"squadron-leader",t:"pigeon",tier:3,a:4,h:9},
  {id:"bell-ringer",t:"mouse",tier:3,a:5,h:7,renown:2,kw:[["hmd"]]},
  {id:"granary-glutton",t:"locust",tier:4,a:7,h:7},
  {id:"wing-commander",t:"pigeon",tier:5,a:11,h:17,renown:3,kw:[["sortie"]],pips:4},
  {id:"blackberry-sprawl",t:"briar",tier:3,a:4,h:8,kw:[["grow",2]]},
  {id:"hedge-lancer",t:"badger",tier:3,a:6,h:12,kw:[["fury",1]]},
];
const SHOP9 = [
  {id:"bramble-runner",t:"briar",tier:1,a:4,h:5,kw:[["seed"]],price:2},
  {id:"home-guard",t:"pigeon",tier:3,a:3,h:11,kw:[["guard"],["reserve"]],price:4},
  {id:"hayloft-aunt",t:"mouse",tier:2,a:2,h:9,kw:[["hmd"]],price:3},
  {id:"sweetbriar",t:"briar",tier:2,a:3,h:7,price:3},
  {id:"shrew-cutpurse",t:"mouse",tier:2,a:2,h:4,kw:[["pile",1]],price:3},
];
const SHOP1 = [
  {id:"sentry",t:"pigeon",tier:1,a:2,h:5,kw:[["supply",6]],price:2},
  {id:"hedgerow-scout",t:"mouse",tier:1,a:3,h:10,kw:[["hmd"]],price:2},
  {id:"territorial",t:"pigeon",tier:1,a:5,h:7,kw:[["reserve"]],price:2},
  {id:"bumblebee",t:"neutral",tier:1,a:2,h:3,price:2},
  {id:"green-recruit",t:"locust",tier:1,a:2,h:2,price:2},
];
const FOE = [
  {id:"greatsword-bearer",t:"badger",tier:4,a:7,h:15,renown:3,kw:[["squire"]]},
  {id:"briar-king",t:"briar",tier:6,a:12,h:20,renown:4,kw:[["thorns",4]]},
  {id:"holly-knight",t:"briar",tier:4,a:12,h:19,renown:7,kw:[["grow",2]]},
  {id:"the-eighth-plague",t:"locust",tier:5,a:6,h:14,renown:2},
  {id:"weasel",t:"neutral",tier:5,a:9,h:13,renown:1,pips:6},
  {id:"gorger",t:"locust",tier:4,a:38,h:68,golden:true},
  {id:"dame-bodkin",t:"mouse",tier:5,a:6,h:9,kw:[["pile",2]]},
];
const MINE_FIGHT = [
  {id:"famine-caller",t:"locust",tier:3,a:15,h:11,renown:7},
  {id:"squadron-leader",t:"pigeon",tier:3,a:4,h:9},
  {id:"bell-ringer",t:"mouse",tier:3,a:5,h:7,renown:2,kw:[["hmd"]]},
  null,
  {id:"wing-commander",t:"pigeon",tier:5,a:11,h:17,renown:3,kw:[["sortie"]],pips:4},
  {id:"blackberry-sprawl",t:"briar",tier:3,a:8,h:12,kw:[["grow",2]]},
  {id:"hedge-lancer",t:"badger",tier:3,a:6,h:12,kw:[["fury",1]]},
];
const PLAYERS9 = [ // place order
  ["pipkin",31],["old_mother_mousewife",28],["dame_hoolet",23],["little_king_wren",18],
  ["march_hare",16,"next"],["hob_mumblecrust",16],["dame_farthing",11,"you"],["brother_bracken",0,"out"]
];
const PLAYERS1 = [["pipkin",40],["old_mother_mousewife",40],["dame_hoolet",40],["little_king_wren",40],
  ["march_hare",40,"next"],["hob_mumblecrust",40],["dame_farthing",40,"you"],["brother_bracken",40]];

// ======================================================================
// Helpers
// ======================================================================
const ui = document.getElementById("ui");
const svg = document.getElementById("scene");
const el = (tag, cls, css, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(css) e.style.cssText=css; if(html!=null) e.innerHTML=html; return e; };
const add = (e, parent=ui) => (parent.append(e), e);
const S = (html) => svg.insertAdjacentHTML("beforeend", html);
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function mark(kind, n, size){
  const [col, path] = KW[kind];
  const m = el("span","e-mark",`width:${size}px;height:${size}px;background:radial-gradient(circle at 40% 35%,${col}ee,${col} 70%)`,
    `<svg viewBox="0 0 24 24">${path}</svg>` + (n!=null?`<b>${n}</b>`:""));
  return m;
}
function tribeMark(t, size){
  const T = TRIBE[t];
  return el("span","e-mark e-tribe",`width:${size}px;height:${size*1.08}px;background:radial-gradient(circle at 40% 30%,${T.c},${T.c} 60%,#00000055);`,
    `<svg viewBox="0 0 24 24">${T.g}</svg>`);
}

// a card: real art + tier frame, numbers on the frame's own discs
function card(o, x, y, H, extra={}){
  const W = H*0.56, k = H/1000;
  const c = el("div","e-card"+(o.golden?" e-golden":""),`left:${x}px;top:${y}px;width:${W}px;height:${H}px;`);
  const T = TRIBE[o.t]||TRIBE.neutral;
  const glow = extra.noglow ? "" : `drop-shadow(0 0 ${Math.round(H*.075)}px ${T.c}) `;
  c.style.filter = (extra.filter||"") + glow + "drop-shadow(0 8px 10px rgba(0,0,0,.65))";
  if (o.spell){
    c.append(el("div","e-spell-lead",`clip-path:${HEX}`));
    c.append(el("div","e-art",`inset:3.2% 5.6%;background-image:url(${A}glass/art/${o.art}.jpg);clip-path:${HEX}`));
    const cost = el("span","e-cost",`font-size:${Math.max(18,H*.11)}px`, o.cost); c.append(cost);
    return c;
  }
  c.append(el("div","e-art",`background-image:url(${u(o.t,o.id)});clip-path:${ARTCLIP}`));
  const fr = el("img","e-frame"); fr.src = `${A}glass/frames/tier${o.tier}.webp`; fr.alt=""; c.append(fr);
  const r = RD["tier"+o.tier];
  for (const [key,val,hurt] of [["a",o.a,false],["h",o.hcur!=null?o.hcur:o.h,o.hcur!=null&&o.hcur<o.h]]){
    const [cx,cy,rad] = r[key]; const s=String(val);
    const fs = rad*(s.length>1?1.2:1.42)*k;
    c.append(el("span","e-num"+(hurt?" e-hurt":""),`left:${cx/5.6}%;top:${cy/10}%;font-size:${fs.toFixed(1)}px;width:${2*rad*k}px;height:${2*rad*k}px`, s));
  }
  if (o.pips){ const p=el("div","e-pips",`top:${H*.635}px`); for(let i=0;i<o.pips;i++) p.append(el("i")); c.append(p); }
  return c;
}
// card + its marks (tribe first) at the bottom point, Renown above the top point
function placeCard(o, x, y, H, extra={}){
  const c = card(o,x,y,H,extra); add(c, extra.parent||ui);
  if (o.spell) return c;
  const W=H*.56, ms = Math.round(Math.max(26, H*.095));
  const row = el("div","e-marks",`left:${x+W/2}px;top:${y+H-2}px`);
  row.append(tribeMark(o.t, ms));
  for (const [kind,n] of (o.kw||[])) row.append(mark(kind,n,ms));
  if (extra.dim) row.style.filter="brightness(.45)";
  add(row, extra.parent||ui);
  if (o.renown){

function hex2rgb(h){ h=h.replace("#",""); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function mix(a,b,t){ return a.map((v,i)=>v+(b[i]-v)*t); }
function rgb(c,j=0){ return `rgb(${c.map(v=>Math.max(0,Math.min(255,Math.round(v*(1+j))))).join(",")})`; }

function mosaic(ctx, R, x0,y0,x1,y1, step, colourAt, lw=2.4){
  const nx = Math.ceil((x1-x0)/step)+1, ny = Math.ceil((y1-y0)/step)+1, P=[];
  for (let j=0;j<=ny;j++){ P[j]=[]; for(let i=0;i<=nx;i++){
    const edge = (i===0||j===0||i===nx||j===ny);
    P[j][i]=[x0+i*step+(edge?0:(R()-.5)*step*.62), y0+j*step+(edge?0:(R()-.5)*step*.62)]; } }
  ctx.lineJoin="round"; ctx.strokeStyle="#0b0907"; ctx.lineWidth=lw;
  for (let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const a=P[j][i],b=P[j][i+1],c=P[j+1][i+1],d=P[j+1][i];
    const polys = R()<.45 ? (R()<.5?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]]) : [[a,b,c,d]];
    for (const p of polys){
      const cx=p.reduce((s,q)=>s+q[0],0)/p.length, cy=p.reduce((s,q)=>s+q[1],0)/p.length;
      ctx.beginPath(); p.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
      ctx.fillStyle = rgb(colourAt(cx,cy), (R()-.5)*.16); ctx.fill(); ctx.stroke();
    }
  }
}
function shape(ctx, pts){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); }
function leaf(ctx, x,y,len,ang,col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(len*.5,-len*.32,len,0); ctx.quadraticCurveTo(len*.5,len*.32,0,0); ctx.closePath();
  ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=2.6; ctx.strokeStyle="#0b0907"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(len*.08,0); ctx.lineTo(len*.86,0); ctx.lineWidth=1.6; ctx.stroke();
  ctx.restore();
}

function drawForest(ctx){
  const R = rng(9);
  const NAVY=hex2rgb("#121d36"), TEAL=hex2rgb("#1b3940"), SHAFT=hex2rgb("#6e7a5a"), MOSS=hex2rgb("#243f27"), MOSS2=hex2rgb("#2f4c2a"), POOL=hex2rgb("#4b5a33");
  const groundY = x => 470 + 18*Math.sin(x/260) ;
  const shafts = [[880,-40,640,1000,70],[1180,-40,1000,1000,46],[700,-40,420,900,40]];
  function airAt(x,y){
    let c = mix(NAVY, TEAL, Math.min(1, Math.max(0,y/480)));
    // far trunks
    for (const [tx,w] of [[470,54],[760,38],[1240,44],[1470,60],[1060,26]]){
      if (Math.abs(x-tx-(y*.03)) < w/2 && y<560) c = mix(c, hex2rgb("#141a1f"), .75);
    }
    if (y > groundY(x)) {
      const d = Math.hypot((x-960)/560,(y-790)/250);
      c = mix(MOSS, MOSS2, (Math.sin(x/90)+1)/2*.6);
      if (d<1) c = mix(c, POOL, (1-d)*.75);
      // path out of the clearing, bottom right
      const px = 1500 + (1080-y)*0.55;
      if (x > px && x < px+260-(1080-y)*.15 && y>760) c = mix(hex2rgb("#4a3a28"), hex2rgb("#a07a3c"), Math.max(0,(1080-y)/320)*.85);
    }
    for (const [x0,y0,x1,y1,w] of shafts){
      const t=((x-x0)*(x1-x0)+(y-y0)*(y1-y0))/((x1-x0)**2+(y1-y0)**2);
      const px=x0+t*(x1-x0), py=y0+t*(y1-y0), dist=Math.hypot(x-px,y-py);
      if (dist<w && t>0 && t<1) c = mix(c, SHAFT, (1-dist/w)*.42*(1-t*.6));
    }
    return c;
  }
  mosaic(ctx, R, 0,0,1920,1080, 66, airAt, 2.2);

  // ---- left oak: trunk, bark panes, roots
  const oak = [[0,0],[236,0],[214,170],[200,420],[214,640],[248,800],[330,930],[455,1035],[520,1080],[0,1080]];
  ctx.save(); shape(ctx, oak); ctx.clip();
  const BARK=["#3a2c24","#4a372b","#2f241e","#57412f","#40302a"].map(hex2rgb);
  mosaic(ctx, R, 0,0,560,1080, 46, (x,y)=> BARK[Math.floor((x/38+Math.sin(y/70))%5+5)%5], 2.4);
  // vertical bark seams
  ctx.strokeStyle="#0b0907"; ctx.lineWidth=4;
  for (const sx of [34,82,128,170]){ ctx.beginPath(); for(let y=0;y<=1080;y+=20){ const x=sx+10*Math.sin(y/55+sx)+ (y>760? (y-760)*sx/600:0); y?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); }
  ctx.restore();
  shape(ctx, oak); ctx.lineWidth=6; ctx.strokeStyle="#0b0907"; ctx.stroke();
  // moss on the roots
  ctx.save(); shape(ctx, oak); ctx.clip();
  ctx.beginPath(); ctx.moveTo(180,900); ctx.quadraticCurveTo(330,960,520,1080); ctx.lineTo(0,1080); ctx.lineTo(0,1010); ctx.closePath();
  ctx.fillStyle="#2f5a2c"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#0b0907"; ctx.stroke(); ctx.restore();

  // ---- right tree line: slim trunks with night gaps
  for (const [x,w,lean] of [[1622,40,-10],[1765,30,8],[1890,60,0]]){
    const pts=[[x-w/2,0],[x+w/2,0],[x+w/2+lean+12,1080],[x-w/2+lean-12,1080]];
    ctx.save(); shape(ctx,pts); ctx.clip();
    mosaic(ctx, R, x-w, 0, x+w+40, 1080, 34, (px,py)=> mix(hex2rgb("#231c19"),hex2rgb("#34291f"),(Math.sin(py/40+px)+1)/2), 2);
    ctx.restore(); shape(ctx,pts); ctx.lineWidth=4; ctx.strokeStyle="#0b0907"; ctx.stroke();
  }

  // ---- canopy: leaves along the top
  const GREENS=["#1c3d26","#24502f","#2e6236","#1a3322","#3a6b35","#2a4a40"];
  for (let i=0;i<150;i++){
    const x=R()*1980-30, y=R()*62-26 + (x<260? R()*120:0) + (x>1580? R()*140:0);
    leaf(ctx, x, y, 46+R()*44, R()*Math.PI*2, GREENS[Math.floor(R()*GREENS.length)]);
  }
  // ---- bramble and fern along the bottom edge (kept away from the cards)
  for (let i=0;i<26;i++){ const x=170+R()*420, y=1062+R()*30; leaf(ctx,x,y,30+R()*30,-Math.PI/2+(R()-.5)*2.2, GREENS[Math.floor(R()*4)]); }
  for (let i=0;i<18;i++){ const x=1240+R()*300, y=1060+R()*30; leaf(ctx,x,y,30+R()*28,-Math.PI/2+(R()-.5)*2.2, GREENS[Math.floor(R()*4)]); }
  // a few blackberries
  for (const [x,y] of [[198,1050],[560,1062],[1300,1058],[1515,1050]]){
    ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fillStyle="#3a1638"; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#0b0907"; ctx.stroke(); }
}
function drawFireflies(ctx){

    const g=ctx.createRadialGradient(x,y,0,x,y,12); g.addColorStop(0,"rgba(255,226,140,.9)"); g.addColorStop(1,"rgba(255,200,90,0)");

// the bough the shop hangs from, and the log the hand rests on: scene objects, drawn on every view
const boughY = x => 66 + 12*Math.sin((x-200)/1450*Math.PI) + 4*Math.sin(x/210);
let PANE=null;
function glassPane(ctx, colour, alphaTex=.55){
  ctx.fillStyle=colour; ctx.fill();
  if (PANE){ ctx.save(); ctx.globalCompositeOperation="multiply"; ctx.globalAlpha=alphaTex; ctx.fillStyle=PANE; ctx.fill(); ctx.restore(); }
}
function glassLeaf(ctx, x,y,len,ang,col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(len*.3,-len*.42,len*.75,-len*.3,len,0); ctx.bezierCurveTo(len*.75,len*.3,len*.3,len*.42,0,0); ctx.closePath();
  glassPane(ctx, col);
  ctx.lineWidth=4; ctx.strokeStyle="#100d0a"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(len*.1,0); ctx.quadraticCurveTo(len*.5,-len*.04,len*.9,0); ctx.lineWidth=2.4; ctx.stroke();
  ctx.restore();
}
function drawBough(ctx){
  const R=rng(11);
  const x0=226, x1=1656, th = x => 50 - (x-x0)/(x1-x0)*24 + 5*Math.sin(x/97) + 3*Math.sin(x/41);
  const T = x=>[x, boughY(x)-th(x)/2], B = x=>[x, boughY(x)+th(x)/2], M = x=>[x, boughY(x)+3*Math.sin(x/60)];
  // seams across the branch, leaning like bark plates
  const seams=[x0]; for(let x=x0+70;x<x1-50;x+=85+R()*80) seams.push(x); seams.push(x1);
  const BARKC=["#5d4532","#6f5239","#4e3a2a","#7a5c40","#654a35"];
  for (let i=0;i<seams.length-1;i++){
    const a=seams[i], b=seams[i+1], lean=14;
    for (const half of [0,1]){
      ctx.beginPath();
      for(let x=a;x<=b;x+=6){ const p= half?M(x):T(x); ctx.lineTo(p[0]+(half?0:lean*.0),p[1]); }
      for(let x=b;x>=a;x-=6){ const p= half?B(x):M(x); ctx.lineTo(p[0],p[1]); }
      ctx.closePath();
      glassPane(ctx, BARKC[Math.floor(R()*BARKC.length)]);
    }
  }
  // outline and seams in lead
  ctx.lineJoin="round"; ctx.strokeStyle="#100d0a";
  ctx.beginPath(); for(let x=x0;x<=x1;x+=6){ const p=T(x); x===x0?ctx.moveTo(...p):ctx.lineTo(...p);} ctx.lineTo(x1+14,boughY(x1)); for(let x=x1;x>=x0;x-=6) ctx.lineTo(...B(x)); ctx.closePath();
  ctx.lineWidth=6; ctx.stroke();
  ctx.lineWidth=3.4; ctx.beginPath(); for(let x=x0;x<=x1;x+=6){ const p=M(x); x===x0?ctx.moveTo(...p):ctx.lineTo(...p);} ctx.stroke();
  for (const x of seams.slice(1,-1)){ ctx.beginPath(); ctx.moveTo(...T(x)); ctx.quadraticCurveTo(x+6, boughY(x), ...B(x)); ctx.stroke(); }
  // two knots
  for (const x of [700,1240]){ ctx.beginPath(); ctx.ellipse(x+30,boughY(x)+2,11,7,0,0,7); glassPane(ctx,"#3e2d20"); ctx.lineWidth=3; ctx.stroke(); }
  // light catching the top edge
  ctx.beginPath(); for(let x=x0+10;x<=x1-10;x+=6){ const p=T(x); x===x0+10?ctx.moveTo(p[0],p[1]+5):ctx.lineTo(p[0],p[1]+5);} ctx.strokeStyle="rgba(255,226,170,.22)"; ctx.lineWidth=2; ctx.stroke();
  // leaf sprays
  const G=["#3f7a3a","#2f6a4a","#5d8236","#2a5a3c","#4a7a52"];
  for (const x of [292,372,560,1000,1180,1420,1520,1612]) {
    const n=3+Math.floor(R()*2);
    for(let k=0;k<n;k++) glassLeaf(ctx, x+(R()-.5)*30, boughY(x)-th(x)/2+6, 40+R()*22, -Math.PI/2+(k-(n-1)/2)*.75+(R()-.5)*.3, G[Math.floor(R()*G.length)]);
  }
}
function drawLog(ctx, x0, x1, y){
  const R=rng(5), C=["#5d4532","#6f5239","#4e3a2a","#7a5c40"];
  const seams=[x0,x0+120,x0+250,x0+380,x1];
  for(let i=0;i<seams.length-1;i++) for (const half of [0,1]){
    const a=seams[i], b=seams[i+1];
    ctx.beginPath(); ctx.moveTo(a, half?y+20:y); ctx.lineTo(b, half?y+20:y-3); ctx.lineTo(b, half?y+41:y+20); ctx.lineTo(a, half?y+42:y+20); ctx.closePath();
    glassPane(ctx, C[Math.floor(R()*4)]);
  }
  const pts=[[x0,y+1],[x1,y-4],[x1+10,y+18],[x1,y+40],[x0,y+42]];
  shape(ctx,pts); ctx.lineWidth=5; ctx.strokeStyle="#100d0a"; ctx.lineJoin="round"; ctx.stroke();
  ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x0+8,y+20); ctx.lineTo(x1,y+19); ctx.stroke();
  for (const cx of seams.slice(1,-1)){ ctx.beginPath(); ctx.moveTo(cx,y-2); ctx.lineTo(cx,y+41); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(x0,y+22,10,20,0,0,7); glassPane(ctx,"#b08a5c"); ctx.lineWidth=4; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x0,y+22,4,9,0,0,7); ctx.lineWidth=2; ctx.stroke();
}

function shopRow(offers, spells){

  });
  spells.forEach((s,i)=>{

    chain(x+sw/2, 0, top+2);

// ======================================================================
// Board (recruit): 4 in front, 3 behind, standing in the clearing
// ======================================================================
function slotStone(x,y,W,H){
  S(`<polygon points="${x+W/2},${y} ${x+W},${y+H*.17} ${x+W},${y+H*.83} ${x+W/2},${y+H} ${x},${y+H*.83} ${x},${y+H*.17}"
      fill="rgba(10,18,12,.42)" stroke="#0b0907" stroke-width="4"/>
     <polygon points="${x+W/2},${y+6} ${x+W-5},${y+H*.17+3} ${x+W-5},${y+H*.83-3} ${x+W/2},${y+H-6} ${x+5},${y+H*.83-3} ${x+5},${y+H*.17+3}"
      fill="none" stroke="rgba(190,210,170,.22)" stroke-width="2"/>`);
}
function boardPos(H, topFront, gap=20){
  const W=H*.56, x0=960-(4*W+3*gap)/2, front=[], back=[];
  for(let i=0;i<4;i++) front.push([x0+i*(W+gap), topFront]);
  for(let i=0;i<3;i++) back.push([x0+(i+.5)*(W+gap), topFront+H*.86]);
  return front.concat(back);
}
function board(units, H=300, top=452, opts={}){
  const pos = boardPos(H, top);
  pos.forEach(([x,y],i)=>{ const o=units[i]; if(!o || opts.stones) slotStone(x,y,H*.56,H); });
  // back row first, so the front row's marks sit above it
  [4,5,6,0,1,2,3].forEach(i=>{ const o=units[i]; if(o) placeCard(o, pos[i][0], pos[i][1], H, opts); });
  return pos;
}

// End turn: the next opponent's lantern at the end of the path
function endTurn(who, hp, income, accent=true){
  const x=1772, y=936, d=164;
  const r = roundel(x,y,d,who); if (accent) r.classList.add("e-accent");
  gem(x+60, y+62, hp, 40);
  add(el("div","e-btn"+(accent?" e-go":""),`left:${x}px;top:${y-112}px`,"End turn"));
  add(el("div","e-plate",`left:${x-d/2-78}px;top:${y+20}px;height:40px;padding:0 10px;font-family:Alegreya;font-weight:900;font-size:20px`,`+${income} ${coin("",24)}`));
}

// ======================================================================
// Views
// ======================================================================
function baseScene(opts={}){
  const bg=document.getElementById("bg").getContext("2d");
  const img = new Image();
  const fx=document.getElementById("fx").getContext("2d");
  return new Promise(res=>{
    const pane = new Image(); pane.src = A+"glass/ui/pane.jpg";
    img.onload=()=>{ bg.drawImage(img,0,0,1920,1080); finish(); };
    img.onerror=()=>{ drawForest(bg); finish(); };
    img.src = "background.webp";
    function finish(){ const go=()=>{ PANE = pane.naturalWidth? fx.createPattern(pane,"repeat"):null;
      drawFireflies(fx); if(!opts.noBough) drawBough(fx); drawLog(fx, 200, 690, 1036); res(); };
      pane.complete? go() : (pane.onload=go, pane.onerror=go); }
  });
}
