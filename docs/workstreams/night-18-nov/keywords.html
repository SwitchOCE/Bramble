<!doctype html><html lang="en"><meta charset="utf-8"><title>Bramble keyword sheet</title>
<style>
body{background:#181510;color:#efe6d2;font:18px sans-serif;margin:32px}h1{font:32px Georgia}#sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.term{background:#262c33;border:2px solid #16120e;border-radius:12px;padding:12px}.mark{display:inline-flex;align-items:center;gap:8px;border:3px solid #16120e;border-radius:24px;padding:4px 12px 4px 4px;color:#fbf3df;font:bold 20px Georgia;text-shadow:1px 1px #16120e}.mark svg{width:24px;height:24px;fill:none;stroke:var(--light);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;border-radius:50%;background:#16120e;padding:3px}p{font-size:16px;margin:8px 0 0;line-height:1.4}
</style><h1>Keyword colours and icons</h1><p>Six families. A separate drawing and a word distinguish every keyword. Drawings and colours: assets/glass/keywords.json. Reminder lines: the game's display data.</p><br><div id="sheet"></div><script>
(async()=>{const root='../../../';const data=await(await fetch(root+'assets/glass/keywords.json')).json();const entries={};for(const tribe of ['shared','badger','mouse','pigeon','locust','thorn']){const table=await(await fetch(root+'src/content/'+tribe+'/display.json')).json();for(const e of Object.values(table)){if(e.hidden||!e.name)continue;const name=e.name.replace(/\s*(\(N\)|\+N)$/,'');entries[name]??=e.reminder;}}
for(const [name,k] of Object.entries(data.keywords)){const f=data.families[k.family];const el=document.createElement('div');el.className='term';el.innerHTML=`<div class="mark" style="background:#${f.colour};--light:#${f.light}"><svg viewBox="0 0 24 24">${data.icons[k.icon]}</svg>${name}</div><p>${entries[name]||'Stays on the slot. Any unit standing there has it.'}</p><p>${f.name}</p>`;document.querySelector('#sheet').append(el);}})();
</script></html>
