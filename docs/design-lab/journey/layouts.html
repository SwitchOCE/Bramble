<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Layouts · Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* The four Clean Arena layouts side by side. Each frame is the real page at
     1920 x 1080, scaled down to fit, so proportions are exact. */
  :root { --bg: #0e1411; --panel: #161e1a; --ink: #eef0ea; --soft: #9aa69f; --line: rgba(255,255,255,.1); --go: #2fd68a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 Inter, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header a { color: #cfe; text-decoration: none; font-weight: 600; }
  h1 { margin: 0; font: 800 26px 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  .sub { color: var(--soft); margin-right: auto; }
  .seg { display: flex; background: rgba(255,255,255,.06); border-radius: 9px; padding: 3px; }
  .seg button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 7px; font-weight: 700; color: var(--soft); }
  .seg button.on { background: var(--ink); color: #111; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 18px 20px 30px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .frame a.open { position: absolute; inset: 0; z-index: 2; }
  figcaption { padding: 12px 16px 14px; }
  figcaption b { font: 800 22px 'Barlow Condensed', sans-serif; letter-spacing: .05em; text-transform: uppercase; margin-right: 8px; }
  figcaption b i { font-style: normal; color: var(--go); }
  figcaption span { color: var(--soft); }
</style>
</head>
<body>
<header>
  <a href="index.html">Lab ↩</a>
  <h1>Clean Arena · four layouts</h1>
  <span class="sub">Same units, same board position; only the sides change. <b style="color:#2fd68a">B is the chosen layout (11 Nov).</b> Click a layout to open it.</span>
  <div class="seg" id="mode"><button data-v="recruit" class="on">Recruit</button><button data-v="fight">Fight</button></div>
  <div class="seg" id="stop"><button data-v="1">Area 1</button><button data-v="2">2</button><button data-v="3" class="on">3</button><button data-v="4">4</button><button data-v="5">5</button></div>
</header>
<main id="grid"></main>
<script>
  const LAYOUTS = [
    ['a', 'Baseline', 'Scoreboard rows on the right, centred. End turn bottom-right. Your hero top-left under the turn and route; the hand beside your board.'],
    ['b', 'Portrait scoreboard ✓ chosen', 'The scoreboard is a slim strip of portraits on the right edge. Your hero and End turn sit beside your board on the right.'],
    ['c', 'End turn on the board', 'End turn is a tall bar on your board\'s right edge. The right column holds only the scoreboard.'],
    ['d', 'Quiet sides', 'The portrait strip plus the End turn bar, your hero between them. The most painting shows.'],
  ];
  const S = { mode: 'recruit', stop: '3' };
  const grid = document.getElementById('grid');
  function url(l, full) { return `arena/index.html?layout=${l}&stop=${S.stop}${S.mode === 'fight' ? '&mode=fight' : ''}${full ? '' : '&static'}`; }
  // Build the four frames once; switching recruit/fight or the area only changes
  // each frame's address, so nothing is torn down and rebuilt.
  function build() {
    grid.innerHTML = LAYOUTS.map(([l, name, line]) => `
      <figure><div class="frame"><iframe data-l="${l}" title="Layout ${l.toUpperCase()}" tabindex="-1"></iframe><a class="open" data-l="${l}" aria-label="Open layout ${l.toUpperCase()}"></a></div>
        <figcaption><b><i>${l.toUpperCase()}</i> ${name}</b><span>${line}</span></figcaption></figure>`).join('');
    draw();
  }
  function draw() {
    grid.querySelectorAll('iframe').forEach((f) => { const u = url(f.dataset.l); if (f.getAttribute('src') !== u) f.setAttribute('src', u); });
    grid.querySelectorAll('a.open').forEach((a) => a.setAttribute('href', url(a.dataset.l, true)));
    fit();
  }
  // Scale each 1920 x 1080 frame to its cell's width.
  function fit() { document.querySelectorAll('.frame').forEach((f) => { f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1920})`; }); }
  addEventListener('resize', fit);
  ['mode', 'stop'].forEach((k) => document.getElementById(k).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    S[k] = b.dataset.v;
    document.querySelectorAll(`#${k} button`).forEach((x) => x.classList.toggle('on', x === b));
    draw();
  }));
  build();
</script>
</body>
</html>
