<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folk Print · Recruit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans+SC:wght@500;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="folk.css">
<style>
.rc { position: absolute; inset: 0; padding: 12px 20px 16px; display: grid; grid-template-rows: 58px 1fr; grid-template-columns: 200px 1fr 236px; gap: 14px 20px; }
.rc-lobby { grid-column: 1 / -1; display: flex; gap: 10px; align-items: stretch; }
.rc-lobby-lab { display: flex; flex-direction: column; justify-content: center; padding-right: 6px; font: 800 15px/1.1 var(--fp-label); letter-spacing: .12em; }
.rc-lobby-lab b { font: 26px/1 var(--fp-display); letter-spacing: 0; }
.rc-p { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; background: var(--fp-paper);
  border: 2.5px solid var(--fp-ink); border-radius: 30px 30px 8px 8px; box-shadow: 3px 4px 0 var(--fp-ink); }
.rc-p .rc-pn { flex: 1; min-width: 0; overflow: hidden; }
.rc-p .rc-pn .fp-fit { display: inline-block; white-space: nowrap; font: 800 18px/1.05 var(--fp-label); }
.rc-p .rc-pt { font: 700 13px/1 var(--fp-label); color: var(--fp-ash); display: block; letter-spacing: .06em; }
.rc-ph { position: relative; width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; }
.rc-ph svg { position: absolute; inset: 0; }
.rc-ph b { position: relative; font: 19px/1 var(--fp-display); color: var(--fp-paper); margin-top: -4px; }
.rc-p.rc-you { background: var(--fp-kraft); border-width: 3.5px; }
.rc-p.rc-next { background: var(--fp-red); color: var(--fp-paper); }
.rc-p.rc-next .rc-pt { color: var(--fp-paper); }
.rc-p.rc-next::after { content: 'Next'; position: absolute; top: -10px; right: 46px; background: var(--fp-ink); color: var(--fp-paper);
  font: 800 13px/1 var(--fp-label); letter-spacing: .14em; padding: 3px 8px; }
.rc-p.rc-out { background: transparent; border-style: dashed; box-shadow: none; color: var(--fp-ash); }
.rc-p.rc-out .rc-pn { text-decoration: line-through 2px; }
.rc-p.rc-out .rc-ph svg path { fill: var(--fp-kraft); }
.rc-p.rc-out .rc-ph b { color: var(--fp-ash); }
.rc-res { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 2px solid var(--fp-ink); }
.rc-res.won { background: var(--fp-green); } .rc-res.lost { background: var(--fp-paper); }

.rc-left { display: flex; flex-direction: column; gap: 14px; }
.rc-turn { font: 800 18px/1 var(--fp-label); letter-spacing: .14em; text-align: center; }
.rc-turn b { font: 30px/1 var(--fp-display); display: block; margin-top: 4px; letter-spacing: 0; }
.rc-medal { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--fp-paper); border: 3px solid var(--fp-ink);
  border-radius: 16px; box-shadow: 4px 5px 0 var(--fp-ink); }
.rc-medal .rc-ico { position: relative; width: 84px; height: 84px; flex: none; display: flex; align-items: center; justify-content: center; }
.rc-medal .rc-ico svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rc-medal .rc-ico b { position: relative; font: 42px/1 var(--fp-display); color: var(--fp-ink); }
.rc-medal .rc-gold b { background: var(--fp-ochre); border: 3px solid var(--fp-ink); border-radius: 50%; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; }
.rc-medal span { font: 800 22px/1.05 var(--fp-label); letter-spacing: .08em; }
.rc-num { display: block; font: 44px/1 var(--fp-display); margin-top: 2px; }
.rc-medal small { display: block; font: 700 15px/1.2 var(--fp-label); color: var(--fp-ash); letter-spacing: .04em; margin-top: 4px; }
.rc-counts { margin-top: auto; display: grid; gap: 8px; font: 800 18px/1 var(--fp-label); letter-spacing: .08em; }
.rc-counts div { display: flex; justify-content: space-between; border-bottom: 2px solid var(--fp-ink); padding-bottom: 6px; }
.rc-counts b { font: 20px/1 var(--fp-display); letter-spacing: 0; }

.rc-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.rc-stall { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
.rc-valance { position: relative; width: 100%; height: 28px; background: var(--fp-red); border: 3px solid var(--fp-ink); border-radius: 8px 8px 0 0; display: flex; justify-content: center; }
.rc-valance::after { content: ''; position: absolute; left: -3px; right: -3px; top: 25px; height: 14px;
  background: radial-gradient(circle at 50% 0, var(--fp-red) 7px, var(--fp-ink) 7.2px 9.4px, transparent 9.6px) 0 0 / 20px 14px repeat-x; }
.rc-valance .fp-ribbon { position: relative; top: -9px; height: 38px; background: var(--fp-paper); color: var(--fp-ink); border: 0; font-size: 24px; z-index: 2;
  box-shadow: none; }
.rc-shop { display: flex; gap: 26px; justify-content: center; padding: 22px 10px 4px; }

.rc-boardwrap { position: relative; margin-top: auto; }
.rc-right { display: flex; flex-direction: column; gap: 16px; }
.rc-hand { position: relative; flex: 1; border: 3px solid var(--fp-ink); border-radius: 16px; background: var(--fp-kraft); display: flex; flex-direction: column; align-items: center; padding: 10px 0 24px; }
.rc-hand h3 { margin: 0 0 14px; display: flex; width: 100%; justify-content: space-between; padding: 0 16px; font: 800 20px/1 var(--fp-label); letter-spacing: .12em; }
.rc-hand h3 b { font: 18px/1 var(--fp-display); letter-spacing: 0; }
.rc-end { height: 104px; font-size: 32px; padding: 0 12px; border-radius: 52px 52px 16px 16px; flex-direction: column; gap: 4px; }
.rc-end small { font: italic 500 19px/1 var(--fp-serif); letter-spacing: 0; }
.rc-end-row { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.rc-end-row::before, .rc-end-row::after { content: ''; width: 16px; height: 16px; background: var(--fp-ochre); border: 2.5px solid var(--fp-ink); transform: rotate(45deg); }
.rc-tap { display: none; position: absolute; right: 18px; top: 4px; z-index: 3; font: italic 500 17px/1 var(--fp-serif); background: var(--fp-paper);
  border: 2px solid var(--fp-ink); border-radius: 14px; padding: 4px 10px 5px; }
.fp-phone .rc-tap { display: block; font-size: 20px; top: 1px; }
.fp-phone .rc { grid-template-columns: 230px 1fr 270px; }
.fp-phone .rc-p .rc-pn .fp-fit { font-size: 21px; }
.fp-phone .rc-shop { gap: 30px; padding-top: 22px; }
.fp-phone .rc-hand { padding-bottom: 16px; }
.fp-phone .rc-hand h3 { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="fp-stage"><div class="rc" id="rc"></div></div>
<script src="data.js"></script>
<script src="folk.js"></script>
<script>
FP.boot(() => {
  const R = FP.F.recruit, I = FP.I;
  const lobby = FP.F.lobby.map(p => `<div class="rc-p${p.name === 'You' ? ' rc-you' : ''}${p.next_opponent ? ' rc-next' : ''}${p.eliminated ? ' rc-out' : ''}">
      <div class="rc-pn"><span class="fp-fit">${p.name}</span><span class="rc-pt">${p.eliminated ? 'out' : 'tier ' + p.tier + ' · ' + p.last}</span></div>
      <div class="rc-ph">${I.heart}<b>${p.health}</b></div></div>`).join('');
  const next = FP.F.lobby.find(p => p.next_opponent);
  const shop = R.shop.map(u => FP.card(u, 'shop')).join('');
  const hand = R.hand.map(u => FP.card(u, 'shop')).join('');
  document.getElementById('rc').innerHTML = `
    <div class="rc-lobby">${lobby}</div>
    <div class="rc-left">
      <div class="rc-turn">Turn<b>${R.turn}</b></div>
      <div class="rc-medal"><div class="rc-ico">${I.coin}</div><div><span>Gold</span><b class="rc-num">${R.gold}</b></div></div>
      <div class="rc-medal"><div class="rc-ico">${I.tier}<b>${R.tier}</b></div><div><span>Tier</span><small>of 6</small></div></div>
      <button class="fp-btn fp-btn-ochre" style="font-size:27px;padding:0 16px">Tier up<span class="fp-cost">${I.coin}${R.tier_up_cost}</span></button>
      <div class="rc-counts"><div>Board <b>${R.board_count}</b></div><div>Hand <b>${R.hand_count}</b></div></div>
    </div>
    <div class="rc-mid">
      <div class="rc-stall"><div class="rc-valance"><span class="fp-ribbon">Shop · Tier ${R.tier}</span><span class="rc-tap">Tap a card to read it</span></div>
        <div class="rc-shop">${shop}</div></div>
      <div class="rc-boardwrap" id="bw">${FP.board(R.board, 'board')}</div>
    </div>
    <div class="rc-right">
      <button class="fp-btn">${I.refresh}Refresh<span class="fp-cost">${I.coin}${R.refresh_cost}</span></button>
      <button class="fp-btn fp-btn-blue">${I.freeze}Freeze</button>
      <div class="rc-hand"><h3>Hand <b>${R.hand_count}</b></h3>${hand}</div>
      <button class="fp-btn fp-btn-red rc-end"><span class="rc-end-row">End turn</span><small>then fight ${next ? next.name : ''}</small></button>
    </div>`;
  FP.inspect();
});
// stitch each back slot to the two front slots in front of it
window.fpAfter = () => {
  const bw = document.getElementById('bw'), b = bw.querySelector('.fp-board');
  const o = FP.rect(b), sl = s => FP.rect(b.querySelector(`[data-slot="${s}"]`));
  let d = '';
  [['B1', 'F1', 'F2'], ['B2', 'F2', 'F3'], ['B3', 'F3', 'F4']].forEach(([bk, f1, f2]) => {
    const r = sl(bk), a = sl(f1), c = sl(f2), y0 = r.y - o.y, x0 = r.x - o.x + r.w / 2;
    [a, c].forEach(f => { const x1 = f.x - o.x + f.w / 2, y1 = f.y - o.y + f.h; d += `M${x0} ${y0 + 2} L${(x0 + x1) / 2} ${(y0 + y1) / 2 + 1}`; });
  });
  b.insertAdjacentHTML('afterbegin', `<svg class="fp-stitch"><path d="${d}" stroke="var(--fp-red)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1 8" fill="none"/></svg>`);
};
</script>
</body>
</html>
