<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodcraft Recruit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&family=Grenze:wght@600;700;800&family=Alegreya+Sans:wght@500;700;800&family=Bitter:wght@800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="wc.css">
<style>
/* lobby: one carved plaque per player. Tier knot on the left, rosehip health on the right. */
.wr-lobby { position: absolute; left: 12px; right: 20px; top: 10px; height: 46px; display: flex; gap: 8px; align-items: center; }
.wr-pl { position: relative; flex: 1 1 auto; min-width: 0; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 0 0 3px; border-radius: 24px;
  background: var(--wc-birch); border: 3px solid var(--wc-ink); color: var(--wc-ink); box-shadow: 0 4px 0 0 var(--wc-carve), 0 4px 0 3px var(--wc-ink); }
.wr-pl .n { flex: 1 1 auto; min-width: 0; font: 700 15px/1 var(--wc-head); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wr-pl .k { flex: none; width: 27px; height: 27px; border-radius: 50%; background: var(--wc-oak); box-shadow: inset 0 0 0 3px var(--wc-carve); border: 2px solid var(--wc-ink);
  display: grid; place-items: center; font: 900 15px/1 var(--wc-num); color: var(--wc-ink); }
.wr-pl .h { width: 36px; height: 36px; margin-right: -9px; position: relative; display: grid; place-items: center; flex: none; }
.wr-pl .h svg { position: absolute; inset: 0; }
.wr-pl .h b { position: relative; font: 900 15px/1 var(--wc-num); color: var(--wc-cream); margin-top: 6px; }
.wr-pl.me { background: var(--wc-moss); color: var(--wc-cream); }
.wr-pl.next { background: var(--wc-walnut); color: var(--wc-cream); box-shadow: 0 0 0 4px var(--wc-hp), 0 4px 0 4px var(--wc-ink); }
.wr-pl.next::before { content: 'NEXT'; position: absolute; top: -11px; right: 30px; background: var(--wc-hp); color: var(--wc-cream); font: 800 12px/1 var(--wc-head); letter-spacing: .14em; padding: 3px 7px; border-radius: 6px; border: 2px solid var(--wc-ink); }
.wr-pl.out { background: #DCC79C; color: var(--wc-mute); border-style: dashed; box-shadow: none; }
.wr-pl.out .n { text-decoration: line-through; }
.wr-pl.out .k { background: #CDB283; box-shadow: none; color: var(--wc-mute); }
.wr-pl.out .h svg circle { fill: #8C7A62; }
.wr-legend { position: absolute; right: 24px; top: 58px; font: 700 12px/1 var(--wc-body); color: var(--wc-mute); display: none; }

.wr-main { position: absolute; left: 60px; top: 66px; bottom: 8px; right: 290px; }
.wr-wrap { position: relative; width: 860px; height: 100%; margin: 0 auto; }
.wr-shelf { position: relative; height: 204px; }
.wr-shelf-title { position: absolute; left: -54px; top: 46px; writing-mode: vertical-rl; transform: rotate(180deg); font: 800 16px/1 var(--wc-head); letter-spacing: .22em; color: var(--wc-ink); text-transform: uppercase; }
.wr-offers { position: absolute; left: 18px; top: 24px; display: flex; gap: 26px; z-index: 2; }
.wr-plank { position: absolute; left: 0; width: 756px; top: 162px; height: 34px; z-index: 1; border-radius: 6px; }
.wr-plank .wc-chipband { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 0 0 4px 4px; }
.wr-lower { position: absolute; top: 212px; left: 0; right: 0; display: flex; gap: 30px; align-items: flex-start; }
.wr-hand { width: 196px; padding: 10px 12px 26px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.wr-hand h3 { margin: 0; font: 800 20px/1 var(--wc-head); display: flex; justify-content: space-between; width: 100%; }
.wr-hand h3 span { font-weight: 700; }
.wr-count { margin-top: 16px; font: 800 17px/1 var(--wc-head); color: var(--wc-ink); background: var(--wc-birch); border: 2px solid var(--wc-ink); border-radius: 8px; padding: 4px 10px; }

.wr-side { position: absolute; right: 18px; top: 72px; bottom: 14px; width: 262px; display: flex; flex-direction: column; gap: 14px; }
.wr-gold { height: 90px; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
.wr-gold .big { width: 62px; height: 62px; }
.wr-gold .v { font: 900 46px/1 var(--wc-num); }
.wr-gold .lbl { font: 800 14px/1 var(--wc-body); letter-spacing: .12em; text-transform: uppercase; }
.wr-gold .pile { display: flex; flex-wrap: wrap; width: 90px; gap: 0; }
.wr-gold .pile svg { width: 22px; height: 22px; margin: -1px; }
.wr-tier { display: flex; align-items: center; gap: 8px; font: 800 22px/1 var(--wc-head); color: var(--wc-ink); padding-left: 8px; height: 28px; margin-bottom: -6px; }
.wr-tier svg { width: 30px; height: 30px; }
.wr-side .wc-leaf { height: 76px; width: 100%; }
.wr-side .wc-leaf-in { justify-content: space-between; }
.wr-side .wc-leaf--moss { height: 112px; font-size: 36px; margin-top: auto; }
.wr-side .wc-leaf--moss .wc-leaf-in { justify-content: center; flex-direction: column; gap: 4px; }
.wr-side .wc-leaf--moss small { font: 700 16px/1 var(--wc-body); }
.wr-side .wc-leaf .lab { flex: 1; text-align: left; display: flex; align-items: center; gap: 10px; }
</style></head>
<body>
<div class="wc-stage wc-table" id="stage">
  <div class="wr-lobby" id="lobby"></div>
  <div class="wr-main"><div class="wr-wrap">
    <div class="wr-shelf">
      <div class="wr-shelf-title">Shop</div>
      <div class="wr-offers" id="offers"></div>
      <div class="wr-plank wc-oak"><div class="wc-chipband"></div></div>
    </div>
    <div class="wr-lower">
      <div style="position:relative">
        <div class="wc-rowtag" style="top:36px;height:116px">Front</div>
        <div class="wc-rowtag" style="top:192px;height:116px">Back</div>
        <div id="board"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="wr-hand wc-plaque" id="hand"></div>
        <div class="wr-count" id="bcount"></div>
      </div>
    </div>
  </div>
  </div>
  <div class="wr-side" id="side"></div>
</div>
<script src="data.js"></script>
<script src="wc.js"></script>
<script>
WC.start(() => {
  const R = FIX.recruit;
  const next = FIX.lobby.find(p => p.next_opponent);
  const hp = (v) => `<div class="h">${WC.shape.hp}<b>${v}</b></div>`;
  document.getElementById('lobby').innerHTML = FIX.lobby.map(p =>
    `<div class="wr-pl ${p.name === 'You' ? 'me' : ''} ${p.next_opponent ? 'next' : ''} ${p.eliminated ? 'out' : ''}" title="Tier ${p.tier}"><span class="k">${p.tier}</span><span class="n">${p.name}</span>${hp(p.health)}</div>`).join('');
  document.getElementById('offers').innerHTML = R.shop.map(u => WC.tile(u, 'shop', { frozenNote: 'kept next turn' })).join('');
  const board = document.getElementById('board');
  board.innerHTML = WC.board({ front: R.board.front, back: R.board.back },
    { labels: true, labelsTop: true, notes: { F4: 'in front of B3', B3: 'behind F3 &amp; F4' } });
  WC.links(board.firstElementChild);
  document.getElementById('hand').innerHTML = `<h3>Hand <span>${R.hand_count}</span></h3>` + R.hand.map(u => WC.tile(u, 'shop')).join('');
  document.getElementById('bcount').textContent = 'Board ' + R.board_count;
  const ac = WC.icon.acorn;
  document.getElementById('side').innerHTML = `
    <div class="wr-gold wc-plaque"><div class="big">${ac}</div><div><div class="v">${R.gold}</div><div class="lbl">Gold</div></div>
      <div class="pile">${ac.repeat(R.gold)}</div></div>
    <div class="wr-tier">${WC.icon.tier} Tier ${R.tier}<span style="margin-left:auto;margin-right:8px">Turn ${R.turn}</span></div>
    ${WC.leaf(`<span class="lab">${WC.icon.tier}Tier up</span><span class="wc-cost">${ac}${R.tier_up_cost}</span>`, 'wc-leaf--acorn')}
    ${WC.leaf(`<span class="lab">${WC.icon.refresh}Refresh</span><span class="wc-cost">${ac}${R.refresh_cost}</span>`)}
    ${WC.leaf(`<span class="lab">${WC.icon.freeze}Freeze</span>`, 'wc-leaf--frost')}
    ${WC.leaf(`End turn<small>then fight ${next.name}</small>`, 'wc-leaf--moss')}`;
});
</script>
</body></html>
