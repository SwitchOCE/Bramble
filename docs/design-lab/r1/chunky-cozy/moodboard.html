<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chunky Cozy · Mood board</title>
<link rel="stylesheet" href="cozy.css">
<style>
  .t { position: absolute; left: 24px; top: 14px; font-family: var(--font-display); font-weight: 700; font-size: 34px; color: #fff; -webkit-text-stroke: 8px var(--cocoa); paint-order: stroke fill; text-shadow: 0 5px 0 var(--cocoa); }
  .t small { font-size: 18px; -webkit-text-stroke: 0; color: var(--cocoa-soft); text-shadow: none; margin-left: 12px; }
  .box { position: absolute; padding: 12px 14px; }
  .box > .label { display: block; margin-bottom: 8px; font-size: 13px; }
  .sw { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sw div { height: 74px; border-radius: 20px; position: relative; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.4), 0 4px 0 var(--drop); }
  .sw span { position: absolute; left: 6px; right: 6px; bottom: 5px; font-size: 11px; font-weight: 900; background: rgba(255,255,255,.85); border-radius: 8px; padding: 1px 5px; line-height: 1.2; }
  .type .d { font-family: var(--font-display); font-weight: 700; font-size: 50px; line-height: 1; }
  .type .b { font-size: 17px; font-weight: 800; line-height: 1.3; margin-top: 6px; }
  .type .nums { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
  .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .icons div { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 900; }
  .icons .ic { width: 70px; height: 70px; border-radius: 22px; display: grid; place-items: center; background: #fff; box-shadow: 0 4px 0 var(--drop); }
  .icons .ic svg { width: 50px; height: 50px; }
  .pat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pat div { height: 110px; border-radius: 24px; box-shadow: 0 4px 0 var(--drop); }
  .crops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .crops img { width: 100%; height: 150px; object-fit: cover; border-radius: 20px; border: 5px solid #fff; box-shadow: 0 5px 0 var(--drop); display: block; }
  .sheet { display: flex; gap: 10px; }
  .sheet img { height: 130px; border-radius: 18px; border: 5px solid #fff; box-shadow: 0 5px 0 var(--drop); }
  .btns { display: flex; gap: 16px; align-items: center; }
</style></head>
<body><div id="stage">
  <div class="t">Chunky Cozy <small>bright soft-plastic woodland · mood board</small></div>
  <div class="box panel" style="left:20px;top:76px;width:620px"><span class="label">Palette</span><div class="sw" id="sw"></div></div>
  <div class="box panel type" style="left:660px;top:76px;width:330px;height:200px"><span class="label">Type</span>
    <div class="d">Fredoka</div><div class="b">Nunito 800 for rules text: <span class="kw" style="--tc:var(--bluebell)">Peck 2</span>. Whenever this attacks, give your other Birds +1 Attack.</div></div>
  <div class="box panel" style="left:1010px;top:76px;right:20px;height:200px"><span class="label">Numbers + buttons</span>
    <div class="type"><div class="nums" id="nums"></div></div>
    <div class="btns" style="margin-top:12px;transform:scale(.7);transform-origin:0 0"><button class="btn go">End turn</button><button class="btn go" style="transform:translateY(6px);box-shadow:0 2px 0 #187a3a">Pressed</button></div></div>
  <div class="box panel" style="left:20px;top:296px;width:400px"><span class="label">Icons</span><div class="icons" id="icons"></div></div>
  <div class="box panel" style="left:440px;top:296px;width:550px"><span class="label">Surfaces</span><div class="pat" id="pat"></div>
    <div class="label" style="margin:10px 0 6px">Codex portraits (3 images, cropped)</div><div class="sheet"><img src="assets/p-belladonna-sprite.jpg" style="width:130px;object-fit:cover"><img src="assets/sheet-a.jpg"><img src="assets/sheet-b.jpg" style="height:76px;align-self:center"></div></div>
  <div class="box panel" style="left:1010px;top:296px;right:20px;bottom:20px"><span class="label">Screens</span><div class="crops" style="grid-template-columns:1fr" id="crops"></div></div>
</div>
<script src="data.js"></script><script src="ui.js"></script>
<script>
  const { I } = CZ, $ = id => document.getElementById(id);
  const pal = [['meadow', '#CDEFD5'], ['cream', '#FFF8EC'], ['cocoa', '#4A2E2A'], ['moss', '#1F8A43'], ['butter', '#FFCB3D'], ['strawberry', '#F0435E'], ['tangerine', '#FF8A2A'],
    ['berry', '#8A3FD1'], ['honey', '#F4A30F'], ['frost', '#7AD6FF'], ['bluebell', '#4D8EF0'], ['bubblegum', '#FF8FC8'], ['caramel', '#C27A4B'], ['pond', '#26A99A']];
  $('sw').innerHTML = pal.map(p => `<div style="background:${p[1]}"><span>${p[0]}<br>${p[1]}</span></div>`).join('');
  $('nums').innerHTML = `<div style="position:relative;flex:none;width:66px;height:66px;font-size:20px">${CZ.stat('atk', 4).replace('class="stat atk"', 'class="stat atk" style="left:0;bottom:0"')}</div>
    <div style="position:relative;flex:none;width:66px;height:66px;font-size:20px">${CZ.stat('hp', 5).replace('class="stat hp"', 'class="stat hp" style="right:0;bottom:0"')}</div>
    <div style="position:relative;flex:none;width:66px;height:66px;font-size:20px">${CZ.stat('hp', 12, 'low').replace('class="stat hp"', 'class="stat hp" style="right:0;bottom:0"')}</div>
    <span class="num" style="font-size:44px;color:var(--butter)">7</span>`;
  const ic = [['Gold', I.coin, '#fff'], ['Tier', I.star, '#fff'], ['Health', I.heart, '#fff'], ['Attack', I.atk, '#fff'], ['Refresh', I.refresh, 'var(--bluebell)'], ['Freeze', I.snow, 'var(--frost)'], ['Nightshade', I.berry, '#F1E6FB'], ['Golden', I.sparkle, '#FFE6A0']];
  $('icons').innerHTML = ic.map(i => `<div><span class="ic" style="background:${i[2]}">${i[1]}</span>${i[0]}</div>`).join('');
  $('pat').innerHTML = [
    'radial-gradient(circle at 10px 10px, #fff 4px, transparent 4.5px) 0 0/26px 26px, var(--meadow)',
    'repeating-linear-gradient(0deg, rgba(240,67,94,.35) 0 14px, transparent 14px 28px), repeating-linear-gradient(90deg, rgba(240,67,94,.35) 0 14px, transparent 14px 28px), #FFF8EC',
    'radial-gradient(circle at 20px 20px, rgba(255,255,255,.35) 4px, transparent 4.5px) 0 0/40px 40px, #9FDCCF',
    'conic-gradient(from 20deg, #FFD54A, #F4A30F, #FFE9A6, #F4A30F, #FFD54A)'
  ].map(b => `<div style="background:${b}"></div>`).join('');
  $('crops').innerHTML = [['recruit', '50% 70%'], ['combat', '60% 25%']].map(c => `<img src="shots/${c[0]}-desktop.jpg" style="object-position:${c[1]};height:170px">`).join('');
  CZ.fit();
</script></body></html>
