<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Arena · Recruit</title>
<link rel="stylesheet" href="arena.css">
<style>
  .stage { padding: .6rem 1rem; gap: .6rem; }
  .top { height: 3.4rem; display: flex; align-items: center; gap: .8rem; flex: none; }
  .turn { display: flex; align-items: baseline; gap: .5rem; flex: none; width: 11rem; }
  .turn b { font: 800 2.2rem/1 var(--cond); }
  .turn span { font: 700 1rem/1 var(--cond); letter-spacing: .14em; color: var(--moss); }
  .top .lobby { flex: 1; }
  .top .lobby .pill { flex: 1; min-width: 0; }
  .top .btn { min-height: 3.4rem; min-width: 4.4rem; font-size: 1.6rem; }
  .main { flex: 1; display: grid; grid-template-columns: 11rem 1fr 12.6rem; gap: .8rem; min-height: 0; }
  .hud { display: flex; flex-direction: column; gap: .55rem; justify-content: center; }
  .goldbox { background: var(--slate); border-radius: .8rem; padding: .6rem .8rem; display: flex; align-items: center; gap: .6rem; }
  .goldbox .i { font-size: 3rem; }
  .goldbox b { font: 800 4rem/.9 var(--cond); color: var(--gold); }
  .goldbox small { display: block; font: 700 .85rem/1 var(--cond); letter-spacing: .14em; color: var(--mist); }
  .tierbox { display: flex; align-items: center; gap: .6rem; padding: 0 .2rem; }
  .tierbox .hex { font-size: 1.7rem; background: var(--chalk); color: var(--ink); width: 1.6em; height: 1.8em; }
  .tierbox b { font: 800 1.5rem/1 var(--cond); letter-spacing: .06em; }
  .tierbox small { display: block; font: 600 .85rem/1.1 var(--cond); color: var(--mist); letter-spacing: .06em; }
  .hud .btn { justify-content: space-between; font-size: 1.35rem; padding: 0 .8rem; }
  .hud .btn .l { display: flex; align-items: center; gap: .45rem; }
  .hud .btn .i { font-size: 1.5rem; }
  .center { display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; min-width: 0; }
  .shop { display: grid; grid-template-columns: 2.4em auto; column-gap: .6em; font-size: .92rem; align-items: center; }
  .shoprow { display: flex; gap: 1em; }
  .bwrap { font-size: .93rem; padding: .4rem 0 0; }
  .side { display: flex; flex-direction: column; gap: .55rem; justify-content: center; }
  .sidehead { display: flex; justify-content: space-between; align-items: baseline; }
  .sidehead b { font: 800 1.3rem/1 var(--cond); color: var(--chalk); }
  .hand { font-size: .92rem; display: flex; justify-content: center; }
  .hand .card { width: 13.3em; }
  .count { display: flex; gap: .5rem; }
  .count div { flex: 1; background: var(--slate); border-radius: .6rem; padding: .45rem .6rem; }
  .count b { font: 800 1.5rem/1 var(--cond); }
  .next { border: .14rem solid var(--health); border-radius: .6rem; padding: .45rem .6rem; display: flex; justify-content: space-between; align-items: center; background: rgba(255,71,87,.1); }
  .next b { font: 800 1.3rem/1 var(--cond); text-transform: uppercase; }
  .next .hpn { font: 800 1.5rem/1 var(--cond); color: var(--health); }
  .endturn { min-height: 5.6rem; font-size: 2.1rem; flex-direction: column; gap: .2rem; }
</style></head>
<body>
<div class="stage">
  <div class="top">
    <div class="turn"><b>TURN <span id="turn" style="font:inherit;color:inherit;letter-spacing:0"></span></b><span>RECRUIT</span></div>
    <div id="lobby" style="flex:1;min-width:0;display:flex"></div>
    <div class="btn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"></svg></div>
  </div>
  <div class="main">
    <div class="hud" id="hud"></div>
    <div class="center">
      <div class="shop"><div class="rowlab">Shop <i>·</i> T3</div><div class="shoprow" id="shop"></div></div>
      <div class="bwrap" id="board"></div>
    </div>
    <div class="side" id="side"></div>
  </div>
</div>
<script src="data.js"></script><script src="arena.js"></script>
<script>
  const R = FX.recruit, ic = CA.icon;
  document.getElementById('turn').textContent = R.turn;
  document.getElementById('lobby').innerHTML = CA.lobby(FX.lobby);
  document.querySelector('.top > .btn').innerHTML = ic('gear');
  document.getElementById('hud').innerHTML = `
    <div class="goldbox">${ic('gold')}<div><b>${R.gold}</b><small>GOLD</small></div></div>
    <div class="tierbox"><span class="hex">${R.tier}</span><div><b>TIER ${R.tier}</b><small>Shop tiers 1–${R.tier}</small></div></div>
    <div class="btn"><span class="l">${ic('up')}Tier ${R.tier + 1}</span><span class="cost">${ic('gold')}${R.tier_up_cost}</span></div>
    <div class="btn"><span class="l">${ic('refresh')}Refresh</span><span class="cost">${ic('gold')}${R.refresh_cost}</span></div>
    <div class="btn frost ${R.frozen ? 'on' : ''}"><span class="l">${ic('freeze')}Freeze</span><span class="sub">${R.frozen ? 'ON' : 'ALL'}</span></div>`;
  document.getElementById('shop').innerHTML = R.shop.map(CA.shopCard).join('');
  document.getElementById('board').innerHTML = CA.board(R.board);
  const opp = FX.lobby.find(p => p.next_opponent);
  document.getElementById('side').innerHTML = `
    <div class="sidehead"><span class="label">Hand</span><b>${R.hand_count}</b></div>
    <div class="hand">${R.hand.map(u => CA.shopCard(u).replace(/<span class="price">.*?<\/span>/, '')).join('')}</div>
    <div class="count"><div><div class="label">Board</div><b>${R.board_count}</b></div><div><div class="label">Sell</div><b class="cost">${ic('gold')}1</b></div></div>
    <div class="next"><div><div class="label" style="color:var(--health)">Next fight</div><b>${opp.name}</b></div><span class="hpn">${opp.health}</span></div>
    <div class="btn primary endturn">End turn<span class="sub">Fight ${opp.name}</span></div>`;
  document.fonts.ready.then(() => CA.drawTies());
</script>
</body></html>
