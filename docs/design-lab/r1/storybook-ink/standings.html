<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storybook Ink: Standings</title>
<link rel="stylesheet" href="ink.css">
<style>
  .screen { height: 100vh; display: grid; grid-template-columns: 1fr 480px; gap: 40px; padding: 40px 60px; }
  .ledger { padding: 30px 40px; display: flex; flex-direction: column; min-height: 0; }
  .ledger h1 { font-size: 52px; font-weight: 900; display: flex; align-items: baseline; gap: 18px; }
  .ledger h1 small { font-family: var(--body); font-size: 22px; color: var(--inksoft); }
  table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 28px; }
  th { text-align: left; font-size: 16px; text-transform: uppercase; letter-spacing: .12em; color: var(--inksoft); padding: 6px 12px; border-bottom: 3px solid var(--ink); }
  td { padding: 0 12px; height: 92px; border-bottom: 2px dashed var(--shade); vertical-align: middle; }
  td.rk { width: 70px; font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--inksoft); text-align: center; }
  td.nm { font-family: var(--display); font-variation-settings: 'SOFT' 100; font-weight: 800; font-size: 32px; }
  .ico { position: relative; width: 58px; height: 58px; display: inline-block; vertical-align: middle; }
  .ico svg { width: 100%; height: 100%; }
  .ico b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 21px; }
  .ico.h b { color: var(--card); padding-bottom: 5px; }
  .ico.t b { padding-top: 3px; font-size: 19px; }
  .stamp { display: inline-block; font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: .1em; border: 3px solid var(--ink); border-radius: 8px; padding: 2px 12px; transform: rotate(-4deg); }
  .stamp.won { background: var(--moss); color: var(--card); }
  .stamp.lost { background: var(--card); color: var(--berry); border-color: var(--berry); }
  .stamp.out { background: var(--shade); color: var(--inksoft); border-color: var(--inksoft); }
  tr.you td { background: var(--card); }
  tr.you td:first-child { border-radius: 14px 0 0 14px; } tr.you td:last-child { border-radius: 0 14px 14px 0; }
  tr.next td { background: var(--heather); color: var(--card); border-bottom-color: var(--ink); }
  tr.next td.rk { color: var(--card); }
  tr.next td:first-child { border-radius: 14px 0 0 14px; } tr.next td:last-child { border-radius: 0 14px 14px 0; }
  tr.next .nx { display: inline-flex; align-items: center; gap: 4px; font-family: var(--body); font-size: 15px; font-weight: 900; text-transform: uppercase; background: var(--card); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 999px; padding: 1px 10px 1px 4px; margin-left: 12px; vertical-align: middle; }
  tr.next .nx svg { width: 22px; height: 22px; }
  tr.out td { color: var(--inksoft); }
  tr.out td.nm { text-decoration: line-through; text-decoration-thickness: 3px; }
  tr.out .ico.h svg path:first-child { fill: var(--stone); } tr.out .ico.h svg .cel { fill: #6c6357; }
  .side { display: flex; flex-direction: column; gap: 24px; }
  .nextbox { padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .nextbox .k { font-size: 18px; text-transform: uppercase; letter-spacing: .14em; font-weight: 900; color: var(--heather); display: flex; align-items: center; gap: 8px; }
  .nextbox .k svg { width: 30px; height: 30px; }
  .nextbox h2 { font-size: 64px; font-weight: 900; line-height: 1; }
  .nextbox .stats { display: flex; gap: 26px; align-items: center; font-size: 20px; color: var(--inksoft); }
  .nextbox .stats .ico { width: 84px; height: 84px; } .nextbox .stats .ico b { font-size: 28px; }
  .note { font-size: 18px; color: var(--inksoft); line-height: 1.4; padding: 0 10px; }
  .spacer { flex: 1; }
  .side .btn.go { min-height: 92px; font-size: 34px; }
  @media (max-height: 500px) {
    :root { --line: 2.5px; }
    .screen { grid-template-columns: 1fr 230px; gap: 10px; padding: 8px 10px; }
    .ledger { padding: 6px 14px; }
    .ledger h1 { font-size: 20px; gap: 8px; } .ledger h1 small { font-size: 11px; }
    table { margin-top: 2px; font-size: 13px; }
    th { font-size: 8px; padding: 1px 6px; border-bottom-width: 2px; }
    td { height: 37px; padding: 0 6px; border-bottom-width: 1.5px; }
    td.rk { width: 30px; font-size: 15px; }
    td.nm { font-size: 15px; }
    .ico { width: 30px; height: 30px; } .ico b { font-size: 11px; } .ico.h b { padding-bottom: 3px; } .ico.t b { font-size: 10px; padding-top: 2px; }
    .stamp { font-size: 9px; border-width: 2px; padding: 0 6px; }
    tr.next .nx { font-size: 9px; padding: 0 6px 0 2px; margin-left: 6px; border-width: 2px; } tr.next .nx svg { width: 13px; height: 13px; }
    .side { gap: 8px; }
    .nextbox { padding: 10px; gap: 4px; }
    .nextbox .k { font-size: 10px; } .nextbox .k svg { width: 16px; height: 16px; }
    .nextbox h2 { font-size: 28px; }
    .nextbox .stats { gap: 10px; font-size: 11px; } .nextbox .stats .ico { width: 42px; height: 42px; } .nextbox .stats .ico b { font-size: 15px; }
    .note { font-size: 10px; padding: 0 2px; }
    .side .btn { font-size: 16px; min-height: 48px; box-shadow: 0 3px 0 var(--ink); }
    .side .btn.go { min-height: 54px; font-size: 19px; }
  }
</style></head>
<body>
<div class="screen" id="app"></div>
<script src="data.js"></script><script src="ink.js"></script>
<script>
  const I = INK.ICON, L = FIX.lobby, nx = L.find(p => p.next_opponent);
  const ico = (k, v) => `<span class="ico ${k}">${k === 'h' ? I.heart : I.tier}<b>${v}</b></span>`;
  document.getElementById('app').innerHTML = `
  <section class="ink-box ledger">
    <h1>The clearing <small>Standings · Turn ${FIX.recruit.turn}</small></h1>
    <table><thead><tr><th></th><th>Player</th><th>Tier</th><th>Health</th><th>Last fight</th></tr></thead><tbody>
    ${L.map((p, i) => `<tr class="${p.name === 'You' ? 'you' : ''} ${p.next_opponent ? 'next' : ''} ${p.eliminated ? 'out' : ''}">
      <td class="rk">${p.eliminated ? '·' : i + 1}</td>
      <td class="nm">${p.name}${p.next_opponent ? `<span class="nx">${I.swords}Next</span>` : ''}</td>
      <td>${ico('t', p.tier)}</td><td>${ico('h', p.health)}</td>
      <td>${p.eliminated ? '<span class="stamp out">Out</span>' : `<span class="stamp ${p.last}">${p.last}</span>`}</td></tr>`).join('')}
    </tbody></table>
  </section>
  <aside class="side">
    <div class="ink-box nextbox"><div class="k">${I.swords}Next opponent</div><h2>${nx.name}</h2>
      <div class="stats">${ico('t', nx.tier)}<span>Tier</span>${ico('h', nx.health)}<span>Health</span></div>
      <div class="note">${nx.name} ${nx.last} their last fight.</div></div>
    <div class="spacer"></div>
    <button class="btn">Back to the shop</button>
    <button class="btn go">Ready</button>
  </aside>`;
</script>
</body></html>
