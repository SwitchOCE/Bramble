r) carry the big numbers.","Names and lore came last: lemmings making Kits, a fox census-taker, a learned lemming who proves they fall from the sky, the Edge cult, and the crossing of the Wide Water.","Rules notes: - A Kit that comes out through Onward counts as the dying unit's own summon, so it takes that slot. If the slot is taken (by an Ooze's Belly, say), it goes to the nearest empty slot.\n- A unit with Onward from two sources still brings out only one Kit.\n- Ole's Kits *die*, so Cantor sees them."],"changes":[],"declined":[]},"reviews":[{"id":"v1--combo","design_id":"great-migration--bottom-up-mech","v":1,"member":"combo","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"One pile with three jobs (fight fuel, missiles, stat currency) plus board-versus-Burrow placement and End of Turn order gives a real puzzle every turn, though the low-tier makers are plain.","distinct":"Token swarms are familiar, but an off-board reserve that is both fight HP and spendable currency, and that you protect by moving Kits onto the board, plays unlike any of today's tribes."},"verdict":"iterate","verdict_why":"\"Your front unit\" needs a definition before the Banner and Front Lemming can be read; the rest is ready.","points":[{"pid":"p1","uid":"u18","kind":"fix","text":"Brother Onward and The Front Lemming say \"your front unit\" without defining it: slot F1, or the first living front-row unit in reading order? Gaps never close, so the answer changes who carries the Banner."},{"pid":"p2","uid":null,"kind":"fix","text":"Herding Council, Ferrywife, Matron and Nester all fire at End of Turn and the order decides the whole Crossing build; state the reading-order rule on the cards' side, not only in risks."},{"pid":"p3","uid":"u04","kind":"idea","text":"Tunic Weaver only raises Kit size; let it choose +2 Attack or +2 Health on Kit size, so Ole and Bristle builds want different Weavers."},{"pid":"p4","uid":null,"kind":"idea","text":"The Tide wins rounds but surfaced Kits deal no hero damage; one late card that counts surfaced Kits that survive would give that line a finisher."},{"pid":"p5","uid":"u10","kind":"idea","text":"Identical Cousin copying Herald, Litter Keeper or Ferrywife is the tribe's best hidden combo; worth keeping exactly as broad as it is."}],"standouts":[{"uid":"u09","why":"Ole makes every Kit a missile-or-body choice, feeds Cantor at Start of Combat, and hits harder if Snow Hall Guard sits earlier in reading order."},{"uid":"u10","why":"Identical Cousin turns a free token into triple progress or a second engine piece, in any tribe."},{"uid":"u18","why":"Brother Onward's growing Banner meets Onward Kits at the front and a Mire or Hunker catcher behind, a three-card combo the board shape makes real."}],"weakest":[{"uid":"u04","why":"Tunic Weaver does one obvious job with no decision."},{"uid":"u01","why":"Yellowcoat Squeaker is a plain maker; fine as glue, nothing to discover."},{"uid":"u11","why":"Herding Council is a smaller Ferrywife doing the same job."}],"flags":[{"uid":"u19","kind":"watch","note":"With Herald, Litter Keeper and Matron the Burrow settles around 28, so Ferrywife spends about 14 a turn: +14/+14 to each real unit, double when golden."},{"uid":"u18","kind":"watch","note":"With Old Mother Lemen every Kit has Onward, so the Banner grows +4/+4 per Kit in a large Burrow; finite, but big."},{"uid":"u17","kind":"watch","note":"A deep Burrow of Onward Kits with Gerd's Bristle could stall low-Attack boards into ties."},{"uid":"u06","kind":"unclear","note":"\"Your front unit\" is undefined (F1 slot or first living front-row unit)."}]},{"id":"v1--climber","design_id":"great-migration--bottom-up-mech","v":1,"member":"climber","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"Every tier does its job and the Burrow gives a real spend-or-keep choice each turn, with three late builds that pull on one pile; Kit size growing only through Tunic Weaver makes the midgame Kits feel flat.","distinct":"An off-board reserve that is fight HP, currency and ammunition at once plays unlike any of today's tribes, though at heart it is still a token-swarm tribe."},"verdict":"iterate","verdict_why":"The tier shape is right, but 'your front unit' needs a definition and Kit size needs a second way to grow before the design settles.","points":[{"pid":"p1","uid":"u18","kind":"fix","text":"Brother Onward and The Front Lemming say 'your front unit' without defining it: slot F1, or the first living front-row unit in reading order? The Banner's path depends on it."},{"pid":"p2","uid":null,"kind":"idea","text":"Kit size grows only through Tunic Weaver's When played (plus Harvest Supper), so the size half of 'count times size' stalls after Tier 2. A Tier 3 or 4 card that raises Kit size each turn would give the midgame a growth curve to chase."},{"pid":"p3","uid":"u19","kind":"idea","text":"With Herald and Litter Keeper making about 10 Kits a turn, Ferrywife settles near a Burrow of 20 and spends 10 a turn, so every real unit gains +10/+10 a turn. That's a great capstone to chase; the owner may want to know the steady-state number."},{"pid":"p4","uid":"u11","kind":"idea","text":"Herding Council's +1/+1 for 2 Kits is far below Raft-builder's +2/+2 per Kit a tier lower. Letting it scale with Burrow size, or making it cheaper, would put it in the Crossing build."},{"pid":"p5","uid":"u10","kind":"idea","text":"Identical Cousin is the most interesting splash card, but golden Cousin turns one key unit into an instant triple. Consider limiting the golden to one copy so it stays a strong roll rather than a sure triple."}],"standouts":[{"uid":"u06","why":"The Front Lemming is a clean Tier 3 card that names the comp and turns the Burrow into fight HP straight away."},{"uid":"u15","why":"Cantor of the Edge turns a long Kit chain into one giant body, a big fight-only payoff that suits the tide fantasy."},{"uid":"u19","why":"Ferrywife of the Wide Water makes the Tide-or-Crossing choice concrete every turn and gives the late game its big permanent numbers."}],"weakest":[{"uid":"u11","why":"Herding Council is a low rate at Tier 4 and has a trigger condition that Ferrywife does better."},{"uid":"u03","why":"Tally is trivial inside the tribe (Kits fill the board for free) and generic outside it, so it asks no decision."},{"uid":"u09","why":"Ole the Learned does 1 to 3 damage per Kit at a typical Kit size, which is small for using up three Burrow Kits."}],"flags":[{"uid":"u19","kind":"watch","note":"Ferrywife with Herald and Litter Keeper reaches about +10/+10 a turn on every real unit, and a golden doubles that."},{"uid":"u15","kind":"watch","note":"A Burrow of 20 or more with Old Mother Lemen and Snow Hall Guard feeds the biggest unit 100+ stats in one fight; the golden doubles it."},{"uid":"u10","kind":"watch","note":"Golden Identical Cousin makes two copies of any adjacent unit, which is an instant triple and Discover, and can copy capstones like Brother Onward."},{"uid":"u17","kind":"watch","note":"Old Mother Lemen plus Gerd's Bristle Kits against low-Attack boards could produce long fights and many ties."},{"uid":"u18","kind":"unclear","note":"'Your front unit' is not defined (slot F1, or first living front-row unit), and the same goes for The Front Lemming."}]},{"id":"v1--reader","design_id":"great-migration--bottom-up-mech","v":1,"member":"reader","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"One pile of Kits with three pulls on it (fight HP, missiles, stats) gives a real choice every turn, and the board visibly swells into a tide.","distinct":"An off-board Burrow that refills each fight and a global Kit size are fresh; Kit makers themselves are familiar token-tribe fare."},"verdict":"iterate","verdict_why":"The tribe reads well overall, but \"front unit\" and Identical Cousin need a wording fix before players can read them for sure.","points":[{"pid":"p1","uid":"u06","kind":"fix","text":"\"Your front unit\" is undefined: F1 only, or your first living front-row unit in reading order? The Front Lemming and Brother Onward both hinge on it; define it once as a keyword-style term."},{"pid":"p2","uid":"u10","kind":"fix","text":"Identical Cousin doesn't say who picks the Kit and the unit when several are next to it, or what \"plain\" keeps. Say \"choose\" and \"base stats and text, no buffs\"."},{"pid":"p3","uid":null,"kind":"idea","text":"The Burrow is the whole tribe but lives off the board; show it as a count of tents on the hero portrait for both players, so the Tide's real size is readable before the fight."},{"pid":"p4","uid":"u03","kind":"idea","text":"Tally reads as a generic gold card; tie her to the Herd (\"gain 1 gold per 5 Kits in your Herd, at most 2\") so the census fox is actually counting lemmings."},{"pid":"p5","uid":"u19","kind":"idea","text":"Ferrywife's text could name the fantasy: \"Half your Burrow crosses the Wide Water\" reads the trade at a glance and lands the lake-crossing story."}],"standouts":[{"uid":"u09","why":"Ole the Learned makes Kits rain on the enemy: the sky-falling myth turned into a one-line, instantly readable effect."},{"uid":"u18","why":"Brother Onward's passing, growing Banner is \"whoever is in front leads\" played out on screen."},{"uid":"u13","why":"Gerd the Shouter: tiny Kits that hurt giants back, the tribe's picking-fights-with-giants theme in four words."}],"weakest":[{"uid":"u03","why":"Tally's full-board check has nothing to do with lemmings and works in any late comp."},{"uid":"u02","why":"Snowbed Nester is a plain token maker with no lemming flavour beyond its name."},{"uid":"u11","why":"Herding Council is a flat spend-for-stats card that overlaps Raft-builder and Ferrywife without a council twist."}],"flags":[{"uid":"u06","kind":"unclear","note":"\"Front unit\" is not defined."},{"uid":"u18","kind":"unclear","note":"\"New front unit\" has the same gap; with Onward it is probably the Kit in the same slot, but the text doesn't say."},{"uid":"u10","kind":"unclear","note":"Who chooses the Kit and the unit, and what a \"plain\" copy keeps."},{"uid":"u14","kind":"watch","note":"Herald with Litter Keeper doubles the Burrow each turn up to the caps; worth a sim with goldens."},{"uid":"u15","kind":"watch","note":"Golden Cantor on a long Onward chain with Old Mother Lemen could put very large in-fight stats on one unit."}]}],"ratings":{"fun":7.0,"distinct":7.0},"votes":{"settle":0,"iterate":3}},{"v":2,"summary":"Defined the front unit and the turn order as tribe rules, and made Identical Cousin say who chooses and what the copy keeps.\nHerding Council now grows Kit size, Tally counts the Herd for gold, and Tunic Weaver picks Attack or Health, so the midgame has more to grow and decide.","data":{"design_id":"great-migration--bottom-up-mech","v":2,"identity":{"tribe_name":"The Great Migration","mechanic":"**Core mechanic: the Herd and its Burrow.** The tribe makes **Kits**: identical little Lemming tokens. Kits that don't fit on the board wait in the **Burrow**, an off-board reserve shown on your hero. **Onward** turns that reserve into fight HP. Every card in the tribe either grows the Herd, makes Kits bigger, or spends Kits on something else.","keywords":[{"name":"Burrow","text":"a Kit made with no empty slot goes into your Burrow. While recruiting, you can move Kits between the board and the Burrow for free. A Kit that goes into the Burrow loses its own buffs and keeps only Kit size. Your **Herd** is all your Kits, on the board and in the Burrow."},{"name":"Onward","text":"*When this dies, a Kit from your Burrow takes its slot.* Each Burrow Kit can come out once a fight. Fights never cost you Kits: the Burrow is full again afterwards."},{"name":"Front unit","text":"your first living unit in reading order: F1 to F4, then B1 to B3. It is checked again after each death, once any Kit has come out in the dead unit's slot, so an Onward Kit at F1 is the new front unit."},{"name":"Turn order","text":"your Start of Turn and End of Turn effects go one unit at a time in reading order (F1 to F4, then B1 to B3). A unit later in that order sees what earlier ones did, so a Matron at F1 counts the Herd before a Council or Ferrywife behind her spends from it."}],"plays":"Early on, Kits are free bodies that let you attack first and fill gaps. By the midgame you're running a stockpile that has three jobs at once. On the board it fills slots and moves Kits out of reach of the cards that spend from the Burrow, while the whole Herd, board and Burrow, earns Tally's gold. In the Burrow it's the Onward chain's fuel and ammunition for Ole. Spent, it becomes permanent stats on your real units. The tribe's numbers puzzles all pull on that one pile. You grow **count** (Kit makers) or **size** (Kit size), and they multiply. Spending at a good rate leaves you short of fight fuel, and some cards trigger at Herd thresholds, so a Kit spent below the next threshold is free. The tribe owns no big bodies of its own, so its best boards borrow a few strong units from other tribes and wrap them in Kits."},"units":[{"uid":"u01","name":"Yellowcoat Squeaker","tier":1,"attack":1,"health":2,"text":"When played: make a Kit.","golden":"When played: make 2 Kits."},{"uid":"u02","name":"Snowbed Nester","tier":1,"attack":1,"health":2,"text":"End of Turn: make a Kit.","golden":"End of Turn: make 2 Kits."},{"uid":"u03","name":"Tally, the Census Fox","tier":2,"attack":1,"health":4,"text":"End of Turn: gain 1 gold for every 5 Kits in your Herd, at most 2.","golden":"End of Turn: gain 2 gold for every 5 Kits in your Herd, at most 4."},{"uid":"u04","name":"Tunic Weaver","tier":2,"attack":2,"health":3,"text":"When played: choose one: Kit size +2/+0, or Kit size +0/+2.","golden":"When played: choose one: Kit size +4/+0, or Kit size +0/+4."},{"uid":"u05","name":"Runway Digger","tier":2,"attack":2,"health":3,"text":"Onward. When played: give another unit Onward permanently.","golden":"…give two other units Onward permanently."},{"uid":"u06","name":"The Front Lemming","tier":3,"attack":2,"health":4,"text":"Your front unit has Onward, up to 3 times a fight.","golden":"…up to 6 times a fight."},{"uid":"u07","name":"Brood Matron","tier":3,"attack":2,"health":5,"text":"End of Turn: make a Kit for every 4 Kits in your Herd (at most 3).","golden":"…make 2 Kits for every 4 (at most 6)."},{"uid":"u08","name":"Raft-builder","tier":3,"attack":3,"health":4,"text":"When played: spend up to 3 Kits from your Burrow. Give a unit +2/+2 permanently for each.","golden":"…+4/+4 for each."},{"uid":"u09","name":"Ole the Learned","tier":3,"attack":3,"health":3,"text":"Start of Combat: 3 Kits from your Burrow fall on random enemies, each dealing damage equal to its Attack, then die. They can't come out again this fight.","golden":"…6 Kits fall."},{"uid":"u10","name":"Identical Cousin","tier":4,"attack":3,"health":4,"text":"When played: choose a Kit next to this and another unit next to this. The Kit becomes a Created copy of that unit, with its base stats and text but none of its buffs, and never golden.","golden":"When played: choose two Kits next to this and another unit next to this. Each Kit becomes a Created copy of that unit, with its base stats and text but none of its buffs, and never golden."},{"uid":"u11","name":"Herding Council","tier":4,"attack":4,"health":4,"text":"End of Turn: if your Burrow holds 2 or more Kits, spend 2 of them. Kit size +1/+1.","golden":"End of Turn: if your Burrow holds 2 or more Kits, spend 2 of them. Kit size +2/+2."},{"uid":"u12","name":"Litter Keeper","tier":4,"attack":3,"health":5,"text":"Whenever you make a Kit, make another in your Burrow, up to 4 extra a turn. (The extra ones don't trigger this.)","golden":"…make 2 more, up to 8 extra a turn."},{"uid":"u13","name":"Gerd the Shouter","tier":4,"attack":5,"health":4,"text":"Your Kits have Bristle 3.","golden":"Your Kits have Bristle 6."},{"uid":"u14","name":"Herald of the Lemenår","tier":5,"attack":4,"health":7,"text":"Start of Turn: make as many Kits as your Burrow holds, at most 6.","golden":"…at most 12."},{"uid":"u15","name":"Cantor of the Edge","tier":5,"attack":5,"health":6,"text":"Whenever one of your Kits dies, your biggest unit gains its stats for this fight.","golden":"…gains double its stats for this fight."},{"uid":"u16","name":"Snow Hall Guard","tier":5,"attack":6,"health":8,"text":"Onward. Start of Combat: your Kits gain +2/+2 for this fight, Burrow Kits included.","golden":"…+4/+4 for this fight."},{"uid":"u17","name":"Old Mother Lemen","tier":6,"attack":5,"health":9,"text":"Your Kits have +1/+1 and Onward.","golden":"Your Kits have +2/+2 and Onward."},{"uid":"u18","name":"Brother Onward","tier":6,"attack":7,"health":7,"text":"Start of Combat: your front unit takes the Banner: +4/+4 for this fight. Whenever the Banner's holder dies, the Banner grows by +4/+4 and passes to your new front unit.","golden":"Start of Combat: your front unit takes the Banner: +8/+8 for this fight. Whenever the Banner's holder dies, the Banner grows by +8/+8 and passes to your new front unit."},{"uid":"u19","name":"Ferrywife of the Wide Water","tier":6,"attack":6,"health":8,"text":"End of Turn: half the Kits in your Burrow (round down) cross the Wide Water and are spent. Your units that aren't Kits gain +1/+1 permanently for each.","golden":"End of Turn: half the Kits in your Burrow (round down) cross the Wide Water and are spent. Your units that aren't Kits gain +2/+2 permanently for each."}],"extras":[{"uid":"x01","kind":"token","name":"Kit","text":"a Lemming whose stats are your **Kit size**. Kit size starts at 1/1, and cards raise it permanently for every Kit you have, now and later, in the Burrow too. Kits are Created, sell for 0, aren't in the pool and never make triples. Harvest Supper's Migration bonus reaches them as well."}],"builds":[{"name":"The Endless Tide (Burrow as fight HP)","text":"Nester, Matron, Litter Keeper and Herald build a Burrow of 12–20 Kits, and Herding Council trades 2 of them a turn for a bigger Kit size. Front Lemming, then Old Mother Lemen, pour it out through Onward. Gerd makes every Kit an enemy hits cost it 3 Health, so a long chain of Kits wears down a board of giants. Cantor turns each Kit death into stats on your one big unit, which is often another tribe's unit with Cleave or Shield. The weakness: Kits that come out of the Burrow didn't start the fight, so a win deals little hero damage. The Tide wins rounds and hits lightly."},{"name":"The Crossing (Burrow as currency)","text":"Keep only three or four real units, ideally strong ones from another tribe, and feed them Kits. Raft-builder cashes Kits at a great early rate. Ferrywife drains half the Burrow every turn into permanent stats. The puzzle is the order of operations. Herald counts the Burrow at Start of Turn. Matron counts the Herd at End of Turn, so seat her before the Council and the Ferrywife in reading order (the Turn order rule). Tally counts the whole Herd, so every Kit spent costs a little gold. Any Kit you want to keep, move onto the board before End of Turn, where the spenders can't reach it. The Crossing and the Tide fight over the same pile, and most games settle on a ratio between them."},{"name":"The Banner (whoever is in front leads)","text":"Brother Onward, plus Front Lemming or Snow Hall Guard, at F1. Front Kits die quickly and pass a Banner that grows each time: after five deaths, the sixth front unit carries +24/+24. Put a Kit at F1 so the Banner grows early, then a sturdy unit behind it to catch it. A Bog Mire unit or a Hunker unit is ideal, because it has to be attacked and doesn't die."},{"name":"Kits for anyone (splash)","text":"Squeaker plus Identical Cousin is a two-card package for any comp. Cousin turns a spare Kit into a copy of your key unit, and Created copies count for triples, so two copies of a Fairy or an Ooze plus a Kit make a golden and a Discover."},{"name":"Mixing in a lobby","text":"- *Oozes:* Eat a Kit for a free permanent snack at Kit size, and a Belly can hold Kits. Nester is an endless pantry.\n- *Fairies:* a Ring slot with an Onward unit on it gives every Kit that steps in the Ring bonus. A ringed F1 under Front Lemming is a Kit factory with +4/+4 per Ring.\n- *Hedgerow:* tuck Kits into the Burrow so Pass reaches a real rightmost unit.\n- *Birds:* a Bird away South frees a slot for Kits.\n- *Bog:* a Mire unit at the front is the best Banner holder."}],"risks":["**Fight length and readability.** An Onward chain of 15 Kits and a passing Banner could make fights long and hard to follow. It needs a quick Kit-emerges animation and a Burrow count that ticks down on the hero.","**Quadratic growth.** Kit count times Kit size grows on two axes. Herald plus Litter Keeper is the worst pair, at up to 10 Kits a turn. Litter Keeper's cap and Herald's cap keep both linear, but the Tide with a golden Mother Lemen and a golden Cantor needs a simulation check. Herding Council now raises Kit size every turn too, so size grows each turn alongside count.","**Stalling.** Plain 1/1 Kits with Onward and Bristle could drag fights out against boards with low Attack. Ties deal nothing, so a Tide that can't kill gives a lot of ties.","**Identical Cousin as a generic card.** It works for any comp that owns a Kit. The guard is that Kits come only from Migration cards, but Squeaker is a Tier 1, so splashing is cheap. If Cousin turns up in every comp, require a *Lemming* next to it, or make the copy lose its text.","**Tally's gold.** Tally now counts the Herd, so she is gold only for Migration boards, but a Herd of 10 pays 2 gold a turn from Tier 2. Watch whether that is too fast.","**Hero damage.** The Tide's surfaced Kits add nothing to hero damage. That's a deliberate check, but the owner might feel it undercuts the fantasy.","**Hidden information.** The Burrow is off the board, so its count should show on the opponent's hero.","**Rules gaps.** Onward against Belly summons needs a ruling. (End of Turn order is now the tribe's Turn order rule.)"],"tier_check":[{"tier":1,"note":"Kit value is taken at Kit size 1/1 early and 2/2–3/3 in a good setup. Bodies are 4 / 6 / 7 / 8.5 / 12 / 14. Squeaker gives 3 stats plus a Kit, 5 once (1.25 bodies), a tempo Alleycat. Nester gives 2 stats a turn (0.5 bodies against 0.4), a little high on purpose, because Kits pay off only once the slot and Kit-size cards arrive."},{"tier":2,"note":"Tally's 1–2 gold a turn (a Herd of 5–10 Kits) is a third to two-thirds of a unit, at the top of the economy slot, on purpose: she rewards keeping Kits rather than spending them. Weaver's +2 to one stat is about 6 stats now plus every future Kit, about 1.3 bodies. Digger's two Onwards bring out about 4–6 stats in a fight, about 1 body. The bodies are slightly under 6 to pay for the text."},{"tier":3,"note":"Front Lemming brings out 3 Kits, 6–12 stats in a fight, 0.9–1.7 bodies. That's at or slightly over the 0.7–1.4 range, on purpose: it's the card that names the comp. Matron makes up to 3 Kits, 6 stats a turn (0.86 bodies). Raft-builder gives 12 stats once for 3 Kits, net about 1 body. Ole deals 3–9 damage in a fight (0.4–1.3 bodies)."},{"tier":4,"note":"Council spends 2 Kits for +1/+1 on every Kit, now and later: with 8–10 Kits that is 16–20 a turn less the 2 spent, about 1.5–2 bodies, a little high because Kit size is the axis the midgame lacked. Litter Keeper adds up to 4 Kits, 8–16 a turn, on target to slightly high. Gerd reflects 3 per Kit hit, about 15 a fight (1.8 bodies against 2). Cousin's value is a body of 8–14 plus text (1–1.6 bodies) plus triple progress. The triple progress is the real price, and the multiplier slot here is spent on copying rather than stats."},{"tier":5,"note":"Herald makes up to 6 Kits, 24–36 a turn (2–3 bodies against 2, top 5), capped so it can't run away. Cantor gives 8 Kit deaths at 4–6 stats, 32–48 in a fight (2.7–4 bodies against 4). Snow Hall Guard gives +4 to about 8 Kits plus a 14-stat body, about 3.8 bodies in a fight. It's the tempo piece that holds the line."},{"tier":6,"note":"Mother Lemen pours out a Burrow of 10 at 3/3 to 4/4, plus her aura, about 70–90 in a fight (5–6.4 bodies against 6). Brother Onward's Banner over 5 front deaths totals about 80 in a fight (5.7 bodies). Ferrywife at a steady Burrow of 8–12 gives 4–6 Kits a turn to six units, 48–72 a turn (3.4–5 bodies against 4). It eats the Tide's fuel, which is the trade. **Shape changes:** Tier 4 has a combat engine (Gerd) in place of a second buffer. This tribe's in-fight power comes through many small bodies, so an engine that pays per Kit hit belongs where the Burrow first gets big. Tier 6 has two capstones that compete (Tide against Crossing) plus the Banner payoff."}],"rationale":["Started with the slot puzzle: a full board pays (Tally), but you need an empty slot to play. Free filler bodies make that a decision every turn.","Filler that can't be sold at value needs somewhere to go, so overflow became a reserve: the Burrow.","A reserve is dull unless it's spent three ways at different rates. Raft-builder, Council and Ferrywife convert it to stats, Ole to damage, Onward to fight HP. That's the leftover-rate puzzle.","Onward emerged as what the death and reserve cards had in common, so it became the keyword. Fights never cost Kits, so the reserve stays a long-term number.","Kit size as a single standing stat (\"more recipients, not bigger numbers\") gave a second axis, count against size, that multiply.","Making the Burrow the only place spenders reach gave a positional trick: move a Kit onto the board to protect it.","Matron's thresholds (every 4) make some spending free, a deliberate small leftover puzzle.","Ole's Kits die and can't come out again: the same Kit is either a missile or a body, and it feeds Cantor.","Reading order already decides who attacks first, so \"the front\" became a role. Front Lemming at Tier 3, the growing Banner at Tier 6.","Created copies count for triples, so a Kit became raw material for a copy (Cousin). That's the main cross-tribe, use-it-for-something-else card.","Caps on every self-feeding Kit maker (Matron, Litter Keeper, Herald) keep count growth linear. Fight-only payoffs (Cantor, Banner) carry the big numbers.","Names and lore came last: lemmings making Kits, a fox census-taker, a learned lemming who proves they fall from the sky, the Edge cult, and the crossing of the Wide Water.","Rules notes: - A Kit that comes out through Onward counts as the dying unit's own summon, so it takes that slot. If the slot is taken (by an Ooze's Belly, say), it goes to the nearest empty slot.\n- A unit with Onward from two sources still brings out only one Kit.\n- Ole's Kits *die*, so Cantor sees them."],"changes":[{"uid":"identity","kind":"changed","what":"Added two rules: Front unit (first living unit in reading order) and Turn order (turn effects go in reading order).","why":"Front Lemming, Brother Onward and the End of Turn spenders depended on undefined terms.","from":["v1--combo#p1","v1--climber#p1","v1--reader#p1","v1--combo#p2"]},{"uid":"u03","kind":"changed","what":"Tally gains 1 gold per 5 Kits in the Herd, at most 2, instead of paying for a full board.","why":"The census fox now counts lemmings, and spending Kits costs gold: a real choice.","from":["v1--reader#p4"]},{"uid":"u04","kind":"changed","what":"Tunic Weaver chooses Kit size +2 Attack or +2 Health instead of +1/+1.","why":"Gives the card a decision: Ole and Cantor want Attack, Bristle and Onward walls want Health.","from":["v1--combo#p3"]},{"uid":"u10","kind":"changed","what":"Says you choose the Kit and the unit, and that the copy has base stats and text, no buffs, never golden.","why":"Who picks and what 'plain' keeps were unclear.","from":["v1--reader#p2"]},{"uid":"u11","kind":"changed","what":"Herding Council now spends 2 Burrow Kits for Kit size +1/+1, instead of +1/+1 to non-Kits.","why":"It overlapped Raft-builder and Ferrywife at a low rate; Kit size had no midgame growth.","from":["v1--climber#p2","v1--climber#p4"]},{"uid":"u18","kind":"changed","what":"Banner now passes to 'your new front unit' under the new Front unit rule; wording tidied.","why":"Who carries the Banner after a death was undefined.","from":["v1--combo#p1","v1--climber#p1"]},{"uid":"u19","kind":"changed","what":"Ferrywife's text now says half your Burrow crosses the Wide Water; same effect.","why":"Reads the trade at a glance and lands the lake-crossing story.","from":["v1--reader#p5"]}],"declined":[]},"reviews":[{"id":"v2--combo","design_id":"great-migration--bottom-up-mech","v":2,"member":"combo","ratings":{"fun":7,"distinct":6},"ratings_why":{"fun":"One pile with three uses (fight HP, missiles, stats), plus reading-order puzzles like Matron before Ferrywife, gives a real decision every turn.","distinct":"The off-board Burrow and the passing Banner are fresh, but the core of count times size tokens that come back is familiar from token tribes."},"verdict":"iterate","verdict_why":"The engine is good; two rules texts (Cantor's dead-Kit stats, Front Lemming stacking with Onward) need a wording pass, nothing more.","points":[{"pid":"p1","uid":"u15","kind":"fix","text":"Cantor of the Edge says the biggest unit gains a dead Kit's stats, but a Kit killed in combat has 0 or less Health. Say it gains Kit size, or the Kit's Attack and starting Health."},{"pid":"p2","uid":"u06","kind":"fix","text":"With Old Mother Lemen, a front Kit already has Onward. Say whether The Front Lemming's 3 uses are spent then, since the rules say two Onwards bring out one Kit."},{"pid":"p3","uid":"u10","kind":"idea","text":"Identical Cousin copying Herald of the Lemenår makes two Heralds in reading order, and the second counts the Burrow the first just filled. List that and the double Mother Lemen aura as builds: they are the tribe's best hidden combos."},{"pid":"p4","uid":"u13","kind":"idea","text":"Gerd the Shouter only does one thing. Let Ole's falling Kits deal their Bristle too, so Gerd and Ole share a build."},{"pid":"p5","uid":"u16","kind":"idea","text":"Snow Hall Guard seated before Ole the Learned in reading order makes bigger falling Kits. Say so in the builds, because it makes seating a real choice at Start of Combat as well as End of Turn."}],"standouts":[{"uid":"u10","why":"Turns a token into any unit, feeds triples across tribes, and opens copies of Herald, Mother Lemen or Tally."},{"uid":"u18","why":"The growing Banner rewards seating a Kit at F1 and a Mire or Hunker unit behind it, a real build around one card."},{"uid":"u09","why":"Ole makes each Kit a choice between missile and body, and the deaths feed Cantor."}],"weakest":[{"uid":"u01","why":"A plain body plus a Kit; it does exactly what it says and nothing else."},{"uid":"u13","why":"A flat aura that only matters when Kits get hit; it never changes how you play."},{"uid":"u05","why":"Onward on one unit is modest next to Front Lemming and Mother Lemen, which do it better."}],"flags":[{"uid":"u14","kind":"watch","note":"The Burrow has no size limit, so Herald plus Litter Keeper grows a pile that Mother Lemen turns into very long fights."},{"uid":"u10","kind":"watch","note":"Copying Old Mother Lemen or Herald doubles the tribe's strongest engines in one play."},{"uid":"u15","kind":"unclear","note":"What 'its stats' means for a Kit that died from damage."},{"uid":"u06","kind":"unclear","note":"Whether a use is spent on a front unit that already has Onward."}]},{"id":"v2--climber","design_id":"great-migration--bottom-up-mech","v":2,"member":"climber","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"Every tier does its job and the growth has a good shape: free bodies early, count against size in the midgame, then three capstones that cash the pile in different ways.","distinct":"An off-board Burrow that is fight HP, currency and ammo at once, plus a reading-order spending puzzle, plays unlike any of today's tribes, though the Kits themselves are familiar tokens."},"verdict":"iterate","verdict_why":"One real rules gap (two Banners) to close, and the Burrow's size limit is worth deciding before it settles.","points":[{"pid":"p1","uid":"u18","kind":"fix","text":"Two Brother Onwards (easy with Identical Cousin) give two Banners, and the text says 'the Banner' as if there were one. Say whether they stack on one holder, pass separately, or only one Banner exists."},{"pid":"p2","uid":null,"kind":"idea","text":"The Burrow has no limit, so Herald, Matron and Litter Keeper can stock 40+ Kits by the late game, and Old Mother Lemen pours them all out. A cap that rises with tier would bound fight length and sharpen the spend-or-keep choice."},{"pid":"p3","uid":"u10","kind":"idea","text":"Identical Cousin makes Created copies that count for triples, so one bought Tier 6 unit plus two Cousins is a cheap golden capstone and a Discover. Hot and fun; the owner may want a Lemming-only target later."},{"pid":"p4","uid":"u05","kind":"idea","text":"Runway Digger is one Onward on one unit, which fades once Front Lemming and Mother Lemen arrive. Letting it also hand Onward to every Kit played this turn, or grow the Burrow by one, would keep it relevant."},{"pid":"p5","uid":"u16","kind":"idea","text":"Snow Hall Guard is a flat +2/+2 to Kits for the fight, the most generic card here. Tying it to the Burrow count, such as +1/+1 per 4 Burrow Kits, would fit the tribe's thresholds."}],"standouts":[{"uid":"u11","why":"Herding Council trades count for size every turn, the tribe's core puzzle in one card, and moving Kits to the board to dodge it is a real decision."},{"uid":"u19","why":"Ferrywife halves the Burrow into permanent stats, fighting Tally, Herald and the Tide over the same pile: a strong capstone with an ordering puzzle."},{"uid":"u18","why":"Brother Onward's passing, growing Banner is the 'whoever is in front leads' theme as a mechanic, and it rewards placing a Kit before a sturdy holder."}],"weakest":[{"uid":"u05","why":"One Onward on one unit is a small effect that later cards do better."},{"uid":"u16","why":"A flat in-fight Kit buff with no hook into the Burrow or thresholds."},{"uid":"u09","why":"Three Kits at Kit size 1-3 Attack is low damage at Tier 3 unless Tunic Weaver went Attack."}],"flags":[{"uid":"u17","kind":"watch","note":"With no Burrow limit, Old Mother Lemen turns the whole Herd into fight HP; a Burrow of 40 at 4/4 with Gerd's Bristle could make long, stalling fights."},{"uid":"u15","kind":"watch","note":"Cantor gives the biggest unit every dead Kit's stats; with a big Burrow that is +100 or more in a fight. In-fight only, so fine, but worth the owner's eye with a golden."},{"uid":"u10","kind":"watch","note":"Cheap triples of Tier 5 and 6 units, including other tribes', through Created copies."},{"uid":"u14","kind":"watch","note":"Herald plus Litter Keeper and Matron adds about 13 Kits a turn with no Burrow ceiling; linear, but it piles up fast."},{"uid":"u18","kind":"unclear","note":"What two Banners do is not stated."}]},{"id":"v2--reader","design_id":"great-migration--bottom-up-mech","v":2,"member":"reader","ratings":{"fun":7,"distinct":6},"ratings_why":{"fun":"One pile of Kits pulled three ways (fight fuel, stats, missiles) gives a real choice every turn, and the passing Banner is a great moment to watch.","distinct":"The Burrow-as-currency and front-unit Banner are fresh, but the core of it reads like a familiar token-and-reborn tribe."},"verdict":"settle","verdict_why":"The v1 reading gaps (front unit, turn order, Cousin, Tally) are closed; what's left is taste, not anything broken or unreadable.","points":[{"pid":"p1","uid":null,"kind":"idea","text":"Boom and crash, the seed's core theme, is only implied by Herald doubling the Burrow and Ferrywife halving it. Name or reward that rhythm on one card so the lemming year is felt."},{"pid":"p2","uid":null,"kind":"idea","text":"Most of the Herd lives as a number on the hero, so the tide of bodies is mostly invisible while recruiting. Show Burrow Kits queued behind the board, not just a counter."},{"pid":"p3","uid":"u15","kind":"idea","text":"Cantor of the Edge reads better as \"gains that Kit's stats\" and should say Kits can't be the biggest unit it picks."},{"pid":"p4","uid":"u10","kind":"idea","text":"Identical Cousin is the longest text in the tribe for a simple effect; something like \"A Kit next to this becomes a plain Created copy of another unit next to this\" reads at a glance."},{"pid":"p5","uid":"u05","kind":"idea","text":"Runway Digger is a plain keyword-giver; a Kit that comes out of a dug runway could gain something, so digging has its own story."}],"standouts":[{"uid":"u18","why":"Brother Onward's Banner passing to each new front unit is 'whoever is in front leads' in one readable line, and it grows on screen."},{"uid":"u09","why":"Ole the Learned literally rains lemmings on the enemy; the lore joke and the effect are the same thing."},{"uid":"u19","why":"Ferrywife of the Wide Water: half the Burrow crosses and the survivors grow, a clear trade that lands the lake story."}],"weakest":[{"uid":"u16","why":"Snow Hall Guard is a generic stat aura with Onward attached; nothing in it says lemming."},{"uid":"u05","why":"Runway Digger just hands out a keyword; fine glue, no moment."},{"uid":"u10","why":"Identical Cousin is wordy, positional and mostly a splash triple tool rather than a Migration card."}],"flags":[{"uid":"u14","kind":"watch","note":"Herald with Litter Keeper and Herding Council grows count and size together every turn; the caps hold count but size keeps climbing."},{"uid":"u17","kind":"watch","note":"Old Mother Lemen with Gerd's Bristle can make a long Kit wall that low-Attack boards can't clear, giving many ties."}]}],"ratings":{"fun":7.0,"distinct":6.3},"votes":{"settle":1,"iterate":2}}]},{"id":"great-migration--one-constraint","key":"great-migration-e3aa","seed":"great-migration","route":"one-constraint","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"great-migration--top ,"key":"lekking-knights-92e0","seed":"lekking-knights","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"moth-apothecaries--borrow-twist","key":"moth-apothecaries-82c9","seed":"moth-apothecaries","route":"borrow-twist","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"moth-apothecaries--bottom-up-mech","key":"moth-apothecaries-eba8","seed":"moth-apothecaries","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"moth-apothecaries--surgical","key":"moth-apothecaries-9015","seed":"moth-apothecaries","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rat-king--borrow-twist","key":"rat-king-83c6","seed":"rat-king","route":"borrow-twist","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rat-king--surgical","key":"rat-king-dcd0","seed":"rat-king","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rat-king--top-down-mech","key":"rat-king-759f","seed":"rat-king","route":"top-down-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"reed-runners--borrow-twist","key":"reed-runners-b98c","seed":"reed-runners","route":"borrow-twist","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"reed-runners--bottom-up-mech","key":"reed-runners-e957","seed":"reed-runners","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"reed-runners--surgical","key":"reed-runners-b548","seed":"reed-runners","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rot-guild--bottom-up-mech","key":"rot-guild-f85e","seed":"rot-guild","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rot-guild--player-story","key":"rot-guild-343d","seed":"rot-guild","route":"player-story","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rot-guild--top-down-flavour","key":"rot-guild-9b1b","seed":"rot-guild","route":"top-down-flavour","tribe_name":"The Rot Guild","status":"settled","final_version":1,"stop_reason":"2 of 3 reviewers said it's in a good spot","md":"# The Rot Guild — v1\n\n## 1. Identity\n\n**The fantasy.** You run the woodland's funeral parlour. Every unit you lose, in a fight or by your own hand, is laid down into the soil, and the next morning the Guild's mushrooms come up fat on it. The solemn toadstools do the burying while you recruit; the puffballs burst laughing in the fight. Grief at the graveside, a feast by the next rain.\n\n**Compost** (tribe tracker, shown under the board). Each time a friendly unit dies, in a fight or Laid to Rest while recruiting, your Compost gains its **printed** Attack and Health (card stats, doubled if golden; buffs don't count). At Start of Turn, after every Fruit has resolved, the Compost empties: mourning lasts one rain.\n\n**Fruit** (keyword). Start of Turn: this permanently gains a quarter of your Compost. A unit can have Fruit more than once, and each one Fruits separately. Golden cards with Fruit have it twice.\n\n**Lay to Rest** (action). Destroy a friendly unit while recruiting. It counts as dying: its \"When this dies\" text happens now, on the recruiting board, and it goes into the Compost.\n\n**How it plays.** The Guild's units are thin and its fights are often lost early, but nothing is wasted. Deaths in the fight and burials in the shop fill one shared pile, and every Fruit unit drinks a quarter of it overnight. So the pile is your engine and Fruit is your carry count. The tribe's cards pull on three levers: **more dying** (Spores, Amanita, Old Fingers), **bigger or doubled entries** (Inkcap, Stinkhorn, White-Rot, Three Rains) and **more Fruit** (Sealbearer, Rootbinder, Bootlace). Because the Compost counts any friendly unit and Fruit can go on any unit, the Guild is as happy feeding another tribe's carry as its own. Placement matters twice: Amanita and Sexton care who is beside whom, and Bootlace's network needs an unbroken touching run, which your own burials keep breaking.\n\n## 2. The 19 units\n\n| Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|\n| Stumpwick Puffling | 1 | 2/1 | When this dies: summon a Spore. | 4/2. Summon two Spores. |\n| Candlesnuff Apprentice | 1 | 1/3 | Fruit. | 2/6. Fruit twice. |\n| Black-Glove Undertaker | 2 | 2/3 | When played: you may Lay to Rest another friendly unit. If you do, gain 1 gold. | 4/6. Gain 2 gold. |\n| Moss-Bier Bearer | 2 | 1/4 | Each time a friendly unit next to this dies in a fight, it permanently gains +1/+1. | 2/8. +2/+2. |\n| Hired Mute | 2 | 3/3 | Start of Turn: if 3 or more friendly units died since your last turn, gain 1 gold. | 6/6. Gain 2 gold. |\n| Warden Amanita | 3 | 3/4 | Bristle 2. Start of Combat: destroy the friendly units beside this. | 6/8. Bristle 4. |\n| Guild Sealbearer | 3 | 3/3 | When played: give another friendly unit Fruit. | 6/6. Give two other friendly units Fruit. |\n| Raincatcher Puffball | 3 | 1/6 | Each time this takes damage, summon a Spore. Three times a fight. | 2/12. Summon two Spores each time. |\n| Litter Acre Sexton | 3 | 2/5 | Each time a friendly unit is Laid to Rest, the units that were beside it permanently gain +1/+1. | 4/10. +2/+2. |\n| Clerk Inkcap | 4 | 2/6 | Each time another friendly unit dies in a fight, your Compost gains its printed stats again, and this loses 1 Health. | 4/12. Gains them twice more; this loses 2 Health. |\n| Rootbinder | 4 | 4/5 | Your units of other tribes beside this have Fruit. | 8/10. They have Fruit twice. |\n| White-Rot Renderer | 4 | 3/5 | When played: you may Lay to Rest another friendly unit. Your Compost gains all its stats, not only its printed ones. | 6/10. Up to two other friendly units. |\n| Stinkhorn, the Herald | 4 | 4/4 | Each time an enemy unit dies, your Compost gains half its printed stats. | 8/8. All its printed stats. |\n| Stumpwick Grandsire | 5 | 4/8 | When this dies: fill your empty slots with Spores, each with a quarter of this unit's stats. | 8/16. Half of this unit's stats. |\n| Mourner of Three Rains | 5 | 5/7 | At Start of Turn, your Compost keeps half of itself instead of emptying. (Doesn't stack.) | 10/14. Keeps all of itself. |\n| Ludwig, the Lodger | 5 | 5/7 | Fruit. Each time another friendly unit is Laid to Rest, this permanently gains its stats. Can't be Laid to Rest. | 10/14. Fruit twice. Gains double its stats. |\n| Grandmother Bootlace | 6 | 6/9 | Fruit. Your other units in an unbroken touching run with this have Fruit. | 12/18. Fruit twice; they have Fruit twice. |\n| Old Fingers | 6 | 7/7 | Each time another friendly unit dies in a fight, summon a copy of it with its printed stats. Six times a fight. Copies don't trigger this. | 14/14. Copies keep all its stats. |\n| Bellows Puffwell | 6 | 8/8 | When this dies in a fight: give each other friendly unit a quarter of your Compost for this fight. | 16/16. Half of your Compost. |\n\n**Token.** **Spore**: 1/1 Rot Guild, Created. Its printed stats are always 1/1, whatever it was summoned with, so a big Spore still composts as 1/1.\n\n**Spell.** **Graveside Service** (1 gold): Lay to Rest a friendly unit.\n\n**Rule notes.** Laid to Rest units summon onto the recruiting board and those summons stay (Created, sell for 0). Inkcap's Health loss is in-fight only. Old Fingers' copy goes to the nearest empty slot, so a Puffling's own Spore takes the Puffling's slot first and the copy goes elsewhere, or nowhere if the board is full.\n\n## 3. Builds\n\n**The Wake (shop burials).** Undertaker, Sexton, Renderer, Ludwig, Graveside Service; Puffling and Spores as fodder. Every turn you bury one or two cheap units in the middle of your board: Sexton buffs both neighbours, Ludwig eats the body whole, and the Compost holds it for tomorrow. A Puffling buried leaves a Spore to bury next turn; Hired Mute pays for the busy graveyard. Renderer buries a pumped unit at full value, which is how you move a big buff from a dying carry onto every Fruit unit. Its payoff is Ludwig plus Mourner of Three Rains, which keeps half the pile so a burial pays out for several turns.\n\n**The Burst (puffballs dying in the fight).** Puffling, Raincatcher, Amanita, Grandsire, Inkcap, Old Fingers, Puffwell. You want as many deaths per fight as possible: Raincatcher splits into Spores as it's hit, Amanita kills her neighbours at Start of Combat so their death text fires before a blow is struck, Old Fingers digs everything up once more, and Inkcap writes each death into the Register twice. Any one Fruit carry turns all that into permanent stats. Puffwell is the in-fight cash-out: give him Damage Reduction or put him in the back row so he dies late, when the pile is biggest.\n\n**The Network (Fruit everywhere).** Apprentice, Sealbearer, Rootbinder, Bootlace. Fewer deaths, more mouths: Bootlace turns a full touching run into seven Fruit units. The tension is that the Wake's burials leave gaps that cut the run, so you bury from the ends of the zigzag (F1, F4) or refill the gap before Start of Turn.\n\n**The Lodger (the Guild as another tribe's undertaker).** Rootbinder and Sealbearer give Fruit to a carry from another tribe, and Stinkhorn fills the Compost from enemy deaths, so a board that wins fights still feeds. With other tribes:\n- **Oozes:** an Ooze Eating your own unit is a friendly death, so it goes into the Compost. Put an Ooze with a full Belly beside Amanita and it opens at Start of Combat. A buried Ooze opens in the shop.\n- **Hedgerow:** Fruit on your rightmost unit stacks with Pass, so one unit takes both streams.\n- **Fairies:** a Fruit unit on a Ring grows from both sources. Note that Shy units leave, which is not death.\n- **Bog:** a Mired Raincatcher is forced to take hits, so it makes its three Spores reliably.\n- **Hunters:** Pack units die beside their leader, which feeds Moss-Bier's permanent buffs.\n- **Birds:** a Bird sold to Fly South doesn't count; a Bird Laid to Rest never comes home. Nest Eggs compost as 0/1.\n\n**Off-label plays Johnny will look for:**\n- Seal Fruit onto Inkcap: his Health grows every turn, so he records more deaths each fight.\n- Seal Fruit onto Grandsire: his death Spores get bigger.\n- Bury a pumped Grandsire in the shop to fill your board with permanent quarter-size Spores.\n- Renderer a big unit, then have Amanita kill Puffwell at Start of Combat: the whole board feasts on that burial for the fight.\n- Amanita beside Old Fingers' targets: they die at Start of Combat, come back at printed stats, and their death text fires twice.\n\n## 4. Risks and holes\n\n- **Losing feeds you.** More deaths means more Compost, so a weak board snowballs into a stronger one. That is a comeback lever, and Stinkhorn rewards winning too, but the tribe may have little reason to win early fights. Watch whether early hero damage kills Guild players before the pile matters.\n- **Fruit stacking.** Two Sealbearers and a Bootlace on one unit give Fruit ×4 on a single carry. That's intended as a high roll, but it may need a cap (\"at most three Fruit\") if it dominates.\n- **Golden Mourner.** Keeping the whole pile makes it grow every turn, and every Fruit unit gains a quarter of a growing pile each turn, so growth is quadratic. It isn't self-feeding (printed stats only), but it's the likeliest runaway. The fallback is \"keeps three quarters\".\n- **Visibility.** The Compost pile, its sources, what's printed versus buffed, and the per-death doubling from Inkcap all need clear UI or the tribe reads as noise.\n- **Old Fingers with death chains.** Copies re-fire death text, so Spores from Puffling and Grandsire summon again. Six times a fight limits it, but a golden copy that keeps all its stats is very large.\n- **Rootbinder is dead text on a Guild-only board.** That is intended, to pull the Guild into mixed boards, but it may feel bad in a lobby where the other tribes are weak.\n- **Hired Mute triggers too easily** once Spores are around. Raise the threshold to 4 if it's a free gold.\n- **Start of Combat order.** Amanita resolves in reading order, so neighbours with their own Start of Combat may or may not have fired. Players need to see that.\n- **Undecided rule:** back-row access isn't settled, and Puffwell's \"die late\" plan leans on the back row being safe.\n\n## 5. Tier check\n\nEstimates are for a good mid-game board: about 5 friendly deaths a fight, printed stats about 6 each, so roughly 30 Compost a turn and about 7 per Fruit.\n\n- **Tier 1:** Puffling is a normal two-body tempo unit (5 stats). The Apprentice gives about 3 a turn early, which is near the guide, but about 7 by mid-game, nearly 2 bodies against a 0.4 target. **Broken on purpose:** it's the seed the whole tribe grows from, its 1/3 body is small, and it's worthless without deaths. If it dominates, it fruits only while you have another Rot Guild unit.\n- **Tier 2:** Moss-Bier gives 4–6 permanent stats a turn (about 1 body, inside 0.3–1). Undertaker turns a sell into a burial at the same 1 gold. Mute gives 1 gold a turn on a condition, which is in line with economy pieces.\n- **Tier 3:** Sealbearer adds about 7 a turn for the rest of the game (about 1 body against 0.8). Raincatcher makes about 6 in-fight stats plus Compost (inside 0.7–1.4). Sexton gives 4–8 a turn. Amanita is negative on her own and pays only through death text; that's her job as the enabler that names the comp.\n- **Tier 4:** Rootbinder gives about 14 a turn and Stinkhorn about 15 with three Fruit units (both 1.6–1.8 bodies against 1.3). Inkcap doubles fight Compost, about 18 a turn across three Fruit units. That's above target, as a T4 multiplier is allowed to be. Renderer is a one-off redistribution, not new stats.\n- **Tier 5:** Ludwig gives 20–30 a turn (about 2 bodies). Mourner roughly doubles every Fruit, which makes it the tier's multiplier. Grandsire is weak at printed size (1/2 Spores) but gives 30–70 in-fight once buffed, around the 4-body target; it is meant to be fed.\n- **Tier 6:** Bootlace with a full run gives seven Fruit, about 105 a turn (7.5 bodies, under the top ~10). With Inkcap, Stinkhorn and Mourner assembled it reaches about twice the top. **Broken on purpose:** it's the capstone the comp is built for, and its golden ceiling is ×2. Old Fingers gives about 60 in-fight plus re-fired death text (about 5–6 bodies). Puffwell gives 40–120 in-fight depending on when he dies.\n\n## 6. Design rationale\n\n1. Took \"death as harvest\" as the core: deaths become a shared pile of stats, because the seed's play line is \"lose your own on purpose\".\n2. The pile counts **printed** stats only, so growth never feeds its own source: the runaway check passes by construction.\n3. \"Growth overnight\": the pile pays out at Start of Turn and then empties, so every burial is a delayed reward.\n4. \"The quiet network\": the pile belongs to the board, not a unit, and Fruit lets any unit drink from it, which gives Johnny cross-tribe hooks for free.\n5. \"The undertaker caused the death\": Lay to Rest is the shop-side sacrifice, and Amanita is the fight-side one.\n6. \"Mourning and mirth\": toadstools work in the shop (burial, registers, seals) and puffballs work in the fight (bursting into Spores), two halves that feed one pile.\n7. Spores compost as 1/1 whatever their size, so Grandsire's big Spores can't loop.\n8. The seed's notable figures took the high tiers by their stories: Inkcap writes deaths twice, Bootlace is the network, Old Fingers digs up, Puffwell is the feast, Ludwig the lodger eats the dead wood.\n9. The \"one rain or three\" dispute became Mourner of Three Rains, the T5 multiplier that keeps the pile.\n10. \"Giving back what the wood gave\": Rootbinder (mycorrhiza) gives Fruit to other tribes, so the Guild has a reason to be splashed into any lobby.\n11. Stinkhorn composts enemy deaths, so the tribe isn't only rewarded for losing (the Spike guard).\n12. Bootlace's run plus gaps from burials: put a spatial cost on the strongest payoff, so Johnny's boards need arranging, not just collecting.\n","versions":[{"v":1,"summary":"Mushroom undertakers: every friendly death, in a fight or buried in the shop, adds its printed stats to a shared Compost pile.\nUnits with Fruit each take a quarter of the pile at the start of every turn, so deaths become permanent growth.","data":{"design_id":"rot-guild--top-down-flavour","v":1,"identity":{"tribe_name":"The Rot Guild","mechanic":"**Compost** (tribe tracker, shown under the board). Each time a friendly unit dies, in a fight or Laid to Rest while recruiting, your Compost gains its **printed** Attack and Health (card stats, doubled if golden; buffs don't count). At Start of Turn, after every Fruit has resolved, the Compost empties: mourning lasts one rain.\n\n**Fruit** (keyword). Start of Turn: this permanently gains a quarter of your Compost. A unit can have Fruit more than once, and each one Fruits separately. Golden cards with Fruit have it twice.","keywords":[{"name":"Compost","text":"(tribe tracker, shown under the board). Each time a friendly unit dies, in a fight or Laid to Rest while recruiting, your Compost gains its **printed** Attack and Health (card stats, doubled if golden; buffs don't count). At Start of Turn, after every Fruit has resolved, the Compost empties: mourning lasts one rain."},{"name":"Fruit","text":"(keyword). Start of Turn: this permanently gains a quarter of your Compost. A unit can have Fruit more than once, and each one Fruits separately. Golden cards with Fruit have it twice."},{"name":"Lay to Rest","text":"(action). Destroy a friendly unit while recruiting. It counts as dying: its \"When this dies\" text happens now, on the recruiting board, and it goes into the Compost."}],"plays":"The Guild's units are thin and its fights are often lost early, but nothing is wasted. Deaths in the fight and burials in the shop fill one shared pile, and every Fruit unit drinks a quarter of it overnight. So the pile is your engine and Fruit is your carry count. The tribe's cards pull on three levers: **more dying** (Spores, Amanita, Old Fingers), **bigger or doubled entries** (Inkcap, Stinkhorn, White-Rot, Three Rains) and **more Fruit** (Sealbearer, Rootbinder, Bootlace). Because the Compost counts any friendly unit and Fruit can go on any unit, the Guild is as happy feeding another tribe's carry as its own. Placement matters twice: Amanita and Sexton care who is beside whom, and Bootlace's network needs an unbroken touching run, which your own burials keep breaking."},"units":[{"uid":"u01","name":"Stumpwick Puffling","tier":1,"attack":2,"health":1,"text":"When this dies: summon a Spore.","golden":"4/2. Summon two Spores."},{"uid":"u02","name":"Candlesnuff Apprentice","tier":1,"attack":1,"health":3,"text":"Fruit.","golden":"2/6. Fruit twice."},{"uid":"u03","name":"Black-Glove Undertaker","tier":2,"attack":2,"health":3,"text":"When played: you may Lay to Rest another friendly unit. If you do, gain 1 gold.","golden":"4/6. Gain 2 gold."},{"uid":"u04","name":"Moss-Bier Bearer","tier":2,"attack":1,"health":4,"text":"Each time a friendly unit next to this dies in a fight, it permanently gains +1/+1.","golden":"2/8. +2/+2."},{"uid":"u05","name":"Hired Mute","tier":2,"attack":3,"health":3,"text":"Start of Turn: if 3 or more friendly units died since your last turn, gain 1 gold.","golden":"6/6. Gain 2 gold."},{"uid":"u06","name":"Warden Amanita","tier":3,"attack":3,"health":4,"text":"Bristle 2. Start of Combat: destroy the friendly units beside this.","golden":"6/8. Bristle 4."},{"uid":"u07","name":"Guild Sealbearer","tier":3,"attack":3,"health":3,"text":"When played: give another friendly unit Fruit.","golden":"6/6. Give two other friendly units Fruit."},{"uid":"u08","name":"Raincatcher Puffball","tier":3,"attack":1,"health":6,"text":"Each time this takes damage, summon a Spore. Three times a fight.","golden":"2/12. Summon two Spores each time."},{"uid":"u09","name":"Litter Acre Sexton","tier":3,"attack":2,"health":5,"text":"Each time a friendly unit is Laid to Rest, the units that were beside it permanently gain +1/+1.","golden":"4/10. +2/+2."},{"uid":"u10","name":"Clerk Inkcap","tier":4,"attack":2,"health":6,"text":"Each time another friendly unit dies in a fight, your Compost gains its printed stats again, and this loses 1 Health.","golden":"4/12. Gains them twice more; this loses 2 Health."},{"uid":"u11","name":"Rootbinder","tier":4,"attack":4,"health":5,"text":"Your units of other tribes beside this have Fruit.","golden":"8/10. They have Fruit twice."},{"uid":"u12","name":"White-Rot Renderer","tier":4,"attack":3,"health":5,"text":"When played: you may Lay to Rest another friendly unit. Your Compost gains all its stats, not only its printed ones.","golden":"6/10. Up to two other friendly units."},{"uid":"u13","name":"Stinkhorn, the Herald","tier":4,"attack":4,"health":4,"text":"Each time an enemy unit dies, your Compost gains half its printed stats.","golden":"8/8. All its printed stats."},{"uid":"u14","name":"Stumpwick Grandsire","tier":5,"attack":4,"health":8,"text":"When this dies: fill your empty slots with Spores, each with a quarter of this unit's stats.","golden":"8/16. Half of this unit's stats."},{"uid":"u15","name":"Mourner of Three Rains","tier":5,"attack":5,"health":7,"text":"At Start of Turn, your Compost keeps half of itself instead of emptying. (Doesn't stack.)","golden":"10/14. Keeps all of itself."},{"uid":"u16","na
