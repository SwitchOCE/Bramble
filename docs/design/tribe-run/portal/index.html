aking it.\n\n**The twist.** In Bramble the shop is the Supply, and a copy lasts beyond one play. It stays on until the Changeling picks a new one. The tier cap stands in for Dominion's cost cap. And a changeling does take the original: the shop unit goes home to the pool, and the Board of Exchanges leaves a log in its place, because every swap is fair.\n\n**Guise (new keyword).** While recruiting, once a turn, drag a shop unit onto this. It **wears** that unit: it gains the unit's text and tribe, keeping its own stats, its own text and the Changeling tribe. The guise stays until it wears another one, which replaces the old. It can wear only units of its own tier or lower. The shop unit goes back to the pool, and a **Stock** takes its shop slot.\n\nGuise rules:\n- Worn text reads \"this\" as the Changeling.\n- A worn \"When played\" does not trigger: the Changeling is already in play. Glamour-Weaver changes that.\n- A worn unit's tribe counts for every tribe card and tribe bonus, so a Changeling in an Ooze guise is an Ooze.\n- A golden Changeling wears golden text. That follows the triple rule, since the worn text is part of its text.\n- A Changeling loses its guise when it makes a triple.\n\n**Stock (token).** A Changeling, 0/3, Tier 1. It sits in the shop and costs 1 gold. No text. It leaves when the shop refreshes, unless the shop is frozen. It's Created, so it sells for 0. Stocks never make triples.\n\n**How it plays.** A Changeling board is never quite the same twice. Each Recruit Phase you look at the shop as a menu of texts, not of bodies. Do you buy that Bog unit, or let your Foundling wear its Mire and leave a 1-gold Stock behind? Refresh and Freeze become ways to choose what your units *become*.\n\nThe tribe brings few stats of its own. It brings three levers:\n- **Who** wears: Guise units, and later Stocks.\n- **What** they may wear: tier raisers, wearing your own board, wearing what you sell, wearing the enemy.\n- **Payoffs** for wearing often, and for wearing many tribes at once.\n\nIts strength comes from whatever the other four tribes put in the shop. That gives Johnny an endless list of misuses: a Changeling that is an Ooze and a Bird at once, a mirror-backwards Pass, a Stock that eats like an Ooze, a second copy of your own carry's text.\n\n## 2. The 19 units\n\nBody targets: 4 / 6 / 7 / 8.5 / 12 / 14.\n\n| # | Name | Tier | A/H | Text | Golden text |\n|---|---|---|---|---|---|\n| 1 | Cradle Foundling | 1 | 2/2 | Guise. | 4/4. Guise (wears golden text). |\n| 2 | Ant-Nest Grub | 1 | 1/2 | Guise. When this wears a unit: gain +1/+1 permanently. | 2/4. Guise. When this wears a unit: gain +2/+2 permanently. |\n| 3 | Pip Unlike | 2 | 2/4 | Guise. Its guise is mirror-backwards: left and right swap, in front of and behind swap, front row and back row swap, and Start of Turn and End of Turn swap. | 4/8. Same, wearing golden text. |\n| 4 | Knowe Nursemaid | 2 | 3/3 | When a Changeling you own wears a unit: give it +1/+1 permanently. | 6/6. ...+2/+2 permanently. |\n| 5 | Leaf-Gold Pedlar | 2 | 2/4 | Once a turn, when a Changeling you own wears a unit: gain 1 gold. | 4/8. ...gain 2 gold. |\n| 6 | Porter of the Seven Doors | 3 | 2/5 | Your Changelings can wear units 1 tier above their own. | 4/10. ...2 tiers above. |\n| 7 | Hoverfly Guest | 3 | 3/4 | Guise. Start of Combat: this also wears the enemy across it this fight, ignoring tier. | 6/8. Same, and both guises are golden text. |\n| 8 | Bee Orchid | 3 | 2/5 | End of Turn: give each Changeling you own that wears a unit +1/+1 permanently. | 4/10. ...+2/+2 permanently. |\n| 9 | Alder Whittler | 3 | 3/4 | Once a turn, when you buy a Stock: it wears the unit it replaced (up to Tier 3). | 6/8. Twice a turn. |\n| 10 | Tam Twice | 4 | 4/4 | Guise. It can also wear a unit you own. That unit stays and leaves no Stock. | 8/8. Same, wearing golden text. |\n| 11 | Michaelmas Mummers | 4 | 3/6 | End of Turn: for each different tribe your Changelings wear, give another random Changeling +2/+2 permanently. | 6/12. ...+4/+4 permanently. |\n| 12 | Glamour-Weaver | 4 | 3/5 | Once a turn, when a Changeling you own wears a unit: that unit's \"When played\" text triggers for it. | 6/10. Twice a turn. |\n| 13 | Inside-Out Tod | 4 | 4/5 | Guise. When you sell a unit: this wears it, ignoring tier, and gains half its stats permanently. | 8/10. Same, wearing golden text, and gains all its stats. |\n| 14 | Wicker Moll | 5 | 4/7 | Your Stocks wear the unit they replaced (up to Tier 5) and have +3/+3. | 8/14. ...and have +6/+6. |\n| 15 | Coat-Peg Steward | 5 | 5/6 | When another Changeling you own dies: this also wears its guise this fight, and gains +4/+4. | 10/12. ...gains +8/+8. |\n| 16 | Grandfer Acorn | 5 | 4/8 | Guise. This keeps up to 3 guises at once; a 4th sheds the oldest. | 8/16. Keeps up to 6 guises, all golden text. |\n| 17 | The Lady Under the Hill | 6 | 7/7 | Guise. Your other Changelings wear golden text. | 14/14. Guise. Your Changelings, this one included, wear golden text, and the numbers in their worn text are doubled once more. |\n| 18 | Bettie Underhill | 6 | 6/8 | End of Turn: give your Changelings +1/+1 permanently for each guise they put on this turn. | 12/16. ...+2/+2 permanently for each. |\n| 19 | Penny Second | 6 | 6/8 | Start of Combat: each Changeling in your front row wears the enemy across it this fight, ignoring tier, and that enemy loses its text this fight. | 12/16. Same, and the guises are golden text. |\n\n**Token:** Stock (above). No spells.\n\n**Interactions worth spelling out:**\n- **Changelings wear Changelings.** A Foundling can wear a Knowe Nursemaid from the shop, giving you two Nursemaid texts.\n- **Pip and position.** Pip wearing a Hedgerow \"Pass X: your rightmost other unit gains X\" passes to the *leftmost* unit. Pip wearing an Ooze's Start of Turn Digest digests at End of Turn, so the eaten stats are there for tonight's fight, not tomorrow's.\n- **Tam and your carry.** Tam Twice wearing your own best unit gives a second copy of its text with no Stock, and needs no shop luck.\n- **Weaver and When played.** Glamour-Weaver with a worn \"When played\" buffer gives a free trigger every turn. With Tam wearing your own When-played buffer, it repeats that buffer from your board.\n- **Stocks as material for other tribes.** A 0/3 for 1 gold is something an Ooze can Eat, a body for a Bog unit's Mire, or a slot filler while a Bird is away south.\n\n## 3. Builds\n\n**A. The Masquerade (wear many tribes).** Use Foundling, Grub and Pip early, then the Porter, Bee Orchid and Michaelmas Mummers. Aim for four or five Guise units each wearing a different tribe. The Nursemaid and Bee Orchid grow every wearer, and the Mummers grow more with each new tribe. Each Changeling also picks up other tribes' bonuses: a Changeling in a Hedgerow guise gets Harvest Supper's Hedgerow bonus. This is the most flexible build and the easiest to pivot from.\n\n**B. The Stock Exchange.** Use the Leaf-Gold Pedlar and Alder Whittler, then Wicker Moll and Bettie. Every guise leaves a Stock, and under Moll every Stock is a 3/6 for 1 gold that wears the unit it replaced. One shop unit becomes two copies of its text, and the board fills with Changelings for Bettie to grow. The limits are board space and how many Guise actions you have each turn.\n\n**C. The Impostor Does It Better (copy your carry).** Use Tam Twice, Glamour-Weaver, Grandfer Acorn and Inside-Out Tod, finished by the Lady. Pick one strong text, say another tribe's T4–T5 buffer or combat engine you already own. Tam wears it from your board. Grandfer stacks it with two other texts. Tod wears whatever you sell, including a golden you've outgrown, and takes half its stats. With the Lady, every copy is golden.\n\n**D. Swap Noticed Too Late (fight-time copies).** Use the Hoverfly Guest, then Coat-Peg Steward and Penny Second. Read your next opponent's last board and put Changelings across their best units. The Hoverfly copies the enemy across it. Penny copies the enemy units across your front row and wipes their text, which hard-counters text-heavy carries. The Steward gathers the guises of fallen Changelings as the fight goes on.\n\n**In a lobby.** The Changelings are parasites by design. Wearing takes nothing from the pool (the worn unit goes back), so they don't starve other players, but they're only as good as the other tribes' texts in their shop. They mix best with texts that work on any body: Bog units' Mire and Bitter, Hunters' Quarry and Pack, Ooze Eat and Belly. \"Your Fairies\" texts are weak in a guise unless you own Fairies. The natural mid-game shape is one real tribe plus Changelings in its guises, for example three Oozes and three Ooze-guised Changelings.\n\n## 4. Risks and holes\n\n- **Two layers of text on one card** (up to four on Grandfer). The UI must show the guise clearly, say as a small portrait badge you tap to read, or the tribe is unreadable.\n- **The tier cap starves early Guise units late.** At Tier 6 the shop leans to high tiers, so a Tier 1 Foundling has little to wear. The Porter may become mandatory. Fallback: units of your shop tier minus two or lower are always wearable.\n- **Traps.** Wearing \"your Birds get...\" with no Birds does nothing. That's honest, but new players will fall into it. The tutorial should cover it, not the card.\n- **Stock efficiency under Wicker Moll** may be too strong: 1 gold for a 3/6 carrying up to Tier 5 text. If so, Stocks cost 2 under Moll, or Moll's Stocks lose the +3/+3.\n- **Penny Second's text wipe** can feel unfair to the opponent, since four enemy texts are gone at Start of Combat. Fallback: she copies without wiping, and the wipe goes only on her golden.\n- **Multiplier stacking.** Grandfer wearing three Glamour-Weavers under a golden Lady gives many free When-played triggers a turn. Each source is once or twice a turn, so growth is bounded and linear, not runaway. But the high roll is very high, so test it.\n- **Stocks never triple** is an exception to a global rule. It's needed: otherwise three 1-gold Stocks buy a Discover.\n- **Open rules questions,** with proposals: a worn \"Once a turn\" counter belongs to the Changeling and doesn't reset on re-wearing; a guise survives Fly South; wearing a Shy Fairy makes the Changeling Shy.\n- **Identity hole.** With few stats of its own, the tribe can feel like \"other tribes, but worse bodies\". The payoffs (Nursemaid, Bee Orchid, Mummers, Bettie) have to make wearing often clearly better than buying the original.\n\n## 5. Tier check\n\n- **Tier 1:** Foundling is a 4-stat body plus a Tier 1 text, a normal Tier 1. Grub grows 2 stats a turn (0.5 body against ~0.4), slightly over on purpose because it only grows if it takes a new guise each turn.\n- **Tier 2:** 6-stat bodies. Nursemaid gives about 6 stats a turn with three wearers (1 body, top of range). Pedlar's 1 gold a turn is a third of a unit. Pip is a body plus a Tier 2 text.\n- **Tier 3:** 7-stat bodies. Bee Orchid gives about 8 stats a turn with four wearers (1.1 against ~0.8), about 2 bodies once Moll's Stocks join: over on purpose, as the reason to stack wearers. Hoverfly's enemy copy is about 1–1.4 bodies in fight, swingy. Porter and Whittler are enablers with low stats.\n- **Tier 4:** Mummers give 12 stats a turn with three tribes worn (1.4 against ~1.3). Weaver gives one free When-played a turn, about 1–2 bodies. Tod's sale gain is once, about 2 bodies. Tam is the enabler.\n- **Tier 5:** Moll gives about 3 Stocks a turn at 9 stats plus their texts, about 2.5 bodies plus text, near the top of range. Steward gives 24–32 stats plus texts, under the ~4 in-fight target but with uncapped texts. Grandfer triples one body's text.\n- **Tier 6:** Bettie gives about 56 stats a turn with 4 guises and 7 Changelings (~4 bodies, on target). The Lady doubles every worn text. Penny is well over 6 bodies against a text-heavy board and little against a vanilla one, a deliberate swing. The Lady's golden reaches ×4 on worn numbers, the top of the golden ceiling, on purpose.\n\n## 6. Design rationale\n\n1. **I started from Band of Misfits** because \"becomes what it replaces\" is the seed, and the shop is a natural Supply to copy from.\n2. **The shop unit is taken and a Stock is left** to make the copy cost something you can see (that unit is no longer for sale) and to put the folklore's stock on the board.\n3. **I capped by tier, not cost.** Bramble units all cost 3, so tier is the only lever, and it lets the tier raisers form a ladder.\n4. **The worn tribe counts for other tribes' cards and bonuses.** That interweaving across tribes is what Johnny asked for.\n5. **The worn text adds to the Changeling's own text** so every Changeling keeps its own small job and the payoffs have something to hook on.\n6. **Each Changeling wears once a turn.** That bounds every engine linearly and keeps the runaway check simple.\n7. **I built the four levers:** who wears, what can be worn (own board, sold units, enemies, higher tiers), how often, and how many tribes.\n8. **Stocks got a ladder:** the Whittler (once a turn, up to Tier 3), then Moll (every Stock, up to Tier 5). It follows rule of thumb 3: more recipients, not bigger numbers.\n9. **The fight-time copy got a ladder too:** the Hoverfly copies one enemy, and Penny copies and wipes up to four.\n10. **Goldens wear golden text** because it follows the triple rule anyway, and it gives the Lady a doubling capstone.\n11. **Stocks don't triple.** I cut the 3-gold Discover loop rather than price it.\n12. **Names and lore came last,** fitted to each job: Pip's mirror copies, Tam's family, Penny turning the duchess away, Moll's stocks, and Bettie's ledger as the payoff for wearing often.\n","versions":[]},{"id":"changelings--surgical","key":"changelings-af5d","seed":"changelings","route":"surgical","tribe_name":"The Changelings — v1","status":"written","final_version":null,"stop_reason":null,"md":"# The Changelings — v1\n\n## 1. Identity\n\n**Core mechanic: Changelings wear other units' text.** Each one has small stats and a small text of its own, plus one borrowed **Guise**. A Guise can come from the shop, from your own board, from a unit you sell, or from the enemy across. A second verb, **Exchange**, swaps one of your units with a unit in the shop, so the tribe trades with the shop as well as buying from it.\n\n**Guise (new keyword).** A Changeling can wear one other unit's Guise. That means the unit's own text (as it stands, golden if that unit is golden) and its tribe, on top of the Changeling's own. Stats are never copied unless a card says so.\n- A new Guise replaces the old one.\n- **One of each:** no two of your Changelings wear the same unit's Guise. If one takes a Guise another already wears, the other loses it.\n- A Guise taken while recruiting stays on the card wherever it goes: hand, shop, or flying south. If the Changeling wears it when played, the Guise's \"When played\" fires too. A Guise taken in a fight ends with the fight, and the earlier Guise comes back.\n- A Guise copies a unit's own text, never that unit's Guise. It never copies a Tier 6 unit.\n\n**Exchange (verb).** Put a friendly unit into the shop in place of a shop unit you choose, and take that shop unit into your hand (you need a free hand space). The swap is fair: the new unit counts as Bought if you gave a Bought unit, and as Created otherwise. Until the shop refreshes you can buy back the unit you gave, with its buffs and Guise, at the normal price. After a refresh it goes back to the pool, and a token is removed.\n\n**How it plays.** A Changeling player is a guest in someone else's tribe. Early on you pick up a Kit and a Hob and borrow the best text in the shop or on your board. In the middle game you decide whether to keep your Guises, which pays over time, or keep swapping them, which pays each time. You also decide whether to work the shop with Exchanges. Because a Guise brings its tribe with it, Changelings count as Birds, Oozes or Hedgerow folk for those tribes' own cards. The best Changeling board is two tribes at once. Late on, the Lady Under the Hill wears all of your Guises at once, the Fetch copies your carry for each fight, and Bettie Underhill pays out for every Exchange you made this game.\n\n## 2. The 19 units\n\n| Name | T | A/H | Text | Golden |\n|---|---|---|---|---|\n| Cradle Kit | 1 | 2/2 | When played: take the Guise of a unit in the shop. | 4/4. The Guise it takes is golden. |\n| Weeks-Old Hob | 1 | 1/3 | When played: take the Guise of a unit beside it. End of Turn: if this kept the same Guise all turn, gain +1/+1 permanently. | 2/6. +2/+2. |\n| Clerk of Exchanges | 2 | 2/3 | When played: Exchange a friendly unit. | 4/6. Exchange up to two friendly units. |\n| Veil-Stitcher | 2 | 2/3 | End of Turn: give your Changelings that wear a Guise +1/+1 permanently. | 4/6. +2/+2. |\n| Pip Unlike | 2 | 3/2 | When played: take the Guise of a friendly unit, mirror-backwards: in its text, left and right swap, and so do in front of and behind. | 6/4. The Guise is golden. |\n| Turncoat Hare | 3 | 4/3 | Start of Combat: take the Guise of the enemy across for this fight. | 8/6. The Guise is golden. |\n| Wicker Moll | 3 | 2/5 | Once a turn, when you sell or Exchange away a unit: leave a Stock in its slot, wearing that unit's Guise. | 4/10. Twice a turn. |\n| Grandfer Acorn | 3 | 3/4 | Whenever a friendly Changeling takes a Guise while recruiting, it gains +2/+1 permanently. | 6/8. +4/+2. |\n| Counter Stand-In | 3 | 3/4 | Whenever you sell a unit, this may take its Guise. | 6/8. The Guise is golden. |\n| Tam Twice | 4 | 4/5 | Wears two Guises at once. When played: take the Guises of two other friendly units. | 8/10. Both Guises are golden. |\n| Matron of the Exchange Room | 4 | 3/6 | End of Turn: for each tribe among your units, give a random unit of that tribe +2/+2 permanently. (A Changeling counts as its Guise's tribe too.) | 6/12. +4/+4. |\n| Placement Officer | 4 | 3/5 | Start of Turn: you may Exchange a friendly unit. | 6/10. Up to two. |\n| Coat-Peg Steward | 4 | 4/4 | Whenever you Exchange, the unit you take gains the permanent stats the unit you gave had gained, plus +2/+2. | 8/8. Twice those stats, plus +4/+4. |\n| Long-Stay Hollin | 5 | 5/7 | End of Turn: each friendly Changeling that kept its Guise all turn gains +1/+1 permanently for each Tier of the unit it copies. | 10/14. +2/+2 per Tier. |\n| Penny Second | 5 | 6/7 | Start of Combat: take the Guise of the enemy across for this fight. If this is bigger than it, that enemy loses its text for this fight. | 12/14. The Guise is golden. |\n| Keeper of the Lost Hour | 5 | 4/8 | Your Changelings' Guise text that triggers in a fight triggers twice. | 8/16. Three times. |\n| The Lady Under the Hill | 6 | 7/7 | Wears every Guise your other Changelings wear (not other copies of this text). One of each doesn't apply to her. | 14/14. Her Guises are golden. |\n| The Fetch | 6 | 6/8 | Start of Combat: make a Stock in the empty slot nearest this, with your biggest unit's stats and Guise, for this fight. | 12/16. Two Stocks. |\n| Bettie Underhill | 6 | 6/9 | End of Turn: give your Changelings +1/+1 permanently for each Exchange you've made this game. | 12/18. +2/+2 each. |\n\n**Token: Stock.** A 1/3 Changeling, Created, with no text of its own. It can wear a Guise like any Changeling. *(Wicker Moll's sigh in their sleep.)*\n\n**Spell: Midnight Swap** (price 2). Exchange a friendly unit. Any tribe can use it while Changelings are in the lobby.\n\n## 3. Builds\n\n**The Masquerade (Guise bridge).** Cradle Kit, Pip, Counter Stand-In, Tam Twice and Grandfer Acorn, building to the Lady and the Keeper of the Lost Hour. You pick a second tribe from the lobby and wear its best texts. A Kit wearing a Bird's Guise is a Bird, so selling it sends it south and it comes home with doubled stats, still in its Guise. With Hedgerow folk, Pip mirrors \"Pass X: your rightmost other unit\" into a leftmost pass, so you get a second pass lane. A Changeling wearing an Ooze's Belly holds units like an Ooze. The Matron grows with each tribe your Guises bring. The Lady then holds all those texts in one body: Belly, Mire and Pass on one 7/7.\n\n**The Board of Exchanges (shop swap).** Clerk of Exchanges, Midnight Swap, Wicker Moll, Placement Officer and Coat-Peg Steward, building to Bettie Underhill. Exchange a spent or small unit for the shop's best each turn. Moll leaves a Stock in its slot that keeps the old unit's text, and the Steward moves the old unit's buffs onto the new one. Off-label uses:\n- Exchange a buffed unit away and **freeze**: the shop holds it as an eighth slot until you buy it back.\n- Buy it back to replay its \"When played\".\n- Exchange a 0-value Stock to get a free shop unit.\n\nBettie pays once for each Exchange in the game, so starting early matters.\n\n**The Long Swap (keepers).** Weeks-Old Hob, Veil-Stitcher, Long-Stay Hollin and the Matron. Put high-tier Guises on early and never change them. A Kit played at Tier 5 copies a Tier 5 shop unit, and Hollin then pays +5/+5 a turn for it. This pulls against Grandfer and the Stand-In, which pay for changing Guises. Choosing between keeping and swapping is the tribe's main decision in the middle game.\n\n**Impostors (fight copying).** Turncoat Hare, Penny Second, the Keeper and the Fetch. You can see your next opponent's last board, so you place Turncoat and Penny across their key unit. Against Bog folk, Penny takes the Mire unit's text, the enemy loses its Mire, and Penny holds the Mire instead. Against Hunters, Penny takes the Quarry text. The Keeper fires stolen Start of Combat text twice. The Fetch makes a copy of your carry for each fight, if you keep a slot empty for it.\n\n## 4. Risks and holes\n\n- **Reading the board.** A Changeling has two texts, Tam has three and the Lady can have five or more. The UI has to show a Guise as a compact second line or a tag, or Changeling boards become unreadable. This is the biggest look-and-feel cost.\n- **Borrowed economy.** A Guise of a neutral gold unit doubles that gold. The one-of-each rule caps it at one extra copy, plus the Lady. If it is still too much, gold text pays half when worn as a Guise.\n- **Strength depends on the lobby.** Changelings are only as good as the other tribes and neutrals that roll. In a weak lobby the tribe has low stats and borrows little.\n- **Weak identity.** Players may feel they are playing someone else's tribe. The Changeling payoffs (Grandfer, Veil-Stitcher, Hollin, Bettie) are there to keep the tribe the owner of the board.\n- **Hand space.** A full hand blocks an Exchange. Players may find this annoying at Start of Turn with the Placement Officer.\n- **Penny's silence** can feel bad for the player who loses their key text. It hits one unit, needs Penny to be the bigger unit, and is visible from the recorded board.\n- **Stock clutter.** Moll can fill the board with weak 1/3 Stocks. They sell for 0 and make good Exchange fodder, but a board left full of Stocks loses fights.\n- **Rules edges.** These need playtests: a Guise firing its \"When played\" on replay, fight Guises giving way to recruit Guises, Exchanged units in a frozen shop, the Lady with the Fetch.\n- **The Keeper and the Lady** together are the high roll. The Keeper only doubles fight triggers, and Tier 6 text can't be copied, so it stays inside a fight.\n\n## 5. Tier check\n\n- **Tier 1:** Bodies 4 and 4, at the median. The Kit's borrowed text is about one T1 card's text, once (target ~1). The Hob gives +2 stats a turn, about 0.5 body (target 0.4). That is slightly over, but it needs a Guise kept all turn.\n- **Tier 2:** Bodies 5, below the median of 6 on purpose, because the Guise or Exchange text is worth a second card. The Clerk is worth about 2 gold once, about 1 body. The Veil-Stitcher gives 4–6 stats a turn with 2–3 Guised units (0.7–1 body, at the top of the range). Pip is a once-off copy.\n- **Tier 3:** Bodies 7, at the median. Grandfer gives about 6 a turn at two Guises a turn (0.85 body). Moll gives a 1/3 Stock plus a kept text a turn (~0.8). Turncoat gives a copied enemy text for one fight (~1 body in fight). The Stand-In gives a text per sell.\n- **Tier 4:** Bodies 8–9. The Matron gives 12–16 a turn across 3–4 tribes (1.4–1.9 bodies). That is slightly over because it needs breadth. The Officer is worth about 2 gold a turn. Tam's two Guises match \"repeat one\" (Kelp Keeper) at this tier. **Broken on purpose:** T4 has both a multiplier (Tam) and an economy piece (Officer), with one buffer, because the Exchange line needs a repeatable source before its T6 payoff.\n- **Tier 5:** Bodies 12–13. Hollin gives ~32 a turn with four Changelings at Guise tier 4 (2.7 bodies, above the 2 target, under the top of 5), as the direction card. Penny is a copy plus a silence in fight (~3–4 bodies against a key unit). The Keeper is the Brann slot, narrowed to fight triggers.\n- **Tier 6:** Bodies 14–15. Bettie gives ~56 a turn with 7 Exchanges and four Changelings (4 bodies, on target). The Fetch's copy of the carry is ~6 bodies in fight (on target). The Lady wears 3–5 texts: a capstone with no fixed number. **Broken on purpose:** a Guise can't copy Tier 6 text, so capstones can't stack.\n- **Runaway check:** No unit's gain feeds its own source: Hollin's pay rests on a fixed tier, and Bettie's on an Exchange count. The first pass found two loops: Bettie copied through Pip, Tam and the Lady (about 800 a turn), and the Keeper doubling End of Turn buffs. Three rules closed them: one of each, no Tier 6 Guises, and fight-only doubling. The worst case left is Hollin worn three ways (~120 a turn), under T6's top. Goldens double a Guise's numbers, which stays inside ×2–4.\n\n## 6. Design rationale\n\n1. **Gap: a closed shop.** No tribe interacts with the shop except by buying; Fairies' Rings and Hedgerow's Pass both work only on your own board.\n2. **Gap: no bridge, no counterplay.** Every tribe's keywords feed only itself. No card reads the enemy's text, although the next opponent's board is visible and \"across\" already exists.\n3. **Guise is the core,** because one verb fills the bridge gap and is the seed's \"become what you replace\". It copies text and tribe but not stats, so the tribe stays small-bodied and the borrowed text is the value.\n4. **Exchange is the second verb,** to fill the shop gap and put the folklore swap into the rules: a fair trade, with a Stock left in place.\n5. **Exchanged units arrive in hand,** so their \"When played\" fires and Moll's Stock can take the empty slot.\n6. **Each tier adds a new Guise source,** rather than a bigger number: shop (T1), friend (T1–2), sold unit and enemy (T3), two at once (T4), every Guise (T6). This follows the \"more recipients, not bigger packets\" rule.\n7. **Keep or swap is the main decision:** Hob and Hollin pay for keeping a Guise, Grandfer and the Stand-In for changing it.\n8. **Penny and Turncoat use the visible next board,** so placing units across the enemy becomes a planning decision. The silence needs Penny to be the bigger unit, so building Penny's stats matters.\n9. **The Matron counts tribes,** so borrowing many tribes pays and the bridge is rewarded, not just allowed.\n10. **The guardrails came out of the runaway pass:** one of each, no Tier 6 Guises, and the Keeper doubling fight triggers only.\n11. **Names and flavour came last.**\n","versions":[]},{"id":"changelings--top-down-flavour","key":"changelings-80e7","seed":"changelings","route":"top-down-flavour","tribe_name":"The Changelings (v1)","status":"written","final_version":null,"stop_reason":null,"md":"# The Changelings (v1)\n\n## 1. Identity\n\n**The fantasy.** You are the Board of Exchanges. Your units have no faces of their own. They step into someone else's place and wear that shape, almost right. The longer a swap goes unnoticed, the more it is worth. Being found out isn't a loss: the changeling comes home to polite applause, and something was always left in return.\n\n**New keywords**\n\n- **Guise X:** this unit permanently gains X's printed text and tribe, on top of its own. It counts as both tribes. It never copies X's stats or X's own Guise. \"This\" in the copied text means the wearer. A golden X's doubled text is copied as doubled. A copied \"When played\" doesn't trigger, because the wearer is already on the board. A unit wears one Guise at a time, and any unit (not only Changelings) can wear one if a card gives it one.\n- **Unmasked:** triggers when this unit is found out. That happens when something Unmasks it, or when it takes a new Guise (it is Unmasked first, then swaps). It keeps its Guise. Its Worn count is read, then resets to 0.\n\n**Terms**\n\n- **Worn:** how many Start of Turns a Guised unit has spent in its current Guise. It shows on the card.\n- **Stock (token):** \"carve a Stock of X\" makes a Created Changeling with X's Attack and Health as they are now, and no text. It sells for 0.\n- **Exchange a unit:** swap a unit you own with a unit in your shop. The shop unit comes to your hand. Yours takes its shop slot, frozen, keeping its stats, and you can buy it back for 3. If the shop is refreshed, it's gone.\n\n**How it plays.** Early on, Changelings copy whatever is useful: a shop unit's text, your best unit's text, or a Stock with its stats. In the midgame you choose between letting Guises run (Worn climbs, and the payoffs read Worn) and cashing them in (Unmask for applause buffs, then re-Guise for another trigger). Stocks give you a second resource: bodies with no text that are free to give away, ready to wear a Guise, to be Exchanged, or to feed the Registrar's ledger. Late on, the tribe makes copies of your carry, makes triples from units you only hold one of, and ends with the Lady Under the Hill, who wears every face on your board at once. The tribe's text is mostly \"copy that\" and \"swap this\", so its value comes from what it copies. That includes other tribes' units, the shop's best and your opponent's front rank.\n\n## 2. The 19 units\n\n| Name | Tier | A/H | Text | Golden text |\n|---|---|---|---|---|\n| Foundling | 1 | 1/3 | When played: Guise a unit in the shop. Unmasked: gain +1/+1 permanently for each turn Worn. | Same, but its copied text is copied as if golden. Unmasked: gain +2/+2 permanently for each turn Worn. |\n| Wicker Prentice | 1 | 1/1 | When played: carve a Stock of a unit in the shop. | When played: carve 2 Stocks of units in the shop. |\n| Pip Unlike | 2 | 2/3 | When played: Guise a unit you own or in the shop, mirror-backwards: in the copied text, left and right swap, front and behind swap, and leftmost and rightmost swap. | Same, and the copied text's numbers are doubled. |\n| Grandfer Acorn | 2 | 2/4 | End of Turn: Unmask your Guised unit with the most turns Worn, and give it +1/+1 permanently. | End of Turn: Unmask your two Guised units with the most turns Worn, and give them +2/+2 permanently. |\n| Clerk of Exchanges | 2 | 3/3 | When played: Exchange a unit you own. | When played: Exchange up to 2 units you own. |\n| Glamourer of the Knowe | 3 | 3/4 | When played: give a friendly unit the Guise of another unit you own or one in the shop. | Do this twice. |\n| Alder Carver | 3 | 3/4 | When played: carve a Stock of your biggest other unit, with half its stats. | ...with its full stats. |\n| Hob's Ring Dancer | 3 | 3/3 | When played: Guise a unit in the shop. Unmasked: give the units touching this +1/+1 permanently for each turn Worn (at least 1). | ...+2/+2 for each turn Worn (at least 2). |\n| Fetch of the Front Rank | 3 | 3/4 | Start of Combat: copy the text and tribe of the enemy across, for this fight. Then use its Start of Combat text, if any. | Same, and also gain that enemy's Attack and Health for this fight. |\n| Bettie Underhill, Registrar | 4 | 4/5 | Whenever you carve a Stock or Exchange a unit, give your Changelings +1/+1 permanently. | ...+2/+2 permanently. |\n| Knowe Usher | 4 | 4/5 | Whenever a friendly unit is Unmasked, give your other Changelings +1/+1 permanently for each turn it was Worn (at least 1). | ...+2/+2 for each turn (at least 2). |\n| Glamour-Veil Seamstress | 4 | 3/6 | Whenever a friendly unit takes a Guise, it uses the copied \"When played\" text, if any. | ...uses it twice. |\n| Keeper of the Lost Hour | 4 | 2/7 | Start of Turn: your Guised units gain 1 extra turn Worn. | ...2 extra turns Worn. |\n| Tam Twice | 5 | 5/7 | When played: Guise a unit you own. Your Guised units count as copies of their Guise for triples. A unit used up this way is Unmasked first. | Same, and when played, also gain the stats of the unit it Guises. |\n| Exchange Assessor | 5 | 5/6 | Twice a fight: when a friendly Changeling dies, carve a Stock of the enemy that killed it, in its slot. | Four times a fight. |\n| Penny Second | 5 | 6/6 | When played: Guise your biggest other unit and gain half its stats. Then Exchange that unit. | ...and gain its full stats. Then Exchange that unit. |\n| The Lady Under the Hill | 6 | 6/8 | Has the printed text of every other unit on your board (not their Guises, and not copies of her). Can't wear a Guise. | Same, and her copied text's numbers are doubled. |\n| Wicker Moll | 6 | 5/9 | Your Stocks also have the printed text of the unit they were carved from. End of Turn: carve a Stock of your biggest unit, with half its stats. | ...with its full stats. |\n| The Hundred-Year Nurse | 6 | 7/8 | Start of Turn: give your Changelings +1/+1 permanently for each turn your longest-Worn Guise has been Worn (up to +8/+8). | ...+2/+2 for each turn (up to +16/+16). |\n\n**Tokens and spells**\n\n- **Stock:** Changeling token, stats as carved, no text, sells for 0. With Wicker Moll it also has the text of what it was carved from.\n- **Eggshell Brew** (shop spell, 1 gold): Unmask a unit. *(\"I have seen the acorn before the oak, but never brewing in an eggshell.\")*\n\n## 3. Builds\n\n**The Long Con (let Guises run).** Foundling, Hob's Ring Dancer, Keeper of the Lost Hour and the Hundred-Year Nurse. You don't Unmask for turns. Keeper doubles Worn, and the Nurse reads the longest-Worn Guise each turn. Then you cash in once with Eggshell Brew or a re-Guise from Glamourer, while Knowe Usher is out, for one huge round of applause. Grandfer works against this build, so whether to keep him is a real decision.\n\n**Applause (Unmask churn).** Grandfer Acorn, Glamourer, Knowe Usher and Eggshell Brew. Every Unmask buffs all your Changelings, so the build wants many cheap Unmasks rather than long ones. Pairing Glamour-Veil Seamstress with Glamourer is the tribe's Johnny engine: each re-Guise Unmasks the target and also fires the copied \"When played\". The Lady copies Grandfer, so you get two Unmasks a turn.\n\n**The Stock Yard (something left in return).** Wicker Prentice, Alder Carver, Clerk of Exchanges, Bettie Underhill, Exchange Assessor and Wicker Moll. Stocks go wide and soak up Bettie's buffs, because they are Changelings. The Clerk turns a free Stock into a fresh shop unit. Once Moll is down, a Stock of your carry is a half-stat copy of your carry with all its text. A Stock of the Lady is a second Lady.\n\n**Who Is the Real One? (identity and triples).** Penny Second, Tam Twice, Glamourer and Pip Unlike. Penny Guises your carry, takes half its stats and sends the original to the shop. Buy it back and Glamourer a third unit into its Guise: with Tam Twice out, that's a golden carry from one real copy. Every triple Discovers a higher-tier unit.\n\n**With other tribes.** Guise carries the tribe, so a Changeling counts for the other tribe's synergies and for both tribes' Harvest Supper bonuses.\n- A Changeling Guised as a Bird can Fly South and come home doubled, Changeling buffs included.\n- One Guised as an Ooze gets a Belly and can Eat.\n- Pip Unlike flips a Hedgerow \"Pass X: your rightmost other unit\" into \"leftmost\", so the Pass lands on the other end of the line.\n- Glamourer can put a Hunter's Quarry onto a Bog Mire unit, so the Mired enemy is also the one it hunts.\n- You see your next opponent's last board, so you can place Fetch of the Front Rank across their best front-row unit.\n\nChangelings are strongest in lobbies with rich unit text, and they never need the other tribe's whole package, only one good unit to copy.\n\n## 4. Risks and holes\n\n- **Rules load.** Copying text needs exact rules: what \"this\" means, copied counters, copied static effects, how Guises interact with goldens (which Guise does a golden keep?), and what happens when a Guise's source leaves the pool. The game needs a single written rule for copying.\n- **Card UI.** A Guised unit shows two texts. The look-and-feel work has to make a Guise readable at a glance (the copied text shown on the borrowed coat?) or the tribe will be unreadable.\n- **Cross-tribe double dips.** A Bird Guise on a heavily buffed Changeling doubles Changeling buffs. Birds may need a rule such as \"Fly South doubles base stats only\".\n- **Tam Twice makes triples too easy.** It may need \"Once a turn\". Watch how many Discovers it chains in a game.\n- **Bettie has no cap.** With Moll, the Prentice and the Assessor she may fire 4+ times a turn. If so, make it \"Three times a turn\".\n- **Copies of copies.** A Stock of the Lady under Moll makes a second Lady: everything ×3, or ×6 golden. That's within the ×2–4 golden ceiling only if it stays rare. Golden Moll makes a full copy of your carry every turn, bounded only by the 7 slots.\n- **Exchange feels bad** when you refresh and lose a unit you sent to the shop. That's intended, as the bargain that looks fair, but it may read as a trap.\n- **Tier 2 has no true buffer.** Grandfer's +1/+1 and Foundling's Unmask payoff stand in for one, so the early game may be weak.\n- **Fetch is swingy.** It's only as good as the enemy across.\n\n## 5. Tier check\n\n- **Tier 1:** Foundling is the seed, worth about 2 stats a turn of Worn (about 0.5 body, target 0.4). Wicker Prentice is tempo at about 6.5 stats once (about 1.6 bodies, target about 1). I broke this on purpose, because Stocks are the canvas the tribe builds on. If it plays too strong, carve at half stats.\n- **Tier 2:** two enablers and one economy unit. Grandfer gives about 0.3 body a turn plus a trigger. The Clerk is worth about one free unit. There's no pure buffer (see Risks).\n- **Tier 3:** two enablers, one buffer and one combat engine, as the guide shapes it. The Carver gives about 7–10 stats once (1–1.4 bodies). The Dancer gives about 4 a turn (about 0.6 body). Fetch varies.\n- **Tier 4:** two buffers at about 10 stats a turn each (about 1.2 bodies, target 1.3), one enabler (Seamstress) and one multiplier (Keeper, ×2 Worn).\n- **Tier 5:** Tam Twice is the direction card (triples economy). The Assessor makes about 40 stats in a fight (about 3.3 bodies, target 4). Penny is tempo at about half your carry plus a unit (about 2.5 bodies).\n- **Tier 6:** two capstones. The Lady roughly doubles your board's text. Moll adds about 3 bodies a turn plus text. The Nurse is the payoff, at about 5 bodies a turn with 6 Changelings at Worn 6, and capped at +8/+8 to keep it under the top of about 10 bodies.\n\n## 6. Design rationale\n\n1. I started from \"no face of its own\". The tribe's core verb had to be a copy, which became Guise.\n2. Guise copies text and tribe, never stats. \"Almost right\" is the soul without the body, and copying the tribe opens up cross-tribe Johnny play.\n3. \"The swap noticed too late\" became the Worn counter, so time itself is a resource.\n4. Being unmasked is \"only an embarrassment\", so Unmasked is a reward, not a loss. The Guise stays, and only Worn resets. That set up the choice between running and cashing.\n5. Re-Guising Unmasks. This joins the copy verb to the reward verb, which makes loops possible.\n6. \"Something was always left in return\" became the Stock: the body without the soul, the mirror of Guise. Together they make a whole copy.\n7. \"Board of Exchanges\" and \"whatever they're traded for\" became Exchange, which turns spare Stocks into shop units.\n8. I gave each named figure their folklore role: Grandfer gives himself away (he Unmasks), Pip copies mirror-backwards, Moll's Stocks sigh (they get text), and Penny's original is turned away (sent to the shop).\n9. \"Who is the real one?\" became a triples rule (Tam Twice): a copy counts as the real thing.\n10. \"One night under the hill is a hundred years\" became the Worn multiplier (Keeper) and the Worn payoff (the Nurse).\n11. The Lady \"may be any of them\", so the capstone wears every face, with a no-copies-of-her rule to stop loops.\n12. Last, I set numbers against the tier guide. I kept the tension between Grandfer and the Nurse on purpose, so builds have to choose.\n","versions":[]},{"id":"cuckoo-clockworks--bottom-up-flavour","key":"cuckoo-clockworks-c5c6","seed":"cuckoo-clockworks","route":"bottom-up-flavour","tribe_name":"The Cuckoo Clockworks (v1)","status":"written","final_version":null,"stop_reason":null,"md":"# The Cuckoo Clockworks (v1)\n\n## 1. Identity\n\n**Everything happens on the hour.** One clock runs each fight, and Clockworks plan around it. Their hens slip painted eggs into the enemy line-up; when the clock strikes, the eggs hatch, the chicks heave their hosts over the rim, and the guild's clocks, sleepers and bellows all go off together.\n\n**Keywords and rules**\n\n- **Chime.** Each fight has one clock, shared by both sides. It strikes after every 3rd attack (both sides' attacks count). At each strike, in this order: Dozing units whose Doze ends wake up; Eggs hatch; then every \"Chime:\" effect triggers, in Start of Combat order. Attacks made by Chime effects don't count towards the clock.\n- **Wind N:** adds N to the clock's count. The clock strikes at most once after each attack (and once straight after Start of Combat); any extra count carries over to the next strike. This stops loops.\n- **Lay:** put a Cuckoo Egg in the enemy across this unit (a random enemy if that slot is empty). The enemy is now a *host*. A host can hold several Eggs.\n- **Egg:** hatches at the next Chime after it was laid. If its host dies first, the Egg is lost.\n- **Heave:** a hatching Chick deals its Attack to its host, taking no damage back.\n- **Brood:** the stats your Chicks hatch with. It starts at 2/2 and grows permanently, like a tribe bonus.\n- **Doze:** this doesn't attack until the next Chime, when it wakes. It can still be attacked, and hits back as normal. If every unit left in the fight is dozing, they all wake.\n\n**How the tribe plays.** Early on, a hen or Kasimir lays one egg a fight, and after three attacks a 2/2 chick lands on your side and knocks 2 off its host. You can see your next opponent's last board, so you put your Layers across from the enemies most likely to live through three attacks: tanks, Mire units, the back row. Mid-game you pick what to grow: the **clock** (wind it faster, add Chime effects, double them with the Bellows) or the **brood** (bigger Brood, more eggs, foster chicks that take after your own units). The capstones join the two halves: Ottilie repeats every Start of Combat on the hour, so each strike lays a new round of eggs. The tribe wins by flooding the fight late. Its board bodies stay modest, and much of its power lives inside the fight.\n\n## 2. The 19 units\n\nAll are Clockworks: cuckoos, edible dormice, and one reed warbler who fostered her way in.\n\n| Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|\n| **Pipit-Moor Hen** | 1 | 1/3 | Start of Combat: Lay. | 2/6. Start of Combat: Lay twice. |\n| **Winding Apprentice** (dormouse) | 1 | 3/3 | Doze. Start of Combat: Wind 1. | 6/6. Doze. Start of Combat: Wind 2. |\n| **Weight-Hanger** (dormouse, pine-cone weights) | 2 | 1/5 | When this dies, Wind 3. | 2/10. When this dies, Wind 6. |\n| **Pattern-Book Painter** | 2 | 2/4 | End of Turn: your Brood permanently gains +1/+1. | 4/8. +2/+2. |\n| **Kasimir the Peddler** | 2 | 2/3 | Start of Combat: Lay. Start of Turn: gain 1 gold if his Egg hatched last fight. | 4/6. Lay twice; gain 1 gold for each that hatched. |\n| **Little-Door Cuckoo** | 3 | 3/4 | Chime: attack a random enemy. | 6/8. Chime: attack a random enemy twice. |\n| **Hawk-Barred Hen** | 3 | 3/3 | Start of Combat: the enemy across Dozes, and Lay in it. | 6/6. The enemy across and a random other enemy each Doze and get an Egg. |\n| **Little Gernegroß** | 3 | 2/3 | Start of Combat, once a fight: hide as an Egg in the enemy across. At the next Chime, hatch back into your nearest empty slot with triple Attack and Health this fight, then Heave. If the host dies first, he sits out this fight. | 4/6. Six times his Attack and Health. |\n| **High-Summer Migrant** | 3 | 3/4 | End of Turn: gain +1/+1 permanently. When you sell this, your Brood permanently gains half her Attack and Health. | 6/8. +2/+2; Brood gains all her Attack and Health. |\n| **Mother Rohrsang** (reed warbler) | 4 | 3/7 | Start of Combat: Lay in the biggest friendly unit beside her. Chicks from friendly hosts don't Heave. Instead they take after the host: they gain its keywords and a third of its Attack and Health. | 6/14. Lay in each friendly unit beside her. |\n| **Old Unruh** (dormouse) | 4 | 0/9 | Can't attack. Hunker. While he lives, the clock strikes every 2 attacks instead of 3. | 0/18. Also Start of Combat: Wind 2. |\n| **Bellows-Hall Tuner** | 4 | 2/7 | The Chime effects of units beside this trigger twice. | 4/14. Three times. |\n| **Wander-Year Journeywoman** | 4 | 4/5 | Chime: Lay in a random enemy. Twice a fight. | 8/10. Chime: Lay twice. Twice a fight. |\n| **Frau Wechselbalg** | 5 | 4/7 | The first Chick to hatch each fight hatches as a copy of its host instead, with your Brood's stats added. It doesn't Heave. | 8/14. The first two Chicks. |\n| **The Seven-Sleeper** (dormouse) | 5 | 4/8 | Hunker. Dozes until the 7th Chime. Chime, while dozing: gain +4/+4. | 8/16. +8/+8. |\n| **Herald of Spring** | 5 | 5/7 | Chime, the first each fight: your other Clockworks permanently gain +2/+2 and your Brood permanently gains +1/+1. | 10/14. +4/+4 and +2/+2. |\n| **Grand Horologe Ottilie Gugger** | 6 | 6/8 | Your other Clockworks' Start of Combat effects also trigger at each Chime. | 12/16. They trigger twice at each Chime. |\n| **Red-Mouth, the Whole-Brood Beggar** | 6 | 6/7 | Each of your Eggs hatches two extra Chicks. | 12/14. Four extra Chicks. |\n| **Hour-Bird of the Tower** | 6 | 7/8 | Chime: every little door opens: give your other units +2/+2. | 14/16. +4/+4. |\n\n**Tokens (no spells)**\n\n- **Cuckoo Egg:** a marker on a host, not a unit. It shows as a small painted egg on the host.\n- **Cuckoo Chick:** a Created Clockwork with your Brood's stats, so it gets Clockwork tribe bonuses. It lands in your empty slot nearest the slot across from its host, then Heaves. If you have no empty slot, it still Heaves, then leaves. Chicks leave when the fight ends.\n\n**Clarifications.** \"Chime effects\" means only text that starts with \"Chime:\". Ottilie's repeated Start of Combat effects aren't Chime effects, so the Bellows doesn't double them. Gernegroß isn't a Chick token, so Wechselbalg and Red-Mouth don't change him. His Egg does get Red-Mouth's two extra Chicks.\n\n## 3. Builds\n\n**1. The May Clutch (brood flood).** Pipit-Moor Hens, Kasimir, Journeywoman, Painter and Migrant, leading to Red-Mouth and Ottilie. Keep one or two slots empty so Chicks have somewhere to land. With Ottilie, every Hen lays again at each strike; with Red-Mouth, each egg gives three Heaves. Spike's line: keep feeding the Brood and keep slots free.\n\n**2. The Tower clock (Chime engine).** Winding Apprentices, Weight-Hanger, Old Unruh, Little-Door Cuckoos, Bellows Tuner, Seven-Sleeper, Herald and Hour-Bird. The aim is the most strikes per fight. Put the Weight-Hanger in the front row so it dies early and forces a strike. Hide Unruh in the back row, where his Hunker keeps him alive. Put a Little-Door Cuckoo on each side of the Bellows. Three Apprentices plus Ottilie wind 3 at every strike, so the clock strikes after every attack.\n\n**3. The Changeling house (foster and copy).** Rohrsang beside your best unit, with Wechselbalg. Foster Chicks take your own keywords: Shield and Swoop from neutrals, Cleave, Bristle, a Bog unit's Mire. With Wechselbalg, the first foster Chick is a full copy of your own best unit, and a golden copies as golden. It also turns against tall enemy boards: lay into their biggest unit and you get its twin.\n\n**4. The Lullaby lock (Johnny).** Hawk-Barred Hen plus Ottilie: the enemy across wakes at each strike and is put back to sleep at once, so it never attacks. Put her across their Cleave carrier or Hunter. A golden Hawk locks two enemies. The Seven-Sleeper in front holds the line while the clock runs.\n\n**In a lobby**\n\n- **Fairies:** Rings sit on slots, and Chicks land in empty slots. Ring the empty slots across from where your eggs go, and every Chick gets your Ring size. This is the strongest pairing.\n- **Bog folk:** a Mire unit in front makes a safe target for enemy attacks, and Bog hosts that live long keep enemy eggs alive. Foster Chicks from a Mire unit take its Mire.\n- **Hedgerow folk:** Pass X to the rightmost unit, so park the Migrant there and sell her fat. Each Acorn bought is a slot not taken, which leaves room for Chicks.\n- **Oozes:** an enemy Ooze is a bad host, because Heave can kill it and let its Belly out. A friendly Ooze dying in the fight drops units into the empty slots Chicks need.\n- **Hunters:** Quarry kills the enemy across, which loses your across eggs. Lay from the back row instead, or rely on the Journeywoman's random lays.\n- **Birds:** Nests fill empty slots, so Chicks have fewer places to land. A poor mix.\n- **Against Clockworks:** Cleave and fast trades lose their eggs before the first strike. Full boards still take eggs, because eggs go into units, not slots.\n\n## 4. Risks and holes\n\n- **Readability.** Hidden eggs, a clock counting attacks, and dozers waking need a clear clock dial and egg markers. Without them, fights feel random.\n- **Egg loss is swingy.** A host that dies in the first three attacks loses the egg. Winders, Unruh and reading the next board soften this. A run of lost eggs early may still feel bad.\n- **Bodies grow slowly.** Permanent stats come from Painter, Migrant, Herald and tribe bonuses. Until Tier 5 the board itself stays small, and a weak clock comp may fall behind Spike's tall boards.\n- **Low hero damage.** Chicks didn't start the fight, so they add no damage when you win. The tribe wins fights but may deal less.\n- **The two capstones together are the runaway risk.** Ottilie plus Red-Mouth plus four Hens with a big Brood is about 12 Heaves a strike. It's all in the fight and bounded by fight length, but it may decide fights within a few strikes. Watch this first, and cut Red-Mouth to one extra Chick if needed.\n- **The Lullaby lock may feel bad** for the locked player. The locked unit still hits back, which limits it.\n- **Your own full board.** Seven units leave no landing room, and some players will miss that. The no-slot Heave keeps it from being useless.\n- **Mirror fights,** with two sets of eggs and shared clock speed, may get confusing. Unruh speeds up the clock for the enemy too.\n- **Copying a golden** (Wechselbalg on a friendly golden) is a deliberate high roll. It needs a check that it's not routine.\n\n## 5. Tier check\n\nBody = 4 / 6 / 7 / 8.5 / 12 / 14. Assumes a typical fight of 3–5 strikes and a mid-game Brood around 4/4.\n\n- **T1:** The Hen is a 4 body plus a 2/2 Chick and 2 Heave when it hatches, about 1 body after egg loss. That's over the 0.6 in-fight target on purpose, because the egg comes late and can be lost. The Apprentice is a 6 body, 1.5×, paid for by Doze.\n- **T2:** The Painter's +1/+1 Brood a turn reaches about 3 Chicks a fight, about 1 body a turn, at the top of range. The Weight is an enabler. Kasimir pays about 1 gold plus a T1-sized egg, which fits.\n- **T3:** Little-Door gets about 4 extra attacks of 3, about 1.5 bodies in fight (top of range). Gernegroß gives about 2 bodies once, but only after a delay and it can be lost: above the target on purpose. The Hawk and Migrant are mid-range.\n- **T4:** Rohrsang's one foster Chick is about 18, roughly 2 bodies, on target. The Journeywoman's two eggs come to about 1.5 bodies. Unruh and the Bellows are multipliers, valued by what they boost.\n- **T5:** The Herald gives about 2 bodies permanent a turn, on target. The Seven-Sleeper gives +16 to +32 in fight, below the 4-body target alone but well over it with Unruh or the Bellows. Wechselbalg gives about 1 enemy best unit once a fight, roughly on target late. It's above target against tall boards, which is deliberate counterplay.\n- **T6:** The Hour-Bird gives +2/+2 to 6 units over 4 strikes, about 7 bodies against a target of 6. Ottilie and Red-Mouth are ×3–×5 multipliers. Together they break the ×4 golden ceiling. This is the flagged runaway risk above.\n\n## 6. Design rationale\n\n1. **The painted mimic egg came first:** Lay goes into a unit, not a slot, because late boards are full and the real cuckoo removes a host egg rather than finding an empty nest.\n2. **The blind chick heaving eggs over the rim became Heave:** damage to its host with nothing taken back, so it's the parasite's free hit.\n3. **\"Hatch on a timer\" and a clock-town gave one shared fight clock.** It strikes every 3 attacks, for 3–5 strikes a fight.\n4. **A lost egg if the host dies first.** This turns the visible next-opponent board into a positioning puzzle about who will survive.\n5. **The pattern books became Brood, a tribe number.** I rejected Chicks taking a share of the host's stats, because that would scale for free off the lobby.\n6. **Dormice dozing at the bench became Doze.** The hawk-barred female scaring hosts off the nest showed Doze could also be put on enemies.\n7. **The pine-cone weights, wind-up keys and Old Unruh** (Unruh is a clock's balance wheel) became ways to move the clock. The once-per-attack rule stops loops.\n8. **Mother Rohrsang \"insists he takes after her side\"** became friendly hosts and inherited keywords. This is the tribe's main door to other tribes.\n9. **Frau Wechselbalg, the changeling, became a copy once a fight.** With Rohrsang she copies your own unit: a deliberate Johnny high roll.\n10. **Ottilie, never once early, repeats Start of Combat on the hour.** She is the capstone that joins the egg half and the clock half.\n11. **A begging call like a whole brood became Red-Mouth's extra Chicks.** It's the same job as an egg at three times the output, per the tier rule.\n12. **The high-summer migration became selling a fattened hen into Brood.** It soaks up other tribes' buffs and gives Spike a bank-or-cash-in choice.\n","versions":[]},{"id":"cuckoo-clockworks--bottom-up-mech","key":"cuckoo-clockworks-b77f","seed":"cuckoo-clockworks","route":"bottom-up-mech","tribe_name":"The Cuckoo Clockworks (v1)","status":"written","final_version":null,"stop_reason":null,"md":"# The Cuckoo Clockworks (v1)\n\n## 1. Identity\n\n**Core mechanic: the hour.** In every fight each side keeps a clock. Every attack, by either side, ticks both clocks once. On every 3rd tick your clock **strikes the hour** (1st hour, 2nd hour, ...). Two kinds of body wait for the hour: Eggs and sleepers.\n\n**Keywords**\n- **On the hour:** triggers each time your clock strikes.\n- **Wind N:** Start of Combat: your clock ticks N times. It can strike during Start of Combat.\n- **Lay an X/Y Egg (in a host):** marks that enemy (default: the enemy across, or a random enemy if that slot is empty). At your next hour it **hatches**: you summon an X/Y **Chick** in the empty slot nearest the host, on the host's side, and the Chick at once deals its Attack to the host (this isn't an attack). If the host's side is full, the Chick goes to your side; if both are full, it waits for the next hour. If the host dies first, the Egg is lost.\n- **In the nest:** a Chick on the enemy's side attacks a random enemy next to it (any enemy if none is), and enemies can attack it as if it stood in your front row. That makes it a way into the back row.\n- **Brood:** a counter for the game, starting at 0. Every Chick you summon has +Brood/+Brood.\n- **Asleep (until the Nth hour):** at Start of Combat it falls asleep. It can't attack, and enemies can't attack, target or damage it; for targeting it doesn't count as being in its row, so a front row of sleepers leaves your back row open. Its text still works. It wakes on that hour, or at once when you have no awake units left. Sleepers count as your units for winning and for hero damage.\n\n**How it plays.** The Clockworks make a fight's *timing* something you build. The early hours bring delayed bodies: Eggs laid in enemy units hatch into Chicks that turn on their hosts from inside the enemy's line-up, and dormice sleep safely until their hour. Wind, pace and reading order decide *when* the hour strikes, and each build wants a different answer. Eggs want an early hour, before the host dies. Sleepers want a late one, because a Seven-Sleeper that never has to wake keeps growing. Hour engines want as many hours as the fight can give. The tension is the point: you're always tuning one dial that three things share, and many Clockworks (Oil-Can, Vault Warden, Tower Doorkeeper) do as much for another tribe's units as for their own.\n\n## 2. The 19 units\n\n| Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|\n| Pipit-Line Placer | 1 | 2/1 | Start of Combat: Lay a 1/1 Egg. | 4/2. Lay a 2/2 Egg. |\n| Bench Dozer | 1 | 2/4 | Asleep until the 1st hour. | 4/8. Same. |\n| Oil-Can Apprentice | 2 | 2/3 | On the hour (first 3 hours): give a random unit beside this +1/+1 permanently. | 4/6. +2/+2. |\n| Key-Winder | 2 | 3/3 | Wind 2. | 6/6. Wind 4. |\n| Day-Wage Journeyman | 2 | 1/4 | Start of Turn: get 1 gold for every 2 hours your clock struck last fight (at most 2). | 2/8. 2 gold for every 2 hours (at most 4). |\n| Frau Wechselbalg, Pattern Keeper | 3 | 3/4 | Your Chicks hatch with their host's shared keywords, and +1/+1 for each one copied. | 6/8. +2/+2 for each. |\n| Sleeping-Vault Warden | 3 | 2/5 | Start of Combat: the unit to the right of this falls Asleep until the 2nd hour. When it wakes, it gains +4/+4. | 4/10. +8/+8. |\n| Egg-Painter | 3 | 3/3 | End of Turn: Brood +1. | 6/6. Brood +2. |\n| Seven-Sleeper | 3 | 3/4 | Asleep until the 7th hour. Start of Turn: if it didn't wake last fight, it gains +2/+2 permanently. | 6/8. +4/+4. |\n| Reedbed Placer | 4 | 4/4 | Start of Combat: Lay a 2/2 Egg in the enemy with the most Attack. Its Chick also gets half the host's Attack. | 8/8. A 4/4 Egg; the Chick gets all the host's Attack. |\n| Coin-Turner | 4 | 3/5 | Start of Combat: Wind 1 for every 2 gold you left unspent (at most Wind 4). | 6/10. Wind 2 for every 2 gold (at most Wind 8). |\n| Mother Rohrsang | 4 | 3/6 | On the hour: give your Chicks +1/+1. | 6/12. +2/+2. |\n| Jar-Fattener | 4 | 4/5 | On the hour (first 4 hours): give your Asleep units +1/+1 permanently. | 8/10. +2/+2. |\n| Tower Doorkeeper | 5 | 5/7 | Your units' On the hour effects trigger twice. (Hatching isn't doubled.) | 10/14. Three times. |\n| Kasimir the Peddler | 5 | 4/7 | Start of Combat: Lay a 2/2 Egg in each enemy in the front row. | 8/14. 4/4 Eggs. |\n| Old Unruh, Marked Present | 5 | 5/7 | Asleep until the 3rd hour. While it's asleep, whenever another friendly unit dies, it gains +3/+3. | 10/14. +6/+6. |\n| Grand Horologe Ottilie Gugger | 6 | 7/7 | Your clock strikes on every 2nd tick instead of every 3rd. On the hour (first 3 hours): give your other Clockworks +1/+1 permanently. | 14/14. +2/+2. |\n| Little Gernegroß | 6 | 6/8 | Start of Combat: Lay an Egg in the biggest enemy. Its Chick hatches with the host's stats and shared keywords (plus Brood). | 12/16. Also lay one in the second-biggest enemy. |\n| The Midsummer Leaver | 6 | 7/7 | When the fight ends: each of your surviving Chicks gives its stats permanently to the unit that laid it (to a random Clockwork if that unit died). | 14/14. Gives double its stats. |\n\n**Tokens (two, both Created, sell for 0):**\n- **Egg:** a marker on an enemy unit, not a unit. The board shows it as a small painted egg on the host, with the hour it hatches.\n- **Chick:** a Clockwork unit with the stats its Egg names, plus Brood. It exists only in the fight.\n\nNo spells.\n\n## 3. Builds\n\n**Brood parasites (Eggs).** Pipit-Line Placer and Key-Winder early, then Egg-Painter, Wechselbalg, Rohrsang and Kasimir; the capstones are Gernegroß and the Midsummer Leaver. Your hour should come early: put a Placer *before* a Key-Winder in reading order (Placer F1, Winder F2) and add one more tick (a second Winder or Coin-Turner) so the 1st hour strikes during Start of Combat. The Eggs then hatch before their hosts swing. Chicks hatch inside the enemy's rows, so they hit the back-row engines the enemy hid. With Wechselbalg they steal Shield, Cleave or Bristle from their hosts: a Cleave Chick standing in the enemy's back row hits two hosts at once. The Midsummer Leaver turns surviving Chicks into permanent stats on their layers, so a 1-gold Pipit-Line Placer can end the game as one of your biggest units.\n\n**Clock tower (hour engine).** Oil-Can Apprentices flanking your best carries, Jar-Fattener, Ottilie, Tower Doorkeeper, with Day-Wage Journeyman and Coin-Turner paying for it. These units buff whatever stands beside them, so this build happily keeps another tribe's carries. Coin-Turner rewards saving gold for a Tier up (which already gets cheaper as you wait); faster hours feed Day-Wage, which pays back gold. With Doorkeeper, every capped hour effect fires twice.\n\n**The Sleeping Vault (sleepers).** Bench Dozer, Seven-Sleeper, Warden, Jar-Fattener and Old Unruh, played with a *slow* clock: no Wind, no Ottilie. Sleepers can't be hit, so they ride out the enemy's opening and wake as a second wave; Old Unruh wakes fed by every death before the 3rd hour. Seven-Sleepers are near-certain survivors on a win, so each one adds hero damage, and each one grows every turn it never had to wake. The puzzle is how much of your board can sleep before the awake part loses on its own.\n\n**Mixing in a lobby.** The Warden puts *any* unit to sleep with its text still working: a Hedgerow unit growing on its turns-in-slot clock, a Pass engine at the back, a fragile Fairy, or your Tower Doorkeeper itself, all kept safe for two hours. Oil-Can and Ottilie's front half work on mixed boards. Eggs are best against big, sturdy boards: Reedbed Placer and Gernegroß grow with the enemy's best unit, and Wechselbalg prices hosts by their keywords. They're weak against wide boards of small units that die before the hour (Wind answers that) and against Bog folk, whose Bitter shrinks host Attack before Reedbed reads it. Hunters' Quarry and Bog's Mire look across, so they never see a Chick standing in their own row. Ooze bellies make good hosts: a heaved Ooze that dies releases into a board the Chick is already inside.\n\n## 4. Risks and holes\n\n- **Fight length decides the payoff.** Blowouts give few hours, close fights many. Early Wind and Ottilie's pace smooth this out, but hour effects will feel swingy to Spike. The caps (\"first 3 hours\") are what keep long fights from running away.\n- **Two new spatial rules.** A Chick fighting from the enemy's side, and a sleeper that doesn't count for its row, both need clear art: an egg on the host, a ticking clock face per side, a sleeping cap or jar on dormant units. This is the tribe's biggest look-and-feel load.\n- **Feel-bad Eggs.** The host dies and the Egg is lost. That's intended pressure toward Wind, but a lost Kasimir front row reads as \"my card did nothing\". Possible change: a lost Egg adds Brood +1.\n- **Enemy-scaled payoffs** (Reedbed, Gernegroß) are strong against the lobby leader and weak against weak boards, which helps the losing player and caps the winner. Watch for Gernegroß copying a 100-stat golden carry.\n- **Midsummer Leaver snowballs on wins only.** It's rich-get-richer by design; its ceiling is the enemy's size (via Gernegroß) plus Brood, so it is not self-feeding. It still needs a sim.\n- **All-sleeper boards.** If nearly the whole board sleeps, the awake units die fast and everything wakes at once. That's fine as a fallback, but check it can't become a degenerate stall against boards that can't damage sleepers.\n- **Day-Wage + Coin-Turner loop:** saved gold winds the clock, the hours pay gold. It's capped at 2 gold, but check how it interacts with Hedgerow Acorns.\n- **Mirror matches:** two clocks, and Eggs inside Eggs' Chicks. These need a written order for rules (each side resolves its own hour in reading order).\n- **Hole:** no answer to Shield-heavy boards beyond Wechselbalg stealing it. And Brood is a second counter on top of the clock; it could fold into Egg-Painter's own text if the UI gets crowded.\n\n## 5. Tier check\n\n- **T1:** Pipit-Line Placer has a below-body 3 stats plus a ~2-stat Chick and a 1-point heave, about 0.6 body in a fight: on target. Bench Dozer is 6 stats (1.5 bodies), above the guide **on purpose**: it pays by missing the first hour.\n- **T2:** Oil-Can gives up to 6 permanent stats a turn (1 body), at the top of the range. Key-Winder is a plain enabler on a full body. Day-Wage pays about 1 gold a turn, 2 at most: normal T2 economy.\n- **T3:** Seven-Sleeper grows +4 a turn (0.6 body) but rarely fights; Egg-Painter's Brood +1 adds about 4–6 Chick stats per fight, every turn, cumulatively (~0.8 body); Warden and Wechselbalg give about 1 body in a fight each. All on target.\n- **T4:** Reedbed Placer gives ~2 bodies in a fight late on and less early (it grows with the enemy). Rohrsang gives ~1.2 bodies in a fight. Jar-Fattener gives ~1.3 bodies permanent with two or three sleepers. Coin-Turner is an enabler. The shape changed: **two enablers and two buffers**, because the economy lives at T2 and Coin-Turner's leftover-gold conversion takes the economy slot.\n- **T5:** Kasimir gives up to ~4 bodies in a fight when the front row is full and the Eggs hatch; Old Unruh about 3 bodies; Tower Doorkeeper is the multiplier (a Brann for hours). On target.\n- **T6:** Ottilie gives ~2.5 bodies permanent plus the pace multiplier; Gernegroß gives a copy of the enemy's best unit, 4–6 bodies in a fight; the Midsummer Leaver gives 3–6 bodies permanent, on wins only. Golden Ottilie with golden Doorkeeper is the ×4 ceiling, and the hour caps stop it there.\n\n## 6. Design rationale\n\n1. First puzzle: an effect timed by a fight's attack count, not by turns, so the player tunes *when* things happen, not just how much. That gave the clock with a 3-attack hour.\n2. Wind made the timing a dial you build, and Start of Combat's reading order gave a free positioning puzzle (lay first, then wind).\n3. Second puzzle: a body that's safe now but late, a better rate that isn't what you need right now. That became sleep.\n4. Seven-Sleeper grows only if it was never needed, so it fights your own Wind: one dial, three wants.\n5. Third puzzle: invest in the *opponent's* units and want them to live until the hour. That became the Egg, a marker on a host, not a slot-taker, so full boards still work.\n6. Chicks hatch in the enemy's row and hit their neighbours, which gives back-row access without a new targeting rule for the whole game.\n7. Wechselbalg copies the shared keywords, so how strong a Chick is depends on the enemy: a different puzzle each round, and a lot of Johnny surprises.\n8. Enemy-scaled Eggs (Reedbed, Gernegroß) keep Eggs relevant against strong boards, and their ceiling is someone else's board, so they can't feed themselves.\n9. The Midsummer Leaver turns in-fight Chick stats into permanent stats, the tribe's one leftover conversion, gated on winning.\n10. Coin-Turner turns gold you saved into Wind, so banking for a Tier up isn't dead time.\n11. Sleepers keep their text, so the Warden doubles as a guard for any tribe's engine. This use outside its purpose was the one I set out to find.\n12. The hour caps went onto every permanent hour effect after a check of golden Ottilie with golden Doorkeeper: without caps, growth would scale with fight length times the multipliers.\n","versions":[]},{"id":"cuckoo-clockworks--surgical","key":"cuckoo-clockworks-8762","seed":"cuckoo-clockworks","route":"surgical","tribe_name":"The Cuckoo Clockworks","status":"written","final_version":null,"stop_reason":null,"md":"# The Cuckoo Clockworks\n\n## 1. Identity\n\n**Core mechanic: a fight clock, and two things that happen when it strikes.** Cuckoo masters hide Eggs on enemy units; at the Hour they hatch as Chicks fed on their hosts and turn on them. Dormouse apprentices sleep through the start of the fight, safe, and wake at the Hour.\n\n**The Hour.** Each fight has a clock that counts attacks by both sides. The Hour strikes after every 4th attack. When it strikes: first Eggs hatch, then \"On the Hour\" effects happen, then Asleep units wake (the side that attacks first goes first, in reading order).\n\n**Wind N.** The clock starts each fight N attacks ahead, set after Start of Combat. At 4 or more the Hour strikes at once, before the first attack.\n\n**Lay an Egg.** Hide an Egg on an enemy unit (its host): the enemy across, or the nearest enemy if that slot is empty, unless the card names another. The Egg notes your **Chick share** of the host's Attack and Health at that moment: a quarter. An Egg isn't a unit, and a host can carry several. If the host dies first, the Egg is lost.\n\n**Hatch.** At the next Hour the Egg becomes a **Cuckoo Chick** (token, below) of yours, with the noted stats plus your **Brood**. Brood is the tribe's number: it starts at +0/+0, and cards raise it permanently. The Chick takes your empty slot nearest the one across from its host, then **shoves** the host, dealing its Attack to it. A shove isn't an attack, so the host doesn't hit back and nothing that triggers \"when attacked\" applies (Bitter, Bristle, Hunker, Nightshade). With no empty slot, the Chick shoves and flies off.\n\n**Asleep.** An Asleep unit can't attack or be attacked, and doesn't count as a unit left or for who attacks first. Its own effects still work. It wakes at the next Hour after it fell asleep. **The alarm:** if nothing of yours is awake, your Asleep units wake at once.\n\n**How it plays.** You scout your next opponent's last board for hosts: their biggest units will feed your Chicks. In the recruit phase you place Layers by what sits across from them. A Layer in your back row lays on their back row, which is safe until their front row falls, so the Egg lives to hatch. You also choose how many slots to leave empty, as nest boxes for Chicks to land in. Fewer units means you attack second and fewer survivors count for hero damage, so every hole is a bet. The dormice give you a second axis: put any unit to sleep, of any tribe, to keep it safe from the opening trades and grow it in its jar. In the fight, the clock face sits over the board: you watch the hand move and the doors open.\n\n## 2. The 19 units\n\nTribe: Clockworks (cuckoos and dormice). \"Biggest\" = most Attack + Health.\n\n| Name | T | A/H | Text | Golden |\n|---|---|---|---|---|\n| Dunnock-Line Fledgling | 1 | 2/2 | Start of Combat: Lay 1 Egg. | 4/4. Lay 2 Eggs. |\n| Jar Dormouse | 1 | 1/3 | Asleep. When this wakes, it gains +2/+2 for the fight. | 2/6. +4/+4. |\n| Egg-Painter | 2 | 2/4 | End of Turn: your Brood gains +1/+1 permanently. | 4/8. +2/+2. |\n| Curfew Warden | 2 | 3/3 | Start of Combat: put the biggest other unit next to this to sleep. It wakes with +3/+3 for the fight. | 6/6. +6/+6. |\n| First-Call Herald | 2 | 2/4 | The first time the Hour strikes each fight, gain 1 gold next turn. | 4/8. 2 gold. |\n| Reed-Line Journeyman | 3 | 3/4 | Start of Combat: Lay 1 Egg on the enemy with the most Attack. If the host of one of your Eggs dies, that Egg hatches at once (nothing to shove). | 6/8. Lay 2 Eggs. |\n| Key-Turner | 3 | 2/5 | Wind 2. | 4/10. Wind 4. |\n| Glirarium Keeper | 3 | 3/4 | On the Hour: your Asleep units gain +2/+1 permanently. Twice a fight. | 6/8. +4/+2. |\n| Door Cuckoo | 3 | 3/4 | On the Hour: Lay 1 Egg on a random enemy. | 6/8. Lay 2 Eggs. |\n| Call-Tuner of Bellows Hall | 4 | 4/5 | When a Chick of yours hatches, your Brood gains +1/+1 permanently. Twice a fight. | 8/10. +2/+2. |\n| Nest-Box Dormouse | 4 | 3/6 | Once a fight, when a Chick of yours appears next to this, this eats it and gains half its Attack and Health permanently. | 6/12. Gains all of them. |\n| Pipit-Moor Placer | 4 | 3/6 | Start of Combat: Lay 1 Egg on each enemy in the back row. | 6/12. 2 Eggs on each. |\n| Frau Wechselbalg, Keeper of Patterns | 4 | 4/4 | Once a turn, after a fight in which a Chick of yours hatched: Discover a unit of that Chick's host's tribe. | 8/8. Discover 2. |\n| Grand Horologe Ottilie Gugger | 5 | 5/7 | Your units' Start of Combat effects wait for the first Hour, then happen twice. | 10/14. Three times. |\n| Little Gernegroß | 5 | 5/7 | Start of Combat: hide as an Egg on the biggest enemy; this slot stays his. When he hatches, he returns to it with twice your Chick share of the host's stats added, then shoves it. | 10/14. Four times. |\n| Mother Rohrsang | 5 | 4/8 | Also a Bird. Your Chick share is half, not a quarter. | 8/16. All of the host's stats. |\n| Hour-Keeper of the Tower | 6 | 6/9 | The Hour strikes every 2 attacks, not 4. | 12/18. Every attack. |\n| Kasimir the Peddler | 6 | 6/8 | Start of Combat: Lay 1 Egg on every enemy. | 12/16. 2 Eggs on every enemy. |\n| Old Unruh | 6 | 4/10 | Asleep; only the alarm wakes him. Each Hour he sleeps through: he gains +3/+3 permanently and your other units gain +1/+1 for the fight. Up to 4 times a fight. | 8/20. +6/+6 and +2/+2. |\n\n**Token.** *Cuckoo Chick* (Tier 1 Clockworks): stats from its Egg plus your Brood, at least 1/1. It lasts for the fight only and doesn't add hero damage, because it didn't start the fight.\n\nNo spells or items.\n\n### How the pieces cross\n\n- **Safe hosts.** Fledglings and Kasimir lay \"across\", so slot choice picks the host; the Placer always lays on the back row, the hosts least likely to die before the Hour.\n- **Wind and reading order.** Two Key-Turners (or one golden) make the Hour strike straight after Start of Combat: Eggs hatch before any host can die, the Herald always pays, and Ottilie's delay costs nothing.\n- **Gernegroß and Rohrsang.** He takes twice your Chick share; under Rohrsang that is all of the biggest enemy's stats, plus his own, and then he shoves it.\n- **Eating your young.** Nest-Box Dormouse turns a temporary Chick into permanent stats that track the enemy's size and your Brood. You leave the slot next to it empty on purpose.\n- **The sleeping carry.** Curfew Warden can sleep any tribe's unit: it skips the opening trades, the Keeper grows it permanently, and it wakes with +3/+3.\n- **Old Unruh as the last line.** He can't be attacked all fight; when everything else of yours is dead, the alarm wakes him, much bigger, Keeper-pumped.\n\n## 3. Builds\n\n**The Brood (eggs wide).** Fledglings, Door Cuckoo, Pipit-Moor Placer and Kasimir for Eggs; Egg-Painter and Call-Tuner for Brood; Rohrsang to double the share. Play five or six units and leave the rest of the slots as nest boxes. It is strongest against big, tall boards: it feeds on the opponent's scaling and its shoves ignore defensive keywords. *Lobby mixes:* with **Fairies**, leave a Ring slot empty so a Chick lands in it (if Rings apply mid-fight). With **Bog folk** or **Hunters**, the Journeyman's early hatch turns Snap and Quarry kills into Chicks instead of lost Eggs. If Harvest Supper's tribe bonus reaches Chicks, it becomes a second Brood.\n\n**The Sleeping Vault (protect and grow).** Jar Dormice, Curfew Wardens, the Glirarium Keeper, Old Unruh and a Key-Turner. Take your best unit from another tribe, a Hedgerow runner or an Ooze with a full Belly, and put it to sleep beside a Warden. It dodges the opening trades and Start of Combat damage, grows in its jar and wakes buffed. *Mixes:* **Hedgerow** Pass X lands on the rightmost unit, so a sleeper parked at the right end banks it safely. Any tribe with one carry and weak support fits.\n\n**Clockwork (timing).** Ottilie, Key-Turners, the Hour-Keeper of the Tower, Door Cuckoo, Herald and Gernegroß, plus the best Start of Combat units the lobby offers from any tribe. Wind sets the first Hour on attack 0 to 2, and Ottilie doubles everything. *Mixes:* this is the bridge build, because it takes in whichever tribe has the strongest Start of Combat cards.\n\n**The Changeling splash.** Two Fledglings, a Pipit-Moor Placer and Frau Wechselbalg as a four-card package inside another tribe's comp. Each turn a Chick hatches, Wechselbalg Discovers from the host's tribe. You pivot into your opponents' tribes or finish triples with Created copies. It mixes with anything.\n\n## 4. Risks and holes\n\n- **Rules load.** Three new ideas (the Hour, Eggs/Chicks/Brood, Asleep) plus a snapshot rule and a room rule. They only read well if the screen shows them: a clock face over the fight, Egg markers on enemies, sleeping units drawn in jars. This is the biggest risk.\n- **Room can feel bad.** Late boards are full, and Chicks with nowhere to land only shove. That is the tribe's governor and its key decision, but players may not see why their Eggs \"did nothing\". It also ties into the open question of whether the unit count for who attacks first is set before or after Start of Combat (Gernegroß hides then).\n- **Layer value rides on Brood,** as token summoners ride on token buffs. A midgame Chick can be 2× a Tier 3 unit's in-fight target. Watch the Brood totals, not the Layers.\n- **Shove ignores defensive keywords.** That is intended as a counter to Bog folk and Bristle, but it may be too clean a counter. If needed, let Bristle apply to shoves.\n- **Asleep against other tribes' targeting is undefined:** Mire, Quarry, Snap and Swoop pointed at a sleeper. Proposed ruling: treat an Asleep unit as absent until it wakes.\n- **Ottilie doubles other tribes' Start of Combat cards.** Every one of them needs a check at ×2, and ×3 when golden.\n- **The clock is shared.** Wind and the Tower speed up the enemy's Hour too. That only matters in Clockworks mirrors, but it is odd.\n- **Golden Hour-Keeper (every attack)** with Door Cuckoo makes a lot of Eggs. Room and Old Unruh's cap of 4 limit it, but it needs a sim.\n- **Weak start against small boards.** Chicks of 2/3 hosts are 1/1s. Jar Dormouse and Curfew Warden carry Tiers 1 and 2; the Egg side comes online once Brood has grown.\n- **Wechselbalg's free unit a turn** may be too much economy. The fallback is \"a Chick of yours survived the fight\".\n\n## 5. Tier check\n\nMidgame assumptions: Brood about +3/+3, hosts about 10/10 at Tier 4, an Egg hatches about 60% of the time.\n\n- **T1:** Fledgling is the seed: an early 1/1 Chick (about 2 to 3 in fight, matching ~0.6 body) that scales with Brood all game. Jar Dormouse gives +4 in fight (1 body, above ~0.6) because it spends the opening asleep and can't attack.\n- **T2:** Egg-Painter adds +2 per Chick per turn (about 4 to 6 with 2 to 3 Chicks, top of 0.3–1). Warden gives +6 in fight plus protection (~1 body). Herald gives 1 gold a turn, a third of a unit.\n- **T3:** Journeyman and Door Cuckoo each make about one Chick (≈ 7 to 9 expected, inside 0.7–1.4). Keeper gives 3 per sleeper, about 6 to 9 permanent (~0.8 to 1.2). Key-Turner gives nothing alone, on purpose: it is a pure enabler, paid for with a 2/5 body.\n- **T4:** Call-Tuner adds 2 to 4 Brood per turn, about +12 across Chicks (~1.4). Nest-Box adds about +8 to +12 permanent (~1.3). The Placer makes up to 3 Chicks (≈ 2 to 3 bodies in fight; high, governed by room). Wechselbalg is
