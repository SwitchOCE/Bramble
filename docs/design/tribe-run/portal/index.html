ict_why":"The engine and curve work; one real rules gap (whether a Gust counts as an attack) needs settling before it plays as written.","points":[{"pid":"p1","uid":null,"kind":"fix","text":"Say whether a Gust counts as an attack. The Föhn ruling says yes, but then Lady High Pressure's 'first 3 attacks don't happen' would cancel enemy Gusts and Gale cards that react to attacks fire on Gusts, and players can't tell which."},{"pid":"p2","uid":"u12","kind":"fix","text":"Old Föhn makes enemy units Gust; against another Gale player, say whether those count as their friendly Gusts for Mares' Tails, the Warden and Thunder. As written the keyword's 'never counts enemy ones' doesn't settle it."},{"pid":"p3","uid":null,"kind":"idea","text":"Tier 4 has no lasting growth, so the board stalls between Red Sky and the Warden. A Tier 4 card that turns Gusts into permanent stats on the Announced unit, smaller than the Warden, would smooth the curve."},{"pid":"p4","uid":"u19","kind":"idea","text":"The Warden with the Helm gives two Announced units +20/+20 a fight each, and golden or copied by Sir Vane doubles again. Keep it hot; it's the build's chase, just give the owner a number to watch."},{"pid":"p5","uid":"u09","kind":"idea","text":"The Barometer Clerk's gold arrives only once the storm is already running, when gold matters least. Paying on 2 Gusts, or growing the Announced unit instead of itself, would give it a job."}],"standouts":[{"uid":"u17","why":"Duke Cumulonimbus is a real capstone: the board is arranged to feed him Thunder and keep the Crier's forecast from firing him early."},{"uid":"u10","why":"The Helm turns the Announced tension into a second carry and doubles every Announced payoff, a proper Tier 4 multiplier."},{"uid":"u03","why":"Red Sky at Night starts the Announced carry at Tier 2 and makes 'what do I play last' matter from the first shops."}],"weakest":[{"uid":"u05","why":"Mr and Mrs Fair-and-Foul give half a gold a turn and a Gust every other fight; neither half does enough."},{"uid":"u09","why":"The Barometer Clerk pays gold late and otherwise grows only itself."},{"uid":"u13","why":"The Bag-Bearer is a 4/4 with a small item; fine glue, little Tier 4 output."}],"flags":[{"uid":"u19","kind":"watch","note":"Warden plus Helm is about 80 permanent stats a fight, 160 golden, more with Sir Vane copying it; capped per fight but steep."},{"uid":"u18","kind":"watch","note":"Shutting off all enemy Start of Combat effects hard-counters whole builds, other Gale players included."},{"uid":"u14","kind":"watch","note":"Sir Vane copying a Tier 6 capstone at Tier 5, and golden Vane copying two, is the highest roll in the tribe."},{"uid":"u16","kind":"watch","note":"With the Wild Hunt, every Gust is a free hit; with the Duke's 10 Gusts and the Crier, the enemy front row can vanish before a normal attack."},{"uid":"u18","kind":"unclear","note":"Whether the enemy's Gusts count among 'the first 3 attacks' is not said."}]},{"id":"v1--reader","design_id":"gale-court--player-story","v":1,"member":"reader","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"Choosing who to play last, and carrying another tribe's best unit as the Announced one, is a real shop puzzle every turn, and the fight pays it off with a visible storm.","distinct":"Announced is a fresh shop word no tribe has; Gust itself is close to familiar start-of-combat strikes, which holds it at 7."},"verdict":"iterate","verdict_why":"Two rules a player can't settle from the cards (does a Gust count as an attack, and when Fair-and-Foul pays) need one clear line each; the rest reads well.","points":[{"pid":"p1","uid":null,"kind":"fix","text":"Say once whether a Gust counts as an attack. The Thunderhead's \"attacks or Gusts\" treats them as different, but the Föhn ruling calls forced Gusts enemy attacks, so a player can't tell whether Lady High Pressure cancels enemy Gusts or Föhn's forced ones."},{"pid":"p2","uid":"u05","kind":"fix","text":"Mr and Mrs Fair-and-Foul flips at Start of Turn and Fair pays at Start of Turn; say whether it pays on the turn it flips. The Risks section also calls it the Weather House, so pick one name."},{"pid":"p3","uid":"u12","kind":"idea","text":"Old Föhn's 7 Health dies to the first big forced Gust, so the remaining two never happen against exactly the big-attacker lobbies the Ill wind build targets. Hunker or Damage Reduction during his forced Gusts would let his job happen."},{"pid":"p4","uid":"u17","kind":"idea","text":"The Thunderhead is the most text in the tribe; showing the Thunder count on the card and marking him \"strikes last\" on his slot would keep the puzzle and make it readable at a glance."},{"pid":"p5","uid":"u10","kind":"idea","text":"The Helm being always Announced is the best joke in the tribe; let his banner sit permanently on his slot so the second Announced unit is easy to spot."}],"standouts":[{"uid":"u10","why":"The Helm who mentions his name to everyone is always Announced: lore and rule are the same thing, and it eases the tribe's main tension."},{"uid":"u18","why":"Lady High Pressure forbids anything to happen and hands the enemy's opening to your court; one read and you get it."},{"uid":"u14","why":"Sir Vane the weathercock changes sides with whatever you played last; the fickle courtier as a card."}],"weakest":[{"uid":"u08","why":"Mares' Tails is a plain Gust buffer, and the name says nothing about what it does."},{"uid":"u03","why":"Red Sky at Night is a flat End of Turn buff whose weather lore doesn't show in the rule."},{"uid":"u12","why":"Old Föhn reads backwards at first glance (enemies attack him), and he usually dies before his three forced Gusts finish."}],"flags":[{"uid":"u19","kind":"watch","note":"Up to +20/+20 a fight on each Announced unit, permanently, twice with the Helm; worth the owner's eye with Sir Vane copying it."},{"uid":"u18","kind":"watch","note":"Shutting off every enemy Start of Combat effect may feel bad to face for some tribes."},{"uid":"u17","kind":"unclear","note":"Whether his own Thunder Gusts or Gusts from a Crier count as \"the first time\" needs the attack/Gust line from p1."}]}],"ratings":{"fun":7.0,"distinct":7.0},"votes":{"settle":0,"iterate":3}},{"v":2,"summary":"Settled the main rules gap: a Gust is an attack but not a normal attack, so Lady High Pressure, Old Föhn and the Thunderhead now read one way.\nFöhn's forced Gusts no longer feed an enemy Gale engine and he gains Hunker; Fair-and-Foul and the Barometer Clerk now feed the Announced unit and the Gust count.","data":{"design_id":"gale-court--player-story","v":2,"identity":{"tribe_name":"The Gale Court","mechanic":"All three moments are about going out of turn: who gets announced in the shop, and who strikes before the rest in the fight. So the tribe has one fight keyword and one shop word.","keywords":[{"name":"Gust","text":"the unit makes one attack right now, out of the usual order. A Gust is an attack: it picks a target as usual (a random front-row enemy), both units deal damage as usual, and anything that reacts to attacks (Bristle, Bitter, Mire, the Windhover) reacts to it. It is not a normal attack: it does not use up the unit's normal attack, and text about \"normal attacks\" ignores it. A dead unit can't Gust. Gusts queue up and resolve one at a time. Anything that counts \"friendly Gusts\" never counts enemy ones."},{"name":"Announced","text":"your Announced unit is the last unit you played, as long as it stays on your board. Playing any unit, of any tribe, Announces it; selling or losing it leaves nobody Announced until you play again. A banner on its slot shows which unit it is."}],"plays":"Early on, Gale units are small bodies that sneak in a free hit before the fight starts. From Tier 2 the shop turns into a seating puzzle. *Which unit do I play last?* That one gets the Court's buffs and Gusts, and it can belong to any tribe, so a Gale player often carries another tribe's best unit. *Where does everyone sit?* Reading order decides who Gusts first, whether the Crier's forecast runs down the whole line, and whether the Thunderhead gets to strike last. In the fight, a stack of Gusts feeds three kinds of payoff: Gusts counted up for one late, loud finish; Gusts that leave permanent stats behind; and Gusts that pump the Announced unit. Sir Vane copies whatever you played last, and Old Föhn makes the *enemy* Gust into your thorns."},"units":[{"uid":"u01","name":"Gust Page","tier":1,"attack":2,"health":3,"text":"Start of Combat: if no friendly unit has Gusted yet this fight, this Gusts.","golden":"4/6. ...this Gusts twice."},{"uid":"u02","name":"Swift Courier","tier":1,"attack":1,"health":3,"text":"Takes no damage while it Gusts. After this Gusts: permanently gain +1/+1 (twice a fight).","golden":"2/6. ...+2/+2 (twice a fight)."},{"uid":"u03","name":"Red Sky at Night","tier":2,"attack":3,"health":3,"text":"End of Turn: your Announced unit permanently gains +1/+2.","golden":"6/6. ...+2/+4."},{"uid":"u04","name":"Hayrick Whirlwind","tier":2,"attack":2,"health":4,"text":"Start of Combat: if your Announced unit is next to this, it Gusts.","golden":"4/8. ...it Gusts twice."},{"uid":"u05","name":"Mr and Mrs Fair-and-Foul","tier":2,"attack":2,"health":4,"text":"Arrives Foul. Start of Turn: switch between Foul and Fair; if it is now Fair, gain 1 gold. Foul: Start of Combat: your Announced unit Gusts.","golden":"4/8. ...gain 2 gold. Foul: ...your Announced unit Gusts twice."},{"uid":"u06","name":"Countess Bora","tier":3,"attack":3,"health":4,"text":"Start of Combat: this Gusts. This unit's Gusts also hit the units beside the target.","golden":"6/8. ...this Gusts twice."},{"uid":"u07","name":"The Windhover","tier":3,"attack":2,"health":5,"text":"After an enemy attacks: this Gusts at the enemy with the least Health, in any row (three times a fight).","golden":"4/10. ...(six times a fight)."},{"uid":"u08","name":"Mares' Tails","tier":3,"attack":3,"health":4,"text":"After another friendly unit Gusts: that unit permanently gains +1/+1 (three times a fight).","golden":"6/8. ...+2/+2 (three times a fight)."},{"uid":"u09","name":"The Barometer Clerk","tier":3,"attack":3,"health":4,"text":"Start of Turn: gain 1 gold for every 3 times your units Gusted last fight (up to 2 gold). If you gained none, your Announced unit permanently gains +1/+1.","golden":"6/8. ...2 gold for every 3 times (up to 4 gold). ...+2/+2."},{"uid":"u10","name":"The Helm","tier":4,"attack":4,"health":5,"text":"The Helm is always Announced, as well as the last unit you played. Start of Combat: each Announced unit Gusts.","golden":"8/10. ...each Announced unit Gusts twice."},{"uid":"u11","name":"Lord Mistral, Warden of the Rhône","tier":4,"attack":5,"health":4,"text":"After a friendly unit's Gust kills its target: that unit Gusts again (once per unit a fight).","golden":"10/8. ...(twice per unit a fight)."},{"uid":"u12","name":"Old Föhn","tier":4,"attack":3,"health":7,"text":"Bristle 3. Hunker. Start of Combat: the 3 enemies with the most Attack each Gust at this. These Gusts count for none of the enemy's cards.","golden":"6/14. Bristle 6."},{"uid":"u13","name":"The Bag-Bearer","tier":4,"attack":4,"health":4,"text":"When played: get a Bag of Winds.","golden":"8/8. ...get two Bags of Winds."},{"uid":"u14","name":"Sir Vane, the Weathercock","tier":5,"attack":5,"health":6,"text":"Faces the last other unit you played (not a Sir Vane) while it stays on your board: has its tribe and its text, but not its stats.","golden":"10/12. Faces the last two other units you played: has both tribes and both texts."},{"uid":"u15","name":"The Forecast Crier","tier":5,"attack":4,"health":8,"text":"Start of Combat: each unit after this in reading order Gusts, one at a time, stopping at the first unit that isn't Gale Court.","golden":"8/16. ...each of them Gusts twice."},{"uid":"u16","name":"Master of the Wild Hunt","tier":5,"attack":6,"health":6,"text":"Your units take no damage while they Gust. After a friendly unit's Gust kills its target: that unit permanently gains +2/+2.","golden":"12/12. ...+4/+4."},{"uid":"u17","name":"Duke Cumulonimbus, the Thunderhead","tier":6,"attack":7,"health":7,"text":"Attacks after your other units each cycle. After another friendly unit Gusts: gain a Thunder (up to 10). The first time this attacks each fight (a Gust counts), it then Gusts once per Thunder.","golden":"14/14. ...Gusts twice per Thunder."},{"uid":"u18","name":"Her Serene Stillness, Lady High Pressure","tier":6,"attack":5,"health":10,"text":"Enemy Start of Combat effects don't happen. The enemy's first 3 normal attacks each fight don't happen (Gusts aren't normal attacks); after each one, your Announced unit Gusts instead.","golden":"10/20. ...first 6 normal attacks..."},{"uid":"u19","name":"Warden of the Tower of the Winds","tier":6,"attack":6,"health":8,"text":"After a friendly unit Gusts: your Announced units permanently gain +2/+2 (ten times a fight).","golden":"12/16. ...+4/+4 (ten times a fight)."}],"extras":[{"uid":"x01","kind":"other","name":"Bag of Winds","text":"give a unit, permanently, +2/+2 and \"Start of Combat: this Gusts.\" A unit can hold only one Bag."},{"uid":"x02","kind":"other","name":"Ruling","text":"Sir Vane copies text that triggers or applies from now on. A copied \"When played\" doesn't run again. If he copies the Helm, he becomes Announced too, but he still faces the last unit you played, so nothing loops. If he copies a tribe, he loses Gale Court, which can cut the Crier's forecast short."},{"uid":"x03","kind":"other","name":"Ruling","text":"Old Föhn's forced Gusts are attacks by the enemy units: they set off your Windhover, Bristle, Bog folk Bitter and Soak, and Hunker. They count for none of the enemy's cards: no Thunder, Mares' Tails, Warden, Barometer count, Mistral re-Gust or Wild Hunt protection. Lady High Pressure doesn't cancel them, because they are Gusts, not normal attacks. If Föhn dies first, the remaining forced Gusts don't happen."},{"uid":"x04","kind":"other","name":"Ruling","text":"When both players field Lady High Pressure, neither side's Start of Combat effects happen."}],"builds":[{"name":"Storm front (count the Gusts)","text":"Gust Pages, Countess Bora, the Forecast Crier in F1 with Gale units in reading order behind it, Lord Mistral to chain kills, and the Thunderhead in B3. The puzzle is the Duke's \"first time this attacks (a Gust counts)\". If the Crier's forecast reaches him early, he fires with almost no Thunder. So you put a non-Gale unit just in front of him to stop the forecast, or leave him out of the line, or park him behind a Gale unit that won't Gust. The Barometer Clerk pays for the rolls. Strong against wide boards, weak against Bog folk Mire and Bitter."},{"name":"The Announced court (play order)","text":"Red Sky at Night, Hayrick Whirlwind, the Helm, Sir Vane and the Warden, with any tribe's best unit as the carry. Every turn asks two things: what to play last, and whether to play anything at all. Playing even a triple-up changes who's Announced, so holding a big Announced unit sometimes means passing on a buy. The Helm eases this by being Announced too, and the Warden turns every friendly Gust into stats for both Announced units. Lady High Pressure caps the build: she steals the enemy's opening and hands it to the Announced unit."},{"name":"Never land (Couriers)","text":"Triple the Swift Courier early for a golden, then add Mares' Tails, a Bag of Winds on the Courier, and Master of the Wild Hunt so every gusting unit hits for free. Gust sources sit in front of the Couriers in reading order. It's the slowest build to come online and grows the most."},{"name":"Ill wind (punish their attacks)","text":"Old Föhn, the Windhover, Bristle neutrals and, if the lobby has them, Bog folk. Föhn makes their three biggest units hit his thorns before anything else happens, and each of those hits lets the Windhover snipe their weakest unit. A defensive build for lobbies full of big attackers."},{"name":"Mixing with other tribes","text":"**Hunters:** a Hunter with a Bag of Winds Gusts at its Quarry and gets its Take sooner. A gusting Gale unit beside a Pack Hunter pulls the Hunter into the attack, but uses up the Hunter's own attack. **Birds:** a Swoop unit's Gusts reach the back row. A Bird coming home from Fly South with doubled stats makes a ready-made Announced unit. **Fairies:** a Ring-buffed unit makes a good Announced or Bag carrier. A Shy unit can't take the Court's untargeted buffs. **Oozes:** the Windhover snipes an enemy Ooze early, so its Belly comes out at a time you choose. A friendly Ooze can Eat a big Courier. **Hedgerow folk:** Pass X goes to your rightmost other unit, so seat a Courier there. **Bog folk:** the natural counter (Mire soaks Gusts, Bitter shrinks gusters); on your side, they fit Ill wind."}],"risks":["**Readability of a Gust storm.** A late board can fire 15 or more out-of-turn attacks. That needs a clear Gust animation, a Thunder counter on the Duke and a Gust counter for the Barometer. If fights get too long to follow, cap Gusts per fight (say 12 per side).","**Gusting hurts the Gale player.** Gusts trade damage both ways, so small Gale units can kill themselves on Bristle and Bitter. Only the Courier and the Wild Hunt protect them. That's intended as a counter, but early Gale boards may feel brittle.","**Lady High Pressure may feel bad to face.** Shutting down all enemy Start of Combat effects hard-counters some builds. If it plays too hard, keep the stolen attacks and limit the shutdown to the enemy across from her.","**Sir Vane is the most dangerous card.** He doubles a capstone from Tier 5: two Thunderheads, two Wardens, two High Pressures (the doubled shutdown is harmless; the attacks it steals add up). Watch golden Vane copying two capstones. The fallback is \"can't copy Tier 6 units\".","**Mixed feedback loops.** The Warden's stats on the Announced unit help it kill, and kills feed Mistral's re-Gusts, which feed the Warden. The per-fight caps (Warden ten, Mistral once per unit) keep each loop bounded, so it isn't self-feeding without limit, but it should get the two-pass runaway check.","**The Announced-unit tension may frustrate players** who lose their Announced unit to a needed buy. The Helm is the release valve; if that isn't enough, add a spell that Announces a chosen unit.","**Holes:** no Shield, Damage Reduction or Hunker of its own, so it leans on neutrals; Mr and Mrs Fair-and-Foul's gold every other turn may be too slow to matter."],"tier_check":[{"tier":1,"note":"Gust Page is the tempo body: one free 2-damage hit is about 0.5–0.6 body in fight, on target. Swift Courier is the seed. At up to +2/+2 a fight it grows about 1 body a turn in a good setup, roughly 2.5× the 0.4 target. That's on purpose: it's the growth moment's carry, it needs two outside Gust sources, and it does nothing alone."},{"tier":2,"note":"Red Sky at Night (buffer, +3 stats a turn, about 0.5 body) and Hayrick Whirlwind (enabler, one Gust by the Announced unit, about 1 body) are on target. Fair-and-Foul (economy) is light at about 0.5 gold a turn, and gives the Announced unit a Gust on alternate turns."},{"tier":3,"note":"Bora and the Windhover (enablers) give about 1–1.3 bodies in fight. Mares' Tails (buffer) gives up to 6 stats a turn, about 0.85 body. The Barometer Clerk (economy) gives up to 2 gold a turn in a storm, or +2 stats to the Announced unit. All on target."},{"tier":4,"note":"the Helm (two Gusts plus a second Announced, so a multiplier), Mistral (engine, about 2 bodies in fight), Föhn (tempo: about 18 damage forced into enemies, about 2 bodies; Hunker lets him live through all three) and the Bag-Bearer (enabler, a lasting Gust plus +2/+2). I broke the shape: no pure buffer here, because the Court's permanent buffs sit at Tiers 2, 3 and 6 and Tier 4 is where Gusts start to multiply."},{"tier":5,"note":"the Crier (combat engine, up to 6 Gusts, about 4 bodies in fight), the Wild Hunt (direction, free Gusts plus about 1.5 bodies a turn from kills) and Sir Vane (multiplier, worth whatever he copies). Vane copying a Tier 6 card is the one well-outside case. He's kept because he carries the shop moment, and the fallback is noted under Risks."},{"tier":6,"note":"the Thunderhead (capstone, up to 10 extra attacks, about 5 bodies in fight on top of the Gusts it feeds), Lady High Pressure (capstone, enemy Start of Combat shut off plus 3 stolen attacks, about 6 bodies) and the Warden (payoff, up to 40 stats a turn per Announced unit, 3–6 bodies, top about 10 with the Helm). On target. Goldens double, and golden Vane on two capstones is the high roll."}],"rationale":["I wrote the three moments first. All of them are about going out of turn, so the mechanic is \"act out of order\".","**Gust is a normal attack out of turn,** not a free ping. It works with every shared keyword (Cleave, Swoop, Bristle, Mire, Bitter, Pack), which is the overlap Johnny wants.","**Announced (the last unit you played)** brings the court's precedence into the shop, works on any tribe, and makes play order a decision every turn.","The Gust Page's \"if no one has Gusted yet\" turns the pages' quarrel into a seating choice instead of a stacking bonus.","The Courier's \"takes no damage while it Gusts\" lets a Tier 1 card carry the growth moment without dying to its own attacks.","Payoffs come in three kinds (count the Gusts, stats from Gusts, stats to the Announced unit) so the same Gust sources serve different builds.","The Thunderhead's \"first time it attacks *or Gusts*\" makes the forecast a hazard for him, a puzzle inside the tribe's own engine.","The Crier stops at the first non-Gale unit, so using other tribes has a cost, and Sir Vane changing tribe can break the line.","Old Föhn makes the *enemy* Gust. It's the \"use it for something it wasn't meant for\" card, and it ties into Bog folk and Bristle.","The Bag of Winds hands Gust to any unit, so cross-tribe boards can join the storm.","Every Gust trigger has a per-fight cap (twice, three times, once per unit, up to 10), so loops stay bounded.","Names and lore came last: the European winds, the weathercock, the weather house, the Shipping-Forecast crier and the windhover went to the cards whose jobs fit them."],"changes":[{"uid":"identity","kind":"changed","what":"Gust keyword now says a Gust is an attack, but not a normal attack.","why":"Players couldn't tell what reacts to Gusts; one line now settles Bristle, the Windhover, High Pressure and the Thunderhead.","from":["v1--climber#p1","v1--reader#p1"]},{"uid":"u05","kind":"changed","what":"Flips first, then pays if now Fair; Foul makes your Announced unit Gust, not itself.","why":"Timing was unclear; the Foul half now feeds play order, so both halves do a job.","from":["v1--reader#p2","v1--combo#p4"]},{"uid":"u09","kind":"changed","what":"Pays 1 gold per 3 Gusts (up to 2); otherwise grows the Announced unit, not itself.","why":"Gold now scales with the storm, and the fallback joins the Announced build.","from":["v1--combo#p3","v1--climber#p5"]},{"uid":"u12","kind":"changed","what":"Gains Hunker; his forced Gusts count for none of the enemy's cards.","why":"Against another Gale player his forced Gusts fed their engine; Hunker lets him survive all three.","from":["v1--climber#p2","v1--reader#p3"]},{"uid":"u17","kind":"changed","what":"\"First time this attacks or Gusts\" becomes \"first time this attacks (a Gust counts)\".","why":"Follows the new Gust line, so a Crier Gust clearly sets him off early.","from":["v1--reader#p1","v1--climber#p1"]},{"uid":"u18","kind":"changed","what":"Cancels the enemy's first 3 normal attacks; Gusts, Föhn's forced ones included, still happen.","why":"It was unclear whether she cancelled enemy Gusts; now she and Föhn work together.","from":["v1--combo#p1","v1--climber#p1","v1--combo#p2"]},{"uid":"x03","kind":"changed","what":"Ruling says forced Gusts count for none of the enemy's cards and High Pressure doesn't cancel them.","why":"Settles Föhn against another Gale player and alongside Lady High Pressure.","from":["v1--climber#p2","v1--combo#p1"]}],"declined":[]},"reviews":[{"id":"v2--combo","design_id":"gale-court--player-story","v":2,"member":"combo","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"Which unit to play last is a real choice every turn, any tribe can be the carry, and the Crier, the Thunderhead and the Gust Page make seating a puzzle.","distinct":"Gust alone is a familiar extra attack, but Announced brings play order into the shop and Old Föhn turns the enemy's own attacks into your engine, which no tribe today does."},"verdict":"settle","verdict_why":"Nothing is broken or unreadable; the open points are combo ideas and balance watches the owner can tune later.","points":[{"pid":"p1","uid":"u18","kind":"idea","text":"Lady High Pressure's cancelled attacks don't happen, so they never set off the Windhover or Bristle. Letting them count as enemy attacks for your cards would join her to the Ill wind build."},{"pid":"p2","uid":"u03","kind":"idea","text":"Red Sky at Night only rewards keeping the same Announced unit. If it also paid the unit that just lost Announced, swapping your carry on purpose would become a choice, like the fickle weathercock."},{"pid":"p3","uid":"u13","kind":"idea","text":"The Bag-Bearer just hands out an item. A Bag put on the Announced unit could do more (say, Gust twice), which ties it to play order."},{"pid":"p4","uid":"u14","kind":"idea","text":"Sir Vane played last becomes the Announced unit while he copies the unit played before him, so he can copy the Swift Courier and soak every Announced buff with no damage. Worth writing up as a named build."},{"pid":"p5","uid":"u12","kind":"idea","text":"Old Föhn with the Windhover is the best cross-card trick here: three forced enemy Gusts become three snipes before the fight starts. A second card that cares about enemy Gusts would give Ill wind more to draft."}],"standouts":[{"uid":"u12","why":"Makes the enemy attack into his thorns, and sets off the Windhover and Bog folk on your side."},{"uid":"u14","why":"Copies whatever you played last, which can take him out of Gale Court and cut the Crier's line short: a play-order puzzle on one card."},{"uid":"u17","why":"The Crier can set him off too early, so where he sits inside your own engine is a real choice."}],"weakest":[{"uid":"u13","why":"Hands out one Bag of Winds and has no other interaction."},{"uid":"u09","why":"A gold counter with an Announced fallback. It works but adds no new combo."},{"uid":"u01","why":"Several Pages just cancel each other; the seating choice it adds is small."}],"flags":[{"uid":"u18","kind":"watch","note":"Shutting off enemy Start of Combat effects removes most of a mirror Gale board's Gusts. It is a near-lock in the mirror."},{"uid":"u14","kind":"watch","note":"Copying the Warden or the Thunderhead doubles a capstone from Tier 5. Golden Vane on two capstones is a big spike."},{"uid":"u19","kind":"watch","note":"With the Helm and a golden Warden or a Vane copy, each Announced unit can gain about 60/60 a fight, permanently."}]},{"id":"v2--climber","design_id":"gale-court--player-story","v":2,"member":"climber","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"Choosing what to play last and where to seat it is a real decision every turn, and the growth goes from Courier and Red Sky early to the Warden's flood late, so the board keeps climbing.","distinct":"Announced puts the tribe's payoff on any tribe's best unit, and out-of-turn Gusts that you have to sequence play unlike today's tribes. Extra attacks on their own are a familiar auto-battler idea."},"verdict":"settle","verdict_why":"Every tier does its job and every loop has a per-fight cap; more passes would change the flavour, not improve the climb.","points":[{"pid":"p1","uid":"u19","kind":"idea","text":"The Warden's +20/+20 a fight per Announced unit, doubled by the Helm and again by Sir Vane, makes Tier 6 the whole game. A Tier 5 taste of it, such as a smaller cap, would smooth the climb from Tier 4 to 6."},{"pid":"p2","uid":"u01","kind":"idea","text":"Gust Page stops working once Bora or the Helm Gusts first. It could gain +1/+1 when it doesn't Gust, so it stays useful in the midgame."},{"pid":"p3","uid":"u13","kind":"idea","text":"The Bag-Bearer is thin for Tier 4: one Bag gives 4 stats and one Gust. Putting the Bag straight onto the Announced unit, or giving one each turn it stays, would bring it up to its tier."},{"pid":"p4","uid":"u17","kind":"idea","text":"Two Thunderheads (a second copy, or Sir Vane copying one) both 'attack after your other units'. A line saying reading order breaks the tie would settle it."},{"pid":"p5","uid":null,"kind":"idea","text":"Tiers 1 to 3 have little permanent growth outside the Courier and Red Sky, and Bristle punishes early Gusts. One more early buffer would steady the opening."}],"standouts":[{"uid":"u17","why":"Counting Thunder and keeping the forecast from setting him off early is a seating puzzle inside the tribe's own engine, and the payoff is loud."},{"uid":"u10","why":"A second Announced unit eases the play-order squeeze and doubles every Announced payoff; a clear Tier 4 multiplier."},{"uid":"u12","why":"Making the enemy's biggest units Gust into his thorns turns their strength against them, and it ties into Bog folk and the Windhover."}],"weakest":[{"uid":"u13","why":"Low output for Tier 4, and nothing new happens after you play it."},{"uid":"u05","why":"About half a gold a turn is slow economy, and the Foul Gust only comes every other fight."},{"uid":"u01","why":"Only the first Gust Page fires, so it falls off quickly and copies don't add up."}],"flags":[{"uid":"u19","kind":"watch","note":"Permanent growth capped per fight but not per game; golden Warden plus the Helm plus Sir Vane can add 150+ stats a fight."},{"uid":"u14","kind":"watch","note":"Copying a capstone from Tier 5, and golden Vane copying two, is the high roll most likely to run away."},{"uid":"u16","kind":"watch","note":"Free Gusts plus +2/+2 per Gust kill, together with the Thunderhead's ten Gusts and Mistral's re-Gusts, stacks a lot of free value."},{"uid":"u18","kind":"watch","note":"Shutting off every enemy Start of Combat effect may feel like a lock against Start of Combat builds, Gale mirrors included."},{"uid":"u17","kind":"unclear","note":"Attack order between two units that each 'attack after your other units' isn't stated."}]},{"id":"v2--reader","design_id":"gale-court--player-story","v":2,"member":"reader","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"Every turn asks what to play last and where to seat it, and the fight pays off with a visible storm of Gusts and a Thunderhead finish; you'd happily draft it.","distinct":"Announced (the last unit you played, any tribe) is new and makes play order the shop puzzle; out-of-turn attacks alone are more familiar."},"verdict":"settle","verdict_why":"The two keywords now read cleanly and the rulings cover the edge cases; what's left is wording polish, not a real fix.","points":[{"pid":"p1","uid":"u18","kind":"idea","text":"Lady High Pressure's \"after each one, your Announced unit Gusts instead\" reads oddly after attacks that didn't happen; \"each of the enemy's first 3 normal attacks is skipped, and your Announced unit Gusts instead\" says the same thing plainly."},{"pid":"p2","uid":"u12","kind":"idea","text":"Old Föhn's \"count for none of the enemy's cards\" is hard to parse at a glance; \"the enemy's own cards ignore these Gusts\" carries it in fewer words."},{"pid":"p3","uid":"u14","kind":"idea","text":"Sir Vane is the best fantasy in the tribe but needs a ruling card to read; show the copied unit's text on his card face in the UI so players never have to remember it."},{"pid":"p4","uid":"u01","kind":"idea","text":"Gust Page's quarrel (only one of them gets to go first) is lovely flavour, but a second Page is a blank card; maybe the Pages that lose the quarrel gain something small, so the squabble shows on the board."},{"pid":"p5","uid":null,"kind":"idea","text":"A late fight can fire 15 or more Gusts; a visible Gust queue and the Thunder counter matter more for reading this tribe than any card wording."}],"standouts":[{"uid":"u10","why":"The Helm, who mentions his name to everyone, is always Announced: the lore is the rule, and it reads in one line."},{"uid":"u17","why":"The Thunderhead arrives late and loud, counting the storm, and the Crier setting him off early is a puzzle a player can see coming."},{"uid":"u05","why":"Mr and Mrs Fair-and-Foul are never home together, and the two-state card says that with gold one turn and a Gust the next."}],"weakest":[{"uid":"u13","why":"The Bag-Bearer is just a delivery for the Bag of Winds; no court character comes through in what it does."},{"uid":"u09","why":"The Barometer Clerk asks the player to remember last fight's Gust count, with a fallback mode on top; the most bookkeeping for the least story."},{"uid":"u01","why":"Extra Gust Pages and any earlier Start of Combat Gust turn it into a vanilla 2/3, which may feel like a misread to a new Gale player."}],"flags":[{"uid":"u14","kind":"watch","note":"Sir Vane copying a Tier 6 capstone (or golden Vane copying two) is the tribe's biggest swing; the designer already names the fallback."},{"uid":"u19","kind":"watch","note":"The Warden with the Helm puts up to +20/+20 a fight on each of two Announced units, more if Sir Vane copies the Warden."}]}],"ratings":{"fun":7.0,"distinct":7.0},"votes":{"settle":3,"iterate":0}}]},{"id":"gale-court--top-down-mech","key":"gale-court-86e7","seed":"gale-court","route":"top-down-mech","tribe_name":"The Gale Court (v1)","status":"written","final_version":null,"stop_reason":null,"md":"# The Gale Court (v1)\n\n## 1. Identity\n\n**Core mechanic: the Gust.** Weather breaks the queue. The court's units attack out of turn.\n\n- **Gust:** the unit attacks right away, out of turn order. This doesn't use up its normal attack. A Gust is a real attack: it picks a target the normal way, both units deal damage, and it sets off anything that cares about attacks. If a Gust is triggered during another attack, it waits until that attack ends. Several waiting Gusts go in the order they were triggered.\n- **Gale:** the number of Gusts your units have made this fight. While recruiting, your Gale is the count from your last fight. (On screen: a wind-rose dial by the hero.)\n- **Defer** (new keyword): when this would make its normal attack, it doesn't. Your biggest other unit Gusts instead. If it has no other unit, it attacks as usual. A Defer unit told to Gust still Gusts.\n\n**How it plays.** In the fight, the Gale Court turns attacks into more attacks: opening Gusts at Start of Combat, chains after kills, and courtiers who Defer so that one favourite strikes again and again. Every Gust adds to the Gale, and the next Recruit Phase reads it back as gold, permanent stats and items. So the fight feeds the shop, and the shop decides who gets to Gust next time. Johnny's puzzle is about who Gusts and where they sit. Who is the biggest? Who sits on whose left? Which other tribe's unit has the best \"when this attacks\" text to send through a Gust? Gusts are attacks, so they set off other tribes' attack text too: a Hunter's quarry, a Cleave neutral, a Bird made big by Fly South. Attacking more also means taking more hits back, so half the tribe is about who absorbs the cost.\n\n## 2. The 19 units\n\n| Name | Tier | A/H | Job | Text | Golden |\n|---|---|---|---|---|---|\n| Gust Page | 1 | 2/2 | generate | Start of Combat: Gust. | 4/4. Start of Combat: Gust twice. |\n| Pine-Cone Augur | 1 | 1/3 | convert (seed) | Start of Turn: if your Gale is 1 or more, gain +1/+1 permanently. If it is 6 or more, +2/+2 instead. | 2/6. +2/+2; +4/+4 at 6 or more. |\n| Bowing Zephyr | 2 | 1/5 | redirect | Defer. After this Defers, the unit that Gusts gains +2 Attack for this fight. | 2/10. +4 Attack. |\n| Dew-Pond Sprite | 2 | 2/4 | convert (buffer) | Twice a fight: after an ally Gusts, give it +1/+1 permanently. | 4/8. +2/+2. |\n| Red Sky at Night | 2 | 3/3 | convert (economy) | Start of Turn: if your Gale is 3 or more, gain 1 gold. | 6/6. Gain 2 gold. |\n| Mistral Outrider | 3 | 4/3 | generate | Twice a cycle: after this kills a unit, it gains +2 Attack for this fight and Gusts. | 8/6. +4 Attack. |\n| Sir Vane, the Weathercock | 3 | 3/4 | generate (order) | Start of Combat: your side attacks first. Then your leftmost front-row unit Gusts. | 6/8. ...Gusts twice. |\n| Cirrus Steward | 3 | 2/5 | convert (buffer) | End of Turn: give your biggest unit +1/+1 permanently for every 2 in your Gale, up to +4/+4. | 4/10. +2/+2 per 2, up to +8/+8. |\n| The Helm | 3 | 2/5 | redirect (protect) | Defer. Start of Combat: give your biggest other unit Shield. | 4/10. Your two biggest other units. |\n| Countess Bora | 4 | 5/4 | generate | Start of Combat: your front-row units Gust, left to right. | 10/8. Each Gusts twice. |\n| Windhover | 4 | 3/6 | multiply | Once a cycle: after the unit on this one's left attacks, that unit Gusts. | 6/12. Twice a cycle. |\n| Mackerel Sky | 4 | 3/5 | convert (buffer) | Start of Turn: if your Gale is 5 or more, give your other units +1/+1 permanently. If it is 10 or more, +2/+2 instead. | 6/10. +2/+2; +4/+4 at 10 or more. |\n| The Sí Gaoithe | 4 | 4/4 | convert (economy) | Start of Turn: if your Gale is 8 or more, get a Gale Warning. | 8/8. Get 2. |\n| Lord Mistral, Warden of the Rhône | 5 | 6/6 | generate (engine) | After one of your units kills an enemy, it Gusts. Once a cycle each. | 12/12. Twice a cycle each. |\n| Old Föhn | 5 | 2/11 | redirect (protect, direction) | Defer. Damage Reduction 2. When an ally Gusts, this takes the damage dealt back to it instead. | 4/22. Damage Reduction 4. |\n| The Swift Couriers | 5 | 5/6 | generate (tempo) | Swoop. After this makes its normal attack, it Gusts. Its first Gust each cycle takes no damage back. | 10/12. ...it Gusts twice. |\n| Her Serene Stillness, Lady High Pressure | 6 | 6/8 | redirect (capstone) | Your other units have Defer. After your biggest unit Gusts, it gains +2/+2 for this fight. | 12/16. +4/+4. |\n| Duke Cumulonimbus, the Thunderhead | 6 | 5/9 | pay off | Cleave. Has Defer while your Gale is under 6. When the Gale reaches 6, this Gusts. After that, it gains +2 Attack for this fight for each point the Gale goes up. | 10/18. +4 Attack per point. |\n| Master of the Wild Hunt | 6 | 7/7 | multiply (capstone) | Each Gust your units make counts twice toward your Gale. When your Gale reaches 20, your other units each Gust. | 14/14. Counts three times; at 20, each Gusts twice. |\n\n**Item (the tribe's only token):**\n- **Gale Warning** (item, Created, from The Sí Gaoithe): aimed. Give a unit \"Start of Combat: Gust\" permanently. It stacks: a second copy makes it Gust twice.\n\nRulings that the text relies on: \"biggest\" ties go to the first unit in reading order. A Defer unit's turn in the order still counts as its attack for the alternating sequence. Gusts from Start of Combat count toward the Gale before the first normal attack.\n\n## 3. Builds\n\n**A. The Favourite (Defer).** Bowing Zephyr, The Helm, Old Föhn and finally Lady High Pressure. One unit, from any tribe, is made the biggest, and the courtiers' attacks become its Gusts. Cirrus Steward and Dew-Pond Sprite make it bigger, so it stays the favourite. The Helm gives it a Shield and Föhn takes the hits back. The best favourites have their own attack text: a Cleave neutral, a Hunter whose quarry it hits over and over, Mistral Outrider chaining kills, or The Swift Couriers (Swoop, and its first Gust each cycle takes no damage). There's a side effect: Defer units never attack, so they rarely take damage, and they're often still standing at the end. Every surviving unit adds to hero damage.\n*Example turn:* Courier in F2, Zephyr, Helm and two neutrals Deferring. Each cycle the Courier Swoops, Gusts for free, then takes four Deferred Gusts at +2 Attack each, with Föhn in the back row absorbing the return damage.\n\n**B. Squall Line (wide).** Gust Pages, Sir Vane, Countess Bora, Windhover and Lord Mistral. The whole front row attacks before the enemy moves (Vane, then Bora). Windhover sits to the right of the hardest hitter, and every kill starts another Gust. The payoffs are Mackerel Sky for the whole board and the Thunderhead, which Defers until the Gale reaches 6 and then gains Attack with every Gust after. Opening Gusts often light it before the first normal attack. This build clashes with Lady High Pressure: under her, Couriers and Windhover's neighbours stop making normal attacks. A Johnny board picks a side or splits the rows.\n\n**C. Barometer (economy).** Pine-Cone Augur, Red Sky at Night, The Sí Gaoithe, Mackerel Sky and the Master of the Wild Hunt. Here the Gale is a resource, not a weapon. Wild Hunt counts every Gust twice, which doubles every reader at once (Augur and Mackerel reach their higher steps, the Thunderhead gains twice as fast) without adding a single attack. Gale Warnings let Gusts leave the tribe: put them on whatever carry the shop offers.\n\n**D. Court in exile (splash).** Three or four Gale Court units as support in another tribe's board. The Helm, Old Föhn, Windhover and Gale Warnings all work for whoever is biggest or sits on the left.\n\n**Mixing with other tribes in a lobby:**\n- *Hunters:* a Gusting unit with a quarry hits the same target every time, so Take triggers come early. A Pack unit beside the favourite joins its Gusts. (See risks.)\n- *Oozes:* Eat makes a unit the biggest at once, which swaps the favourite between fights.\n- *Birds:* Fly South comes back with doubled stats, the easiest way to crown a favourite.\n- *Fairies:* a favourite on a Ring slot stays the biggest. A Gale Warning is an aimed item, so it can buff a Shy unit and send it off for 2 gold. That's a misuse Johnny can find.\n- *Hedgerow:* Pass X feeds your rightmost other unit, so park the favourite on the right.\n- *Bog folk* are the natural predator. Mire forces your Gusts into one wall, Bitter shrinks the favourite's Attack on every hit, and Bristle makes each extra attack hurt. Real counterplay, visible on the next opponent's board.\n\n## 4. Risks and holes\n\n- **Loops.** Every chain card has a \"once\" or \"twice\" a cycle limit, but Lord Mistral, Mistral Outrider, Windhover and Thunderhead together still make long chains. As a fallback, a unit could Gust at most 5 times a cycle.\n- **Readability.** Out-of-turn attacks are the hardest thing in the tribe to follow on screen. Gusts need their own motion (a sideways streak, a gust sound, the Gale dial ticking up), or fights will look random.\n- **One basket.** Build A dies to one Mire, Bitter or Nightshade unit. The cost is in plain sight, but losing a run to a single counter can feel bad.\n- **Rich get richer.** Gale readers pay out after fights where you Gusted a lot, which usually means winning. Augur's low step (1) and Red Sky's (3) soften this. Mackerel Sky's top step and The Sí Gaoithe don't.\n- **The Sí Gaoithe self-feeds**, but only linearly: each Warning adds about one Gust a fight, which keeps the Gale at 8 or more, which brings another Warning. That's +1 Gust a turn, not a doubling. Pass this through the two-pass runaway check.\n- **Mirror timing.** If two Sir Vanes meet, the side whose Start of Combat goes second gets to attack first. That needs a ruling (the usual rule could win instead).\n- **Unsettled rules.** It's unclear whether Pack \"joining\" a Gust uses up the Pack's own attack, and whether Shy treats \"Start of Combat: Gust\" as a buff. Back-row access isn't settled either, and it affects Couriers and Föhn's safety.\n- **Early tempo is thin.** The T1 and T2 bodies are small, and Bowing Zephyr does nothing without a strong neutral to defer to.\n- **Föhn + Lady + Couriers** may make a favourite that can't be killed. Golden Thunderhead with golden Wild Hunt gains about +12 Attack per Gust. That's a high roll inside one fight, not something that carries across fights, but it needs testing.\n\n## 5. Tier check\n\nBodies (Attack + Health): 4 / 6 / 7 / 8.5 / 12 / 14.\n- **T1:** both are 4 stats. Gust Page adds about 0.5 body in a fight. Augur gives +2 a turn (0.5 body). **Broken on purpose:** at Gale 6 or more it gives 1 body a turn (2.5× the guide), so a T1 seed stays worth its slot. Its growth doesn't feed the Gale.\n- **T2:** all three are 6 stats. Zephyr is about 1 body in a fight. Dew-Pond gives 4 stats a turn (0.7 body). Red Sky gives 1 gold a turn, a third of a unit. All on target.\n- **T3:** all four are 7 stats. Outrider and Vane each add 1 to 1.4 bodies in a fight, and Helm's Shield is about one hit (~1.2). Cirrus at Gale 8 gives 8 stats a turn (1.1 bodies, 1.4× the guide). That's accepted because it's capped and goes to one target.\n- **T4:** 8 to 9 stats. Bora (4 opening Gusts) and Windhover (one partner, 3 extra attacks) are each about 2 bodies in a fight. Mackerel gives 12 stats a turn at Gale 5 (1.4). **Broken on purpose:** 24 at Gale 10 (2×), the reward for a committed board. The Sí Gaoithe gives about one Gust a fight per Warning, under the T4 \"once\" target.\n- **T5:** 11 to 13 stats. Lord Mistral is about 4–6 extra attacks, and Föhn soaks about 6 return hits. Both are about 4 bodies in a fight. Couriers (tempo) are about 2–3, with the body making up the rest.\n- **T6:** all 14 stats. Thunderhead and Lady are each about 4–6 bodies in a fight once the Gale is built. Wild Hunt is a ×2 multiplier on every Gale reader, plus a mass Gust at 20. The golden ceiling is ×2–4, and it doesn't pile up across turns.\n- **Shape:** I kept the guide's 2/3/4/4/3/3. The jobs lean towards \"convert\" in the low tiers (6 cards across T1–T4) because the Gale is the only bridge from the fight to the shop.\n\n## 6. Design rationale\n\n1. **Core: the Gust, an extra attack out of turn.** It's the seed's \"who strikes first, how often, in what order\", and every tribe already reacts to attacks, so Gusts plug into their text.\n2. **Gale counter, lasting into the next Recruit Phase.** Combat-only tribes have no permanent growth. One visible number lets the shop convert the fight.\n3. **Defer.** It's a second, cheap Gust source that turns weak attacks into the favourite's Gusts. It uses the rulebook's existing \"biggest\", so any tribe's unit can become the favourite.\n4. **Five jobs, then counts:** generate 6, redirect/protect 4, convert 6, multiply 2, pay off 1 (plus Lady). Generation and conversion carry the loop, and the rest bend it.\n5. **Converters sit low, payoffs and multipliers high.** The Gale is small early and large late.\n6. **Every chain has a cycle limit**, with a global cap held in reserve, because Gusts cause attacks that cause Gusts.\n7. **Protection is part of the core, not an add-on** (Helm, Föhn, Couriers). More attacks means more hits back.\n8. **One item, the Gale Warning,** so Gusts can leave the tribe and land on other tribes' carries.\n9. **The Thunderhead Defers until Gale 6,** so it lights its own fuse. Opening Gusts set it off early.\n10. **Wild Hunt multiplies the Gale, not attacks.** It doubles every converter and payoff without making fights longer.\n11. **Windhover reads only its left neighbour.** Left and right together came to about 2× the T4 guide, and one side makes seating a puzzle.\n12. **Names last,** taken from the seed's figures and fitted to each job (Mistral clears the room, Föhn takes the blame, Lady High Pressure stops everyone else).\n","versions":[]},{"id":"grass-snake-players--bottom-up-flavour","key":"grass-snake-players-e910","seed":"grass-snake-players","route":"bottom-up-flavour","tribe_name":"The Grass Snake Players — v1","status":"written","final_version":null,"stop_reason":null,"md":"# The Grass Snake Players — v1\n\n## 1. Identity\n\n**Core mechanic: deaths that count but cost nothing.** Players die on stage all fight long, every death pays out, and the body stays on the board.\n\n**Play Dead** (keyword). The first time this would die each fight, it **plays dead** instead. *Play Dead (three times a fight)* means the first three times.\n\n**Plays dead** (the event). Everything that happens when a unit dies happens: its own \"When this plays dead\" effects, any \"When this dies\" effects it has, and every \"when a unit dies\" effect on either side. It counts as a death for every count. Then the unit stays in its slot, keeping its Attack and buffs, at 1 Health. Some effects make a unit play dead without dying. When that happens it keeps its Health and uses up no Play Dead.\n\n**Curtain Call: X** (trigger). Start of Turn: X, once for each time this played dead in the last fight, even if it really died later in that fight.\n\n**How it plays.** A cast whose units each die once or more a fight and get up again. Early on, Play Dead is just an extra life. Mid-game you cue the deaths yourself, with an adder duel, a villain's murder or a ham who collapses at every scratch. Then you choose where each death pays out: *during* the fight (buffs, enemy Attack lost, stage blood thrown) or *afterwards*, permanently, through Curtain Calls and the critic's review. The puzzle is positional. The front row gets hit, so it plays dead more and also dies for real more. The back row is the wings, where an understudy hides a 1-Health star until its bow. Two cards hand the tricks to other tribes: Shed Skins give any unit Play Dead, and the House Snake makes friendly kills safe.\n\n## 2. The 19 units\n\nAll are **Players** (snakes, lizards, amphibians, and one heron critic).\n\n| # | Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|---|\n| 1 | **Heap Hatchling** | 1 | 2/1 | Play Dead. *(Born in the wings of the compost heap.)* | 4/2. Play Dead (twice a fight). |\n| 2 | **Little Anguis** | 1 | 1/2 | Play Dead. When this plays dead: drop its Tail (summon an Anguis's Tail in the nearest empty slot). Curtain Call: its Tail permanently gains +1/+1. | 2/4. Tail starts 2/2; Curtain Call: Tail gains +2/+2. |\n| 3 | **Wreath-Layer** (common lizard) | 2 | 2/4 | When a friendly Player plays dead: it permanently gains +1/+1. Four times a fight. | 4/8. +2/+2. |\n| 4 | **Wings Understudy** (sand lizard) | 2 | 2/4 | Once a fight, while this is in the back row: when a front-row Player plays dead, swap places with it, and this gains that Player's Attack for the fight. | 4/8. Twice a fight. |\n| 5 | **The Natterjack** (barker) | 2 | 3/3 | Start of Turn: gain 1 gold for every 3 times your units played dead last fight (up to 2 gold). | 6/6. 2 gold per 3 (up to 4). |\n| 6 | **The Brothers Berus** (adders) | 3 | 4/3 | Play Dead. Start of Combat: the spring dance. This and the friendly unit beside it with the most Attack hit each other. *(They never quite pull the blow.)* | 8/6. Dances with each unit beside it. |\n| 7 | **The Barnstormer** | 3 | 2/5 | Ham: whenever this takes damage and survives, it plays dead anyway (three times a fight). Curtain Call: permanently gain +1/+1. | 4/10. Six times a fight; +2/+2. |\n| 8 | **Milky-Eyed Juvenile Lead** | 3 | 3/4 | Play Dead. Curtain Call: shed, and get a Shed Skin. Once a turn. | 6/8. Get two Shed Skins. |\n| 9 | **The Musk-Bottle Dresser** | 3 | 3/4 | When a friendly Player plays dead, if an enemy hit it: that enemy loses 2 Attack for the fight. *(Kept for hecklers.)* | 6/8. Loses 4 Attack. |\n| 10 | **Footlights Keeper** (glow-worm lamps) | 4 | 3/6 | Your front-row Players get up from playing dead with half their full Health, not 1. | 6/12. With their full Health. |\n| 11 | **Žaltys, the House Snake** | 4 | 2/7 | Never harmed. In fights, your own units' effects can't kill your units: a unit that would die to one plays dead instead, even without Play Dead, and uses up no Play Dead. End of Turn: a saucer of milk. Your smallest Player permanently gains +2/+3. | 4/14. +4/+6. |\n| 12 | **The Red Barn Villain** (smooth snake) | 4 | 4/5 | Start of Combat: murder the friendly unit with the least Health (deal damage equal to its Health). Whenever a friendly Player plays dead: this gains +2 Attack for the fight (the crowd boos). | 8/10. Murders two; +4 Attack. |\n| 13 | **Compost Heap Matron** | 4 | 3/5 | End of Turn: lay an egg in the heap. Get a Heap Hatchling. | 6/10. Get two. |\n| 14 | **Dame Natrix Collar** | 5 | 5/7 | Play Dead (three times a fight), with a different death each time. **Drowned:** the units beside her gain +5/+5 for the fight. **Poisoned:** the enemy that hit her loses half its Health. **Broken Heart:** each other friendly unit plays dead without dying. | 10/14. Drowned +10/+10. Poisoned: it drops to 1 Health. Broken Heart: each plays dead twice without dying. |\n| 15 | **The Blood-and-Thunder Man** (common toad, stage blood) | 5 | 5/7 | Whenever a friendly unit plays dead: throw stage blood. Deal damage to a random enemy equal to the number of times your units have played dead this fight (at most 10 a throw). | 10/14. Twice that number (at most 20). |\n| 16 | **Old Crest** (great crested newt, in the prompt box) | 5 | 3/9 | While in the back row: when a friendly unit plays dead, its own \"When this plays dead\" and \"When this dies\" effects happen twice. | 6/18. Three times. |\n| 17 | **Sir Hesketh Hiss** (actor-manager) | 6 | 6/8 | Play Dead. Start of Turn: permanently play dead one more time each fight, up to 5. *(His death throes lengthen every season.)* Curtain Call: your other Players permanently gain +1/+1. | 12/16. Curtain Call: +2/+2. |\n| 18 | **Žilvinas, the Serpent Prince** | 6 | 7/7 | Play Dead. Encore (once a fight): when you would have no units left, every friendly unit that played dead this fight and has since died comes back in its slot with 1 Health. *(In the original he stays dead.)* | 14/14. They come back with half their full Health. |\n| 19 | **Mr Ardea Grey** (heron critic) | 6 | 8/6 | Start of Turn, the review. If your units played dead 5 or more times last fight, a rave: your other Players permanently gain +1/+1 for each time (up to 10). Otherwise, a pan: he eats your smallest other Player and permanently gains its stats. | 16/12. Rave: +2/+2 each time. |\n\n**Tokens and items (two):**\n- **Anguis's Tail.** A Player token with no text. Its stats are stored on the Little Anguis that drops it: 1/1 to start, growing with that Anguis's Curtain Calls. *(It gets better notices than he does.)*\n- **Shed Skin** (item, Created). Give a unit +2/+2 and Play Dead, permanently. Each unit can wear one Skin; a second one gives only the stats. It works on any tribe.\n\n## 3. Builds\n\n**A. The long run (permanent).** Barnstormer and Wreath-Layer, then Sir Hesketh and Mr Ardea Grey. The Barnstormer plays dead three times without dying, so he collects three wreaths. Hesketh pays out per death, and Ardea's rave counts every death on the board. The Understudy pulls Hesketh into the wings after his first death so he survives to bow, but in the back row he gets hit less and dies fewer times. That trade is the decision. This is the snowball, Spike's line.\n\n**B. Blood and thunder (in-fight cascade).** Brothers Berus, the Villain and Žaltys, then Old Crest and Dame Natrix, cashed in by the Blood-and-Thunder Man and the Musk-Bottle Dresser. At Start of Combat the adders duel and the Villain murders. Žaltys makes those kills safe, so Natrix can be two deaths in before an enemy swings. Her Broken Heart then makes the whole cast play dead at once, Old Crest doubles each death effect, and every death throws a bigger splash. The Dresser only pays on deaths an enemy caused, so you choose between cueing deaths and letting them come.\n\n**C. The show goes on (surviving).** Compost Heap Matron, Hatchlings, Footlights Keeper and Žilvinas. The Matron fills the board with units that each have an extra life, and Created copies count towards triples, so goldens and Discovers arrive steadily. Footlights sends front-row Players up at half Health, and the Encore brings the dead back once more. It wins by hero damage. Ardea's pan eats a spare Hatchling, not a star.\n\n**D. The costume rack (support for other tribes).** Take the Juvenile Lead, Žaltys and the Villain, and dress another tribe:\n- A skinned **Ooze** plays dead: its Belly opens (it \"died\") and the Ooze keeps fighting. The Villain's murder opens it at Start of Combat.\n- A skinned **Bog** unit with **Mire** holds the enemy across for twice as long, and every extra attack adds Bitter to the Toll.\n- A Skin keeps a **Bird**'s best unit alive one more time, so it can Fly South later.\n- Old Crest doubles any tribe's \"When this dies\" effect when it plays dead.\n\n**In a lobby.** Players mix most easily of the tribes, because two cards give their tricks away. In return, **Hunters** farm them (Take fires when the quarry \"dies\", and a Player keeps getting up), and **Bog**'s Bitter quietly counters them: weaker attackers mean fewer deaths. **Fairy** Rings on the front row suit the Footlights Keeper: a big unit gets up at half of a big number.\n\n## 4. Risks and holes\n\n- **\"Player\" also means the person playing.** \"Your Players\" is ambiguous on screen. Fallback tag: **Troupers**.\n- **Enemies see fake deaths.** As written, enemy death triggers fire too (Hunters' Take, neutral \"when a unit dies\"). I kept it for counterplay. The alternative: only your side sees a fake death. Decide before balancing Hunters.\n- **The in-fight cascade is superlinear.** Blood-and-Thunder plus Broken Heart plus Old Crest is about n² damage, held only by the 10-a-throw cap. Golden Natrix with Old Crest is the high roll to watch.\n- **The Wreath-Layer with the Barnstormer** gives +3/+3 a fight on one unit at Tier 3. The four-a-fight cap exists for this.\n- **The Matron is a triple engine:** a free Tier 1 unit a turn, so a Discover about every 3 turns. It's unclear whether Created Hatchlings draw from the shared pool.\n- **The critic's pan is binary** and can eat a wanted unit early. The visible threshold is what keeps it fair.\n- **Fights get busy.** Every lie-down and get-up needs a readable animation, and a marker shows who will take a Curtain Call. Test this on screen early.\n- **Back-row Players rarely play dead.** Only the Berus, the Villain and Broken Heart reach them. That's either a hole or the positional puzzle working.\n- **No Tier 1 economy,** and the Natterjack needs deaths to pay.\n- **Skins might suit other tribes better than the Players,** especially Oozes. Check that the Players don't become a pure support tribe.\n\n## 5. Tier check\n\n- **Tier 1.** Hatchling: 1 body plus about 0.6 in a fight. Anguis: an extra life, a Tail and about 2 stats per Curtain Call (0.5 body against 0.4). Fits; the seed is slightly rich.\n- **Tier 2.** Wreath-Layer: 6 permanent at 3 deaths, 8 at the cap (1 to 1.3 bodies), at or just over the top of the range, on purpose, as the first buffer. Understudy: about 1 body in a fight. Natterjack: about 1 gold a turn. Fits.\n- **Tier 3.** Barnstormer: 6 permanent (0.85) plus triggers. Juvenile Lead: 4 stats plus a keyword. Dresser: 6 to 8 enemy Attack (about 1). The Berus is light on purpose, as a pure enabler. Fits.\n- **Tier 4.** Footlights: 12 to 16 in a fight (about 2). Villain: about 10 Attack plus enabling. Matron: economy. Žaltys: 5 permanent, under on purpose, because its job is the safe kill. The shape leans to enablers.\n- **Tier 5.** Natrix: about 3 to 5 bodies in a fight (guide 4). Blood-and-Thunder: 21 at 6 deaths, 45 at 9 (2 to 4), quadratic on purpose and capped. Old Crest: a Brann-style multiplier, as the guide expects.\n- **Tier 6.** Hesketh: 36 to 60 permanent (2.5 to 4). Encore: about 6 in a fight. Ardea: 60 to 120 (4 to 8.5), near the top-end ceiling of about 10. Fits.\n\n## 6. Design rationale (in the order I made the decisions)\n\n1. **The grass snake playing dead** became Play Dead, a death that triggers and counts but keeps the body, because that is the seed's suggested play. The Hatchling is its plainest form.\n2. **Anguis's Tail gets better notices,** so I made the Tail the part that grows. The growth had to land after the show, and that gave Curtain Call.\n3. **The adders never quite pull the blow,** which showed the tribe needs to cue its own deaths, not wait for the enemy.\n4. **Ham against method** became the Barnstormer, who plays dead without dying. It is cheap fuel for every count.\n5. **The Natterjack, the musk bottle and the wreaths** were each a watcher that pays per death. That made the shared count, \"times your units played dead\", the tribe's real currency.\n6. **Dame Natrix died three ways in one week,** so she has scripted Play Dead charges. Broken Heart became the tribe's single mass trigger.\n7. **Old Crest has the repertoire by heart, from under the stage,** so he is the multiplier, and he only works from the back row.\n8. **The skin sheds in one piece** and becomes an item that hangs Play Dead on any tribe. This is the Johnny route out of the tribe.\n9. **The household guardian is never harmed,** so friendly kills play dead even without the keyword; otherwise the Villain and Berus only cost other tribes.\n10. **Sir Hesketh's death throes lengthen every season,** so his charges grow each turn, capped because more charges mean more Curtain Calls.\n11. **Žilvinas gets up for the bow when the original says he stays dead.** That is the Encore, a second life for the units that already used their first.\n12. **The critic who eats actors** reads the shared count: a good show is permanent stats, a thin show feeds him. That was the last payoff, and the Matron's spare Hatchlings make the pan survivable.\n","versions":[]},{"id":"grass-snake-players--surgical","key":"grass-snake-players-2eaa","seed":"grass-snake-players","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"grass-snake-players--top-down-flavour","key":"grass-snake-players-a01c","seed":"grass-snake-players","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"great-migration--bottom-up-mech","key":"great-migration-68b1","seed":"great-migration","route":"bottom-up-mech","tribe_name":"The Great Migration","status":"revising","final_version":null,"stop_reason":null,"md":"# The Great Migration (v1)\n\n## 1. Identity\n\n**Core mechanic: the Herd and its Burrow.** The tribe makes **Kits**: identical little Lemming tokens. Kits that don't fit on the board wait in the **Burrow**, an off-board reserve shown on your hero. **Onward** turns that reserve into fight HP. Every card in the tribe either grows the Herd, makes Kits bigger, or spends Kits on something else.\n\n- **Kit (token):** a Lemming whose stats are your **Kit size**. Kit size starts at 1/1, and cards raise it permanently for every Kit you have, now and later, in the Burrow too. Kits are Created, sell for 0, aren't in the pool and never make triples. Harvest Supper's Migration bonus reaches them as well.\n- **Burrow:** a Kit made with no empty slot goes into your Burrow. While recruiting, you can move Kits between the board and the Burrow for free. A Kit that goes into the Burrow loses its own buffs and keeps only Kit size. Your **Herd** is all your Kits, on the board and in the Burrow.\n- **Onward (new keyword):** *When this dies, a Kit from your Burrow takes its slot.* Each Burrow Kit can come out once a fight. Fights never cost you Kits: the Burrow is full again afterwards.\n\n**How it plays.** Early on, Kits are free bodies that let you attack first and fill gaps. By the midgame you're running a stockpile that has three jobs at once. On the board it fills slots, which earns gold and moves Kits out of reach of the cards that spend from the Burrow. In the Burrow it's the Onward chain's fuel and ammunition for Ole. Spent, it becomes permanent stats on your real units. The tribe's numbers puzzles all pull on that one pile. You grow **count** (Kit makers) or **size** (Kit size), and they multiply. Spending at a good rate leaves you short of fight fuel, and some cards trigger at Herd thresholds, so a Kit spent below the next threshold is free. The tribe owns no big bodies of its own, so its best boards borrow a few strong units from other tribes and wrap them in Kits.\n\n## 2. The 19 units\n\n*Front unit:* your first unit in reading order (F1–F4, then B1–B3). Assumption: End of Turn effects resolve in reading order, so you choose whether a counter goes before or after a spender.\n\n| Name | Tier | A/H | Text | Golden text |\n|---|---|---|---|---|\n| Yellowcoat Squeaker | 1 | 1/2 | When played: make a Kit. | When played: make 2 Kits. |\n| Snowbed Nester | 1 | 1/2 | End of Turn: make a Kit. | End of Turn: make 2 Kits. |\n| Tally, the Census Fox | 2 | 1/4 | End of Turn: if all 7 of your slots are full, gain 1 gold. | …gain 2 gold. |\n| Tunic Weaver | 2 | 2/3 | When played: Kit size +1/+1. | When played: Kit size +2/+2. |\n| Runway Digger | 2 | 2/3 | Onward. When played: give another unit Onward permanently. | …give two other units Onward permanently. |\n| The Front Lemming | 3 | 2/4 | Your front unit has Onward, up to 3 times a fight. | …up to 6 times a fight. |\n| Brood Matron | 3 | 2/5 | End of Turn: make a Kit for every 4 Kits in your Herd (at most 3). | …make 2 Kits for every 4 (at most 6). |\n| Raft-builder | 3 | 3/4 | When played: spend up to 3 Kits from your Burrow. Give a unit +2/+2 permanently for each. | …+4/+4 for each. |\n| Ole the Learned | 3 | 3/3 | Start of Combat: 3 Kits from your Burrow fall on random enemies, each dealing damage equal to its Attack, then die. They can't come out again this fight. | …6 Kits fall. |\n| Identical Cousin | 4 | 3/4 | When played: a Kit next to this becomes a plain Created copy of another unit next to this. | …two Kits next to this each become a plain copy of another unit next to this. |\n| Herding Council | 4 | 4/4 | End of Turn: if your Burrow holds 2 or more Kits, spend 2 and give your units that aren't Kits +1/+1 permanently. | …+2/+2 permanently. |\n| Litter Keeper | 4 | 3/5 | Whenever you make a Kit, make another in your Burrow, up to 4 extra a turn. (The extra ones don't trigger this.) | …make 2 more, up to 8 extra a turn. |\n| Gerd the Shouter | 4 | 5/4 | Your Kits have Bristle 3. | Your Kits have Bristle 6. |\n| Herald of the Lemenår | 5 | 4/7 | Start of Turn: make as many Kits as your Burrow holds, at most 6. | …at most 12. |\n| Cantor of the Edge | 5 | 5/6 | Whenever one of your Kits dies, your biggest unit gains its stats for this fight. | …gains double its stats for this fight. |\n| Snow Hall Guard | 5 | 6/8 | Onward. Start of Combat: your Kits gain +2/+2 for this fight, Burrow Kits included. | …+4/+4 for this fight. |\n| Old Mother Lemen | 6 | 5/9 | Your Kits have +1/+1 and Onward. | Your Kits have +2/+2 and Onward. |\n| Brother Onward | 6 | 7/7 | Start of Combat: your front unit takes the Banner: +4/+4 for this fight. Whenever the Banner's holder dies, the Banner passes to your new front unit and grows by +4/+4. | Banner starts at +8/+8 and grows by +8/+8. |\n| Ferrywife of the Wide Water | 6 | 6/8 | End of Turn: spend half the Kits in your Burrow (round down). Your units that aren't Kits gain +1/+1 permanently for each Kit spent. | …+2/+2 for each Kit spent. |\n\n**Tokens:** the Kit only. **Spells:** none needed.\n\n**Rules notes.**\n- A Kit that comes out through Onward counts as the dying unit's own summon, so it takes that slot. If the slot is taken (by an Ooze's Belly, say), it goes to the nearest empty slot.\n- A unit with Onward from two sources still brings out only one Kit.\n- Ole's Kits *die*, so Cantor sees them.\n\n## 3. Builds\n\n**The Endless Tide (Burrow as fight HP).** Nester, Matron, Litter Keeper and Herald build a Burrow of 12–20 Kits. Front Lemming, then Old Mother Lemen, pour it out through Onward. Gerd makes every Kit an enemy hits cost it 3 Health, so a long chain of Kits wears down a board of giants. Cantor turns each Kit death into stats on your one big unit, which is often another tribe's unit with Cleave or Shield. The weakness: Kits that come out of the Burrow didn't start the fight, so a win deals little hero damage. The Tide wins rounds and hits lightly.\n\n**The Crossing (Burrow as currency).** Keep only three or four real units, ideally strong ones from another tribe, and feed them Kits. Raft-builder cashes Kits at a great early rate, and Herding Council takes 2 a turn. Ferrywife drains half the Burrow every turn into permanent stats. The puzzle is the order of operations. Herald counts the Burrow at Start of Turn. Matron counts the Herd at End of Turn, so seat her before the Council and the Ferrywife in reading order. Any Kit you want to keep, move onto the board before End of Turn, where the spenders can't reach it. The Crossing and the Tide fight over the same pile, and most games settle on a ratio between them.\n\n**The Banner (whoever is in front leads).** Brother Onward, plus Front Lemming or Snow Hall Guard, at F1. Front Kits die quickly and pass a Banner that grows each time: after five deaths, the sixth front unit carries +24/+24. Put a Kit at F1 so the Banner grows early, then a sturdy unit behind it to catch it. A Bog Mire unit or a Hunker unit is ideal, because it has to be attacked and doesn't die.\n\n**Kits for anyone (splash).** Squeaker plus Identical Cousin is a two-card package for any comp. Cousin turns a spare Kit into a copy of your key unit, and Created copies count for triples, so two copies of a Fairy or an Ooze plus a Kit make a golden and a Discover.\n\n**Mixing in a lobby.**\n- *Oozes:* Eat a Kit for a free permanent snack at Kit size, and a Belly can hold Kits. Nester is an endless pantry.\n- *Fairies:* a Ring slot with an Onward unit on it gives every Kit that steps in the Ring bonus. A ringed F1 under Front Lemming is a Kit factory with +4/+4 per Ring.\n- *Hedgerow:* tuck Kits into the Burrow so Pass reaches a real rightmost unit.\n- *Birds:* a Nest is an empty slot, so Tally fails, but a Bird away South frees a slot for Kits.\n- *Bog:* a Mire unit at the front is the best Banner holder.\n\n## 4. Risks and holes\n\n1. **Fight length and readability.** An Onward chain of 15 Kits and a passing Banner could make fights long and hard to follow. It needs a quick Kit-emerges animation and a Burrow count that ticks down on the hero.\n2. **Quadratic growth.** Kit count times Kit size grows on two axes. Herald plus Litter Keeper is the worst pair, at up to 10 Kits a turn. Litter Keeper's cap and Herald's cap keep both linear, but the Tide with a golden Mother Lemen and a golden Cantor needs a simulation check.\n3. **Stalling.** Plain 1/1 Kits with Onward and Bristle could drag fights out against boards with low Attack. Ties deal nothing, so a Tide that can't kill gives a lot of ties.\n4. **Identical Cousin as a generic card.** It works for any comp that owns a Kit. The guard is that Kits come only from Migration cards, but Squeaker is a Tier 1, so splashing is cheap. If Cousin turns up in every comp, require a *Lemming* next to it, or make the copy lose its text.\n5. **Tally outside the tribe.** Late in a game every board is full, so Tally is a generic gold-a-turn card. That may be fine (it costs a slot), or it may need \"if 3 or more are Kits\".\n6. **Hero damage.** The Tide's surfaced Kits add nothing to hero damage. That's a deliberate check, but the owner might feel it undercuts the fantasy.\n7. **Hidden information.** The Burrow is off the board, so its count should show on the opponent's hero.\n8. **Rules gaps.** End of Turn order (assumed reading order) and Onward against Belly summons need a ruling.\n\n## 5. Tier check\n\nKit value is taken at Kit size 1/1 early and 2/2–3/3 in a good setup. Bodies are 4 / 6 / 7 / 8.5 / 12 / 14.\n\n- **Tier 1:** Squeaker gives 3 stats plus a Kit, 5 once (1.25 bodies), a tempo Alleycat. Nester gives 2 stats a turn (0.5 bodies against 0.4), a little high on purpose, because Kits pay off only once the slot and Kit-size cards arrive.\n- **Tier 2:** Tally's 1 gold a turn is about a third of a unit, which fits the economy slot. Weaver is about 6 stats now plus every future Kit, about 1.3 bodies. Digger's two Onwards bring out about 4–6 stats in a fight, about 1 body. The bodies are slightly under 6 to pay for the text.\n- **Tier 3:** Front Lemming brings out 3 Kits, 6–12 stats in a fight, 0.9–1.7 bodies. That's at or slightly over the 0.7–1.4 range, on purpose: it's the card that names the comp. Matron makes up to 3 Kits, 6 stats a turn (0.86 bodies). Raft-builder gives 12 stats once for 3 Kits, net about 1 body. Ole deals 3–9 damage in a fight (0.4–1.3 bodies).\n- **Tier 4:** Council gives about +1/+1 to five units, 10 a turn (1.2 bodies), and costs 2 Kits. Litter Keeper adds up to 4 Kits, 8–16 a turn, on target to slightly high. Gerd reflects 3 per Kit hit, about 15 a fight (1.8 bodies against 2). Cousin's value is a body of 8–14 plus text (1–1.6 bodies) plus triple progress. The triple progress is the real price, and the multiplier slot here is spent on copying rather than stats.\n- **Tier 5:** Herald makes up to 6 Kits, 24–36 a turn (2–3 bodies against 2, top 5), capped so it can't run away. Cantor gives 8 Kit deaths at 4–6 stats, 32–48 in a fight (2.7–4 bodies against 4). Snow Hall Guard gives +4 to about 8 Kits plus a 14-stat body, about 3.8 bodies in a fight. It's the tempo piece that holds the line.\n- **Tier 6:** Mother Lemen pours out a Burrow of 10 at 3/3 to 4/4, plus her aura, about 70–90 in a fight (5–6.4 bodies against 6). Brother Onward's Banner over 5 front deaths totals about 80 in a fight (5.7 bodies). Ferrywife at a steady Burrow of 8–12 gives 4–6 Kits a turn to six units, 48–72 a turn (3.4–5 bodies against 4). It eats the Tide's fuel, which is the trade.\n- **Shape changes:** Tier 4 has a combat engine (Gerd) in place of a second buffer. This tribe's in-fight power comes through many small bodies, so an engine that pays per Kit hit belongs where the Burrow first gets big. Tier 6 has two capstones that compete (Tide against Crossing) plus the Banner payoff.\n\n## 6. Design rationale\n\n1. Started with the slot puzzle: a full board pays (Tally), but you need an empty slot to play. Free filler bodies make that a decision every turn.\n2. Filler that can't be sold at value needs somewhere to go, so overflow became a reserve: the Burrow.\n3. A reserve is dull unless it's spent three ways at different rates. Raft-builder, Council and Ferrywife convert it to stats, Ole to damage, Onward to fight HP. That's the leftover-rate puzzle.\n4. Onward emerged as what the death and reserve cards had in common, so it became the keyword. Fights never cost Kits, so the reserve stays a long-term number.\n5. Kit size as a single standing stat (\"more recipients, not bigger numbers\") gave a second axis, count against size, that multiply.\n6. Making the Burrow the only place spenders reach gave a positional trick: move a Kit onto the board to protect it.\n7. Matron's thresholds (every 4) make some spending free, a deliberate small leftover puzzle.\n8. Ole's Kits die and can't come out again: the same Kit is either a missile or a body, and it feeds Cantor.\n9. Reading order already decides who attacks first, so \"the front\" became a role. Front Lemming at Tier 3, the growing Banner at Tier 6.\n10. Created copies count for triples, so a Kit became raw material for a copy (Cousin). That's the main cross-tribe, use-it-for-something-else card.\n11. Caps on every self-feeding Kit maker (Matron, Litter Keeper, Herald) keep count growth linear. Fight-only payoffs (Cantor, Banner) carry the big numbers.\n12. Names and lore came last: lemmings making Kits, a fox census-taker, a learned lemming who proves they fall from the sky, the Edge cult, and the crossing of the Wide Water.\n","versions":[{"v":1,"summary":"Lemmings that make identical little Kit tokens, with extras waiting in an off-board Burrow.\nThe Burrow is spent three ways: as fight HP through Onward, as missiles, or as permanent stats for your real units.","data":{"design_id":"great-migration--bottom-up-mech","v":1,"identity":{"tribe_name":"The Great Migration","mechanic":"**Core mechanic: the Herd and its Burrow.** The tribe makes **Kits**: identical little Lemming tokens. Kits that don't fit on the board wait in the **Burrow**, an off-board reserve shown on your hero. **Onward** turns that reserve into fight HP. Every card in the tribe either grows the Herd, makes Kits bigger, or spends Kits on something else.","keywords":[{"name":"Burrow","text":"a Kit made with no empty slot goes into your Burrow. While recruiting, you can move Kits between the board and the Burrow for free. A Kit that goes into the Burrow loses its own buffs and keeps only Kit size. Your **Herd** is all your Kits, on the board and in the Burrow."},{"name":"Onward","text":"*When this dies, a Kit from your Burrow takes its slot.* Each Burrow Kit can come out once a fight. Fights never cost you Kits: the Burrow is full again afterwards."}],"plays":"Early on, Kits are free bodies that let you attack first and fill gaps. By the midgame you're running a stockpile that has three jobs at once. On the board it fills slots, which earns gold and moves Kits out of reach of the cards that spend from the Burrow. In the Burrow it's the Onward chain's fuel and ammunition for Ole. Spent, it becomes permanent stats on your real units. The tribe's numbers puzzles all pull on that one pile. You grow **count** (Kit makers) or **size** (Kit size), and they multiply. Spending at a good rate leaves you short of fight fuel, and some cards trigger at Herd thresholds, so a Kit spent below the next threshold is free. The tribe owns no big bodies of its own, so its best boards borrow a few strong units from other tribes and wrap them in Kits."},"units":[{"uid":"u01","name":"Yellowcoat Squeaker","tier":1,"attack":1,"health":2,"text":"When played: make a K
