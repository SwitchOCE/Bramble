a free unit a turn: strong T4 economy.\n- **T5:** Rohrsang doubles the share, a multiplier (×2 on the share part). Gernegroß gives about +10/+10 plus a shove of around 15, ~4 bodies in fight. Ottilie doubles Start of Combat, a direction multiplier. **Broken on purpose:** her golden is ×3, not ×4, to keep the golden ceiling at ×2–4.\n- **T6:** The Tower doubles every Hour effect (capstone). Kasimir makes up to 7 Eggs, limited by room (about 6 bodies in fight). Unruh gives about +12 permanent plus about 24 in fight, and can't be attacked (~3 to 4 bodies, under ~6, because he is also the alarm-woken last defender). **Broken on purpose:** the golden Tower is \"every attack\", a threshold change rather than a doubled number, so it needs a sim before it ships.\n\n## 6. Design rationale\n\n1. **Gaps found:** no tribe acts on the enemy's board or feeds on the enemy's size, so nothing punishes a tall board except raw stats. Every trigger is Start of Combat, on attack or on death; nothing pays off *later* in a fight.\n2. **More gaps:** a unit can't be protected without changing what it is (Shield is single-use), and no tribe is a general tool for other tribes' carries or Start of Combat cards.\n3. **A shared fight clock (the Hour)** fills the mid-fight gap, gives one visible beat for everything, and gives cards a timing lever (Wind) that Johnny can tune.\n4. **Eggs on enemy units, not in enemy slots,** because full late-game boards have no slots, while every board has hosts.\n5. **A quarter-share snapshot plus Brood:** the share punishes big boards (Spike counterplay), and Brood gives the tribe its own buffer axis, like Ring size.\n6. **Chicks need your empty slots,** which turns \"how many units do I field\" into a real decision and caps the tribe's output without extra limits.\n7. **The shove isn't an attack,** so the tribe answers Bog folk's Bitter and other defensive keywords: a counter role the lobby lacked.\n8. **Asleep can be put on any unit:** the dormice become a protect-and-grow tool for any tribe's carry, which is the main bridge for Johnny.\n9. **Ottilie's delay-and-double** makes the tribe a multiplier for other tribes' Start of Combat cards, a use outside its own theme.\n10. **Every Layer has a different host rule** (across, most Attack, back row, random, biggest, all), so placement and scouting stay decisions at every tier.\n11. **Slots placed by role on the tier guide's shape:** T4 holds a stat holder (Nest-Box) instead of a second buffer, because the tribe needs a way to turn temporary Chicks into permanent stats.\n12. **Names and figures last:** the guild's notable figures fill the T4–T6 slots whose rules match their stories.\n","versions":[]},{"id":"dyke-board--one-constraint","key":"dyke-board-ac02","seed":"dyke-board","route":"one-constraint","tribe_name":"The Dyke Board","status":"written","final_version":null,"stop_reason":null,"md":"# The Dyke Board\n\n## 1. Identity\n\n**The tribe's law: one water level for everyone.** All your Dyke Board units (**Board units**) have the same Health, your **Level**.\n\n- **Pool.** Health a Board unit would gain goes into your **Pool**. Your Level is the Pool shared evenly among your Board units, rounded down. The remainder stays in the Pool. The Level is never below 1, and with no Board units the Pool just waits.\n- **Joining.** A Board unit you play pours its own Health into the Pool, then sits at the Level like the rest.\n- **Leaving.** A Board unit that leaves while recruiting (sold, tripled, anything) leaves its share in the Pool. Water only goes out when a card takes it: \"take X from your Pool\", or an Ooze's Eat, which takes the eaten unit's share.\n- **Fights.** Each Board unit starts the fight at the Level and takes damage on its own. Health gained in a fight stays on that unit.\n- **Attack is never shared.** Every unit keeps its own Attack.\n- **Pour X:** add X to your Pool. This is the tribe's only way of making Health from nothing.\n- **Under:** a unit on either board that isn't one of your Board units and has less Health than your Level. This includes your own units from other tribes, and enemy Board units.\n\n**How it plays.** Every Health buff you get goes to the whole Board, so you can never build one big tank. What you decide is how many seats the Board has. Say your Pool is 120. With 6 Board units at Level 20 you have more attackers and the count cards pay off. With 3 at Level 40 each unit is a wall and more enemies are Under, so they drown. A new 4/1 coot drops everyone's Level, and selling one raises it, because sold units leave their water behind. Beavers pour, coots fight, and Attack is where your units stand apart. Units from other tribes are both a resource and a risk. They can feed the Pool, take a seat on the Board, or be left outside, where a high Level drowns them along with the enemy.\n\n## 2. The 19 units\n\nBoard unit = a Dyke Board unit. \"Your Level\" in a fight means the Level when the fight starts, unless Hendrika raises it.\n\n| # | Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|---|\n| 1 | Bench Coot | 1 | 3/1 | Has +1 Attack for each other Board unit you have. | 6/2. +2 Attack for each. |\n| 2 | Biesbosch Kit | 1 | 1/3 | End of Turn: Pour 2. | 2/6. Pour 4. |\n| 3 | Mud Hauler | 2 | 2/4 | When played: Pour 2 for each Board unit you have. | 4/8. Pour 4 for each. |\n| 4 | Rearing Coot | 2 | 4/2 | Start of Combat: gain Attack equal to a third of your Level. | 8/4. Two thirds of your Level. |\n| 5 | Ledger Coot | 2 | 1/4 | Once a turn, when you sell a Board unit, gain 1 gold. | 2/8. Twice a turn. |\n| 6 | Heemraad | 3 | 3/4 | When played: give a seat on the Board to another unit of yours that isn't a Board unit. It becomes a Board unit permanently, keeping its own tribe, and pours its Health in. | 6/8. Two units. |\n| 7 | Nest-Platform Coot | 3 | 2/4 | End of Turn: if you have an empty slot, summon a 1/1 Coot Chick next to this. | 4/8. Two Chicks. |\n| 8 | Winter Raft | 3 | 2/5 | End of Turn: give your Board units +1 Attack. | 4/10. +2 Attack. |\n| 9 | Kees Kowk | 3 | 4/3 | Attacks an Under enemy when one can be attacked. Deals double damage to Under enemies. | 8/6. Triple damage. |\n| 10 | Dike-Walker | 4 | 3/6 | End of Turn: Pour 1 for each Board unit you have, and give them +1 Attack. | 6/12. Pour 2 each, +2 Attack. |\n| 11 | Miller of the Nine Mills | 4 | 2/6 | Your other Pour effects pour twice as much. | 4/12. Three times as much. |\n| 12 | Aaltje Sluiswacht | 4 | 4/4 | End of Turn: if your Level is 6 or more, take 2 from your Pool for each Board unit and give each of them +3 Attack. | 8/8. Take 4 each, give +6 Attack. |\n| 13 | Eel-Trap Coot | 4 | 4/4 | Start of Turn: if your Pool has 10 or more, take 5 from it and gain 2 gold. | 8/8. Take 10, gain 4 gold. |\n| 14 | Levy-Master | 5 | 5/7 | End of Turn: Pour 5 for each of your units that isn't a Board unit. | 10/14. Pour 10 for each. |\n| 15 | Old Bram Stuw | 5 | 4/8 | When another Board unit dies, share half your Level among your other Board units as Health. | 8/16. All of your Level. |\n| 16 | Meester Kobus Bles | 5 | 3/9 | Your Board units' End of Turn effects happen twice. | 6/18. Three times. |\n| 17 | The Spaarndam Pup | 6 | 7/7 | In fights, damage dealt to one of your Board units is split evenly among all of them. The one hit takes any remainder. | 14/14. The damage is halved first, then split. |\n| 18 | The Peilmeester of Stillwater | 6 | 6/8 | Start of Combat: each Under unit, on both boards, takes damage equal to your Level minus its Health. | 12/16. Twice that. |\n| 19 | Dyke-Reeve Hendrika van Knaagt | 6 | 7/9 | Start of Combat: raise your Level by half for this fight. Your Board units gain that much Health, and your cards use the new Level. | 14/18. Double your Level. |\n\n**Token.** *Coot Chick*, 1/1 Board unit, Created (sells for 0). There are no tribe spells.\n\n**Worked numbers.**\n- **Peilmeester:** at Level 40, an Under 10/18 enemy takes 22 and dies, while a 10/30 takes 10 and survives at 20. A unit with half your Level or less drowns outright. Your own 6/12 Bird would also drown, unless it has a seat on the Board.\n- **Hendrika:** Start of Combat resolves in reading order. Hendrika in F1, ahead of the Peilmeester and the Rearing Coots, raises the Level before they read it. Put her behind them and they read the old Level.\n\n## 3. Builds\n\n**High Water (tall).** Keep 2 or 3 Board units: Levy-Master, the Peilmeester or Hendrika, and a Rearing Coot or Kees. Fill the other 4 slots with another tribe. Levy-Master pours 20 a turn from those 4, doubled by the Miller and repeated by Kobus. All of it is shared among 3 units, so the Level climbs fast. The catch is that your own outsiders drown under the Peilmeester if their Health is below the Level. So you want outsiders that are fat (Bog Mire tanks, Oozes that have eaten), or a Heemraad to seat the weak one, though a seated unit no longer counts for Levy-Master. Every slot is a choice between \"pays the levy\" and \"on the Board\".\n\n**Full Benches (wide).** Play 6 or 7 Board units: Bench Coot, Chicks, Mud Hauler, Winter Raft, Dike-Walker, Aaltje. The Level stays modest (15 to 25), but the count cards scale and Aaltje turns water into Attack across the whole bench. The capstone is the Spaarndam Pup: every hit is shared, so no unit is picked off and the Board breaks all at once or not at all. Old Bram is the other way to finish. Chicks die early, and each death pours half a Level into whoever is left.\n\n**Seats for Hire (cross-tribe).** Heemraad seats a unit from another tribe, and its Health becomes everyone's:\n- A seated Ooze's Eat and Digest gains pour into the Pool.\n- A seated Bird can Fly South. Its share stays behind, Ledger Coot still pays 1 gold, and it comes home with doubled stats to pour in again.\n- A seated Bog unit with Mire draws attacks, and under the Pup the damage is spread over the whole Board.\n- Kobus repeats seated units' own End of Turn effects too.\n\n**Sluice and Ledger (water as money).** The Miller and Biesbosch Kits fill the Pool. Eel-Trap Coot sells water for 2 gold a turn, and Aaltje sells it for Attack. The Level stays low on purpose. Sell Chicks into Ledger Coot. This build wins on gold and Attack, not Health, and it is the build that least wants the Peilmeester.\n\n**In a lobby.**\n- **Bog folk, Oozes:** the best partners. They supply big-Health outsiders that stay above the Level, or that are worth seating.\n- **Birds, Fairies:** feed Seats for Hire. A Ring on a Board unit's slot gives the whole Board its Health.\n- **Hedgerow folk:** Pass X into a rightmost Board unit spreads across the Board.\n- **Hunters:** Quarry on the enemy across pairs with Kees's Under targeting.\n- **As an opponent:** the Board is worst for wide boards of small units, which the Peilmeester drowns, and harmless to a few huge units.\n- **Mirror match:** two water boards compare Levels, and the lower one's Board units are Under.\n\n## 4. Risks and holes\n\n- **Readability.** The Level is a moving average. The board needs a gauge staff that shows the Pool and the Level, and a preview of the new Level while you drag a unit in or out. Without one, buying a unit just looks like everyone losing Health.\n- **Early feel-bad.** Dilution hurts on turns 1 to 4. A 4/2 Rearing Coot dropping your Kit from 3 to 2 Health feels wrong until you see the water stay.\n- **The Peilmeester is swingy.** It kills wide boards outright and does nothing to big ones. Lever if needed: half the difference.\n- **Stacked multipliers.** The Miller (×2 amount) and Kobus (×2 triggers) make ×4 on End of Turn Pours. Levy-Master with 4 outsiders then pours 80 a turn at Tier 5, against a top of about 60. With goldens it goes to ×9. It grows linearly, not by compounding, but it is the high roll to watch. Lever: the Miller doesn't stack with another Miller or doubles only Tier 1 to 4 Pours.\n- **Seated Bird loop.** Fly South doubles the Level-sized Health, so a seated Bird adds twice the Level every two turns. Lever: a Board unit flying south doubles its printed Health only.\n- **The Spaarndam Pup changes hero damage.** All your Board units tend to survive or die together. That needs a playtest, and it adds a split to every hit.\n- **Rules for other tribes.** Seats change a unit's tribe permanently. Shy, \"biggest\", Eat and triples need clean edge rules. Eat taking a share and leaving water behind are both written into the law.\n- **Holes.** No Shield, Swoop or back-row reach. Few Start of Combat answers at Tiers 1 to 2. High Water hangs on two cards at Tiers 5 to 6 (Levy-Master, Peilmeester). Nothing uses spells, beyond Pouring them.\n\n## 5. Tier check\n\n- **Tier 1.** Both are 4-stat bodies. Bench Coot is tempo, about +1 to +3 Attack in a fight. Biesbosch Kit is the seed, at +2 a turn (about 0.5 body). Its 1 Health dilutes on purpose.\n- **Tier 2.** Mud Hauler gives about 8 once at 4 units (1.3 bodies). Rearing Coot gives about 4 to 6 in a fight. Ledger Coot is economy at 1 gold a turn. Its 5-stat body is light on purpose.\n- **Tier 3.** Winter Raft gives about 5 a turn at 5 units. Kees gives about 5 to 8 extra in a fight. Heemraad's value is whatever it seats. Nest-Platform Coot is under the guide in raw stats, but it adds a body a turn at the Level and feeds the count and sell cards.\n- **Tier 4.** Dike-Walker gives about 10 a turn at 5 units, on the guide. The Miller is the first multiplier. Aaltje makes only about 5 net, but she moves 10 Health into 15 Attack. Eel-Trap Coot is 2 gold a turn, above Battlegrounds' Tier 4 economy, paid for in water.\n- **Tier 5.** Levy-Master pours about 20 a turn with 4 outsiders, the direction card. Old Bram gives about 40 in a fight. Kobus is a Brann-style trigger multiplier. With the Miller it breaks the top on purpose, as the tribe's chase.\n- **Tier 6.** Hendrika gives about half the Pool as Health in a fight, plus a stronger Level, about on the target. The Spaarndam Pup's value is hard to price: no extra stats, but it ends picking units off. The Peilmeester breaks the target against wide boards on purpose, as the drowning the seed promises. See Risks for the lever.\n\n## 6. Design rationale\n\n1. **The law came first:** Board units share one Health. \"One water level for everyone\" taken literally gives a real choice: more bodies or higher water.\n2. **Health is shared, Attack isn't,** so units keep an identity and Attack buffs are how they differ.\n3. **Sold units leave their water,** so going tall is a choice rather than a loss, and \"who will not dike must leave\" becomes a play.\n4. **Under compares the Level with every non-Board unit, on both boards.** Swim or drown hits your own outsiders too, which makes seats matter.\n5. **The tribe splits along the law's axis.** Count cards (wide) against Level cards (tall), each with a Tier 6.\n6. **Outsider cards (Heemraad, Levy-Master)** make other tribes the water source, for Johnny's cross-tribe uses.\n7. **Take-from-Pool cards (Aaltje, Eel-Trap)** make lowering the water a vote too, and turn the Level into a currency.\n8. **No Pour scales with the Pool or the Level,** so growth stays linear and passes the runaway check.\n9. **There are two multipliers on different axes** (the Miller on amount, Kobus on triggers), so combinations and goldens have a ceiling to chase.\n10. **Shared damage in fights is held back to one Tier 6,** so the law reaches combat only if you build for it.\n11. **Hendrika's raise follows reading order,** so placement against the Peilmeester and the Rearing Coots is a decision.\n12. **Names came last.** Beavers pour, coots fight, and the figures from the seed went to the cards that fit them.\n","versions":[]},{"id":"dyke-board--surgical","key":"dyke-board-9f64","seed":"dyke-board","route":"surgical","tribe_name":"The Dyke Board — v1","status":"written","final_version":null,"stop_reason":null,"md":"# The Dyke Board — v1\n\n## 1. Identity\n\n**Level.** Each player has a Level, a permanent number shown on a gauge staff beside the board. It starts at 0 and can go below 0.\n\n**Vote:** Raise or Lower your Level by 1, your choice. Raising and Lowering are both \"the Level changing\".\n\n**The water.** Before any Start of Combat effect, the water rises on **both boards** to your Level plus your opponent's Level, never below 0. After that, \"Raise the water by N\" effects add N for this fight only.\n\n**Under:** a unit whose Health is at or below the water. It attacks with half its Attack. Units sink and come back up as their Health changes during the fight. A unit \"goes Under\" each time it sinks: when the water rises, when it is damaged, or when it is summoned into the water.\n\n**Dive:** while Under, this keeps its full Attack, and enemies attack it only if they have no other target.\n\nCards that read \"your Level\" treat a Level below 0 as 0.\n\n**How it plays.** Every turn the Board votes, and you can see your next opponent's last board when you do. Against glass cannons, Eggs and token swarms, you Raise: their small units sink and attack at half strength, while your beavers are built tall and stay above the water. Against tall walls, the water does little, so you Lower: drained land pays gold and stats, and a Level below 0 even drains away a rival Board's flood. Mills pay whichever way you vote, so a Board that keeps changing its mind grows too. The water treats both sides the same, so the puzzle is your own board's shape: who stays above, who dives on purpose, and who you can afford to let drown.\n\n## 2. The 19 units\n\n| Unit | Tier | A/H | Text | Golden |\n|---|---|---|---|---|\n| **Kees Kowk** (coot) | 1 | 2/2 | Attacks an Under enemy if it can. Once a fight, after it does, it gains +1/+1 permanently. | …gains +2/+2 permanently. |\n| **The Spaarndam Pup** (beaver) | 1 | 1/3 | When played: Vote. Whenever the Level changes, this gains +0/+1 permanently. | When played: Vote twice. …+0/+2. |\n| **Aaltje Sluiswacht** (beaver) | 2 | 2/4 | Start of Turn: Vote. If you Lower, gain 1 gold. | Start of Turn: Vote twice. Gain 1 gold for each Lower. |\n| **Schouw-Walker** (beaver) | 2 | 2/3 | End of Turn: your lowest-Health other unit gains +1/+2 permanently. | …+2/+4 permanently. |\n| **Ditch Coot** (coot) | 2 | 3/2 | Dive. Start of Combat: Raise the water by 1. | …by 2. |\n| **Meester Kobus Bles** (coot) | 3 | 2/5 | Start of Turn: Vote. Whenever you Vote, this gains +1/+1 permanently. | Start of Turn: Vote twice. …+2/+2 permanently. |\n| **Sail-Setter** (beaver) | 3 | 1/6 | Whenever the Level changes, the units beside this gain +1/+1 permanently. (Twice a turn.) | …+2/+2… |\n| **Stretch-Holder** (beaver) | 3 | 2/5 | This and the units beside it have +0/+X, where X is your Level. | …+0/+2X. |\n| **Rafting Coot** (coot) | 3 | 2/4 | Dive. Whenever an enemy goes Under, this gains +2 Attack for the fight. | …+4 Attack… |\n| **Heemraad Old Bram Stuw** (beaver) | 4 | 3/6 | The first time the Level changes each turn, Vote. | The first two times… |\n| **Keeper of the Overflow** (beaver) | 4 | 3/5 | Whenever you Lower your Level, this gains 1 Overflow permanently. Start of Combat: Raise the water by its Overflow. | …gains 2 Overflow… |\n| **Board Almoner** (coot) | 4 | 3/5 | End of Turn: each of your units with Health at or below your Level gains +2/+2 permanently. | …+4/+4 permanently. |\n| **Polder Smallholder** (beaver) | 4 | 4/4 | Whenever you Lower your Level, two random other units gain +1/+2 permanently. (Twice a turn.) | …+2/+4… |\n| **Gauge-Keeper of Stillwater** (beaver) | 5 | 4/8 | Start of Combat: Raise the water by your Level. | …by twice your Level. |\n| **The Winter Raft** (coot) | 5 | 5/7 | Dive. Whenever an enemy goes Under, your units gain +1/+1 for the fight. (Six times a fight.) | …+2/+2… |\n| **Penningmeester Hiske** (coot) | 5 | 4/8 | Whenever you Lower your Level, gain 1 gold. (Three times a turn.) | …gain 2 gold… |\n| **Dyke-Reeve Hendrika van Knaagt** (beaver) | 6 | 6/10 | Whenever you Vote, Vote once more the same way. (Her own Votes don't repeat.) | …Vote twice more the same way. |\n| **Tiddy Mun** (the Board keeps him a seat) | 6 | 5/9 | Start of Combat: Raise the water by 4. Enemies with Health at or below half the water drown (are destroyed). | …Raise the water by 8… |\n| **Master of the Nine Mills** (beaver) | 6 | 7/7 | Whenever the Level changes, your units gain +1/+1 permanently. (Nine times a turn.) | …+2/+2… |\n\n**Drowning** keeps working through the fight: an enemy whose Health drops to half the water or less drowns, and so does an enemy summoned that low.\n\n**Spell (shop pool, kept to one): Motion Carried** (2 gold): Vote twice.\nAny player can buy it, so a lobby always has an answer to a flooding Board: two Lowers cut the water you fight in.\n\nNo tokens.\n\n## 3. Builds\n\n**High Water (Raise).** Pup and Sluiswacht Raise from the start. Stretch-Holder goes in the back row, with the units it lifts beside it, so its neighbours stay above any water you set. Ditch Coot and Rafting Coot sink on purpose, Diving and keeping their full Attack while the enemy's front line halves. Board Almoner tops up anything left below your Level. The finish is Gauge-Keeper doubling the water and Tiddy Mun drowning everything at half of it. The weak point is Stretch-Holder: if it dies, its neighbours sink.\n\n**Drain (Lower).** You vote Lower every turn and let the Level go below 0. Sluiswacht and Penningmeester pay gold, Smallholder and Sail-Setter pay stats, and Master of the Nine Mills turns every Lower into stats for the whole board. You fight in no water at all, so this build can carry any other tribe, and with roll gold it chases triples. Keeper of the Overflow is the hinge: it turns your Lowers into fight-only water, so a draining Board can still flood the fight without pushing its Level up.\n\n**The Seesaw (vote to the matchup).** Check the next opponent and vote toward them: Raise against Hunters and Birds, Lower against Bog walls. Bram Stuw echoes the first change each turn, Hendrika doubles every Vote, and Sail-Setter and Master of the Nine Mills pay for each change in either direction. A Level that swings from +4 to −2 and back is pure income for the mills.\n\n**Splashes in a lobby.**\n- **Bog folk:** Mire walls are tall and stay above the water while the units attacking them sink. Their Bitter halves Attack on top of the water's halving.\n- **Oozes:** Eat makes units fat enough to stand above the water. Enemy Belly releases arrive small and sink at once, which triggers Rafts and gets them drowned.\n- **Fairies:** Rings' +4/+4 lifts units over the line.\n- **Hedgerow:** Pass feeds Health to your rightmost unit.\n- **Hunters and Birds:** glass cannons and Eggs drown, yours included. Pair those with the Drain build, or keep them beside a Stretch-Holder.\n- **Cross-purpose tricks:**\n  - Raise the water to sink your own coots so they Dive.\n  - Keep a cheap support unit below your Level so Almoner feeds it every turn.\n  - Go below 0 to blunt a rival Board's flood.\n  - Give an enemy Nightshade unit a reason to sink: it loses half its Health the moment it is attacked, and that triggers your Rafts.\n\n## 4. Risks and holes\n\n- **Readability.** Both boards change, and every Health change can flip a unit Under. This needs a clear waterline drawn across both boards, with sunk units visibly submerged. Otherwise the fights feel random.\n- **Vote prompts.** With four or more Votes a turn, asking every time is tedious. It may need a standing \"Raise or Lower this turn\" switch that you set once.\n- **Water runaway.** Gauge-Keeper and Tiddy Mun plus a big Level or Overflow could drown a whole board at Start of Combat. Drowning at *half* the water is the brake. A further cap (\"the water is at most twice your Level plus 10\") may be needed after sims.\n- **Overflow grows without limit.** It only counts Lowers, so it grows slowly, but a long game could make it huge. Possible fix: it keeps only the last three turns' Lowers.\n- **Drain economy.** Sluiswacht, Penningmeester and Hendrika together could pay six or more gold a turn. Gold carries over without a cap, so watch this for triple-chaining.\n- **Cliff at the threshold.** At Health equal to the water a unit halves its Attack; one more Health and it doesn't. Small buffs swing fights, which is good for Johnny but noisy for balance.\n- **Pricing the Level.** One Level has no fixed stat value. It is worth a lot against tokens and nothing against walls, so the tier numbers below are estimates.\n- **Mirror rules.** Two Boards add their Levels. A Drain player's negative Level partly cancels a Flood player's Level. That is intended, but confusing to read.\n- **Edge rules.**\n  - If every attackable unit Dives, attacks go ahead as normal.\n  - If neither side has a unit that can attack, the fight is a tie.\n  - Tiddy Mun drowns only enemies.\n\n## 5. Tier check\n\n- **Tier 1:** bodies of 4, on target. Kees grows +2 stats a turn and Pup +1–3 Health, against a target of ~1.6. Kees is a little high, held back by his once-a-fight limit.\n- **Tier 2:** bodies of 5–6. Schouw-Walker gives 3 stats a turn (target 2–6). Sluiswacht is a gold-or-Raise choice worth up to 1 gold a turn. Ditch Coot gives 1 point of water; it has no stat price, so it is a low-body enabler.\n- **Tier 3:**\n  - Bodies 6–7.\n  - Kobus gives 4–8 stats a turn and Sail-Setter up to 8 (target ~5.6), both slightly high.\n  - Stretch-Holder gives 2×Level Health in the fight. That is ~12 mid-game (target 5–10) and more later.\n  - Rafting Coot gives ~8 Attack in a fight (target 5–10).\n  - I broke the guide on purpose with Stretch-Holder: it is the tribe's whole defence, and it scales with what the player has put into the Level.\n- **Tier 4:** bodies 8–9. Almoner (~12 a turn) and Smallholder (12) match the target of ~11. Bram is a multiplier that adds one Vote a turn. Overflow is priced like a slow Raise.\n- **Tier 5:**\n  - Winter Raft gives ~56 in a fight, typical, and 84 at most, against a target of ~48. That is the T3 Raft's job spread over seven units instead of one.\n  - Penningmeester gives 3 gold, about a unit a turn.\n  - Gauge-Keeper doubles your share of the water: a multiplier that also hurts your own short units.\n- **Tier 6:**\n  - Master of the Nine Mills gives ~56 a turn at four changes (target ~56) and 112 with Hendrika; the nine-a-turn cap keeps the golden at ×4.\n  - Hendrika doubles the Votes.\n  - Tiddy Mun's value depends on the enemy board. It is high against wide boards and is the tribe's deliberate outlier, flagged under Risks.\n\n## 6. Design rationale\n\n1. **Gap:** no tribe acts on both boards at once. Bog folk and Hunters touch only the unit across.\n2. **Gap:** seeing your next opponent's board is a system no tribe uses. A per-turn up-or-down choice makes scouting a decision.\n3. **Gap:** nothing cares about a unit's shape (Health against Attack). A Health waterline does, and it gives Bog's walls and Oozes' fat units a partner while punishing glass cannons and tokens.\n4. Under halves Attack and doesn't kill: it holds the line without wiping boards, and drowning is kept for one capstone.\n5. The Level can go below 0 and the water adds both Levels, so Lowering is a real choice and the mirror has a counter.\n6. Votes are always 1 point each, so every payoff counts changes, and goldens and Hendrika multiply the count instead of the size.\n7. Three payoff families (Level read, Lower paid, any change paid) give three builds that share their Vote sources.\n8. Dive was added so the tribe's own small coots want the water. That is the main use against the rule's intent.\n9. Stretch-Holder and Almoner were placed at T3–T4 to make flooding one-sided only if you build for it.\n10. Keeper of the Overflow and the Motion Carried spell were added as bridges: Drain to Flood inside the tribe, and any tribe to the Level.\n11. The tier shape follows the guide (T5: multiplier, combat engine, direction). T6 has one capstone for each build plus the shared multiplier.\n12. Names and flavour came last: beavers hold, build and pay; coots kick, dive and object.\n","versions":[]},{"id":"dyke-board--top-down-mech","key":"dyke-board-a674","seed":"dyke-board","route":"top-down-mech","tribe_name":"The Dyke Board (v1)","status":"written","final_version":null,"stop_reason":null,"md":"# The Dyke Board (v1)\n\n## 1. Identity\n\n**Core mechanic: the Level.** Every Dyke Board player keeps a water **Level**, from 0 to 5. It starts at 0, stays between turns, and is shown on the board, so your next opponent can see it.\n\n- **Raise N / Drain N:** move the Level up or down N steps. A step that would go past 5 or below 0 does nothing. Each step that does move it is a **change**. \"Raise N for this fight\" puts the Level back where it was when the fight ends.\n- **The Flood (rule):** after all Start of Combat effects, each player whose Level is above 0 Floods, in Start of Combat order. Every front-row unit **on both boards** takes damage equal to a tenth of its Health for each Level (rounded down, at least 1). So at Level 5 it loses half its Health. A unit \"hurt\" by the Flood is one that took this damage. Shield stops it and Damage Reduction reduces it. **After the Flood** effects trigger next.\n- **Afloat:** Floods don't harm this. Every coot is Afloat.\n- **Dike:** Floods don't harm this or the units beside it.\n\n**How it plays.** The Board votes the water up or down, and the vote cuts both ways. Each Level you hold makes the Flood take another tenth of the Health of every front-row unit on both sides, yours included. Coots float, and a beaver's Dike keeps its neighbours dry, so your front row becomes a puzzle: which slots float, which sit beside a Dike, and who stands in the water on purpose. Draining has a price too, because the Board's mills and sluices pay in gold and stats every time the Level goes down. You keep choosing between a high Level for the fight and draining for value, and the strongest boards do both by swinging the Level every turn, because many cards pay on each change, in either direction. The cards trigger each other: votes feed growth, the Flood feeds combat engines, deaths bring the Flood back, and other tribes' units can be given Afloat, drowned on purpose, or used to make you sell.\n\n## 2. The 19 units\n\n| Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|\n| Bench Coot | 1 | 2/2 | Afloat. When played: Raise 1. | 4/4. Raise 2. |\n| Minute Coot | 1 | 1/3 | Afloat. Whenever the Level changes, gain +1/+1 permanently. Twice a turn. | 2/6. +2/+2, twice a turn. |\n| Raft Coot | 2 | 3/3 | Afloat. When played: give another unit Afloat permanently. If it already has Afloat, give it +3/+3 permanently instead. | 6/6. Two other units; +6/+6 instead. |\n| Ring-Dike Beaver | 2 | 2/4 | Dike. Whenever you Raise, give the units beside this +1/+1 permanently. | 4/8. +2/+2. |\n| Sluice Keeper | 2 | 2/4 | Start of Turn: you may Drain 1. If you do, gain 1 gold. | 4/8. You may Drain up to 2, gaining 1 gold for each. |\n| Polder Millwright | 3 | 3/4 | End of Turn: Raise 1 and Drain 1, in the order you choose. | 6/8. Raise 2 and Drain 2, in any order. |\n| Objecting Coot | 3 | 3/4 | Afloat. Whenever you sell a unit, Raise 1. | 6/8. Raise 2. |\n| Ditch-Digger | 3 | 2/5 | Dike. Whenever you Drain, give a random other unit +2/+2 permanently. | 4/10. +4/+4. |\n| Kees Kowk | 3 | 3/4 | Afloat. After the Flood: gain +2 Attack for each enemy unit it hurt. | 6/8. +4 Attack each. |\n| Meester Kobus Bles | 4 | 3/5 | Afloat. Your effects that trigger when the Level changes, or when you Raise or Drain, trigger twice. | 6/10. Three times. |\n| Aaltje Sluiswacht | 4 | 3/6 | Start of Combat: Raise 2 for this fight. | 6/12. Raise 4 for this fight. |\n| Inspecting Heemraad | 4 | 2/7 | End of Turn: give the units in front of this +1 Attack and +1 Health for each Level, permanently. | 4/14. +2 Attack and +2 Health for each Level. |\n| Winter Raft | 4 | 3/5 | Afloat. End of Turn: give your other Afloat units +1/+1 permanently, or +2/+2 if the Level is 4 or more. | 6/10. +2/+2, or +4/+4 at Level 4 or more. |\n| Tail-Slapper | 5 | 4/8 | Dike. Twice a fight, after a friendly unit dies: Flood again. | 8/16. Four times a fight. |\n| Heemraad Old Bram Stuw | 5 | 5/7 | Whenever the Level changes, give your smallest unit +3/+3 permanently. | 10/14. +6/+6. |\n| Drowned-Spire Coot | 5 | 4/8 | Afloat. After your first Flood each fight: give your other Afloat units +1/+1 permanently for each enemy unit it hurt. | 8/16. +2/+2 for each. |\n| Dyke-Reeve Hendrika van Knaagt | 6 | 6/8 | Twice a turn, when you Raise or Drain: you may keep going the same way, a step at a time, until the Level is 5 or 0. | 12/16. Four times a turn. |\n| The Spaarndam Pup | 6 | 5/9 | Floods can't harm your units. Your Floods also reach the enemy back row. | 10/18. As normal, and your Floods come twice. |\n| Master of the Nine Mills | 6 | 7/7 | Whenever you Drain, give your units +1/+1 permanently. When the Level reaches 0, give them +2/+2 more. | 14/14. +2/+2, and +4/+4 more at 0. |\n\nNotes on the text:\n- \"Smallest\" means the least Attack plus Health, the opposite of biggest.\n- \"In front of\" is the diagonal link, so a back-row Heemraad feeds two front-row units. In the front row it feeds no one.\n- Hendrika's extra steps are the same kind as the vote that set them off. After an Aaltje \"for this fight\" Raise, they last only for the fight.\n- Kobus multiplies the responses to a vote, never the vote itself. No card makes a vote because of a vote, so there is no loop.\n\n**Spell (one, shop-only in lobbies with the tribe).** *Motion Carried:* Raise or Drain 1, twice, choosing each time. It's priced like the cheaper shop spells.\n\nNo tokens.\n\n## 3. Builds\n\n**High Water (Flood build).** Hold the Level at 4–5. Afloat coots stand in the front row, a Ring-Dike or Ditch-Digger keeps the non-floating front units dry, and Heemraads stand behind. Bench Coot and Objecting Coot raise it. Kees Kowk and Drowned-Spire Coot cash in every enemy unit the Flood hurts, and Winter Raft grows the floaters. Tail-Slapper brings the Flood back as units die, which also sets off Kees again. The capstone is The Spaarndam Pup: the Flood stops hurting you and reaches the enemy back row as well.\n\n**The Minutes (swing build).** The Level matters less than how often it moves. Polder Millwright gives two changes every turn without moving the Level, and Minute Coot, Ring-Dike Beaver, Ditch-Digger and Old Bram all pay on changes. Kobus Bles doubles every one of those. The capstone is Hendrika: Sluice Keeper's Start of Turn Drain carries the Level all the way to 0, and the Millwright's End of Turn Raise carries it back to 5. That is ten changes a turn, and the Flood is at full height for the fight.\n\n**Dry Polder (pump build).** Keep the Level low and take the gold and stats: Sluice Keeper every turn, Ditch-Digger, Master of the Nine Mills, and its bonus when the Level reaches 0. Aaltje Sluiswacht is the trick: she closes the sluices at Start of Combat, so a board that drained all through recruiting still floods at Level 2 (4 if golden). Her Raise also sets off Ring-Dike in the fight.\n\n**In a lobby with other tribes.**\n- *Birds:* Fly South sells a Bird every turn, and each sell is an Objecting Coot Raise. An Egg in a Nest drowns at Level 1, so put Nests in the back row.\n- *Oozes:* stand an Ooze in your front row without protection and let your own Flood kill it. Its Belly opens after the Flood, and the units inside come out in its slot without having been flooded. Each death also feeds Tail-Slapper.\n- *Hunters:* if the Flood kills the Quarry before any attack, Take fires, and Pack Hunters with Raft Coot's Afloat stay dry.\n- *Bog folk:* Mire units have big Health, so they take the Flood as a share and live. A Mire unit given Afloat by Raft Coot holds the front for free.\n- *Fairies and Hedgerow:* Ring stats and Pass growth make big Health, which survives the Flood but still loses its share. Raft Coot on the Hedgerow's rightmost unit makes it a dry carry.\n- *Against the tribe:* Shields stop one Flood, so neutral Shield units are the cleanest answer. Sparse front rows and Damage Reduction also work, and the Level is visible in advance.\n\n## 4. Risks and holes\n\n- **The Flood is a share of Health on every front row.** At Level 5 it is half. That may be too strong late or too weak against Shields. The tenths and the cap of 5 are the dials to test first. The \"at least 1\" floor makes Level 1 pop Shields and kill 1-Health units early, which could dominate turns 2–4.\n- **It is not fun to be flooded.** Opponents' front rows melt before anyone attacks. Their answers are Shields, an empty or high-Health front row, and seeing the Level ahead. The open question is whether that is enough counterplay or just dull positioning.\n- **Two Floods in a mirror** can wipe both front rows. Spaarndam Pup is a hard counter there, so mirrors may hinge on who finds her.\n- **High roll:** Hendrika + Kobus + Old Bram or Nine Mills. Ten changes doubled is about 200 or more stats a turn. Nothing in it feeds its own source, so it is bounded per turn, but it needs a sim at Tier 6.\n- **Permanent stats from inside a fight:** Aaltje's in-fight Raise sets off Ring-Dike, and Drowned-Spire Coot's buff is permanent. Decide whether fight-time votes may give permanent stats. If not, the Minute and Ring-Dike text needs \"while recruiting\".\n- **Raise and Drain payoffs pull against each other.** Ring-Dike pays on Raises and Ditch-Digger on Drains. Polder Millwright makes both work, but it may turn into a must-have.\n- **Afloat is worth little outside the tribe** unless a Flood is in the lobby. Raft Coot's +3/+3 fallback covers that, but the cross-tribe hook is thin.\n- **Rules timing:** does a unit drowned by the Flood change who attacks first? I assume not, because first attacker is decided before Start of Combat. Also, the Flood's place relative to other tribes' After-Start-of-Combat effects isn't settled.\n- **Five terms** (Level, Raise/Drain, Flood, Afloat, Dike). That is the same as Bog folk, but the Flood's tenths are a calculation the screen must show.\n\n## 5. Tier check\n\nBody = median printed A+H (4 / 6 / 7 / 8.5 / 12 / 14). Growth figures are for a good setup around Tier 4–5, with about 4 changes a turn (2 Raises and 2 Drains) and Level 4.\n\n- **Tier 1 (4, 4):** Bench Coot is the tempo body, and its once-only Raise is one point of Level held for the game. Minute Coot is the seed: about 2–4 stats a turn, or 0.5–1 body, against 0.4, capped at twice a turn so it stays a T1.\n- **Tier 2 (6, 6, 6):** Ring-Dike gives about 4–8 a turn (0.7–1.3 bodies, the top of 0.3–1). Sluice Keeper is a steady 1 gold, priced at a third of a unit. Raft Coot's fallback gives +6 once (about 1 body).\n- **Tier 3 (7, 7, 7, 7):** two enablers (Millwright, Objecting Coot), one buffer (Ditch-Digger, about 8 a turn, or 1.1 bodies), one combat engine (Kees, +8 Attack against a full front row, or 1.1 bodies in fight). On the guide.\n- **Tier 4 (8, 9, 9, 8):** Heemraad gives about 10 a turn at Level 4 (1.2 bodies). Winter Raft gives 8–16 (1–1.9). Kobus is the first multiplier. Aaltje's +2 Level in a fight is about 20 enemy Health late (about 2 bodies in fight). Broken on purpose: the shape has two buffers, one enabler and one multiplier, with no economy, because Sluice Keeper already holds the economy and the vote engine needed the multiplier here.\n- **Tier 5 (12, 12, 12):** Old Bram gives about 24 a turn (2 bodies). Tail-Slapper's two extra Floods are about 50–80 in fight against a target of 48, slightly high. Drowned-Spire is the direction card at about 32 a turn (2.7 bodies), above 2 but under the top ~5, on purpose, because it alone makes High Water a build.\n- **Tier 6 (14, 14, 14):** Nine Mills gives about 28–42 a turn alone (2–3 bodies), and 70+ with Hendrika. Hendrika makes no stats herself. She multiplies changes (×2–3) and is the capstone the Minutes build is built to reach. The Pup's back-row Flood plus your own front row kept dry is roughly 60–90 in a fight (about 6 bodies). The golden ceiling (Hendrika + golden Kobus) is a deliberate high roll and is flagged above.\n\n## 6. Design rationale\n\n1. The core is a single shared number that both helps and hurts, because the seed is \"one water level for everyone, which suits some and drowns others\".\n2. The Flood is a share of Health, not flat damage, so it scales with Bramble's multiplying stats, and it reuses the \"tenth per +1\" pattern from spells.\n3. It hits the front rows of both boards, because the board's two rows already read as waterside and dike, and drowning your own units has to be a real cost.\n4. There are two kinds of protection: Afloat on the unit, and Dike for its neighbours. That gives a slot puzzle and a reason to mix coots and beavers.\n5. Draining pays gold and stats, so the vote is a real choice each turn, not \"always Raise\".\n6. Paying on \"change\" in either direction rewards swinging the Level, and swinging is the Johnny engine (Millwright, Hendrika).\n7. The effect categories and their counts are Raise 3, Drain-pay 3, swing 2, change-pay 3, Flood-pay 4, protection/cross-tribe 2, multipliers 2. They are spread so that each build has a seed early and a capstone late.\n8. Kobus multiplies only the responses, and no card votes because of a vote, so the engine stays bounded per turn.\n9. Aaltje's in-fight Raise lets the drain build still Flood. That is a deliberate bridge between two builds that otherwise pull apart.\n10. The Tail-Slapper's re-Flood on friendly deaths makes drowning your own units, and dying Oozes, a resource.\n11. Raft Coot gives Afloat to any unit, and Objecting Coot pays on any sell. These are the main hooks into other tribes.\n12. Names and lore came last: coots are always Afloat and beavers carry Dikes, and the named figures sit where their character fits the job. Kobus minutes everything twice, and Hendrika never loses a vote she calls.\n","versions":[]},{"id":"gale-court--bottom-up-flavour","key":"gale-court-2223","seed":"gale-court","route":"bottom-up-flavour","tribe_name":"The Gale Court (v1)","status":"written","final_version":null,"stop_reason":null,"md":"# The Gale Court (v1)\n\n## 1. Identity\n\n**The court decides when things happen in a fight.** Its units strike before their turn, arrive halfway through, knock enemies out of their turn, or hold everything back and let it go at once. Two new keywords:\n\n- **Gust:** this unit attacks right now, out of turn. It's a normal attack in every way (random front-row enemy, takes damage back), and the unit still makes its usual attack in the cycle.\n- **Late:** if this is in your hand when the fight starts, it waits, then arrives after your side's third attack (Gusts count), in your first empty slot in reading order, or as soon as a slot opens. It didn't start the fight, so it doesn't count for who attacks first or for hero damage. After the fight it's back in your hand. Played to the board, it's an ordinary unit.\n\nCard text also uses **knocked flat:** the unit skips its next attack.\n\n**How it plays.** Early, Gust Pages and Sir Vane win fights by hitting before the enemy can. Then the hand becomes a second board. A Late unit is an eighth (or ninth) unit that the enemy's Start of Combat can't touch, and it lands mid-fight onto whatever the enemy has left. Most of the court's growth comes from counting how often it Gusted, so every Gust source also feeds growth somewhere else. The puzzle is ordering: who you played last (Vane), who stands next to the empty slot (The Helm), how many attacks happen before the Duke arrives, and when Lady High Pressure should die. Many cards do a second job: Mr Fair's exit dodges a death, Black Cloud's speed-up shrinks the Duke's count, and the Wild Hunt makes the dead count as arrivals.\n\n## 2. The 19 units\n\n| Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|\n| **Gust Page** | 1 | 2/2 | Start of Combat: Gust. If another Gust Page Gusted before this, it first gains +2 Attack (it sulks). | 4/4. Gusts twice; +4 Attack. |\n| **Windhover** | 1 | 1/3 | Faces into the wind: whenever another friendly unit Gusts, this permanently gains +1/+1. Once a fight. | 2/6. +2/+2. |\n| **Sir Vane, the Weathercock** | 2 | 2/4 | Points at the last other unit you played. Start of Combat: that unit Gusts. Whenever a friendly unit arrives Late, he turns to point at it, and it Gusts. | 4/8. Each Gusts twice. |\n| **The Swift Couriers** | 2 | 3/2 | Late. Never lands: can't be placed on the board (sell it from your hand). When it arrives, your unit nearest it Gusts. | 6/4. That unit Gusts twice. |\n| **Keeper of the Glass** | 2 | 1/4 | Start of Turn: read the glass. If your units Gusted 3+ times last fight (Change), gain 1 gold; 6+ times (Stormy), gain 2 instead. | 2/8. 2 gold; 4 gold. |\n| **The Helm** | 3 | 2/6 | Won't budge: can't be moved once played. Mentions his name to everyone: when you play a unit next to him, it permanently gains +1/+1 for each turn he has stood there (up to +4/+4). A unit that arrives Late next to him gains the same for the fight. | 4/12. +2/+2 a turn, up to +8/+8. |\n| **Old Föhn** | 3 | 3/4 | Warm: whenever another friendly unit Gusts, it permanently gains +1/+1. Three times a fight. Blamed for everything: whenever a friendly unit dies, Föhn gains +2 Attack. | 6/8. +2/+2; +4 Attack. |\n| **Beacon-Keeper of the Ridgeway** | 3 | 3/4 | Start of Combat: light the beacons. The next two units after this along the touching chain Gust, in order. A gap puts the beacons out. | 6/8. The next four. |\n| **Mr Fair** | 3 | 3/4 | When played, add Mrs Foul to your hand. End of Turn: the units beside him permanently gain +1/+1. Never home together: when Mrs Foul arrives, she takes his slot and he goes indoors (leaves the fight; not a death). | 6/8. +2/+2; adds a golden Mrs Foul. |\n| **Countess Bora** | 4 | 5/4 | Her attacks knock their target flat. Late. When she arrives, she Gusts. | 10/8. Target skips its next two attacks; Gusts twice. |\n| **Lord Mistral, Warden of the Rhône** | 4 | 4/5 | Clears the room: your first three Gusts each fight also hit the enemies beside their target. | 8/10. First six. |\n| **Dew-Pond Heron** | 4 | 3/6 | Start of Turn: your biggest unit on the board permanently gains +1/+1 for each Gust and Late arrival your side made last fight (up to +8/+8). | 6/12. +2/+2 each, up to +16/+16. |\n| **Black Cloud, Usher of the Court** | 4 | 4/5 | Your Late units arrive after your second attack instead of your third. Announces every arrival: whenever a friendly unit arrives Late, it permanently gains +2/+2. | 8/10. +4/+4. |\n| **Duke Cumulonimbus, the Thunderhead** | 5 | 5/7 | Late. Arrives late and loud: when he arrives, he counts the gap, gaining +2/+2 for each attack made so far this fight by either side (Gusts count). Then he Gusts. | 10/14. +4/+4; Gusts twice. |\n| **Steward of the Bag of Winds** | 5 | 4/8 | Your units' Gusts happen twice. | 8/16. Three times. |\n| **The Sí Gaoithe** | 5 | 6/6 | A whirlwind on a still day. Start of Combat: lift the biggest enemy out of the fight. It drops back into its slot (or the nearest empty one) after your third attack. | 12/12. Lift the two biggest. |\n| **Her Serene Stillness, Lady High Pressure** | 6 | 3/12 | Forbids anything to happen: while she lives, your Gusts and Late arrivals are held. The Storm breaks when she dies or after your sixth attack: every held Gust happens twice, in the order held, then every held Late unit arrives. | 6/24. Three times. |\n| **Master of the Wild Hunt** | 6 | 7/7 | Late. Rides the winter storm: when he arrives, every friendly unit that has died this fight rides in with him, back in its slot (or the nearest empty one) with 1 Health. They count as arriving Late, and each Gusts. | 14/14. 2 Health; each Gusts twice. |\n| **The Tower of the Winds** | 6 | 6/8 | Eight faces. Start of Turn: each different unit of yours that Gusted last fight takes a face (up to 8). The units on your board permanently gain +1/+1 for each face taken. | 12/16. +2/+2. |\n\n\"Nearest\" ties go to the first slot in reading order. A Late unit that Gusts counts as yours for the Tower, the Glass and the Heron.\n\n**Token.** **Mrs Foul** (3/4, Created): Late. Can't be placed on the board. When she arrives, your other units gain +1 Attack. Golden 6/8, +2 Attack.\n\nNo tribe spells.\n\n## 3. Builds\n\n**Squall (Start of Combat Gusts).** Gust Pages, Sir Vane, Beacon-Keeper, then Mistral and the Steward. You clear most of the front row before the enemy swings. Growth comes from counting Gusts: Windhover and Föhn early, the Heron at Tier 4, the Tower at Tier 6. The Tower rewards *different* Gusters, so you spread Gusts across the board instead of doubling one unit. Example turn: Beacon-Keeper on F1 lights B1 and F2; Vane points at the Bora you just played (as a board unit), so her Gust knocks a big front-liner flat before it attacks.\n\n**Late Entrance (the hand as a second board).** Couriers, Mrs Foul, Bora, the Duke, the Wild Hunt, with Black Cloud and The Helm. You fight with up to seven on the board and two or three more in the wings. Leave a slot open next to The Helm in reading order so each arrival lands there and takes his buff. Vane makes every arrival Gust. Black Cloud's permanent +2/+2 grows the Late units in your hand each fight. The tension: Black Cloud brings arrivals in sooner, which shrinks the Duke's count. Johnny chooses which one wins.\n\n**Calm Before the Storm.** Lady High Pressure, the Steward, the Duke and a Hunker or Shield neutral. Every Start of Combat Gust and every arrival is held while the enemy spends its own Start of Combat effects into her 12 Health. When she falls, the held Gusts happen twice each (four times with the Steward), then the Late units land at once, and the Duke counts a long gap. Put her in the front row for a fast storm, or in the back row to make it break on the sixth attack instead.\n\n**Wild Hunt finish.** Let cheap units die early (Gust Pages trading into the front row), then the Master brings them all back as arrivals. Each one Gusts, takes Black Cloud's permanent +2/+2, and triggers Vane and The Helm again.\n\n**Mixing in a lobby.**\n- **Hunters:** Pack joins attacks by units beside it. A Gust is an attack, so a Pack unit beside a Gust Page joins its Start of Combat swing. Knocking a Quarry flat keeps your Hunter's target in place.\n- **Fairies:** Late units land in your first empty slot. Put a Ring on that slot and every arrival gets the Ring size.\n- **Bog folk:** Mire forces the enemy across to attack your Mire unit. That protects Lady High Pressure in the back, or forces hits onto Mr Fair just before he goes indoors.\n- **Oozes:** an Ooze's Belly is the board-side twin of Late. Föhn's \"blamed\" Attack fires on every Ooze death.\n- **Birds:** the Couriers are swifts. Selling Birds to Fly South leaves Nests, which are empty slots Late units can land in once the Egg dies.\n- **Neutrals:** Swoop on a Gusting unit lets Start of Combat hits reach the back row. Shield keeps Gust Pages alive through the counter-damage.\n\n## 4. Risks and holes\n\n- **Fights get hard to read.** Out-of-turn attacks, held Gusts and mid-fight arrivals pile up. This tribe needs the clearest combat animation: a visible queue, arrivals entering from the hand, a counter for the Duke.\n- **Gusts take damage back.** Early Gusts into big blockers or Bristle kill your own small units. That's intended friction, but the T1–2 experience may feel like suicide against Bog folk.\n- **The hand is crowded.** Late units compete with triples in progress, Acorn items and the 4-card limit. Hand-locked Couriers and Mrs Foul need selling from hand, which Bramble hasn't settled.\n- **Recorded boards must include the hand.** Asynchronous play has to store the hand and the Late rules.\n- **Late builds attack second.** Arrivals don't count for who goes first. Fine, but test whether Late is too weak against fast Start of Combat tribes.\n- **In-fight multipliers stack.** High Pressure ×2 with the Steward ×2 is ×4, and two goldens make it ×9. Every permanent gain is capped (once a fight, three times, up to 8 faces), so this is fight-only, but one-sided wipes could feel unfair to the loser.\n- **Thin economy.** The Glass is the only gold card. The tribe may lean on neutral gold support.\n- **Lady High Pressure can stall.** If she survives and your side never reaches six attacks (a wide enemy kills you first), the storm never breaks. Watch for feel-bad losses.\n- **The Duke's count includes enemy attacks,** so he's strongest against wide boards. That could be swingy.\n- **The Wild Hunt plus Black Cloud** permanently buffs every revived unit. Bounded by deaths, but check it in practice.\n\n## 5. Tier check\n\n- **Tier 1:** Page 2/2 at body 4, about 0.7 body in fight with a partner (target ~0.6). Windhover gives +2 stats a turn, about 0.5 body (target 0.4). On guide.\n- **Tier 2:** Vane makes one Gust plus arrival Gusts, about 1 body in fight (target ~1). Glass pays about 1 gold. The Couriers are about 1.5 bodies in fight (an extra body plus a Gust), **over on purpose**: they cost a hand slot and arrive late.\n- **Tier 3:** Föhn up to 6 permanent stats a turn (0.86 body, target 0.8). The Helm about +8 once per play (target 1–1.4 bodies). Beacon makes two Gusts, about 1.3 bodies in fight. Mr Fair gives 4 permanent plus about 5 in fight across two cards. All within range.\n- **Tier 4:** Bora is about 2 bodies in fight (two enemy attacks skipped plus a Gust). The Heron averages about 10 stats a turn (1.2 bodies, target 1.3). Black Cloud is about 1 body permanent plus faster arrivals. Mistral is about 3 bodies in fight, **over on purpose** as the tribe's first multiplier, and capped at three Gusts.\n- **Tier 5:** The Duke typically gains +16 to +24 stats plus a Gust, about 4 bodies (target ~4). The Steward is about 3.3 bodies. The Sí Gaoithe's denial is hard to price, roughly 3–4 bodies of tempo. On guide.\n- **Tier 6:** The Tower with five faces gives about 70 permanent stats (5 bodies, target ~4, top ~10), slightly high as the Squall payoff. The Wild Hunt is about 5–6 bodies in fight. High Pressure is about 4 bodies alone, more with the Duke and the Steward, as the capstone multiplier.\n\n## 6. Design rationale\n\n1. **Gust Pages first** (\"all want to go first\"): a unit that attacks out of turn, so Gust came from them.\n2. **Sir Vane** changes sides with every arrival, so he points at the last unit played. Play order becomes a decision.\n3. **Duke Cumulonimbus** arrives late and counts lightning to thunder. A unit entering mid-fight that grows with the count became Late, played from the hand.\n4. **Swifts never land:** a hand-only Late unit gave Late a cheap entry at Tier 2.\n5. **The weather house, never home together:** a board-and-hand pair that swap mid-fight, so Late is more than an extra body.\n6. **Seen together,** the cards all bent *when* things happen: first, last, skipped or held. That precedence became the identity, with Gust and Late as its two halves.\n7. **Lady High Pressure forbids anything to happen:** holding both Gusts and arrivals, then releasing them doubled, ties the two keywords into one capstone.\n8. **Bora and Mistral** took their real winds' effects (knocking people flat, clearing the room) so the Gust build has texture beyond more damage.\n9. **Growth counts Gusts** (Windhover, Föhn, the Glass, the Heron, the Tower), each with a cap, so permanent growth stays priced while fight multipliers can run wild.\n10. **The Wild Hunt** rides the storm and brings the dead back as arrivals, so every arrival trigger fires again. That's the Late capstone.\n11. **The Sí Gaoithe** turns the court's timing on the enemy: the one card that delays their side.\n12. **Economy stays one card,** because the hand-as-reserve already makes the tribe pay in hand space.\n","versions":[]},{"id":"gale-court--player-story","key":"gale-court-1feb","seed":"gale-court","route":"player-story","tribe_name":"The Gale Court","status":"settled","final_version":2,"stop_reason":"3 of 3 reviewers said it's in a good spot","md":"# The Gale Court (v1)\n\n## 1. Identity\n\n**Three moments this tribe is built to produce:**\n- **Shop: \"the weathercock turned.\"** \"I played Countess Bora last, right before the fight, so Sir Vane on the spire turned to face her and fought as a second Bora. Next turn I played my golden Hunter last instead, and he turned into a Hunter.\"\n- **Fight: \"count the gap.\"** \"Their front row was all Bristle. My Pages and the Forecast Crier sent six small gusts in before anyone moved. Every one was a lightning flash for the Thunderhead, and when his turn finally came he struck ten more times.\"\n- **Board: \"the court that never lands.\"** \"My Swift Courier never got hit back. Every fight it gusted twice, and every gust stuck to it. By turn 12 a Tier 1 courier was the biggest thing on my board.\"\n\nAll three moments are about going out of turn: who gets announced in the shop, and who strikes before the rest in the fight. So the tribe has one fight keyword and one shop word.\n\n**Gust** (new keyword, a verb): the unit makes one attack right now, out of the usual order. It picks a target as usual (a random front-row enemy) and both units deal damage as usual. It does not use up the unit's normal attack. A dead unit can't Gust. Gusts queue up and resolve one at a time. Anything that counts \"friendly Gusts\" never counts enemy ones.\n\n**Announced** (new term): your Announced unit is the last unit you played, as long as it stays on your board. Playing any unit, of any tribe, Announces it; selling or losing it leaves nobody Announced until you play again. A banner on its slot shows which unit it is.\n\n**How it plays.** Early on, Gale units are small bodies that sneak in a free hit before the fight starts. From Tier 2 the shop turns into a seating puzzle. *Which unit do I play last?* That one gets the Court's buffs and Gusts, and it can belong to any tribe, so a Gale player often carries another tribe's best unit. *Where does everyone sit?* Reading order decides who Gusts first, whether the Crier's forecast runs down the whole line, and whether the Thunderhead gets to strike last. In the fight, a stack of Gusts feeds three kinds of payoff: Gusts counted up for one late, loud finish; Gusts that leave permanent stats behind; and Gusts that pump the Announced unit. Sir Vane copies whatever you played last, and Old Föhn makes the *enemy* Gust into your thorns.\n\n## 2. The 19 units\n\n| # | Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|---|\n| 1 | Gust Page | 1 | 2/3 | Start of Combat: if no friendly unit has Gusted yet this fight, this Gusts. | 4/6. ...this Gusts twice. |\n| 2 | Swift Courier | 1 | 1/3 | Takes no damage while it Gusts. After this Gusts: permanently gain +1/+1 (twice a fight). | 2/6. ...+2/+2 (twice a fight). |\n| 3 | Red Sky at Night | 2 | 3/3 | End of Turn: your Announced unit permanently gains +1/+2. | 6/6. ...+2/+4. |\n| 4 | Hayrick Whirlwind | 2 | 2/4 | Start of Combat: if your Announced unit is next to this, it Gusts. | 4/8. ...it Gusts twice. |\n| 5 | Mr and Mrs Fair-and-Foul | 2 | 2/4 | It arrives Foul and switches between Foul and Fair at each Start of Turn. Fair: Start of Turn: gain 1 gold. Foul: Start of Combat: this Gusts. | 4/8. Fair: gain 2 gold. Foul: this Gusts twice. |\n| 6 | Countess Bora | 3 | 3/4 | Start of Combat: this Gusts. This unit's Gusts also hit the units beside the target. | 6/8. ...this Gusts twice. |\n| 7 | The Windhover | 3 | 2/5 | After an enemy attacks: this Gusts at the enemy with the least Health, in any row (three times a fight). | 4/10. ...(six times a fight). |\n| 8 | Mares' Tails | 3 | 3/4 | After another friendly unit Gusts: that unit permanently gains +1/+1 (three times a fight). | 6/8. ...+2/+2 (three times a fight). |\n| 9 | The Barometer Clerk | 3 | 3/4 | Start of Turn: if your units Gusted 4 or more times last fight, gain 1 gold. Otherwise, this permanently gains +1/+1. | 6/8. ...gain 2 gold. Otherwise +2/+2. |\n| 10 | The Helm | 4 | 4/5 | The Helm is always Announced, as well as the last unit you played. Start of Combat: each Announced unit Gusts. | 8/10. ...each Announced unit Gusts twice. |\n| 11 | Lord Mistral, Warden of the Rhône | 4 | 5/4 | After a friendly unit's Gust kills its target: that unit Gusts again (once per unit a fight). | 10/8. ...(twice per unit a fight). |\n| 12 | Old Föhn | 4 | 3/7 | Bristle 3. Start of Combat: the 3 enemies with the most Attack each Gust at this. | 6/14. Bristle 6. |\n| 13 | The Bag-Bearer | 4 | 4/4 | When played: get a Bag of Winds. | 8/8. ...get two Bags of Winds. |\n| 14 | Sir Vane, the Weathercock | 5 | 5/6 | Faces the last other unit you played (not a Sir Vane) while it stays on your board: has its tribe and its text, but not its stats. | 10/12. Faces the last two other units you played: has both tribes and both texts. |\n| 15 | The Forecast Crier | 5 | 4/8 | Start of Combat: each unit after this in reading order Gusts, one at a time, stopping at the first unit that isn't Gale Court. | 8/16. ...each of them Gusts twice. |\n| 16 | Master of the Wild Hunt | 5 | 6/6 | Your units take no damage while they Gust. After a friendly unit's Gust kills its target: that unit permanently gains +2/+2. | 12/12. ...+4/+4. |\n| 17 | Duke Cumulonimbus, the Thunderhead | 6 | 7/7 | Attacks after your other units each cycle. After another friendly unit Gusts: gain a Thunder (up to 10). The first time this attacks or Gusts each fight, it then Gusts once per Thunder. | 14/14. ...Gusts twice per Thunder. |\n| 18 | Her Serene Stillness, Lady High Pressure | 6 | 5/10 | Enemy Start of Combat effects don't happen. The enemy's first 3 attacks each fight don't happen; after each one, your Announced unit Gusts instead. | 10/20. ...first 6 attacks... |\n| 19 | Warden of the Tower of the Winds | 6 | 6/8 | After a friendly unit Gusts: your Announced units permanently gain +2/+2 (ten times a fight). | 12/16. ...+4/+4 (ten times a fight). |\n\n**Item (Created by the Bag-Bearer):**\n- **Bag of Winds:** give a unit, permanently, +2/+2 and \"Start of Combat: this Gusts.\" A unit can hold only one Bag.\n\n**Rulings that matter:**\n- Sir Vane copies text that triggers or applies from now on. A copied \"When played\" doesn't run again. If he copies the Helm, he becomes Announced too, but he still faces the last unit you played, so nothing loops. If he copies a tribe, he loses Gale Court, which can cut the Crier's forecast short.\n- Old Föhn's forced Gusts are enemy attacks: they set off your Windhover, Bristle, Bog folk Bitter and Soak, and Hunker. If Föhn dies first, the remaining forced Gusts don't happen.\n- When both players field Lady High Pressure, neither side's Start of Combat effects happen.\n\n## 3. Builds\n\n**Storm front (count the Gusts).** Gust Pages, Countess Bora, the Forecast Crier in F1 with Gale units in reading order behind it, Lord Mistral to chain kills, and the Thunderhead in B3. The puzzle is the Duke's \"first time this attacks *or Gusts*\". If the Crier's forecast reaches him early, he fires with almost no Thunder. So you put a non-Gale unit just in front of him to stop the forecast, or leave him out of the line, or park him behind a Gale unit that won't Gust. The Barometer Clerk pays for the rolls. Strong against wide boards, weak against Bog folk Mire and Bitter.\n\n**The Announced court (play order).** Red Sky at Night, Hayrick Whirlwind, the Helm, Sir Vane and the Warden, with any tribe's best unit as the carry. Every turn asks two things: what to play last, and whether to play anything at all. Playing even a triple-up changes who's Announced, so holding a big Announced unit sometimes means passing on a buy. The Helm eases this by being Announced too, and the Warden turns every friendly Gust into stats for both Announced units. Lady High Pressure caps the build: she steals the enemy's opening and hands it to the Announced unit.\n\n**Never land (Couriers).** Triple the Swift Courier early for a golden, then add Mares' Tails, a Bag of Winds on the Courier, and Master of the Wild Hunt so every gusting unit hits for free. Gust sources sit in front of the Couriers in reading order. It's the slowest build to come online and grows the most.\n\n**Ill wind (punish their attacks).** Old Föhn, the Windhover, Bristle neutrals and, if the lobby has them, Bog folk. Föhn makes their three biggest units hit his thorns before anything else happens, and each of those hits lets the Windhover snipe their weakest unit. A defensive build for lobbies full of big attackers.\n\n**Mixing with other tribes.**\n- **Hunters:** a Hunter with a Bag of Winds Gusts at its Quarry and gets its Take sooner. A gusting Gale unit beside a Pack Hunter pulls the Hunter into the attack, but uses up the Hunter's own attack.\n- **Birds:** a Swoop unit's Gusts reach the back row. A Bird coming home from Fly South with doubled stats makes a ready-made Announced unit.\n- **Fairies:** a Ring-buffed unit makes a good Announced or Bag carrier. A Shy unit can't take the Court's untargeted buffs.\n- **Oozes:** the Windhover snipes an enemy Ooze early, so its Belly comes out at a time you choose. A friendly Ooze can Eat a big Courier.\n- **Hedgerow folk:** Pass X goes to your rightmost other unit, so seat a Courier there.\n- **Bog folk:** the natural counter (Mire soaks Gusts, Bitter shrinks gusters); on your side, they fit Ill wind.\n\n## 4. Risks and holes\n\n- **Readability of a Gust storm.** A late board can fire 15 or more out-of-turn attacks. That needs a clear Gust animation, a Thunder counter on the Duke and a Gust counter for the Barometer. If fights get too long to follow, cap Gusts per fight (say 12 per side).\n- **Gusting hurts the Gale player.** Gusts trade damage both ways, so small Gale units can kill themselves on Bristle and Bitter. Only the Courier and the Wild Hunt protect them. That's intended as a counter, but early Gale boards may feel brittle.\n- **Lady High Pressure may feel bad to face.** Shutting down all enemy Start of Combat effects hard-counters some builds. If it plays too hard, keep the stolen attacks and limit the shutdown to the enemy across from her.\n- **Sir Vane is the most dangerous card.** He doubles a capstone from Tier 5: two Thunderheads, two Wardens, two High Pressures (the doubled shutdown is harmless; the attacks it steals add up). Watch golden Vane copying two capstones. The fallback is \"can't copy Tier 6 units\".\n- **Mixed feedback loops.** The Warden's stats on the Announced unit help it kill, and kills feed Mistral's re-Gusts, which feed the Warden. The per-fight caps (Warden ten, Mistral once per unit) keep each loop bounded, so it isn't self-feeding without limit, but it should get the two-pass runaway check.\n- **The Announced-unit tension may frustrate players** who lose their Announced unit to a needed buy. The Helm is the release valve; if that isn't enough, add a spell that Announces a chosen unit.\n- **Holes:** no Shield, Damage Reduction or Hunker of its own, so it leans on neutrals; the Weather House's gold every other turn may be too slow to matter.\n\n## 5. Tier check\n\n- **Tier 1:** Gust Page is the tempo body: one free 2-damage hit is about 0.5–0.6 body in fight, on target. Swift Courier is the seed. At up to +2/+2 a fight it grows about 1 body a turn in a good setup, roughly 2.5× the 0.4 target. That's on purpose: it's the growth moment's carry, it needs two outside Gust sources, and it does nothing alone.\n- **Tier 2:** Red Sky at Night (buffer, +3 stats a turn, about 0.5 body) and Hayrick Whirlwind (enabler, one Gust by the Announced unit, about 1 body) are on target. Fair-and-Foul (economy) is light at about 0.5 gold a turn, and gives a Gust on alternate turns.\n- **Tier 3:** Bora and the Windhover (enablers) give about 1–1.3 bodies in fight. Mares' Tails (buffer) gives up to 6 stats a turn, about 0.85 body. The Barometer Clerk (economy) gives 1 gold or +2 stats a turn. All on target.\n- **Tier 4:** the Helm (two Gusts plus a second Announced, so a multiplier), Mistral (engine, about 2 bodies in fight), Föhn (tempo: about 18 damage forced into enemies, about 2 bodies) and the Bag-Bearer (enabler, a lasting Gust plus +2/+2). I broke the shape: no pure buffer here, because the Court's permanent buffs sit at Tiers 2, 3 and 6 and Tier 4 is where Gusts start to multiply.\n- **Tier 5:** the Crier (combat engine, up to 6 Gusts, about 4 bodies in fight), the Wild Hunt (direction, free Gusts plus about 1.5 bodies a turn from kills) and Sir Vane (multiplier, worth whatever he copies). Vane copying a Tier 6 card is the one well-outside case. He's kept because he carries the shop moment, and the fallback is noted under Risks.\n- **Tier 6:** the Thunderhead (capstone, up to 10 extra attacks, about 5 bodies in fight on top of the Gusts it feeds), Lady High Pressure (capstone, enemy Start of Combat shut off plus 3 stolen attacks, about 6 bodies) and the Warden (payoff, up to 40 stats a turn per Announced unit, 3–6 bodies, top about 10 with the Helm). On target. Goldens double, and golden Vane on two capstones is the high roll.\n\n## 6. Design rationale\n\n1. I wrote the three moments first. All of them are about going out of turn, so the mechanic is \"act out of order\".\n2. **Gust is a normal attack out of turn,** not a free ping. It works with every shared keyword (Cleave, Swoop, Bristle, Mire, Bitter, Pack), which is the overlap Johnny wants.\n3. **Announced (the last unit you played)** brings the court's precedence into the shop, works on any tribe, and makes play order a decision every turn.\n4. The Gust Page's \"if no one has Gusted yet\" turns the pages' quarrel into a seating choice instead of a stacking bonus.\n5. The Courier's \"takes no damage while it Gusts\" lets a Tier 1 card carry the growth moment without dying to its own attacks.\n6. Payoffs come in three kinds (count the Gusts, stats from Gusts, stats to the Announced unit) so the same Gust sources serve different builds.\n7. The Thunderhead's \"first time it attacks *or Gusts*\" makes the forecast a hazard for him, a puzzle inside the tribe's own engine.\n8. The Crier stops at the first non-Gale unit, so using other tribes has a cost, and Sir Vane changing tribe can break the line.\n9. Old Föhn makes the *enemy* Gust. It's the \"use it for something it wasn't meant for\" card, and it ties into Bog folk and Bristle.\n10. The Bag of Winds hands Gust to any unit, so cross-tribe boards can join the storm.\n11. Every Gust trigger has a per-fight cap (twice, three times, once per unit, up to 10), so loops stay bounded.\n12. Names and lore came last: the European winds, the weathercock, the weather house, the Shipping-Forecast crier and the windhover went to the cards whose jobs fit them.\n","versions":[{"v":1,"summary":"A court of wind folk whose units Gust: they make extra attacks out of turn, before and during the fight.\nThe last unit you played is Announced and gets the Court's buffs, so play order and seating become the puzzle each turn.","data":{"design_id":"gale-court--player-story","v":1,"identity":{"tribe_name":"The Gale Court","mechanic":"All three moments are about going out of turn: who gets announced in the shop, and who strikes before the rest in the fight. So the tribe has one fight keyword and one shop word.","keywords":[{"name":"Gust","text":"the unit makes one attack right now, out of the usual order. It picks a target as usual (a random front-row enemy) and both units deal damage as usual. It does not use up the unit's normal attack. A dead unit can't Gust. Gusts queue up and resolve one at a time. Anything that counts \"friendly Gusts\" never counts enemy ones."},{"name":"Announced","text":"your Announced unit is the last unit you played, as long as it stays on your board. Playing any unit, of any tribe, Announces it; selling or losing it leaves nobody Announced until you play again. A banner on its slot shows which unit it is."}],"plays":"Early on, Gale units are small bodies that sneak in a free hit before the fight starts. From Tier 2 the shop turns into a seating puzzle. *Which unit do I play last?* That one gets the Court's buffs and Gusts, and it can belong to any tribe, so a Gale player often carries another tribe's best unit. *Where does everyone sit?* Reading order decides who Gusts first, whether the Crier's forecast runs down the whole line, and whether the Thunderhead gets to strike last. In the fight, a stack of Gusts feeds three kinds of payoff: Gusts counted up for one late, loud finish; Gusts that leave permanent stats behind; and Gusts that pump the Announced unit. Sir Vane copies whatever you played last, and Old Föhn makes the *enemy* Gust into your thorns."},"units":[{"uid":"u01","name":"Gust Page","tier":1,"attack":2,"health":3,"text":"Start of Combat: if no friendly unit has Gusted yet this fight, this Gusts.","golden":"4/6. ...this Gusts twice."},{"uid":"u02","name":"Swift Courier","tier":1,"attack":1,"health":3,"text":"Takes no damage while it Gusts. After this Gusts: permanently gain +1/+1 (twice a fight).","golden":"2/6. ...+2/+2 (twice a fight)."},{"uid":"u03","name":"Red Sky at Night","tier":2,"attack":3,"health":3,"text":"End of Turn: your Announced unit permanently gains +1/+2.","golden":"6/6. ...+2/+4."},{"uid":"u04","name":"Hayrick Whirlwind","tier":2,"attack":2,"health":4,"text":"Start of Combat: if your Announced unit is next to this, it Gusts.","golden":"4/8. ...it Gusts twice."},{"uid":"u05","name":"Mr and Mrs Fair-and-Foul","tier":2,"attack":2,"health":4,"text":"It arrives Foul and switches between Foul and Fair at each Start of Turn. Fair: Start of Turn: gain 1 gold. Foul: Start of Combat: this Gusts.","golden":"4/8. Fair: gain 2 gold. Foul: this Gusts twice."},{"uid":"u06","name":"Countess Bora","tier":3,"attack":3,"health":4,"tex kills) and Sir Vane (multiplier, worth whatever he copies). Vane copying a Tier 6 card is the one well-outside case. He's kept because he carries the shop moment, and the fallback is noted under Risks."},{"tier":6,"note":"the Thunderhead (capstone, up to 10 extra attacks, about 5 bodies in fight on top of the Gusts it feeds), Lady High Pressure (capstone, enemy Start of Combat shut off plus 3 stolen attacks, about 6 bodies) and the Warden (payoff, up to 40 stats a turn per Announced unit, 3–6 bodies, top about 10 with the Helm). On target. Goldens double, and golden Vane on two capstones is the high roll."}],"rationale":["I wrote the three moments first. All of them are about going out of turn, so the mechanic is \"act out of order\".","**Gust is a normal attack out of turn,** not a free ping. It works with every shared keyword (Cleave, Swoop, Bristle, Mire, Bitter, Pack), which is the overlap Johnny wants.","**Announced (the last unit you played)** brings the court's precedence into the shop, works on any tribe, and makes play order a decision every turn.","The Gust Page's \"if no one has Gusted yet\" turns the pages' quarrel into a seating choice instead of a stacking bonus.","The Courier's \"takes no damage while it Gusts\" lets a Tier 1 card carry the growth moment without dying to its own attacks.","Payoffs come in three kinds (count the Gusts, stats from Gusts, stats to the Announced unit) so the same Gust sources serve different builds.","The Thunderhead's \"first time it attacks *or Gusts*\" makes the forecast a hazard for him, a puzzle inside the tribe's own engine.","The Crier stops at the first non-Gale unit, so using other tribes has a cost, and Sir Vane changing tribe can break the line.","Old Föhn makes the *enemy* Gust. It's the \"use it for something it wasn't meant for\" card, and it ties into Bog folk and Bristle.","The Bag of Winds hands Gust to any unit, so cross-tribe boards can join the storm.","Every Gust trigger has a per-fight cap (twice, three times, once per unit, up to 10), so loops stay bounded.","Names and lore came last: the European winds, the weathercock, the weather house, the Shipping-Forecast crier and the windhover went to the cards whose jobs fit them."],"changes":[],"declined":[]},"reviews":[{"id":"v1--combo","design_id":"gale-court--player-story","v":1,"member":"combo","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"Gust is a real attack, so it overlaps with Cleave, Swoop, Pack, Bristle and Bitter for free, and the Thunderhead-versus-Crier seating and Föhn feeding the Windhover are the kind of tangles I draft for.","distinct":"Announced makes play order a shop decision and lets any tribe's unit be the carry, which is fresh; the extra-attack core itself is closer to familiar 'attacks immediately' effects."},"verdict":"iterate","verdict_why":"One real rules gap (does Lady High Pressure cancel enemy Gusts, including the ones Old Föhn forces?) needs a ruling; the rest can stay hot.","points":[{"pid":"p1","uid":"u18","kind":"fix","text":"It's unclear whether enemy Gusts count as the 'first 3 attacks' Lady High Pressure cancels. The Föhn ruling calls his forced Gusts enemy attacks, so with both on board she would cancel Föhn's whole effect. Say which it is."},{"pid":"p2","uid":"u12","kind":"idea","text":"Old Föhn plus Lady High Pressure could be a deliberate combo instead of a clash: let her steal Föhn's forced Gusts, so each one becomes an Announced Gust."},{"pid":"p3","uid":"u09","kind":"idea","text":"The Barometer Clerk only checks a threshold. It would be more fun if it read the forecast, e.g. paying out by how many Gusts the last fight had, so it sits in the Gust count build instead of beside it."},{"pid":"p4","uid":"u05","kind":"idea","text":"Mr and Mrs Fair-and-Foul switching each turn could interact with Announced or reading order (Fair gives gold, Foul makes the Announced unit Gust), so the flip turns into a seating choice."},{"pid":"p5","uid":"u03","kind":"idea","text":"Red Sky at Night does one plain job. A reading-order or 'played last this turn' twist would let it join the seating puzzle the rest of the Court asks for."}],"standouts":[{"uid":"u17","why":"'First time it attacks or Gusts' turns the tribe's own Crier into a hazard, so you seat a non-Gale blocker in front of him on purpose."},{"uid":"u12","why":"Old Föhn makes the enemy Gust into Bristle, Bitter and the Windhover: a card used for things it doesn't mention."},{"uid":"u14","why":"Sir Vane copying your last play, changing tribe and possibly breaking the Crier's line ties the shop moment to fight order."}],"weakest":[{"uid":"u13","why":"The Bag-Bearer is a plain delivery card; the Bag of Winds is the interesting part."},{"uid":"u09","why":"The Barometer Clerk is gold-or-stats with no decision once you pass 4 Gusts."},{"uid":"u05","why":"Mr and Mrs Fair-and-Foul flip on their own with nothing to play around."}],"flags":[{"uid":"u18","kind":"unclear","note":"Whether enemy Gusts (Föhn's forced ones, an enemy Windhover's) count among the 3 cancelled attacks isn't written."},{"uid":"u19","kind":"watch","note":"+20/+20 permanent per Announced unit a fight, doubled with the Helm and again golden; bounded per fight but grows fast."},{"uid":"u14","kind":"watch","note":"Golden Sir Vane copying two Tier 6 cards, as the designer notes."},{"uid":"u18","kind":"watch","note":"Cancelling all enemy Start of Combat effects nearly blanks an opposing Gale Court board, whose Gusts are mostly Start of Combat."}]},{"id":"v1--climber","design_id":"gale-court--player-story","v":1,"member":"climber","ratings":{"fun":7,"distinct":7},"ratings_why":{"fun":"Early free hits, a growing Announced carry from Tier 2 and a Gust storm that pays off late give a curve I'd happily draft, though Tier 4 adds little lasting growth.","distinct":"Announced turns play order into a decision every turn and lets any tribe's unit be the carry; Gust itself is close to familiar extra-attack effects."},"verdict":"iterate","verd
