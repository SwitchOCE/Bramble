,"versions":[]},{"id":"changelings--top-down-flavour","key":"changelings-80e7","seed":"changelings","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"cuckoo-clockworks--bottom-up-flavour","key":"cuckoo-clockworks-c5c6","seed":"cuckoo-clockworks","route":"bottom-up-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"cuckoo-clockworks--bottom-up-mech","key":"cuckoo-clockworks-b77f","seed":"cuckoo-clockworks","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"cuckoo-clockworks--surgical","key":"cuckoo-clockworks-8762","seed":"cuckoo-clockworks","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"dyke-board--one-constraint","key":"dyke-board-ac02","seed":"dyke-board","route":"one-constraint","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"dyke-board--surgical","key":"dyke-board-9f64","seed":"dyke-board","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"dyke-board--top-down-mech","key":"dyke-board-a674","seed":"dyke-board","route":"top-down-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"gale-court--bottom-up-flavour","key":"gale-court-2223","seed":"gale-court","route":"bottom-up-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"gale-court--player-story","key":"gale-court-1feb","seed":"gale-court","route":"player-story","tribe_name":"The Gale Court","status":"unreviewed","final_version":null,"stop_reason":null,"md":"# The Gale Court (v1)\n\n## 1. Identity\n\n**Three moments this tribe is built to produce:**\n- **Shop: \"the weathercock turned.\"** \"I played Countess Bora last, right before the fight, so Sir Vane on the spire turned to face her and fought as a second Bora. Next turn I played my golden Hunter last instead, and he turned into a Hunter.\"\n- **Fight: \"count the gap.\"** \"Their front row was all Bristle. My Pages and the Forecast Crier sent six small gusts in before anyone moved. Every one was a lightning flash for the Thunderhead, and when his turn finally came he struck ten more times.\"\n- **Board: \"the court that never lands.\"** \"My Swift Courier never got hit back. Every fight it gusted twice, and every gust stuck to it. By turn 12 a Tier 1 courier was the biggest thing on my board.\"\n\nAll three moments are about going out of turn: who gets announced in the shop, and who strikes before the rest in the fight. So the tribe has one fight keyword and one shop word.\n\n**Gust** (new keyword, a verb): the unit makes one attack right now, out of the usual order. It picks a target as usual (a random front-row enemy) and both units deal damage as usual. It does not use up the unit's normal attack. A dead unit can't Gust. Gusts queue up and resolve one at a time. Anything that counts \"friendly Gusts\" never counts enemy ones.\n\n**Announced** (new term): your Announced unit is the last unit you played, as long as it stays on your board. Playing any unit, of any tribe, Announces it; selling or losing it leaves nobody Announced until you play again. A banner on its slot shows which unit it is.\n\n**How it plays.** Early on, Gale units are small bodies that sneak in a free hit before the fight starts. From Tier 2 the shop turns into a seating puzzle. *Which unit do I play last?* That one gets the Court's buffs and Gusts, and it can belong to any tribe, so a Gale player often carries another tribe's best unit. *Where does everyone sit?* Reading order decides who Gusts first, whether the Crier's forecast runs down the whole line, and whether the Thunderhead gets to strike last. In the fight, a stack of Gusts feeds three kinds of payoff: Gusts counted up for one late, loud finish; Gusts that leave permanent stats behind; and Gusts that pump the Announced unit. Sir Vane copies whatever you played last, and Old Föhn makes the *enemy* Gust into your thorns.\n\n## 2. The 19 units\n\n| # | Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|---|\n| 1 | Gust Page | 1 | 2/3 | Start of Combat: if no friendly unit has Gusted yet this fight, this Gusts. | 4/6. ...this Gusts twice. |\n| 2 | Swift Courier | 1 | 1/3 | Takes no damage while it Gusts. After this Gusts: permanently gain +1/+1 (twice a fight). | 2/6. ...+2/+2 (twice a fight). |\n| 3 | Red Sky at Night | 2 | 3/3 | End of Turn: your Announced unit permanently gains +1/+2. | 6/6. ...+2/+4. |\n| 4 | Hayrick Whirlwind | 2 | 2/4 | Start of Combat: if your Announced unit is next to this, it Gusts. | 4/8. ...it Gusts twice. |\n| 5 | Mr and Mrs Fair-and-Foul | 2 | 2/4 | It arrives Foul and switches between Foul and Fair at each Start of Turn. Fair: Start of Turn: gain 1 gold. Foul: Start of Combat: this Gusts. | 4/8. Fair: gain 2 gold. Foul: this Gusts twice. |\n| 6 | Countess Bora | 3 | 3/4 | Start of Combat: this Gusts. This unit's Gusts also hit the units beside the target. | 6/8. ...this Gusts twice. |\n| 7 | The Windhover | 3 | 2/5 | After an enemy attacks: this Gusts at the enemy with the least Health, in any row (three times a fight). | 4/10. ...(six times a fight). |\n| 8 | Mares' Tails | 3 | 3/4 | After another friendly unit Gusts: that unit permanently gains +1/+1 (three times a fight). | 6/8. ...+2/+2 (three times a fight). |\n| 9 | The Barometer Clerk | 3 | 3/4 | Start of Turn: if your units Gusted 4 or more times last fight, gain 1 gold. Otherwise, this permanently gains +1/+1. | 6/8. ...gain 2 gold. Otherwise +2/+2. |\n| 10 | The Helm | 4 | 4/5 | The Helm is always Announced, as well as the last unit you played. Start of Combat: each Announced unit Gusts. | 8/10. ...each Announced unit Gusts twice. |\n| 11 | Lord Mistral, Warden of the Rhône | 4 | 5/4 | After a friendly unit's Gust kills its target: that unit Gusts again (once per unit a fight). | 10/8. ...(twice per unit a fight). |\n| 12 | Old Föhn | 4 | 3/7 | Bristle 3. Start of Combat: the 3 enemies with the most Attack each Gust at this. | 6/14. Bristle 6. |\n| 13 | The Bag-Bearer | 4 | 4/4 | When played: get a Bag of Winds. | 8/8. ...get two Bags of Winds. |\n| 14 | Sir Vane, the Weathercock | 5 | 5/6 | Faces the last other unit you played (not a Sir Vane) while it stays on your board: has its tribe and its text, but not its stats. | 10/12. Faces the last two other units you played: has both tribes and both texts. |\n| 15 | The Forecast Crier | 5 | 4/8 | Start of Combat: each unit after this in reading order Gusts, one at a time, stopping at the first unit that isn't Gale Court. | 8/16. ...each of them Gusts twice. |\n| 16 | Master of the Wild Hunt | 5 | 6/6 | Your units take no damage while they Gust. After a friendly unit's Gust kills its target: that unit permanently gains +2/+2. | 12/12. ...+4/+4. |\n| 17 | Duke Cumulonimbus, the Thunderhead | 6 | 7/7 | Attacks after your other units each cycle. After another friendly unit Gusts: gain a Thunder (up to 10). The first time this attacks or Gusts each fight, it then Gusts once per Thunder. | 14/14. ...Gusts twice per Thunder. |\n| 18 | Her Serene Stillness, Lady High Pressure | 6 | 5/10 | Enemy Start of Combat effects don't happen. The enemy's first 3 attacks each fight don't happen; after each one, your Announced unit Gusts instead. | 10/20. ...first 6 attacks... |\n| 19 | Warden of the Tower of the Winds | 6 | 6/8 | After a friendly unit Gusts: your Announced units permanently gain +2/+2 (ten times a fight). | 12/16. ...+4/+4 (ten times a fight). |\n\n**Item (Created by the Bag-Bearer):**\n- **Bag of Winds:** give a unit, permanently, +2/+2 and \"Start of Combat: this Gusts.\" A unit can hold only one Bag.\n\n**Rulings that matter:**\n- Sir Vane copies text that triggers or applies from now on. A copied \"When played\" doesn't run again. If he copies the Helm, he becomes Announced too, but he still faces the last unit you played, so nothing loops. If he copies a tribe, he loses Gale Court, which can cut the Crier's forecast short.\n- Old Föhn's forced Gusts are enemy attacks: they set off your Windhover, Bristle, Bog folk Bitter and Soak, and Hunker. If Föhn dies first, the remaining forced Gusts don't happen.\n- When both players field Lady High Pressure, neither side's Start of Combat effects happen.\n\n## 3. Builds\n\n**Storm front (count the Gusts).** Gust Pages, Countess Bora, the Forecast Crier in F1 with Gale units in reading order behind it, Lord Mistral to chain kills, and the Thunderhead in B3. The puzzle is the Duke's \"first time this attacks *or Gusts*\". If the Crier's forecast reaches him early, he fires with almost no Thunder. So you put a non-Gale unit just in front of him to stop the forecast, or leave him out of the line, or park him behind a Gale unit that won't Gust. The Barometer Clerk pays for the rolls. Strong against wide boards, weak against Bog folk Mire and Bitter.\n\n**The Announced court (play order).** Red Sky at Night, Hayrick Whirlwind, the Helm, Sir Vane and the Warden, with any tribe's best unit as the carry. Every turn asks two things: what to play last, and whether to play anything at all. Playing even a triple-up changes who's Announced, so holding a big Announced unit sometimes means passing on a buy. The Helm eases this by being Announced too, and the Warden turns every friendly Gust into stats for both Announced units. Lady High Pressure caps the build: she steals the enemy's opening and hands it to the Announced unit.\n\n**Never land (Couriers).** Triple the Swift Courier early for a golden, then add Mares' Tails, a Bag of Winds on the Courier, and Master of the Wild Hunt so every gusting unit hits for free. Gust sources sit in front of the Couriers in reading order. It's the slowest build to come online and grows the most.\n\n**Ill wind (punish their attacks).** Old Föhn, the Windhover, Bristle neutrals and, if the lobby has them, Bog folk. Föhn makes their three biggest units hit his thorns before anything else happens, and each of those hits lets the Windhover snipe their weakest unit. A defensive build for lobbies full of big attackers.\n\n**Mixing with other tribes.**\n- **Hunters:** a Hunter with a Bag of Winds Gusts at its Quarry and gets its Take sooner. A gusting Gale unit beside a Pack Hunter pulls the Hunter into the attack, but uses up the Hunter's own attack.\n- **Birds:** a Swoop unit's Gusts reach the back row. A Bird coming home from Fly South with doubled stats makes a ready-made Announced unit.\n- **Fairies:** a Ring-buffed unit makes a good Announced or Bag carrier. A Shy unit can't take the Court's untargeted buffs.\n- **Oozes:** the Windhover snipes an enemy Ooze early, so its Belly comes out at a time you choose. A friendly Ooze can Eat a big Courier.\n- **Hedgerow folk:** Pass X goes to your rightmost other unit, so seat a Courier there.\n- **Bog folk:** the natural counter (Mire soaks Gusts, Bitter shrinks gusters); on your side, they fit Ill wind.\n\n## 4. Risks and holes\n\n- **Readability of a Gust storm.** A late board can fire 15 or more out-of-turn attacks. That needs a clear Gust animation, a Thunder counter on the Duke and a Gust counter for the Barometer. If fights get too long to follow, cap Gusts per fight (say 12 per side).\n- **Gusting hurts the Gale player.** Gusts trade damage both ways, so small Gale units can kill themselves on Bristle and Bitter. Only the Courier and the Wild Hunt protect them. That's intended as a counter, but early Gale boards may feel brittle.\n- **Lady High Pressure may feel bad to face.** Shutting down all enemy Start of Combat effects hard-counters some builds. If it plays too hard, keep the stolen attacks and limit the shutdown to the enemy across from her.\n- **Sir Vane is the most dangerous card.** He doubles a capstone from Tier 5: two Thunderheads, two Wardens, two High Pressures (the doubled shutdown is harmless; the attacks it steals add up). Watch golden Vane copying two capstones. The fallback is \"can't copy Tier 6 units\".\n- **Mixed feedback loops.** The Warden's stats on the Announced unit help it kill, and kills feed Mistral's re-Gusts, which feed the Warden. The per-fight caps (Warden ten, Mistral once per unit) keep each loop bounded, so it isn't self-feeding without limit, but it should get the two-pass runaway check.\n- **The Announced-unit tension may frustrate players** who lose their Announced unit to a needed buy. The Helm is the release valve; if that isn't enough, add a spell that Announces a chosen unit.\n- **Holes:** no Shield, Damage Reduction or Hunker of its own, so it leans on neutrals; the Weather House's gold every other turn may be too slow to matter.\n\n## 5. Tier check\n\n- **Tier 1:** Gust Page is the tempo body: one free 2-damage hit is about 0.5–0.6 body in fight, on target. Swift Courier is the seed. At up to +2/+2 a fight it grows about 1 body a turn in a good setup, roughly 2.5× the 0.4 target. That's on purpose: it's the growth moment's carry, it needs two outside Gust sources, and it does nothing alone.\n- **Tier 2:** Red Sky at Night (buffer, +3 stats a turn, about 0.5 body) and Hayrick Whirlwind (enabler, one Gust by the Announced unit, about 1 body) are on target. Fair-and-Foul (economy) is light at about 0.5 gold a turn, and gives a Gust on alternate turns.\n- **Tier 3:** Bora and the Windhover (enablers) give about 1–1.3 bodies in fight. Mares' Tails (buffer) gives up to 6 stats a turn, about 0.85 body. The Barometer Clerk (economy) gives 1 gold or +2 stats a turn. All on target.\n- **Tier 4:** the Helm (two Gusts plus a second Announced, so a multiplier), Mistral (engine, about 2 bodies in fight), Föhn (tempo: about 18 damage forced into enemies, about 2 bodies) and the Bag-Bearer (enabler, a lasting Gust plus +2/+2). I broke the shape: no pure buffer here, because the Court's permanent buffs sit at Tiers 2, 3 and 6 and Tier 4 is where Gusts start to multiply.\n- **Tier 5:** the Crier (combat engine, up to 6 Gusts, about 4 bodies in fight), the Wild Hunt (direction, free Gusts plus about 1.5 bodies a turn from kills) and Sir Vane (multiplier, worth whatever he copies). Vane copying a Tier 6 card is the one well-outside case. He's kept because he carries the shop moment, and the fallback is noted under Risks.\n- **Tier 6:** the Thunderhead (capstone, up to 10 extra attacks, about 5 bodies in fight on top of the Gusts it feeds), Lady High Pressure (capstone, enemy Start of Combat shut off plus 3 stolen attacks, about 6 bodies) and the Warden (payoff, up to 40 stats a turn per Announced unit, 3–6 bodies, top about 10 with the Helm). On target. Goldens double, and golden Vane on two capstones is the high roll.\n\n## 6. Design rationale\n\n1. I wrote the three moments first. All of them are about going out of turn, so the mechanic is \"act out of order\".\n2. **Gust is a normal attack out of turn,** not a free ping. It works with every shared keyword (Cleave, Swoop, Bristle, Mire, Bitter, Pack), which is the overlap Johnny wants.\n3. **Announced (the last unit you played)** brings the court's precedence into the shop, works on any tribe, and makes play order a decision every turn.\n4. The Gust Page's \"if no one has Gusted yet\" turns the pages' quarrel into a seating choice instead of a stacking bonus.\n5. The Courier's \"takes no damage while it Gusts\" lets a Tier 1 card carry the growth moment without dying to its own attacks.\n6. Payoffs come in three kinds (count the Gusts, stats from Gusts, stats to the Announced unit) so the same Gust sources serve different builds.\n7. The Thunderhead's \"first time it attacks *or Gusts*\" makes the forecast a hazard for him, a puzzle inside the tribe's own engine.\n8. The Crier stops at the first non-Gale unit, so using other tribes has a cost, and Sir Vane changing tribe can break the line.\n9. Old Föhn makes the *enemy* Gust. It's the \"use it for something it wasn't meant for\" card, and it ties into Bog folk and Bristle.\n10. The Bag of Winds hands Gust to any unit, so cross-tribe boards can join the storm.\n11. Every Gust trigger has a per-fight cap (twice, three times, once per unit, up to 10), so loops stay bounded.\n12. Names and lore came last: the European winds, the weathercock, the weather house, the Shipping-Forecast crier and the windhover went to the cards whose jobs fit them.\n","versions":[{"v":1,"summary":"A court of wind folk whose units Gust: they make extra attacks out of turn, before and during the fight.\nThe last unit you played is Announced and gets the Court's buffs, so play order and seating become the puzzle each turn.","data":{"design_id":"gale-court--player-story","v":1,"identity":{"tribe_name":"The Gale Court","mechanic":"All three moments are about going out of turn: who gets announced in the shop, and who strikes before the rest in the fight. So the tribe has one fight keyword and one shop word.","keywords":[{"name":"Gust","text":"the unit makes one attack right now, out of the usual order. It picks a target as usual (a random front-row enemy) and both units deal damage as usual. It does not use up the unit's normal attack. A dead unit can't Gust. Gusts queue up and resolve one at a time. Anything that counts \"friendly Gusts\" never counts enemy ones."},{"name":"Announced","text":"your Announced unit is the last unit you played, as long as it stays on your board. Playing any unit, of any tribe, Announces it; selling or losing it leaves nobody Announced until you play again. A banner on its slot shows which unit it is."}],"plays":"Early on, Gale units are small bodies that sneak in a free hit before the fight starts. From Tier 2 the shop turns into a seating puzzle. , in any row (three times a fight).","golden":"4/10. ...(six times a fight)."},{"uid":"u08","name":"Mares' Tails","tier":3,"attack":3,"health":4,"text":"After another friendly unit Gusts: that unit permanently gains +1/+1 (three times a fight).","golden":"6/8. ...+2/+2 (three times a fight)."},{"uid":"u09","name":"The Barometer Clerk","tier":3,"attack":3,"health":4,"text":"Start of Turn: if your units Gusted 4 or more times last fight, gain 1 gold. Otherwise, this permanently gains +1/+1.","golden":"6/8. ...gain 2 gold. Otherwise +2/+2."},{"uid":"u10","name":"The Helm","tier":4,"attack":4,"health":5,"text":"The Helm is always Announced, as well as the last unit you played. Start of Combat: each Announced unit Gusts.","golden":"8/10. ...each Announced unit Gusts twice."},{"uid":"u11","name":"Lord Mistral, Warden of the Rhône","tier":4,"attack":5,"health":4,"text":"After a friendly unit's Gust kills its target: that unit Gusts again (once per unit a fight).","golden":"10/8. ...(twice per unit a fight)."},{"uid":"u12","name":"Old Föhn","tier":4,"attack":3,"health":7,"text":"Bristle 3. Start of Combat: the 3 enemies with the most Attack each Gust at this.","golden":"6/14. Bristle 6."},{"uid":"u13","name":"The Bag-Bearer","tier":4,"attack":4,"health":4,"text":"When played: get a Bag of Winds.","golden":"8/8. ...get two Bags of Winds."},{"uid":"u14","name":"Sir Vane, the Weathercock","tier":5,"attack":5,"health":6,"text":"Faces the last other unit you played (not a Sir Vane) while it stays on your board: has its tribe and its text, but not its stats.","golden":"10/12. Faces the last two other units you played: has both tribes and both texts."},{"uid":"u15","name":"The Forecast Crier","tier":5,"attack":4,"health":8,"text":"Start of Combat: each unit after this in reading order Gusts, one at a time, stopping at the first unit that isn't Gale Court.","golden":"8/16. ...each of them Gusts twice."},{"uid":"u16","name":"Master of the Wild Hunt","tier":5,"attack":6,"health":6,"text":"Your units take no damage while they Gust. After a friendly unit's Gust kills its target: that unit permanently gains +2/+2.","golden":"12/12. ...+4/+4."},{"uid":"u17","name":"Duke Cumulonimbus, the Thunderhead","tier":6,"attack":7,"health":7,"text":"Attacks after your other units each cycle. After another friendly unit Gusts: gain a Thunder (up to 10). The first time this attacks or Gusts each fight, it then Gusts once per Thunder.","golden":"14/14. ...Gusts twice per Thunder."},{"uid":"u18","name":"Her Serene Stillness, Lady High Pressure","tier":6,"attack":5,"health":10,"text":"Enemy Start of Combat effects don't happen. The enemy's first 3 attacks each fight don't happen; after each one, your Announced unit Gusts instead.","golden":"10/20. ...first 6 attacks..."},{"uid":"u19","name":"Warden of the Tower of the Winds","tier":6,"attack":6,"health":8,"text":"After a friendly unit Gusts: your Announced units permanently gain +2/+2 (ten times a fight).","golden":"12/16. ...+4/+4 (ten times a fight)."}],"extras":[{"uid":"x01","kind":"other","name":"Bag of Winds","text":"give a unit, permanently, +2/+2 and \"Start of Combat: this Gusts.\" A unit can hold only one Bag."},{"uid":"x02","kind":"other","name":"Ruling","text":"Sir Vane copies text that triggers or applies from now on. A copied \"When played\" doesn't run again. If he copies the Helm, he becomes Announced too, but he still faces the last unit you played, so nothing loops. If he copies a tribe, he loses Gale Court, which can cut the Crier's forecast short."},{"uid":"x03","kind":"other","name":"Ruling","text":"Old Föhn's forced Gusts are enemy attacks: they set off your Windhover, Bristle, Bog folk Bitter and Soak, and Hunker. If Föhn dies first, the remaining forced Gusts don't happen."},{"uid":"x04","kind":"other","name":"Ruling","text":"When both players field Lady High Pressure, neither side's Start of Combat effects happen."}],"builds":[{"name":"Storm front (count the Gusts)","text":"Gust Pages, Countess Bora, the Forecast Crier in F1 with Gale units in reading order behind it, Lord Mistral to chain kills, and the Thunderhead in B3. The puzzle is the Duke's \"first time this attacks *or Gusts*\". If the Crier's forecast reaches him early, he fires with almost no Thunder. So you put a non-Gale unit just in front of him to stop the forecast, or leave him out of the line, or park him behind a Gale unit that won't Gust. The Barometer Clerk pays for the rolls. Strong against wide boards, weak against Bog folk Mire and Bitter."},{"name":"The Announced court (play order)","text":"Red Sky at Night, Hayrick Whirlwind, the Helm, Sir Vane and the Warden, with any tribe's best unit as the carry. Every turn asks two things: what to play last, and whether to play anything at all. Playing even a triple-up changes who's Announced, so holding a big Announced unit sometimes means passing on a buy. The Helm eases this by being Announced too, and the Warden turns every friendly Gust into stats for both Announced units. Lady High Pressure caps the build: she steals the enemy's opening and hands it to the Announced unit."},{"name":"Never land (Couriers)","text":"Triple the Swift Courier early for a golden, then add Mares' Tails, a Bag of Winds on the Courier, and Master of the Wild Hunt so every gusting unit hits for free. Gust sources sit in front of the Couriers in reading order. It's the slowest build to come online and grows the most."},{"name":"Ill wind (punish their attacks)","text":"Old Föhn, the Windhover, Bristle neutrals and, if the lobby has them, Bog folk. Föhn makes their three biggest units hit his thorns before anything else happens, and each of those hits lets the Windhover snipe their weakest unit. A defensive build for lobbies full of big attackers."},{"name":"Mixing with other tribes","text":"**Hunters:** a Hunter with a Bag of Winds Gusts at its Quarry and gets its Take sooner. A gusting Gale unit beside a Pack Hunter pulls the Hunter into the attack, but uses up the Hunter's own attack. **Birds:** a Swoop unit's Gusts reach the back row. A Bird coming home from Fly South with doubled stats makes a ready-made Announced unit. **Fairies:** a Ring-buffed unit makes a good Announced or Bag carrier. A Shy unit can't take the Court's untargeted buffs. **Oozes:** the Windhover snipes an enemy Ooze early, so its Belly comes out at a time you choose. A friendly Ooze can Eat a big Courier. **Hedgerow folk:** Pass X goes to your rightmost other unit, so seat a Courier there. **Bog folk:** the natural counter (Mire soaks Gusts, Bitter shrinks gusters); on your side, they fit Ill wind."}],"risks":["**Readability of a Gust storm.** A late board can fire 15 or more out-of-turn attacks. That needs a clear Gust animation, a Thunder counter on the Duke and a Gust counter for the Barometer. If fights get too long to follow, cap Gusts per fight (say 12 per side).","**Gusting hurts the Gale player.** Gusts trade damage both ways, so small Gale units can kill themselves on Bristle and Bitter. Only the Courier and the Wild Hunt protect them. That's intended as a counter, but early Gale boards may feel brittle.","**Lady High Pressure may feel bad to face.** Shutting down all enemy Start of Combat effects hard-counters some builds. If it plays too hard, keep the stolen attacks and limit the shutdown to the enemy across from her.","**Sir Vane is the most dangerous card.** He doubles a capstone from Tier 5: two Thunderheads, two Wardens, two High Pressures (the doubled shutdown is harmless; the attacks it steals add up). Watch golden Vane copying two capstones. The fallback is \"can't copy Tier 6 units\".","**Mixed feedback loops.** The Warden's stats on the Announced unit help it kill, and kills feed Mistral's re-Gusts, which feed the Warden. The per-fight caps (Warden ten, Mistral once per unit) keep each loop bounded, so it isn't self-feeding without limit, but it should get the two-pass runaway check.","**The Announced-unit tension may frustrate players** who lose their Announced unit to a needed buy. The Helm is the release valve; if that isn't enough, add a spell that Announces a chosen unit.","**Holes:** no Shield, Damage Reduction or Hunker of its own, so it leans on neutrals; the Weather House's gold every other turn may be too slow to matter."],"tier_check":[{"tier":1,"note":"Gust Page is the tempo body: one free 2-damage hit is about 0.5–0.6 body in fight, on target. Swift Courier is the seed. At up to +2/+2 a fight it grows about 1 body a turn in a good setup, roughly 2.5× the 0.4 target. That's on purpose: it's the growth moment's carry, it needs two outside Gust sources, and it does nothing alone."},{"tier":2,"note":"Red Sky at Night (buffer, +3 stats a turn, about 0.5 body) and Hayrick Whirlwind (enabler, one Gust by the Announced unit, about 1 body) are on target. Fair-and-Foul (economy) is light at about 0.5 gold a turn, and gives a Gust on alternate turns."},{"tier":3,"note":"Bora and the Windhover (enablers) give about 1–1.3 bodies in fight. Mares' Tails (buffer) gives up to 6 stats a turn, about 0.85 body. The Barometer Clerk (economy) gives 1 gold or +2 stats a turn. All on target."},{"tier":4,"note":"the Helm (two Gusts plus a second Announced, so a multiplier), Mistral (engine, about 2 bodies in fight), Föhn (tempo: about 18 damage forced into enemies, about 2 bodies) and the Bag-Bearer (enabler, a lasting Gust plus +2/+2). I broke the shape: no pure buffer here, because the Court's permanent buffs sit at Tiers 2, 3 and 6 and Tier 4 is where Gusts start to multiply."},{"tier":5,"note":"the Crier (combat engine, up to 6 Gusts, about 4 bodies in fight), the Wild Hunt (direction, free Gusts plus about 1.5 bodies a turn from kills) and Sir Vane (multiplier, worth whatever he copies). Vane copying a Tier 6 card is the one well-outside case. He's kept because he carries the shop moment, and the fallback is noted under Risks."},{"tier":6,"note":"the Thunderhead (capstone, up to 10 extra attacks, about 5 bodies in fight on top of the Gusts it feeds), Lady High Pressure (capstone, enemy Start of Combat shut off plus 3 stolen attacks, about 6 bodies) and the Warden (payoff, up to 40 stats a turn per Announced unit, 3–6 bodies, top about 10 with the Helm). On target. Goldens double, and golden Vane on two capstones is the high roll."}],"rationale":["I wrote the three moments first. All of them are about going out of turn, so the mechanic is \"act out of order\".","**Gust is a normal attack out of turn,** not a free ping. It works with every shared keyword (Cleave, Swoop, Bristle, Mire, Bitter, Pack), which is the overlap Johnny wants.","**Announced (the last unit you played)** brings the court's precedence into the shop, works on any tribe, and makes play order a decision every turn.","The Gust Page's \"if no one has Gusted yet\" turns the pages' quarrel into a seating choice instead of a stacking bonus.","The Courier's \"takes no damage while it Gusts\" lets a Tier 1 card carry the growth moment without dying to its own attacks.","Payoffs come in three kinds (count the Gusts, stats from Gusts, stats to the Announced unit) so the same Gust sources serve different builds.","The Thunderhead's \"first time it attacks *or Gusts*\" makes the forecast a hazard for him, a puzzle inside the tribe's own engine.","The Crier stops at the first non-Gale unit, so using other tribes has a cost, and Sir Vane changing tribe can break the line.","Old Föhn makes the *enemy* Gust. It's the \"use it for something it wasn't meant for\" card, and it ties into Bog folk and Bristle.","The Bag of Winds hands Gust to any unit, so cross-tribe boards can join the storm.","Every Gust trigger has a per-fight cap (twice, three times, once per unit, up to 10), so loops stay bounded.","Names and lore came last: the European winds, the weathercock, the weather house, the Shipping-Forecast crier and the windhover went to the cards whose jobs fit them."],"changes":[],"declined":[]},"reviews":[],"ratings":{"fun":null,"distinct":null},"votes":{"settle":0,"iterate":0}}]},{"id":"gale-court--top-down-mech","key":"gale-court-86e7","seed":"gale-court","route":"top-down-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"grass-snake-players--bottom-up-flavour","key":"grass-snake-players-e910","seed":"grass-snake-players","route":"bottom-up-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"grass-snake-players--surgical","key":"grass-snake-players-2eaa","seed":"grass-snake-players","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"grass-snake-players--top-down-flavour","key":"grass-snake-players-a01c","seed":"grass-snake-players","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"great-migration--bottom-up-mech","key":"great-migration-68b1","seed":"great-migration","route":"bottom-up-mech","tribe_name":"The Great Migration","status":"unreviewed","final_version":null,"stop_reason":null,"md":"# The Great Migration (v1)\n\n## 1. Identity\n\n**Core mechanic: the Herd and its Burrow.** The tribe makes **Kits**: identical little Lemming tokens. Kits that don't fit on the board wait in the **Burrow**, an off-board reserve shown on your hero. **Onward** turns that reserve into fight HP. Every card in the tribe either grows the Herd, makes Kits bigger, or spends Kits on something else.\n\n- **Kit (token):** a Lemming whose stats are your **Kit size**. Kit size starts at 1/1, and cards raise it permanently for every Kit you have, now and later, in the Burrow too. Kits are Created, sell for 0, aren't in the pool and never make triples. Harvest Supper's Migration bonus reaches them as well.\n- **Burrow:** a Kit made with no empty slot goes into your Burrow. While recruiting, you can move Kits between the board and the Burrow for free. A Kit that goes into the Burrow loses its own buffs and keeps only Kit size. Your **Herd** is all your Kits, on the board and in the Burrow.\n- **Onward (new keyword):** *When this dies, a Kit from your Burrow takes its slot.* Each Burrow Kit can come out once a fight. Fights never cost you Kits: the Burrow is full again afterwards.\n\n**How it plays.** Early on, Kits are free bodies that let you attack first and fill gaps. By the midgame you're running a stockpile that has three jobs at once. On the board it fills slots, which earns gold and moves Kits out of reach of the cards that spend from the Burrow. In the Burrow it's the Onward chain's fuel and ammunition for Ole. Spent, it becomes permanent stats on your real units. The tribe's numbers puzzles all pull on that one pile. You grow **count** (Kit makers) or **size** (Kit size), and they multiply. Spending at a good rate leaves you short of fight fuel, and some cards trigger at Herd thresholds, so a Kit spent below the next threshold is free. The tribe owns no big bodies of its own, so its best boards borrow a few strong units from other tribes and wrap them in Kits.\n\n## 2. The 19 units\n\n*Front unit:* your first unit in reading order (F1–F4, then B1–B3). Assumption: End of Turn effects resolve in reading order, so you choose whether a counter goes before or after a spender.\n\n| Name | Tier | A/H | Text | Golden text |\n|---|---|---|---|---|\n| Yellowcoat Squeaker | 1 | 1/2 | When played: make a Kit. | When played: make 2 Kits. |\n| Snowbed Nester | 1 | 1/2 | End of Turn: make a Kit. | End of Turn: make 2 Kits. |\n| Tally, the Census Fox | 2 | 1/4 | End of Turn: if all 7 of your slots are full, gain 1 gold. | …gain 2 gold. |\n| Tunic Weaver | 2 | 2/3 | When played: Kit size +1/+1. | When played: Kit size +2/+2. |\n| Runway Digger | 2 | 2/3 | Onward. When played: give another unit Onward permanently. | …give two other units Onward permanently. |\n| The Front Lemming | 3 | 2/4 | Your front unit has Onward, up to 3 times a fight. | …up to 6 times a fight. |\n| Brood Matron | 3 | 2/5 | End of Turn: make a Kit for every 4 Kits in your Herd (at most 3). | …make 2 Kits for every 4 (at most 6). |\n| Raft-builder | 3 | 3/4 | When played: spend up to 3 Kits from your Burrow. Give a unit +2/+2 permanently for each. | …+4/+4 for each. |\n| Ole the Learned | 3 | 3/3 | Start of Combat: 3 Kits from your Burrow fall on random enemies, each dealing damage equal to its Attack, then die. They can't come out again this fight. | …6 Kits fall. |\n| Identical Cousin | 4 | 3/4 | When played: a Kit next to this becomes a plain Created copy of another unit next to this. | …two Kits next to this each become a plain copy of another unit next to this. |\n| Herding Council | 4 | 4/4 | End of Turn: if your Burrow holds 2 or more Kits, spend 2 and give your units that aren't Kits +1/+1 permanently. | …+2/+2 permanently. |\n| Litter Keeper | 4 | 3/5 | Whenever you make a Kit, make another in your Burrow, up to 4 extra a turn. (The extra ones don't trigger this.) | …make 2 more, up to 8 extra a turn. |\n| Gerd the Shouter | 4 | 5/4 | Your Kits have Bristle 3. | Your Kits have Bristle 6. |\n| Herald of the Lemenår | 5 | 4/7 | Start of Turn: make as many Kits as your Burrow holds, at most 6. | …at most 12. |\n| Cantor of the Edge | 5 | 5/6 | Whenever one of your Kits dies, your biggest unit gains its stats for this fight. | …gains double its stats for this fight. |\n| Snow Hall Guard | 5 | 6/8 | Onward. Start of Combat: your Kits gain +2/+2 for this fight, Burrow Kits included. | …+4/+4 for this fight. |\n| Old Mother Lemen | 6 | 5/9 | Your Kits have +1/+1 and Onward. | Your Kits have +2/+2 and Onward. |\n| Brother Onward | 6 | 7/7 | Start of Combat: your front unit takes the Banner: +4/+4 for this fight. Whenever the Banner's holder dies, the Banner passes to your new front unit and grows by +4/+4. | Banner starts at +8/+8 and grows by +8/+8. |\n| Ferrywife of the Wide Water | 6 | 6/8 | End of Turn: spend half the Kits in your Burrow (round down). Your units that aren't Kits gain +1/+1 permanently for each Kit spent. | …+2/+2 for each Kit spent. |\n\n**Tokens:** the Kit only. **Spells:** none needed.\n\n**Rules notes.**\n- A Kit that comes out through Onward counts as the dying unit's own summon, so it takes that slot. If the slot is taken (by an Ooze's Belly, say), it goes to the nearest empty slot.\n- A unit with Onward from two sources still brings out only one Kit.\n- Ole's Kits *die*, so Cantor sees them.\n\n## 3. Builds\n\n**The Endless Tide (Burrow as fight HP).** Nester, Matron, Litter Keeper and Herald build a Burrow of 12–20 Kits. Front Lemming, then Old Mother Lemen, pour it out through Onward. Gerd makes every Kit an enemy hits cost it 3 Health, so a long chain of Kits wears down a board of giants. Cantor turns each Kit death into stats on your one big unit, which is often another tribe's unit with Cleave or Shield. The weakness: Kits that come out of the Burrow didn't start the fight, so a win deals little hero damage. The Tide wins rounds and hits lightly.\n\n**The Crossing (Burrow as currency).** Keep only three or four real units, ideally strong ones from another tribe, and feed them Kits. Raft-builder cashes Kits at a great early rate, and Herding Council takes 2 a turn. Ferrywife drains half the Burrow every turn into permanent stats. The puzzle is the order of operations. Herald counts the Burrow at Start of Turn. Matron counts the Herd at End of Turn, so seat her before the Council and the Ferrywife in reading order. Any Kit you want to keep, move onto the board before End of Turn, where the spenders can't reach it. The Crossing and the Tide fight over the same pile, and most games settle on a ratio between them.\n\n**The Banner (whoever is in front leads).** Brother Onward, plus Front Lemming or Snow Hall Guard, at F1. Front Kits die quickly and pass a Banner that grows each time: after five deaths, the sixth front unit carries +24/+24. Put a Kit at F1 so the Banner grows early, then a sturdy unit behind it to catch it. A Bog Mire unit or a Hunker unit is ideal, because it has to be attacked and doesn't die.\n\n**Kits for anyone (splash).** Squeaker plus Identical Cousin is a two-card package for any comp. Cousin turns a spare Kit into a copy of your key unit, and Created copies count for triples, so two copies of a Fairy or an Ooze plus a Kit make a golden and a Discover.\n\n**Mixing in a lobby.**\n- *Oozes:* Eat a Kit for a free permanent snack at Kit size, and a Belly can hold Kits. Nester is an endless pantry.\n- *Fairies:* a Ring slot with an Onward unit on it gives every Kit that steps in the Ring bonus. A ringed F1 under Front Lemming is a Kit factory with +4/+4 per Ring.\n- *Hedgerow:* tuck Kits into the Burrow so Pass reaches a real rightmost unit.\n- *Birds:* a Nest is an empty slot, so Tally fails, but a Bird away South frees a slot for Kits.\n- *Bog:* a Mire unit at the front is the best Banner holder.\n\n## 4. Risks and holes\n\n1. **Fight length and readability.** An Onward chain of 15 Kits and a passing Banner could make fights long and hard to follow. It needs a quick Kit-emerges animation and a Burrow count that ticks down on the hero.\n2. **Quadratic growth.** Kit count times Kit size grows on two axes. Herald plus Litter Keeper is the worst pair, at up to 10 Kits a turn. Litter Keeper's cap and Herald's cap keep both linear, but the Tide with a golden Mother Lemen and a golden Cantor needs a simulation check.\n3. **Stalling.** Plain 1/1 Kits with Onward and Bristle could drag fights out against boards with low Attack. Ties deal nothing, so a Tide that can't kill gives a lot of ties.\n4. **Identical Cousin as a generic card.** It works for any comp that owns a Kit. The guard is that Kits come only from Migration cards, but Squeaker is a Tier 1, so splashing is cheap. If Cousin turns up in every comp, require a *Lemming* next to it, or make the copy lose its text.\n5. **Tally outside the tribe.** Late in a game every board is full, so Tally is a generic gold-a-turn card. That may be fine (it costs a slot), or it may need \"if 3 or more are Kits\".\n6. **Hero damage.** The Tide's surfaced Kits add nothing to hero damage. That's a deliberate check, but the owner might feel it undercuts the fantasy.\n7. **Hidden information.** The Burrow is off the board, so its count should show on the opponent's hero.\n8. **Rules gaps.** End of Turn order (assumed reading order) and Onward against Belly summons need a ruling.\n\n## 5. Tier check\n\nKit value is taken at Kit size 1/1 early and 2/2–3/3 in a good setup. Bodies are 4 / 6 / 7 / 8.5 / 12 / 14.\n\n- **Tier 1:** Squeaker gives 3 stats plus a Kit, 5 once (1.25 bodies), a tempo Alleycat. Nester gives 2 stats a turn (0.5 bodies against 0.4), a little high on purpose, because Kits pay off only once the slot and Kit-size cards arrive.\n- **Tier 2:** Tally's 1 gold a turn is about a third of a unit, which fits the economy slot. Weaver is about 6 stats now plus every future Kit, about 1.3 bodies. Digger's two Onwards bring out about 4–6 stats in a fight, about 1 body. The bodies are slightly under 6 to pay for the text.\n- **Tier 3:** Front Lemming brings out 3 Kits, 6–12 stats in a fight, 0.9–1.7 bodies. That's at or slightly over the 0.7–1.4 range, on purpose: it's the card that names the comp. Matron makes up to 3 Kits, 6 stats a turn (0.86 bodies). Raft-builder gives 12 stats once for 3 Kits, net about 1 body. Ole deals 3–9 damage in a fight (0.4–1.3 bodies).\n- **Tier 4:** Council gives about +1/+1 to five units, 10 a turn (1.2 bodies), and costs 2 Kits. Litter Keeper adds up to 4 Kits, 8–16 a turn, on target to slightly high. Gerd reflects 3 per Kit hit, about 15 a fight (1.8 bodies against 2). Cousin's value is a body of 8–14 plus text (1–1.6 bodies) plus triple progress. The triple progress is the real price, and the multiplier slot here is spent on copying rather than stats.\n- **Tier 5:** Herald makes up to 6 Kits, 24–36 a turn (2–3 bodies against 2, top 5), capped so it can't run away. Cantor gives 8 Kit deaths at 4–6 stats, 32–48 in a fight (2.7–4 bodies against 4). Snow Hall Guard gives +4 to about 8 Kits plus a 14-stat body, about 3.8 bodies in a fight. It's the tempo piece that holds the line.\n- **Tier 6:** Mother Lemen pours out a Burrow of 10 at 3/3 to 4/4, plus her aura, about 70–90 in a fight (5–6.4 bodies against 6). Brother Onward's Banner over 5 front deaths totals about 80 in a fight (5.7 bodies). Ferrywife at a steady Burrow of 8–12 gives 4–6 Kits a turn to six units, 48–72 a turn (3.4–5 bodies against 4). It eats the Tide's fuel, which is the trade.\n- **Shape changes:** Tier 4 has a combat engine (Gerd) in place of a second buffer. This tribe's in-fight power comes through many small bodies, so an engine that pays per Kit hit belongs where the Burrow first gets big. Tier 6 has two capstones that compete (Tide against Crossing) plus the Banner payoff.\n\n## 6. Design rationale\n\n1. Started with the slot puzzle: a full board pays (Tally), but you need an empty slot to play. Free filler bodies make that a decision every turn.\n2. Filler that can't be sold at value needs somewhere to go, so overflow became a reserve: the Burrow.\n3. A reserve is dull unless it's spent three ways at different rates. Raft-builder, Council and Ferrywife convert it to stats, Ole to damage, Onward to fight HP. That's the leftover-rate puzzle.\n4. Onward emerged as what the death and reserve cards had in common, so it became the keyword. Fights never cost Kits, so the reserve stays a long-term number.\n5. Kit size as a single standing stat (\"more recipients, not bigger numbers\") gave a second axis, count against size, that multiply.\n6. Making the Burrow the only place spenders reach gave a positional trick: move a Kit onto the board to protect it.\n7. Matron's thresholds (every 4) make some spending free, a deliberate small leftover puzzle.\n8. Ole's Kits die and can't come out again: the same Kit is either a missile or a body, and it feeds Cantor.\n9. Reading order already decides who attacks first, so \"the front\" became a role. Front Lemming at Tier 3, the growing Banner at Tier 6.\n10. Created copies count for triples, so a Kit became raw material for a copy (Cousin). That's the main cross-tribe, use-it-for-something-else card.\n11. Caps on every self-feeding Kit maker (Matron, Litter Keeper, Herald) keep count growth linear. Fight-only payoffs (Cantor, Banner) carry the big numbers.\n12. Names and lore came last: lemmings making Kits, a fox census-taker, a learned lemming who proves they fall from the sky, the Edge cult, and the crossing of the Wide Water.\n","versions":[{"v":1,"summary":"Lemmings that make identical little Kit tokens, with extras waiting in an off-board Burrow.\nThe Burrow is spent three ways: as fight HP through Onward, as missiles, or as permanent stats for your real units.","data":{"design_id":"great-migration--bottom-up-mech","v":1,"identity":{"tribe_name":"The Great Migration","mechanic":"**Core mechanic: the Herd and its Burrow.** The tribe makes **Kits**: identical little Lemming tokens. Kits that don't fit on the board wait in the **Burrow**, an off-board reserve shown on your hero. **Onward** turns that reserve into fight HP. Every card in the tribe either grows the Herd, makes Kits bigger, or spends Kits on something else.","keywords":[{"name":"Burrow","text":"a Kit made with no empty slot goes into your Burrow. While recruiting, you can move Kits between the board and the Burrow for free. A Kit that goes into the Burrow loses its own buffs and keeps only Kit size. Your **Herd** is all your Kits, on the board and in the Burrow."},{"name":"Onward","text":"*When this dies, a Kit from your Burrow takes its slot.* Each Burrow Kit can come out once a fight. Fights never cost you Kits: the Burrow is full again afterwards."}],"plays":"Early on, Kits are free bodies that let you attack first and fill gaps. By the midgame you're running a stockpile that has three jobs at once. On the board it fills slots, which earns gold and moves Kits out of reach of the cards that spend from the Burrow. In the Burrow it's the Onward chain's fuel and ammunition for Ole. Spent, it becomes permanent stats on your real units. The tribe's numbers puzzles all pull on that one pile. You grow **count** (Kit makers) or **size** (Kit size), and they multiply. Spending at a good rate leaves you short of fight fuel, and some cards trigger at Herd thresholds, so a Kit spent below the next threshold is free. The tribe owns no big bodies of its own, so its best boards borrow a few strong units from other tribes and wrap them in Kits."},"units":[{"uid":"u01","name":"Yellowcoat Squeaker","tier":1,"attack":1,"health":2,"text":"When played: make a Kit.","golden":"When played: make 2 Kits."},{"uid":"u02","name":"Snowbed Nester","tier":1,"attack":1,"health":2,"text":"End of Turn: make a Kit.","golden":"End of Turn: make 2 Kits."},{"uid":"u03","name":"Tally, the Census Fox","tier":2,"attack":1,"health":4,"text":"End of Turn: if all 7 of your slots are full, gain 1 gold.","golden":"…gain 2 gold."},{"uid":"u04","name":"Tunic Weaver","tier":2,"attack":2,"health":3,"text":"When played: Kit size +1/+1.","golden":"When played: Kit size +2/+2."},{"uid":"u05","name":"Runway Digger","tier":2,"attack":2,"health":3,"text":"Onward. When played: give another unit Onward permanently.","golden":"…give two other units Onward permanently."},{"uid":"u06","name":"The Front Lemming","tier":3,"attack":2,"health":4,"text":"Your front unit has Onward, up to 3 times a fight.","golden":"…up to 6 times a fight."},{"uid":"u07","name":"Brood Matron","tier":3,"attack":2,"health":5,"text":"End of Turn: make a Kit for every 4 Kits in your Herd (at most 3).","golden":"…make 2 Kits for every 4 (at most 6)."},{"uid":"u08","name":"Raft-builder","tier":3,"attack":3,"health":4,"text":"When played: spend up to 3 Kits from your Burrow. Give a unit +2/+2 permanently for each.","golden":"…+4/+4 for each."},{"uid":"u09","name":"Ole the Learned","tier":3,"attack":3,"health":3,"text":"Start of Combat: 3 Kits from your Burrow fall on random enemies, each dealing damage equal to its Attack, then die. They can't come out again this fight.","golden":"…6 Kits fall."},{"uid":"u10","name":"Identical Cousin","tier":4,"attack":3,"health":4,"text":"When played: a Kit next to this becomes a plain Created copy of another unit next to this.","golden":"…two Kits next to this each become a plain copy of another unit next to this."},{"uid":"u11","name":"Herding Council","tier":4,"attack":4,"health":4,"text":"End of Turn: if your Burrow holds 2 or more Kits, spend 2 and give your units that aren't Kits +1/+1 permanently.","golden":"…+2/+2 permanently."},{"uid":"u12","name":"Litter Keeper","tier":4,"attack":3,"health":5,"text":"Whenever you make a Kit, make another in your Burrow, up to 4 extra a turn. (The extra ones don't trigger this.)","golden":"…make 2 more, up to 8 extra a turn."},{"uid":"u13","name":"Gerd the Shouter","tier":4,"attack":5,"health":4,"text":"Your Kits have Bristle 3.","golden":"Your Kits have Bristle 6."},{"uid":"u14","name":"Herald of the Lemenår","tier":5,"attack":4,"health":7,"text":"Start of Turn: make as many Kits as your Burrow holds, at most 6.","golden":"…at most 12."},{"uid":"u15","name":"Cantor of the Edge","tier":5,"attack":5,"health":6,"text":"Whenever one of your Kits dies, your biggest unit gains its stats for this fight.","golden":"…gains double its stats for this fight."},{"uid":"u16","name":"Snow Hall Guard","tier":5,"attack":6,"health":8,"text":"Onward. Start of Combat: your Kits gain +2/+2 for this fight, Burrow Kits included.","golden":"…+4/+4 for this fight."},{"uid":"u17","name":"Old Mother Lemen","tier":6,"attack":5,"health":9,"text":"Your Kits have +1/+1 and Onward.","golden":"Your Kits have +2/+2 and Onward."},{"uid":"u18","name":"Brother Onward","tier":6,"attack":7,"health":7,"text":"Start of Combat: your front unit takes the Banner: +4/+4 for this fight. Whenever the Banner's holder dies, the Banner passes to your new front unit and grows by +4/+4.","golden":"Banner starts at +8/+8 and grows by +8/+8."},{"uid":"u19","name":"Ferrywife of the Wide Water","tier":6,"attack":6,"health":8,"text":"End of Turn: spend half the Kits in your Burrow (round down). Your units that aren't Kits gain +1/+1 permanently for each Kit spent.","golden":"…+2/+2 for each Kit spent."}],"extras":[{"uid":"x01","kind":"token","name":"Kit","text":"a Lemming whose stats are your **Kit size**. Kit size starts at 1/1, and cards raise it permanently for every Kit you have, now and later, in the Burrow too. Kits are Created, sell for 0, aren't in the pool and never make triples. Harvest Supper's Migration bonus reaches them as well."}],"builds":[{"name":"The Endless Tide (Burrow as fight HP)","text":"Nester, Matron, Litter Keeper and Herald build a Burrow of 12–20 Kits. Front Lemming, then Old Mother Lemen, pour it out through Onward. Gerd makes every Kit an enemy hits cost it 3 Health, so a long chain of Kits wears down a board of giants. Cantor turns each Kit death into stats on your one big unit, which is often another tribe's unit with Cleave or Shield. The weakness: Kits that come out of the Burrow didn't start the fight, so a win deals little hero damage. The Tide wins rounds and hits lightly."},{"name":"The Crossing (Burrow as currency)","text":"Keep only three or four real units, ideally strong ones from another tribe, and feed them Kits. Raft-builder cashes Kits at a great early rate, and Herding Council takes 2 a turn. Ferrywife drains half the Burrow every turn into permanent stats. The puzzle is the order of operations. Herald counts the Burrow at Start of Turn. Matron counts the Herd at End of Turn, so seat her before the Council and the Ferrywife in reading order. Any Kit you want to keep, move onto the board before End of Turn, where the spenders can't reach it. The Crossing and the Tide fight over the same pile, and most games settle on a ratio between them."},{"name":"The Banner (whoever is in front leads)","text":"Brother Onward, plus Front Lemming or Snow Hall Guard, at F1. Front Kits die quickly and pass a Banner that grows each time: after five deaths, the sixth front unit carries +24/+24. Put a Kit at F1 so the Banner grows early, then a sturdy unit behind it to catch it. A Bog Mire unit or a Hunker unit is ideal, because it has to be attacked and doesn't die."},{"name":"Kits for anyone (splash)","text":"Squeaker plus Identical Cousin is a two-card package for any comp. Cousin turns a spare Kit into a copy of your key unit, and Created copies count for triples, so two copies of a Fairy or an Ooze plus a Kit make a golden and a Discover."},{"name":"Mixing in a lobby","text":"- *Oozes:* Eat a Kit for a free permanent snack at Kit size, and a Belly can hold Kits. Nester is an endless pantry.\n- *Fairies:* a Ring slot with an Onward unit on it gives every Kit that steps in the Ring bonus. A ringed F1 under Front Lemming is a Kit factory with +4/+4 per Ring.\n- *Hedgerow:* tuck Kits into the Burrow so Pass reaches a real rightmost unit.\n- *Birds:* a Nest is an empty slot, so Tally fails, but a Bird away South frees a slot for Kits.\n- *Bog:* a Mire unit at the front is the best Banner holder."}],"risks":["**Fight length and readability.** An Onward chain of 15 Kits and a passing Banner could make fights long and hard to follow. It needs a quick Kit-emerges animation and a Burrow count that ticks down on the hero.","**Quadratic growth.** Kit count times Kit size grows on two axes. Herald plus Litter Keeper is the worst pair, at up to 10 Kits a turn. Litter Keeper's cap and Herald's cap keep both linear, but the Tide with a golden Mother Lemen and a golden Cantor needs a simulation check.","**Stalling.** Plain 1/1 Kits with Onward and Bristle could drag fights out against boards with low Attack. Ties deal nothing, so a Tide that can't kill gives a lot of ties.","**Identical Cousin as a generic card.** It works for any comp that owns a Kit. The guard is that Kits come only from Migration cards, but Squeaker is a Tier 1, so splashing is cheap. If Cousin turns up in every comp, require a *Lemming* next to it, or make the copy lose its text.","**Tally outside the tribe.** Late in a game every board is full, so Tally is a generic gold-a-turn card. That may be fine (it costs a slot), or it may need \"if 3 or more are Kits\".","**Hero damage.** The Tide's surfaced Kits add nothing to hero damage. That's a deliberate check, but the owner might feel it undercuts the fantasy.","**Hidden information.** The Burrow is off the board, so its count should show on the opponent's hero.","**Rules gaps.** End of Turn order (assumed reading order) and Onward against Belly summons need a ruling."],"tier_check":[{"tier":1,"note":"Kit value is taken at Kit size 1/1 early and 2/2–3/3 in a good setup. Bodies are 4 / 6 / 7 / 8.5 / 12 / 14. Squeaker gives 3 stats plus a Kit, 5 once (1.25 bodies), a tempo Alleycat. Nester gives 2 stats a turn (0.5 bodies against 0.4), a little high on purpose, because Kits pay off only once the slot and Kit-size cards arrive."},{"tier":2,"note":"Tally's 1 gold a turn is about a third of a unit, which fits the economy slot. Weaver is about 6 stats now plus every future Kit, about 1.3 bodies. Digger's two Onwards bring out about 4–6 stats in a fight, about 1 body. The bodies are slightly under 6 to pay for the text."},{"tier":3,"note":"Front Lemming brings out 3 Kits, 6–12 stats in a fight, 0.9–1.7 bodies. That's at or slightly over the 0.7–1.4 range, on purpose: it's the card that names the comp. Matron makes up to 3 Kits, 6 stats a turn (0.86 bodies). Raft-builder gives 12 stats once for 3 Kits, net about 1 body. Ole deals 3–9 damage in a fight (0.4–1.3 bodies)."},{"tier":4,"note":"Council gives about +1/+1 to five units, 10 a turn (1.2 bodies), and costs 2 Kits. Litter Keeper adds up to 4 Kits, 8–16 a turn, on target to slightly high. Gerd reflects 3 per Kit hit, about 15 a fight (1.8 bodies against 2). Cousin's value is a body of 8–14 plus text (1–1.6 bodies) plus triple progress. The triple progress is the real price, and the multiplier slot here is spent on copying rather than stats."},{"tier":5,"note":"Herald makes up to 6 Kits, 24–36 a turn (2–3 bodies against 2, top 5), capped so it can't run away. Cantor gives 8 Kit deaths at 4–6 stats, 32–48 in a fight (2.7–4 bodies against 4). Snow Hall Guard gives +4 to about 8 Kits plus a 14-stat body, about 3.8 bodies in a fight. It's the tempo piece that holds the line."},{"tier":6,"note":"Mother Lemen pours out a Burrow of 10 at 3/3 to 4/4, plus her aura, about 70–90 in a fight (5–6.4 bodies against 6). Brother Onward's Banner over 5 front deaths totals about 80 in a fight (5.7 bodies). Ferrywife at a steady Burrow of 8–12 gives 4–6 Kits a turn to six units, 48–72 a turn (3.4–5 bodies against 4). It eats the Tide's fuel, which is the trade. **Shape changes:** Tier 4 has a combat engine (Gerd) in place of a second buffer. This tribe's in-fight power comes through many small bodies, so an engine that pays per Kit hit belongs where the Burrow first gets big. Tier 6 has two capstones that compete (Tide against Crossing) plus the Banner payoff."}],"rationale":["Started with the slot puzzle: a full board pays (Tally), but you need an empty slot to play. Free filler bodies make that a decision every turn.","Filler that can't be sold at value needs somewhere to go, so overflow became a reserve: the Burrow.","A reserve is dull unless it's spent three ways at different rates. Raft-builder, Council and Ferrywife convert it to stats, Ole to damage, Onward to fight HP. That's the leftover-rate puzzle.","Onward emerged as what the death and reserve cards had in common, so it became the keyword. Fights never cost Kits, so the reserve stays a long-term number.","Kit size as a single standing stat (\"more recipients, not bigger numbers\") gave a second axis, count against size, that multiply.","Making the Burrow the only place spenders reach gave a positional trick: move a Kit onto the board to protect it.","Matron's thresholds (every 4) make some spending free, a deliberate small leftover puzzle.","Ole's Kits die and can't come out again: the same Kit is either a missile or a body, and it feeds Cantor.","Reading order already decides who attacks first, so \"the front\" became a role. Front Lemming at Tier 3, the growing Banner at Tier 6.","Created copies count for triples, so a Kit became raw material for a copy (Cousin). That's the main cross-tribe, use-it-for-something-else card.","Caps on every self-feeding Kit maker (Matron, Litter Keeper, Herald) keep count growth linear. Fight-only payoffs (Cantor, Banner) carry the big numbers.","Names and lore came last: lemmings making Kits, a fox census-taker, a learned lemming who proves they fall from the sky, the Edge cult, and the crossing of the Wide Water.","Rules notes: - A Kit that comes out through Onward counts as the dying unit's own summon, so it takes that slot. If the slot is taken (by an Ooze's Belly, say), it goes to the nearest empty slot.\n- A unit with Onward from two sources still brings out only one Kit.\n- Ole's Kits *die*, so Cantor sees them."],"changes":[],"declined":[]},"reviews":[],"ratings":{"fun":null,"distinct":null},"votes":{"settle":0,"iterate":0}}]},{"id":"great-migration--one-constraint","key":"great-migration-e3aa","seed":"great-migration","route":"one-constraint","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"great-migration--top-down-flavour","key":"great-migration-742b","seed":"great-migration","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"hive-and-carnival--bottom-up-mech","key":"hive-and-carnival-f10a","seed":"hive-and-carnival","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"hive-and-carnival--top-down-flavour","key":"hive-and-carnival-1654","seed":"hive-and-carnival","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"hive-and-carnival--top-down-mech","key":"hive-and-carnival-736a","seed":"hive-and-carnival","route":"top-down-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"ivy-climbers--one-constraint","key":"ivy-climbers-7791","seed":"ivy-climbers","route":"one-constraint","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"ivy-climbers--surgical","key":"ivy-climbers-22b3","seed":"ivy-climbers","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"ivy-climbers--top-down-mech","key":"ivy-climbers-0fcc","seed":"ivy-climbers","route":"top-down-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"lekking-knights--one-constraint","key":"lekking-knights-863e","seed":"lekking-knights","route":"one-constraint","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"lekking-knights--player-story","key":"lekking-knights-b0f0","seed":"lekking-knights","route":"player-story","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"lekking-knights--top-down-flavour","key":"lekking-knights-92e0","seed":"lekking-knights","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"moth-apothecaries--borrow-twist","key":"moth-apothecaries-82c9","seed":"moth-apothecaries","route":"borrow-twist","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"moth-apothecaries--bottom-up-mech","key":"moth-apothecaries-eba8","seed":"moth-apothecaries","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"moth-apothecaries--surgical","key":"moth-apothecaries-9015","seed":"moth-apothecaries","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rat-king--borrow-twist","key":"rat-king-83c6","seed":"rat-king","route":"borrow-twist","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rat-king--surgical","key":"rat-king-dcd0","seed":"rat-king","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rat-king--top-down-mech","key":"rat-king-759f","seed":"rat-king","route":"top-down-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"reed-runners--borrow-twist","key":"reed-runners-b98c","seed":"reed-runners","route":"borrow-twist","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"reed-runners--bottom-up-mech","key":"reed-runners-e957","seed":"reed-runners","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"reed-runners--surgical","key":"reed-runners-b548","seed":"reed-runners","route":"surgical","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rot-guild--bottom-up-mech","key":"rot-guild-f85e","seed":"rot-guild","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rot-guild--player-story","key":"rot-guild-343d","seed":"rot-guild","route":"player-story","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"rot-guild--top-down-flavour","key":"rot-guild-9b1b","seed":"rot-guild","route":"top-down-flavour","tribe_name":"The Rot Guild","status":"unreviewed","final_version":null,"stop_reason":null,"md":"# The Rot Guild — v1\n\n## 1. Identity\n\n**The fantasy.** You run the woodland's funeral parlour. Every unit you lose, in a fight or by your own hand, is laid down into the soil, and the next morning the Guild's mushrooms come up fat on it. The solemn toadstools do the burying while you recruit; the puffballs burst laughing in the fight. Grief at the graveside, a feast by the next rain.\n\n**Compost** (tribe tracker, shown under the board). Each time a friendly unit dies, in a fight or Laid to Rest while recruiting, your Compost gains its **printed** Attack and Health (card stats, doubled if golden; buffs don't count). At Start of Turn, after every Fruit has resolved, the Compost empties: mourning lasts one rain.\n\n**Fruit** (keyword). Start of Turn: this permanently gains a quarter of your Compost. A unit can have Fruit more than once, and each one Fruits separately. Golden cards with Fruit have it twice.\n\n**Lay to Rest** (action). Destroy a friendly unit while recruiting. It counts as dying: its \"When this dies\" text happens now, on the recruiting board, and it goes into the Compost.\n\n**How it plays.** The Guild's units are thin and its fights are often lost early, but nothing is wasted. Deaths in the fight and burials in the shop fill one shared pile, and every Fruit unit drinks a quarter of it overnight. So the pile is your engine and Fruit is your carry count. The tribe's cards pull on three levers: **more dying** (Spores, Amanita, Old Fingers), **bigger or doubled entries** (Inkcap, Stinkhorn, White-Rot, Three Rains) and **more Fruit** (Sealbearer, Rootbinder, Bootlace). Because the Compost counts any friendly unit and Fruit can go on any unit, the Guild is as happy feeding another tribe's carry as its own. Placement matters twice: Amanita and Sexton care who is beside whom, and Bootlace's network needs an unbroken touching run, which your own burials keep breaking.\n\n## 2. The 19 units\n\n| Name | Tier | A/H | Text | Golden |\n|---|---|---|---|---|\n| Stumpwick Puffling | 1 | 2/1 | When this dies: summon a Spore. | 4/2. Summon two Spores. |\n| Candlesnuff Apprentice | 1 | 1/3 | Fruit. | 2/6. Fruit twice. |\n| Black-Glove Undertaker | 2 | 2/3 | When played: you may Lay to Rest another friendly unit. If you do, gain 1 gold. | 4/6. Gain 2 gold. |\n| Moss-Bier Bearer | 2 | 1/4 | Each time a friendly unit next to this dies in a fight, it permanently gains +1/+1. | 2/8. +2/+2. |\n| Hired Mute | 2 | 3/3 | Start of Turn: if 3 or more friendly units died since your last turn, gain 1 gold. | 6/6. Gain 2 gold. |\n| Warden Amanita | 3 | 3/4 | Bristle 2. Start of Combat: destroy the friendly units beside this. | 6/8. Bristle 4. |\n| Guild Sealbearer | 3 | 3/3 | When played: give another friendly unit Fruit. | 6/6. Give two other friendly units Fruit. |\n| Raincatcher Puffball | 3 | 1/6 | Each time this takes damage, summon a Spore. Three times a fight. | 2/12. Summon two Spores each time. |\n| Litter Acre Sexton | 3 | 2/5 | Each time a friendly unit is Laid to Rest, the units that were beside it permanently gain +1/+1. | 4/10. +2/+2. |\n| Clerk Inkcap | 4 | 2/6 | Each time another friendly unit dies in a fight, your Compost gains its printed stats again, and this loses 1 Health. | 4/12. Gains them twice more; this loses 2 Health. |\n| Rootbinder | 4 | 4/5 | Your units of other tribes beside this have Fruit. | 8/10. They have Fruit twice. |\n| White-Rot Renderer | 4 | 3/5 | When played: you may Lay to Rest another friendly unit. Your Compost gains all its stats, not only its printed ones. | 6/10. Up to two other friendly units. |\n| Stinkhorn, the Herald | 4 | 4/4 | Each time an enemy unit dies, your Compost gains half its printed stats. | 8/8. All its printed stats. |\n| Stumpwick Grandsire | 5 | 4/8 | When this dies: fill your empty slots with Spores, each with a quarter of this unit's stats. | 8/16. Half of this unit's stats. |\n| Mourner of Three Rains | 5 | 5/7 | At Start of Turn, your Compost keeps half of itself instead of emptying. (Doesn't stack.) | 10/14. Keeps all of itself. |\n| Ludwig, the Lodger | 5 | 5/7 | Fruit. Each time another friendly unit is Laid to Rest, this permanently gains its stats. Can't be Laid to Rest. | 10/14. Fruit twice. Gains double its stats. |\n| Grandmother Bootlace | 6 | 6/9 | Fruit. Your other units in an unbroken touching run with this have Fruit. | 12/18. Fruit twice; they have Fruit twice. |\n| Old Fingers | 6 | 7/7 | Each time another friendly unit dies in a fight, summon a copy of it with its printed stats. Six times a fight. Copies don't trigger this. | 14/14. Copies keep all its stats. |\n| Bellows Puffwell | 6 | 8/8 | When this dies in a fight: give each other friendly unit a quarter of your Compost for this fight. | 16/16. Half of your Compost. |\n\n**Token.** **Spore**: 1/1 Rot Guild, Created. Its printed stats are always 1/1, whatever it was summoned with, so a big Spore still composts as 1/1.\n\n**Spell.** **Graveside Service** (1 gold): Lay to Rest a friendly unit.\n\n**Rule notes.** Laid to Rest units summon onto the recruiting board and those summons stay (Created, sell for 0). Inkcap's Health loss is in-fight only. Old Fingers' copy goes to the nearest empty slot, so a Puffling's own Spore takes the Puffling's slot first and the copy goes elsewhere, or nowhere if the board is full.\n\n## 3. Builds\n\n**The Wake (shop burials).** Undertaker, Sexton, Renderer, Ludwig, Graveside Service; Puffling and Spores as fodder. Every turn you bury one or two cheap units in the middle of your board: Sexton buffs both neighbours, Ludwig eats the body whole, and the Compost holds it for tomorrow. A Puffling buried leaves a Spore to bury next turn; Hired Mute pays for the busy graveyard. Renderer buries a pumped unit at full value, which is how you move a big buff from a dying carry onto every Fruit unit. Its payoff is Ludwig plus Mourner of Three Rains, which keeps half the pile so a burial pays out for several turns.\n\n**The Burst (puffballs dying in the fight).** Puffling, Raincatcher, Amanita, Grandsire, Inkcap, Old Fingers, Puffwell. You want as many deaths per fight as possible: Raincatcher splits into Spores as it's hit, Amanita kills her neighbours at Start of Combat so their death text fires before a blow is struck, Old Fingers digs everything up once more, and Inkcap writes each death into the Register twice. Any one Fruit carry turns all that into permanent stats. Puffwell is the in-fight cash-out: give him Damage Reduction or put him in the back row so he dies late, when the pile is biggest.\n\n**The Network (Fruit everywhere).** Apprentice, Sealbearer, Rootbinder, Bootlace. Fewer deaths, more mouths: Bootlace turns a full touching run into seven Fruit units. The tension is that the Wake's burials leave gaps that cut the run, so you bury from the ends of the zigzag (F1, F4) or refill the gap before Start of Turn.\n\n**The Lodger (the Guild as another tribe's undertaker).** Rootbinder and Sealbearer give Fruit to a carry from another tribe, and Stinkhorn fills the Compost from enemy deaths, so a board that wins fights still feeds. With other tribes:\n- **Oozes:** an Ooze Eating your own unit is a friendly death, so it goes into the Compost. Put an Ooze with a full Belly beside Amanita and it opens at Start of Combat. A buried Ooze opens in the shop.\n- **Hedgerow:** Fruit on your rightmost unit stacks with Pass, so one unit takes both streams.\n- **Fairies:** a Fruit unit on a Ring grows from both sources. Note that Shy units leave, which is not death.\n- **Bog:** a Mired Raincatcher is forced to take hits, so it makes its three Spores reliably.\n- **Hunters:** Pack units die beside their leader, which feeds Moss-Bier's permanent buffs.\n- **Birds:** a Bird sold to Fly South doesn't count; a Bird Laid to Rest never comes home. Nest Eggs compost as 0/1.\n\n**Off-label plays Johnny will look for:**\n- Seal Fruit onto Inkcap: his Health grows every turn, so he records more deaths each fight.\n- Seal Fruit onto Grandsire: his death Spores get bigger.\n- Bury a pumped Grandsire in the shop to fill your board with permanent quarter-size Spores.\n- Renderer a big unit, then have Amanita kill Puffwell at Start of Combat: the whole board feasts on that burial for the fight.\n- Amanita beside Old Fingers' targets: they die at Start of Combat, come back at printed stats, and their death text fires twice.\n\n## 4. Risks and holes\n\n- **Losing feeds you.** More deaths means more Compost, so a weak board snowballs into a stronger one. That is a comeback lever, and Stinkhorn rewards winning too, but the tribe may have little reason to win early fights. Watch whether early hero damage kills Guild players before the pile matters.\n- **Fruit stacking.** Two Sealbearers and a Bootlace on one unit give Fruit ×4 on a single carry. That's intended as a high roll, but it may need a cap (\"at most three Fruit\") if it dominates.\n- **Golden Mourner.** Keeping the whole pile makes it grow every turn, and every Fruit unit gains a quarter of a growing pile each turn, so growth is quadratic. It isn't self-feeding (printed stats only), but it's the likeliest runaway. The fallback is \"keeps three quarters\".\n- **Visibility.** The Compost pile, its sources, what's printed versus buffed, and the per-death doubling from Inkcap all need clear UI or the tribe reads as noise.\n- **Old Fingers with death chains.** Copies re-fire death text, so Spores from Puffling and Grandsire summon again. Six times a fight limits it, but a golden copy that keeps all its stats is very large.\n- **Rootbinder is dead text on a Guild-only board.** That is intended, to pull the Guild into mixed boards, but it may feel bad in a lobby where the other tribes are weak.\n- **Hired Mute triggers too easily** once Spores are around. Raise the threshold to 4 if it's a free gold.\n- **Start of Combat order.** Amanita resolves in reading order, so neighbours with their own Start of Combat may or may not have fired. Players need to see that.\n- **Undecided rule:** back-row access isn't settled, and Puffwell's \"die late\" plan leans on the back row being safe.\n\n## 5. Tier check\n\nEstimates are for a good mid-game board: about 5 friendly deaths a fight, printed stats about 6 each, so roughly 30 Compost a turn and about 7 per Fruit.\n\n- **Tier 1:** Puffling is a normal two-body tempo unit (5 stats). The Apprentice gives about 3 a turn early, which is near the guide, but about 7 by mid-game, nearly 2 bodies against a 0.4 target. **Broken on purpose:** it's the seed the whole tribe grows from, its 1/3 body is small, and it's worthless without deaths. If it dominates, it fruits only while you have another Rot Guild unit.\n- **Tier 2:** Moss-Bier gives 4–6 permanent stats a turn (about 1 body, inside 0.3–1). Undertaker turns a sell into a burial at the same 1 gold. Mute gives 1 gold a turn on a condition, which is in line with economy pieces.\n- **Tier 3:** Sealbearer adds about 7 a turn for the rest of the game (about 1 body against 0.8). Raincatcher makes about 6 in-fight stats plus Compost (inside 0.7–1.4). Sexton gives 4–8 a turn. Amanita is negative on her own and pays only through death text; that's her job as the enabler that names the comp.\n- **Tier 4:** Rootbinder gives about 14 a turn and Stinkhorn about 15 with three Fruit units (both 1.6–1.8 bodies against 1.3). Inkcap doubles fight Compost, about 18 a turn across three Fruit units. That's above target, as a T4 multiplier is allowed to be. Renderer is a one-off redistribution, not new stats.\n- **Tier 5:** Ludwig gives 20–30 a turn (about 2 bodies). Mourner roughly doubles every Fruit, which makes it the tier's multiplier. Grandsire is weak at printed size (1/2 Spores) but gives 30–70 in-fight once buffed, around the 4-body target; it is meant to be fed.\n- **Tier 6:** Bootlace with a full run gives seven Fruit, about 105 a turn (7.5 bodies, under the top ~10). With Inkcap, Stinkhorn and Mourner assembled it reaches about twice the top. **Broken on purpose:** it's the capstone the comp is built for, and its golden ceiling is ×2. Old Fingers gives about 60 in-fight plus re-fired death text (about 5–6 bodies). Puffwell gives 40–120 in-fight depending on when he dies.\n\n## 6. Design rationale\n\n1. Took \"death as harvest\" as the core: deaths become a shared pile of stats, because the seed's play line is \"lose your own on purpose\".\n2. The pile counts **printed** stats only, so growth never feeds its own source: the runaway check passes by construction.\n3. \"Growth overnight\": the pile pays out at Start of Turn and then empties, so every burial is a delayed reward.\n4. \"The quiet network\": the pile belongs to the board, not a unit, and Fruit lets any unit drink from it, which gives Johnny cross-tribe hooks for free.\n5. \"The undertaker caused the death\": Lay to Rest is the shop-side sacrifice, and Amanita is the fight-side one.\n6. \"Mourning and mirth\": toadstools work in the shop (burial, registers, seals) and puffballs work in the fight (bursting into Spores), two halves that feed one pile.\n7. Spores compost as 1/1 whatever their size, so Grandsire's big Spores can't loop.\n8. The seed's notable figures took the high tiers by their stories: Inkcap writes deaths twice, Bootlace is the network, Old Fingers digs up, Puffwell is the feast, Ludwig the lodger eats the dead wood.\n9. The \"one rain or three\" dispute became Mourner of Three Rains, the T5 multiplier that keeps the pile.\n10. \"Giving back what the wood gave\": Rootbinder (mycorrhiza) gives Fruit to other tribes, so the Guild has a reason to be splashed into any lobby.\n11. Stinkhorn composts enemy deaths, so the tribe isn't only rewarded for losing (the Spike guard).\n12. Bootlace's run plus gaps from burials: put a spatial cost on the strongest payoff, so Johnny's boards need arranging, not just collecting.\n","versions":[{"v":1,"summary":"Mushroom undertakers: every friendly death, in a fight or buried in the shop, adds its printed stats to a shared Compost pile.\nUnits with Fruit each take a quarter of the pile at the start of every turn, so deaths become permanent growth.","data":{"design_id":"rot-guild--top-down-flavour","v":1,"identity":{"tribe_name":"The Rot Guild","mechanic":"**Compost** (tribe tracker, shown under the board). Each time a friendly unit dies, in a fight or Laid to Rest while recruiting, your Compost gains its **printed** Attack and Health (card stats, doubled if golden; buffs don't count). At Start of Turn, after every Fruit has resolved, the Compost empties: mourning lasts one rain.\n\n**Fruit** (keyword). Start of Turn: this permanently gains a quarter of your Compost. A unit can have Fruit more than once, and each one Fruits separately. Golden cards with Fruit have it twice.","keywords":[{"name":"Compost","text":"(tribe tracker, shown under the board). Each time a friendly unit dies, in a fight or Laid to Rest while recruiting, your Compost gains its **printed** Attack and Health (card stats, doubled if golden; buffs don't count). At Start of Turn, after every Fruit has resolved, the Compost empties: mourning lasts one rain."},{"name":"Fruit","text":"(keyword). Start of Turn: this permanently gains a quarter of your Compost. A unit can have Fruit more than once, and each one Fruits separately. Golden cards with Fruit have it twice."},{"name":"Lay to Rest","text":"(action). Destroy a friendly unit while recruiting. It counts as dying: its \"When this dies\" text happens now, on the recruiting board, and it goes into
