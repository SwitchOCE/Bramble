 3 | 4/5 | **Battlecry:** Remove moss from a minion to gain its moss as +3/+3 per layer. | **Battlecry:** Remove moss from a minion to gain its moss as +6/+6 per layer. |\n| Mossling Silt Mother | 3 | 3/6 | At the start of combat, **Spread** 1 for each mossy minion. | At the start of combat, **Spread** 2 for each mossy minion. |\n| Mossling Dew Collector | 4 | 5/5 | After you buy a minion, if it's mossy, gain 1 Gold next turn. | After you buy a minion, if it's mossy, gain 2 Gold next turn. |\n| Mossling Peat Warden | 4 | 4/6 | **Taunt.** Mossy minions adjacent to this take 1 less damage. | **Taunt.** Mossy minions adjacent to this take 2 less damage. |\n| Mossling Canopy Drip | 4 | 5/7 | At the end of your turn, give your leftmost mossy minion +2/+2. | At the end of your turn, give your leftmost mossy minion +4/+4. |\n| Mossling Old Root Choir | 4 | 4/5 | Whenever you **Spread**, **Spread** 1 again (once per turn). | Whenever you **Spread**, **Spread** 2 again (once per turn). |\n| Mossling Marsh Engine | 5 | 6/7 | Your minions with 3 or more moss have **Windfury**. | Your minions with 6 or more moss have **Windfury**. |\n| Mossling Moss Queen | 5 | 5/8 | Your **Spread** effects add 1 more layer. | Your **Spread** effects add 2 more layer. |\n| Mossling Heartwood Ooze | 5 | 6/6 | **Deathrattle:** Give your minions +1/+1 for each layer of moss they have. | **Deathrattle:** Give your minions +2/+2 for each layer of moss they have. |\n| Mossling The Green Tide | 6 | 6/8 | At the start of combat, **Spread** 3 and give mossy minions +2 Attack. | At the start of combat, **Spread** 6 and give mossy minions +4 Attack. |\n| Mossling Moss-Eater Elder | 6 | 7/9 | **Battlecry:** Strip all moss from your board; gain +4/+4 per layer. | **Battlecry:** Strip all moss from your board; gain +8/+8 per layer. |\n| Mossling World-Bog | 6 | 6/7 | Your mossy minions keep half their moss when sold. | Your mossy minions keep half their moss when sold. |\n\n**Tokens**\n\n- **Mossling Clump** (token): A 1/1 that **Spreads** 1 when it dies.\n\n## 3. Builds\n\n- **Go wide:** Fill the board early and let the payoffs at Tier 4 scale everything at once.\n- **One big carrier:** Pour everything into one minion and protect it with Taunts.\n\n## 4. Risks and holes\n\n- Tier 6 may be too swingy against Divine Shield.\n- The early game leans on a single Tier 1.\n\n## 5. Tier check\n\n- Tier 1: Tier 1 sits close to the guide.\n- Tier 2: Tier 2 sits close to the guide.\n- Tier 3: Tier 3 sits close to the guide.\n- Tier 4: Tier 4 sits close to the guide.\n- Tier 5: Tier 5 sits close to the guide.\n- Tier 6: Tier 6 sits close to the guide.\n\n## 6. Design rationale\n\n1. Picked one shared resource so every card speaks the same language.\n","versions":[{"v":1,"summary":"Moss as a currency you bank by selling.","data":{"design_id":"sample-moss--bottom-up-mech","v":1,"identity":{"tribe_name":"Sample: Mosslings","mechanic":"Moss: layers of +1/+1 that spread between your minions and survive being sold.","keywords":[{"name":"Spread","text":"Give a random friendly minion a layer of moss (+1/+1). Moss stays when the minion is sold to the shop."}],"plays":"You buy cheap oozes, coat them in moss, and sell them knowing the moss stays in the shop for later. The board snowballs slowly, then all at once."},"units":[{"uid":"u01","name":"Mossling Spore Tender","tier":1,"attack":1,"health":2,"text":"**Battlecry:** **Spread** 1.","golden":"**Battlecry:** **Spread** 2."},{"uid":"u02","name":"Mossling Damp Nibbler","tier":1,"attack":2,"health":3,"text":"At the end of your turn, if you have a mossy minion, gain +1 Health.","golden":"At the end of your turn, if you have a mossy minion, gain +2 Health."},{"uid":"u03","name":"Mossling Lichen Crawler","tier":2,"attack":2,"health":5,"text":"**Spread** 1 when this is sold.","golden":"**Spread** 2 when this is sold."},{"uid":"u04","name":"Mossling Puddle Sop","tier":2,"attack":3,"health":3,"text":"Whenever a friendly minion becomes mossy, gain + attlecry:** Give a mossy minion +2/+2. | **Battlecry:** Give a mossy minion +4/+4. |\n| Choir Bog Lantern | 3 | 4/6 | Your mossy minions have +1 Attack. | Your mossy minions have +2 Attack. |\n| Choir Rotwood Hermit | 3 | 3/4 | **Deathrattle:** **Spread** 2. | **Deathrattle:** **Spread** 4. |\n| Choir Fen Gulper | 3 | 4/5 | **Battlecry:** Remove moss from a minion to gain its moss as +3/+3 per layer. | **Battlecry:** Remove moss from a minion to gain its moss as +6/+6 per layer. |\n| Choir Silt Mother | 3 | 3/6 | At the start of combat, **Spread** 1 for each mossy minion. | At the start of combat, **Spread** 2 for each mossy minion. |\n| Choir Dew Collector | 4 | 5/5 | After you buy a minion, if it's mossy, gain 1 Gold next turn. | After you buy a minion, if it's mossy, gain 2 Gold next turn. |\n| Choir Peat Warden | 4 | 4/6 | **Taunt.** Mossy minions adjacent to this take 1 less damage. | **Taunt.** Mossy minions adjacent to this take 2 less damage. |\n| Choir Canopy Drip | 4 | 5/7 | At the end of your turn, give your leftmost mossy minion +2/+2. | At the end of your turn, give your leftmost mossy minion +4/+4. |\n| Choir Old Root Choir | 4 | 4/5 | Whenever you **Spread**, **Spread** 1 again (once per turn). | Whenever you **Spread**, **Spread** 2 again (once per turn). |\n| Choir Marsh Engine | 5 | 6/7 | Your minions with 3 or more moss have **Windfury**. | Your minions with 6 or more moss have **Windfury**. |\n| Choir Moss Queen | 5 | 5/8 | Your **Spread** effects add 1 more layer. | Your **Spread** effects add 2 more layer. |\n| Choir Heartwood Ooze | 5 | 6/6 | **Deathrattle:** Give your minions +1/+1 for each layer of moss they have. | **Deathrattle:** Give your minions +2/+2 for each layer of moss they have. |\n| Choir The Green Tide | 6 | 6/8 | At the start of combat, **Spread** 3 and give mossy minions +2 Attack. | At the start of combat, **Spread** 6 and give mossy minions +4 Attack. |\n| Choir Moss-Eater Elder | 6 | 7/9 | **Battlecry:** Strip all moss from your board; gain +4/+4 per layer. | **Battlecry:** Strip all moss from your board; gain +8/+8 per layer. |\n| Choir World-Bog | 6 | 6/7 | Your mossy minions keep half their moss when sold. | Your mossy minions keep half their moss when sold. |\n\n**Tokens**\n\n- **Choir Clump** (token): A 1/1 that **Spreads** 1 when it dies.\n\n## 3. Builds\n\n- **Go wide:** Fill the board early and let the payoffs at Tier 4 scale everything at once.\n- **One big carrier:** Pour everything into one minion and protect it with Taunts.\n\n## 4. Risks and holes\n\n- Tier 6 may be too swingy against Divine Shield.\n- The early game leans on a single Tier 1.\n\n## 5. Tier check\n\n- Tier 1: Tier 1 sits close to the guide.\n- Tier 2: Tier 2 sits close to the guide.\n- Tier 3: Tier 3 sits close to the guide.\n- Tier 4: Tier 4 sits close to the guide.\n- Tier 5: Tier 5 sits close to the guide.\n- Tier 6: Tier 6 sits close to the guide.\n\n## 6. Design rationale\n\n1. Picked one shared resource so every card speaks the same language.\n","versions":[{"v":1,"summary":"A choir of oozes whose fights start with a burst of moss.","data":{"design_id":"sample-moss--player-story","v":1,"identity":{"tribe_name":"Sample: Bog Choir","mechanic":"Moss: layers of +1/+1 that spread between your minions and survive being sold.","keywords":[{"name":"Spread","text":"Give a random friendly minion a layer of moss (+1/+1). Moss stays when the minion is sold to the shop."}],"plays":"You buy cheap oozes, coat them in moss, and sell them knowing the moss stays in the shop for later. The board snowballs slowly, then all at once."},"units":[{"uid":"u01","name":"Choir Spore Tender","tier":1,"attack":1,"health":2,"text":"**Battlecry:** **Spread** 1.","golden":"**Battlecry:** **Spread** 2."},{"uid":"u02","name":"Choir Damp Nibbler","tier":1,"attack":2,"health":3,"text":"At the end of your turn, if you have a mossy minion, gain +1 Health.","golden":"At the end of your turn, if you have a mossy minion, gain +2 Health."},{"   function finalV(d) { return d.final_version || lastV(d); }
  function ratedV(d) {
    if ((d.status === "settled" || d.status === "capped") && d.final_version) return d.final_version;
    for (var i = d.versions.length - 1; i >= 0; i--) if ((d.versions[i].reviews || []).length) return d.versions[i].v;
    return null;
  }
  function score(d, crit) {
    var v = ver(d, ratedV(d)); if (!v || !v.ratings) return null;
    if (crit === "both") {
      var xs = CRIT.map(function (c) { return v.ratings[c.id]; }).filter(function (x) { return typeof x === "number"; });
      return xs.length ? xs.reduce(function (a, b) { return a + b; }, 0) / xs.length : null;
    }
    return typeof v.ratings[crit] === "number" ? v.ratings[crit] : null;
  }
  function pickFor(d) { return PICKS.find(function (p) { return p.design === d.id; }) || null; }

  var STATUS = {
    settled: { group: "settled", tone: "t-good", label: function (d) { return "settled at v" + finalV(d); } },
    capped: { group: "capped", tone: "t-gold", label: function (d) { return "capped at v" + finalV(d); } },
    revising: { group: "revising", tone: "t-warn", label: function () { return "being revised"; } },
    reviewing: { group: "reviewing", tone: "t-info", label: function (d) { return lastV(d) > 1 ? "v" + lastV(d) + " being reviewed" : "being reviewed"; } },
    unreviewed: { group: "unreviewed", tone: "t-info", label: function (d) { return lastV(d) > 1 ? "v" + lastV(d) + " not reviewed yet" : "not reviewed yet"; } },
    written: { group: "unreviewed", tone: "t-info", label: function () { return "not reviewed yet"; } },
    designing: { group: "designing", tone: "", label: function () { return "being designed"; } },
    failed: { group: "failed", tone: "t-bad", label: function () { return "couldn't be finished"; } }
  };
  var GROUPS = [["settled", "Settled"], ["capped", "Capped at the limit"], ["revising", "Being revised"], ["reviewing", "Being reviewed"],
    ["unreviewed", "Not reviewed yet"], ["designing", "Being designed"], ["failed", "Couldn't be finished"]];
  function st(d) { return STATUS[d.status] || STATUS.designing; }
  function pill(d) { var s = st(d); return '<span class="pill ' + s.tone + '">' + esc(s.label(d)) + "</span>"; }
  function statusSentence(d) {
    var n = lastV(d), v = ver(d, n), got = v ? (v.reviews || []).length : 0, of = RUN.committee.length || 3;
    switch (d.status) {
      case "settled": return "Settled at v" + finalV(d) + ": " + lc(d.stop_reason || "the reviewers felt it was in a good spot") + ".";
      case "capped": return "Stopped at v" + finalV(d) + ", the most versions a design gets.";
      case "revising": return "The reviewers asked for another pass, so v" + (n + 1) + " is being written.";
      case "reviewing": return "v" + n + " is with the reviewers now; " + words(got) + " of " + words(of) + " have answered.";
      case "unreviewed": return "v" + n + " hasn't been reviewed yet.";
      case "written": return "The designer has finished the write-up below. The card-by-card view and reviews will follow.";
      case "failed": return "This design couldn't be finished." + (d.stop_reason ? " " + cap(d.stop_reason) + "." : "");

  }

  // ---------- rating grid ----------
  function ratingGrid(d, big) {
    var vs = d.versions.filter(function (v) { return v.ratings && CRIT.some(function (c) { return typeof v.ratings[c.id] === "number"; }); });
    if (!vs.length) return '<p class="small muted">' + (d.versions.length ? "No ratings yet." : "") + "</p>";
    var fin = (d.status === "settled" || d.status === "capped") ? d.final_version : null;
    var cols = "minmax(0, 1fr) " + vs.map(function () { return big ? "64px" : "52px"; }).join(" ");
    var h = '<div class="rgrid' + (big ? " big" : "") + '" style="grid-template-columns:' + cols + '" aria-label="Ratings out of 10 at each version">';
    h += '<span class="rh"></span>' + vs.map(function (v) { return '<span class="rh' + (v.v === fin ? " fin" : "") + '">v' + v.v + (v.v === fin ? " final" : "") + "</span>"; }).join("");
    CRIT.forEach(function (c) {
      h += '<span class="rl">' + esc(c.name || c.id) + "</span>";
      vs.forEach(function (v) {
        var x = v.ratings[c.id], s = r1(x);
        h += '<span class="cell' + (v.v === fin ? " fin" : "") + '">' + (s ? '<span class="num">' + s + '</span><span class="meter"><i style="width:' + Math.max(0, Math.min(100, x * 10)) + '%"></i></span>' : '<span class="num muted">–</span>') + "</span>";
      });
    });
    if (big) {
      h += '<span class="rl">Said it’s in a good spot</span>';
      vs.forEach(function (v) { var t = v.votes || {}; var n = (v.reviews || []).length; h += '<span class="cell' + (v.v === fin ? " fin" : "") + '"><span class="num">' + (t.settle || 0) + "/" + n + "</span></span>"; });
    }
    return h + "</div>";
  }

  // ---------- home and seed views ----------
  function intro() {
    var n = DESIGNS.length, s = SEEDS.length;
    var names = RUN.committee.map(function (m) { return lc(m.name); });
    var revs = Math.max(0, (RUN.max_versions || 3) - 1);
    var h = '<section class="intro"><h1>New tribes for Bramble</h1>';
    h += "<p>We're trying out new tribes for the game. Each starting idea, or seed, is designed three times over, by designers who each follow a different method. " +
      (names.length ? "Then " + words(names.length) + " reviewers rate every version and suggest changes: " + listJoin(names) + ". " : "") +
      "A design is revised at most " + times(revs) + ", and stops sooner once two of the reviewers feel it's in a good spot.</p>";
    h += "<p>Nothing gets removed. Low-rated and unfinished designs are all here, so you can see what the reviewers think is good and how each design changed along the way.</p>";
    if (n) {
      var counts = {};
      DESIGNS.forEach(function (d) { var g = st(d).group; counts[g] = (counts[g] || 0) + 1; });
      var bits = [];
      if (counts.settled) bits.push(counts.settled + " settled");
      if (counts.capped) bits.push(counts.capped + " capped at the limit");
      if (counts.revising) bits.push(counts.revising + " being revised");
      if (counts.reviewing) bits.push(counts.reviewing + " with the reviewers");
      if (counts.unreviewed) bits.push(counts.unreviewed + " not reviewed yet");
      if (counts.designing) bits.push(counts.designing + " still being designed");
      if (counts.failed) bits.push(counts.failed + " that couldn't be finished");
      h += "<p>So far there " + (n === 1 ? "is one design" : "are " + n + " designs") + " from " + (s === 1 ? "one seed" : s + " seeds") + ": " + listJoin(bits) + ". The numbers on each design are the reviewers' average out of 10, at each version.</p>";
    } else {
      h += "<p>No designs yet. They'll appear here as the designers finish them.</p>";
    }
    return h + "</section>";
  }

  function picksBlock() {
    if (!PICKS.length) return "";
    var h = '<section class="picks"><h2>The best of the run</h2><p class="muted">Picked after reading every design and each seed’s comparison. A pick names the version that was best, which can be the first.</p><ol>';
    PICKS.forEach(function (p) {
      var d = byId[p.design]; if (!d) return;
      h += '<li><a class="pick" href="#design-' + esc(d.key) + (p.version ? "-v" + p.version : "") + '"><span class="rank">' + esc(p.rank || "") + "</span><span><b>" + esc(tribeName(d)) + "</b>" + (p.version ? ' <span class="muted">v' + esc(p.version) + "</span>" : "") +
        '<span class="small muted"> · ' + esc(seedName(d.seed)) + (state.blind ? "" : " · " + esc(routeName(d.route))) + "</span></span><span class=\"small\">" + fmt(p.line) + "</span></a></li>";
    });
    return h + "</ol></section>";
  }

  function filters(seedId) {
    var h = '<section class="filters" aria-label="Filter and sort">';
    h += '<label><span class="label">Seed</span><select id="f-seed"><option value="">All seeds</option>' + SEEDS.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === seedId ? " selected" : "") + ">" + esc(s.name || s.id) + "</option>"; }).join("") + "</select></label>";
    if (!state.blind) {
      var used = {}; DESIGNS.forEach(function (d) { used[d.route] = 1; });
      var routes = RUN.routes.filter(function (r) { return used[r.id]; });
      Object.keys(used).forEach(function (id) { if (!routes.some(function (r) { return r.id === id; })) routes.push({ id: id, name: id }); });
      h += '<label><span class="label">Method</span><select id="f-method"><option value="">All methods</option>' + routes.map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === state.method ? " selected" : "") + ">" + esc(r.name || r.id) + "</option>"; }).join("") + "</select></label>";
    }
    h += '<label><span class="label">Where it stands</span><select id="f-status"><option value="">Any</option>' + GROUPS.map(function (g) { return '<option value="' + g[0] + '"' + (g[0] === state.status ? " selected" : "") + ">" + g[1] + "</option>"; }).join("") + "</select></label>";
    h += '<label><span class="label">Order</span><select id="f-sort">' + [["seed", "By seed"], ["fun", "Most fun first"], ["distinct", "Most distinctive first"], ["both", "Best on both first"]].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === state.sort ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></label>";
    return h + "</section>";
  }

  function rowHtml(d) {
    var v1 = ver(d, 1), p = pickFor(d);
    var h = '<a class="row" href="#design-' + esc(d.key) + '">';
    h += '<span class="row-name">' + esc(tribeName(d)) + "</span>";
    h += '<span class="meta"><span>' + esc(seedName(d.seed)) + "</span>" + (state.blind ? "" : '<span class="dot">' + esc(routeName(d.route)) + "</span>") + '<span class="dot">' + pill(d) + "</span>" + (p ? '<span class="pill t-accent">pick ' + esc(p.rank) + (p.version ? ", v" + esc(p.version) : "") + "</span>" : "") + "</span>";
    var last = d.versions.length > 1 ? d.versions[d.versions.length - 1] : null;
    if ((v1 && v1.summary) || (last && last.summary)) {

        (last && last.summary ? '<span class="row-latest"><b>v' + esc(last.v) + ":</b> " + fmt(last.summary) + "</span>" : "") + "</span>";
    }
    h += ratingGrid(d, false);
    return h + "</a>";
  }

  function routeOrder(d) { var s = seedById[d.seed]; var i = s && s.routes ? s.routes.indexOf(d.route) : -1; return i < 0 ? 99 : i; }
  function seedOrder(id) { var i = SEEDS.findIndex(function (s) { return s.id === id; }); return i < 0 ? 999 : i; }

  function listDesigns(seedId) {
    var ds = DESIGNS.filter(function (d) {
      return (!seedId || d.seed === seedId) && (state.blind || !state.method || d.route === state.method) && (!state.status || st(d).group === state.status);
    });
    var rk = seedId && RANK.seeds[seedId] && RANK.seeds[seedId].order;
    ds.sort(function (a, b) {
      if (state.sort !== "seed") {
        var x = score(a, state.sort), y = score(b, state.sort);
        if (x == null && y != null) return 1; if (y == null && x != null) return -1;
        if (x != null && y != null && x !== y) return y - x;
      }
      if (rk) { var i = rk.indexOf(a.id), j = rk.indexOf(b.id); if (i !== j) return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); }
      return seedOrder(a.seed) - seedOrder(b.seed) || routeOrder(a) - routeOrder(b) || a.id.localeCompare(b.id);
    });
    return ds;
  }

  function rowsBlock(seedId) {
    var ds = listDesigns(seedId);
    var h = '<p class="count small muted" aria-live="polite">' + (ds.length === 1 ? "One design" : ds.length + " designs") + (state.status || (!state.blind && state.method) ? " match" : "") + ".</p>";
    if (!ds.length) return h + '<div class="empty">' + (DESIGNS.length ? "No designs match these filters." : "No designs yet.") + "</div>";
    if (state.sort === "seed" && !seedId) {
      var groups = [];
      ds.forEach(function (d) { var g = groups[groups.length - 1]; if (!g || g.seed !== d.seed) groups.push(g = { seed: d.seed, items: [] }); g.items.push(d); });
      return h + groups.map(function (g) {
        var s = seedById[g.seed] || {};

      }).join("");
    }
    return h + '<div class="rows">' + ds.map(rowHtml).join("") + "</div>";
  }

  function viewHome() {
    return intro() + picksBlock() + '<section class="group">' + filters("") + "</section>" + '<div class="group" id="list">' + rowsBlock("") + "</div>" + foot();
  }

  function viewSeed(id) {
    var s = seedById[id] || { id: id, name: id };
    var rk = RANK.seeds[id];
    var h = '<nav class="back"><a href="#">← All designs</a></nav>';
    h += '<section class="dhead"><span class="label">Seed</span><h1>' + esc(s.name || id) + "</h1>" + (s.pitch ? "<p>" + fmt(s.pitch) + "</p>" : "") +
      (s.folio_ref ? '<p class="small muted">From the Woodland Folio: ' + esc(s.folio_ref) + "</p>" : s.source === "new" ? '<p class="small muted">A new idea, not from the folio.</p>' : "") + "</section>";
    if (rk && rk.order && rk.order.length) {

      h += '<section class="block"><h2>How its designs compare</h2><ol class="pts">';
      rk.order.forEach(function (did, i) {
        var d = byId[did];
        h += '<li class="pt"><span><b class="num">' + (i + 1) + ".</b> " + (d ? '<a href="#design-' + esc(d.key) + '"><b>' + esc(tribeName(d)) + "</b></a>" : esc(did)) + "</span>" + (why[did] ? '<span class="small">' + fmt(why[did]) + "</span>" : "") + "</li>";
      });
      h += "</ol>";
      if ((rk.iteration_helped || []).length) {
        h += '<h3>Did revising help?</h3><ul class="pts">' + rk.iteration_helped.map(function (x) { var d = byId[x.design]; return '<li class="pt small"><span><b>' + esc(d ? tribeName(d) : x.design) + ":</b> " + fmt(x.line) + "</span></li>"; }).join("") + "</ul>";
      }
      h += "</section>";
    } else {
      h += '<p class="muted">Once all of this seed’s designs have stopped, they’ll be compared here.</p>';
    }
    return h + '<section class="group">' + filters(id) + '</section><div class="group" id="list">' + rowsBlock(id) + "</div>" + foot();
  }

  function foot() { return '<p class="foot">' + (DATA.built ? "Last updated " + esc(DATA.built) + "." : "") + "</p>"; }

  // ---------- design view ----------
  function markers(d, v) {
    var m = {}, x = ver(d, v);
    function add(uid, k, item) { if (!uid) return; (m[uid] = m[uid] || { standout: [], weakest: [], broken: [], watch: [], unclear: [] })[k].push(item); }
    ((x && x.reviews) || []).forEach(function (r) {
      (r.standouts || []).forEach(function (s) { add(s.uid, "standout", { who: r.member, note: s.why }); });
      (r.weakest || []).forEach(function (s) { add(s.uid, "weakest", { who: r.member, note: s.why }); });
      (r.flags || []).forEach(function (f) { if (m && ["broken", "watch", "unclear"].indexOf(f.kind) >= 0) add(f.uid, f.kind, { who: r.member, note: f.note }); });
    });
    return m;
  }
  var MARK = { standout: ["standout", "t-good"], weakest: ["weakest", "t-warn"], broken: ["broken", "t-bad"], watch: ["watch", "t-gold"], unclear: ["unclear", "t-info"] };
  function chipsFor(mk) {
    if (!mk) return "";
    return Object.keys(MARK).filter(function (k) { return mk[k].length; }).map(function (k) { return '<span class="pill ' + MARK[k][1] + '">' + MARK[k][0] + (mk[k].length > 1 ? " ×" + mk[k].length : "") + "</span>"; }).join("");
  }
  var FIELDS = ["name", "tier", "attack", "health", "text", "golden"];
  function differs(a, b) { if (!a || !b) return true; return FIELDS.some(function (f) { return (a[f] == null ? "" : String(a[f])) !== (b[f] == null ? "" : String(b[f])); }); }

  function cardHtml(d, v, c, mk, tag) {
    var isUnit = c.attack != null || c.health != null;
    var h = '<button type="button" class="card" data-uid="' + esc(c.uid) + '" aria-label="' + esc(plain(c.name) + ": see how this card changed") + '">';
    h += '<span class="card-top"><span class="card-name">' + fmt(c.name || "Unnamed") + "</span>" + (isUnit ? '<span class="stats" title="Attack / Health">' + esc(c.attack) + "/" + esc(c.health) + "</span>" : c.kind ? '<span class="pill">' + esc(c.kind) + "</span>" : "") + "</span>";

  }

  function shapeLine(data) {
    var counts = {}; (data.units || []).forEach(function (u) { var t = String(u.tier); counts[t] = (counts[t] || 0) + 1; });
    var tiers = Object.keys(counts).concat(Object.keys(RUN.shape)).filter(function (t, i, a) { return a.indexOf(t) === i; }).sort(function (a, b) { return a - b; });
    var same = tiers.every(function (t) { return (counts[t] || 0) === (RUN.shape[t] || 0); });
    var total = (data.units || []).length;
    var line = tiers.map(function (t) { return (counts[t] || 0); }).join(" · ");
    if (same || !Object.keys(RUN.shape).length) return '<p class="shape">' + total + " units, by tier from 1 to " + (tiers[tiers.length - 1] || 6) + ": <span class=\"num\">" + line + "</span>" + (Object.keys(RUN.shape).length ? ", as planned." : ".") + "</p>";
    var plan = tiers.map(function (t) { return RUN.shape[t] || 0; }).join(" · ");
    var diffs = tiers.filter(function (t) { return (counts[t] || 0) !== (RUN.shape[t] || 0); }).map(function (t) { return "Tier " + t + " has " + (counts[t] || 0) + " instead of " + (RUN.shape[t] || 0); });
    return '<p class="shape off"><b>A different shape from the plan.</b> ' + total + ' units, by tier: <span class="num">' + line + '</span> (the plan was <span class="num">' + plan + "</span>). " + esc(listJoin(diffs)) + ".</p>";
  }

  function pointRef(d, ref) {
    // "v1--combo#p2" -> {review, point}
    var m = /^v(\d+)--(.+?)#(.+)$/.exec(ref || ""); if (!m) return null;
    var x = ver(d, +m[1]); if (!x) return null;
    var r = (x.reviews || []).find(function (r) { return r.member === m[2] || r.id === "v" + m[1] + "--" + m[2]; });
    var p = r && (r.points || []).find(function (p) { return p.pid === m[3]; });
    return { v: +m[1], member: m[2], review: r || null, point: p || null };
  }
  function sourceLine(d, from) {
    var out = (from || []).map(function (f) {
      if (f === "own") return "the reviser's own idea";
      var pr = pointRef(d, f); if (!pr) return esc(f);
      var who = esc(lc(member(pr.member).name));
      if (!pr.point) return who + " in v" + pr.v;
      return who + " in v" + pr.v + ' (' + (pr.point.kind === "fix" ? "needs fixing" : "idea") + "): “" + fmt(pr.point.text) + "”";
    });
    return out.length ? '<span class="src">Asked for by ' + out.join("; and ") + "</span>" : "";
  }
  function cardLabel(data, prev, uid) {
    if (uid === "identity") return "The tribe as a whole";
    if (uid == null) return "The tribe as a whole";
    var c = cardIn(data, uid) || cardIn(prev, uid); return c ? plain(c.name) : "A card";
  }

  function changesBlock(d, v) {

    if (!ch.length) h += '<p class="small muted">No changes listed.</p>';
    else h += "<ul>" + ch.map(function (c) {
      var kind = c.uid === "identity" ? "" : c.kind ? ' <span class="pill">' + esc(c.kind) + "</span>" : "";
      var open = (c.uid && c.uid !== "identity") ? ' <button type="button" class="linkish small" data-uid="' + esc(c.uid) + '">its story</button>' : "";
      return "<li><span><b>" + esc(cardLabel(data, prev, c.uid)) + "</b>" + kind + open + "</span><span>" + fmt(c.what) + "</span>" + (c.why ? '<span class="small"><span class="muted">Why:</span> ' + fmt(c.why) + "</span>" : "") + sourceLine(d, c.from) + "</li>";
    }).join("") + "</ul>";
    if (dec.length) {
      h += '<h3>Suggestions it kept as they were</h3><ul>' + dec.map(function (x) {
        var pr = pointRef(d, x.point);
        var what = pr && pr.point ? esc(member(pr.member).name) + ": “" + fmt(pr.point.text) + "”" : esc(x.point);
        return '<li><span class="small">' + what + "</span><span><span class=\"muted\">Why it stayed:</span> " + fmt(x.why) + "</span></li>";
      }).join("") + "</ul>";

  }

  function identityBlock(data) {

    if (idn.plays) h += "<p>" + fmt(idn.plays) + "</p>";
    return h + "</section>";
  }

  function listBlock(title, items, fn) {
    if (!items || !items.length) return "";
    return '<section class="block"><h3>' + title + "</h3><ul>" + items.map(fn).join("") + "</ul></section>";
  }

  function versionHtml(d, v, opts) {
    var x = ver(d, v), data = vdata(d, v);

  // ---------- light markdown ----------
  function inline(s) {

  // ---------- card story ----------
  function wordDiff(a, b) {

    if (A.length * B.length > 250000) return "<del>" + esc(plain(a)) + "</del> <ins>" + esc(plain(b)) + "</ins>";

    i = 0; j = 0;

    return out.join("");
  }

  function diffRows(a, b) {

  // ---------- routing ----------
  var app = document.getElementById("app"), current = null;
  function parse() {

    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.mode && current && current.view === "design") {
      var mode = b.dataset.mode, h = "#design-" + current.key + (mode === "compare" ? "" : "-v" + mode);
      try { history.replaceState(null, "", h); } catch (err) { location.hash = h; return; }
      render(true); return;
    }
    if (b.dataset.side) {
      state.side = b.dataset.side;
      var cmp = app.querySelector(".compare.two"); if (cmp) cmp.dataset.side = state.side;
      app.querySelectorAll(".side-switch button").forEach(function (x) { x.setAttribute("aria-pressed", String(x.dataset.side === state.side)); });
      return;
    }
    if (b.dataset.uid && current && current.view === "design") { var d = byKey[current.key]; if (d) openStory(d, b.dataset.uid); }
  });

  var blind = document.getElementById("blind");
  blind.checked = state.blind;
  blind.addEventListener("change", function () {
    state.blind = blind.checked; if (state.blind) state.method = "";
    try { localStorage.setItem("tribe-run-blind", state.blind ? "1" : "0"); } catch (e) {}
    render(true);
  });
  render(false);
})();
</script>
