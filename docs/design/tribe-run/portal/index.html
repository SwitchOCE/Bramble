s a pumped unit at full value, which is how you move a big buff from a dying carry onto every Fruit unit. Its payoff is Ludwig plus Mourner of Three Rains, which keeps half the pile so a burial pays out for several turns."},{"name":"The Burst (puffballs dying in the fight)","text":"Puffling, Raincatcher, Amanita, Grandsire, Inkcap, Old Fingers, Puffwell. You want as many deaths per fight as possible: Raincatcher splits into Spores as it's hit, Amanita kills her neighbours at Start of Combat so their death text fires before a blow is struck, Old Fingers digs everything up once more, and Inkcap writes each death into the Register twice. Any one Fruit carry turns all that into permanent stats. Puffwell is the in-fight cash-out: give him Damage Reduction or put him in the back row so he dies late, when the pile is biggest."},{"name":"The Network (Fruit everywhere)","text":"Apprentice, Sealbearer, Rootbinder, Bootlace. Fewer deaths, more mouths: Bootlace turns a full touching run into seven Fruit units. The tension is that the Wake's burials leave gaps that cut the run, so you bury from the ends of the zigzag (F1, F4) or refill the gap before Start of Turn."},{"name":"The Lodger (the Guild as another tribe's undertaker)","text":"Rootbinder and Sealbearer give Fruit to a carry from another tribe, and Stinkhorn fills the Compost from enemy deaths, so a board that wins fights still feeds. With other tribes:\n- **Oozes:** an Ooze Eating your own unit is a friendly death, so it goes into the Compost. Put an Ooze with a full Belly beside Amanita and it opens at Start of Combat. A buried Ooze opens in the shop.\n- **Hedgerow:** Fruit on your rightmost unit stacks with Pass, so one unit takes both streams.\n- **Fairies:** a Fruit unit on a Ring grows from both sources. Note that Shy units leave, which is not death.\n- **Bog:** a Mired Raincatcher is forced to take hits, so it makes its three Spores reliably.\n- **Hunters:** Pack units die beside their leader, which feeds Moss-Bier's permanent buffs.\n- **Birds:** a Bird sold to Fly South doesn't count; a Bird Laid to Rest never comes home. Nest Eggs compost as 0/1."},{"name":"Off-label plays Johnny will look for:","text":"- Seal Fruit onto Inkcap: his Health grows every turn, so he records more deaths each fight.\n- Seal Fruit onto Grandsire: his death Spores get bigger.\n- Bury a pumped Grandsire in the shop to fill your board with permanent quarter-size Spores.\n- Renderer a big unit, then have Amanita kill Puffwell at Start of Combat: the whole board feasts on that burial for the fight.\n- Amanita beside Old Fingers' targets: they die at Start of Combat, come back at printed stats, and their death text fires twice."}],"risks":["**Losing feeds you.** More deaths means more Compost, so a weak board snowballs into a stronger one. That is a comeback lever, and Stinkhorn rewards winning too, but the tribe may have little reason to win early fights. Watch whether early hero damage kills Guild players before the pile matters.","**Fruit stacking.** Two Sealbearers and a Bootlace on one unit give Fruit ×4 on a single carry. That's intended as a high roll, but it may need a cap (\"at most three Fruit\") if it dominates.","**Golden Mourner.** Keeping the whole pile makes it grow every turn, and every Fruit unit gains a quarter of a growing pile each turn, so growth is quadratic. It isn't self-feeding (printed stats only), but it's the likeliest runaway. The fallback is \"keeps three quarters\".","**Visibility.** The Compost pile, its sources, what's printed versus buffed, and the per-death doubling from Inkcap all need clear UI or the tribe reads as noise.","**Old Fingers with death chains.** Copies re-fire death text, so Spores from Puffling and Grandsire summon again. Six times a fight limits it, but a golden copy that keeps all its stats is very large.","**Rootbinder is dead text on a Guild-only board.** That is intended, to pull the Guild into mixed boards, but it may feel bad in a lobby where the other tribes are weak.","**Hired Mute triggers too easily** once Spores are around. Raise the threshold to 4 if it's a free gold.","**Start of Combat order.** Amanita resolves in reading order, so neighbours with their own Start of Combat may or may not have fired. Players need to see that.","**Undecided rule:** back-row access isn't settled, and Puffwell's \"die late\" plan leans on the back row being safe."],"tier_check":[{"tier":1,"note":"Puffling is a normal two-body tempo unit (5 stats). The Apprentice gives about 3 a turn early, which is near the guide, but about 7 by mid-game, nearly 2 bodies against a 0.4 target. **Broken on purpose:** it's the seed the whole tribe grows from, its 1/3 body is small, and it's worthless without deaths. If it dominates, it fruits only while you have another Rot Guild unit."},{"tier":2,"note":"Moss-Bier gives 4–6 permanent stats a turn (about 1 body, inside 0.3–1). Undertaker turns a sell into a burial at the same 1 gold. Mute gives 1 gold a turn on a condition, which is in line with economy pieces."},{"tier":3,"note":"Sealbearer adds about 7 a turn for the rest of the game (about 1 body against 0.8). Raincatcher makes about 6 in-fight stats plus Compost (inside 0.7–1.4). Sexton gives 4–8 a turn. Amanita is negative on her own and pays only through death text; that's her job as the enabler that names the comp."},{"tier":4,"note":"Rootbinder gives about 14 a turn and Stinkhorn about 15 with three Fruit units (both 1.6–1.8 bodies against 1.3). Inkcap doubles fight Compost, about 18 a turn across three Fruit units. That's above target, as a T4 multiplier is allowed to be. Renderer is a one-off redistribution, not new stats."},{"tier":5,"note":"Ludwig gives 20–30 a turn (about 2 bodies). Mourner roughly doubles every Fruit, which makes it the tier's multiplier. Grandsire is weak at printed size (1/2 Spores) but gives 30–70 in-fight once buffed, around the 4-body target; it is meant to be fed."},{"tier":6,"note":"Bootlace with a full run gives seven Fruit, about 105 a turn (7.5 bodies, under the top ~10). With Inkcap, Stinkhorn and Mourner assembled it reaches about twice the top. **Broken on purpose:** it's the capstone the comp is built for, and its golden ceiling is ×2. Old Fingers gives about 60 in-fight plus re-fired death text (about 5–6 bodies). Puffwell gives 40–120 in-fight depending on when he dies."}],"rationale":["Took \"death as harvest\" as the core: deaths become a shared pile of stats, because the seed's play line is \"lose your own on purpose\".","The pile counts **printed** stats only, so growth never feeds its own source: the runaway check passes by construction.","\"Growth overnight\": the pile pays out at Start of Turn and then empties, so every burial is a delayed reward.","\"The quiet network\": the pile belongs to the board, not a unit, and Fruit lets any unit drink from it, which gives Johnny cross-tribe hooks for free.","\"The undertaker caused the death\": Lay to Rest is the shop-side sacrifice, and Amanita is the fight-side one.","\"Mourning and mirth\": toadstools work in the shop (burial, registers, seals) and puffballs work in the fight (bursting into Spores), two halves that feed one pile.","Spores compost as 1/1 whatever their size, so Grandsire's big Spores can't loop.","The seed's notable figures took the high tiers by their stories: Inkcap writes deaths twice, Bootlace is the network, Old Fingers digs up, Puffwell is the feast, Ludwig the lodger eats the dead wood.","The \"one rain or three\" dispute became Mourner of Three Rains, the T5 multiplier that keeps the pile.","\"Giving back what the wood gave\": Rootbinder (mycorrhiza) gives Fruit to other tribes, so the Guild has a reason to be splashed into any lobby.","Stinkhorn composts enemy deaths, so the tribe isn't only rewarded for losing (the Spike guard).","Bootlace's run plus gaps from burials: put a spatial cost on the strongest payoff, so Johnny's boards need arranging, not just collecting."],"changes":[],"declined":[]},"reviews":[{"id":"v1--combo","design_id":"rot-guild--top-down-flavour","v":1,"member":"combo","ratings":{"fun":7,"distinct":6},"ratings_why":{"fun":"One shared pile with three levers (more deaths, bigger entries, more Fruit) gives real cross-links: Renderer moving a carry's buffs, Amanita feeding Old Fingers, Bootlace's run fighting your own burials.","distinct":"The overnight pile that empties each turn and Fruit on any tribe are fresh, but the core is a familiar sacrifice-and-deathrattle tribe."},"verdict":"iterate","verdict_why":"Ludwig's wording needs one fix and a few cards do one obvious job; the engine itself is sound and shouldn't be cut back.","points":[{"pid":"p1","uid":"u16","kind":"fix","text":"Ludwig 'gains its stats' doesn't say printed or full, and the tribe distinguishes the two everywhere else. It decides how big the White-Rot Renderer plus Ludwig combo is; say which."},{"pid":"p2","uid":"u05","kind":"idea","text":"Hired Mute is plain gold on a threshold Spores reach for free. Give it a hook into the pile, like gold for each burial that turn, so it becomes a Wake decision instead of filler."},{"pid":"p3","uid":"u06","kind":"idea","text":"Golden Warden Amanita only raises Bristle. Letting the golden destroy every unit next to her (diagonals too) would make her a real chase card for the Burst build."},{"pid":"p4","uid":"u11","kind":"idea","text":"Rootbinder is blank on a Guild-only board. Letting it also give Fruit to Spores beside it would keep the splash role and add an odd Spore-carry line."},{"pid":"p5","uid":"u04","kind":"idea","text":"Moss-Bier Bearer counts only fight deaths; letting burials count too would tie it to Sexton and make placement around the burial slot a real puzzle."}],"standouts":[{"uid":"u12","why":"Turns a dying carry's buffs into a feast for every Fruit unit: the off-label redistribution Johnny lives for."},{"uid":"u06","why":"Kills her neighbours before a blow lands, so death text, Old Fingers, Inkcap and Moss-Bier all fire from one placement."},{"uid":"u17","why":"The best payoff needs an unbroken run while your own burials keep cutting it, which makes every burial a board-shape choice."}],"weakest":[{"uid":"u05","why":"Plain conditional gold that Spores satisfy without trying."},{"uid":"u04","why":"A small +1/+1 per neighbouring death; does one job and doesn't touch the pile."},{"uid":"u11","why":"Dead text unless you're mixed with another tribe."}],"flags":[{"uid":"u15","kind":"watch","note":"Golden Mourner of Three Rains keeps the whole pile, so every Fruit unit drinks a growing pile each turn."},{"uid":"u16","kind":"watch","note":"Ludwig plus White-Rot Renderer: one burial of a pumped carry goes onto Ludwig whole and into the pile at full value, which Ludwig's own Fruit then drinks too."},{"uid":"u17","kind":"watch","note":"Bootlace plus two Sealbearers stacks four Fruit on one carry; with Mourner and Inkcap this is the likeliest runaway."},{"uid":"u16","kind":"unclear","note":"'Gains its stats' doesn't say printed or full."}]},{"id":"v1--climber","design_id":"rot-guild--top-down-flavour","v":1,"member":"climber","ratings":{"fun":7,"distinct":6},"ratings_why":{"fun":"A good growth shape: cheap early losses while hero damage is 0, then the pile and the Fruit count both scale, and you choose each turn whether to bury, add Fruit or add deaths.","distinct":"The shared overnight pile and Bootlace's run being cut by your own burials feel fresh, but the death-feeds-stats core is close to Battlegrounds Undead and Hearthstone corpses."},"verdict":"settle","verdict_why":"Nothing is broken as written; the hot spots are high rolls for the owner to dial, and another pass would mostly reshuffle the same three levers.","points":[{"pid":"p1","uid":null,"kind":"idea","text":"Turns 4 to 7 look thin: hero damage starts, but the only Fruit before Tier 3 is the Apprentice. A Tier 2 Fruit unit or a cheaper Sealbearer would carry the climb into the midgame."},{"pid":"p2","uid":"u12","kind":"idea","text":"White-Rot Renderer is where Fruit growth flows back into the pile: bury a pumped unit and every Fruit unit drinks a quarter of it. Keep it hot, but give the owner a lever, such as 'Once a turn' across all your Renderers."},{"pid":"p3","uid":"u11","kind":"idea","text":"Rootbinder does nothing on a mono-Guild board. 'Units beside this have Fruit; units of other tribes have it twice' keeps the splash pull and stops it being a dead buy."},{"pid":"p4","uid":"u05","kind":"idea","text":"Spores make Hired Mute free gold every turn from mid-game on. Scaling it (1 gold per 4 deaths, up to 3) would make it a real choice between economy and a board slot."},{"pid":"p5","uid":null,"kind":"idea","text":"Show 'tomorrow's Fruit' (a quarter of the pile) next to the Compost tracker in the shop, so the bury-or-keep choice is something you can read."}],"standouts":[{"uid":"u17","why":"Grandmother Bootlace is a real capstone, and her touching run clashes with your own burials, so placement becomes the skill test."},{"uid":"u10","why":"Clerk Inkcap is a clean Tier 4 multiplier with a cost built in: he doubles each fight death and shrinks while he does it."},{"uid":"u06","why":"Warden Amanita names the comp: she trades board for death triggers before a blow is struck."}],"weakest":[{"uid":"u11","why":"Rootbinder is dead text unless you are splashing another tribe."},{"uid":"u04","why":"Moss-Bier Bearer is a generic buff from a neighbour's death, with no hook into Compost or Fruit."},{"uid":"u14","why":"Stumpwick Grandsire makes 1/2 Spores at printed size, a poor Tier 5 unless you have fed it already."}],"flags":[{"uid":"u15","kind":"watch","note":"Golden Mourner keeps the whole pile, so it grows every turn and each Fruit unit drinks a quarter of it: quadratic growth, the likeliest runaway."},{"uid":"u12","kind":"watch","note":"Renderer burying a Fruit-pumped unit at full stats sends Fruit growth back into the pile; with golden Renderer, Bootlace and Mourner it compounds turn on turn."},{"uid":"u17","kind":"watch","note":"Bootlace plus two Sealbearers puts four Fruits on one carry, a big high roll worth the owner's eye."},{"uid":"u18","kind":"watch","note":"Golden Old Fingers' copies keep all their stats and re-fire Puffling and Grandsire death text, which is very large even at six times a fight."},{"uid":"u05","kind":"watch","note":"Three deaths a turn is easy with Spores, so Hired Mute is near-free gold."}]},{"id":"v1--reader","design_id":"rot-guild--top-down-flavour","v":1,"member":"reader","ratings":{"fun":7,"distinct":6},"ratings_why":{"fun":"One pile, one keyword and a clear overnight payout give three readable builds, and watching burials turn into stats next turn is a satisfying grow loop.","distinct":"The shared pile that empties each turn and Fruit as a carry count are fresh, but the core is a familiar sacrifice-and-deathrattle tribe."},"verdict":"settle","verdict_why":"The cards read cleanly and the funeral-as-harvest fantasy is in the rules; the open items are wording tweaks and UI, not redesign.","points":[{"pid":"p1","uid":null,"kind":"idea","text":"Show the Compost tracker as the number each Fruit unit will gain tonight (a quarter), not only the raw pile, so a player sees the payout at a glance."},{"pid":"p2","uid":null,"kind":"idea","text":"Printed versus current stats is the tribe's one hard read: when a unit dies, show what it adds to the pile, and badge Spores as always 1/1."},{"pid":"p3","uid":"u05","kind":"idea","text":"Hired Mute's 'since your last turn' should say plainly that shop burials and fight deaths both count."},{"pid":"p4","uid":"u19","kind":"idea","text":"Bellows Puffwell could name which pile he shares, e.g. 'your Compost as it stands now', since the pile grows during the fight."},{"pid":"p5","uid":"u10","kind":"idea","text":"Clerk Inkcap shrinking with each entry is a lovely read; adding 'for this fight' to the Health loss saves a trip to the rule notes."}],"standouts":[{"uid":"u10","why":"Clerk Inkcap writes each death twice and grows shorter doing it: the seed's story is the card's rules."},{"uid":"u17","why":"Grandmother Bootlace is the network made literal, and burials cutting her run is a cost a player sees on the board."},{"uid":"u15","why":"Mourner of Three Rains turns the 'one rain or three' quarrel into a one-line rule anyone can read."}],"weakest":[{"uid":"u04","why":"Moss-Bier Bearer is a generic 'neighbour dies, gain stats' unit with little Guild flavour of its own."},{"uid":"u11","why":"Rootbinder is blank text on a Guild-only board, so it reads as dead in most shops."},{"uid":"u05","why":"Hired Mute is a plain gold counter; the silent-mute fantasy doesn't show in what it does."}],"flags":[{"uid":"u15","kind":"watch","note":"Golden Mourner keeps the whole pile, so it grows every turn while every Fruit unit drinks from it."},{"uid":"u07","kind":"watch","note":"Stacked Fruit from Sealbearers and Bootlace on one carry has no cap."},{"uid":"u06","kind":"watch","note":"Amanita's Start of Combat order versus her neighbours' own Start of Combat needs to be visible to read."}]}],"ratings":{"fun":7.0,"distinct":6.0},"votes":{"settle":2,"iterate":1}}]},{"id":"salamander-forge--bottom-up-mech","key":"salamander-forge-7af6","seed":"salamander-forge","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"salamander-forge--player-story","key":"salamander-forge-9c1c","seed":"salamander-forge","route":"player-story","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"salamander-forge--top-down-flavour","key":"salamander-forge-2f19","seed":"salamander-forge","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"will-o-wisps--bottom-up-flavour","key":"will-o-wisps-db83","seed":"will-o-wisps","route":"bottom-up-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"will-o-wisps--bottom-up-mech","key":"will-o-wisps-fbd1","seed":"will-o-wisps","route":"bottom-up-mech","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]},{"id":"will-o-wisps--top-down-flavour","key":"will-o-wisps-c9c1","seed":"will-o-wisps","route":"top-down-flavour","tribe_name":null,"status":"designing","final_version":null,"stop_reason":null,"md":null,"versions":[]}],"rankings":{"seeds":{},"overall":null},"problems":[]}</script>
<script>
(function () {
  "use strict";
  var DATA;
  try { DATA = JSON.parse(document.getElementById("run-data").textContent); } catch (e) { DATA = null; }
  if (!DATA || typeof DATA !== "object") DATA = {};
  var RUN = DATA.run || {};
  RUN.routes = RUN.routes || []; RUN.committee = RUN.committee || []; RUN.shape = RUN.shape || {};
  var CRIT = (RUN.criteria && RUN.criteria.length) ? RUN.criteria : [{ id: "fun", name: "Fun to draft and grow" }, { id: "distinct", name: "Distinctive" }];
  var SEEDS = DATA.seeds || [];
  var DESIGNS = (DATA.designs || []).filter(function (d) { return d && d.id; });
  var RANK = DATA.rankings || {}; RANK.seeds = RANK.seeds || {};
  var PICKS = ((RANK.overall && RANK.overall.picks) || []).slice().sort(function (a, b) { return (a.rank || 99) - (b.rank || 99); });
  var byId = {}, byKey = {}, seedById = {};
  DESIGNS.forEach(function (d) { d.versions = d.versions || []; byId[d.id] = d; byKey[d.key] = d; });
  SEEDS.forEach(function (s) { seedById[s.id] = s; });

  var state = { blind: false, method: "", status: "", sort: "seed", side: "b" };
  try { state.blind = localStorage.getItem("tribe-run-blind") === "1"; } catch (e) {}

  // ---------- small helpers ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>"); }
  function plain(s) { return String(s == null ? "" : s).replace(/\*\*/g, ""); }
  function cap(s) { s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }
  function lc(s) { s = String(s || ""); return s.charAt(0).toLowerCase() + s.slice(1); }
  function r1(x) { return (typeof x === "number" && isFinite(x)) ? x.toFixed(1) : null; }
  function routeName(id) { var r = RUN.routes.find(function (x) { return x.id === id; }); return (r && r.name) || id || "Unknown method"; }
  function member(id) { return RUN.committee.find(function (m) { return m.id === id; }) || { id: id, name: cap(id || "A reviewer") }; }
  function seedName(id) { var s = seedById[id]; return (s && s.name) || id; }
  function tribeName(d) { return d.tribe_name || "Not named yet"; }
  function words(n) { return ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"][n] || String(n); }
  function times(n) { return n === 1 ? "once" : n === 2 ? "twice" : words(n) + " times"; }
  function listJoin(a) { return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }
  function ver(d, v) { return d.versions.find(function (x) { return x.v === v; }) || null; }
  function vdata(d, v) { var x = ver(d, v); return x && x.data && typeof x.data === "object" ? x.data : null; }
  function allCards(data) { return data ? (data.units || []).concat(data.extras || []) : []; }
  function cardIn(data, uid) { return allCards(data).find(function (c) { return c && c.uid === uid; }) || null; }
  function lastV(d) { return d.versions.length ? d.versions[d.versions.length - 1].v : null; }
  function finalV(d) { return d.final_version || lastV(d); }
  function ratedV(d) {
    if ((d.status === "settled" || d.status === "capped") && d.final_version) return d.final_version;
    for (var i = d.versions.length - 1; i >= 0; i--) if ((d.versions[i].reviews || []).length) return d.versions[i].v;
    return null;
  }
  function score(d, crit) {
    var v = ver(d, ratedV(d)); if (!v || !v.ratings) return null;
    if (crit === "both") {
      var xs = CRIT.map(function (c) { return v.ratings[c.id]; }).filter(function (x) { return typeof x === "number"; });
      return xs.length ? xs.reduce(function (a, b) { return a + b; }, 0) / xs.length : null;
    }
    return typeof v.ratings[crit] === "number" ? v.ratings[crit] : null;
  }
  function pickFor(d) { return PICKS.find(function (p) { return p.design === d.id; }) || null; }

  var STATUS = {
    settled: { group: "settled", tone: "t-good", label: function (d) { return "settled at v" + finalV(d); } },
    capped: { group: "capped", tone: "t-gold", label: function (d) { return "capped at v" + finalV(d); } },
    revising: { group: "revising", tone: "t-warn", label: function () { return "being revised"; } },
    reviewing: { group: "reviewing", tone: "t-info", label: function (d) { return lastV(d) > 1 ? "v" + lastV(d) + " being reviewed" : "being reviewed"; } },
    unreviewed: { group: "unreviewed", tone: "t-info", label: function (d) { return lastV(d) > 1 ? "v" + lastV(d) + " not reviewed yet" : "not reviewed yet"; } },
    written: { group: "unreviewed", tone: "t-info", label: function () { return "not reviewed yet"; } },
    designing: { group: "designing", tone: "", label: function () { return "being designed"; } },
    failed: { group: "failed", tone: "t-bad", label: function () { return "couldn't be finished"; } }
  };
  var GROUPS = [["settled", "Settled"], ["capped", "Capped at the limit"], ["revising", "Being revised"], ["reviewing", "Being reviewed"],
    ["unreviewed", "Not reviewed yet"], ["designing", "Being designed"], ["failed", "Couldn't be finished"]];
  function st(d) { return STATUS[d.status] || STATUS.designing; }
  function pill(d) { var s = st(d); return '<span class="pill ' + s.tone + '">' + esc(s.label(d)) + "</span>"; }
  function statusSentence(d) {
    var n = lastV(d), v = ver(d, n), got = v ? (v.reviews || []).length : 0, of = RUN.committee.length || 3;
    switch (d.status) {
      case "settled": return "Settled at v" + finalV(d) + ": " + lc(d.stop_reason || "the reviewers felt it was in a good spot") + ".";
      case "capped": return "Stopped at v" + finalV(d) + ", the most versions a design gets.";
      case "revising": return "The reviewers asked for another pass, so v" + (n + 1) + " is being written.";
      case "reviewing": return "v" + n + " is with the reviewers now; " + words(got) + " of " + words(of) + " have answered.";
      case "unreviewed": return "v" + n + " hasn't been reviewed yet.";
      case "written": return "The designer has finished the write-up below. The card-by-card view and reviews will follow.";
      case "failed": return "This design couldn't be finished." + (d.stop_reason ? " " + cap(d.stop_reason) + "." : "");
      default: return "The designer is still working on this one.";
    }
  }

  // ---------- rating grid ----------
  function ratingGrid(d, big) {
    var vs = d.versions.filter(function (v) { return v.ratings && CRIT.some(function (c) { return typeof v.ratings[c.id] === "number"; }); });
    if (!vs.length) return '<p class="small muted">' + (d.versions.length ? "No ratings yet." : "") + "</p>";
    var fin = (d.status === "settled" || d.status === "capped") ? d.final_version : null;
    var cols = "minmax(0, 1fr) " + vs.map(function () { return big ? "64px" : "52px"; }).join(" ");
    var h = '<div class="rgrid' + (big ? " big" : "") + '" style="grid-template-columns:' + cols + '" aria-label="Ratings out of 10 at each version">';
    h += '<span class="rh"></span>' + vs.map(function (v) { return '<span class="rh' + (v.v === fin ? " fin" : "") + '">v' + v.v + (v.v === fin ? " final" : "") + "</span>"; }).join("");
    CRIT.forEach(function (c) {
      h += '<span class="rl">' + esc(c.name || c.id) + "</span>";
      vs.forEach(function (v) {
        var x = v.ratings[c.id], s = r1(x);
        h += '<span class="cell' + (v.v === fin ? " fin" : "") + '">' + (s ? '<span class="num">' + s + '</span><span class="meter"><i style="width:' + Math.max(0, Math.min(100, x * 10)) + '%"></i></span>' : '<span class="num muted">–</span>') + "</span>";
      });
    });
    if (big) {
      h += '<span class="rl">Said it’s in a good spot</span>';
      vs.forEach(function (v) { var t = v.votes || {}; var n = (v.reviews || []).length; h += '<span class="cell' + (v.v === fin ? " fin" : "") + '"><span class="num">' + (t.settle || 0) + "/" + n + "</span></span>"; });
    }
    return h + "</div>";
  }

  // ---------- home and seed views ----------
  function intro() {
    var n = DESIGNS.length, s = SEEDS.length;
    var names = RUN.committee.map(function (m) { return lc(m.name); });
    var revs = Math.max(0, (RUN.max_versions || 3) - 1);
    var h = '<section class="intro"><h1>New tribes for Bramble</h1>';
    h += "<p>We're trying out new tribes for the game. Each starting idea, or seed, is designed three times over, by designers who each follow a different method. " +
      (names.length ? "Then " + words(names.length) + " reviewers rate every version and suggest changes: " + listJoin(names) + ". " : "") +
      "A design is revised at most " + times(revs) + ", and stops sooner once two of the reviewers feel it's in a good spot.</p>";
    h += "<p>Nothing gets removed. Low-rated and unfinished designs are all here, so you can see what the reviewers think is good and how each design changed along the way.</p>";
    if (n) {
      var counts = {};
      DESIGNS.forEach(function (d) { var g = st(d).group; counts[g] = (counts[g] || 0) + 1; });
      var bits = [];
      if (counts.settled) bits.push(counts.settled + " settled");
      if (counts.capped) bits.push(counts.capped + " capped at the limit");
      if (counts.revising) bits.push(counts.revising + " being revised");
      if (counts.reviewing) bits.push(counts.reviewing + " with the reviewers");
      if (counts.unreviewed) bits.push(counts.unreviewed + " not reviewed yet");
      if (counts.designing) bits.push(counts.designing + " still being designed");
      if (counts.failed) bits.push(counts.failed + " that couldn't be finished");
      h += "<p>So far there " + (n === 1 ? "is one design" : "are " + n + " designs") + " from " + (s === 1 ? "one seed" : s + " seeds") + ": " + listJoin(bits) + ". The numbers on each design are the reviewers' average out of 10, at each version.</p>";
    } else {
      h += "<p>No designs yet. They'll appear here as the designers finish them.</p>";
    }
    return h + "</section>";
  }

  function picksBlock() {
    if (!PICKS.length) return "";
    var h = '<section class="picks"><h2>The best of the run</h2><p class="muted">Picked after reading every design and each seed’s comparison. A pick names the version that was best, which can be the first.</p><ol>';
    PICKS.forEach(function (p) {
      var d = byId[p.design]; if (!d) return;
      h += '<li><a class="pick" href="#design-' + esc(d.key) + (p.version ? "-v" + p.version : "") + '"><span class="rank">' + esc(p.rank || "") + "</span><span><b>" + esc(tribeName(d)) + "</b>" + (p.version ? ' <span class="muted">v' + esc(p.version) + "</span>" : "") +
        '<span class="small muted"> · ' + esc(seedName(d.seed)) + (state.blind ? "" : " · " + esc(routeName(d.route))) + "</span></span><span class=\"small\">" + fmt(p.line) + "</span></a></li>";
    });
    return h + "</ol></section>";
  }

  function filters(seedId) {
    var h = '<section class="filters" aria-label="Filter and sort">';
    h += '<label><span class="label">Seed</span><select id="f-seed"><option value="">All seeds</option>' + SEEDS.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === seedId ? " selected" : "") + ">" + esc(s.name || s.id) + "</option>"; }).join("") + "</select></label>";
    if (!state.blind) {
      var used = {}; DESIGNS.forEach(function (d) { used[d.route] = 1; });
      var routes = RUN.routes.filter(function (r) { return used[r.id]; });
      Object.keys(used).forEach(function (id) { if (!routes.some(function (r) { return r.id === id; })) routes.push({ id: id, name: id }); });
      h += '<label><span class="label">Method</span><select id="f-method"><option value="">All methods</option>' + routes.map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === state.method ? " selected" : "") + ">" + esc(r.name || r.id) + "</option>"; }).join("") + "</select></label>";
    }
    h += '<label><span class="label">Where it stands</span><select id="f-status"><option value="">Any</option>' + GROUPS.map(function (g) { return '<option value="' + g[0] + '"' + (g[0] === state.status ? " selected" : "") + ">" + g[1] + "</option>"; }).join("") + "</select></label>";
    h += '<label><span class="label">Order</span><select id="f-sort">' + [["seed", "By seed"], ["fun", "Most fun first"], ["distinct", "Most distinctive first"], ["both", "Best on both first"]].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === state.sort ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></label>";
    return h + "</section>";
  }

  function rowHtml(d) {
    var v1 = ver(d, 1), p = pickFor(d);
    var h = '<a class="row" href="#design-' + esc(d.key) + '">';
    h += '<span class="row-name">' + esc(tribeName(d)) + "</span>";
    h += '<span class="meta"><span>' + esc(seedName(d.seed)) + "</span>" + (state.blind ? "" : '<span class="dot">' + esc(routeName(d.route)) + "</span>") + '<span class="dot">' + pill(d) + "</span>" + (p ? '<span class="pill t-accent">pick ' + esc(p.rank) + (p.version ? ", v" + esc(p.version) : "") + "</span>" : "") + "</span>";
    var last = d.versions.length > 1 ? d.versions[d.versions.length - 1] : null;
    if ((v1 && v1.summary) || (last && last.summary)) {
      h += '<span class="row-sum small">' + (v1 && v1.summary ? '<span class="muted">' + fmt(v1.summary) + "</span>" : "") +
        (last && last.summary ? '<span class="row-latest"><b>v' + esc(last.v) + ":</b> " + fmt(last.summary) + "</span>" : "") + "</span>";
    }
    h += ratingGrid(d, false);
    return h + "</a>";
  }

  function routeOrder(d) { var s = seedById[d.seed]; var i = s && s.routes ? s.routes.indexOf(d.route) : -1; return i < 0 ? 99 : i; }
  function seedOrder(id) { var i = SEEDS.findIndex(function (s) { return s.id === id; }); return i < 0 ? 999 : i; }

  function listDesigns(seedId) {
    var ds = DESIGNS.filter(function (d) {
      return (!seedId || d.seed === seedId) && (state.blind || !state.method || d.route === state.method) && (!state.status || st(d).group === state.status);
    });
    var rk = seedId && RANK.seeds[seedId] && RANK.seeds[seedId].order;
    ds.sort(function (a, b) {
      if (state.sort !== "seed") {
        var x = score(a, state.sort), y = score(b, state.sort);
        if (x == null && y != null) return 1; if (y == null && x != null) return -1;
        if (x != null && y != null && x !== y) return y - x;
      }
      if (rk) { var i = rk.indexOf(a.id), j = rk.indexOf(b.id); if (i !== j) return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); }
      return seedOrder(a.seed) - seedOrder(b.seed) || routeOrder(a) - routeOrder(b) || a.id.localeCompare(b.id);
    });
    return ds;
  }

  function rowsBlock(seedId) {
    var ds = listDesigns(seedId);
    var h = '<p class="count small muted" aria-live="polite">' + (ds.length === 1 ? "One design" : ds.length + " designs") + (state.status || (!state.blind && state.method) ? " match" : "") + ".</p>";
    if (!ds.length) return h + '<div class="empty">' + (DESIGNS.length ? "No designs match these filters." : "No designs yet.") + "</div>";
    if (state.sort === "seed" && !seedId) {
      var groups = [];
      ds.forEach(function (d) { var g = groups[groups.length - 1]; if (!g || g.seed !== d.seed) groups.push(g = { seed: d.seed, items: [] }); g.items.push(d); });
      return h + groups.map(function (g) {
        var s = seedById[g.seed] || {};
        return '<section class="group"><div class="group-head"><h2><a href="#seed-' + esc(g.seed) + '">' + esc(s.name || g.seed) + "</a></h2>" + (s.pitch ? '<span class="small muted">' + fmt(s.pitch) + "</span>" : "") + '</div><div class="rows">' + g.items.map(rowHtml).join("") + "</div></section>";
      }).join("");
    }
    return h + '<div class="rows">' + ds.map(rowHtml).join("") + "</div>";
  }

  function viewHome() {
    return intro() + picksBlock() + '<section class="group">' + filters("") + "</section>" + '<div class="group" id="list">' + rowsBlock("") + "</div>" + foot();
  }

  function viewSeed(id) {
    var s = seedById[id] || { id: id, name: id };
    var rk = RANK.seeds[id];
    var h = '<nav class="back"><a href="#">← All designs</a></nav>';
    h += '<section class="dhead"><span class="label">Seed</span><h1>' + esc(s.name || id) + "</h1>" + (s.pitch ? "<p>" + fmt(s.pitch) + "</p>" : "") +
      (s.folio_ref ? '<p class="small muted">From the Woodland Folio: ' + esc(s.folio_ref) + "</p>" : s.source === "new" ? '<p class="small muted">A new idea, not from the folio.</p>' : "") + "</section>";
    if (rk && rk.order && rk.order.length) {
      var why = {}; (rk.why || []).forEach(function (w) { why[w.design] = w.line; });
      h += '<section class="block"><h2>How its designs compare</h2><ol class="pts">';
      rk.order.forEach(function (did, i) {
        var d = byId[did];
        h += '<li class="pt"><span><b class="num">' + (i + 1) + ".</b> " + (d ? '<a href="#design-' + esc(d.key) + '"><b>' + esc(tribeName(d)) + "</b></a>" : esc(did)) + "</span>" + (why[did] ? '<span class="small">' + fmt(why[did]) + "</span>" : "") + "</li>";
      });
      h += "</ol>";
      if ((rk.iteration_helped || []).length) {

  function methodNote() { return state.blind ? '<p class="small muted">The designer’s own text may give the method away.</p>' : ""; }

  // ---------- light markdown ----------
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  }
  function cells(line) { var t = line.trim(); if (t.charAt(0) === "|") t = t.slice(1); if (t.charAt(t.length - 1) === "|") t = t.slice(0, -1); return t.split("|").map(function (c) { return c.trim(); }); }
  function mdHtml(md) {
    var L = String(md).replace(/\r\n?/g, "\n").split("\n"), out = [], para = [], i = 0;
    function flush() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
    while (i < L.length) {
      var l = L[i];
      if (/^\s*$/.test(l)) { flush(); i++; continue; }
      if (/^```/.test(l)) { flush(); var code = []; i++; while (i < L.length && !/^```/.test(L[i])) code.push(L[i++]); i++; out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); continue; }
      var hm = /^(#{1,6})\s+(.*)$/.exec(l);
      if (hm) { flush(); var lv = Math.min(4, hm[1].length + 1); out.push("<h" + lv + ">" + inline(hm[2]) + "</h" + lv + ">"); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { flush(); out.push("<hr>"); i++; continue; }
      if (/^\s*\|/.test(l)) {

        var t = '<div class="tablewrap"><table>' + (head ? "<thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead>" : "") + "<tbody>" + body.map(function (r) { return "<tr>" + cells(r).map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
        out.push(t); continue;

        out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>")); continue;
      }

    flush();
    return '<article class="md">' + out.join("") + "</article>";
  }

  // ---------- card story ----------
  function wordDiff(a, b) {
    var A = plain(a).split(/(\s+)/).filter(function (x) { return x !== ""; }), B = plain(b).split(/(\s+)/).filter(function (x) { return x !== ""; });
    if (A.length * B.length > 250000) return "<del>" + esc(plain(a)) + "</del> <ins>" + esc(plain(b)) + "</ins>";
    var n = A.length, m = B.length, T = [];
    for (var i = 0; i <= n; i++) { T.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) T[i][j] = A[i] === B[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
    var out = [], dl = [], ad = [];
    function fl() { if (dl.length) out.push("<del>" + esc(dl.join("")) + "</del>"); if (ad.length) out.push("<ins>" + esc(ad.join("")) + "</ins>"); dl = []; ad = []; }
    i = 0; j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { fl(); out.push(esc(A[i])); i++; j++; }
      else if (T[i + 1][j] >= T[i][j + 1]) dl.push(A[i++]); else ad.push(B[j++]);
    }
    while (i < n) dl.push(A[i++]); while (j < m) ad.push(B[j++]); fl();
    return out.join("");
  }

  function diffRows(a, b) {
    var rows = [];
    if ((a.name || "") !== (b.name || "")) rows.push(["Name", esc(plain(a.name)) + " → <b>" + esc(plain(b.name)) + "</b>"]);
    if (String(a.tier) !== String(b.tier) && (a.tier != null || b.tier != null)) rows.push(["Tier", '<span class="num">' + esc(a.tier) + " → <b>" + esc(b.tier) + "</b></span>"]);
    if (String(a.attack) !== String(b.attack) || String(a.health) !== String(b.health)) rows.push(["Stats", '<span class="num">' + esc(a.attack) + "/" + esc(a.health) + " → <b>" + esc(b.attack) + "/" + esc(b.health) + "</b></span>"]);
    if ((a.text || "") !== (b.text || "")) rows.push(["Text", wordDiff(a.text || "", b.text || "")]);
    if ((a.golden || "") !== (b.golden || "")) rows.push(["Golden", wordDiff(a.golden || "", b.golden || "")]);
    if ((a.kind || "") !== (b.kind || "")) rows.push(["Kind", esc(a.kind) + " → <b>" + esc(b.kind) + "</b>"]);
    return rows.length ? '<dl class="diff">' + rows.map(function (r) { return "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>"; }).join("") + "</dl>" : "";
  }

  function saidAbout(d, v, uid) {
    var x = ver(d, v), data = vdata(d, v), items = [];
    ((x && x.reviews) || []).forEach(function (r) {
      var who = esc(member(r.member).name);
      (r.points || []).forEach(function (p) { if (p.uid === uid) items.push('<span><span class="pill ' + (p.kind === "fix" ? "t-bad" : "t-info") + '">' + (p.kind === "fix" ? "needs fixing" : "idea") + "</span> <b>" + who + ":</b> " + fmt(p.text) + "</span>" + outcomeHtml(d, v, r.id || ("v" + v + "--" + r.member), p.pid)); });
      (r.standouts || []).forEach(function (s) { if (s.uid === uid) items.push('<span><span class="pill t-good">standout</span> <b>' + who + ":</b> " + fmt(s.why) + "</span>"); });
      (r.weakest || []).forEach(function (s) { if (s.uid === uid) items.push('<span><span class="pill t-warn">weakest</span> <b>' + who + ":</b> " + fmt(s.why) + "</span>"); });
      (r.flags || []).forEach(function (f) { if (f.uid === uid) { var mk = MARK[f.kind] || [f.kind, ""]; items.push('<span><span class="pill ' + mk[1] + '">' + esc(mk[0]) + "</span> <b>" + who + ":</b> " + fmt(f.note) + "</span>"); } });
    });
    return items.length ? '<div class="notes"><span class="label">What the reviewers said about it in v' + v + "</span>" + items.join("") + "</div>" : "";
  }

  function whyBox(d, x) { return '<div class="why"><span><b>' + fmt(x.what) + "</b></span>" + (x.why ? '<span><span class="muted">Why:</span> ' + fmt(x.why) + "</span>" : "") + sourceLine(d, x.from) + "</div>"; }
  function storyHtml(d, uid) {
    var vs = d.versions.filter(function (x) { return vdata(d, x.v); }).map(function (x) { return x.v; });
    var latest = null; vs.forEach(function (v) { latest = cardIn(vdata(d, v), uid) || latest; });
    var body = "", prevCard = null, prevV = null, seen = false;
    vs.forEach(function (v) {
      var data = vdata(d, v), c = cardIn(data, uid), ch = (data.changes || []).filter(function (x) { return x.uid === uid; });
      var mk = markers(d, v)[uid];
      if (!seen && !c && !ch.length) return;
      if (seen && !c && !prevCard && !ch.length) return;
      var h = '<section class="step"><h3>v' + v + (chipsFor(mk) ? ' <span class="chips">' + chipsFor(mk) + "</span>" : "") + "</h3>";
      if (!seen) {
        seen = true;
        if (v > 1 && c) h += '<p><b>Added in v' + v + ".</b></p>";
        ch.forEach(function (x) { h += whyBox(d, x); });
        if (c) h += cardHtml(d, v, c, null, "").replace('<button type="button" class="card"', '<div class="card" style="cursor:default"').replace(/<\/button>$/, "</div>");
      } else {
        ch.forEach(function (x) { h += whyBox(d, x); });
        if (prevCard && !c) h += "<p><b>Removed in v" + v + ".</b></p>";
        else if (!prevCard && c) h += cardHtml(d, v, c, null, "").replace('<button type="button" class="card"', '<div class="card" style="cursor:default"').replace(/<\/button>$/, "</div>");
        else if (prevCard && c) {
          var dr = diffRows(prevCard, c);
          if (dr) h += '<span class="label">Before and after</span>' + dr;
          else if (!ch.length) h += '<p class="small muted">No change from v' + prevV + ".</p>";
        }
      }
      h += saidAbout(d, v, uid);
      body += h + "</section>";
      prevCard = c; prevV = v;
    });
    if (!seen) body = '<p class="muted">This card isn’t in any version of the design.</p>';
    var name = latest ? plain(latest.name) : (uid === "identity" ? "The tribe" : "A card");
    return '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><div><span class="label">' + esc(tribeName(d)) + '</span><h2 id="sheet-title">' + esc(name) + '</h2><p class="small muted">How this card changed across the versions, and why.</p></div><button type="button" class="close" id="sheet-close">Close</button></div><div class="sheet-body">' + body + "</div></div>";
  }

  var sheet = document.getElementById("sheet"), lastFocus = null;
  function openStory(d, uid) {
    lastFocus = document.activeElement;
    sheet.className = "sheet-bg"; sheet.innerHTML = storyHtml(d, uid); sheet.hidden = false;
    document.body.style.overflow = "hidden";
    var c = document.getElementById("sheet-close"); if (c) c.focus();
  }
  function closeStory() {
    if (sheet.hidden) return;
    sheet.hidden = true; sheet.innerHTML = ""; document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  sheet.addEventListener("click", function (e) { if (e.target === sheet || e.target.id === "sheet-close") closeStory(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeStory(); });

  // ---------- routing ----------
  var app = document.getElementById("app"), current = null;
  function parse() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var m;
    if ((m = /^design-(.+?)(?:-v(\d+))?$/.exec(h)) && byKey[m[1]]) return { view: "design", key: m[1], v: m[2] ? +m[2] : null };
    if ((m = /^design-(.+)$/.exec(h))) return { view: "design", key: m[1], v: null };
    if ((m = /^seed-(.+)$/.exec(h))) return { view: "seed", id: m[1] };
    if ((m = /^text-(.+)$/.exec(h))) return { view: "text", key: m[1] };
    return { view: "home" };
  }
  function render(keepScroll) {
    closeStory();
    var r = parse(); current = r;
    var y = window.scrollY;
    if (r.view === "design") app.innerHTML = viewDesign(r.key, r.v);
    else if (r.view === "seed") app.innerHTML = viewSeed(r.id);
    else if (r.view === "text") app.innerHTML = viewText(r.key);
    else app.innerHTML = viewHome();
    window.scrollTo(0, keepScroll ? y : 0);
  }
  function refreshList() {
    var el = document.getElementById("list"); if (!el) return render(true);
    el.innerHTML = rowsBlock(current && current.view === "seed" ? current.id : "");
  }
  window.addEventListener("hashchange", function () { render(false); });

  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "f-seed") { location.hash = t.value ? "seed-" + t.value : ""; if (!t.value && !location.hash) render(false); return; }
    if (t.id === "f-method") { state.method = t.value; refreshList(); }
    if (t.id === "f-status") { state.status = t.value; refreshList(); }
    if (t.id === "f-sort") { state.sort = t.value; refreshList(); }
  });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.mode && current && current.view === "design") {
      var mode = b.dataset.mode, h = "#design-" + current.key + (mode === "compare" ? "" : "-v" + mode);
      try { history.replaceState(null, "", h); } catch (err) { location.hash = h; return; }
      render(true); return;
    }
    if (b.dataset.side) {
      state.side = b.dataset.side;
      var cmp = app.querySelector(".compare.two"); if (cmp) cmp.dataset.side = state.side;
      app.querySelectorAll(".side-switch button").forEach(function (x) { x.setAttribute("aria-pressed", String(x.dataset.side === state.side)); });
      return;
    }
    if (b.dataset.uid && current && current.view === "design") { var d = byKey[current.key]; if (d) openStory(d, b.dataset.uid); }
  });

  var blind = document.getElementById("blind");
  blind.checked = state.blind;
  blind.addEventListener("change", function () {
    state.blind = blind.checked; if (state.blind) state.method = "";
    try { localStorage.setItem("tribe-run-blind", state.blind ? "1" : "0"); } catch (e) {}
    render(true);
  });
  render(false);
})();
</script>
