<title>Bramble Tribe Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: a reading ledger. Home is a list of design rows; a design opens as a pitch (a short run of slides,
   most important first, the tribe laid out as game cards), with the full record one tab away. */
:root {
  --paper: #eef1ea;
  --surface: #fbfcf9;
  --sunk: #e4e9e1;
  --ink: #1b241f;
  --muted: #56635a;
  --line: #cfd8cd;
  --accent: #6b2752;      /* blackberry */
  --accent-soft: #f0e1ea;
  --gold: #7f5c0c;
  --gold-soft: #f5ecd4;
  --good: #276236;
  --good-soft: #dcefdf;
  --warn: #7f5200;
  --warn-soft: #f6e8cc;
  --bad: #9c2c25;
  --bad-soft: #f6dedb;
  --info: #285775;
  --info-soft: #dce9f2;
  --bar: #9fb4a3;
  /* card roles: strong (frame, banner, label) and soft (the blank art) */
  --role-body: #6a5843; --role-body-soft: #ece3d6;
  --role-engine: #0e6767; --role-engine-soft: #d5ecea;
  --role-buff: #2e6a2a; --role-buff-soft: #dcecd5;
  --role-economy: #845600; --role-economy-soft: #f4e6c8;
  --role-multiplier: #6440a0; --role-multiplier-soft: #e7ddf5;
  --role-payoff: #a02448; --role-payoff-soft: #f6dce3;
  --role-utility: #2d5a88; --role-utility-soft: #d9e6f3;
  --role-none: #5f6b63; --role-none-soft: #e3e8e1;
  --on-role: #ffffff;
  /* tier gems, a lichen-to-blackberry ramp; white numbers on every one */
  --tier-1: #66775a; --tier-2: #3d7558; --tier-3: #2d6b78; --tier-4: #3e5394; --tier-5: #664696; --tier-6: #8a2c66;
  --atk: #e3ab2e; --on-atk: #2a1b00;
  --hp: #b8362f; --on-hp: #ffffff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111714; --surface: #18201c; --sunk: #202a25; --ink: #e2e8e1; --muted: #9aa89f; --line: #2d3a33;
    --accent: #dba3c6; --accent-soft: #3a2131; --gold: #e2bd63; --gold-soft: #352c19;
    --good: #8fd09b; --good-soft: #1c3323; --warn: #e6b45c; --warn-soft: #382c14; --bad: #f0958c; --bad-soft: #3d1f1c;
    --info: #90c3e5; --info-soft: #1b2d39; --bar: #4f6857;
    --role-body: #cdb898; --role-body-soft: #2c261d; --role-engine: #6fcfca; --role-engine-soft: #142e2d;
    --role-buff: #96d38c; --role-buff-soft: #1a2f18; --role-economy: #e7bd5e; --role-economy-soft: #31270f;
    --role-multiplier: #c3a6f2; --role-multiplier-soft: #272040; --role-payoff: #f28fab; --role-payoff-soft: #391a24;
    --role-utility: #91bbea; --role-utility-soft: #18283b; --role-none: #9aa89f; --role-none-soft: #222b26;
    --on-role: #121915;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111714; --surface: #18201c; --sunk: #202a25; --ink: #e2e8e1; --muted: #9aa89f; --line: #2d3a33;
  --accent: #dba3c6; --accent-soft: #3a2131; --gold: #e2bd63; --gold-soft: #352c19;
  --good: #8fd09b; --good-soft: #1c3323; --warn: #e6b45c; --warn-soft: #382c14; --bad: #f0958c; --bad-soft: #3d1f1c;
  --info: #90c3e5; --info-soft: #1b2d39; --bar: #4f6857;
  --role-body: #cdb898; --role-body-soft: #2c261d; --role-engine: #6fcfca; --role-engine-soft: #142e2d;
  --role-buff: #96d38c; --role-buff-soft: #1a2f18; --role-economy: #e7bd5e; --role-economy-soft: #31270f;
  --role-multiplier: #c3a6f2; --role-multiplier-soft: #272040; --role-payoff: #f28fab; --role-payoff-soft: #391a24;
  --role-utility: #91bbea; --role-utility-soft: #18283b; --role-none: #9aa89f; --role-none-soft: #222b26;
  --on-role: #121915;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.ic { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in, .wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.brand .berry { width: 18px; height: 18px; flex: none; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; user-select: none; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--sunk); border: 1px solid var(--line); position: relative; cursor: pointer; margin: 0; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(16px); background: var(--surface); }

main.wrap { padding-block: 24px 64px; display: flex; flex-direction: column; gap: 28px; }
.intro { display: flex; flex-direction: column; gap: 10px; max-width: 68ch; }
.intro p { color: var(--ink); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.filters label { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 140px; }
.filters select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); min-height: 40px; }
.count { flex-basis: 100%; }

/* picks */
.picks { display: flex; flex-direction: column; gap: 10px; }
.picks ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.pick { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 14px; background: var(--accent-soft); border-radius: var(--r); text-decoration: none; color: var(--ink); }
.pick .rank { font-family: var(--display); font-weight: 700; font-size: 1.6rem; color: var(--accent); line-height: 1; grid-row: span 2; }
.pick b { font-family: var(--display); }
.clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }

/* design rows */
.rows { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }
.group { display: flex; flex-direction: column; gap: 10px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.group-head a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.row { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); min-width: 0; }
.row:hover { border-color: var(--accent); }
.row-name { font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.row-hook { font-size: 1rem; line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.row-sum { display: flex; flex-direction: column; gap: 2px; }
.row-latest { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.t-good { background: var(--good-soft); color: var(--good); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-info { background: var(--info-soft); color: var(--info); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.t-gold { background: var(--gold-soft); color: var(--gold); }
.t-accent { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 24px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); }

/* role make-up bar (home rows and the card table) */
.makeup { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.makeup i { flex: var(--n) 1 0; background: var(--rc); }
.makeup.tall { height: 12px; border-radius: 6px; }

/* rating grid */
.rgrid { display: grid; gap: 4px 6px; align-items: center; font-size: 0.85rem; }
.rgrid .rh { color: var(--muted); font-size: 0.75rem; text-align: center; }
.rgrid .rh.fin { color: var(--accent); font-weight: 700; }
.rgrid .rl { color: var(--muted); min-width: 0; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cell .num { font-size: 0.95rem; }
.cell .meter { width: 100%; max-width: 54px; height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.cell .meter i { display: block; height: 100%; background: var(--bar); }
.cell.fin .meter i { background: var(--accent); }
.cell.fin .num { font-weight: 700; }
.rgrid.big { font-size: 0.95rem; max-width: 560px; }

/* design page */
.back { font-size: 0.95rem; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.dhead { display: flex; flex-direction: column; gap: 12px; max-width: 72ch; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 10px; }
.seg button, .seg a { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--muted); min-height: 36px; text-decoration: none; display: inline-flex; align-items: center; }
.seg button[aria-pressed="true"], .seg a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.switchbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.compare { display: grid; gap: 24px; grid-template-columns: 1fr; }
.compare > * { min-width: 0; }
.side-switch { display: flex; padding-top: 4px; border-top: 1px solid var(--line); }
@media (min-width: 960px) {
  .compare.two { grid-template-columns: 1fr 1fr; }
  .side-switch { display: none; }
}
@media (max-width: 959px) {
  .compare.two[data-side="a"] > .col-b, .compare.two[data-side="b"] > .col-a { display: none; }
}
.ver { display: flex; flex-direction: column; gap: 18px; }
.ver-head { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.ver-head h2 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.block { display: flex; flex-direction: column; gap: 8px; }
.block ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.kw { padding: 10px 12px; background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; }
.shape { font-size: 0.9rem; padding: 8px 12px; border-radius: 8px; background: var(--sunk); }
.shape.off { background: var(--warn-soft); color: var(--warn); }
.tier-head { display: flex; align-items: baseline; gap: 10px; }
.tier-head .num { color: var(--muted); font-size: 0.85rem; }
.hint { font-size: 0.9rem; color: var(--muted); }
.changes li { padding: 8px 0; border-bottom: 1px solid var(--line); list-style: none; display: flex; flex-direction: column; gap: 2px; }
.changes ul { padding: 0; gap: 0; }
.src { font-size: 0.85rem; color: var(--muted); }
.tiers { display: flex; flex-direction: column; gap: 14px; }

/* ---------- game cards: one component, three sizes ---------- */
.cardgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(var(--cw, 104px), 1fr)); }
.cardgrid.m { --cw: 156px; gap: 10px; }
@media (min-width: 560px) { .cardgrid { --cw: 150px; } .cardgrid.m { --cw: 190px; } }
@media (min-width: 1100px) { .cardgrid { --cw: 168px; } .gc-s { --art-h: 54px; --name-fs: 0.86rem; --txt-fs: 0.85rem; --gem: 28px; --stat: 26px; --stat-fs: 0.92rem; } }
.gc { --rc: var(--role-none); --rs: var(--role-none-soft); --art-h: 40px; --name-fs: 0.74rem; --txt-fs: 0.72rem; --gem: 24px; --stat: 22px; --stat-fs: 0.8rem;
  position: relative; display: flex; flex-direction: column; text-align: center; width: 100%; min-width: 0; margin: 0;
  background: var(--surface); color: var(--ink); border: 2px solid var(--rc); border-radius: 12px; padding: 0 0 5px; overflow: hidden; font: inherit; line-height: 1.25; }
button.gc { cursor: pointer; }
button.gc:hover { box-shadow: 0 0 0 2px var(--rc); }
.gc-m { --art-h: 56px; --name-fs: 0.86rem; --txt-fs: 0.82rem; --gem: 28px; --stat: 26px; --stat-fs: 0.92rem; padding-bottom: 6px; }
.gc-l { --art-h: 96px; --name-fs: 1.08rem; --txt-fs: 0.98rem; --gem: 36px; --stat: 34px; --stat-fs: 1.1rem; padding-bottom: 8px; border-width: 3px; border-radius: 16px; max-width: 340px; margin-inline: auto; }
@media (min-width: 560px) { .gc-s { --art-h: 50px; --name-fs: 0.8rem; --txt-fs: 0.78rem; --gem: 26px; --stat: 24px; --stat-fs: 0.86rem; } }
.role-body { --rc: var(--role-body); --rs: var(--role-body-soft); }
.role-engine { --rc: var(--role-engine); --rs: var(--role-engine-soft); }
.role-buff { --rc: var(--role-buff); --rs: var(--role-buff-soft); }
.role-economy { --rc: var(--role-economy); --rs: var(--role-economy-soft); }
.role-multiplier { --rc: var(--role-multiplier); --rs: var(--role-multiplier-soft); }
.role-payoff { --rc: var(--role-payoff); --rs: var(--role-payoff-soft); }
.role-utility { --rc: var(--role-utility); --rs: var(--role-utility-soft); }
.gc-art { display: grid; place-items: center; height: var(--art-h); color: var(--rc); background: var(--rs);
  box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px color-mix(in srgb, var(--rc) 30%, transparent); border-radius: 10px 10px 0 0; }
.gc-art svg { width: calc(var(--art-h) * 0.5); height: calc(var(--art-h) * 0.5); opacity: 0.32; }
.gc-s[class*="role-"] .gc-art svg { opacity: 0.75; }
.gc-s .gc-text { padding-top: 5px; }
.gc-gem { position: absolute; top: 3px; left: 3px; width: var(--gem); height: var(--gem); display: grid; place-items: center; color: #fff;
  font-family: var(--mono); font-weight: 700; font-size: calc(var(--gem) * 0.5); background: var(--tc, var(--tier-1));
  clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
.gc-gem[data-t="2"] { --tc: var(--tier-2); } .gc-gem[data-t="3"] { --tc: var(--tier-3); } .gc-gem[data-t="4"] { --tc: var(--tier-4); }
.gc-gem[data-t="5"] { --tc: var(--tier-5); } .gc-gem[data-t="6"] { --tc: var(--tier-6); }
.gc-kind { position: absolute; top: 4px; left: 4px; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 999px; background: var(--surface); color: var(--muted); }
.gc-marks { position: absolute; top: 3px; right: 3px; display: flex; justify-content: flex-end; gap: 2px; }
.gc-s .gc-marks .mk { width: 16px; height: 16px; } .gc-s .gc-marks .mk svg { width: 9px; height: 9px; }
.mk-more { color: var(--muted); font-family: var(--mono); font-size: 0.6rem; font-weight: 700; }
.mk { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid currentColor; flex: none; }
.mk svg { width: 10px; height: 10px; }
.gc-l .mk { width: 24px; height: 24px; } .gc-l .mk svg { width: 14px; height: 14px; }
.mk-star { color: var(--gold); } .mk-changed, .mk-added { color: var(--accent); } .mk-standout { color: var(--good); }
.mk-weakest { color: var(--warn); } .mk-broken { color: var(--bad); } .mk-watch { color: var(--gold); } .mk-unclear { color: var(--info); }
.gc-name { display: block; position: relative; margin: -11px 5px 0; padding: 3px 5px; border-radius: 6px; background: var(--rc); color: var(--on-role);
  font-family: var(--display); font-weight: 700; font-size: var(--name-fs); line-height: 1.12; overflow-wrap: anywhere; }
.gc-role { display: flex; align-items: center; justify-content: center; gap: 3px; margin-top: 3px; color: var(--rc); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.gc-m .gc-role { font-size: 0.66rem; } .gc-l .gc-role { font-size: 0.78rem; }
.gc-text { flex: 1; padding: 3px 6px 0; font-size: var(--txt-fs); overflow-wrap: anywhere; }
.gc-l .gc-text { padding: 8px 14px 4px; text-align: left; line-height: 1.4; }
.gc-m .gc-text { line-height: 1.3; }
.gc-s .gc-text.long { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; line-clamp: 5; overflow: hidden; flex: none; margin-bottom: auto; }
.gc-foot { display: flex; justify-content: space-between; align-items: flex-end; padding: 4px 4px 0; }
.gc-atk, .gc-hp { min-width: var(--stat); height: var(--stat); padding: 0 3px; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: var(--stat-fs); font-variant-numeric: tabular-nums; }
.gc-atk { background: var(--atk); color: var(--on-atk); border-radius: 50%; }
.gc-hp { background: var(--hp); color: var(--on-hp); border-radius: 4px 4px 50% 50%; }
.gc-foot .gc-tier { font-size: 0.6rem; color: var(--muted); align-self: center; }
/* the golden face: shown by a toggle on any container marked data-faces */
.gc .face-g { display: none; }
.golden-on .gc:not(.no-gold) .face-g { display: inline; }
.golden-on .gc:not(.no-gold) .face-n { display: none; }
.golden-on .gc:not(.no-gold) { border-color: var(--gold); background: linear-gradient(var(--gold-soft), var(--surface) 70%); }
.golden-on .gc:not(.no-gold) .gc-name { background: var(--gold); }
.golden-on .gc:not(.no-gold) .gc-art { background-color: var(--gold-soft); }
.golden-on .gc:not(.no-gold) .gc-gold { display: block; flex: 1; }
.golden-on .gc.gl:not(.no-gold) .gc-text { flex: none; margin-bottom: 0; }
.gc-gold { margin: 4px 6px 0; padding: 3px 4px 0; border-top: 1px dashed var(--gold); font-size: var(--txt-fs); line-height: 1.25; overflow-wrap: anywhere; }
.gc-gold b { color: var(--gold); }
.gc-s .gc-gold { font-size: calc(var(--txt-fs) * 0.94); }
.gc-l .gc-gold { margin: 4px 14px 0; padding: 6px 0 2px; text-align: left; line-height: 1.4; }
.gc-gold.gold-note { font-size: 0.85em; color: var(--muted); font-style: italic; }
/* role highlight from the legend */

  // ---------- light markdown ----------
  function inline(s) {

  }
  function cells(line) { var t = line.trim(); if (t.charAt(0) === "|") t = t.slice(1); if (t.charAt(t.length - 1) === "|") t = t.slice(0, -1); return t.split("|").map(function (c) { return c.trim(); }); }
  function mdInner(md) {
    var L = String(md).replace(/\r\n?/g, "\n").split("\n"), out = [], para = [], i = 0;
    function flush() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
    while (i < L.length) {
      var l = L[i];
      if (/^\s*$/.test(l)) { flush(); i++; continue; }
      if (/^```/.test(l)) { flush(); var code = []; i++; while (i < L.length && !/^```/.test(L[i])) code.push(L[i++]); i++; out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); continue; }
      var hm = /^(#{1,6})\s+(.*)$/.exec(l);
      if (hm) { flush(); var lv = Math.min(4, hm[1].length + 1); out.push("<h" + lv + ">" + inline(hm[2]) + "</h" + lv + ">"); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { flush(); out.push("<hr>"); i++; continue; }
      if (/^\s*\|/.test(l)) {
        flush(); var rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
        var head = null, body = rows;

        var t = '<div class="tablewrap"><table>' + (head ? "<thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead>" : "") + "<tbody>" + body.map(function (r) { return "<tr>" + cells(r).map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
        out.push(t); continue;

  // ---------- card story ----------
  function wordDiff(a, b) {
    var A2 = plain(a).split(/(\s+)/).filter(function (x) { return x !== ""; }), B = plain(b).split(/(\s+)/).filter(function (x) { return x !== ""; });
    if (A2.length * B.length > 250000) return "<del>" + esc(plain(a)) + "</del> <ins>" + esc(plain(b)) + "</ins>";
    var n = A2.length, m = B.length, T = [];
    for (var i = 0; i <= n; i++) { T.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) T[i][j] = A2[i] === B[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
    var out = [], dl = [], ad = [];
    function fl() { if (dl.length) out.push("<del>" + esc(dl.join("")) + "</del>"); if (ad.length) out.push("<ins>" + esc(ad.join("")) + "</ins>"); dl = []; ad = []; }
    i = 0; j = 0;
    while (i < n && j < m) {
      if (A2[i] === B[j]) { fl(); out.push(esc(A2[i])); i++; j++; }
      else if (T[i + 1][j] >= T[i][j + 1]) dl.push(A2[i++]); else ad.push(B[j++]);
    }
    while (i < n) dl.push(A2[i++]); while (j < m) ad.push(B[j++]); fl();
    return out.join("");
  }

  function diffRows(a, b) {
    var rows = [];
    if ((a.name || "") !== (b.name || "")) rows.push(["Name", esc(plain(a.name)) + " → <b>" + esc(plain(b.name)) + "</b>"]);
    if (String(a.tier) !== String(b.tier) && (a.tier != null || b.tier != null)) rows.push(["Tier", '<span class="num">' + esc(a.tier) + " → <b>" + esc(b.tier) + "</b></span>"]);
    if (String(a.attack) !== String(b.attack) || String(a.health) !== String(b.health)) rows.push(["Stats", '<span class="num">' + esc(a.attack) + "/" + esc(a.health) + " → <b>" + esc(b.attack) + "/" + esc(b.health) + "</b></span>"]);
    if ((a.text || "") !== (b.text || "")) rows.push(["Text", wordDiff(a.text || "", b.text || "")]);
    if ((a.golden || "") !== (b.golden || "")) rows.push(["Golden", wordDiff(a.golden || "", b.golden || "")]);
    if ((a.kind || "") !== (b.kind || "")) rows.push(["Kind", esc(a.kind) + " → <b>" + esc(b.kind) + "</b>"]);
    return rows.length ? '<dl class="diff">' + rows.map(function (r) { return "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>"; }).join("") + "</dl>" : "";
  }

  function saidAbout(d, v, uid) {
    var x = ver(d, v), items = [];
    ((x && x.reviews) || []).forEach(function (r) {
      var who = esc(member(r.member).name);
      (r.points || []).forEach(function (p) { if (p.uid === uid) items.push('<span><span class="pill ' + (p.kind === "fix" ? "t-bad" : "t-info") + '">' + (p.kind === "fix" ? "needs fixing" : "idea") + "</span> <b>" + who + ":</b> " + fmt(p.text) + "</span>" + outcomeHtml(d, v, r.id || ("v" + v + "--" + r.member), p.pid)); });
      (r.standouts || []).forEach(function (s) { if (s.uid === uid) items.push('<span><span class="pill t-good">' + ICON.standout + 'standout</span> <b>' + who + ":</b> " + fmt(s.why) + "</span>"); });
      (r.weakest || []).forEach(function (s) { if (s.uid === uid) items.push('<span><span class="pill t-warn">' + ICON.weakest + 'weakest</span> <b>' + who + ":</b> " + fmt(s.why) + "</span>"); });
      (r.flags || []).forEach(function (f) { if (f.uid === uid) { var mk = MARK[f.kind] || [f.kind, ""]; items.push('<span><span class="pill ' + mk[1] + '">' + (ICON[f.kind] || "") + esc(mk[0]) + "</span> <b>" + who + ":</b> " + fmt(f.note) + "</span>"); } });
    });
    return items.length ? '<div class="notes"><span class="label">What the reviewers said about it in v' + v + "</span>" + items.join("") + "</div>" : "";
  }

  function whyBox(d, x) { return '<div class="why"><span><b>' + fmt(x.what) + "</b></span>" + (x.why ? '<span><span class="muted">Why:</span> ' + fmt(x.why) + "</span>" : "") + sourceLine(d, x.from) + "</div>"; }
  function storyHtml(d, uid) {
    var vs = dataVs(d), p = pitchOf(d), role = roleOf(d, uid);
    // the card shown big: the pitch's version (the final one), or the latest version that has it
    var has = vs.filter(function (v) { return cardIn(vdata(d, v), uid); });
    var showV = p && has.indexOf(p.v) >= 0 ? p.v : has.indexOf(finalV(d)) >= 0 ? finalV(d) : has[has.length - 1] || null;
    var latest = has.length ? cardIn(vdata(d, has[has.length - 1]), uid) : null;
    var big = showV ? cardIn(vdata(d, showV), uid) : null;
    var body = "", prevCard = null, prevV = null, seen = false;
    if (big) {
      var marks = cardMarks(d, showV, big, { base: showV > 1 && vdata(d, 1) ? 1 : null, stars: p && p.v === showV ? A(p.stars).map(function (s) { return s && s.uid; }) : [] });
      var hasGold = (big.attack != null || big.health != null) && S(big.golden);
      body += '<section class="bigcard" data-faces>' + gameCard(big, { size: "l", role: role, marks: marks, roleless: "" }) +
        (hasGold ? faceToggle("Card face") : "") + '<span class="small muted">' + (showV ? "v" + showV + (showV === finalV(d) && (d.status === "settled" || d.status === "capped") ? ", the final version" : "") : "") + (role ? " · role: " + esc(ROLE[role].name.toLowerCase()) : "") + "</span></section>";
    }
    vs.forEach(function (v) {
      var data = vdata(d, v), c = cardIn(data, uid), ch = (data.changes || []).filter(function (x) { return x.uid === uid; });
      var mk = markers(d, v)[uid];
      if (!seen && !c && !ch.length) return;
      if (seen && !c && !prevCard && !ch.length) return;
      var h = '<section class="step"><h3>v' + v + (chipsFor(mk) ? ' <span class="chips">' + chipsFor(mk) + "</span>" : "") + "</h3>";
      if (!seen) {
        seen = true;
        if (v > 1 && c) h += '<p><b>Added in v' + v + ".</b></p>";
        ch.forEach(function (x) { h += whyBox(d, x); });
        if (c && v !== showV) h += gameCard(c, { size: "m", role: role });
        else if (c) h += '<p class="small muted">The card as shown above.</p>';
      } else {
        ch.forEach(function (x) { h += whyBox(d, x); });
        if (prevCard && !c) h += "<p><b>Removed in v" + v + ".</b></p>";
        else if (!prevCard && c) h += gameCard(c, { size: "m", role: role });
        else if (prevCard && c) {
          var dr = diffRows(prevCard, c);
          if (dr) h += '<span class="label">Before and after</span>' + dr;
          else if (!ch.length) h += '<p class="small muted">No change from v' + prevV + ".</p>";
        }
      }
      h += saidAbout(d, v, uid);
      body += h + "</section>";
      prevCard = c; prevV = v;
    });
    if (!seen) body = '<p class="muted">This card isn’t in any version of the design.</p>';
    var name = latest ? plain(latest.name) : (uid === "identity" ? "The tribe" : "A card");
    if (big) name = plain(big.name);
    return '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><div><span class="label">' + esc(tribeName(d)) + '</span><h2 id="sheet-title">' + esc(name) + '</h2><p class="small muted">The card in full, then how it changed across the versions, and why.</p></div><button type="button" class="close" id="sheet-close">Close</button></div><div class="sheet-body">' + body + "</div></div>";
  }

  var sheet = document.getElementById("sheet"), lastFocus = null;
  function openStory(d, uid) {
    lastFocus = document.activeElement;
    sheet.className = "sheet-bg"; sheet.innerHTML = storyHtml(d, uid); sheet.hidden = false;
    var bc = sheet.querySelector(".bigcard"); if (bc) bc.classList.toggle("golden-on", state.golden);
    document.body.style.overflow = "hidden";
    var c = document.getElementById("sheet-close"); if (c) c.focus();
  }
  function closeStory() {
    if (sheet.hidden) return;
    sheet.hidden = true; sheet.innerHTML = ""; document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }
  sheet.addEventListener("click", function (e) {
    if (e.target === sheet || e.target.id === "sheet-close") { closeStory(); return; }
    var f = e.target.closest("[data-face]");
    if (f) { var on = f.dataset.face === "g", box = f.closest("[data-faces]"); if (box) box.classList.toggle("golden-on", on); f.parentNode.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.face === f.dataset.face)); }); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeStory(); return; }
    if (e.key === "Tab" && !sheet.hidden) { // keep focus inside the open card
      var f = sheet.querySelectorAll("button, a[href], summary"); if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // ---------- slides: nav highlight ----------
  var observer = null;
  function setupSlides() {
    if (observer) { observer.disconnect(); observer = null; }
    var nav = app.querySelector(".slidenav"); if (!nav || !("IntersectionObserver" in window)) return;
    var slides = Array.prototype.slice.call(app.querySelectorAll(".slide")), seen = {};
    observer = new IntersectionObserver(function (es) {
      es.forEach(function (e) { seen[e.target.id] = e.isIntersecting ? e.intersectionRect.height : 0; });
      var best = null, bh = 0; slides.forEach(function (s) { if ((seen[s.id] || 0) > bh) { bh = seen[s.id]; best = s.id; } });
      if (!best) return;
      nav.querySelectorAll("button").forEach(function (b) { var on = "slide-" + b.dataset.slide === best; if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); if (on && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = b.offsetLeft - nav.clientWidth / 2 + b.offsetWidth / 2; });
    }, { threshold: [0, 0.1, 0.25, 0.5, 0.75, 1] });
    slides.forEach(function (s) { observer.observe(s); });
  }
  function topHeight() { var t = document.getElementById("top"); if (t) document.documentElement.style.setProperty("--top-h", t.offsetHeight + "px"); }
  window.addEventListener("resize", topHeight);

  // ---------- routing ----------
  var app = document.getElementById("app"), current = null;
  function parse() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var m;
    if ((m = /^design-(.+?)-full$/.exec(h)) && byKey[m[1]]) return { view: "design", key: m[1], v: null };
    if ((m = /^design-(.+?)-v(\d+)$/.exec(h)) && byKey[m[1]]) return { view: "design", key: m[1], v: +m[2] };
    if ((m = /^design-(.+)$/.exec(h))) return { view: "pitch", key: m[1] };
    if ((m = /^seed-(.+)$/.exec(h))) return { view: "seed", id: m[1] };
    if ((m = /^text-(.+)$/.exec(h))) return { view: "text", key: m[1] };
    return { view: "home" };
  }
  function render(keepScroll) {
    closeStory();
    var r = parse(); current = r;
    var y = window.scrollY;
    if (r.view === "pitch") app.innerHTML = viewPitch(r.key);
    else if (r.view === "design") app.innerHTML = viewDesign(r.key, r.v);
    else if (r.view === "seed") app.innerHTML = viewSeed(r.id);
    else if (r.view === "text") app.innerHTML = viewText(r.key);
    else app.innerHTML = viewHome();
    applyFaces();
    topHeight();
    setupSlides();
    window.scrollTo(0, keepScroll ? y : 0);
  }
  function applyFaces() {
    app.querySelectorAll("[data-faces]").forEach(function (el) { el.classList.toggle("golden-on", state.golden); });
    app.querySelectorAll(".facetog button").forEach(function (b) { b.setAttribute("aria-pressed", String((b.dataset.face === "g") === state.golden)); });
  }
  function refreshList() {
    var el = document.getElementById("list"); if (!el) return render(true);
    el.innerHTML = rowsBlock(current && current.view === "seed" ? current.id : "");
  }
  window.addEventListener("hashchange", function () { render(false); });

  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "f-seed") { location.hash = t.value ? "seed-" + t.value : ""; if (!t.value && !location.hash) render(false); return; }
    if (t.id === "f-method") { state.method = t.value; refreshList(); }
    if (t.id === "f-status") { state.status = t.value; refreshList(); }
    if (t.id === "f-sort") { state.sort = t.value; refreshList(); }
  });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var d = current && byKey[current.key];
    if (b.dataset.mode && current && current.view === "design") {
      var mode = b.dataset.mode, h = "#design-" + current.key + (mode === "compare" ? "-full" : "-v" + mode);
      try { history.replaceState(null, "", h); } catch (err) { location.hash = h; return; }
      render(true); return;
    }
    if (b.dataset.side) {
      state.side = b.dataset.side;
      var cmp = app.querySelector(".compare.two"); if (cmp) cmp.dataset.side = state.side;
      app.querySelectorAll(".side-switch button").forEach(function (x) { x.setAttribute("aria-pressed", String(x.dataset.side === state.side)); });
      return;
    }
    if (b.dataset.slide) {
      var s = document.getElementById("slide-" + b.dataset.slide);
      if (s) s.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "start" });
      return;
    }
    if (b.dataset.face) { state.golden = b.dataset.face === "g"; applyFaces(); return; }
    if (b.dataset.role) {
      state.role = state.role === b.dataset.role ? "" : b.dataset.role;
      app.querySelectorAll("[data-hl]").forEach(function (g) { ROLES.forEach(function (r) { g.classList.toggle("hl-" + r[0], state.role === r[0]); }); });
      app.querySelectorAll(".rolebtn").forEach(function (x) { x.setAttribute("aria-pressed", String(x.dataset.role === state.role)); });
      return;
    }
    if (b.dataset.kw != null) {
      var open = b.getAttribute("aria-expanded") !== "true";
      app.querySelectorAll(".kwchip").forEach(function (x) { x.setAttribute("aria-expanded", "false"); });
      app.querySelectorAll(".kwtext").forEach(function (x) { x.hidden = true; });
      if (open) { b.setAttribute("aria-expanded", "true"); var t = document.getElementById("kw-" + b.dataset.kw); if (t) t.hidden = false; }
      return;
    }
    if (b.dataset.uid && d && (current.view === "design" || current.view === "pitch")) openStory(d, b.dataset.uid);
  });

  var blind = document.getElementById("blind");
  blind.checked = state.blind;
  blind.addEventListener("change", function () {
    state.blind = blind.checked; if (state.blind) state.method = "";
    try { localStorage.setItem("tribe-run-blind", state.blind ? "1" : "0"); } catch (e) {}
    render(true);
  });
  render(false);
})();
</script>
