<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame lab</title>
<style>
  :root { --bg:#111214; --panel:#1b1d21; --text:#e6e2da; --muted:#9a958c; --line:#2c2f35; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 0 2px; font-weight:600; }
  header p { margin:0; color:var(--muted); }
  .wrap { display:flex; gap:0; align-items:flex-start; }
  aside { width:320px; flex:none; padding:14px 16px; border-right:1px solid var(--line); background:var(--panel); min-height:calc(100vh - 60px); }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; }
  .row { display:grid; grid-template-columns: 1fr 120px 38px; gap:6px; align-items:center; margin:4px 0; }
  .row label { color:var(--text); }
  .row output { color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
  .tier { border-top:1px solid var(--line); padding:6px 0; }
  .tier .head { display:flex; justify-content:space-between; align-items:center; font-weight:600; }
  .tier input[type=color] { width:34px; height:22px; border:0; padding:0; background:none; }
  .tier .grid { display:grid; grid-template-columns: auto 1fr auto 1fr; gap:4px 8px; align-items:center; margin-top:4px; }
  .tier .grid input[type=number] { width:52px; background:#111; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 4px; }
  main { flex:1; padding:16px 20px; overflow:auto; }
  .cards { display:flex; gap:22px; flex-wrap:wrap; align-items:flex-end; }
  .card { text-align:center; color:var(--muted); }
  .card canvas { display:block; }
  .card img { display:block; }
  .sect { margin:6px 0 10px; color:var(--muted); font-size:13px; }
  button, select { background:#26292f; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; }
</style>
</head>
<body>
<header>
  <h1>Frame lab</h1>
  <p>Card frames drawn by code, so every setting can be tuned. The Codex frames are below for comparison.</p>
</header>
<div class="wrap">
<aside id="controls">
  <h2>Size</h2>
  <div class="row"><label>Card height (px)</label><input type="range" id="cardH" min="160" max="640" step="10" value="420"><output></output></div>
  <h2>Shape</h2>
  <div class="row"><label>Width : height</label><input type="range" id="aspect" min="0.40" max="0.80" step="0.005" value="0.563"><output></output></div>
  <div class="row"><label>Side border</label><input type="range" id="bw" min="0.04" max="0.18" step="0.002" value="0.104"><output></output></div>
  <div class="row"><label>Roof height</label><input type="range" id="ro" min="0.06" max="0.30" step="0.002" value="0.158"><output></output></div>
  <div class="row"><label>Wedge at point</label><input type="range" id="at" min="0.03" max="0.20" step="0.002" value="0.097"><output></output></div>
  <div class="row"><label>Window shoulder drop</label><input type="range" id="sd" min="0" max="0.08" step="0.002" value="0.036"><output></output></div>
  <h2>Glass and lead</h2>
  <div class="row"><label>Lead width</label><input type="range" id="lead" min="0.003" max="0.03" step="0.0005" value="0.0085"><output></output></div>
  <div class="row"><label>Streak texture</label><input type="range" id="tex" min="0" max="1.5" step="0.02" value="0.9"><output></output></div>
  <div class="row"><label>Milkiness</label><input type="range" id="milk" min="0" max="1" step="0.02" value="0.4"><output></output></div>
  <div class="row"><label>Edge shade</label><input type="range" id="edge" min="0" max="1" step="0.02" value="0.3"><output></output></div>
  <div class="row"><label>Pane variation</label><input type="range" id="vary" min="0" max="1" step="0.02" value="0.5"><output></output></div>
  <div class="row"><label>Glow strength</label><input type="range" id="glowK" min="0" max="2" step="0.05" value="1"><output></output></div>
  <h2>Roundels</h2>
  <div class="row"><label>Size</label><input type="range" id="rr" min="0.08" max="0.18" step="0.002" value="0.145"><output></output></div>
  <div class="row"><label>Height</label><input type="range" id="ry" min="0.65" max="0.88" step="0.002" value="0.78"><output></output></div>
  <div class="row"><label>Inset from side</label><input type="range" id="rx" min="0.12" max="0.30" step="0.002" value="0.2"><output></output></div>
  <h2>Tiers</h2>
  <div id="tiers"></div>
  <h2>Window</h2>
  <div class="row"><label>Window fill</label><select id="win"><option value="slate">Slate</option><option value="clear">Clear</option></select><output></output></div>
</aside>
<main>
  <div class="sect">Drawn by code</div>
  <div class="cards" id="drawn"></div>
  <div class="sect" style="margin-top:22px">Codex, new shape (round 1b)</div>
  <div class="cards" id="codex"></div>
</main>
</div>
<script>
// ---------- tiers ----------
const TIERS = [
  { name:'Tier 1', color:'#b3b6b8', accent:'#d6d8d9', glow:'#ffffff', side:3, slope:2, insets:false, apex:false, glowA:0,    milk:1.0 },
  { name:'Tier 2', color:'#3f9b2c', accent:'#8fd35a', glow:'#59c040', side:4, slope:2, insets:false, apex:false, glowA:0,    milk:0.5 },
  { name:'Tier 3', color:'#2a6fd6', accent:'#8cc0ff', glow:'#3d8bff', side:5, slope:3, insets:false, apex:false, glowA:0,    milk:0.45 },
  { name:'Tier 4', color:'#7a3cc2', accent:'#c9a4f2', glow:'#9a5bff', side:6, slope:3, insets:false, apex:true,  glowA:0.15, milk:0.4 },
  { name:'Tier 5', color:'#f2a312', accent:'#e0700f', glow:'#ffae2a', side:7, slope:4, insets:true,  apex:true,  glowA:0.6,  milk:0.3 },
  { name:'Tier 6', color:'#d3151b', accent:'#ff9a1c', glow:'#ff2a12', side:9, slope:5, insets:true,  apex:true,  glowA:1.0,  milk:0.25 },
];

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const P = () => {
  const o = {};
  for (const id of ['cardH','aspect','bw','ro','at','sd','lead','tex','milk','edge','vary','glowK','rr','ry','rx']) o[id] = parseFloat($(id).value);
  o.win = $('win').value;
  return o;
};
function rng(seed){ let s = seed>>>0 || 1; return () => { s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
function hexToHsl(hex){ const n=parseInt(hex.slice(1),16); let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; }
  return [h,s,l]; }
const hsl = (h,s,l,a=1) => `hsla(${h.toFixed(1)},${(Math.max(0,Math.min(1,s))*100).toFixed(1)}%,${(Math.max(0,Math.min(1,l))*100).toFixed(1)}%,${a})`;
const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];

// ---------- noise textures (built once) ----------
function noiseCanvas(size, gx, gy, octaves, seed, contrast){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(size,size);
  const acc = new Float32Array(size*size); let amp = 1, tot = 0;
  const r = rng(seed);
  for (let o=0;o<octaves;o++){
    const nx = gx<<o, ny = gy<<o; const grid = new Float32Array(nx*ny); for (let i=0;i<grid.length;i++) grid[i]=r();
    for (let y=0;y<size;y++){ const fy=y/size*ny, y0=Math.floor(fy), ty=fy-y0, sy=ty*ty*(3-2*ty);
      for (let x=0;x<size;x++){ const fx=x/size*nx, x0=Math.floor(fx), tx=fx-x0, sx=tx*tx*(3-2*tx);
        const a=grid[(y0%ny)*nx+(x0%nx)], b=grid[(y0%ny)*nx+((x0+1)%nx)], cc=grid[((y0+1)%ny)*nx+(x0%nx)], d=grid[((y0+1)%ny)*nx+((x0+1)%nx)];
        acc[y*size+x] += amp*((a+(b-a)*sx)+((cc+(d-cc)*sx)-(a+(b-a)*sx))*sy); } }
    tot += amp; amp *= 0.5; }
  for (let i=0;i<acc.length;i++){ let v=(acc[i]/tot-0.5)*contrast+0.5; v=Math.max(0,Math.min(1,v))*255; img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=v; img.data[i*4+3]=255; }
  ctx.putImageData(img,0,0); return c;
}
const TEX = {
  streak: noiseCanvas(512, 3, 24, 4, 7, 2.2),   // long streaks
  ripple: noiseCanvas(512, 10, 10, 3, 11, 1.6), // hammered ripple
  cloud:  noiseCanvas(512, 3, 3, 5, 23, 2.6),   // milky opalescent clouds
};

// ---------- geometry ----------
function geometry(W, H, p){
  const bw=p.bw*W, ro=p.ro*H, at=p.at*H, sd=p.sd*H;
  const A=[W/2,0], B=[W,ro], C=[W,H-ro], D=[W/2,H];
  const a=[W/2,at], b=[W-bw,ro+sd], c=[W-bw,H-ro-sd], d=[W/2,H-at];
  return { outer:[A,B,C,D,[0,H-ro],[0,ro]], inner:[a,b,c,d,[bw,H-ro-sd],[bw,ro+sd]],
           regions:[ {k:'top', O:[A,B], I:[a,b]}, {k:'side', O:[B,C], I:[b,c]}, {k:'bot', O:[D,C], I:[d,c]} ] };
}
function weights(n, insets, r, vary){
  const w=[];
  for (let i=0;i<n;i++) w.push(insets ? (i%2===0 ? 1 : 0.55) : 1 + (r()-0.5)*0.35*vary);
  const s=w.reduce((x,y)=>x+y,0); let acc=0; return [0, ...w.map(v=>(acc+=v)/s)];
}
const mirror = (poly, W) => poly.map(([x,y]) => [W-x,y]);
function path(ctx, poly){ ctx.beginPath(); ctx.moveTo(...poly[0]); for (let i=1;i<poly.length;i++) ctx.lineTo(...poly[i]); ctx.closePath(); }
function centroid(poly){ let x=0,y=0; for (const q of poly){x+=q[0];y+=q[1];} return [x/poly.length,y/poly.length]; }

// ---------- glass ----------
function glassPane(ctx, poly, base, seed, p, tier, scale, axisAngle){
  const r = rng(seed); const [h,s,l] = base;
  const v = p.vary;
  const hh = h + (r()-0.5)*8*v, ss = s + (r()-0.5)*0.16*v, ll = l + (r()-0.5)*0.12*v;
  ctx.save(); path(ctx, poly); ctx.clip();
  const [cx,cy] = centroid(poly);
  ctx.fillStyle = hsl(hh,ss,ll); ctx.fillRect(cx-2000,cy-2000,4000,4000);
  // back-light: lighter in the middle of each pane
  const rad = Math.max(...poly.map(q=>Math.hypot(q[0]-cx,q[1]-cy)));
  let g = ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  g.addColorStop(0, hsl(hh, ss*0.95, Math.min(0.93, ll+0.2), 0.75)); g.addColorStop(1, hsl(hh,ss,ll,0));
  ctx.fillStyle = g; ctx.fillRect(cx-rad,cy-rad,2*rad,2*rad);
  // textures, aligned to the pane's long axis
  const texLayer = (canvas, op, alpha, sc) => {
    ctx.save(); ctx.globalCompositeOperation = op; ctx.globalAlpha = alpha;
    ctx.translate(cx,cy); ctx.rotate(axisAngle); ctx.scale(sc*scale, sc*scale);
    ctx.translate(-r()*512, -r()*512);
    ctx.fillStyle = ctx.createPattern(canvas,'repeat'); ctx.fillRect(-1024,-1024,3072,3072);
    ctx.restore(); };
  texLayer(TEX.streak, 'overlay', Math.min(1,0.6*p.tex), 0.5);
  texLayer(TEX.streak, 'soft-light', Math.min(1,0.5*p.tex), 0.22);
  texLayer(TEX.ripple, 'soft-light', 0.6*p.tex, 0.35);
  const milk = p.milk * tier.milk;
  if (milk > 0) texLayer(TEX.cloud, 'screen', 0.45*milk, 0.9);
  // seed bubbles
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(cx+(r()-0.5)*rad, cy+(r()-0.5)*rad, (0.4+r()*0.9)*scale, 0, 7); ctx.fill(); }
  // shade toward the lead
  if (p.edge > 0){ ctx.save(); ctx.filter = `blur(${3*scale}px)`; path(ctx, poly);
    ctx.lineWidth = 9*scale; ctx.strokeStyle = `rgba(0,0,0,${0.55*p.edge})`; ctx.stroke(); ctx.restore(); }
  ctx.restore();
}
function leadStroke(ctx, poly, w){
  path(ctx, poly); ctx.lineJoin='round'; ctx.lineWidth=w; ctx.strokeStyle='#2b2521'; ctx.stroke();
  ctx.lineWidth=w*0.3; ctx.strokeStyle='rgba(150,138,124,0.5)'; ctx.stroke();
}
function diamondIn(poly, k){ // midpoints of a quad's edges, shrunk toward the centre
  const c = centroid(poly); const m = [lerp(poly[0],poly[1],.5), lerp(poly[1],poly[2],.5), lerp(poly[2],poly[3],.5), lerp(poly[3],poly[0],.5)];
  return m.map(q => lerp(c, q, k));
}

// ---------- one card ----------
function drawCard(canvas, tier, ti, p){
  const dpr = window.devicePixelRatio || 1;
  const H = p.cardH, W = Math.round(H*p.aspect), pad = Math.round(H*0.08);
  canvas.width = (W+2*pad)*dpr; canvas.height = (H+2*pad)*dpr;
  canvas.style.width = (W+2*pad)+'px'; canvas.style.height = (H+2*pad)+'px';
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,pad*dpr,pad*dpr);
  const scale = H/420; const G = geometry(W,H,p); const base = hexToHsl(tier.color), acc = hexToHsl(tier.accent);
  const L = p.lead*W*1.8;

  // glow behind
  if (tier.glowA*p.glowK > 0){ ctx.save(); ctx.shadowColor = tier.glow; ctx.fillStyle = tier.glow;
    const passes = Math.ceil(2*tier.glowA*p.glowK);
    for (let i=0;i<passes;i++){ ctx.shadowBlur = H*0.06*tier.glowA*p.glowK; path(ctx, G.outer); ctx.fill(); }
    ctx.restore(); }

  // window
  if (p.win === 'slate'){ path(ctx, G.inner); ctx.fillStyle = '#2b2f36'; ctx.fill(); }

  // panes
  const panes = [], insetPolys = [];
  const rs = rng(1000+ti*97);
  for (const R of G.regions){
    const n = R.k === 'side' ? tier.side : tier.slope;
    const ins = tier.insets && (R.k === 'side' || tier.slope >= 4);
    const t = weights(n, ins, rs, p.vary);
    const ang = Math.atan2(R.O[1][1]-R.O[0][1], R.O[1][0]-R.O[0][0]);
    for (let i=0;i<n;i++){
      const poly = [lerp(R.O[0],R.O[1],t[i]), lerp(R.O[0],R.O[1],t[i+1]), lerp(R.I[0],R.I[1],t[i+1]), lerp(R.I[0],R.I[1],t[i])];
      const seed = ti*1000 + (R.k==='top'?0:R.k==='side'?100:200) + i;
      panes.push({poly, seed, ang}); panes.push({poly: mirror(poly,W), seed: seed+7919, ang: Math.PI-ang, mirrorOf: seed});
      if (ins && i%2===1){ const d = diamondIn(poly, 1.0); insetPolys.push({poly:d, seed:seed+50}); insetPolys.push({poly:mirror(d,W), seed:seed+50}); }
    }
  }
  // colour variation is mirrored: use the same seed for both sides' colour, separate seeds only for texture
  for (const q of panes) glassPane(ctx, q.poly, base, q.mirrorOf ?? q.seed, p, tier, scale, q.ang);
  for (const q of insetPolys) glassPane(ctx, q.poly, acc, q.seed, p, tier, scale, 0);

  // apex diamonds
  const apexPolys = [];
  if (tier.apex){
    const at = p.at*H, w = W*0.07*(ti>=5?1.25:1);
    for (const [y0, y1, sgn] of [[0, at, 1], [H, H-at, -1]]){
      const top = [W/2, y0 + sgn*at*0.10], bot = [W/2, y1 - sgn*at*0.08], mid = (top[1]+bot[1])/2;
      apexPolys.push([top, [W/2+w, mid], bot, [W/2-w, mid]]);
    }
    for (const q of apexPolys) glassPane(ctx, q, acc, 4242+ti, {...p, milk:p.milk*0.6}, tier, scale, Math.PI/2);
  }

  // lead
  for (const q of panes) leadStroke(ctx, q.poly, L);
  for (const q of insetPolys) leadStroke(ctx, q.poly, L*0.85);
  for (const q of apexPolys) leadStroke(ctx, q, L*0.9);
  leadStroke(ctx, G.inner, L*1.5);
  leadStroke(ctx, G.outer, L*1.9);

  // roundels
  const rr = p.rr*W, ry = p.ry*H;
  for (const [x, num] of [[p.rx*W, 3], [W-p.rx*W, 5]]){
    const disc = []; for (let i=0;i<48;i++){ const a=i/48*Math.PI*2; disc.push([x+Math.cos(a)*rr, ry+Math.sin(a)*rr]); }
    glassPane(ctx, disc, hexToHsl('#efe3c8'), 77+num, {...p, vary:0.2, edge:p.edge*0.6}, {milk:1.0}, scale, 0);
    leadStroke(ctx, disc, L*1.3);
    ctx.fillStyle = '#16120f'; ctx.font = `700 ${rr*1.35}px Georgia, 'Times New Roman', serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(num), x, ry+rr*0.06);
  }
}

// ---------- UI ----------
function buildTierControls(){
  const host = $('tiers');
  TIERS.forEach((t,i) => {
    const d = document.createElement('div'); d.className='tier';
    d.innerHTML = `<div class="head"><span>${t.name}</span><span><input type="color" data-k="color" value="${t.color}" title="Glass colour"> <input type="color" data-k="accent" value="${t.accent}" title="Accent colour"></span></div>
      <div class="grid">
        <span>Side panes</span><input type="number" data-k="side" min="1" max="16" value="${t.side}">
        <span>Slope panes</span><input type="number" data-k="slope" min="1" max="10" value="${t.slope}">
        <span>Glow</span><input type="number" data-k="glowA" min="0" max="2" step="0.05" value="${t.glowA}">
        <span>Milky</span><input type="number" data-k="milk" min="0" max="2" step="0.05" value="${t.milk}">
        <span>Insets</span><input type="checkbox" data-k="insets" ${t.insets?'checked':''}>
        <span>Point diamonds</span><input type="checkbox" data-k="apex" ${t.apex?'checked':''}>
      </div>`;
    d.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
      const k = inp.dataset.k;
      t[k] = inp.type==='checkbox' ? inp.checked : inp.type==='color' ? inp.value : parseFloat(inp.value);
      render();
    }));
    host.appendChild(d);
  });
}
function render(){
  const p = P();
  document.querySelectorAll('aside .row').forEach(r => { const i=r.querySelector('input[type=range]'), o=r.querySelector('output'); if(i&&o) o.textContent = i.value; });
  const host = $('drawn');
  if (!host.children.length) TIERS.forEach(t => { const d=document.createElement('div'); d.className='card'; d.innerHTML=`<canvas></canvas><div>${t.name}</div>`; host.appendChild(d); });
  TIERS.forEach((t,i) => drawCard(host.children[i].querySelector('canvas'), t, i, p));
  const ch = $('codex');
  if (!ch.children.length) TIERS.forEach((t,i) => { const d=document.createElement('div'); d.className='card'; d.innerHTML=`<img src="r1b/f2-t${i+1}.jpg" alt="Codex ${t.name}"><div>${t.name}</div>`; ch.appendChild(d); });
  ch.querySelectorAll('img').forEach(img => { img.style.height = Math.round(p.cardH*1536/1450)+'px'; });
}
document.querySelectorAll('aside input, aside select').forEach(i => i.addEventListener('input', render));
// ?shot hides the controls, for screenshots; ?h=<px> sets the card height
const qs = new URLSearchParams(location.search);
if (qs.has('shot')) { document.querySelector('aside').style.display='none'; document.querySelector('header').style.display='none'; }
if (qs.has('h')) $('cardH').value = qs.get('h');
if (qs.get('apex') === '0') TIERS.forEach(t => t.apex = false);
buildTierControls(); render();
if (qs.has('only')) { const k = +qs.get('only');
  [...$('drawn').children].forEach((c,i) => { c.style.display = i===k ? '' : 'none'; c.querySelector('div').style.display='none'; });
  document.querySelectorAll('.sect, #codex').forEach(e => e.style.display='none'); }
</script>
</body>
</html>
