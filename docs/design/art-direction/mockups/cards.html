<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bramble Card Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800;900&family=Alegreya+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="card.css">
<style>
/* A check on the card template: every tier, one- and two-digit numbers, at both screen sizes and at 2x. */
:root{--page:#0d0b09;--text:#efe6d2;--muted:#b9a88c}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--page:#ece4d4;--text:#2b1a0f;--muted:#6b5338}}
:root[data-theme="light"]{--page:#ece4d4;--text:#2b1a0f;--muted:#6b5338}
html,body{margin:0;background:var(--page);color:var(--text);font-family:"Alegreya Sans",system-ui,sans-serif}
body{padding:16px}
h1{font:900 22px Alegreya,Georgia,serif;margin:0 0 4px}
p{margin:0 0 12px;color:var(--muted);font-size:14px}
h2{font:800 16px Alegreya,Georgia,serif;margin:18px 0 6px}
.row{position:relative;display:flex;flex-wrap:wrap;gap:14px;background:#14161a;padding:14px;border-radius:10px;overflow-x:auto}
.row .card{position:relative;flex:none}
</style>
</head>
<body>
<h1>Card sheet</h1>
<p>Each tier's own frame and disc positions (frame-lab/final/roundels.json). Numbers are drawn by the page, not painted. Art: the art recipe's test set.</p>
<div id="rows"></div>
<script src="assets/card-data.js"></script>
<script src="card.js"></script>
<script>
const ART = ["badger-1", "owl-1", "stoat-1", "stag-1", "ooze-1", "fairy-1"];
const NUMS = [[1, 2], [3, 5], [7, 8], [12, 10], [25, 30], [9, 99]];
const SIZES = [[212, "212 px tall (the first mock-up's card height)"], [250, "250 px tall"], [424, "2x 212, for checking the fit"]];
Cards.load().then(() => document.fonts.ready).then(() => {
  const rows = document.getElementById("rows");
  for (const [h, label] of SIZES) {
    const t = document.createElement("h2"); t.textContent = label; rows.append(t);
    const r = document.createElement("div"); r.className = "row"; rows.append(r);
    for (let tier = 1; tier <= 6; tier++) {
      const [a, hp] = NUMS[tier - 1];
      r.append(Cards.make({ tier, art: `assets/art/${ART[tier - 1]}.jpg`, attack: a, health: hp, h }));
    }
  }
});
</script>
</body>
</html>
