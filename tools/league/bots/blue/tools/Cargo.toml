# The blue team's own tools: self-play, weight searches, log analysis. It may use files, threads
# and the harness. It is never scanned by check-crate, never built into the bot and never run in
# a match, and the bot can't reach it. Dependencies: only crates already in the workspace's
# Cargo.lock (ask the referee for more).
[package]
name = "blue-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blue = { path = ".." }
league = { path = "../../../league" }
league-api = { path = "../../../league-api" }
