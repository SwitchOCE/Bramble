[workspace]
members = [
    "bramble-engine",
    "bramble-replay",
    "bramble-fight",
    "league-api",
    "league",
    "bots/registry",
    "bots/examples/clean",
    "bots/examples/testbots",
]
# Planted cheat crates for `league check-crate`; they must never build in this workspace.
exclude = ["bots/examples/cheat-unsafe", "bots/examples/cheat-static", "bots/examples/cheat-include"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
indexmap = "2.12"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
